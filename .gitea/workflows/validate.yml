name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.13'
      - name: Install pinned YAML parser
        run: >-
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes --requirement requirements/ci-yaml.txt
      - name: Validate project
        run: python scripts/validate_project.py
      - name: Test Python syntax
        run: python scripts/test_python_syntax.py
      - name: Test private atomic artifacts
        run: python scripts/test_atomic_file.py
      - name: Test subprocess timeout contract
        run: python scripts/test_subprocess_timeout_contract.py
      - name: Test subprocess output contract
        run: python scripts/test_subprocess_output_contract.py
      - name: Test bounded file input contract
        run: python scripts/test_bounded_file_contract.py
      - name: Test strict JSON parsing contract
        run: python scripts/test_strict_json_contract.py
      - name: Test strict YAML parsing contract
        run: python scripts/test_strict_yaml_contract.py
      - name: Test HTTP transport contract
