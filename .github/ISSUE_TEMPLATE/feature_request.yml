name: Feature request
description: Propose a public-template improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Keep the request public-safe. Do not include customer data, private hostnames, private IPs, credentials, or internal architecture details.
  - type: textarea
    id: problem
    attributes:
      label: Problem or gap
      description: What production, security, operational, or usability gap should this close?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the expected public-template behavior or documentation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include tradeoffs if this changes defaults, profiles, or validation.
  - type: dropdown
    id: impact
    attributes:
      label: Production impact
      options:
        - Documentation only
        - Repository validation only
        - Bootstrap or Ansible behavior
        - GitOps manifests or profiles
        - Security, secrets, or supply chain
        - Operations, alerting, backup, or restore
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Acceptance evidence
      description: What validation, docs, or runbook evidence should prove this is complete?
