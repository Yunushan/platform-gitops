name: Bug report
description: Report a reproducible issue in the public template, docs, validation, or automation.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include real domains, private IPs, credentials, kubeconfigs, customer data, production logs, or private exploit details.
        For vulnerabilities or secret exposure, follow SECURITY.md instead of opening a public issue.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use placeholders or a disposable lab. Keep private deployment details out.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation output
      description: Include safe output from python scripts/run_validation.py, make validate, or focused tests.
      render: text
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Documentation
        - Validation scripts
        - GitOps manifests or profiles
        - Ansible or bootstrap automation
        - Security or secret safety
        - Operations, alerting, backup, or restore guidance
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Safe environment details
      description: Use OS/tool versions only. Do not include private hostnames or IP addresses.
      render: text
