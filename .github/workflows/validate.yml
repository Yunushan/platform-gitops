name: validate
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SEMGREP_IMAGE: semgrep/semgrep:1.171.0@sha256:bdf7013b2c3634a487671158da77c554f531742326b543a9464d2adf6c433ac8
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.13'
      - name: Install checksum-pinned Actionlint
        run: >-
          bash scripts/bootstrap/install-ci-tools.sh
          "${{ runner.temp }}/platform-tools" actionlint
      - name: Validate GitHub Actions workflow schemas
        run: "${{ runner.temp }}/platform-tools/actionlint"
      - name: Install checksum-pinned Kyverno CLI
        run: bash scripts/bootstrap/install-kyverno-cli.sh "${{ runner.temp }}/platform-tools"
      - name: Compile and behavior-test active Kyverno CEL policies
        env:
          KYVERNO_BIN: ${{ runner.temp }}/platform-tools/kyverno
        run: python scripts/verify_active_kyverno_policies.py
      - name: Download Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: Generate SPDX SBOM
        run: |
          mkdir -p rendered/supply-chain
          "${{ steps.syft.outputs.cmd }}" dir:. \
            --exclude ./.git \
            --exclude ./private \
            --exclude ./rendered \
            --exclude ./secrets \
            -o spdx-json=rendered/supply-chain/platform-gitops.spdx.json
          python scripts/verify_supply_chain_evidence.py \
            --sbom rendered/supply-chain/platform-gitops.spdx.json
      - name: Upload SPDX SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-gitops-sbom-${{ github.sha }}
          path: rendered/supply-chain/platform-gitops.spdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Scan Git history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install hash-locked Python validation tools
        run: >-
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes --requirement requirements/ci-yaml.txt --requirement requirements/ci-coverage.txt
      - name: Run Semgrep gate
        run: >-
          docker run --rm
          --network none
          --read-only
          --security-opt no-new-privileges
          --tmpfs /tmp:rw,noexec,nosuid,size=512m
          --env HOME=/tmp
          --volume "${PWD}:/src:ro"
          --workdir /src
          "${SEMGREP_IMAGE}"
          semgrep scan --config .semgrep.yml --error --metrics=off .
      - name: Run Trivy repository gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          scanners: vuln,secret,misconfig
          ignore-unfixed: true
      - name: Install rendered manifest validators
        run: |
          bash scripts/bootstrap/install-ci-tools.sh \
            "${{ runner.temp }}/platform-tools" \
            kustomize helm kubeconform
          echo "${{ runner.temp }}/platform-tools" >> "$GITHUB_PATH"
      - name: Validate rendered Kubernetes schemas
        env:
          PLATFORM_RENDERED_SCHEMA_PROFILES: base,premium-3node
          PLATFORM_RENDERED_SCHEMA_ALLOW_INCOMPLETE: "true"
        run: make rendered-schema-verify
      - name: Validate complete synthetic premium schemas
        run: make rendered-private-schema-verify
      - name: Upload rendered schema reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendered-schema-${{ github.sha }}
          path: |
            rendered/schema-validation
            rendered/synthetic-private-schema/schema-validation
          if-no-files-found: error
          retention-days: 30
      - name: Validate project
        run: python scripts/validate_project.py
      - name: Test Python syntax
        run: python scripts/test_python_syntax.py
      - name: Test private atomic artifacts
        run: python scripts/test_atomic_file.py
      - name: Test subprocess timeout contract
        run: python scripts/test_subprocess_timeout_contract.py
      - name: Test subprocess output contract
        run: python scripts/test_subprocess_output_contract.py
      - name: Test bounded file input contract
        run: python scripts/test_bounded_file_contract.py
      - name: Test strict JSON parsing contract
        run: python scripts/test_strict_json_contract.py
      - name: Test strict YAML parsing contract
        run: python scripts/test_strict_yaml_contract.py
      - name: Test HTTP transport contract
        run: python scripts/test_http_transport_contract.py
      - name: Test validation runner
        run: python scripts/test_validation_runner.py
      - name: Test line endings
        run: python scripts/test_line_endings.py
      - name: Test profile checker
        run: python scripts/test_profile_checker.py
      - name: Test deployable application renderer
        run: python scripts/test_deployable_renderer.py
      - name: Test GitOps selection helper
        run: python scripts/test_gitops_selection_helper.py
      - name: Test bootstrap env loader
        run: python scripts/test_bootstrap_env_loader.py
      - name: Test forge migration helper
        run: python scripts/test_forge_migration.py
      - name: Test GitLab to Forgejo cutover orchestrator
        run: python scripts/test_forge_cutover.py
      - name: Test GitLab/GitHub to Forgejo coexistence transition
        run: python scripts/test_forge_transition.py
      - name: Test forge plan fuzzing contract
        run: python scripts/test_forge_fuzz_contract.py
      - name: Test forge branch-coverage contract
        run: python scripts/test_forge_coverage_contract.py
      - name: Enforce forge subprocess branch coverage
        run: bash scripts/forge-coverage.sh
      - name: Upload forge coverage evidence
        if: always() && hashFiles('rendered/coverage/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forge-coverage-${{ github.sha }}
          path: rendered/coverage
          if-no-files-found: error
          retention-days: 30
      - name: Test live forge migration acceptance contract
        run: python scripts/test_forge_migration_live.py
      - name: Test live forge migration acceptance workflow
        run: python scripts/test_forge_migration_live_workflow.py
      - name: Test private values renderer
        run: python scripts/test_private_values_renderer.py
      - name: Test platform app secret contract
