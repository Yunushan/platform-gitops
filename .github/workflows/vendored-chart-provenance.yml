name: vendored-chart-provenance

on:
  pull_request:
    paths:
      - '.github/workflows/vendored-chart-provenance.yml'
      - 'config/vendored-charts.json'
      - 'gitops/clusters/rke2-main/**/charts/**'
      - 'scripts/atomic_file.py'
      - 'scripts/bounded_file.py'
      - 'scripts/bounded_subprocess.py'
      - 'scripts/strict_json.py'
      - 'scripts/subprocess_timeout.py'
      - 'scripts/test_supply_chain_helpers.py'
      - 'scripts/vendored_chart_inventory.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/vendored-chart-provenance.yml'
      - 'config/vendored-charts.json'
      - 'gitops/clusters/rke2-main/**/charts/**'
      - 'scripts/atomic_file.py'
      - 'scripts/bounded_file.py'
      - 'scripts/bounded_subprocess.py'
      - 'scripts/strict_json.py'
      - 'scripts/subprocess_timeout.py'
      - 'scripts/test_supply_chain_helpers.py'
      - 'scripts/vendored_chart_inventory.py'
  schedule:
    - cron: '23 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vendored-chart-provenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.x'
      - name: Install pinned Helm
        env:
          GOBIN: ${{ runner.temp }}/platform-tools
        run: |
          mkdir -p "$GOBIN"
          go install helm.sh/helm/v3/cmd/helm@v3.21.0
      - name: Verify vendored chart package provenance
        run: >-
          python scripts/vendored_chart_inventory.py
          --verify-upstream
          --helm "${{ runner.temp }}/platform-tools/helm"
