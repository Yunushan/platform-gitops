name: ClusterFuzzLite

on:
  pull_request:
    paths:
      - '.clusterfuzzlite/**'
      - '.github/workflows/fuzz.yml'
      - 'examples/migrations/**'
      - 'scripts/forge_cutover.py'
      - 'scripts/forge_pipeline.py'
      - 'scripts/forge_migration.py'
      - 'scripts/strict_yaml.py'
      - 'scripts/forge_transition.py'
      - 'scripts/fuzz_forge_plans.py'
      - 'requirements/ci-yaml.txt'
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz forge plan parsers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Build address-sanitized fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
      - name: Run fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: ${{ github.event_name == 'pull_request' && '300' || '900' }}
          mode: ${{ github.event_name == 'pull_request' && 'code-change' || 'batch' }}
          sanitizer: address
          output-sarif: true

  prune:
    name: Prune scheduled corpus
    if: github.event_name != 'pull_request'
    needs: fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Build address-sanitized fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
      - name: Prune corpus
        id: prune
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: '300'
          mode: prune
          sanitizer: address
          output-sarif: true
