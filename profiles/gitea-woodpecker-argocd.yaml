profile: gitea-woodpecker-argocd
summary: Replace Forgejo with Gitea while keeping Woodpecker and Argo CD.
components:
  node_os: rocky-linux-10
  git_forge: gitea
  ci: woodpecker
  cd: argocd-ha
  registry: harbor
  database: cloudnativepg
  storage: longhorn
  cni: cilium
  ingress: traefik
includes:
  - gitops/clusters/rke2-main/apps/traefik
  - gitops/clusters/rke2-main/alternatives/gitea
  - gitops/clusters/rke2-main/apps/woodpecker
  - gitops/clusters/rke2-main/apps/argocd-ha
  - gitops/clusters/rke2-main/apps/harbor
