apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-gitlab
  namespace: argocd
spec:
  description: Namespace-scoped GitLab CE and GitLab Runner services
  sourceRepos:
    - <THIS_REPO_URL>
  destinations:
    - namespace: gitlab
      server: https://kubernetes.default.svc
    - namespace: gitlab-runner
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceBlacklist:
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: ApplicationSet
    - group: argoproj.io
      kind: AppProject
  orphanedResources:
    warn: true
