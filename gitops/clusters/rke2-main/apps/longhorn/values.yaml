# Values are intentionally minimal and safe.
# Replace placeholders through private overlays, encrypted secrets, or Argo CD parameterization.
persistence:
  defaultClass: true
  defaultClassReplicaCount: 2
  reclaimPolicy: Retain
  defaultDataLocality: best-effort
  defaultFsType: ext4

defaultSettings:
  defaultDataPath: /var/lib/longhorn
  defaultReplicaCount: 2
  defaultDataLocality: best-effort
  replicaAutoBalance: best-effort
  storageOverProvisioningPercentage: 100
  storageMinimalAvailablePercentage: 25
  orphanResourceAutoDeletion: "replica-data;instance"
  orphanResourceAutoDeletionGracePeriod: 300
  removeSnapshotsDuringFilesystemTrim: false
  autoCleanupSystemGeneratedSnapshot: true
  autoCleanupRecurringJobBackupSnapshot: true
  concurrentAutomaticEngineUpgradePerNodeLimit: 1

longhornManager:
  tolerations:
    - key: node.kubernetes.io/disk-pressure
      operator: Exists
      effect: NoSchedule
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
