# Woodpecker default profile.
# Real OAuth secrets and agent secrets must not be committed.
# This default profile keeps one server because it does not configure a shared
# PostgreSQL datasource. Use the premium-3node profile for PostgreSQL-backed HA.

server:
  enabled: true
  statefulSet:
    replicaCount: 1
  image:
    registry: docker.io
    repository: woodpeckerci/woodpecker-server
    tag: "v3.16.0"
  env:
    WOODPECKER_HOST: https://woodpecker.<PLATFORM_DOMAIN>
    WOODPECKER_OPEN: "false"
    WOODPECKER_FORGEJO: "true"
    WOODPECKER_FORGEJO_URL: https://forgejo.<PLATFORM_DOMAIN>
    WOODPECKER_SERVER_ADDR: ":8000"
    WOODPECKER_GRPC_ADDR: ":9000"
    WOODPECKER_LOG_LEVEL: "info"
    WOODPECKER_DEFAULT_PIPELINE_TIMEOUT: "60"
    WOODPECKER_MAX_PIPELINE_TIMEOUT: "120"
  probes:
    liveness:
      timeoutSeconds: 10
      periodSeconds: 10
      successThreshold: 1
      failureThreshold: 30
    readiness:
      timeoutSeconds: 10
      periodSeconds: 10
      successThreshold: 1
      failureThreshold: 3
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: woodpecker.<PLATFORM_DOMAIN>
        paths:
          - path: /
  persistentVolume:
    enabled: true
    size: <WOODPECKER_DATA_SIZE>
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

agent:
  enabled: true
  replicaCount: 3
  image:
    registry: docker.io
    repository: woodpeckerci/woodpecker-agent
    tag: "v3.16.0"
  env:
    WOODPECKER_BACKEND: kubernetes
    WOODPECKER_BACKEND_K8S_NAMESPACE: woodpecker
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 1Gi
