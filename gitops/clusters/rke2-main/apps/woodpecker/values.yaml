# Woodpecker default profile.
# Real OAuth secrets and agent secrets must not be committed.

server:
  enabled: true
  statefulSet:
    replicaCount: 2
  env:
    WOODPECKER_HOST: https://woodpecker.<PLATFORM_DOMAIN>
    WOODPECKER_OPEN: "false"
    WOODPECKER_FORGEJO: "true"
    WOODPECKER_FORGEJO_URL: https://forgejo.<PLATFORM_DOMAIN>
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: woodpecker.<PLATFORM_DOMAIN>
        paths:
          - path: /
  persistentVolume:
    enabled: true
    size: <WOODPECKER_DATA_SIZE>

agent:
  enabled: true
  replicaCount: 3
  env:
    WOODPECKER_BACKEND: kubernetes
    WOODPECKER_BACKEND_K8S_NAMESPACE: woodpecker
