# Forgejo default profile.
# Configure real domains and secrets outside tracked files.

replicaCount: 1

strategy:
  type: Recreate

podDisruptionBudget:
  minAvailable: 1

image:
  rootless: true
  tag: "15.0.7"

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: forgejo.<PLATFORM_DOMAIN>
      paths:
        - path: /
          pathType: Prefix

postgresql:
  enabled: false

redis-cluster:
  enabled: false

persistence:
  enabled: true
  size: <FORGEJO_DATA_SIZE>

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi

# Database credentials must be supplied through private secret management.
