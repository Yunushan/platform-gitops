deploymentMode: SimpleScalable

loki:
  auth_enabled: true
  commonConfig:
    replication_factor: 3
  limits_config:
    retention_period: 720h
  compactor:
    retention_enabled: true
    delete_request_store: s3
    delete_request_cancel_period: 24h
    retention_delete_delay: 2h
  storage:
    type: s3
    bucketNames:
      chunks: <LOKI_CHUNKS_BUCKET>
      ruler: <LOKI_RULER_BUCKET>
      admin: <LOKI_ADMIN_BUCKET>
    s3:
      endpoint: <OBJECT_STORAGE_ENDPOINT>
      region: <OBJECT_STORAGE_REGION>
      s3ForcePathStyle: true
      insecure: false
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

# Keep all three write replicas while sizing CPU requests for the documented
# three-node premium baseline rather than a larger fleet.
write:
  replicas: 3
  resources:
    requests:
      cpu: 150m
      memory: 1Gi
    limits:
      memory: 2Gi
  persistence:
    # StatefulSet scale-down is also used by guarded storage repair. Retain
    # every claim so healthy higher ordinals cannot be discarded with it.
    enableStatefulSetAutoDeletePVC: false
    storageClass: longhorn-standard-encrypted
    size: <LOKI_WRITE_CACHE_SIZE>

read:
  replicas: 3
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

backend:
  replicas: 3
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 2Gi
  persistence:
    enableStatefulSetAutoDeletePVC: false
    storageClass: longhorn-standard-encrypted
    size: <LOKI_BACKEND_CACHE_SIZE>

gateway:
  enabled: true
  replicas: 3
  basicAuth:
    enabled: true
    existingSecret: loki-gateway-basic-auth
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  nginxConfig:
    # The gateway owns tenant selection. Authenticated callers cannot select
    # another tenant by supplying their own X-Scope-OrgID header.
    locationSnippet: "proxy_set_header X-Scope-OrgID platform;"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - host: loki.<PLATFORM_DOMAIN>
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: loki-tls
        hosts:
          - loki.<PLATFORM_DOMAIN>

# Explicit cache sizes avoid the chart's 8 GiB chunk-cache default. These are
# disposable caches, not retention limits or persistent log storage.
chunksCache:
  allocatedMemory: 512
  allocatedCPU: 100m

resultsCache:
  allocatedMemory: 128
  allocatedCPU: 100m

monitoring:
  serviceMonitor:
    enabled: true

lokiCanary:
  enabled: true
  push: true
  extraArgs:
    - -tenant-id=platform
    - -user=$(LOKI_GATEWAY_USERNAME)
    - -pass=$(LOKI_GATEWAY_PASSWORD)
  extraEnv:
    - name: LOKI_GATEWAY_USERNAME
      valueFrom:
        secretKeyRef:
          name: loki-gateway-basic-auth
          key: username
    - name: LOKI_GATEWAY_PASSWORD
      valueFrom:
        secretKeyRef:
          name: loki-gateway-basic-auth
          key: password
