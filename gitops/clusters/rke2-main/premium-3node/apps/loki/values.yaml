deploymentMode: SimpleScalable

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 3
  storage:
    type: s3
    bucketNames:
      chunks: <LOKI_CHUNKS_BUCKET>
      ruler: <LOKI_RULER_BUCKET>
      admin: <LOKI_ADMIN_BUCKET>
    s3:
      endpoint: <OBJECT_STORAGE_ENDPOINT>
      region: <OBJECT_STORAGE_REGION>
      s3ForcePathStyle: true
      insecure: false
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

write:
  replicas: 3
  persistence:
    storageClass: longhorn-standard
    size: <LOKI_WRITE_CACHE_SIZE>

read:
  replicas: 3

backend:
  replicas: 3
  persistence:
    storageClass: longhorn-standard
    size: <LOKI_BACKEND_CACHE_SIZE>

gateway:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - host: loki.<PLATFORM_DOMAIN>
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: loki-tls
        hosts:
          - loki.<PLATFORM_DOMAIN>

monitoring:
  serviceMonitor:
    enabled: true
