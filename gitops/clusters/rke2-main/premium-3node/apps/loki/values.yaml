deploymentMode: SimpleScalable

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 3
  storage:
    type: s3
    bucketNames:
      chunks: <LOKI_CHUNKS_BUCKET>
      ruler: <LOKI_RULER_BUCKET>
      admin: <LOKI_ADMIN_BUCKET>
    s3:
      endpoint: <OBJECT_STORAGE_ENDPOINT>
      region: <OBJECT_STORAGE_REGION>
      s3ForcePathStyle: true
      insecure: false
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

# Keep all three write replicas while sizing CPU requests for the documented
# three-node premium baseline rather than a larger fleet.
write:
  replicas: 3
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 2Gi
  persistence:
    # StatefulSet scale-down is also used by guarded storage repair. Retain
    # every claim so healthy higher ordinals cannot be discarded with it.
    enableStatefulSetAutoDeletePVC: false
    storageClass: longhorn-standard
    size: <LOKI_WRITE_CACHE_SIZE>

read:
  replicas: 3
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

backend:
  replicas: 3
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 2Gi
  persistence:
    enableStatefulSetAutoDeletePVC: false
    storageClass: longhorn-standard
    size: <LOKI_BACKEND_CACHE_SIZE>

gateway:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - host: loki.<PLATFORM_DOMAIN>
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: loki-tls
        hosts:
          - loki.<PLATFORM_DOMAIN>

monitoring:
  serviceMonitor:
    enabled: true
