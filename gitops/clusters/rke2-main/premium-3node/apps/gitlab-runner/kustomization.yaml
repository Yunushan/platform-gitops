apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - jobs-namespace.yaml
  - jobs-resources.yaml
components:
  - ../../components/network-isolation
  - ../../components/external-web-egress
  - ../../components/external-git-egress
  - ../../components/kubernetes-api-egress
patches:
  - target:
      kind: NetworkPolicy
      labelSelector: app.kubernetes.io/part-of=platform-network-isolation
    patch: |-
      - op: add
        path: /metadata/namespace
        value: gitlab-runner
helmGlobals:
  chartHome: charts/gitlab-runner-0.90.1
helmCharts:
  - name: gitlab-runner
    releaseName: gitlab-runner
    namespace: gitlab-runner
    valuesFile: values.yaml
