apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gitlab-runner
resources:
  - namespace.yaml
components:
  - ../../components/network-isolation
  - ../../components/external-web-egress
  - ../../components/external-git-egress
  - ../../components/kubernetes-api-egress
helmGlobals:
  chartHome: charts/gitlab-runner-0.90.1
helmCharts:
  - name: gitlab-runner
    releaseName: gitlab-runner
    namespace: gitlab-runner
    valuesFile: values.yaml
