apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kyverno
resources:
  - namespace.yaml
helmGlobals:
  chartHome: charts/kyverno-3.8.1
helmCharts:
  - name: kyverno
    version: 3.8.1
    releaseName: kyverno
    namespace: kyverno
    valuesFile: values.yaml
    includeCRDs: true
patches:
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: ".*policies\\.kyverno\\.io"
    patch: |-
      - op: remove
        path: /metadata/labels
