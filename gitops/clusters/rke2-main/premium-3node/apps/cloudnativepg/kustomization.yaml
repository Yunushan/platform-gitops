apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cnpg-system
resources:
  - https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.29/config/crd/bases/postgresql.cnpg.io_backups.yaml
  - https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.29/config/crd/bases/postgresql.cnpg.io_clusterimagecatalogs.yaml
  - https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.29/config/crd/bases/postgresql.cnpg.io_clusters.yaml
  - https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.29/config/crd/bases/postgresql.cnpg.io_databases.yaml
  - https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.29/config/crd/bases/postgresql.cnpg.io_failoverquorums.yaml
  - https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.29/config/crd/bases/postgresql.cnpg.io_imagecatalogs.yaml
  - https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.29/config/crd/bases/postgresql.cnpg.io_poolers.yaml
  - https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.29/config/crd/bases/postgresql.cnpg.io_publications.yaml
  - https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.29/config/crd/bases/postgresql.cnpg.io_scheduledbackups.yaml
  - https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.29/config/crd/bases/postgresql.cnpg.io_subscriptions.yaml
helmCharts:
  - name: cloudnative-pg
    repo: https://cloudnative-pg.github.io/charts
    releaseName: cloudnative-pg
    namespace: cnpg-system
    includeCRDs: true
    valuesFile: values.yaml
