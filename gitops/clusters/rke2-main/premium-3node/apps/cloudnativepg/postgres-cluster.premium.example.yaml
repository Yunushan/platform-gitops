apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: platform-postgres
  namespace: platform-databases
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised
  storage:
    size: <POSTGRES_DATA_SIZE>
    storageClass: longhorn-critical
  monitoring:
    enablePodMonitor: true
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: <CNPG_BACKUP_DESTINATION>
      endpointURL: <OBJECT_STORAGE_ENDPOINT>
      s3Credentials:
        accessKeyId:
          name: cnpg-object-store
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-object-store
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
        maxParallel: 4
      data:
        compression: gzip
        jobs: 2
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: platform-postgres-daily
  namespace: platform-databases
spec:
  schedule: <CNPG_BACKUP_SCHEDULE>
  backupOwnerReference: self
  cluster:
    name: platform-postgres
  method: barmanObjectStore
