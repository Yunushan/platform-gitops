global:
  domain: argocd.<PLATFORM_DOMAIN>

server:
  replicas: 3
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - argocd.<PLATFORM_DOMAIN>
    tls:
      - secretName: argocd-server-tls
        hosts:
          - argocd.<PLATFORM_DOMAIN>
  pdb:
    enabled: true
    minAvailable: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

repoServer:
  replicas: 3
  pdb:
    enabled: true
    minAvailable: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

applicationSet:
  replicas: 2

redis-ha:
  enabled: true

controller:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

configs:
  params:
    server.insecure: true
  cm:
    admin.enabled: "false"
    timeout.reconciliation: 180s
  rbac:
    policy.default: role:readonly
    scopes: "[groups]"
