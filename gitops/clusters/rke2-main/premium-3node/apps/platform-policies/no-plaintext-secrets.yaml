apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-private-secret-workflow
spec:
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  failurePolicy: Fail
  validationActions:
    - Audit
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - cattle-system
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - secrets
  validations:
    - expression: >-
        has(object.metadata.annotations) &&
        'platform.gitops/secret-source' in object.metadata.annotations &&
        object.metadata.annotations['platform.gitops/secret-source'] in
        ['sops', 'external-secrets', 'sealed-secrets', 'vault', 'openbao', 'manual-bootstrap']
      message: Secrets must declare an approved platform.gitops/secret-source annotation.
