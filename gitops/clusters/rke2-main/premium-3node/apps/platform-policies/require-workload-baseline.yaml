apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-workload-baseline
spec:
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  failurePolicy: Fail
  validationActions:
    - Audit
  matchConstraints:
    resourceRules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - deployments
          - statefulsets
          - daemonsets
  validations:
    - expression: >-
        object.spec.template.spec.containers.all(container,
          has(container.resources) &&
          has(container.resources.requests) &&
          'cpu' in container.resources.requests &&
          'memory' in container.resources.requests)
      message: Workloads must set CPU and memory requests for every container.
