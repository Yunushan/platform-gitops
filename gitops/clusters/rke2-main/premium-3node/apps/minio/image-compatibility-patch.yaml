apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: platform-minio
  namespace: object-storage
spec:
  template:
    spec:
      containers:
        - name: minio
          image: docker.io/bitnamilegacy/minio:2025.7.23-debian-12-r3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-minio-console
  namespace: object-storage
spec:
  template:
    spec:
      containers:
        - name: console
          image: docker.io/bitnamilegacy/minio-object-browser:2.0.2-debian-12-r3
