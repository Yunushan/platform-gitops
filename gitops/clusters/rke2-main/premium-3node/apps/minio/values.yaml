# In-cluster S3-compatible object storage for lab/staging and controlled internal
# targets. Keep production disaster-recovery backups replicated off-cluster.
global:
  defaultStorageClass: longhorn-critical

mode: distributed

image:
  # Bitnami's historical community images now live in bitnamilegacy.
  repository: bitnamilegacy/minio
  tag: 2025.7.23-debian-12-r3

console:
  image:
    repository: bitnamilegacy/minio-object-browser
    tag: 2.0.2-debian-12-r3

clientImage:
  repository: bitnamilegacy/minio-client
  tag: 2025.7.21-debian-12-r2

defaultInitContainers:
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell
      tag: 12-debian-12-r50

auth:
  existingSecret: minio-root
  rootUserSecretKey: root-user
  rootPasswordSecretKey: root-password
  forcePassword: true

statefulset:
  podManagementPolicy: Parallel
  replicaCount: 4
  zones: 1
  drivesPerNode: 1

persistence:
  enabled: true
  storageClass: longhorn-critical
  size: 50Gi

networkPolicy:
  enabled: true
  allowExternal: true
  allowExternalEgress: true

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi

metrics:
  enabled: true
  prometheusAuthType: public
  serviceMonitor:
    enabled: true
    namespace: monitoring
    labels:
      release: monitoring

provisioning:
  enabled: true
  buckets:
    - name: platform-loki-chunks
    - name: platform-loki-ruler
    - name: platform-loki-admin
    - name: platform-velero-backups
    - name: platform-cnpg-backups
    - name: platform-longhorn-backups
    - name: platform-harbor-registry
