# Forgejo external database profile rendered by scripts/render_private_platform_values.py.
# Database type is postgres. The premium default uses shared platform
# Valkey for cache/queue; set FORGEJO_REDIS_MODE=memory for dependency-light
# local cache/queue.
replicaCount: 1

strategy:
  type: Recreate

podDisruptionBudget:
  minAvailable: 1

deployment:
  env:
    - name: SSL_CERT_FILE
      value: /data/gitea/git/.postgresql/ca-certificates.crt

image:
  rootless: true
  tag: "15.0.6"

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: forgejo.<PLATFORM_DOMAIN>
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: forgejo-tls
      hosts:
        - forgejo.<PLATFORM_DOMAIN>

postgresql:
  enabled: false

redis-cluster:
  enabled: false

persistence:
  enabled: true
  size: 20Gi
  storageClass: longhorn-critical-encrypted

extraVolumes:
  - name: platform-postgres-ca
    configMap:
      name: platform-internal-roots
      items:
        - key: ca-certificates.crt
          path: root.crt
        - key: ca-certificates.crt
          path: ca-certificates.crt

extraContainerVolumeMounts:
  - name: platform-postgres-ca
    mountPath: /data/gitea/git/.postgresql
    readOnly: true
  - name: platform-postgres-ca
    mountPath: /etc/ssl/platform
    readOnly: true

extraInitVolumeMounts:
  - name: platform-postgres-ca
    mountPath: /data/gitea/git/.postgresql
    readOnly: true

gitea:
  additionalConfigFromEnvs:
    - name: FORGEJO__DATABASE__PASSWD
      valueFrom:
        secretKeyRef:
          name: forgejo-database
          key: password
    - name: FORGEJO__CACHE__HOST
      valueFrom:
        secretKeyRef:
          name: forgejo-redis
          key: uri
    - name: FORGEJO__QUEUE__CONN_STR
      valueFrom:
        secretKeyRef:
          name: forgejo-redis
          key: uri
    - name: FORGEJO__STORAGE__MINIO_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: forgejo-object-storage
          key: access-key-id
    - name: FORGEJO__STORAGE__MINIO_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: forgejo-object-storage
          key: secret-access-key
    - name: FORGEJO__STORAGE_0X2E_MINIO__MINIO_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: forgejo-object-storage
          key: access-key-id
    - name: FORGEJO__STORAGE_0X2E_MINIO__MINIO_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: forgejo-object-storage
          key: secret-access-key
  config:
    server:
      DOMAIN: forgejo.<PLATFORM_DOMAIN>
      ROOT_URL: https://forgejo.<PLATFORM_DOMAIN>/
      SSH_DOMAIN: forgejo.<PLATFORM_DOMAIN>
      START_SSH_SERVER: true
    service:
      DISABLE_REGISTRATION: true
      REQUIRE_SIGNIN_VIEW: true
    repository:
      DEFAULT_BRANCH: main
    database:
      DB_TYPE: postgres
      HOST: platform-postgres-rw.platform-databases.svc.cluster.local:5432
      NAME: forgejo
      USER: forgejo
      SSL_MODE: verify-full
    session:
      PROVIDER: db
    attachment:
      STORAGE_TYPE: minio
    lfs:
      STORAGE_TYPE: minio
    picture:
      AVATAR_STORAGE_TYPE: minio
    'storage.packages':
      STORAGE_TYPE: minio
    storage:
      MINIO_ENDPOINT: platform-minio.object-storage.svc.cluster.local:9000
      MINIO_LOCATION: us-east-1
      MINIO_BUCKET: platform-forgejo
      MINIO_USE_SSL: false
    storage.minio:
      STORAGE_TYPE: minio
      MINIO_ENDPOINT: platform-minio.object-storage.svc.cluster.local:9000
      MINIO_LOCATION: us-east-1
      MINIO_BUCKET: platform-forgejo
      MINIO_USE_SSL: false
    cache:
      ADAPTER: redis
    queue:
      TYPE: redis

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi
