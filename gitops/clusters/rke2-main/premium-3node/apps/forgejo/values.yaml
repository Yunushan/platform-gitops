# Forgejo bootstrap profile rendered by scripts/render_private_platform_values.py.
# This mode uses SQLite and in-process cache/queue so the first dashboard can
# come online before external PostgreSQL and Redis are configured.
replicaCount: 1

strategy:
  type: Recreate

image:
  rootless: true

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: forgejo.<PLATFORM_DOMAIN>
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: forgejo-tls
      hosts:
        - forgejo.<PLATFORM_DOMAIN>

postgresql:
  enabled: false

redis-cluster:
  enabled: false

persistence:
  enabled: true
  size: 20Gi
  storageClass: longhorn-critical

gitea:
  config:
    server:
      DOMAIN: forgejo.<PLATFORM_DOMAIN>
      ROOT_URL: https://forgejo.<PLATFORM_DOMAIN>/
      SSH_DOMAIN: forgejo.<PLATFORM_DOMAIN>
      START_SSH_SERVER: true
    service:
      DISABLE_REGISTRATION: true
      REQUIRE_SIGNIN_VIEW: true
    repository:
      DEFAULT_BRANCH: main
    database:
      DB_TYPE: sqlite3
    session:
      PROVIDER: file
    cache:
      ADAPTER: memory
    queue:
      TYPE: level

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi
