server:
  enabled: true
  replicas: 2
  env:
    WOODPECKER_HOST: https://woodpecker.<PLATFORM_DOMAIN>
    WOODPECKER_OPEN: "false"
    WOODPECKER_FORGEJO: "true"
    WOODPECKER_FORGEJO_URL: https://forgejo.<PLATFORM_DOMAIN>
    WOODPECKER_DATABASE_DRIVER: postgres
    WOODPECKER_DATABASE_DATASOURCE: <WOODPECKER_DATABASE_DSN>
  ingress:
    enabled: true
    className: traefik
    hosts:
      - host: woodpecker.<PLATFORM_DOMAIN>
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: woodpecker-tls
        hosts:
          - woodpecker.<PLATFORM_DOMAIN>
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

agent:
  enabled: true
  replicas: 3
  backend: kubernetes
  env:
    WOODPECKER_MAX_WORKFLOWS: "2"
    WOODPECKER_BACKEND_K8S_NAMESPACE: woodpecker
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 1Gi

persistentVolume:
  enabled: true
  size: <WOODPECKER_DATA_SIZE>
  storageClass: longhorn-standard
