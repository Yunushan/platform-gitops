# Woodpecker premium profile.
# Uses PostgreSQL-backed state so multiple Woodpecker server replicas can run safely.
# For Forgejo login, create the OAuth app in Forgejo and store its client/secret in
# the woodpecker-forgejo-oauth Kubernetes secret before syncing this app.
# Run make platform-app-secrets with WOODPECKER_DATABASE_DATASOURCE before syncing
# so secret/woodpecker-database exists.
server:
  enabled: true
  statefulSet:
    replicaCount: 3
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: server
              app.kubernetes.io/instance: woodpecker
          topologyKey: kubernetes.io/hostname
  image:
    registry: docker.io
    repository: woodpeckerci/woodpecker-server
    tag: "v3.16.0"
  env:
    WOODPECKER_ADMIN: "admin"
    WOODPECKER_HOST: https://woodpecker.<PLATFORM_DOMAIN>
    WOODPECKER_OPEN: "false"
    WOODPECKER_FORGEJO: "true"
    WOODPECKER_FORGEJO_URL: https://forgejo.<PLATFORM_DOMAIN>
    WOODPECKER_DATABASE_DRIVER: "postgres"
    WOODPECKER_SERVER_ADDR: ":8000"
    WOODPECKER_GRPC_ADDR: ":9000"
    WOODPECKER_LOG_LEVEL: "info"
    WOODPECKER_DEFAULT_PIPELINE_TIMEOUT: "60"
    WOODPECKER_MAX_PIPELINE_TIMEOUT: "120"
  probes:
    liveness:
      timeoutSeconds: 10
      periodSeconds: 10
      successThreshold: 1
      failureThreshold: 30
    readiness:
      timeoutSeconds: 10
      periodSeconds: 10
      successThreshold: 1
      failureThreshold: 3
  extraSecretNamesForEnvFrom:
    - woodpecker-agent-secret
    - woodpecker-forgejo-oauth
    - woodpecker-database
  extraVolumes:
    - name: platform-postgres-ca
      configMap:
        name: platform-internal-roots
        items:
          - key: ca-certificates.crt
            path: ca-certificates.crt
  extraVolumeMounts:
    - name: platform-postgres-ca
      mountPath: /etc/ssl/platform-postgres
      readOnly: true
  createAgentSecret: false
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: woodpecker.<PLATFORM_DOMAIN>
        paths:
          - path: /
    tls:
      - secretName: woodpecker-tls
        hosts:
          - woodpecker.<PLATFORM_DOMAIN>
  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: longhorn-standard-encrypted
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

agent:
  enabled: true
  replicaCount: 3
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: agent
              app.kubernetes.io/instance: woodpecker
          topologyKey: kubernetes.io/hostname
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: agent
          app.kubernetes.io/instance: woodpecker
  mapAgentSecret: false
  extraSecretNamesForEnvFrom:
    - woodpecker-agent-secret
  image:
    registry: docker.io
    repository: woodpeckerci/woodpecker-agent
    tag: "v3.16.0"
  env:
    WOODPECKER_BACKEND: kubernetes
    WOODPECKER_BACKEND_K8S_NAMESPACE: woodpecker
    WOODPECKER_BACKEND_K8S_STORAGE_CLASS: longhorn-standard-encrypted
    WOODPECKER_BACKEND_K8S_VOLUME_SIZE: 10G
    WOODPECKER_BACKEND_K8S_STORAGE_RWX: "false"
    WOODPECKER_MAX_WORKFLOWS: "2"
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 1Gi
