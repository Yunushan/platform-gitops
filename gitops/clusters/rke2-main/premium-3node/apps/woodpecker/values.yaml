server:
  enabled: true
  statefulSet:
    replicaCount: 2
  env:
    WOODPECKER_HOST: https://woodpecker.<PLATFORM_DOMAIN>
    WOODPECKER_OPEN: "false"
    WOODPECKER_FORGEJO: "true"
    WOODPECKER_FORGEJO_URL: https://forgejo.<PLATFORM_DOMAIN>
    WOODPECKER_DATABASE_DRIVER: postgres
    WOODPECKER_DATABASE_DATASOURCE: <WOODPECKER_DATABASE_DSN>
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: woodpecker.<PLATFORM_DOMAIN>
        paths:
          - path: /
    tls:
      - secretName: woodpecker-tls
        hosts:
          - woodpecker.<PLATFORM_DOMAIN>
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  persistentVolume:
    enabled: true
    size: <WOODPECKER_DATA_SIZE>
    storageClass: longhorn-standard

agent:
  enabled: true
  replicaCount: 3
  env:
    WOODPECKER_BACKEND: kubernetes
    WOODPECKER_MAX_WORKFLOWS: "2"
    WOODPECKER_BACKEND_K8S_NAMESPACE: woodpecker
    WOODPECKER_BACKEND_K8S_STORAGE_CLASS: longhorn-standard
    WOODPECKER_BACKEND_K8S_VOLUME_SIZE: 10G
    WOODPECKER_BACKEND_K8S_STORAGE_RWX: "false"
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 1Gi
