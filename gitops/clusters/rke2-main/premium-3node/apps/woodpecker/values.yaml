# Woodpecker bootstrap profile rendered by scripts/render_private_platform_values.py.
# Uses single-server SQLite so CI can come online before external PostgreSQL is configured.
# For Forgejo login, create the OAuth app in Forgejo and store its client/secret in
# the woodpecker-forgejo-oauth Kubernetes secret before syncing this app.
server:
  enabled: true
  statefulSet:
    replicaCount: 1
  env:
    WOODPECKER_ADMIN: "admin"
    WOODPECKER_HOST: https://woodpecker.<PLATFORM_DOMAIN>
    WOODPECKER_OPEN: "false"
    WOODPECKER_FORGEJO: "true"
    WOODPECKER_FORGEJO_URL: https://forgejo.<PLATFORM_DOMAIN>
  extraSecretNamesForEnvFrom:
    - woodpecker-forgejo-oauth
  createAgentSecret: true
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: woodpecker.<PLATFORM_DOMAIN>
        paths:
          - path: /
    tls:
      - secretName: woodpecker-tls
        hosts:
          - woodpecker.<PLATFORM_DOMAIN>
  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: longhorn-standard
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

agent:
  enabled: true
  replicaCount: 3
  env:
    WOODPECKER_BACKEND: kubernetes
    WOODPECKER_BACKEND_K8S_NAMESPACE: woodpecker
    WOODPECKER_BACKEND_K8S_STORAGE_CLASS: longhorn-standard
    WOODPECKER_BACKEND_K8S_VOLUME_SIZE: 10G
    WOODPECKER_BACKEND_K8S_STORAGE_RWX: "false"
    WOODPECKER_MAX_WORKFLOWS: "2"
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 1Gi
