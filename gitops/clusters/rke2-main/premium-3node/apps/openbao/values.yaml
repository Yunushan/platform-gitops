# OpenBao is installed as an internal HA secret-management backend.
# Initialization, unseal, auth methods, and policies remain an operational
# ceremony and should be backed by an external KMS/HSM process before production.
global:
  tlsDisable: false

injector:
  enabled: true
  replicas: 2
  metrics:
    enabled: true
  webhook:
    # Injection is fail-closed only for namespaces that explicitly opt in.
    # This prevents an unavailable optional injector from blocking platform
    # control-plane and application pod creation.
    failurePolicy: Fail
    namespaceSelector:
      matchLabels:
        platform.gitops/openbao-injection: "enabled"
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-node-lease
            - kube-public
            - kube-system
            - openbao
  podDisruptionBudget:
    minAvailable: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

server:
  enabled: true
  logLevel: info
  logFormat: standard
  shareProcessNamespace: true
  extraEnvironmentVars:
    BAO_CACERT: /openbao/tls/ca.crt
    BAO_TLSCERT: /openbao/tls/tls.crt
    BAO_TLSKEY: /openbao/tls/tls.key
  volumes:
    - name: openbao-server-tls
      secret:
        secretName: openbao-server-tls
        defaultMode: 0440
  volumeMounts:
    - name: openbao-server-tls
      mountPath: /openbao/tls
      readOnly: true
  extraContainers:
    - name: certificate-reloader
      image: quay.io/openbao/openbao:2.5.4
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -ec
      args:
        - |
          certificate=/openbao/tls/tls.crt
          previous="$(cksum "${certificate}")"
          while sleep 60; do
            current="$(cksum "${certificate}")"
            [ "${current}" = "${previous}" ] && continue
            reloaded=false
            for process in /proc/[0-9]*; do
              [ -r "${process}/comm" ] || continue
              if [ "$(cat "${process}/comm")" = "bao" ]; then
                kill -HUP "${process#/proc/}"
                reloaded=true
              fi
            done
            if [ "${reloaded}" != "true" ]; then
              echo "OpenBao process was not found for certificate reload" >&2
              exit 1
            fi
            previous="${current}"
          done
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
      volumeMounts:
        - name: openbao-server-tls
          mountPath: /openbao/tls
          readOnly: true
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  statefulSet:
    securityContext:
      container:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  dataStorage:
    enabled: true
    size: 20Gi
    storageClass: longhorn-critical-encrypted
    accessMode: ReadWriteOnce
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
  auditStorage:
    enabled: true
    size: 10Gi
    storageClass: longhorn-critical-encrypted
    accessMode: ReadWriteOnce
  standalone:
    enabled: false
  ha:
    enabled: true
    replicas: 3
    apiAddr: https://$(HOSTNAME).openbao-internal.openbao.svc.cluster.local:8200
    clusterAddr: https://$(HOSTNAME).openbao-internal.openbao.svc.cluster.local:8201
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_cert_file = "/openbao/tls/tls.crt"
          tls_key_file = "/openbao/tls/tls.key"
          tls_client_ca_file = "/openbao/tls/ca.crt"
          tls_min_version = "tls12"
          tls_max_version = "tls13"
          telemetry {
            unauthenticated_metrics_access = "true"
          }
        }

        storage "raft" {
          path = "/openbao/data"
        }

        service_registration "kubernetes" {}

        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname = true
        }
  disruptionBudget:
    enabled: true
    maxUnavailable: 1
  service:
    enabled: true
    type: ClusterIP
  ui:
    enabled: true
    serviceType: ClusterIP

serverTelemetry:
  serviceMonitor:
    enabled: true
    selectors:
      release: monitoring
    tlsConfig:
      ca:
        configMap:
          name: platform-internal-roots
          key: ca-certificates.crt
      serverName: openbao.openbao.svc.cluster.local
  prometheusRules:
    enabled: false
  grafanaDashboard:
    enabled: true
    namespace: monitoring
    extraLabel:
      release: monitoring
