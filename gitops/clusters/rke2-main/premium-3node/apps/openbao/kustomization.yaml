apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openbao
components:
  - ../../components/network-isolation
  - ../../components/external-web-egress
  - ../../components/kubernetes-api-egress
resources:
  - namespace.yaml
  - server-certificate.yaml
helmCharts:
  - name: openbao
    version: 0.28.3
    repo: https://openbao.github.io/openbao-helm
    releaseName: openbao
    namespace: openbao
    valuesFile: values.yaml
patches:
  - path: injector-ca-patch.yaml
