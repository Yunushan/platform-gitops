apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openbao
components:
  - ../../components/network-isolation
  - ../../components/external-web-egress
  - ../../components/kubernetes-api-egress
resources:
  - namespace.yaml
  - server-certificate.yaml
helmGlobals:
  chartHome: charts/openbao-0.28.3
helmCharts:
  - name: openbao
    releaseName: openbao
    namespace: openbao
    valuesFile: values.yaml
patches:
  - path: injector-ca-patch.yaml
