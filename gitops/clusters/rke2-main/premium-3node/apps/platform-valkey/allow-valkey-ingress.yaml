apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-allow-valkey-clients
  labels:
    app.kubernetes.io/part-of: platform-network-isolation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: platform-valkey
      app.kubernetes.io/name: valkey
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: harbor
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo
      ports:
        - protocol: TCP
          port: 6380
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-cache
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: platform-valkey
              app.kubernetes.io/name: valkey
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 26379
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9121
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-cache
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: platform-valkey
              app.kubernetes.io/name: valkey
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 26379
