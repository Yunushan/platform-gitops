# Shared platform Valkey HA profile rendered by scripts/render_private_platform_values.py.
# Argo CD keeps its own dedicated Redis/Redis HA; this cache is for platform
# applications such as Forgejo and Harbor.
global:
  defaultStorageClass: longhorn-critical

architecture: replication

auth:
  enabled: true
  sentinel: true
  existingSecret: platform-valkey-auth
  existingSecretPasswordKey: valkey-password

commonConfiguration: |-
  appendonly yes
  save ""

primary:
  persistence:
    enabled: true
    storageClass: longhorn-critical
    size: 8Gi
  podAntiAffinityPreset: soft
  pdb:
    create: true
    minAvailable: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

replica:
  replicaCount: 3
  persistence:
    enabled: true
    storageClass: longhorn-critical
    size: 8Gi
  podAntiAffinityPreset: hard
  pdb:
    create: true
    minAvailable: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

sentinel:
  enabled: true
  primarySet: platform-primary
  quorum: 2
  service:
    createPrimary: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

rbac:
  create: true

networkPolicy:
  enabled: true
  allowExternal: true

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring
    additionalLabels:
      release: monitoring

