# Shared platform Valkey profile rendered by scripts/render_private_platform_values.py.
# Argo CD keeps its dedicated Redis HA; this cache is for Forgejo and Harbor.
fullnameOverride: platform-valkey

auth:
  enabled: true
  usersExistingSecret: platform-valkey-auth
  aclUsers:
    default:
      passwordKey: valkey-password
      permissions: "~* &* +@all"

valkeyConfig: |-
  appendonly yes
  save ""

service:
  type: ClusterIP
  port: 6379

replica:
  enabled: true
  # One primary plus two replicas gives three cache members, one per node.
  replicas: 2
  minReplicasToWrite: 1
  persistence:
    storageClass: longhorn-critical
    size: 8Gi

podDisruptionBudget:
  enabled: true
  minAvailable: 2

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/instance: platform-valkey
        app.kubernetes.io/name: valkey

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

metrics:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  serviceMonitor:
    enabled: true
    namespace: monitoring
    additionalLabels:
      release: monitoring
