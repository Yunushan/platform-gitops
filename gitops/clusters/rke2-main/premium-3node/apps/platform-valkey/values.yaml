# Shared platform Valkey profile rendered by scripts/render_private_platform_values.py.
# Argo CD keeps its dedicated Redis HA; this cache is for Forgejo and Harbor.
fullnameOverride: platform-valkey

image:
  tag: "9.1.0"

auth:
  enabled: true
  usersExistingSecret: platform-valkey-auth
  aclUsers:
    default:
      passwordKey: valkey-password
      permissions: "~* &* +@all"

tls:
  enabled: true
  existingSecret: platform-valkey-tls
  serverPublicKey: tls.crt
  serverKey: tls.key
  caPublicKey: ca.crt
  requireClientCertificate: false

valkeyConfig: |-
  appendonly yes
  appendfsync everysec
  aof-use-rdb-preamble yes
  save ""
  tls-auto-reload-interval 300

service:
  type: ClusterIP
  port: 6379

replica:
  enabled: true
  # One primary plus two replicas gives three cache members, one per node.
  replicas: 2
  minReplicasToWrite: 1
  persistence:
    storageClass: longhorn-critical-encrypted
    size: 8Gi

# The upstream chart provides replication but intentionally does not perform
# failover. Persistent Sentinel sidecars elect a replacement primary, while
# the HAProxy sidecars expose only whichever Valkey member currently reports
# role:master. Consumers keep using platform-valkey-primary:6379.
extraInitContainers:
  - name: configure-ha
    image: valkey/valkey:9.1.0
    imagePullPolicy: IfNotPresent
    command: ["/bin/sh", "-ec"]
    args:
      - |-
        password="$(cat /auth/valkey-password)"
        case "${password}" in
          *[!A-Za-z0-9._~-]*)
            echo "platform-valkey-auth must use URL-safe characters for the HA proxy check" >&2
            exit 1
            ;;
        esac

        sentinel_dir=/data/sentinel
        sentinel_config="${sentinel_dir}/sentinel.conf"
        mkdir -p "${sentinel_dir}" /ha

        # Sentinel rewrites this persistent file after elections. Preserve its
        # dynamic topology while replacing transport and credential settings.
        sentinel_body="$(mktemp "${sentinel_dir}/sentinel.conf.body.XXXXXX")"
        if [ -s "${sentinel_config}" ]; then
          awk '
            $1 == "port" || $1 == "tls-port" ||
            $1 == "tls-cert-file" || $1 == "tls-key-file" ||
            $1 == "tls-ca-cert-file" || $1 == "tls-auth-clients" ||
            $1 == "tls-replication" || $1 == "tls-auto-reload-interval" ||
            $1 == "bind" || $1 == "protected-mode" || $1 == "dir" ||
            $1 == "requirepass" { next }
            $1 == "sentinel" &&
              ($2 == "resolve-hostnames" || $2 == "announce-hostnames") { next }
            $1 == "sentinel" && $3 == "platform-valkey" &&
              ($2 == "auth-user" || $2 == "auth-pass" ||
               $2 == "down-after-milliseconds" || $2 == "failover-timeout" ||
               $2 == "parallel-syncs") { next }
            { print }
          ' "${sentinel_config}" >"${sentinel_body}"
        else
          : >"${sentinel_body}"
        fi
        if ! awk '$1 == "sentinel" && $2 == "monitor" && $3 == "platform-valkey" { found=1 } END { exit !found }' \
          "${sentinel_body}"; then
          echo "sentinel monitor platform-valkey platform-valkey-0.platform-valkey-headless.platform-cache.svc.cluster.local 6379 2" \
            >>"${sentinel_body}"
        fi

        cat >"${sentinel_config}" <<EOF
        port 0
        tls-port 26379
        tls-cert-file /tls/tls.crt
        tls-key-file /tls/tls.key
        tls-ca-cert-file /tls/ca.crt
        tls-auth-clients no
        tls-replication yes
        tls-auto-reload-interval 300
        bind 0.0.0.0
        protected-mode no
        dir ${sentinel_dir}
        requirepass "${password}"
        sentinel resolve-hostnames yes
        sentinel announce-hostnames yes
        EOF
        cat "${sentinel_body}" >>"${sentinel_config}"
        cat >>"${sentinel_config}" <<EOF
        sentinel auth-user platform-valkey default
        sentinel auth-pass platform-valkey "${password}"
        sentinel down-after-milliseconds platform-valkey 5000
        sentinel failover-timeout platform-valkey 60000
        sentinel parallel-syncs platform-valkey 1
        EOF
        rm -f "${sentinel_body}"
        chmod 0600 "${sentinel_config}"

        cat > /ha/haproxy.cfg <<EOF
        global
          log stdout format raw local0

        defaults
          mode tcp
          log global
          timeout connect 3s
          timeout client 60s
          timeout server 60s
          timeout check 3s

        resolvers kubernetes
          parse-resolv-conf
          hold valid 10s

        frontend valkey-primary
          bind :6380
          default_backend elected-primary

        backend elected-primary
          option tcp-check
          tcp-check connect default
          tcp-check send "AUTH default ${password}\r\n"
          tcp-check expect string +OK
          tcp-check send "INFO replication\r\n"
          tcp-check expect string role:master
          tcp-check send "QUIT\r\n"
          server valkey-0 platform-valkey-0.platform-valkey-headless.platform-cache.svc.cluster.local:6379 check check-ssl check-sni platform-valkey-0.platform-valkey-headless.platform-cache.svc.cluster.local verify required verifyhost platform-valkey-0.platform-valkey-headless.platform-cache.svc.cluster.local ca-file /trust/ca-certificates.crt inter 1s fall 2 rise 1 resolvers kubernetes init-addr libc,none
          server valkey-1 platform-valkey-1.platform-valkey-headless.platform-cache.svc.cluster.local:6379 check check-ssl check-sni platform-valkey-1.platform-valkey-headless.platform-cache.svc.cluster.local verify required verifyhost platform-valkey-1.platform-valkey-headless.platform-cache.svc.cluster.local ca-file /trust/ca-certificates.crt inter 1s fall 2 rise 1 resolvers kubernetes init-addr libc,none
          server valkey-2 platform-valkey-2.platform-valkey-headless.platform-cache.svc.cluster.local:6379 check check-ssl check-sni platform-valkey-2.platform-valkey-headless.platform-cache.svc.cluster.local verify required verifyhost platform-valkey-2.platform-valkey-headless.platform-cache.svc.cluster.local ca-file /trust/ca-certificates.crt inter 1s fall 2 rise 1 resolvers kubernetes init-addr libc,none
        EOF
        chmod 0440 /ha/haproxy.cfg
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
    volumeMounts:
      - name: valkey-data
        mountPath: /data
      - name: valkey-users-secret
        mountPath: /auth
        readOnly: true
      - name: platform-valkey-ha-config
        mountPath: /ha

extraContainers:
  - name: sentinel
    image: valkey/valkey:9.1.0
    imagePullPolicy: IfNotPresent
    command: ["valkey-server", "/data/sentinel/sentinel.conf", "--sentinel"]
    ports:
      - name: sentinel
        containerPort: 26379
        protocol: TCP
    readinessProbe:
      exec:
        command:
          - /bin/sh
          - -ec
          - valkey-cli --tls --cacert /tls/ca.crt -h localhost --user default --no-auth-warning -a "$(cat /auth/valkey-password)" -p 26379 ping | grep -qx PONG
      periodSeconds: 5
      timeoutSeconds: 3
    livenessProbe:
      exec:
        command:
          - /bin/sh
          - -ec
          - valkey-cli --tls --cacert /tls/ca.crt -h localhost --user default --no-auth-warning -a "$(cat /auth/valkey-password)" -p 26379 ping | grep -qx PONG
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
    volumeMounts:
      - name: valkey-data
        mountPath: /data
      - name: valkey-users-secret
        mountPath: /auth
        readOnly: true
      - name: platform-valkey-tls
        mountPath: /tls
        readOnly: true
  - name: primary-proxy
    image: haproxy:3.4.2-alpine
    imagePullPolicy: IfNotPresent
    args: ["haproxy", "-W", "-db", "-f", "/ha/haproxy.cfg"]
    ports:
      - name: primary-proxy
        containerPort: 6380
        protocol: TCP
    readinessProbe:
      tcpSocket:
        port: primary-proxy
      periodSeconds: 5
      timeoutSeconds: 2
    livenessProbe:
      tcpSocket:
        port: primary-proxy
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 2
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 99
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        memory: 128Mi
    volumeMounts:
      - name: platform-valkey-ha-config
        mountPath: /ha
        readOnly: true
      - name: platform-internal-roots
        mountPath: /trust
        readOnly: true

extraVolumes:
  - name: platform-valkey-ha-config
    emptyDir: {}
  - name: platform-internal-roots
    configMap:
      name: platform-internal-roots

podDisruptionBudget:
  enabled: true
  minAvailable: 2

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/instance: platform-valkey
        app.kubernetes.io/name: valkey

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

metrics:
  enabled: true
  exporter:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    extraVolumeMounts:
      - name: platform-internal-roots
        mountPath: /trust
        readOnly: true
    extraEnvs:
      REDIS_ADDR: rediss://localhost:6379
      REDIS_USER: default
      REDIS_EXPORTER_TLS_CA_CERT_FILE: /trust/ca-certificates.crt
      REDIS_EXPORTER_SKIP_TLS_VERIFICATION: "false"
  serviceMonitor:
    enabled: true
    namespace: monitoring
    additionalLabels:
      release: monitoring
