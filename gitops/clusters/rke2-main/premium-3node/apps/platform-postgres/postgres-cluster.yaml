apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: platform-postgres
  namespace: platform-databases
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
      secret:
        name: forgejo-database
  storage:
    size: 50Gi
    storageClass: longhorn-critical
  monitoring:
    enablePodMonitor: true
  backup:
    retentionPolicy: <CNPG_RETENTION_POLICY>
    barmanObjectStore:
      destinationPath: <CNPG_BACKUP_DESTINATION>
      endpointURL: <BACKUP_OBJECT_STORAGE_ENDPOINT>
      s3Credentials:
        accessKeyId:
          name: <CNPG_OBJECT_STORE_SECRET_NAME>
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: <CNPG_OBJECT_STORE_SECRET_NAME>
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
        jobs: 2
  managed:
    roles:
      - name: keycloak
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: keycloak-database
      - name: woodpecker
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: woodpecker-database
      - name: harbor
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: harbor-database
      - name: grafana
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: grafana-database
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: platform-postgres-daily
  namespace: platform-databases
spec:
  schedule: <CNPG_BACKUP_SCHEDULE>
  backupOwnerReference: self
  cluster:
    name: platform-postgres
  method: barmanObjectStore
