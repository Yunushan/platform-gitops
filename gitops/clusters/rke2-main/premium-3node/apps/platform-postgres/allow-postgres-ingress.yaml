apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-allow-postgres-clients
  labels:
    app.kubernetes.io/part-of: platform-network-isolation
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: platform-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - forgejo
                  - harbor
                  - keycloak
                  - monitoring
                  - woodpecker
                  - cnpg-system
      ports:
        - protocol: TCP
          port: 5432
