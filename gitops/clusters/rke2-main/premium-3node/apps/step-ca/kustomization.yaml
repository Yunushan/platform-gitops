apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: step-ca
resources:
  - namespace.yaml
components:
  - ../../components/network-isolation
  - ../../components/external-web-egress
helmCharts:
  - name: step-certificates
    version: 1.30.1
    repo: https://smallstep.github.io/helm-charts/
    releaseName: step-ca
    namespace: step-ca
    valuesFile: values.yaml
