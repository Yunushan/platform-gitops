crds:
  enabled: true

# Monitoring bootstrap profile rendered by scripts/render_private_platform_values.py.
# Uses persistent Grafana SQLite for first deployment. Switch Grafana to external
# PostgreSQL for long-term HA.
prometheus:
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - prometheus.<PLATFORM_DOMAIN>
    tls:
      - secretName: prometheus-tls
        hosts:
          - prometheus.<PLATFORM_DOMAIN>
  prometheusSpec:
    replicas: 2
    retention: 15d
    retentionSize: 20GB
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-standard
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 3
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-standard
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

grafana:
  replicas: 1
  persistence:
    enabled: true
    type: pvc
    storageClassName: longhorn-standard
    accessModes:
      - ReadWriteOnce
    size: 10Gi
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.<PLATFORM_DOMAIN>
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.<PLATFORM_DOMAIN>

defaultRules:
  create: true

kubeEtcd:
  enabled: true

kubeScheduler:
  enabled: true

kubeControllerManager:
  enabled: true
