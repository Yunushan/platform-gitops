crds:
  enabled: true

# Monitoring premium profile rendered by scripts/render_private_platform_values.py.
# Grafana stores durable state in the shared CloudNativePG cluster.
prometheus:
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  ingress:
    # The private renderer replaces this with an OAuth2 Proxy ingress.
    # Never expose Prometheus directly from the premium profile.
    enabled: false
    ingressClassName: traefik
    hosts:
      - prometheus.<PLATFORM_DOMAIN>
    tls:
      - secretName: prometheus-tls
        hosts:
          - prometheus.<PLATFORM_DOMAIN>
  prometheusSpec:
    replicas: 2
    podAntiAffinity: hard
    podAntiAffinityTopologyKey: kubernetes.io/hostname
    retention: 15d
    retentionSize: 20GB
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 250m
        memory: 2Gi
      limits:
        memory: 4Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-standard-encrypted
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi

alertmanager:
  enabled: true
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  alertmanagerSpec:
    useExistingSecret: true
    configSecret: alertmanager-platform-config
    replicas: 3
    podAntiAffinity: hard
    podAntiAffinityTopologyKey: kubernetes.io/hostname
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-standard-encrypted
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

grafana:
  replicas: 2
  deploymentStrategy:
    type: RollingUpdate
  podDisruptionBudget:
    minAvailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  envValueFrom:
    GF_DATABASE_PASSWORD:
      secretKeyRef:
        name: grafana-database
        key: password
    LOKI_GATEWAY_USERNAME:
      secretKeyRef:
        name: platform-loki-client
        key: username
    LOKI_GATEWAY_PASSWORD:
      secretKeyRef:
        name: platform-loki-client
        key: password
  envFromSecret: platform-sso-grafana
  grafana.ini:
    database:
      type: postgres
      host: platform-postgres-rw.platform-databases.svc.cluster.local:5432
      name: grafana
      user: grafana
      password: $__env{GF_DATABASE_PASSWORD}
      ssl_mode: verify-full
      ca_cert_path: /etc/ssl/platform-postgres/ca-certificates.crt
    server:
      root_url: https://grafana.<PLATFORM_DOMAIN>
    auth:
      # Local Grafana passwords must not bypass the central identity provider.
      disable_login_form: true
      oauth_auto_login: true
    auth.generic_oauth:
      enabled: true
      name: Platform SSO
      allow_sign_up: true
      client_id: grafana
      client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
      scopes: openid profile email groups
      auth_url: https://sso.<PLATFORM_DOMAIN>/realms/platform/protocol/openid-connect/auth
      token_url: https://sso.<PLATFORM_DOMAIN>/realms/platform/protocol/openid-connect/token
      api_url: https://sso.<PLATFORM_DOMAIN>/realms/platform/protocol/openid-connect/userinfo
      use_pkce: true
      use_refresh_token: true
      login_attribute_path: preferred_username
      email_attribute_path: email
      role_attribute_path: "contains(groups[*], 'platform-admin') && 'GrafanaAdmin' || 'Viewer'"
      role_attribute_strict: true
      allow_assign_grafana_admin: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  persistence:
    enabled: false
  extraConfigmapMounts:
    - name: platform-postgres-ca
      mountPath: /etc/ssl/platform-postgres
      configMap: platform-internal-roots
      readOnly: true
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki-gateway.logging.svc.cluster.local
      basicAuth: true
      basicAuthUser: $__env{LOKI_GATEWAY_USERNAME}
      editable: false
      jsonData:
        httpHeaderName1: X-Scope-OrgID
      secureJsonData:
        basicAuthPassword: $__env{LOKI_GATEWAY_PASSWORD}
        httpHeaderValue1: platform
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.<PLATFORM_DOMAIN>
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.<PLATFORM_DOMAIN>

defaultRules:
  create: true

kubeEtcd:
  enabled: true

kubeScheduler:
  enabled: true

kubeControllerManager:
  enabled: true

# oauth2-proxy is the only external Prometheus path in the premium profile.
# The private renderer keeps this resource aligned with custom host and secret
# names, while this template remains secure by default.
extraManifests:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: prometheus-oauth2-proxy
      namespace: monitoring
      labels:
        app.kubernetes.io/name: prometheus-oauth2-proxy
        app.kubernetes.io/part-of: platform-monitoring
    spec:
      replicas: 2
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
          maxSurge: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: prometheus-oauth2-proxy
      template:
        metadata:
          labels:
            app.kubernetes.io/name: prometheus-oauth2-proxy
            app.kubernetes.io/part-of: platform-monitoring
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: prometheus-oauth2-proxy
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: oauth2-proxy
              image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
              imagePullPolicy: IfNotPresent
              args:
                - --provider=keycloak-oidc
                - --oidc-issuer-url=https://sso.<PLATFORM_DOMAIN>/realms/platform
                - --client-id=prometheus
                - --redirect-url=https://prometheus.<PLATFORM_DOMAIN>/oauth2/callback
                - --email-domain=*
                - --allowed-role=platform-viewer
                - --upstream=http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
                - --http-address=0.0.0.0:4180
                - --reverse-proxy=true
                - --cookie-secure=true
                - --cookie-samesite=lax
                - --cookie-name=__Host-platform-prometheus
                - --cookie-refresh=1h
                - --cookie-expire=8h
                - --scope=openid profile email groups
                - --skip-provider-button=true
                - --code-challenge-method=S256
                - --set-xauthrequest=true
                - --pass-access-token=true
                - --silence-ping-logging=true
              env:
                - name: OAUTH2_PROXY_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: platform-sso-prometheus
                      key: client-secret
                - name: OAUTH2_PROXY_COOKIE_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: platform-sso-prometheus
                      key: cookie-secret
              ports:
                - name: http
                  containerPort: 4180
              readinessProbe:
                httpGet:
                  path: /ready
                  port: http
                periodSeconds: 10
                timeoutSeconds: 3
              livenessProbe:
                httpGet:
                  path: /ping
                  port: http
                periodSeconds: 10
                timeoutSeconds: 3
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
  - apiVersion: v1
    kind: Service
    metadata:
      name: prometheus-oauth2-proxy
      namespace: monitoring
      labels:
        app.kubernetes.io/name: prometheus-oauth2-proxy
    spec:
      selector:
        app.kubernetes.io/name: prometheus-oauth2-proxy
      ports:
        - name: http
          port: 4180
          targetPort: http
  - apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata:
      name: prometheus-oauth2-proxy
      namespace: monitoring
    spec:
      minAvailable: 1
      unhealthyPodEvictionPolicy: AlwaysAllow
      selector:
        matchLabels:
          app.kubernetes.io/name: prometheus-oauth2-proxy
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: prometheus-authenticated
      namespace: monitoring
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
    spec:
      ingressClassName: traefik
      rules:
        - host: prometheus.<PLATFORM_DOMAIN>
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: prometheus-oauth2-proxy
                    port:
                      number: 4180
      tls:
        - secretName: prometheus-tls
          hosts:
            - prometheus.<PLATFORM_DOMAIN>
