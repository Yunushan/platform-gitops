crds:
  enabled: true

# Monitoring premium profile rendered by scripts/render_private_platform_values.py.
# Grafana stores durable state in the shared CloudNativePG cluster.
prometheus:
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - prometheus.<PLATFORM_DOMAIN>
    tls:
      - secretName: prometheus-tls
        hosts:
          - prometheus.<PLATFORM_DOMAIN>
  prometheusSpec:
    replicas: 2
    podAntiAffinity: hard
    podAntiAffinityTopologyKey: kubernetes.io/hostname
    retention: 15d
    retentionSize: 20GB
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 250m
        memory: 2Gi
      limits:
        memory: 4Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-standard
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi

alertmanager:
  enabled: true
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  alertmanagerSpec:
    replicas: 3
    podAntiAffinity: hard
    podAntiAffinityTopologyKey: kubernetes.io/hostname
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-standard
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

grafana:
  replicas: 2
  deploymentStrategy:
    type: RollingUpdate
  podDisruptionBudget:
    minAvailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  envValueFrom:
    GF_DATABASE_PASSWORD:
      secretKeyRef:
        name: grafana-database
        key: password
  grafana.ini:
    database:
      type: postgres
      host: platform-postgres-rw.platform-databases.svc.cluster.local:5432
      name: grafana
      user: grafana
      password: $__env{GF_DATABASE_PASSWORD}
      ssl_mode: disable
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  persistence:
    enabled: false
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.<PLATFORM_DOMAIN>
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.<PLATFORM_DOMAIN>

defaultRules:
  create: true

kubeEtcd:
  enabled: true

kubeScheduler:
  enabled: true

kubeControllerManager:
  enabled: true
