# Central OSS identity provider for platform SSO. The premium default uses the
# shared CloudNativePG platform-postgres cluster through secret/keycloak-database.
global:
  defaultStorageClass: longhorn-critical-encrypted
  # The vendored chart validates Bitnami repository names. Runtime image
  # admission and signatures are enforced separately by platform policy.
  security:
    allowInsecureImages: true

image:
  registry: quay.io
  repository: keycloak/keycloak
  tag: "26.7.0"

# The upstream image uses a different filesystem layout and UID than the
# historical Bitnami image. A standard production start applies the PostgreSQL
# build option at boot; use a pre-optimized private image before enabling a
# read-only root filesystem.
command:
  - /opt/keycloak/bin/kc.sh
args:
  - start

automountServiceAccountToken: false

podSecurityContext:
  enabled: true
  fsGroupChangePolicy: OnRootMismatch
  fsGroup: 0

containerSecurityContext:
  enabled: true
  runAsUser: 1000
  runAsGroup: 0
  runAsNonRoot: true
  privileged: false
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

defaultInitContainers:
  prepareWriteDirs:
    enabled: false

extraEnvVars:
  - name: KC_DB
    value: postgres
  - name: KC_HEALTH_ENABLED
    value: "true"

startupProbe:
  enabled: true
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30
  successThreshold: 1

auth:
  adminUser: admin
  existingSecret: keycloak-admin
  passwordSecretKey: admin-password

production: true
proxyHeaders: xforwarded
hostnameStrict: true
httpEnabled: true
replicaCount: 2
podAntiAffinityPreset: hard

# The premium profile targets three 8-vCPU nodes; reserve enough CPU for HA
# while leaving scheduler headroom for storage and platform rollouts.
resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    memory: 2Gi

pdb:
  create: true
  minAvailable: 1

postgresql:
  enabled: false

externalDatabase:
  host: platform-postgres-rw.platform-databases.svc.cluster.local
  port: 5432
  user: keycloak
  database: keycloak
  existingSecret: keycloak-database
  existingSecretUserKey: username
  existingSecretPasswordKey: password
  extraParams: sslmode=verify-full&sslrootcert=/etc/ssl/platform-postgres/ca-certificates.crt

extraVolumes:
  - name: platform-postgres-ca
    configMap:
      name: platform-internal-roots

extraVolumeMounts:
  - name: platform-postgres-ca
    mountPath: /etc/ssl/platform-postgres
    readOnly: true

ingress:
  enabled: true
  ingressClassName: traefik
  hostname: sso.<PLATFORM_DOMAIN>
  path: /
  pathType: Prefix
  servicePort: http
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  tls: true
  extraTls:
    - hosts:
        - sso.<PLATFORM_DOMAIN>
      secretName: keycloak-tls

networkPolicy:
  enabled: true
  allowExternal: true
  allowExternalEgress: true

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring
    labels:
      release: monitoring

# Declarative platform realm. Client credentials are generated in the ignored
# deployment path by make platform-app-secrets, never stored in Git.
keycloakConfigCli:
  enabled: true
  image:
    registry: quay.io
    repository: adorsys/keycloak-config-cli
    tag: "6.5.1"
  command:
    - java
  args:
    - -jar
    - /app/keycloak-config-cli.jar
  podSecurityContext:
    enabled: true
    fsGroupChangePolicy: OnRootMismatch
    fsGroup: 65534
  containerSecurityContext:
    enabled: true
    runAsUser: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    privileged: false
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  automountServiceAccountToken: false
  backoffLimit: 3
  cleanupAfterFinished:
    enabled: true
    seconds: 900
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  extraEnvVars:
    - name: IMPORT_VARSUBSTITUTION_ENABLED
      value: "true"
  extraEnvVarsSecret: platform-sso-clients
  configuration:
    platform-realm.json: |
      {
        "realm": "platform",
        "enabled": true,
        "sslRequired": "external",
        "registrationAllowed": false,
        "bruteForceProtected": true,
        "roles": {
          "realm": [
            {"name": "platform-viewer"},
            {
              "name": "platform-admin",
              "composite": true,
              "composites": {"realm": ["platform-viewer"]}
            }
          ]
        },
        "users": [
          {
            "username": "platform-admin",
            "enabled": true,
            "email": "platform-admin@local.invalid",
            "emailVerified": true,
            "realmRoles": ["platform-admin"],
            "requiredActions": ["CONFIGURE_TOTP"],
            "credentials": [
              {
                "type": "password",
                "value": "$(env:PLATFORM_SSO_BOOTSTRAP_ADMIN_PASSWORD)",
                "temporary": false
              }
            ]
          }
        ],
        "clients": [
          {
            "clientId": "argocd",
            "protocol": "openid-connect",
            "clientAuthenticatorType": "client-secret",
            "secret": "$(env:PLATFORM_SSO_ARGOCD_CLIENT_SECRET)",
            "publicClient": false,
            "standardFlowEnabled": true,
            "directAccessGrantsEnabled": false,
            "redirectUris": [
              "https://argocd.<PLATFORM_DOMAIN>/auth/callback",
              "http://localhost:8085/auth/callback",
              "http://127.0.0.1:8085/auth/callback"
            ],
            "webOrigins": ["https://argocd.<PLATFORM_DOMAIN>"],
            "protocolMappers": [
              {
                "name": "realm-roles-as-groups",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-usermodel-realm-role-mapper",
                "consentRequired": false,
                "config": {
                  "multivalued": "true",
                  "userinfo.token.claim": "true",
                  "id.token.claim": "true",
                  "access.token.claim": "true",
                  "claim.name": "groups",
                  "jsonType.label": "String"
                }
              }
            ]
          },
          {
            "clientId": "grafana",
            "protocol": "openid-connect",
            "clientAuthenticatorType": "client-secret",
            "secret": "$(env:PLATFORM_SSO_GRAFANA_CLIENT_SECRET)",
            "publicClient": false,
            "standardFlowEnabled": true,
            "directAccessGrantsEnabled": false,
            "redirectUris": ["https://grafana.<PLATFORM_DOMAIN>/login/generic_oauth"],
            "webOrigins": ["https://grafana.<PLATFORM_DOMAIN>"],
            "protocolMappers": [
              {
                "name": "realm-roles-as-groups",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-usermodel-realm-role-mapper",
                "consentRequired": false,
                "config": {
                  "multivalued": "true",
                  "userinfo.token.claim": "true",
                  "id.token.claim": "true",
                  "access.token.claim": "true",
                  "claim.name": "groups",
                  "jsonType.label": "String"
                }
              }
            ]
          },
          {
            "clientId": "prometheus",
            "protocol": "openid-connect",
            "clientAuthenticatorType": "client-secret",
            "secret": "$(env:PLATFORM_SSO_PROMETHEUS_CLIENT_SECRET)",
            "publicClient": false,
            "standardFlowEnabled": true,
            "directAccessGrantsEnabled": false,
            "redirectUris": ["https://prometheus.<PLATFORM_DOMAIN>/oauth2/callback"],
            "webOrigins": ["https://prometheus.<PLATFORM_DOMAIN>"],
            "protocolMappers": [
              {
                "name": "realm-roles-as-groups",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-usermodel-realm-role-mapper",
                "consentRequired": false,
                "config": {
                  "multivalued": "true",
                  "userinfo.token.claim": "true",
                  "id.token.claim": "true",
                  "access.token.claim": "true",
                  "claim.name": "groups",
                  "jsonType.label": "String"
                }
              },
              {
                "name": "prometheus-audience",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-audience-mapper",
                "consentRequired": false,
                "config": {
                  "included.client.audience": "prometheus",
                  "id.token.claim": "true",
                  "access.token.claim": "true"
                }
              }
            ]
          }
        ]
      }
