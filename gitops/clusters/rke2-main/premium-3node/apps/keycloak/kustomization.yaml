apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak
components:
  - ../../components/network-isolation
  - ../../components/postgres-client
  - ../../components/external-web-egress
  - ../../components/external-smtp-egress
  - ../../components/external-database-egress
resources:
  - namespace.yaml
helmCharts:
  - name: keycloak
    # 25.2.0 is the published Bitnami chart release for Keycloak 26.3.3.
    # Do not advance this independently of the image/value compatibility check.
    version: 25.2.0
    repo: https://charts.bitnami.com/bitnami
    releaseName: keycloak
    namespace: keycloak
    valuesFile: values.yaml
