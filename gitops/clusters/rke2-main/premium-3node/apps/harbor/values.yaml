# Harbor bootstrap profile rendered by scripts/render_private_platform_values.py.
# Uses internal PostgreSQL, Redis, and filesystem registry storage for first deployment.
# Store HARBOR_ADMIN_PASSWORD in secret/harbor-admin and secretKey in
# secret/harbor-secret-key before syncing this app.
expose:
  type: ingress
  tls:
    enabled: true
    certSource: auto
  ingress:
    className: traefik
    hosts:
      core: registry-gitops-arge.isbak.com.tr

externalURL: https://registry-gitops-arge.isbak.com.tr

portal:
  replicas: 1
core:
  replicas: 1
jobservice:
  replicas: 1
registry:
  replicas: 1
trivy:
  enabled: true
  replicas: 1

updateStrategy:
  type: Recreate

persistence:
  enabled: true
  persistentVolumeClaim:
    registry:
      storageClass: longhorn-critical
      size: 50Gi
    jobservice:
      jobLog:
        storageClass: longhorn-critical
        size: 5Gi
    database:
      storageClass: longhorn-critical
      size: 10Gi
    redis:
      storageClass: longhorn-critical
      size: 5Gi
    trivy:
      storageClass: longhorn-critical
      size: 10Gi
  imageChartStorage:
    type: filesystem
    filesystem:
      rootdirectory: /storage

database:
  type: internal

redis:
  type: internal

existingSecretAdminPassword: harbor-admin
existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
existingSecretSecretKey: harbor-secret-key

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
