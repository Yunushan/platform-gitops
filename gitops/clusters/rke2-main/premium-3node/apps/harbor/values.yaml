# Harbor premium profile rendered by scripts/render_private_platform_values.py.
# Uses CloudNativePG, shared Valkey, and off-cluster S3-compatible registry storage.
expose:
  type: ingress
  tls:
    enabled: true
    certSource: auto
  ingress:
    className: traefik
    hosts:
      core: harbor.<PLATFORM_DOMAIN>

externalURL: https://harbor.<PLATFORM_DOMAIN>

portal:
  replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
core:
  replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
  # Harbor's chart cannot build the core Redis URL from existingSecret.
  # Keep the URL, including the password, in generated Secret data instead.
  extraEnvVars:
    - name: _REDIS_URL_CORE
      valueFrom:
        secretKeyRef:
          name: harbor-redis-url
          key: REDIS_URL_CORE
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
jobservice:
  replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
  jobLoggers:
    - database
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
registry:
  replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
  registry:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
  controller:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
trivy:
  enabled: true
  replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
exporter:
  replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

updateStrategy:
  type: RollingUpdate

# Stateful data is external. Local Harbor volumes are reconstructible caches only.
persistence:
  enabled: false
  imageChartStorage:
    disableredirect: true
    type: s3
    s3:
      region: <HARBOR_S3_REGION>
      bucket: <HARBOR_S3_BUCKET>
      regionendpoint: <HARBOR_S3_ENDPOINT>
      secure: true
      skipverify: false
      v4auth: true
      existingSecret: <HARBOR_S3_SECRET_NAME>

database:
  type: external
  external:
    host: platform-postgres-rw.platform-databases.svc.cluster.local
    port: "5432"
    username: harbor
    coreDatabase: registry
    existingSecret: harbor-database
    sslmode: disable
    maxIdleConns: 100
    maxOpenConns: 900

redis:
  type: external
  jobserviceDatabaseIndex: "1"
  registryDatabaseIndex: "2"
  trivyAdapterIndex: "5"
  external:
    addr: platform-valkey-primary.platform-cache.svc.cluster.local:6379
    sentinelMasterSet: ""
    tlsOptions:
      enable: false
    coreDatabaseIndex: "0"
    jobserviceDatabaseIndex: "1"
    registryDatabaseIndex: "2"
    trivyAdapterIndex: "5"
    username: default
    existingSecret: harbor-redis

existingSecretAdminPassword: harbor-admin
existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
existingSecretSecretKey: harbor-secret-key

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
