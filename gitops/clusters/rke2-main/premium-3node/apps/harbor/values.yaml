# Harbor bootstrap profile rendered by scripts/render_private_platform_values.py.
# Uses internal PostgreSQL, external Redis, and filesystem registry storage for first deployment.
# Store HARBOR_ADMIN_PASSWORD in secret/harbor-admin and secretKey in
# secret/harbor-secret-key before syncing this app.
expose:
  type: ingress
  tls:
    enabled: true
    certSource: auto
  ingress:
    className: traefik
    hosts:
      core: harbor.<PLATFORM_DOMAIN>

externalURL: https://harbor.<PLATFORM_DOMAIN>

portal:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
core:
  replicas: 1
  # Harbor's chart cannot build the core Redis URL from existingSecret.
  # Keep the URL, including the password, in generated Secret data instead.
  extraEnvVars:
    - name: _REDIS_URL_CORE
      valueFrom:
        secretKeyRef:
          name: harbor-redis-url
          key: REDIS_URL_CORE
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
jobservice:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
registry:
  replicas: 1
  registry:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
  controller:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
trivy:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
exporter:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

updateStrategy:
  type: Recreate

persistence:
  enabled: true
  persistentVolumeClaim:
    registry:
      storageClass: longhorn-critical
      size: 50Gi
    jobservice:
      jobLog:
        storageClass: longhorn-critical
        size: 5Gi
    database:
      storageClass: longhorn-critical
      size: 10Gi
    redis:
      storageClass: longhorn-critical
      size: 5Gi
    trivy:
      storageClass: longhorn-critical
      size: 10Gi
  imageChartStorage:
    type: filesystem
    filesystem:
      rootdirectory: /storage

database:
  type: internal
  internal:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

redis:
  type: external
  jobserviceDatabaseIndex: "1"
  registryDatabaseIndex: "2"
  trivyAdapterIndex: "5"
  external:
    addr: platform-valkey-primary.platform-cache.svc.cluster.local:6379
    sentinelMasterSet: ""
    tlsOptions:
      enable: false
    coreDatabaseIndex: "0"
    jobserviceDatabaseIndex: "1"
    registryDatabaseIndex: "2"
    trivyAdapterIndex: "5"
    username: default
    existingSecret: harbor-redis

existingSecretAdminPassword: harbor-admin
existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
existingSecretSecretKey: harbor-secret-key

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
