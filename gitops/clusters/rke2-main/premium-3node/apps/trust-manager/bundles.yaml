apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: platform-public-roots
spec:
  sources:
    - useDefaultCAs: true
  target:
    configMap:
      key: ca-certificates.crt
      metadata:
        labels:
          app.kubernetes.io/part-of: platform-pki
          platform.gitops/trust-bundle: public-roots
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: platform-internal-roots
spec:
  sources:
    - useDefaultCAs: true
    - secret:
        name: platform-internal-root-ca
        key: tls.crt
  target:
    configMap:
      key: ca-certificates.crt
      metadata:
        labels:
          app.kubernetes.io/part-of: platform-pki
          platform.gitops/trust-bundle: internal-roots
