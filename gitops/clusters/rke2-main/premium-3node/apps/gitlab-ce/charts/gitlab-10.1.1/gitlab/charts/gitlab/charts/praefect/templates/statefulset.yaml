{{- $pod := include "platform.praefect.podSpec" . | fromYaml -}}
{{- if .Values.migrationJob.enabled -}}
{{- $_ := set $pod "serviceAccountName" (include "platform.praefect.schemaAccount" .) -}}
{{- if not (or .Values.serviceAccount.enabled .Values.global.serviceAccount.enabled) -}}
{{- $_ := set $pod "automountServiceAccountToken" false -}}
{{- end -}}
{{- $gate := include "platform.praefect.schemaGate" . | fromYaml -}}
{{- $_ := set $pod "initContainers" (prepend $pod.initContainers $gate) -}}
{{- $apiVolume := dict "name" "praefect-schema-api" "projected" (dict "sources" (list
      (dict "serviceAccountToken" (dict "path" "token" "expirationSeconds" 3600))
      (dict "configMap" (dict "name" "kube-root-ca.crt" "items" (list (dict "key" "ca.crt" "path" "ca.crt")))))) -}}
{{- $_ := set $pod "volumes" (append $pod.volumes $apiVolume) -}}
{{- end -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ template "fullname" . }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "gitlab.standardLabels" . | nindent 4 }}
    {{- include "gitlab.commonLabels" . | nindent 4 }}
    {{- include "gitlab.app.kubernetes.io.labels" $ | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "gitlab.selectorLabels" . | nindent 6 }}
  serviceName: {{ template "gitlab.praefect.serviceName" $ }}
  replicas: {{ $.Values.replicas }}
  podManagementPolicy: Parallel
  {{- if .Values.statefulset.strategy }}
  updateStrategy: {{ .Values.statefulset.strategy | toYaml | nindent 4 }}
  {{- end }}
  {{- if hasKey .Values.statefulset "revisionHistoryLimit" }}
  revisionHistoryLimit: {{ .Values.statefulset.revisionHistoryLimit }}
  {{- else if hasKey $.Values.global "revisionHistoryLimit" }}
  revisionHistoryLimit: {{ $.Values.global.revisionHistoryLimit }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "gitlab.standardLabels" . | nindent 8 }}
        {{- include "gitlab.commonLabels" . | nindent 8 }}
        {{- include "gitlab.app.kubernetes.io.labels" $ | nindent 8 }}
        {{- include "gitlab.podLabels" . | nindent 8 }}
        {{- if .Values.migrationJob.enabled }}
        platform.gitops/gitlab-bootstrap: "true"
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- range $key, $value := .Values.annotations }}
        {{ $key }}: {{ $value | quote }}
      {{- end }}
      {{- if and .Values.metrics.enabled (not .Values.metrics.serviceMonitor.enabled) }}
        gitlab.com/prometheus_scrape: "true"
        gitlab.com/prometheus_port: {{ .Values.metrics.port | quote }}
        gitlab.com/prometheus_path: {{ .Values.metrics.path }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | quote }}
        prometheus.io/path: {{ .Values.metrics.path }}
      {{- end }}
    spec:
      {{- toYaml $pod | nindent 6 }}
