{{- $enabled := or .Values.serviceAccount.enabled .Values.global.serviceAccount.enabled -}}
{{- $create := or .Values.serviceAccount.create .Values.global.serviceAccount.create -}}
{{- if and $enabled $create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ template "gitlab.serviceAccount.name" . }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "gitlab.standardLabels" . | nindent 4 -}}
    {{- include "gitlab.commonLabels" . | nindent 4 -}}
  {{- $annotations := default .Values.serviceAccount.annotations .Values.global.serviceAccount.annotations | default dict | deepCopy }}
  {{- if .Values.migrationJob.enabled }}
  {{- $_ := set $annotations "argocd.argoproj.io/sync-wave" "-3" }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
