apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gitlab
resources:
  - namespace.yaml
components:
  - ../../components/network-isolation
  - ../../components/postgres-client
  - ../../components/valkey-client
  - ../../components/external-web-egress
  - ../../components/external-git-egress
  - ../../components/external-smtp-egress
  - ../../components/external-object-storage-egress
helmGlobals:
  chartHome: charts/gitlab-10.1.1
helmCharts:
  - name: gitlab
    releaseName: gitlab
    namespace: gitlab
    valuesFile: values.yaml
