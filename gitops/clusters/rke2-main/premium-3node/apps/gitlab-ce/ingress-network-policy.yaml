apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gitlab-allow-traefik-backends
spec:
  podSelector:
    matchLabels:
      release: gitlab
    matchExpressions:
      - key: app
        operator: In
        values: [webservice, registry, kas]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8181
        - protocol: TCP
          port: 5000
        - protocol: TCP
          port: 8150
        - protocol: TCP
          port: 8154
