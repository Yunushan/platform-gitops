apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: platform
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: harbor-core
      namespace: harbor
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: harbor-ingress
      namespace: harbor
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: harbor-jobservice
      namespace: harbor
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: harbor-registry
      namespace: harbor
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: harbor-registry-htpasswd
      namespace: harbor
      jsonPointers:
        - /data
    - group: apps
      kind: Deployment
      name: harbor-core
      namespace: harbor
      jqPathExpressions:
        - '.spec.template.metadata.annotations."checksum/secret"'
        - '.spec.template.metadata.annotations."checksum/secret-jobservice"'
    - group: apps
      kind: Deployment
      name: harbor-jobservice
      namespace: harbor
      jqPathExpressions:
        - '.spec.template.metadata.annotations."checksum/secret"'
        - '.spec.template.metadata.annotations."checksum/secret-core"'
    - group: apps
      kind: Deployment
      name: harbor-registry
      namespace: harbor
      jqPathExpressions:
        - '.spec.template.metadata.annotations."checksum/secret"'
        - '.spec.template.metadata.annotations."checksum/secret-core"'
        - '.spec.template.metadata.annotations."checksum/secret-jobservice"'
  source:
    repoURL: <THIS_REPO_URL>
    targetRevision: main
    path: gitops/clusters/rke2-main/premium-3node/apps/harbor
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
