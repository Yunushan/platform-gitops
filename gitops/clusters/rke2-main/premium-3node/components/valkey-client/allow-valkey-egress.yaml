apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-allow-valkey-egress
  labels:
    app.kubernetes.io/part-of: platform-network-isolation
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-cache
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 6380
