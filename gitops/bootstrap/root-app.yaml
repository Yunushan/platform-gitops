apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: <THIS_REPO_URL>
    targetRevision: main
    path: gitops/clusters/rke2-main
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - Prune=confirm
      - PruneLast=true
      - PrunePropagationPolicy=foreground
