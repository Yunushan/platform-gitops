---
- name: Check RKE2 registry TLS reachability
  ansible.builtin.shell: |
    set -o pipefail
    url='{{ item }}'
    output="$(curl --silent --show-error --location --output /dev/null \
      --write-out 'http_code=%{http_code} remote_ip=%{remote_ip} time_connect=%{time_connect} time_appconnect=%{time_appconnect} time_total=%{time_total}' \
      --connect-timeout {{ rke2_registry_connect_timeout_effective }} \
      --max-time {{ rke2_registry_check_timeout_effective }} \
      "${url}" 2>&1)"
    rc=$?
    echo "url=${url} rc=${rc} ${output}"
    exit "${rc}"
  args:
    executable: /bin/bash
  register: rke2_registry_checks
  loop: "{{ rke2_registry_check_urls_effective }}"
  changed_when: false
  failed_when: false

- name: Print RKE2 registry TLS reachability
  ansible.builtin.debug:
    msg: "{{ item.stdout }}"
  loop: "{{ rke2_registry_checks.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Stop when RKE2 registry connectivity is unhealthy
  ansible.builtin.fail:
    msg: |
      {{ inventory_hostname }} cannot reliably reach one or more RKE2 image registry endpoints.

      RKE2 online bootstrap must pull Rancher control-plane images such as hardened-etcd and hardened-kubernetes.
      TLS handshake timeouts against Docker Hub usually mean firewall, proxy, DNS, MTU, packet inspection, or internet egress issues.

      Fix node egress to these endpoints, or configure an internal registry mirror/airgap image flow before installing:
      {% for url in rke2_registry_check_urls_effective %}
      - {{ url }}
      {% endfor %}

      To skip this check only after a private mirror or airgap flow is configured:
      RKE2_REGISTRY_CHECK_ENABLED=false make rke2-install
  when: (rke2_registry_checks.results | selectattr('rc', 'ne', 0) | list | length) > 0
