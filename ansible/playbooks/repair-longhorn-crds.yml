---
- name: Repair Longhorn CRDs
  hosts: rke2_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    rke2_first_server: "{{ groups['rke2_servers'][0] }}"
    platform_longhorn_chart_version_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_LONGHORN_CHART_VERSION') }}"
    platform_longhorn_wait_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_LONGHORN_WAIT_TIMEOUT') }}"
    platform_longhorn_vendored_chart_path: "{{ playbook_dir }}/../../gitops/clusters/rke2-main/premium-3node/apps/longhorn/charts/longhorn-1.12.1/longhorn"
    platform_longhorn_vendored_chart_metadata: "{{ lookup('ansible.builtin.file', platform_longhorn_vendored_chart_path ~ '/Chart.yaml') | from_yaml }}"
    platform_longhorn_vendored_chart_version: "{{ platform_longhorn_vendored_chart_metadata.version }}"
    platform_longhorn_chart_version_effective: "{{ platform_longhorn_chart_version | default(platform_longhorn_chart_version_from_env, true) | default(platform_longhorn_vendored_chart_version, true) }}"
    platform_longhorn_render_kube_version: "1.36.0"
    platform_longhorn_crd_render_max_bytes: 4194304
    platform_longhorn_wait_timeout_effective: "{{ platform_longhorn_wait_timeout | default(platform_longhorn_wait_timeout_from_env, true) | default(900, true) | int }}"
    platform_longhorn_required_crds:
      - nodes.longhorn.io
      - engines.longhorn.io
      - engineimages.longhorn.io
      - volumes.longhorn.io
      - replicas.longhorn.io
      - instancemanagers.longhorn.io
      - settings.longhorn.io
  tasks:
    - name: Validate vendored Longhorn CRD source
      ansible.builtin.assert:
        that:
          - platform_longhorn_vendored_chart_version is match('^[0-9]+[.][0-9]+[.][0-9]+$')
          - platform_longhorn_chart_version_effective == platform_longhorn_vendored_chart_version
        fail_msg: >-
          Longhorn CRD repair only accepts the Git-tracked vendored chart
          version {{ platform_longhorn_vendored_chart_version }}. Update and
          review the vendored chart before selecting another version; runtime
          CRD manifest downloads are intentionally disabled.
      delegate_to: localhost
      become: false
      run_once: true

    - name: Render Longhorn CRDs from vendored chart
      ansible.builtin.command:
        argv:
          - helm
          - template
          - platform-longhorn
          - "{{ platform_longhorn_vendored_chart_path }}"
          - --namespace
          - longhorn-system
          - --kube-version
          - "{{ platform_longhorn_render_kube_version }}"
          - --show-only
          - templates/crds.yaml
      register: platform_longhorn_vendored_crds
      changed_when: false
      delegate_to: localhost
      become: false
      run_once: true

    - name: Bound rendered Longhorn CRDs
      ansible.builtin.assert:
        that:
          - platform_longhorn_vendored_crds.stdout | length > 0
          - platform_longhorn_vendored_crds.stdout | length <= platform_longhorn_crd_render_max_bytes
          - "'kind: CustomResourceDefinition' in platform_longhorn_vendored_crds.stdout"
        fail_msg: >-
          The vendored Longhorn CRD render is empty, oversized, or does not
          contain CustomResourceDefinition objects.
      delegate_to: localhost
      become: false
      run_once: true

    - name: Check required Longhorn CRDs
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        missing=""
        for crd in {{ platform_longhorn_required_crds | join(' ') }}; do
          if ! "$K" --kubeconfig "$C" get "crd/${crd}" >/dev/null 2>&1; then
            missing="${missing} ${crd}"
          fi
        done
        missing="$(printf '%s' "${missing}" | xargs)"
        printf '%s\n' "${missing}"
        test -z "${missing}"
      args:
        executable: /bin/bash
      register: platform_longhorn_required_crd_check
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Restore missing Longhorn CRDs from vendored chart
      ansible.builtin.command:
        argv:
          - /var/lib/rancher/rke2/bin/kubectl
          - --kubeconfig
          - /etc/rancher/rke2/rke2.yaml
          - apply
          - -f
          - -
        stdin: "{{ platform_longhorn_vendored_crds.stdout }}"
      args:
        stdin_add_newline: true
      register: platform_longhorn_crd_restore
      changed_when: >-
        'created' in platform_longhorn_crd_restore.stdout or
        'configured' in platform_longhorn_crd_restore.stdout
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      when: platform_longhorn_required_crd_check.stdout | trim | length > 0

    - name: Wait for required Longhorn CRDs
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        for crd in {{ platform_longhorn_required_crds | join(' ') }}; do
          "$K" --kubeconfig "$C" get "crd/${crd}" >/dev/null
        done
      args:
        executable: /bin/bash
      register: platform_longhorn_required_crds_ready
      retries: "{{ (((platform_longhorn_wait_timeout_effective | int) / 10) | round(0, 'ceil') | int) + 1 }}"
      delay: 10
      until: platform_longhorn_required_crds_ready.rc == 0
      changed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Restart Longhorn manager after CRD repair
      ansible.builtin.command:
        argv:
          - /var/lib/rancher/rke2/bin/kubectl
          - --kubeconfig
          - /etc/rancher/rke2/rke2.yaml
          - -n
          - longhorn-system
          - rollout
          - restart
          - daemonset/longhorn-manager
      register: platform_longhorn_manager_restart
      changed_when: "'restarted' in platform_longhorn_manager_restart.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Wait for Longhorn manager after CRD repair
      ansible.builtin.command:
        argv:
          - /var/lib/rancher/rke2/bin/kubectl
          - --kubeconfig
          - /etc/rancher/rke2/rke2.yaml
          - -n
          - longhorn-system
          - rollout
          - status
          - daemonset/longhorn-manager
          - --timeout=30s
      register: platform_longhorn_manager_rollout
      retries: "{{ (((platform_longhorn_wait_timeout_effective | int) / 30) | round(0, 'ceil') | int) + 1 }}"
      delay: 10
      until: platform_longhorn_manager_rollout.rc == 0
      changed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Show Longhorn CRD repair status
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        echo "===== Longhorn CRDs ====="
        "$K" --kubeconfig "$C" get crd | grep -E 'longhorn\.io|NAME' || true
        echo "===== Longhorn API resources ====="
        "$K" --kubeconfig "$C" api-resources --api-group=longhorn.io -o wide || true
        echo "===== Longhorn pods ====="
        "$K" --kubeconfig "$C" -n longhorn-system get pods -o wide || true
        echo "===== Forgejo PVC/pods ====="
        "$K" --kubeconfig "$C" -n forgejo get pvc,pods -o wide || true
      args:
        executable: /bin/bash
      register: platform_longhorn_crd_repair_status
      changed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Print Longhorn CRD repair status
      ansible.builtin.debug:
        var: platform_longhorn_crd_repair_status.stdout_lines
      run_once: true
