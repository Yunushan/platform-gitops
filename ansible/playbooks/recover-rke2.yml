---
- name: Prepare Ansible root temporary directory
  hosts: rke2_servers
  become: true
  gather_facts: false
  tasks:
    - name: Ensure root Ansible temporary directory exists
      ansible.builtin.raw: install -d -m 0700 -o root -g root /root/.ansible/tmp
      changed_when: false

- name: Recover RKE2 server cluster without deleting cluster data
  hosts: rke2_servers
  become: true
  gather_facts: true
  any_errors_fatal: true
  vars:
    rke2_first_server: "{{ groups['rke2_servers'][0] }}"
    rke2_first_server_ip: "{{ hostvars[rke2_first_server].ansible_host }}"
    rke2_api_endpoint_from_env: "{{ lookup('ansible.builtin.env', 'RKE2_API_ENDPOINT') }}"
    rke2_join_endpoint_from_env: "{{ lookup('ansible.builtin.env', 'RKE2_JOIN_ENDPOINT') }}"
    rke2_token_from_env: "{{ lookup('ansible.builtin.env', 'RKE2_TOKEN') }}"
    rke2_api_endpoint_effective: "{{ rke2_api_endpoint | default(rke2_api_dns | default(rke2_api_endpoint_from_env, true), true) }}"
    rke2_join_endpoint_effective: "{{ rke2_join_endpoint | default(rke2_join_endpoint_from_env, true) | default(rke2_first_server_ip, true) }}"
    rke2_cni_effective: "{{ rke2_cni | default('cilium', true) }}"
    rke2_token_file: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/platform-gitops/rke2-token"
    rke2_start_timeout_from_env: "{{ lookup('ansible.builtin.env', 'RKE2_START_TIMEOUT') }}"
    rke2_start_poll_interval_from_env: "{{ lookup('ansible.builtin.env', 'RKE2_START_POLL_INTERVAL') }}"
    rke2_api_ready_timeout_from_env: "{{ lookup('ansible.builtin.env', 'RKE2_API_READY_TIMEOUT') }}"
    rke2_node_ready_timeout_from_env: "{{ lookup('ansible.builtin.env', 'RKE2_NODE_READY_TIMEOUT') }}"
    rke2_start_timeout_effective: "{{ rke2_start_timeout | default(rke2_start_timeout_from_env, true) | default(300, true) | int }}"
    rke2_start_poll_interval_effective: "{{ rke2_start_poll_interval | default(rke2_start_poll_interval_from_env, true) | default(10, true) | int }}"
    rke2_api_ready_timeout_effective: "{{ rke2_api_ready_timeout | default(rke2_api_ready_timeout_from_env, true) | default(300, true) | int }}"
    rke2_node_ready_timeout_effective: "{{ rke2_node_ready_timeout | default(rke2_node_ready_timeout_from_env, true) | default(600, true) | int }}"
    rke2_start_retries_effective: "{{ (((rke2_start_timeout_effective | int) / (rke2_start_poll_interval_effective | int)) | round(0, 'ceil') | int) + 1 }}"
    rke2_recovery_min_disk_mb: 10240
    rke2_recovery_min_memory_mb: 2048
    rke2_recovery_diagnostic_lines: 120
    rke2_disable_packaged_components:
      - rke2-ingress-nginx
      - rke2-traefik
    rke2_firewalld_ports:
      - 6443/tcp
      - 9345/tcp
      - 2379-2380/tcp
      - 10250/tcp
      - 4240/tcp
      - 4244/tcp
      - 8472/udp
      - 6081/udp
      - 30000-32767/tcp
      - 30000-32767/udp
    rke2_default_cluster_cidr: "{{ ['10', '42', '0', '0'] | join('.') }}/16"
    rke2_firewalld_trusted_sources:
      - "{{ rke2_cluster_cidr | default(rke2_default_cluster_cidr, true) }}"
    rke2_firewalld_trusted_interfaces:
      - cilium_host
      - cilium_net
      - cilium_vxlan
    rke2_core_kernel_modules:
      - br_netfilter
      - overlay
      - nf_conntrack
    rke2_fatal_startup_pattern: 'encrypted with different token|failed to validate token|failed to get CA certs|x509:|certificate signed by unknown authority'
    rke2_installer_process_pattern: '(/tmp/install-rke2[.]sh|y[u]m -q --refresh list container-selinux --upgrades|d[n]f -q --refresh list container-selinux --upgrades|INSTALL_RKE2_TYPE=server .*AnsiballZ_command[.]py)'
    rke2_runtime_process_pattern: '([r]ke2 server|[c]ontainerd.*rancher/rke2|[c]ontainerd-shim.*rancher/rke2|[k]ubelet.*rancher/rke2)'
  handlers:
    - name: Reload firewalld
      ansible.builtin.command: firewall-cmd --reload
      changed_when: true
  pre_tasks:
    - name: Require an API endpoint or DNS name
      ansible.builtin.assert:
        that:
          - rke2_api_endpoint_effective | length > 0
          - not (rke2_api_endpoint_effective is match("^<.*>$"))
        fail_msg: "Set rke2_api_dns in inventory/hosts.local.ini, pass -e rke2_api_endpoint=api.platform.local, or export RKE2_API_ENDPOINT."

    - name: Require ansible_host for first server
      ansible.builtin.assert:
        that:
          - rke2_first_server_ip is defined
          - rke2_first_server_ip | length > 0
          - not (rke2_first_server_ip is match("^<.*>$"))
        fail_msg: "The first host in [rke2_servers] must define ansible_host."
      run_once: true

    - name: Require exactly three RKE2 server hosts
      ansible.builtin.assert:
        that:
          - groups['rke2_servers'] | length == 3
        fail_msg: "Recovery expects exactly three hosts in [rke2_servers]."
      run_once: true

    - name: Require unique node addresses
      ansible.builtin.assert:
        that:
          - groups['rke2_servers'] | map('extract', hostvars, 'ansible_host') | list | unique | length == groups['rke2_servers'] | length
        fail_msg: "Every RKE2 node must have a unique ansible_host address."
      run_once: true

    - name: Ensure local token directory exists
      ansible.builtin.file:
        path: "{{ rke2_token_file | dirname }}"
        state: directory
        mode: "0700"
      become: false
      delegate_to: localhost
      run_once: true

    - name: Resolve RKE2 token candidate
      ansible.builtin.set_fact:
        rke2_token_candidate: "{{ rke2_token | default(rke2_token_from_env, true) }}"
      no_log: true

    - name: Generate or load local RKE2 token
      ansible.builtin.set_fact:
        rke2_generated_token: "{{ lookup('ansible.builtin.password', rke2_token_file + ' length=64 chars=ascii_letters,digits') }}"
      no_log: true

    - name: Read existing first server RKE2 token when present
      ansible.builtin.shell: |
        if [ -s /var/lib/rancher/rke2/server/token ]; then
          cat /var/lib/rancher/rke2/server/token
        fi
      args:
        executable: /bin/bash
      register: rke2_existing_first_server_token
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      no_log: true

    - name: Select recovery RKE2 token
      ansible.builtin.set_fact:
        rke2_token_effective: >-
          {{
            ((rke2_existing_first_server_token.stdout | default('', true)) | length > 0)
            | ternary(
                rke2_existing_first_server_token.stdout,
                ((((rke2_token_candidate | default('', true)) | length == 0) or ((rke2_token_candidate | regex_search('^<.*>$')) is not none)) | ternary(rke2_generated_token, rke2_token_candidate))
              )
          }}
      no_log: true

    - name: Persist selected RKE2 token on controller
      ansible.builtin.copy:
        dest: "{{ rke2_token_file }}"
        content: "{{ rke2_token_effective }}\n"
        mode: "0600"
      become: false
      delegate_to: localhost
      run_once: true
      no_log: true

    - name: Show recovery choices
      ansible.builtin.debug:
        msg: >-
          Recovering RKE2 with token source {{ 'existing first-server token' if ((rke2_existing_first_server_token.stdout | default('', true)) | length > 0) else 'controller token file or supplied private token' }},
          join endpoint {{ rke2_join_endpoint_effective }}, and API endpoint {{ rke2_api_endpoint_effective }}.

    - name: Show recovery timeout policy
      ansible.builtin.debug:
        msg: >-
          Recovery timeout policy: service={{ rke2_start_timeout_effective }}s,
          api={{ rke2_api_ready_timeout_effective }}s,
          nodes-ready={{ rke2_node_ready_timeout_effective }}s,
          poll={{ rke2_start_poll_interval_effective }}s.

  tasks:
    - name: Check recovery resource baseline
      ansible.builtin.shell: |
        set -eu
        disk_mb="$(df -Pm /var/lib/rancher 2>/dev/null | awk 'NR==2 {print $4}' || true)"
        if [ -z "${disk_mb}" ]; then
          disk_mb="$(df -Pm / | awk 'NR==2 {print $4}')"
        fi
        memory_mb="$(free -m | awk '/Mem:/ {print $7}')"
        echo "available_disk_mb=${disk_mb} available_memory_mb=${memory_mb}"
        test "${disk_mb}" -ge "{{ rke2_recovery_min_disk_mb }}"
        test "${memory_mb}" -ge "{{ rke2_recovery_min_memory_mb }}"
      args:
        executable: /bin/bash
      register: rke2_recovery_resources
      changed_when: false

    - name: Show recovery resource baseline
      ansible.builtin.debug:
        var: rke2_recovery_resources.stdout_lines

    - name: Check firewalld state
      ansible.builtin.command: firewall-cmd --state
      register: rke2_firewalld_state
      changed_when: false
      failed_when: false

    - name: Query required RKE2 firewalld ports
      ansible.builtin.command: "firewall-cmd --permanent --query-port={{ item }}"
      register: rke2_firewalld_port_queries
      changed_when: false
      failed_when: false
      loop: "{{ rke2_firewalld_ports }}"
      when: rke2_firewalld_state.rc == 0

    - name: Open required RKE2 firewalld ports
      ansible.builtin.command: "firewall-cmd --permanent --add-port={{ item.item }}"
      changed_when: true
      loop: "{{ rke2_firewalld_port_queries.results | default([]) }}"
      when:
        - rke2_firewalld_state.rc == 0
        - item.rc != 0
      notify: Reload firewalld

    - name: Query trusted RKE2 pod CIDR firewalld sources
      ansible.builtin.command: "firewall-cmd --permanent --zone=trusted --query-source={{ item }}"
      register: rke2_firewalld_source_queries
      changed_when: false
      failed_when: false
      loop: "{{ rke2_firewalld_trusted_sources }}"
      when: rke2_firewalld_state.rc == 0

    - name: Trust RKE2 pod CIDR firewalld sources
      ansible.builtin.command: "firewall-cmd --permanent --zone=trusted --add-source={{ item.item }}"
      register: rke2_firewalld_trust_sources
      changed_when: rke2_firewalld_trust_sources.rc == 0
      failed_when: false
      loop: "{{ rke2_firewalld_source_queries.results | default([]) }}"
      when:
        - rke2_firewalld_state.rc == 0
        - item.rc != 0
      notify: Reload firewalld

    - name: Query trusted Cilium firewalld interfaces
      ansible.builtin.command: "firewall-cmd --permanent --zone=trusted --query-interface={{ item }}"
      register: rke2_firewalld_interface_queries
      changed_when: false
      failed_when: false
      loop: "{{ rke2_firewalld_trusted_interfaces }}"
      when: rke2_firewalld_state.rc == 0

    - name: Trust Cilium firewalld interfaces
      ansible.builtin.command: "firewall-cmd --permanent --zone=trusted --change-interface={{ item.item }}"
      register: rke2_firewalld_trust_interfaces
      changed_when: rke2_firewalld_trust_interfaces.rc == 0
      failed_when: false
      loop: "{{ rke2_firewalld_interface_queries.results | default([]) }}"
      when:
        - rke2_firewalld_state.rc == 0
        - item.rc != 0
      notify: Reload firewalld

    - name: Flush firewalld changes before network checks
      ansible.builtin.meta: flush_handlers

    - name: Require RKE2 binary to be installed before recovery
      ansible.builtin.shell: |
        command -v rke2
      args:
        executable: /bin/bash
      register: rke2_recovery_binary
      changed_when: false
      failed_when: rke2_recovery_binary.rc != 0

    - name: Stop RKE2 server before controlled recovery
      ansible.builtin.systemd:
        name: rke2-server
        state: stopped
      failed_when: false

    - name: Stop lingering RKE2 processes
      ansible.builtin.shell: |
        /usr/local/bin/rke2-killall.sh || /usr/bin/rke2-killall.sh || true
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Stop stale installer processes
      ansible.builtin.shell: |
        pids="$(pgrep -f '{{ rke2_installer_process_pattern }}' || true)"
        if [ -n "${pids}" ]; then
          kill -TERM ${pids} || true
          sleep 5
        fi
        pids="$(pgrep -f '{{ rke2_installer_process_pattern }}' || true)"
        if [ -n "${pids}" ]; then
          kill -KILL ${pids} || true
        fi
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Verify no stale installer processes remain
      ansible.builtin.shell: |
        pgrep -af '{{ rke2_installer_process_pattern }}' || true
      args:
        executable: /bin/bash
      register: rke2_stale_installers_after_cleanup
      retries: 6
      delay: 5
      until: rke2_stale_installers_after_cleanup.stdout | length == 0
      changed_when: false
      failed_when: rke2_stale_installers_after_cleanup.stdout | length > 0

    - name: Verify no stale RKE2 runtime processes remain
      ansible.builtin.shell: |
        pgrep -af '{{ rke2_runtime_process_pattern }}' || true
      args:
        executable: /bin/bash
      register: rke2_stale_runtime_after_cleanup
      retries: 6
      delay: 5
      until: rke2_stale_runtime_after_cleanup.stdout | length == 0
      changed_when: false
      failed_when: rke2_stale_runtime_after_cleanup.stdout | length > 0

    - name: Reset failed RKE2 service state
      ansible.builtin.command: systemctl reset-failed rke2-server
      changed_when: false
      failed_when: false

    - name: Ensure RKE2 config directory exists
      ansible.builtin.file:
        path: /etc/rancher/rke2
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write consistent RKE2 server configuration
      ansible.builtin.copy:
        dest: /etc/rancher/rke2/config.yaml
        owner: root
        group: root
        mode: "0600"
        content: |
          {% if inventory_hostname != rke2_first_server %}
          server: https://{{ rke2_join_endpoint_effective }}:9345
          {% endif %}
          token: {{ rke2_token_effective }}
          node-name: {{ inventory_hostname }}
          cni: {{ rke2_cni_effective }}
          tls-san:
            - {{ rke2_api_endpoint_effective }}
          {% if rke2_api_vip is defined and (rke2_api_vip | length > 0) and not (rke2_api_vip is match("^<.*>$")) %}
            - {{ rke2_api_vip }}
          {% endif %}
          {% for san in rke2_extra_tls_sans | default([]) %}
            - {{ san }}
          {% endfor %}
          write-kubeconfig-mode: "0640"
          disable:
          {% for component in rke2_disable_packaged_components %}
            - {{ component }}
          {% endfor %}
          etcd-expose-metrics: true
      no_log: true

    - name: Verify rendered RKE2 configuration identity
      ansible.builtin.shell: |
        set -o pipefail
        grep -E '^(server:|node-name:|cni:|write-kubeconfig-mode:|etcd-expose-metrics:)' /etc/rancher/rke2/config.yaml || true
      args:
        executable: /bin/bash
      register: rke2_recovery_config_summary
      changed_when: false

    - name: Print RKE2 configuration identity
      ansible.builtin.debug:
        var: rke2_recovery_config_summary.stdout_lines

    - name: Enable RKE2 server service
      ansible.builtin.command: systemctl enable rke2-server
      changed_when: false

    - name: Start first RKE2 server
      ansible.builtin.command: systemctl --no-block restart rke2-server
      changed_when: true
      when: inventory_hostname == rke2_first_server

    - name: Wait for first RKE2 server to become active
      block:
        - name: Poll first RKE2 server service
          ansible.builtin.shell: |
            set -o pipefail
            state="$(systemctl is-active rke2-server || true)"
            if [ "${state}" = "active" ]; then
              echo "active"
              exit 0
            fi

            if journalctl -u rke2-server -n 80 --no-pager | grep -E '{{ rke2_fatal_startup_pattern }}' >/tmp/rke2-startup-fatal.log; then
              echo "rke2-server fatal startup error detected on {{ inventory_hostname }}:" >&2
              cat /tmp/rke2-startup-fatal.log >&2
              exit 42
            fi

            echo "rke2-server state is ${state}; retrying in {{ rke2_start_poll_interval_effective }}s"
            exit 1
          args:
            executable: /bin/bash
          register: rke2_first_server_active
          retries: "{{ rke2_start_retries_effective }}"
          delay: "{{ rke2_start_poll_interval_effective }}"
          until: rke2_first_server_active.rc == 0 or rke2_first_server_active.rc == 42
          changed_when: false
          failed_when: >-
            rke2_first_server_active.rc == 42 or
            (
              rke2_first_server_active.rc != 0 and
              (rke2_first_server_active.attempts | default(1) | int) >= (rke2_start_retries_effective | int)
            )
      rescue:
        - name: Collect first-server recovery diagnostics
          ansible.builtin.shell: |
            echo "===== systemctl is-active ====="
            systemctl is-active rke2-server || true
            echo "===== systemctl status ====="
            systemctl status rke2-server --no-pager -l || true
            echo "===== recent journal ====="
            journalctl -u rke2-server -n {{ rke2_recovery_diagnostic_lines }} --no-pager || true
            echo "===== likely bootstrap blockers ====="
            journalctl -u rke2-server -n 240 --no-pager |
              grep -E 'fatal|error|failed|etcd|pod sandbox|containerd|pause|image|x509|token|certificate|connection refused|no route|cacerts' || true
            echo "===== listeners ====="
            ss -lntp | grep -E ':(2379|2380|6443|9345)[[:space:]]' || true
            echo "===== prepared host checks ====="
            for module in {{ rke2_core_kernel_modules | join(' ') }}; do
              if lsmod | awk '{print $1}' | grep -Fx "${module}" >/dev/null; then
                echo "module:${module}=loaded"
              else
                echo "module:${module}=missing"
              fi
            done
            sysctl net.ipv4.ip_forward net.bridge.bridge-nf-call-iptables net.bridge.bridge-nf-call-ip6tables || true
            echo "swap_entries=$(swapon --noheadings | wc -l)"
            if [ -f /etc/redhat-release ]; then
              cat /etc/redhat-release
              rpm -q kernel-modules-extra || true
            fi
            echo "===== container runtime state ====="
            if [ -x /var/lib/rancher/rke2/bin/crictl ]; then
              export CONTAINER_RUNTIME_ENDPOINT=unix:///run/k3s/containerd/containerd.sock
              /var/lib/rancher/rke2/bin/crictl info || true
              /var/lib/rancher/rke2/bin/crictl pods -a || true
              /var/lib/rancher/rke2/bin/crictl ps -a || true
              /var/lib/rancher/rke2/bin/crictl images | head -120 || true
            else
              echo "crictl=missing"
            fi
            echo "===== containerd log tail ====="
            tail -n 160 /var/lib/rancher/rke2/agent/containerd/containerd.log 2>/dev/null || true
            echo "===== rke2 processes ====="
            ps -eo pid,ppid,stat,etime,comm,args | grep -E 'rke2|etcd|containerd|kubelet' | grep -v grep || true
            echo "===== resources ====="
            df -h / /var/lib/rancher 2>/dev/null || df -h /
            free -h
          args:
            executable: /bin/bash
          register: rke2_first_server_recovery_diagnostics
          changed_when: false
          failed_when: false

        - name: Print first-server recovery diagnostics
          ansible.builtin.debug:
            var: rke2_first_server_recovery_diagnostics.stdout_lines

        - name: Detect repeated etcd sandbox recovery failure
          ansible.builtin.set_fact:
            rke2_first_server_image_pull_failure: >-
              {{
                (rke2_first_server_recovery_diagnostics.stdout | default('')) is search('TLS handshake timeout|failed to pull and unpack image|PullImage .* failed|failed to process image event')
              }}
            rke2_first_server_etcd_sandbox_failure: >-
              {{
                (rke2_first_server_recovery_diagnostics.stdout | default('')) is search('Pod for etcd not synced|127[.]0[.]0[.]1:2379: connect: connection refused')
              }}

        - name: Stop after first-server recovery failure
          ansible.builtin.fail:
            msg: >-
              {{ rke2_first_server }} did not become active within {{ rke2_start_timeout_effective }} seconds.
              {% if rke2_first_server_image_pull_failure | default(false) %}
              The logs show RKE2 control-plane image pull failures, including Docker Hub TLS handshake timeouts.
              Fix node egress/proxy/DNS/MTU/packet inspection to Docker Hub, or configure an internal registry mirror/airgap image flow.
              Run `make rke2-registry-check` to verify the registry path before retrying recovery.
              {% elif rke2_first_server_etcd_sandbox_failure | default(false) %}
              The logs show embedded etcd never created a healthy pod sandbox or listener on 127.0.0.1:2379.
              Confirm `make rke2-prepare` completed successfully on Rocky Linux 10. If this cluster has no production data yet,
              use `CONFIRM_RKE2_RESET=YES_I_UNDERSTAND RKE2_RESET_CONTROLLER_TOKEN=true make rke2-reset`, then rerun
              `RKE2_JOIN_ENDPOINT={{ rke2_first_server_ip }} make rke2-install`.
              {% else %}
              Review diagnostics above, or run: make rke2-diagnose HOST={{ rke2_first_server }}
              {% endif %}
      when: inventory_hostname == rke2_first_server

    - name: Wait for first RKE2 kubeconfig
      ansible.builtin.wait_for:
        path: /etc/rancher/rke2/rke2.yaml
        timeout: "{{ rke2_api_ready_timeout_effective }}"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Wait for first RKE2 API readiness
      block:
        - name: Poll first RKE2 API readiness
          ansible.builtin.command: /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml get --raw=/readyz
          register: rke2_first_readyz
          retries: "{{ (((rke2_api_ready_timeout_effective | int) / (rke2_start_poll_interval_effective | int)) | round(0, 'ceil') | int) + 1 }}"
          delay: "{{ rke2_start_poll_interval_effective }}"
          until: rke2_first_readyz.rc == 0
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
      rescue:
        - name: Collect first API readiness diagnostics
          ansible.builtin.shell: |
            echo "===== readyz ====="
            /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml get --raw=/readyz || true
            echo "===== apiserver logs ====="
            journalctl -u rke2-server -n {{ rke2_recovery_diagnostic_lines }} --no-pager || true
            echo "===== listeners ====="
            ss -lntp | grep -E ':(6443|9345|2379|2380)[[:space:]]' || true
          args:
            executable: /bin/bash
          register: rke2_api_recovery_diagnostics
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Print first API readiness diagnostics
          ansible.builtin.debug:
            var: rke2_api_recovery_diagnostics.stdout_lines
          run_once: true

        - name: Stop after first API readiness failure
          ansible.builtin.fail:
            msg: "First RKE2 API did not become ready within {{ rke2_api_ready_timeout_effective }} seconds."
          run_once: true

    - name: Verify joining nodes can reach first server supervisor port
      ansible.builtin.wait_for:
        host: "{{ rke2_join_endpoint_effective }}"
        port: 9345
        timeout: 10
      when: inventory_hostname != rke2_first_server

    - name: Start joining RKE2 servers
      ansible.builtin.command: systemctl --no-block restart rke2-server
      changed_when: true
      when: inventory_hostname != rke2_first_server

    - name: Wait for every RKE2 server service to become active
      block:
        - name: Poll every RKE2 server service
          ansible.builtin.shell: |
            set -o pipefail
            state="$(systemctl is-active rke2-server || true)"
            if [ "${state}" = "active" ]; then
              echo "active"
              exit 0
            fi

            if journalctl -u rke2-server -n 80 --no-pager | grep -E '{{ rke2_fatal_startup_pattern }}' >/tmp/rke2-startup-fatal.log; then
              echo "rke2-server fatal startup error detected on {{ inventory_hostname }}:" >&2
              cat /tmp/rke2-startup-fatal.log >&2
              exit 42
            fi

            echo "rke2-server state is ${state}; retrying in {{ rke2_start_poll_interval_effective }}s"
            exit 1
          args:
            executable: /bin/bash
          register: rke2_service_active
          retries: "{{ rke2_start_retries_effective }}"
          delay: "{{ rke2_start_poll_interval_effective }}"
          until: rke2_service_active.rc == 0 or rke2_service_active.rc == 42
          changed_when: false
          failed_when: >-
            rke2_service_active.rc == 42 or
            (
              rke2_service_active.rc != 0 and
              (rke2_service_active.attempts | default(1) | int) >= (rke2_start_retries_effective | int)
            )
      rescue:
        - name: Collect joining server recovery diagnostics
          ansible.builtin.shell: |
            echo "===== systemctl is-active ====="
            systemctl is-active rke2-server || true
            echo "===== systemctl status ====="
            systemctl status rke2-server --no-pager -l || true
            echo "===== recent journal ====="
            journalctl -u rke2-server -n {{ rke2_recovery_diagnostic_lines }} --no-pager || true
            echo "===== supervisor endpoint test ====="
            curl -sk --connect-timeout 5 https://{{ rke2_join_endpoint_effective }}:9345/cacerts >/dev/null && echo "supervisor=OK" || echo "supervisor=FAIL"
          args:
            executable: /bin/bash
          register: rke2_joiner_recovery_diagnostics
          changed_when: false
          failed_when: false

        - name: Print joining server recovery diagnostics
          ansible.builtin.debug:
            var: rke2_joiner_recovery_diagnostics.stdout_lines

        - name: Stop after joining server recovery failure
          ansible.builtin.fail:
            msg: "{{ inventory_hostname }} did not become active within {{ rke2_start_timeout_effective }} seconds. Review diagnostics above, or run: make rke2-diagnose HOST={{ inventory_hostname }}"

    - name: Wait for all RKE2 nodes to report Ready
      block:
        - name: Poll all RKE2 nodes Ready
          ansible.builtin.shell: |
            set -o pipefail
            /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml get nodes --no-headers |
              awk '$2 == "Ready" { ready++ } END { expected={{ groups["rke2_servers"] | length }}; exit(ready == expected ? 0 : 1) }'
          args:
            executable: /bin/bash
          register: rke2_all_nodes_ready
          retries: "{{ (((rke2_node_ready_timeout_effective | int) / (rke2_start_poll_interval_effective | int)) | round(0, 'ceil') | int) + 1 }}"
          delay: "{{ rke2_start_poll_interval_effective }}"
          until: rke2_all_nodes_ready.rc == 0
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
      rescue:
        - name: Collect node readiness diagnostics
          ansible.builtin.shell: |
            echo "===== nodes ====="
            /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml get nodes -o wide || true
            echo "===== kube-system pods ====="
            /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml get pods -n kube-system -o wide || true
            echo "===== recent events ====="
            /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml get events -A --sort-by=.lastTimestamp | tail -80 || true
          args:
            executable: /bin/bash
          register: rke2_node_recovery_diagnostics
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Print node readiness diagnostics
          ansible.builtin.debug:
            var: rke2_node_recovery_diagnostics.stdout_lines
          run_once: true

        - name: Stop after node readiness failure
          ansible.builtin.fail:
            msg: "Not all RKE2 nodes became Ready within {{ rke2_node_ready_timeout_effective }} seconds."
          run_once: true

    - name: Show recovered cluster nodes
      ansible.builtin.command: /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml get nodes -o wide
      register: rke2_nodes
      changed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Print recovered cluster nodes
      ansible.builtin.debug:
        var: rke2_nodes.stdout_lines
      run_once: true
