---
- name: Bootstrap Longhorn storage directly
  hosts: rke2_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    rke2_first_server: "{{ groups['rke2_servers'][0] }}"
    platform_longhorn_chart_repo_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_LONGHORN_CHART_REPO') }}"
    platform_longhorn_chart_version_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_LONGHORN_CHART_VERSION') }}"
    platform_longhorn_backup_target_from_env: "{{ lookup('ansible.builtin.env', 'LONGHORN_BACKUP_TARGET') }}"
    platform_longhorn_wait_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_LONGHORN_WAIT_TIMEOUT') }}"
    platform_longhorn_cleanup_helm_jobs_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_LONGHORN_CLEANUP_HELM_JOBS') }}"
    platform_longhorn_failed_release_repair_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_LONGHORN_FAILED_RELEASE_REPAIR') }}"
    platform_longhorn_crd_repair_enabled_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_LONGHORN_CRD_REPAIR_ENABLED') }}"
    platform_longhorn_crd_manifest_url_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_LONGHORN_CRD_MANIFEST_URL') }}"
    platform_longhorn_prepull_images_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_LONGHORN_PREPULL_IMAGES') }}"
    platform_longhorn_image_pull_retries_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_LONGHORN_IMAGE_PULL_RETRIES') }}"
    platform_longhorn_image_pull_retry_delay_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_LONGHORN_IMAGE_PULL_RETRY_DELAY') }}"
    platform_longhorn_image_pull_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_LONGHORN_IMAGE_PULL_TIMEOUT') }}"
    platform_longhorn_image_pull_fast_fail_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_LONGHORN_IMAGE_PULL_FAST_FAIL') }}"
    platform_longhorn_default_disk_path_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_LONGHORN_DEFAULT_DISK_PATH') }}"
    platform_longhorn_auto_extra_disk_enabled_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_LONGHORN_AUTO_EXTRA_DISK') }}"
    platform_longhorn_auto_extra_disk_path_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_LONGHORN_AUTO_EXTRA_DISK_PATH') }}"
    platform_longhorn_auto_extra_disk_min_available_gib_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_LONGHORN_AUTO_EXTRA_DISK_MIN_AVAILABLE_GIB') }}"
    platform_longhorn_storage_over_provisioning_percentage_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_LONGHORN_STORAGE_OVER_PROVISIONING_PERCENTAGE') }}"
    platform_longhorn_chart_repo_effective: "{{ platform_longhorn_chart_repo | default(platform_longhorn_chart_repo_from_env, true) | default('https://charts.longhorn.io', true) }}"
    platform_longhorn_chart_version_effective: "{{ platform_longhorn_chart_version | default(platform_longhorn_chart_version_from_env, true) }}"
    platform_longhorn_backup_target_effective: "{{ platform_longhorn_backup_target | default(platform_longhorn_backup_target_from_env, true) | default('', true) }}"
    platform_longhorn_wait_timeout_effective: "{{ platform_longhorn_wait_timeout | default(platform_longhorn_wait_timeout_from_env, true) | default(900, true) | int }}"
    platform_longhorn_cleanup_helm_jobs_effective: "{{ platform_longhorn_cleanup_helm_jobs | default(platform_longhorn_cleanup_helm_jobs_from_env, true) | default(true, true) | bool }}"
    platform_longhorn_failed_release_repair_effective: "{{ platform_longhorn_failed_release_repair | default(platform_longhorn_failed_release_repair_from_env, true) | default(true, true) | bool }}"
    platform_longhorn_crd_repair_enabled_effective: "{{ platform_longhorn_crd_repair_enabled | default(platform_longhorn_crd_repair_enabled_from_env, true) | default(true, true) | bool }}"
    platform_longhorn_crd_manifest_url_effective: >-
      {{ platform_longhorn_crd_manifest_url
         | default(platform_longhorn_crd_manifest_url_from_env, true)
         | default('https://raw.githubusercontent.com/longhorn/longhorn/v' ~ (platform_longhorn_chart_version_effective | default('1.12.0', true)) ~ '/deploy/longhorn.yaml', true) }}
    platform_longhorn_prepull_images_effective: "{{ platform_longhorn_prepull_images | default(platform_longhorn_prepull_images_from_env, true) | default(true, true) | bool }}"
    platform_longhorn_image_pull_retries_effective: "{{ platform_longhorn_image_pull_retries | default(platform_longhorn_image_pull_retries_from_env, true) | default(4, true) | int }}"
    platform_longhorn_image_pull_retry_delay_effective: "{{ platform_longhorn_image_pull_retry_delay | default(platform_longhorn_image_pull_retry_delay_from_env, true) | default(20, true) | int }}"
    platform_longhorn_image_pull_timeout_effective: "{{ platform_longhorn_image_pull_timeout | default(platform_longhorn_image_pull_timeout_from_env, true) | default(300, true) | int }}"
    platform_longhorn_image_pull_fast_fail_effective: "{{ platform_longhorn_image_pull_fast_fail | default(platform_longhorn_image_pull_fast_fail_from_env, true) | default(false, true) | bool }}"
    platform_longhorn_default_disk_path_effective: "{{ platform_longhorn_default_disk_path | default(platform_longhorn_default_disk_path_from_env, true) | default('/var/lib/longhorn', true) }}"
    platform_longhorn_auto_extra_disk_enabled_effective: "{{ platform_longhorn_auto_extra_disk_enabled | default(platform_longhorn_auto_extra_disk_enabled_from_env, true) | default(true, true) | bool }}"
    platform_longhorn_auto_extra_disk_path_effective: "{{ platform_longhorn_auto_extra_disk_path | default(platform_longhorn_auto_extra_disk_path_from_env, true) | default('/home/longhorn', true) }}"
    platform_longhorn_auto_extra_disk_min_available_gib_effective: "{{ platform_longhorn_auto_extra_disk_min_available_gib | default(platform_longhorn_auto_extra_disk_min_available_gib_from_env, true) | default(40, true) | int }}"
    platform_longhorn_storage_over_provisioning_percentage_effective: "{{ platform_longhorn_storage_over_provisioning_percentage | default(platform_longhorn_storage_over_provisioning_percentage_from_env, true) | default(100, true) | int }}"
    platform_longhorn_required_crds:
      - nodes.longhorn.io
      - engines.longhorn.io
      - engineimages.longhorn.io
      - volumes.longhorn.io
      - replicas.longhorn.io
      - instancemanagers.longhorn.io
      - settings.longhorn.io
  tasks:
    - block:
        - name: Validate Longhorn storage overprovisioning percentage
          ansible.builtin.assert:
            that:
              - platform_longhorn_storage_over_provisioning_percentage_effective | int >= 100
              - platform_longhorn_storage_over_provisioning_percentage_effective | int <= 1000
            fail_msg: >-
              PLATFORM_LONGHORN_STORAGE_OVER_PROVISIONING_PERCENTAGE must be an
              integer from 100 through 1000. Increasing it does not create
              physical storage capacity.
          run_once: true

        - name: Verify RKE2 HelmChart CRD exists
          ansible.builtin.command:
            argv:
              - /var/lib/rancher/rke2/bin/kubectl
              - --kubeconfig
              - /etc/rancher/rke2/rke2.yaml
              - get
              - crd
              - helmcharts.helm.cattle.io
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Clean stale Longhorn Helm install job
          ansible.builtin.command:
            argv:
              - /var/lib/rancher/rke2/bin/kubectl
              - --kubeconfig
              - /etc/rancher/rke2/rke2.yaml
              - -n
              - kube-system
              - delete
              - job/helm-install-platform-longhorn
              - --ignore-not-found=true
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when: platform_longhorn_cleanup_helm_jobs_effective | bool

        - name: Clean stale Longhorn uninstall job
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            if "$K" --kubeconfig "$C" get ns longhorn-system >/dev/null 2>&1; then
              "$K" --kubeconfig "$C" -n longhorn-system delete job/longhorn-uninstall \
                --ignore-not-found=true --wait=false
              "$K" --kubeconfig "$C" -n longhorn-system delete pods \
                -l job-name=longhorn-uninstall --ignore-not-found=true --wait=false
            fi
          args:
            executable: /bin/bash
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when: platform_longhorn_cleanup_helm_jobs_effective | bool

        - name: Mark existing Longhorn PriorityClass as Helm-owned
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            if "$K" --kubeconfig "$C" get priorityclass longhorn-critical >/dev/null 2>&1; then
              "$K" --kubeconfig "$C" label priorityclass longhorn-critical \
                app.kubernetes.io/managed-by=Helm --overwrite
              "$K" --kubeconfig "$C" annotate priorityclass longhorn-critical \
                meta.helm.sh/release-name=platform-longhorn \
                meta.helm.sh/release-namespace=longhorn-system \
                --overwrite
            else
              echo "longhorn-critical PriorityClass does not exist yet; Longhorn chart can create it."
            fi
          args:
            executable: /bin/bash
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Ensure Longhorn default disk path exists on all nodes
          ansible.builtin.file:
            path: "{{ platform_longhorn_default_disk_path_effective }}"
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Ensure Longhorn automatic extra disk path exists on all nodes
          ansible.builtin.file:
            path: "{{ platform_longhorn_auto_extra_disk_path_effective }}"
            state: directory
            owner: root
            group: root
            mode: "0755"
          when: platform_longhorn_auto_extra_disk_enabled_effective | bool

        - name: Apply Longhorn namespace, storage classes, and RKE2 HelmChart
          ansible.builtin.shell: |
            set -o pipefail
            /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml apply -f -
          args:
            executable: /bin/bash
            stdin: |
              ---
              apiVersion: v1
              kind: Namespace
              metadata:
                name: longhorn-system
              ---
              apiVersion: storage.k8s.io/v1
              kind: StorageClass
              metadata:
                name: longhorn-standard
                annotations:
                  storageclass.kubernetes.io/is-default-class: "true"
              provisioner: driver.longhorn.io
              allowVolumeExpansion: true
              reclaimPolicy: Retain
              volumeBindingMode: WaitForFirstConsumer
              parameters:
                numberOfReplicas: "2"
                staleReplicaTimeout: "30"
                dataLocality: best-effort
                fsType: ext4
              ---
              apiVersion: storage.k8s.io/v1
              kind: StorageClass
              metadata:
                name: longhorn-critical
              provisioner: driver.longhorn.io
              allowVolumeExpansion: true
              reclaimPolicy: Retain
              volumeBindingMode: WaitForFirstConsumer
              parameters:
                numberOfReplicas: "3"
                staleReplicaTimeout: "30"
                dataLocality: best-effort
                fsType: ext4
              ---
              apiVersion: storage.k8s.io/v1
              kind: StorageClass
              metadata:
                name: longhorn-cache
              provisioner: driver.longhorn.io
              allowVolumeExpansion: true
              reclaimPolicy: Delete
              volumeBindingMode: WaitForFirstConsumer
              parameters:
                numberOfReplicas: "1"
                staleReplicaTimeout: "30"
                dataLocality: best-effort
                fsType: ext4
              ---
              apiVersion: helm.cattle.io/v1
              kind: HelmChart
              metadata:
                name: platform-longhorn
                namespace: kube-system
              spec:
                repo: {{ platform_longhorn_chart_repo_effective }}
                chart: longhorn
                failurePolicy: abort
              {% if platform_longhorn_chart_version_effective | length > 0 %}
                version: {{ platform_longhorn_chart_version_effective }}
              {% endif %}
                targetNamespace: longhorn-system
                createNamespace: true
                valuesContent: |-
                  persistence:
                    defaultClass: false
                  defaultSettings:
                    defaultDataPath: /var/lib/longhorn
                    backupTarget: {{ platform_longhorn_backup_target_effective | to_json }}
                    backupTargetCredentialSecret: longhorn-backup-target
                    createDefaultDiskLabeledNodes: false
                    defaultReplicaCount: 2
                    defaultDataLocality: best-effort
                    replicaAutoBalance: best-effort
                    storageOverProvisioningPercentage: {{ platform_longhorn_storage_over_provisioning_percentage_effective }}
                    storageMinimalAvailablePercentage: 10
                    orphanAutoDeletion: true
                    concurrentAutomaticEngineUpgradePerNodeLimit: 1
                  longhornManager:
                    priorityClass: longhorn-critical
                    resources:
                      requests:
                        cpu: 250m
                        memory: 512Mi
                      limits:
                        memory: 1Gi
                  longhornDriver:
                    priorityClass: longhorn-critical
          register: platform_longhorn_apply
          changed_when: >-
            'created' in platform_longhorn_apply.stdout or
            'configured' in platform_longhorn_apply.stdout
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Repair a failed Longhorn Helm release with an in-place upgrade
          ansible.builtin.shell: |
            set -euo pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            release=platform-longhorn
            release_namespace=longhorn-system
            controller_namespace=kube-system
            controller_job=helm-install-platform-longhorn
            repair_job=helm-repair-platform-longhorn
            repair_config=helm-repair-platform-longhorn-values
            wait_timeout={{ platform_longhorn_wait_timeout_effective | int }}

            release_state="$(${K} --kubeconfig "${C}" -n "${release_namespace}" get secret \
              -l "owner=helm,name=${release}" -o json 2>/dev/null |
              python3 -c '
            import json
            import sys

            data = json.load(sys.stdin)
            releases = []
            for item in data.get("items", []):
                labels = item.get("metadata", {}).get("labels", {})
                try:
                    revision = int(labels.get("version", "0"))
                except ValueError:
                    revision = 0
                releases.append((revision, labels.get("status", "unknown")))
            if releases:
                revision, status = max(releases)
                print(f"{revision} {status}")
            ' || true)"
            read -r release_revision release_status <<<"${release_state:-0 absent}"
            echo "longhorn_helm_release_revision=${release_revision:-0} status=${release_status:-absent}"

            if [ "${release_status:-absent}" != "failed" ]; then
              echo "action=skip-failed-release-repair reason=latest-release-not-failed"
              exit 0
            fi

            if [ "{{ platform_longhorn_failed_release_repair_effective | ternary('true', 'false') }}" != "true" ]; then
              echo "action=skip-failed-release-repair reason=automatic-repair-disabled"
              exit 0
            fi

            # The RKE2 `reinstall` policy performs an uninstall first. Recover the
            # failed revision with a normal Helm upgrade so volumes and CRs stay
            # in place, then return ownership to the Helm controller.
            job_image=""
            service_account=""
            for _ in $(seq 1 30); do
              job_image="$(${K} --kubeconfig "${C}" -n "${controller_namespace}" \
                get "job/${controller_job}" \
                -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
              service_account="$(${K} --kubeconfig "${C}" -n "${controller_namespace}" \
                get "job/${controller_job}" \
                -o jsonpath='{.spec.template.spec.serviceAccountName}' 2>/dev/null || true)"
              if [ -n "${job_image}" ] && [ -n "${service_account}" ]; then
                break
              fi
              sleep 2
            done
            if [ -z "${job_image}" ] || [ -z "${service_account}" ]; then
              echo "result=fail reason=longhorn-helm-controller-job-template-unavailable" >&2
              exit 1
            fi

            ${K} --kubeconfig "${C}" -n "${controller_namespace}" patch \
              "job/${controller_job}" --type=merge -p '{"spec":{"suspend":true}}' >/dev/null
            ${K} --kubeconfig "${C}" -n "${controller_namespace}" delete \
              "job/${repair_job}" --ignore-not-found=true --wait=true >/dev/null

            values_file="$(mktemp)"
            trap 'rm -f "${values_file}"' EXIT
            ${K} --kubeconfig "${C}" -n "${controller_namespace}" get \
              "helmchart/${release}" -o jsonpath='{.spec.valuesContent}' >"${values_file}"
            test -s "${values_file}"
            ${K} --kubeconfig "${C}" -n "${controller_namespace}" create configmap \
              "${repair_config}" --from-file=values.yaml="${values_file}" \
              --dry-run=client -o yaml | ${K} --kubeconfig "${C}" apply -f - >/dev/null

            cat <<EOF | ${K} --kubeconfig "${C}" apply -f - >/dev/null
            apiVersion: batch/v1
            kind: Job
            metadata:
              name: ${repair_job}
              namespace: ${controller_namespace}
              labels:
                app.kubernetes.io/name: ${release}
                app.kubernetes.io/component: failed-release-repair
            spec:
              backoffLimit: 0
              activeDeadlineSeconds: $((wait_timeout + 120))
              template:
                metadata:
                  labels:
                    app.kubernetes.io/name: ${release}
                    app.kubernetes.io/component: failed-release-repair
                spec:
                  serviceAccountName: ${service_account}
                  restartPolicy: Never
                  containers:
                    - name: helm
                      image: ${job_image}
                      imagePullPolicy: IfNotPresent
                      command: ["/bin/bash", "-ec"]
                      args:
                        - |
                          helm repo add platform-longhorn {{ platform_longhorn_chart_repo_effective | quote }} --force-update
                          helm repo update
                          version_args=()
                          if [ -n {{ platform_longhorn_chart_version_effective | quote }} ]; then
                            version_args=(--version {{ platform_longhorn_chart_version_effective | quote }})
                          fi
                          helm upgrade --install platform-longhorn platform-longhorn/longhorn \
                            --namespace longhorn-system \
                            --create-namespace \
                            --values /config/values.yaml \
                            --wait \
                            --timeout ${wait_timeout}s \
                            --history-max 10 \
                            "\${version_args[@]}"
                      volumeMounts:
                        - name: values
                          mountPath: /config
                          readOnly: true
                  volumes:
                    - name: values
                      configMap:
                        name: ${repair_config}
            EOF

            deadline=$((SECONDS + wait_timeout + 120))
            while [ "${SECONDS}" -lt "${deadline}" ]; do
              complete="$(${K} --kubeconfig "${C}" -n "${controller_namespace}" get \
                "job/${repair_job}" -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"
              failed="$(${K} --kubeconfig "${C}" -n "${controller_namespace}" get \
                "job/${repair_job}" -o jsonpath='{.status.failed}' 2>/dev/null || true)"
              if [ "${complete:-0}" -ge 1 ]; then
                ${K} --kubeconfig "${C}" -n "${controller_namespace}" logs \
                  "job/${repair_job}" --all-containers --tail=160 || true
                echo "action=repair-failed-longhorn-release result=ok previousRevision=${release_revision}"
                ${K} --kubeconfig "${C}" -n "${controller_namespace}" delete \
                  "job/${repair_job}" "configmap/${repair_config}" --ignore-not-found=true --wait=false >/dev/null
                ${K} --kubeconfig "${C}" -n "${controller_namespace}" delete \
                  "job/${controller_job}" --ignore-not-found=true --wait=false >/dev/null
                exit 0
              fi
              if [ "${failed:-0}" -ge 1 ]; then
                echo "result=fail reason=longhorn-in-place-helm-upgrade-failed" >&2
                ${K} --kubeconfig "${C}" -n "${controller_namespace}" logs \
                  "job/${repair_job}" --all-containers --tail=240 >&2 || true
                exit 1
              fi
              sleep 5
            done

            echo "result=fail reason=longhorn-in-place-helm-upgrade-timeout timeoutSeconds=$((wait_timeout + 120))" >&2
            ${K} --kubeconfig "${C}" -n "${controller_namespace}" logs \
              "job/${repair_job}" --all-containers --tail=240 >&2 || true
            exit 1
          args:
            executable: /bin/bash
          register: platform_longhorn_failed_release_repair
          changed_when: "'action=repair-failed-longhorn-release result=ok' in platform_longhorn_failed_release_repair.stdout"
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Check required Longhorn CRDs
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            missing=""
            for crd in {{ platform_longhorn_required_crds | join(' ') }}; do
              if ! "$K" --kubeconfig "$C" get "crd/${crd}" >/dev/null 2>&1; then
                missing="${missing} ${crd}"
              fi
            done
            missing="$(printf '%s' "${missing}" | xargs)"
            printf '%s\n' "${missing}"
            test -z "${missing}"
          args:
            executable: /bin/bash
          register: platform_longhorn_required_crd_check
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Restore missing Longhorn CRDs from upstream manifest
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            url={{ platform_longhorn_crd_manifest_url_effective | quote }}
            tmp="$(mktemp)"
            crds="$(mktemp)"
            cleanup() {
              rm -f "${tmp}" "${crds}"
            }
            trap cleanup EXIT

            curl -fsSL --connect-timeout 20 --max-time 120 "${url}" -o "${tmp}"
            awk '
              /^---[[:space:]]*$/ {
                if (doc ~ /kind:[[:space:]]*CustomResourceDefinition/) {
                  printf "%s", doc
                }
                doc = $0 "\n"
                next
              }
              { doc = doc $0 "\n" }
              END {
                if (doc ~ /kind:[[:space:]]*CustomResourceDefinition/) {
                  printf "%s", doc
                }
              }
            ' "${tmp}" > "${crds}"

            if [ ! -s "${crds}" ]; then
              echo "No CRD documents were extracted from ${url}" >&2
              exit 1
            fi

            "$K" --kubeconfig "$C" apply -f "${crds}"
          args:
            executable: /bin/bash
          register: platform_longhorn_crd_restore
          changed_when: >-
            'created' in platform_longhorn_crd_restore.stdout or
            'configured' in platform_longhorn_crd_restore.stdout
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when:
            - platform_longhorn_crd_repair_enabled_effective | bool
            - platform_longhorn_required_crd_check.stdout | trim | length > 0

        - name: Wait for Longhorn CRDs
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            cleanup_helm_jobs={{ platform_longhorn_cleanup_helm_jobs_effective | ternary('true', 'false') }}
            missing=""
            for crd in {{ platform_longhorn_required_crds | join(' ') }}; do
              if ! "$K" --kubeconfig "$C" get "crd/${crd}" >/dev/null 2>&1; then
                missing="${missing} ${crd}"
              fi
            done
            missing="$(printf '%s' "${missing}" | xargs)"
            if [ -z "${missing}" ]; then
              exit 0
            fi

            if [ "${cleanup_helm_jobs}" = "true" ]; then
              uninstall_failed="$("$K" --kubeconfig "$C" -n longhorn-system get job/longhorn-uninstall \
                -o jsonpath='{.status.failed}' 2>/dev/null || true)"
              helm_uninstall_stuck=""
              for pod in $("$K" --kubeconfig "$C" -n kube-system get pods \
                  -l job-name=helm-install-platform-longhorn -o name 2>/dev/null || true); do
                if "$K" --kubeconfig "$C" -n kube-system logs "${pod}" --tail=80 2>/dev/null |
                    grep -E "uninstalling|Uninstalling failed helm chart|longhorn-uninstall not ready" >/dev/null; then
                  helm_uninstall_stuck=1
                fi
              done
              if [ -n "${uninstall_failed}" ] || [ -n "${helm_uninstall_stuck}" ]; then
                echo "Detected stalled Longhorn Helm uninstall hook while waiting for CRDs; deleting Helm/uninstall jobs so RKE2 can retry." >&2
                "$K" --kubeconfig "$C" -n longhorn-system delete job/longhorn-uninstall \
                  --ignore-not-found=true --wait=false || true
                "$K" --kubeconfig "$C" -n longhorn-system delete pods \
                  -l job-name=longhorn-uninstall --ignore-not-found=true --wait=false || true
                "$K" --kubeconfig "$C" -n kube-system delete job/helm-install-platform-longhorn \
                  --ignore-not-found=true --wait=false || true
              fi
            fi

            echo "Missing Longhorn CRDs: ${missing}" >&2
            exit 1
          args:
            executable: /bin/bash
          register: platform_longhorn_crds
          retries: "{{ (((platform_longhorn_wait_timeout_effective | int) / 10) | round(0, 'ceil') | int) + 1 }}"
          delay: 10
          until: platform_longhorn_crds.rc == 0
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Restart Longhorn manager after CRD repair
          ansible.builtin.command:
            argv:
              - /var/lib/rancher/rke2/bin/kubectl
              - --kubeconfig
              - /etc/rancher/rke2/rke2.yaml
              - -n
              - longhorn-system
              - rollout
              - restart
              - daemonset/longhorn-manager
          register: platform_longhorn_crd_repair_manager_restart
          changed_when: "'restarted' in platform_longhorn_crd_repair_manager_restart.stdout"
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when:
            - platform_longhorn_crd_repair_enabled_effective | bool
            - platform_longhorn_required_crd_check.stdout | trim | length > 0

        - name: Clean Longhorn uninstall job created by chart hooks
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            "$K" --kubeconfig "$C" -n longhorn-system delete job/longhorn-uninstall \
              --ignore-not-found=true --wait=false
            "$K" --kubeconfig "$C" -n longhorn-system delete pods \
              -l job-name=longhorn-uninstall --ignore-not-found=true --wait=false
          args:
            executable: /bin/bash
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when: platform_longhorn_cleanup_helm_jobs_effective | bool

        - name: Collect Longhorn images for node pre-pull
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            images="$("$K" --kubeconfig "$C" -n longhorn-system get pods \
              -o jsonpath='{range .items[*].spec.initContainers[*]}{.image}{"\n"}{end}{range .items[*].spec.containers[*]}{.image}{"\n"}{end}' |
              sort -u)"
            test -n "${images}"
            printf '%s\n' "${images}"
          args:
            executable: /bin/bash
          register: platform_longhorn_images
          retries: "{{ (((platform_longhorn_wait_timeout_effective | int) / 15) | round(0, 'ceil') | int) + 1 }}"
          delay: 15
          until: platform_longhorn_images.rc == 0
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when: platform_longhorn_prepull_images_effective | bool

        - name: Publish Longhorn image list to all nodes
          ansible.builtin.set_fact:
            platform_longhorn_image_list: "{{ platform_longhorn_images.stdout_lines | default([]) }}"
          when: platform_longhorn_prepull_images_effective | bool

        - name: Pre-pull Longhorn images on all RKE2 nodes
          ansible.builtin.shell: |
            set -o pipefail
            CRICTL=/var/lib/rancher/rke2/bin/crictl
            image="{{ item }}"
            if [ ! -x "${CRICTL}" ]; then
              echo "RKE2 crictl not found at ${CRICTL}" >&2
              exit 1
            fi

            crictl_args=(--timeout "{{ platform_longhorn_image_pull_timeout_effective }}s")
            if [ -S /run/k3s/containerd/containerd.sock ]; then
              crictl_args+=(--runtime-endpoint unix:///run/k3s/containerd/containerd.sock)
            elif [ -S /run/containerd/containerd.sock ]; then
              crictl_args+=(--runtime-endpoint unix:///run/containerd/containerd.sock)
            fi

            if "${CRICTL}" "${crictl_args[@]}" inspecti "${image}" >/dev/null 2>&1; then
              echo "Already present on $(hostname -f 2>/dev/null || hostname): ${image}"
              exit 0
            fi

            echo "Pulling on $(hostname -f 2>/dev/null || hostname): ${image}"
            if command -v timeout >/dev/null 2>&1; then
              timeout --preserve-status "{{ platform_longhorn_image_pull_timeout_effective }}" \
                "${CRICTL}" "${crictl_args[@]}" pull "${image}"
            else
              "${CRICTL}" "${crictl_args[@]}" pull "${image}"
            fi
          args:
            executable: /bin/bash
          register: platform_longhorn_image_prepull
          retries: "{{ platform_longhorn_image_pull_retries_effective }}"
          delay: "{{ platform_longhorn_image_pull_retry_delay_effective }}"
          until: platform_longhorn_image_prepull.rc == 0
          loop: "{{ platform_longhorn_image_list }}"
          loop_control:
            label: "{{ item }}"
          when: platform_longhorn_prepull_images_effective | bool

        - name: Restart Longhorn pods stuck in old image-pull backoff after pre-pull
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            pods="$("$K" --kubeconfig "$C" -n longhorn-system get pods \
              -o jsonpath='{range .items[*]}{.metadata.name}{" "}{range .status.containerStatuses[*]}{.state.waiting.reason}{" "}{end}{"\n"}{end}' |
              awk '/ImagePullBackOff|ErrImagePull|InvalidImageName/ { print $1 }')"
            if [ -z "${pods}" ]; then
              echo "No Longhorn pods are in image-pull backoff."
              exit 0
            fi

            echo "Deleting Longhorn pods stuck in image-pull backoff:"
            printf '%s\n' ${pods}
            for pod in ${pods}; do
              "$K" --kubeconfig "$C" -n longhorn-system delete "pod/${pod}" --wait=false
            done
          args:
            executable: /bin/bash
          register: platform_longhorn_backoff_restart
          changed_when: "'Deleting Longhorn pods stuck in image-pull backoff' in platform_longhorn_backoff_restart.stdout"
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when: platform_longhorn_prepull_images_effective | bool

        - name: Clean Longhorn uninstall job after pod backoff restart
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            "$K" --kubeconfig "$C" -n longhorn-system delete job/longhorn-uninstall \
              --ignore-not-found=true --wait=false
            "$K" --kubeconfig "$C" -n longhorn-system delete pods \
              -l job-name=longhorn-uninstall --ignore-not-found=true --wait=false
          args:
            executable: /bin/bash
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when: platform_longhorn_cleanup_helm_jobs_effective | bool

        - name: Stop early when Longhorn image pull failures are present
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            pull_failures="$("$K" --kubeconfig "$C" -n longhorn-system get pods \
              -o jsonpath='{range .items[*]}{.metadata.name}{" "}{range .status.containerStatuses[*]}{.name}={.state.waiting.reason}{" "}{end}{"\n"}{end}' |
              grep -E 'ImagePullBackOff|ErrImagePull|InvalidImageName' || true)"
            if [ -n "${pull_failures}" ]; then
              echo "Longhorn image pull failure detected:" >&2
              printf '%s\n' "${pull_failures}" >&2
              echo "===== Longhorn images =====" >&2
              "$K" --kubeconfig "$C" -n longhorn-system get pods \
                -o jsonpath='{range .items[*].spec.initContainers[*]}init:{.image}{"\n"}{end}{range .items[*].spec.containers[*]}container:{.image}{"\n"}{end}' |
                sort -u >&2 || true
              echo "===== Longhorn pod events =====" >&2
              "$K" --kubeconfig "$C" -n longhorn-system describe pods |
                sed -n '/Events:/,$p' >&2 || true
              exit 1
            fi
          args:
            executable: /bin/bash
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when: platform_longhorn_image_pull_fast_fail_effective | bool

        - name: Wait for core Longhorn workloads
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            pull_failures="$("$K" --kubeconfig "$C" -n longhorn-system get pods \
              -o jsonpath='{range .items[*]}{.metadata.name}{" "}{range .status.containerStatuses[*]}{.name}={.state.waiting.reason}{" "}{end}{"\n"}{end}' |
              grep -E 'ImagePullBackOff|ErrImagePull|InvalidImageName' || true)"
            if [ -n "${pull_failures}" ]; then
              echo "Longhorn image pull failure detected:" >&2
              printf '%s\n' "${pull_failures}" >&2
              echo "===== Longhorn images =====" >&2
              "$K" --kubeconfig "$C" -n longhorn-system get pods \
                -o jsonpath='{range .items[*].spec.initContainers[*]}init:{.image}{"\n"}{end}{range .items[*].spec.containers[*]}container:{.image}{"\n"}{end}' |
                sort -u >&2 || true
              echo "===== Longhorn pod events =====" >&2
              "$K" --kubeconfig "$C" -n longhorn-system describe pods |
                sed -n '/Events:/,$p' >&2 || true
              exit 1
            fi
            "$K" --kubeconfig "$C" -n longhorn-system get daemonset/longhorn-manager >/dev/null
            "$K" --kubeconfig "$C" -n longhorn-system rollout status daemonset/longhorn-manager --timeout=30s
            if "$K" --kubeconfig "$C" -n longhorn-system get daemonset/longhorn-csi-plugin >/dev/null 2>&1; then
              "$K" --kubeconfig "$C" -n longhorn-system rollout status daemonset/longhorn-csi-plugin --timeout=30s
            fi
            for deployment in longhorn-driver-deployer longhorn-ui; do
              if "$K" --kubeconfig "$C" -n longhorn-system get "deployment/${deployment}" >/dev/null 2>&1; then
                "$K" --kubeconfig "$C" -n longhorn-system rollout status "deployment/${deployment}" --timeout=30s
              fi
            done
          args:
            executable: /bin/bash
          register: platform_longhorn_workloads
          retries: "{{ (((platform_longhorn_wait_timeout_effective | int) / 30) | round(0, 'ceil') | int) + 1 }}"
          delay: 10
          until: platform_longhorn_workloads.rc == 0
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Wait for Longhorn node objects
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            missing=""
            for node in $("$K" --kubeconfig "$C" get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'); do
              if ! "$K" --kubeconfig "$C" -n longhorn-system get "nodes.longhorn.io/${node}" >/dev/null 2>&1; then
                missing="${missing} ${node}"
              fi
            done
            missing="$(printf '%s' "${missing}" | xargs)"
            echo "===== Longhorn nodes ====="
            "$K" --kubeconfig "$C" -n longhorn-system get nodes.longhorn.io -o wide || true
            if [ -n "${missing}" ]; then
              echo "Missing Longhorn node objects: ${missing}" >&2
              exit 1
            fi
          args:
            executable: /bin/bash
          register: platform_longhorn_node_objects
          retries: "{{ (((platform_longhorn_wait_timeout_effective | int) / 10) | round(0, 'ceil') | int) + 1 }}"
          delay: 10
          until: platform_longhorn_node_objects.rc == 0
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Reconcile live Longhorn storage overprovisioning setting
          ansible.builtin.shell: |
            set -euo pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            setting=storage-over-provisioning-percentage
            desired={{ platform_longhorn_storage_over_provisioning_percentage_effective | int }}

            current="$("$K" --kubeconfig "$C" -n longhorn-system get \
              "settings.longhorn.io/${setting}" -o jsonpath='{.value}' 2>/dev/null || true)"
            if [ -z "${current}" ]; then
              echo "Longhorn setting is not available yet: ${setting}" >&2
              exit 1
            fi

            if [ "${current}" != "${desired}" ]; then
              "$K" --kubeconfig "$C" -n longhorn-system patch \
                "settings.longhorn.io/${setting}" --type=merge \
                -p "{\"value\":\"${desired}\"}" >/dev/null
              echo "Longhorn live setting reconciled: setting=${setting} previous=${current} desired=${desired}"
            else
              echo "Longhorn live setting already reconciled: setting=${setting} value=${current}"
            fi

            observed="$("$K" --kubeconfig "$C" -n longhorn-system get \
              "settings.longhorn.io/${setting}" -o jsonpath='{.value}')"
            if [ "${observed}" != "${desired}" ]; then
              echo "result=fail reason=longhorn-live-setting-reconciliation-failed setting=${setting} desired=${desired} observed=${observed:-missing}" >&2
              exit 1
            fi
          args:
            executable: /bin/bash
          register: platform_longhorn_storage_over_provisioning_setting
          retries: 30
          delay: 5
          until: platform_longhorn_storage_over_provisioning_setting.rc == 0
          changed_when: "'Longhorn live setting reconciled:' in platform_longhorn_storage_over_provisioning_setting.stdout"
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Configure Longhorn default disks on all nodes
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            disk_path={{ platform_longhorn_default_disk_path_effective | quote }}
            changed=0

            for node in $("$K" --kubeconfig "$C" get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'); do
              disk_paths="$("$K" --kubeconfig "$C" -n longhorn-system get "nodes.longhorn.io/${node}" \
                -o jsonpath='{range .spec.disks[*]}{.path}{"\n"}{end}' 2>/dev/null || true)"
              if [ -n "${disk_paths}" ]; then
                echo "${node} already has Longhorn disk configuration."
                continue
              fi

              echo "Adding default Longhorn disk on ${node}: ${disk_path}"
              "$K" --kubeconfig "$C" -n longhorn-system patch "nodes.longhorn.io/${node}" \
                --type=merge \
                -p "{\"spec\":{\"allowScheduling\":true,\"disks\":{\"default-disk\":{\"path\":\"${disk_path}\",\"allowScheduling\":true,\"storageReserved\":0,\"tags\":[],\"diskType\":\"filesystem\",\"evictionRequested\":false}}}}"
              changed=1
            done

            echo "===== Longhorn node disk state ====="
            "$K" --kubeconfig "$C" -n longhorn-system get nodes.longhorn.io -o yaml |
              sed -n '/name: node-/p; /disks:/,/conditions:/p' || true

            if [ "${changed}" -eq 0 ]; then
              echo "No Longhorn disk repair changes were required."
            fi
            exit 0
          args:
            executable: /bin/bash
          register: platform_longhorn_default_disk_config
          changed_when: "'Adding default Longhorn disk' in platform_longhorn_default_disk_config.stdout"
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Configure Longhorn automatic extra disk on each node
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            default_path={{ platform_longhorn_default_disk_path_effective | quote }}
            extra_path={{ platform_longhorn_auto_extra_disk_path_effective | quote }}
            min_available_gib={{ platform_longhorn_auto_extra_disk_min_available_gib_effective }}
            min_available_bytes=$(( min_available_gib * 1024 * 1024 * 1024 ))

            mkdir -p "${extra_path}"

            default_source="$(df -P "${default_path}" | awk 'NR == 2 { print $1 }')"
            extra_source="$(df -P "${extra_path}" | awk 'NR == 2 { print $1 }')"
            default_fsid="$(stat -f -c '%i' "${default_path}" 2>/dev/null || true)"
            extra_fsid="$(stat -f -c '%i' "${extra_path}" 2>/dev/null || true)"
            extra_available_bytes="$(df -PB1 "${extra_path}" | awk 'NR == 2 { print $4 }')"
            node_name="$(hostname -s)"

            eligible=false
            reason=""
            if [ -z "${default_source}" ] || [ -z "${extra_source}" ] || [ -z "${extra_available_bytes}" ] || [ -z "${default_fsid}" ] || [ -z "${extra_fsid}" ]; then
              reason="df-detection-failed"
            elif [ "${default_source}" = "${extra_source}" ]; then
              reason="same-filesystem-as-default-disk"
            elif [ "${default_fsid}" = "${extra_fsid}" ]; then
              reason="same-filesystem-id-as-default-disk"
            elif [ "${extra_available_bytes}" -lt "${min_available_bytes}" ]; then
              reason="insufficient-extra-disk-free-space"
            else
              eligible=true
              reason="extra-disk-eligible"
            fi

            printf 'Longhorn automatic extra disk candidate: node=%s path=%s eligible=%s reason=%s default_source=%s extra_source=%s default_fsid=%s extra_fsid=%s extra_available_bytes=%s min_available_bytes=%s\n' \
              "${node_name}" \
              "${extra_path}" \
              "${eligible}" \
              "${reason}" \
              "${default_source:-unknown}" \
              "${extra_source:-unknown}" \
              "${default_fsid:-unknown}" \
              "${extra_fsid:-unknown}" \
              "${extra_available_bytes:-0}" \
              "${min_available_bytes}"

            if [ "${eligible}" != "true" ]; then
              if [ "${reason}" != "same-filesystem-as-default-disk" ] &&
                [ "${reason}" != "same-filesystem-id-as-default-disk" ]; then
                exit 0
              fi

              python3 - "${node_name}" "${reason}" "{{ platform_longhorn_wait_timeout_effective }}" <<'PY'
            import json
            import math
            import subprocess
            import sys
            import time

            node_name = sys.argv[1]
            reason = sys.argv[2]
            evacuation_timeout = int(sys.argv[3])
            kubectl = [
                "/var/lib/rancher/rke2/bin/kubectl",
                "--kubeconfig",
                "/etc/rancher/rke2/rke2.yaml",
                "-n",
                "longhorn-system",
            ]


            def run_kubectl(args):
                return subprocess.run(
                    kubectl + args,
                    text=True,
                    capture_output=True,
                )


            def get_node():
                result = run_kubectl(["get", f"nodes.longhorn.io/{node_name}", "-o", "json"])
                if result.returncode != 0:
                    return None, result
                return json.loads(result.stdout), result


            node, result = get_node()
            if node is None:
                print(
                    f"Longhorn automatic extra disk cleanup skipped: node={node_name} "
                    "reason=longhorn-node-object-absent"
                )
                raise SystemExit(0)

            disk_name = "auto-extra-disk"
            spec_disks = node.get("spec", {}).get("disks") or {}
            if disk_name not in spec_disks:
                print(
                    f"Longhorn stale automatic extra disk cleanup: node={node_name} "
                    f"disk={disk_name} action=absent reason={reason}"
                )
                raise SystemExit(0)

            status = (node.get("status", {}).get("diskStatus") or {}).get(disk_name) or {}
            scheduled_replicas = status.get("scheduledReplica") or {}
            scheduled_backing_images = status.get("scheduledBackingImage") or {}
            storage_scheduled = int(status.get("storageScheduled") or 0)
            disk_uuid = status.get("diskUUID") or ""

            replica_items = []
            if disk_uuid or "default-disk" in spec_disks:
                replicas_result = run_kubectl(["get", "replicas.longhorn.io", "-o", "json"])
                if replicas_result.returncode != 0:
                    sys.stderr.write(
                        (replicas_result.stderr or "") + (replicas_result.stdout or "")
                    )
                    raise SystemExit(replicas_result.returncode)
                replicas = json.loads(replicas_result.stdout)
                replica_items = replicas.get("items", [])


            def replicas_for(current_disk_uuid):
                if not current_disk_uuid:
                    return []
                return [
                    replica
                    for replica in replica_items
                    if replica.get("spec", {}).get("diskID") == current_disk_uuid
                    and not replica.get("metadata", {}).get("deletionTimestamp")
                ]


            def replica_names_for(current_disk_uuid):
                return [
                    replica.get("metadata", {}).get("name", "")
                    for replica in replicas_for(current_disk_uuid)
                ]


            def request_replica_evictions(replicas_to_evict):
                pending = [
                    replica
                    for replica in replicas_to_evict
                    if not replica.get("spec", {}).get("evictionRequested", False)
                ]
                already_requested = len(replicas_to_evict) - len(pending)
                if not pending:
                    return {
                        "requested": 0,
                        "already_requested": already_requested,
                        "linked_clone_replicas": [],
                        "error": "",
                    }

                volumes_result = run_kubectl(
                    ["get", "volumes.longhorn.io", "-o", "json"]
                )
                if volumes_result.returncode != 0:
                    return {
                        "requested": 0,
                        "already_requested": already_requested,
                        "linked_clone_replicas": [],
                        "error": (
                            (volumes_result.stderr or "")
                            + (volumes_result.stdout or "")
                        ),
                    }
                volume_items = json.loads(volumes_result.stdout).get("items", [])
                linked_clone_volumes = {
                    volume.get("metadata", {}).get("name", "")
                    for volume in volume_items
                    if volume.get("spec", {}).get("cloneMode") == "linked-clone"
                }
                linked_clone_replicas = [
                    replica.get("metadata", {}).get("name", "")
                    for replica in pending
                    if replica.get("spec", {}).get("volumeName")
                    in linked_clone_volumes
                ]
                requested = 0
                for replica in pending:
                    replica_name = replica.get("metadata", {}).get("name", "")
                    if not replica_name or replica_name in linked_clone_replicas:
                        continue
                    patch = json.dumps(
                        {"spec": {"evictionRequested": True}}
                    )
                    patch_result = run_kubectl(
                        [
                            "patch",
                            f"replicas.longhorn.io/{replica_name}",
                            "--type=merge",
                            "-p",
                            patch,
                        ]
                    )
                    if patch_result.returncode != 0:
                        return {
                            "requested": requested,
                            "already_requested": already_requested,
                            "linked_clone_replicas": linked_clone_replicas,
                            "error": (
                                (patch_result.stderr or "")
                                + (patch_result.stdout or "")
                            ),
                        }
                    requested += 1
                return {
                    "requested": requested,
                    "already_requested": already_requested,
                    "linked_clone_replicas": linked_clone_replicas,
                    "error": "",
                }


            def condition_is_true(disk_status, condition_type):
                return any(
                    condition.get("type") == condition_type
                    and condition.get("status") == "True"
                    for condition in disk_status.get("conditions", [])
                )


            def evacuation_capacity_state(replicas_to_evict):
                nodes_result = run_kubectl(
                    ["get", "nodes.longhorn.io", "-o", "json"]
                )
                setting_result = run_kubectl(
                    [
                        "get",
                        "settings.longhorn.io/storage-over-provisioning-percentage",
                        "-o",
                        "json",
                    ]
                )
                volumes_result = run_kubectl(
                    ["get", "volumes.longhorn.io", "-o", "json"]
                )
                failed_results = [
                    result
                    for result in (nodes_result, setting_result, volumes_result)
                    if result.returncode != 0
                ]
                if failed_results:
                    return {
                        "error": "".join(
                            (result.stderr or "") + (result.stdout or "")
                            for result in failed_results
                        )
                    }

                nodes = json.loads(nodes_result.stdout).get("items", [])
                setting = json.loads(setting_result.stdout)
                try:
                    over_provisioning_percentage = int(setting.get("value") or 100)
                except (TypeError, ValueError):
                    over_provisioning_percentage = 100

                candidate_disk_count = 0
                total_maximum = 0
                total_scheduled = 0
                for longhorn_node in nodes:
                    node_spec = longhorn_node.get("spec", {})
                    if not node_spec.get("allowScheduling", False):
                        continue
                    spec_disks = node_spec.get("disks") or {}
                    status_disks = (
                        longhorn_node.get("status", {}).get("diskStatus") or {}
                    )
                    for current_disk_name, current_disk_spec in spec_disks.items():
                        if not current_disk_spec.get("allowScheduling", False):
                            continue
                        current_disk_status = status_disks.get(current_disk_name) or {}
                        if not condition_is_true(current_disk_status, "Ready"):
                            continue
                        candidate_disk_count += 1
                        storage_reserved = int(
                            current_disk_spec.get("storageReserved") or 0
                        )
                        storage_maximum = max(
                            0,
                            int(current_disk_status.get("storageMaximum") or 0)
                            - storage_reserved,
                        )
                        total_maximum += storage_maximum
                        total_scheduled += int(
                            current_disk_status.get("storageScheduled") or 0
                        )

                remaining_replica_bytes = sum(
                    int(replica.get("spec", {}).get("volumeSize") or 0)
                    for replica in replicas_to_evict
                )
                provisioned_limit = (
                    total_maximum * over_provisioning_percentage // 100
                )
                logical_headroom = max(0, provisioned_limit - total_scheduled)
                required_evacuation_percentage = (
                    math.ceil(
                        (total_scheduled + remaining_replica_bytes)
                        * 100
                        / total_maximum
                    )
                    if total_maximum > 0
                    else 0
                )

                volumes = json.loads(volumes_result.stdout).get("items", [])
                all_volume_bytes = 0
                bound_volume_bytes = 0
                released_volume_count = 0
                for volume in volumes:
                    volume_spec = volume.get("spec", {})
                    desired_bytes = int(volume_spec.get("size") or 0) * int(
                        volume_spec.get("numberOfReplicas") or 0
                    )
                    all_volume_bytes += desired_bytes
                    pv_status = (
                        volume.get("status", {})
                        .get("kubernetesStatus", {})
                        .get("pvStatus", "")
                    )
                    if pv_status == "Bound":
                        bound_volume_bytes += desired_bytes
                    elif pv_status == "Released":
                        released_volume_count += 1

                def required_percentage(desired_bytes):
                    if total_maximum <= 0:
                        return 0
                    return math.ceil(desired_bytes * 100 / total_maximum)

                return {
                    "error": "",
                    "over_provisioning_percentage": over_provisioning_percentage,
                    "candidate_disk_count": candidate_disk_count,
                    "total_maximum": total_maximum,
                    "total_scheduled": total_scheduled,
                    "logical_headroom": logical_headroom,
                    "remaining_replica_bytes": remaining_replica_bytes,
                    "required_evacuation_percentage": required_evacuation_percentage,
                    "bound_volume_percentage": required_percentage(
                        bound_volume_bytes
                    ),
                    "all_volume_percentage": required_percentage(all_volume_bytes),
                    "released_volume_count": released_volume_count,
                }


            replica_names = replica_names_for(disk_uuid)

            if (
                scheduled_replicas
                or scheduled_backing_images
                or storage_scheduled > 0
                or replica_names
            ):
                if set(spec_disks) == {disk_name}:
                    print(
                        f"Longhorn automatic extra disk retained as active node storage: "
                        f"node={node_name} disk={disk_name} action=retain-active-extra-disk "
                        f"reason={reason} scheduledReplicas={len(scheduled_replicas)} "
                        f"scheduledBackingImages={len(scheduled_backing_images)} "
                        f"storageScheduled={storage_scheduled} "
                        f"replicaObjects={len(replica_names)}"
                    )
                    raise SystemExit(0)

                companion_name = "default-disk"
                companion_spec = spec_disks.get(companion_name) or {}
                companion_status = (
                    node.get("status", {}).get("diskStatus") or {}
                ).get(companion_name) or {}
                companion_uuid = companion_status.get("diskUUID") or ""
                companion_eviction_requested = bool(
                    companion_spec.get("evictionRequested", False)
                )
                companion_path = companion_spec.get("path") or ""
                companion_path_replica_names = [
                    replica.get("metadata", {}).get("name", "")
                    for replica in replica_items
                    if replica.get("spec", {}).get("nodeID") == node_name
                    and replica.get("spec", {}).get("diskPath") == companion_path
                    and not replica.get("metadata", {}).get("deletionTimestamp")
                ]
                companion_blocking_path_replica_names = (
                    []
                    if companion_uuid or companion_eviction_requested
                    else companion_path_replica_names
                )
                if companion_name in spec_disks:
                    companion_replicas = companion_status.get("scheduledReplica") or {}
                    companion_backing_images = (
                        companion_status.get("scheduledBackingImage") or {}
                    )
                    companion_storage_scheduled = int(
                        companion_status.get("storageScheduled") or 0
                    )
                    companion_replica_names = replica_names_for(
                        companion_uuid
                    )
                    if not (
                        companion_replicas
                        or companion_backing_images
                        or companion_storage_scheduled > 0
                        or companion_replica_names
                        or companion_blocking_path_replica_names
                    ):
                        disable_companion_patch = json.dumps(
                            {
                                "spec": {
                                    "disks": {
                                        companion_name: {"allowScheduling": False}
                                    }
                                }
                            }
                        )
                        disable_companion_result = run_kubectl(
                            [
                                "patch",
                                f"nodes.longhorn.io/{node_name}",
                                "--type=merge",
                                "-p",
                                disable_companion_patch,
                            ]
                        )
                        if disable_companion_result.returncode != 0:
                            sys.stderr.write(
                                (disable_companion_result.stderr or "")
                                + (disable_companion_result.stdout or "")
                            )
                            raise SystemExit(disable_companion_result.returncode)

                        delete_companion_patch = json.dumps(
                            {"spec": {"disks": {companion_name: None}}}
                        )
                        last_error = ""
                        for _ in range(12):
                            delete_companion_result = run_kubectl(
                                [
                                    "patch",
                                    f"nodes.longhorn.io/{node_name}",
                                    "--type=merge",
                                    "-p",
                                    delete_companion_patch,
                                ]
                            )
                            node, get_result = get_node()
                            if node is not None and companion_name not in (
                                node.get("spec", {}).get("disks") or {}
                            ):
                                print(
                                    f"Longhorn empty default companion cleanup: "
                                    f"node={node_name} disk={companion_name} "
                                    "action=remove-empty-default-companion"
                                )
                                print(
                                    f"Longhorn automatic extra disk retained as active node storage: "
                                    f"node={node_name} disk={disk_name} "
                                    "action=retain-active-extra-disk"
                                )
                                raise SystemExit(0)
                            last_error = (
                                (delete_companion_result.stderr or "")
                                + (delete_companion_result.stdout or "")
                                + (get_result.stderr or "")
                            )
                            time.sleep(5)

                        sys.stderr.write(last_error)
                        print(
                            "result=fail reason=empty-default-companion-removal-timeout "
                            f"node={node_name} disk={companion_name}",
                            file=sys.stderr,
                        )
                        raise SystemExit(1)

                    evacuation_patch = json.dumps(
                        {
                            "spec": {
                                "disks": {
                                    disk_name: {
                                        "allowScheduling": True,
                                        "evictionRequested": False,
                                    },
                                    companion_name: {
                                        "allowScheduling": False,
                                        "evictionRequested": True,
                                    }
                                }
                            }
                        }
                    )
                    evacuation_result = run_kubectl(
                        [
                            "patch",
                            f"nodes.longhorn.io/{node_name}",
                            "--type=merge",
                            "-p",
                            evacuation_patch,
                        ]
                    )
                    if evacuation_result.returncode != 0:
                        sys.stderr.write(
                            (evacuation_result.stderr or "")
                            + (evacuation_result.stdout or "")
                        )
                        raise SystemExit(evacuation_result.returncode)

                    companion_replica_items = replicas_for(companion_uuid)
                    eviction_bridge = request_replica_evictions(
                        companion_replica_items
                    )
                    if eviction_bridge["error"]:
                        sys.stderr.write(eviction_bridge["error"])
                        print(
                            "result=fail "
                            "reason=default-companion-replica-eviction-request-failed "
                            f"node={node_name} disk={companion_name}",
                            file=sys.stderr,
                        )
                        raise SystemExit(5)
                    if eviction_bridge["linked_clone_replicas"]:
                        print(
                            "result=fail "
                            "reason=linked-clone-blocks-default-companion-evacuation "
                            f"node={node_name} disk={companion_name} "
                            "replicas="
                            + ",".join(
                                eviction_bridge["linked_clone_replicas"]
                            ),
                            file=sys.stderr,
                        )
                        raise SystemExit(4)
                    print(
                        "Longhorn duplicate disk replica eviction bridge: "
                        f"node={node_name} disk={companion_name} "
                        "action=request-replica-eviction-direct "
                        f"requested={eviction_bridge['requested']} "
                        "alreadyRequested="
                        f"{eviction_bridge['already_requested']}"
                    )

                    print(
                        f"Longhorn duplicate default companion evacuation requested: "
                        f"node={node_name} disk={companion_name} "
                        "action=request-default-companion-evacuation "
                        f"replicaObjects={len(companion_replica_names)} "
                        f"pathReplicaObjects={len(companion_path_replica_names)} "
                        f"blockingPathReplicaObjects={len(companion_blocking_path_replica_names)}"
                    )
                    deadline = time.monotonic() + evacuation_timeout
                    last_state = "evacuation-state-unavailable"
                    last_replica_count = len(companion_replica_items)
                    stalled_since = time.monotonic()
                    while time.monotonic() < deadline:
                        time.sleep(10)
                        node, get_result = get_node()
                        if node is None:
                            last_state = (get_result.stderr or get_result.stdout or "")
                            continue

                        current_spec_disks = node.get("spec", {}).get("disks") or {}
                        if companion_name not in current_spec_disks:
                            print(
                                f"Longhorn evacuated default companion cleanup: "
                                f"node={node_name} disk={companion_name} "
                                "action=remove-evacuated-default-companion"
                            )
                            print(
                                f"Longhorn automatic extra disk retained as active node storage: "
                                f"node={node_name} disk={disk_name} "
                                "action=retain-active-extra-disk"
                            )
                            raise SystemExit(0)

                        replicas_result = run_kubectl(
                            ["get", "replicas.longhorn.io", "-o", "json"]
                        )
                        if replicas_result.returncode != 0:
                            last_state = (
                                (replicas_result.stderr or "")
                                + (replicas_result.stdout or "")
                            )
                            continue
                        replica_items = json.loads(replicas_result.stdout).get("items", [])
                        current_status = (
                            node.get("status", {}).get("diskStatus") or {}
                        ).get(companion_name) or {}
                        current_companion_spec = (
                            current_spec_disks.get(companion_name) or {}
                        )
                        current_eviction_requested = bool(
                            current_companion_spec.get("evictionRequested", False)
                        )
                        current_uuid = current_status.get("diskUUID") or ""
                        current_replicas = current_status.get("scheduledReplica") or {}
                        current_backing_images = (
                            current_status.get("scheduledBackingImage") or {}
                        )
                        current_storage_scheduled = int(
                            current_status.get("storageScheduled") or 0
                        )
                        current_replica_items = replicas_for(current_uuid)
                        current_replica_names = [
                            replica.get("metadata", {}).get("name", "")
                            for replica in current_replica_items
                        ]
                        eviction_bridge = request_replica_evictions(
                            current_replica_items
                        )
                        if eviction_bridge["error"]:
                            last_state = (
                                "replicaEvictionRequestError="
                                + eviction_bridge["error"].replace("\n", " ")
                            )
                            continue
                        if eviction_bridge["linked_clone_replicas"]:
                            print(
                                "result=fail "
                                "reason=linked-clone-blocks-default-companion-evacuation "
                                f"node={node_name} disk={companion_name} "
                                "replicas="
                                + ",".join(
                                    eviction_bridge["linked_clone_replicas"]
                                ),
                                file=sys.stderr,
                            )
                            raise SystemExit(4)
                        current_replica_count = len(current_replica_items)
                        if current_replica_count < last_replica_count:
                            last_replica_count = current_replica_count
                            stalled_since = time.monotonic()
                        all_replica_evictions_requested = (
                            eviction_bridge["already_requested"]
                            + eviction_bridge["requested"]
                            == current_replica_count
                        )
                        if (
                            current_replica_count > 0
                            and all_replica_evictions_requested
                            and time.monotonic() - stalled_since >= 60
                        ):
                            capacity = evacuation_capacity_state(
                                current_replica_items
                            )
                            if capacity.get("error"):
                                last_state = (
                                    "capacityCheckError="
                                    + capacity["error"].replace("\n", " ")
                                )
                            elif (
                                capacity["logical_headroom"]
                                < capacity["remaining_replica_bytes"]
                            ):
                                print(
                                    "result=fail "
                                    "reason=default-companion-evacuation-capacity-insufficient "
                                    f"node={node_name} disk={companion_name} "
                                    "overProvisioningPercentage="
                                    f"{capacity['over_provisioning_percentage']} "
                                    f"candidateDisks={capacity['candidate_disk_count']} "
                                    f"logicalHeadroomBytes={capacity['logical_headroom']} "
                                    "remainingEvictionReplicaBytes="
                                    f"{capacity['remaining_replica_bytes']} "
                                    "requiredEvacuationOverProvisioningPercentage="
                                    f"{capacity['required_evacuation_percentage']} "
                                    "boundVolumeProvisioningPercentage="
                                    f"{capacity['bound_volume_percentage']} "
                                    "allVolumeProvisioningPercentage="
                                    f"{capacity['all_volume_percentage']} "
                                    "releasedVolumeCount="
                                    f"{capacity['released_volume_count']} "
                                    "action=add-dedicated-storage-or-configure-reviewed-overprovisioning",
                                    file=sys.stderr,
                                )
                                raise SystemExit(6)
                        current_path_replica_names = [
                            replica.get("metadata", {}).get("name", "")
                            for replica in replica_items
                            if replica.get("spec", {}).get("nodeID") == node_name
                            and replica.get("spec", {}).get("diskPath") == companion_path
                            and not replica.get("metadata", {}).get("deletionTimestamp")
                        ]
                        current_blocking_path_replica_names = (
                            []
                            if current_uuid or current_eviction_requested
                            else current_path_replica_names
                        )
                        last_state = (
                            f"scheduledReplicas={len(current_replicas)} "
                            f"scheduledBackingImages={len(current_backing_images)} "
                            f"storageScheduled={current_storage_scheduled} "
                            f"replicaObjects={len(current_replica_names)} "
                            "evictionRequestedReplicaObjects="
                            f"{eviction_bridge['already_requested'] + eviction_bridge['requested']} "
                            f"pathReplicaObjects={len(current_path_replica_names)} "
                            f"blockingPathReplicaObjects={len(current_blocking_path_replica_names)}"
                        )
                        if (
                            current_replicas
                            or current_backing_images
                            or current_storage_scheduled > 0
                            or current_replica_names
                            or current_blocking_path_replica_names
                        ):
                            continue

                        delete_companion_patch = json.dumps(
                            {"spec": {"disks": {companion_name: None}}}
                        )
                        delete_companion_result = run_kubectl(
                            [
                                "patch",
                                f"nodes.longhorn.io/{node_name}",
                                "--type=merge",
                                "-p",
                                delete_companion_patch,
                            ]
                        )
                        if delete_companion_result.returncode != 0:
                            last_state = (
                                (delete_companion_result.stderr or "")
                                + (delete_companion_result.stdout or "")
                            )
                            continue

                    print(
                        f"result=fail reason=default-companion-evacuation-timeout "
                        f"node={node_name} disk={companion_name} "
                        f"timeoutSeconds={evacuation_timeout} {last_state}",
                        file=sys.stderr,
                    )
                    raise SystemExit(3)

                print(
                    f"result=fail reason=active-auto-extra-disk-companion-not-safe-to-remove "
                    f"node={node_name} "
                    f"disk={disk_name} detection={reason} "
                    f"specDisks={','.join(sorted(spec_disks))} "
                    f"defaultCompanionStatusPresent={bool(companion_status)} "
                    f"defaultCompanionEvictionRequested={companion_eviction_requested} "
                    f"defaultCompanionPathReplicaObjects={len(companion_path_replica_names)} "
                    f"defaultCompanionBlockingPathReplicaObjects={len(companion_blocking_path_replica_names)} "
                    f"scheduledReplicas={len(scheduled_replicas)} "
                    f"scheduledBackingImages={len(scheduled_backing_images)} "
                    f"storageScheduled={storage_scheduled} "
                    f"replicaObjects={len(replica_names)}"
                )
                raise SystemExit(2)

            disable_patch = json.dumps(
                {"spec": {"disks": {disk_name: {"allowScheduling": False}}}}
            )
            disable_result = run_kubectl(
                [
                    "patch",
                    f"nodes.longhorn.io/{node_name}",
                    "--type=merge",
                    "-p",
                    disable_patch,
                ]
            )
            if disable_result.returncode != 0:
                sys.stderr.write(
                    (disable_result.stderr or "") + (disable_result.stdout or "")
                )
                raise SystemExit(disable_result.returncode)

            delete_patch = json.dumps({"spec": {"disks": {disk_name: None}}})
            last_error = ""
            for _ in range(12):
                delete_result = run_kubectl(
                    [
                        "patch",
                        f"nodes.longhorn.io/{node_name}",
                        "--type=merge",
                        "-p",
                        delete_patch,
                    ]
                )
                node, get_result = get_node()
                if node is not None and disk_name not in (
                    node.get("spec", {}).get("disks") or {}
                ):
                    print(
                        f"Longhorn stale automatic extra disk cleanup: node={node_name} "
                        f"disk={disk_name} action=remove-stale-auto-extra-disk "
                        f"reason={reason}"
                    )
                    raise SystemExit(0)
                last_error = (
                    (delete_result.stderr or "")
                    + (delete_result.stdout or "")
                    + (get_result.stderr or "")
                )
                time.sleep(5)

            sys.stderr.write(last_error)
            print(
                f"result=fail reason=stale-auto-extra-disk-removal-timeout "
                f"node={node_name} disk={disk_name} detection={reason}",
                file=sys.stderr,
            )
            raise SystemExit(1)
            PY
              reconcile_rc=$?
              if [ "${reconcile_rc}" -ne 0 ]; then
                exit "${reconcile_rc}"
              fi
              exit 0
            fi
            if ! "$K" --kubeconfig "$C" -n longhorn-system get "nodes.longhorn.io/${node_name}" >/dev/null 2>&1; then
              echo "Skipping automatic extra Longhorn disk for ${node_name}; Longhorn node object is absent."
              exit 0
            fi
            if "$K" --kubeconfig "$C" -n longhorn-system get "nodes.longhorn.io/${node_name}" \
                -o jsonpath='{range .spec.disks[*]}{.path}{"\n"}{end}' |
                grep -Fx "${extra_path}" >/dev/null; then
              echo "${node_name} already has Longhorn disk path ${extra_path}."
              exit 0
            fi

            echo "Adding automatic extra Longhorn disk on ${node_name}: ${extra_path}"
            "$K" --kubeconfig "$C" -n longhorn-system patch "nodes.longhorn.io/${node_name}" \
              --type=merge \
              -p "{\"spec\":{\"allowScheduling\":true,\"disks\":{\"auto-extra-disk\":{\"path\":\"${extra_path}\",\"allowScheduling\":true,\"storageReserved\":0,\"tags\":[],\"diskType\":\"filesystem\",\"evictionRequested\":false}}}}"
          args:
            executable: /bin/bash
          register: platform_longhorn_auto_extra_disk_config
          changed_when: >-
            'Adding automatic extra Longhorn disk' in platform_longhorn_auto_extra_disk_config.stdout or
            'action=remove-stale-auto-extra-disk' in platform_longhorn_auto_extra_disk_config.stdout or
            'action=remove-empty-default-companion' in platform_longhorn_auto_extra_disk_config.stdout or
            'action=request-default-companion-evacuation' in platform_longhorn_auto_extra_disk_config.stdout or
            'action=remove-evacuated-default-companion' in platform_longhorn_auto_extra_disk_config.stdout
          when: platform_longhorn_auto_extra_disk_enabled_effective | bool

        - name: Show Longhorn automatic extra disk decisions
          ansible.builtin.debug:
            msg: |-
              {% for node in groups['rke2_servers'] %}
              ===== {{ node }} =====
              {{ hostvars[node].platform_longhorn_auto_extra_disk_config.stdout | default('automatic extra disk check did not run') }}
              {{ hostvars[node].platform_longhorn_auto_extra_disk_config.stderr | default('') }}
              {% endfor %}
          run_once: true
          when: platform_longhorn_auto_extra_disk_enabled_effective | bool

        - name: Repair duplicate Longhorn disk filesystem IDs when an empty duplicate disk exists
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml

            "$K" --kubeconfig "$C" -n longhorn-system get nodes.longhorn.io -o json |
              python3 -c '
            import json
            import re
            import subprocess
            import sys
            import time

            data = json.load(sys.stdin)
            kubectl = [
                "/var/lib/rancher/rke2/bin/kubectl",
                "--kubeconfig",
                "/etc/rancher/rke2/rke2.yaml",
                "-n",
                "longhorn-system",
            ]


            def run_kubectl(args):
                return subprocess.run(
                    kubectl + args,
                    text=True,
                    capture_output=True,
                )


            def get_node(node_name):
                result = run_kubectl(
                    ["get", f"nodes.longhorn.io/{node_name}", "-o", "json"]
                )
                if result.returncode != 0:
                    return None, result
                return json.loads(result.stdout), result

            for item in data.get("items", []):
                name = item.get("metadata", {}).get("name", "")
                spec_disks = item.get("spec", {}).get("disks") or {}
                status_disks = item.get("status", {}).get("diskStatus") or {}
                if len(spec_disks) <= 1:
                    continue

                duplicate_names = set()
                for disk_name, status in status_disks.items():
                    conditions = status.get("conditions") or []
                    for condition in conditions:
                        message = condition.get("message") or ""
                        duplicate_filesystem = (
                            condition.get("type") == "Ready"
                            and condition.get("status") == "False"
                            and (
                                condition.get("reason") == "DiskFilesystemChanged"
                                or "same file system ID" in message
                            )
                        )
                        if not duplicate_filesystem:
                            continue
                        duplicate_names.add(disk_name)
                        for group in re.findall(r"\[([^\]]+)\]", message):
                            duplicate_names.update(
                                candidate
                                for candidate in group.split()
                                if candidate in spec_disks
                            )

                candidates = sorted(
                    disk_name
                    for disk_name in duplicate_names
                    if disk_name in spec_disks and disk_name != "default-disk"
                )
                if "default-disk" in duplicate_names:
                    print(
                        f"Longhorn duplicate filesystem disk retained: node={name} "
                        "disk=default-disk reason=managed-default-disk"
                    )

                for disk_name in candidates:
                    status = status_disks.get(disk_name) or {}
                    scheduled_replicas = status.get("scheduledReplica") or {}
                    scheduled_backing_images = status.get("scheduledBackingImage") or {}
                    storage_scheduled = int(status.get("storageScheduled") or 0)
                    if (
                        scheduled_replicas
                        or scheduled_backing_images
                        or storage_scheduled > 0
                    ):
                        print(
                            f"Longhorn duplicate filesystem disk retained: node={name} "
                            f"disk={disk_name} reason=scheduled-data-present "
                            f"replicas={len(scheduled_replicas)} "
                            f"backingImages={len(scheduled_backing_images)} "
                            f"storageScheduled={storage_scheduled}"
                        )
                        continue

                    disk_path = spec_disks.get(disk_name, {}).get("path", "")
                    disable_patch = json.dumps(
                        {"spec": {"disks": {disk_name: {"allowScheduling": False}}}}
                    )
                    disable_result = run_kubectl(
                        [
                            "patch",
                            f"nodes.longhorn.io/{name}",
                            "--type=merge",
                            "-p",
                            disable_patch,
                        ]
                    )
                    if disable_result.returncode != 0:
                        sys.stderr.write(
                            (disable_result.stderr or "") + (disable_result.stdout or "")
                        )
                        raise SystemExit(disable_result.returncode)
                    print(
                        f"Disabling empty duplicate Longhorn disk before removal: "
                        f"node={name} disk={disk_name} path={disk_path}"
                    )

                    delete_patch = json.dumps(
                        {"spec": {"disks": {disk_name: None}}}
                    )
                    removed = False
                    last_error = ""
                    for _ in range(12):
                        delete_result = run_kubectl(
                            [
                                "patch",
                                f"nodes.longhorn.io/{name}",
                                "--type=merge",
                                "-p",
                                delete_patch,
                            ]
                        )
                        refreshed, get_result = get_node(name)
                        if refreshed is not None and disk_name not in (
                            refreshed.get("spec", {}).get("disks") or {}
                        ):
                            removed = True
                            break
                        last_error = (
                            (delete_result.stderr or "")
                            + (delete_result.stdout or "")
                            + (get_result.stderr or "")
                        )
                        time.sleep(5)

                    if removed:
                        print(
                            f"Removing empty duplicate Longhorn disk from node={name}: "
                            f"disk={disk_name} path={disk_path}"
                        )
                        continue

                    sys.stderr.write(last_error)
                    print(
                        f"result=fail reason=empty-duplicate-disk-removal-timeout "
                        f"node={name} disk={disk_name} path={disk_path}",
                        file=sys.stderr,
                    )
                    raise SystemExit(1)

                if duplicate_names and not candidates:
                    print(
                        f"Longhorn duplicate filesystem state requires manual review: "
                        f"node={name} disks={sorted(duplicate_names)} "
                        "reason=no-safe-non-default-removal-candidate"
                    )

            sys.exit(0)
            '
          args:
            executable: /bin/bash
          register: platform_longhorn_duplicate_disk_repair
          changed_when: >-
            'Removing empty duplicate Longhorn disk' in platform_longhorn_duplicate_disk_repair.stdout or
            'Disabling empty duplicate Longhorn disk' in platform_longhorn_duplicate_disk_repair.stdout
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Wait for Longhorn default disks to become ready
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            readiness_json="$(mktemp)"
            trap 'rm -f "${readiness_json}"' EXIT
            "$K" --kubeconfig "$C" -n longhorn-system get nodes.longhorn.io -o json >"${readiness_json}"
            python3 - "${readiness_json}" <<'PY'
            import json
            import sys

            with open(sys.argv[1], encoding="utf-8") as stream:
                data = json.load(stream)
            missing_spec = []
            missing_status = []
            not_schedulable = []

            for item in data.get("items", []):
                name = item.get("metadata", {}).get("name", "")
                spec_disks = item.get("spec", {}).get("disks") or {}
                status_disks = item.get("status", {}).get("diskStatus") or {}
                if not spec_disks:
                    missing_spec.append(name)
                    continue
                if not status_disks:
                    missing_status.append(name)
                    continue
                ready_disk = False
                for disk_name, disk in status_disks.items():
                    conditions = {
                        condition.get("type"): condition.get("status")
                        for condition in disk.get("conditions", [])
                    }
                    allow_scheduling = spec_disks.get(disk_name, {}).get("allowScheduling", False)
                    ready = conditions.get("Ready") == "True"
                    schedulable = conditions.get("Schedulable") == "True"
                    if allow_scheduling and ready and schedulable:
                        ready_disk = True
                        break
                if not ready_disk:
                    not_schedulable.append(name)

            print("===== Longhorn disk readiness =====")
            for item in data.get("items", []):
                name = item.get("metadata", {}).get("name", "")
                spec_disks = item.get("spec", {}).get("disks") or {}
                status_disks = item.get("status", {}).get("diskStatus") or {}
                print(f"{name}: specDisks={list(spec_disks.keys())} statusDisks={list(status_disks.keys())}")
                for disk_name, disk_status in status_disks.items():
                    conditions = {
                        condition.get("type"): condition
                        for condition in disk_status.get("conditions", [])
                    }
                    ready = conditions.get("Ready", {})
                    schedulable = conditions.get("Schedulable", {})
                    scheduled = disk_status.get("scheduledReplica") or {}
                    print(
                        f"  {disk_name}: ready={ready.get('status', 'Unknown')} "
                        f"readyReason={ready.get('reason', '') or 'none'} "
                        f"schedulable={schedulable.get('status', 'Unknown')} "
                        f"schedulableReason={schedulable.get('reason', '') or 'none'} "
                        f"scheduledReplicas={len(scheduled)} "
                        f"storageAvailable={disk_status.get('storageAvailable', 0)} "
                        f"storageMaximum={disk_status.get('storageMaximum', 0)} "
                        f"storageScheduled={disk_status.get('storageScheduled', 0)}"
                    )

            problems = []
            if missing_spec:
                problems.append("missing Spec.Disks: " + " ".join(missing_spec))
            if missing_status:
                problems.append("missing status.diskStatus: " + " ".join(missing_status))
            if not_schedulable:
                problems.append("no ready schedulable disk: " + " ".join(not_schedulable))

            if problems:
                print("Longhorn disk readiness problems: " + "; ".join(problems), file=sys.stderr)
                sys.exit(1)
            PY
          args:
            executable: /bin/bash
          register: platform_longhorn_default_disks_ready
          retries: "{{ (((platform_longhorn_wait_timeout_effective | int) / 10) | round(0, 'ceil') | int) + 1 }}"
          delay: 10
          until: >-
            platform_longhorn_default_disks_ready.rc == 0 or
            'Traceback (most recent call last):' in platform_longhorn_default_disks_ready.stderr
          failed_when: platform_longhorn_default_disks_ready.rc != 0
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Refresh Longhorn and Forgejo applications after direct storage bootstrap
          ansible.builtin.shell: |
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            for app in longhorn forgejo; do
              if "$K" --kubeconfig "$C" -n argocd get "application/${app}" >/dev/null 2>&1; then
                "$K" --kubeconfig "$C" -n argocd annotate "application/${app}" \
                  argocd.argoproj.io/refresh=hard --overwrite
              fi
            done
          args:
            executable: /bin/bash
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Show Longhorn bootstrap status
          ansible.builtin.shell: |
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            echo "===== HelmChart ====="
            "$K" --kubeconfig "$C" -n kube-system get helmchart platform-longhorn -o wide || true
            echo "===== helm install jobs ====="
            "$K" --kubeconfig "$C" -n kube-system get job,pods -o wide | grep -E 'helm-install-platform-longhorn|platform-longhorn|longhorn|NAME' || true
            echo "===== Longhorn pods ====="
            "$K" --kubeconfig "$C" -n longhorn-system get pods -o wide || true
            echo "===== StorageClasses ====="
            "$K" --kubeconfig "$C" get storageclass || true
            echo "===== Forgejo PVC/pod ====="
            "$K" --kubeconfig "$C" -n forgejo get pvc,pods,ingress -o wide || true
          args:
            executable: /bin/bash
          register: platform_longhorn_status
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Print Longhorn bootstrap status
          ansible.builtin.debug:
            var: platform_longhorn_status.stdout_lines
          run_once: true

      rescue:
        - name: Collect Longhorn bootstrap failure diagnostics
          ansible.builtin.shell: |
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            echo "===== HelmChart resources ====="
            "$K" --kubeconfig "$C" -n kube-system get helmchart platform-longhorn -o yaml || true
            echo "===== Helm install jobs and pods ====="
            "$K" --kubeconfig "$C" -n kube-system get job,pods -o wide | grep -E 'helm-install-platform-longhorn|platform-longhorn|longhorn|NAME' || true
            for job in helm-install-platform-longhorn helm-repair-platform-longhorn; do
              "$K" --kubeconfig "$C" -n kube-system describe "job/${job}" 2>/dev/null || true
              for pod in $("$K" --kubeconfig "$C" -n kube-system get pods \
                  -l "job-name=${job}" -o name 2>/dev/null); do
                echo "===== ${pod} logs ====="
                "$K" --kubeconfig "$C" -n kube-system logs "${pod}" --all-containers --tail=240 || true
                echo "===== ${pod} describe ====="
                "$K" --kubeconfig "$C" -n kube-system describe "${pod}" || true
              done
            done
            echo "===== Longhorn namespace ====="
            "$K" --kubeconfig "$C" get ns longhorn-system || true
            "$K" --kubeconfig "$C" -n longhorn-system get all -o wide || true
            "$K" --kubeconfig "$C" -n longhorn-system get events --sort-by=.lastTimestamp | tail -120 || true
          args:
            executable: /bin/bash
          register: platform_longhorn_failure
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Stop after Longhorn bootstrap failure
          ansible.builtin.fail:
            msg: |-
              Direct Longhorn bootstrap did not become ready within
              {{ platform_longhorn_wait_timeout_effective }}s.

              Diagnostic summary:
              {{ platform_longhorn_failure.stdout }}

              Automatic extra disk decisions:
              {% for node in groups['rke2_servers'] %}
              ===== {{ node }} =====
              {{ hostvars[node].platform_longhorn_auto_extra_disk_config.stdout | default('automatic extra disk check did not run') }}
              {% endfor %}

              Common causes are blocked chart/image pulls, missing Longhorn host
              prerequisites, insufficient disk space, CNI pod networking problems,
              or Longhorn manager/CSI pods waiting on scheduling.
          run_once: true
