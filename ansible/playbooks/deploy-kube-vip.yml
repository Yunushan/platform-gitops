---
- name: Deploy kube-vip API virtual IP
  hosts: rke2_servers
  become: true
  gather_facts: true
  any_errors_fatal: true
  vars:
    rke2_first_server: "{{ groups['rke2_servers'][0] }}"
    rke2_api_vip_effective: "{{ rke2_api_vip | default('', true) }}"
    rke2_api_dns_effective: "{{ rke2_api_dns | default('', true) }}"
    kube_vip_version_from_env: "{{ lookup('ansible.builtin.env', 'KUBE_VIP_VERSION') }}"
    kube_vip_image_from_env: "{{ lookup('ansible.builtin.env', 'KUBE_VIP_IMAGE') }}"
    kube_vip_interface_from_env: "{{ lookup('ansible.builtin.env', 'KUBE_VIP_INTERFACE') }}"
    kube_vip_version_effective: "{{ kube_vip_version | default(kube_vip_version_from_env, true) | default('v0.8.9', true) }}"
    kube_vip_image_effective: "{{ kube_vip_image | default(kube_vip_image_from_env, true) | default('ghcr.io/kube-vip/kube-vip:' + kube_vip_version_effective, true) }}"
    kube_vip_interface_effective: "{{ kube_vip_interface | default(kube_vip_interface_from_env, true) | default(ansible_default_ipv4.interface, true) }}"
    kube_vip_rollout_timeout_from_env: "{{ lookup('ansible.builtin.env', 'KUBE_VIP_ROLLOUT_TIMEOUT') }}"
    kube_vip_rollout_timeout_effective: "{{ kube_vip_rollout_timeout | default(kube_vip_rollout_timeout_from_env, true) | default('180s', true) }}"
  tasks:
    - name: Require kube-vip API VIP settings
      ansible.builtin.assert:
        that:
          - groups['rke2_servers'] | length == 3
          - rke2_api_vip_effective | length > 0
          - not (rke2_api_vip_effective is match("^<.*>$"))
          - rke2_api_dns_effective | length > 0
          - not (rke2_api_dns_effective is match("^<.*>$"))
          - kube_vip_interface_effective | length > 0
          - not (kube_vip_interface_effective is match("^<.*>$"))
        fail_msg: "Set rke2_api_vip, rke2_api_dns, and optionally kube_vip_interface in inventory/hosts.local.ini."
      run_once: true

    - name: Show kube-vip deployment choices
      ansible.builtin.debug:
        msg: >-
          Deploying kube-vip API VIP {{ rke2_api_vip_effective }} on interface {{ kube_vip_interface_effective }}
          with image {{ kube_vip_image_effective }}.
      run_once: true

    - name: Apply kube-vip RBAC and DaemonSet
      ansible.builtin.shell: |
        set -o pipefail
        /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml apply -f -
      args:
        executable: /bin/bash
        stdin: |
          ---
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: kube-vip
            namespace: kube-system
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: kube-vip-role
          rules:
            - apiGroups: [""]
              resources: ["services", "services/status", "endpoints", "nodes", "events"]
              verbs: ["list", "get", "watch", "update", "create", "patch"]
            - apiGroups: ["coordination.k8s.io"]
              resources: ["leases"]
              verbs: ["list", "get", "watch", "update", "create", "patch"]
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: kube-vip-binding
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: kube-vip-role
          subjects:
            - kind: ServiceAccount
              name: kube-vip
              namespace: kube-system
          ---
          apiVersion: apps/v1
          kind: DaemonSet
          metadata:
            name: kube-vip-ds
            namespace: kube-system
            labels:
              app.kubernetes.io/name: kube-vip
          spec:
            selector:
              matchLabels:
                app.kubernetes.io/name: kube-vip
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: kube-vip
              spec:
                serviceAccountName: kube-vip
                hostNetwork: true
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                        - matchExpressions:
                            - key: node-role.kubernetes.io/control-plane
                              operator: Exists
                        - matchExpressions:
                            - key: node-role.kubernetes.io/master
                              operator: Exists
                tolerations:
                  - operator: Exists
                    effect: NoSchedule
                  - operator: Exists
                    effect: NoExecute
                containers:
                  - name: kube-vip
                    image: {{ kube_vip_image_effective }}
                    imagePullPolicy: IfNotPresent
                    args:
                      - manager
                    env:
                      - name: vip_arp
                        value: "true"
                      - name: port
                        value: "6443"
                      - name: vip_interface
                        value: {{ kube_vip_interface_effective }}
                      - name: vip_subnet
                        value: "32"
                      - name: cp_enable
                        value: "true"
                      - name: cp_namespace
                        value: kube-system
                      - name: svc_enable
                        value: "false"
                      - name: vip_leaderelection
                        value: "true"
                      - name: vip_leaseduration
                        value: "5"
                      - name: vip_renewdeadline
                        value: "3"
                      - name: vip_retryperiod
                        value: "1"
                      - name: address
                        value: {{ rke2_api_vip_effective }}
                    securityContext:
                      capabilities:
                        add:
                          - NET_ADMIN
                          - NET_RAW
      register: kube_vip_apply
      changed_when: "'configured' in kube_vip_apply.stdout or 'created' in kube_vip_apply.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Wait for kube-vip DaemonSet rollout
      ansible.builtin.command: >-
        /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
        -n kube-system rollout status daemonset/kube-vip-ds --timeout={{ kube_vip_rollout_timeout_effective }}
      register: kube_vip_rollout
      changed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Verify API VIP answers from every node
      ansible.builtin.command: "curl -sk --connect-timeout 5 --max-time 15 https://{{ rke2_api_vip_effective }}:6443/readyz"
      register: kube_vip_readyz
      changed_when: false
      retries: 18
      delay: 10
      until: kube_vip_readyz.rc == 0 and 'ok' in kube_vip_readyz.stdout

    - name: Show kube-vip pods
      ansible.builtin.command: >-
        /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
        -n kube-system get pods -l app.kubernetes.io/name=kube-vip -o wide
      register: kube_vip_pods
      changed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Print kube-vip pods
      ansible.builtin.debug:
        var: kube_vip_pods.stdout_lines
      run_once: true
