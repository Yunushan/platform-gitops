---
- name: Install RKE2 server cluster
  hosts: rke2_servers
  become: true
  gather_facts: true
  vars:
    rke2_first_server: "{{ groups['rke2_servers'][0] }}"
    rke2_api_endpoint_from_env: "{{ lookup('ansible.builtin.env', 'RKE2_API_ENDPOINT') }}"
    rke2_version_from_env: "{{ lookup('ansible.builtin.env', 'RKE2_VERSION') }}"
    rke2_channel_from_env: "{{ lookup('ansible.builtin.env', 'RKE2_CHANNEL') }}"
    rke2_token_from_env: "{{ lookup('ansible.builtin.env', 'RKE2_TOKEN') }}"
    rke2_api_endpoint_effective: "{{ rke2_api_endpoint | default(rke2_api_dns | default(rke2_api_endpoint_from_env, true), true) }}"
    rke2_join_endpoint_effective: "{{ rke2_join_endpoint | default(rke2_api_endpoint_effective, true) }}"
    rke2_version_effective: "{{ rke2_version | default(rke2_version_from_env, true) }}"
    rke2_channel_effective: "{{ rke2_channel | default(rke2_channel_from_env, true) | default('stable', true) }}"
    rke2_cni_effective: "{{ rke2_cni | default('cilium', true) }}"
    rke2_token_file: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/platform-gitops/rke2-token"
    rke2_disable_packaged_components:
      - rke2-ingress-nginx
      - rke2-traefik
    rke2_install_url: https://get.rke2.io
    rke2_install_timeout_from_env: "{{ lookup('ansible.builtin.env', 'RKE2_INSTALL_TIMEOUT') }}"
    rke2_install_poll_interval_from_env: "{{ lookup('ansible.builtin.env', 'RKE2_INSTALL_POLL_INTERVAL') }}"
    rke2_start_timeout_from_env: "{{ lookup('ansible.builtin.env', 'RKE2_START_TIMEOUT') }}"
    rke2_start_poll_interval_from_env: "{{ lookup('ansible.builtin.env', 'RKE2_START_POLL_INTERVAL') }}"
    rke2_install_timeout_effective: "{{ rke2_install_timeout | default(rke2_install_timeout_from_env, true) | default(1200, true) | int }}"
    rke2_install_poll_interval_effective: "{{ rke2_install_poll_interval | default(rke2_install_poll_interval_from_env, true) | default(15, true) | int }}"
    rke2_start_timeout_effective: "{{ rke2_start_timeout | default(rke2_start_timeout_from_env, true) | default(900, true) | int }}"
    rke2_start_poll_interval_effective: "{{ rke2_start_poll_interval | default(rke2_start_poll_interval_from_env, true) | default(10, true) | int }}"
  pre_tasks:
    - name: Require an API endpoint or DNS name
      ansible.builtin.assert:
        that:
          - rke2_api_endpoint_effective | length > 0
          - not (rke2_api_endpoint_effective is match("^<.*>$"))
        fail_msg: "Set rke2_api_dns in inventory/hosts.local.ini, pass -e rke2_api_endpoint=api.platform.local, or export RKE2_API_ENDPOINT."

    - name: Ensure local token directory exists
      ansible.builtin.file:
        path: "{{ rke2_token_file | dirname }}"
        state: directory
        mode: "0700"
      become: false
      delegate_to: localhost
      run_once: true

    - name: Resolve RKE2 token candidate
      ansible.builtin.set_fact:
        rke2_token_candidate: "{{ rke2_token | default(rke2_token_from_env, true) }}"
      no_log: true

    - name: Generate or load local RKE2 token
      ansible.builtin.set_fact:
        rke2_generated_token: "{{ lookup('ansible.builtin.password', rke2_token_file + ' length=64 chars=ascii_letters,digits') }}"
      no_log: true

    - name: Select RKE2 token
      ansible.builtin.set_fact:
        rke2_token_effective: "{{ (((rke2_token_candidate | default('', true)) | length == 0) or ((rke2_token_candidate | regex_search('^<.*>$')) is not none)) | ternary(rke2_generated_token, rke2_token_candidate) }}"
      no_log: true

    - name: Show selected RKE2 install source
      ansible.builtin.debug:
        msg: >-
          Installing RKE2 {{ rke2_version_effective if (rke2_version_effective | length > 0) else ('from channel ' + rke2_channel_effective) }}
          with {{ rke2_cni_effective }} CNI. Package install timeout is {{ rke2_install_timeout_effective }}s and service start timeout is
          {{ rke2_start_timeout_effective }}s. Token is supplied privately or stored on the controller at {{ rke2_token_file }}.

  tasks:
    - name: Create RKE2 config directory
      ansible.builtin.file:
        path: /etc/rancher/rke2
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write RKE2 server configuration
      ansible.builtin.copy:
        dest: /etc/rancher/rke2/config.yaml
        owner: root
        group: root
        mode: "0600"
        content: |
          {% if inventory_hostname != rke2_first_server %}
          server: https://{{ rke2_join_endpoint_effective }}:9345
          {% endif %}
          token: {{ rke2_token_effective }}
          node-name: {{ inventory_hostname }}
          cni: {{ rke2_cni_effective }}
          tls-san:
            - {{ rke2_api_endpoint_effective }}
          {% if rke2_api_vip is defined and (rke2_api_vip | length > 0) and not (rke2_api_vip is match("^<.*>$")) %}
            - {{ rke2_api_vip }}
          {% endif %}
          {% for san in rke2_extra_tls_sans | default([]) %}
            - {{ san }}
          {% endfor %}
          write-kubeconfig-mode: "0640"
          disable:
          {% for component in rke2_disable_packaged_components %}
            - {{ component }}
          {% endfor %}
          etcd-expose-metrics: true
      no_log: true

    - name: Download RKE2 installer
      ansible.builtin.get_url:
        url: "{{ rke2_install_url }}"
        dest: /tmp/install-rke2.sh
        owner: root
        group: root
        mode: "0755"
        timeout: 60

    - name: Build RKE2 installer environment
      ansible.builtin.set_fact:
        rke2_install_environment: "{{ {'INSTALL_RKE2_TYPE': 'server'} | combine(((rke2_version_effective | length) > 0) | ternary({'INSTALL_RKE2_VERSION': rke2_version_effective}, {'INSTALL_RKE2_CHANNEL': rke2_channel_effective})) }}"

    - name: Install RKE2 server package with timeout control
      block:
        - name: Start RKE2 server package install
          ansible.builtin.command: /tmp/install-rke2.sh
          environment: "{{ rke2_install_environment }}"
          async: "{{ rke2_install_timeout_effective }}"
          poll: 0
          register: rke2_install_async
          changed_when: false

        - name: Wait for RKE2 server package install to finish
          ansible.builtin.async_status:
            jid: "{{ rke2_install_async.ansible_job_id }}"
          register: rke2_install_result
          until: rke2_install_result.finished | bool
          retries: "{{ (((rke2_install_timeout_effective | int) / (rke2_install_poll_interval_effective | int)) | round(0, 'ceil') | int) + 1 }}"
          delay: "{{ rke2_install_poll_interval_effective }}"
          changed_when: "'already installed' not in ((rke2_install_result.stdout | default('')) | lower)"
      rescue:
        - name: Show package install process state
          ansible.builtin.shell: |
            set -o pipefail
            ps -eo pid,ppid,stat,etime,comm,args | egrep 'rke2|dnf|yum|rpm|curl|get.rke2' | grep -v egrep || true
          args:
            executable: /bin/bash
          register: rke2_install_processes
          changed_when: false
          failed_when: false

        - name: Print package install process state
          ansible.builtin.debug:
            var: rke2_install_processes.stdout_lines

        - name: Print RKE2 installer stdout
          ansible.builtin.debug:
            var: rke2_install_result.stdout_lines
          when: rke2_install_result.stdout_lines is defined

        - name: Print RKE2 installer stderr
          ansible.builtin.debug:
            var: rke2_install_result.stderr_lines
          when: rke2_install_result.stderr_lines is defined

        - name: Stop after package install failure
          ansible.builtin.fail:
            msg: >-
              RKE2 package installation failed or exceeded {{ rke2_install_timeout_effective }} seconds on {{ inventory_hostname }}.
              Run `make rke2-status` for service, journal, process, disk, and memory diagnostics.

    - name: Enable RKE2 server service
      ansible.builtin.command: systemctl enable rke2-server
      changed_when: false

    - name: Start first RKE2 server without blocking Ansible output
      ansible.builtin.command: systemctl --no-block restart rke2-server
      changed_when: true
      when: inventory_hostname == rke2_first_server

    - name: Wait for first RKE2 kubeconfig
      block:
        - name: Wait for kubeconfig on first server
          ansible.builtin.wait_for:
            path: /etc/rancher/rke2/rke2.yaml
            timeout: "{{ rke2_start_timeout_effective }}"
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Wait for first server API to answer
          ansible.builtin.command: /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml get --raw=/readyz
          register: rke2_readyz
          retries: "{{ (((rke2_start_timeout_effective | int) / (rke2_start_poll_interval_effective | int)) | round(0, 'ceil') | int) + 1 }}"
          delay: "{{ rke2_start_poll_interval_effective }}"
          until: rke2_readyz.rc == 0
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
      rescue:
        - name: Show first server logs on startup failure
          ansible.builtin.command: journalctl -u rke2-server -n 120 --no-pager
          register: rke2_first_server_logs
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Print first server logs
          ansible.builtin.debug:
            var: rke2_first_server_logs.stdout_lines
          run_once: true

        - name: Stop after first server startup failure
          ansible.builtin.fail:
            msg: "RKE2 first server did not become ready. Review the journal output above, then rerun this playbook."
          run_once: true

    - name: Start joining RKE2 servers without blocking Ansible output
      ansible.builtin.command: systemctl --no-block restart rke2-server
      changed_when: true
      when: inventory_hostname != rke2_first_server

    - name: Wait for RKE2 server service to become active
      block:
        - name: Poll RKE2 server service state
          ansible.builtin.command: systemctl is-active rke2-server
          register: rke2_service_active
          retries: "{{ (((rke2_start_timeout_effective | int) / (rke2_start_poll_interval_effective | int)) | round(0, 'ceil') | int) + 1 }}"
          delay: "{{ rke2_start_poll_interval_effective }}"
          until: rke2_service_active.stdout == "active"
          changed_when: false
      rescue:
        - name: Show RKE2 service status on startup failure
          ansible.builtin.command: systemctl status rke2-server --no-pager -l
          register: rke2_service_status
          changed_when: false
          failed_when: false

        - name: Show RKE2 journal on startup failure
          ansible.builtin.command: journalctl -u rke2-server -n 120 --no-pager
          register: rke2_service_logs
          changed_when: false
          failed_when: false

        - name: Print RKE2 service status
          ansible.builtin.debug:
            var: rke2_service_status.stdout_lines

        - name: Print RKE2 service logs
          ansible.builtin.debug:
            var: rke2_service_logs.stdout_lines

        - name: Stop after service startup failure
          ansible.builtin.fail:
            msg: "rke2-server did not become active within {{ rke2_start_timeout_effective }} seconds on {{ inventory_hostname }}."

    - name: Wait for all RKE2 nodes to report Ready
      ansible.builtin.shell: |
        set -o pipefail
        /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml get nodes --no-headers |
          awk '$2 == "Ready" { ready++ } END { expected={{ groups["rke2_servers"] | length }}; exit(ready == expected ? 0 : 1) }'
      args:
        executable: /bin/bash
      register: rke2_all_nodes_ready
      retries: "{{ (((rke2_start_timeout_effective | int) / (rke2_start_poll_interval_effective | int)) | round(0, 'ceil') | int) + 1 }}"
      delay: "{{ rke2_start_poll_interval_effective }}"
      until: rke2_all_nodes_ready.rc == 0
      changed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Show cluster nodes
      ansible.builtin.command: /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml get nodes -o wide
      register: rke2_nodes
      changed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Print cluster nodes
      ansible.builtin.debug:
        var: rke2_nodes.stdout_lines
      run_once: true
