---
- name: Repair Argo CD internal service path
  hosts: rke2_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    rke2_first_server: "{{ groups['rke2_servers'][0] }}"
    platform_argocd_service_repair_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_ARGOCD_SERVICE_REPAIR_TIMEOUT') }}"
    platform_argocd_service_repair_refresh_apps_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_ARGOCD_SERVICE_REPAIR_REFRESH_APPS') }}"
    platform_argocd_service_repair_refresh_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_ARGOCD_SERVICE_REPAIR_REFRESH_TIMEOUT') }}"
    platform_argocd_service_repair_node_local_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_ARGOCD_SERVICE_REPAIR_NODE_LOCAL') }}"
    platform_argocd_service_repair_host_network_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_ARGOCD_SERVICE_REPAIR_HOST_NETWORK') }}"
    platform_argocd_service_repair_rollout_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_ARGOCD_SERVICE_REPAIR_ROLLOUT_TIMEOUT') }}"
    platform_argocd_service_repair_rollout_strict_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_ARGOCD_SERVICE_REPAIR_ROLLOUT_STRICT') }}"
    platform_argocd_service_repair_headless_internals_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_ARGOCD_SERVICE_REPAIR_HEADLESS_INTERNALS') }}"
    platform_argocd_cleanup_stale_bootstrap_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_ARGOCD_CLEAN_STALE_BOOTSTRAP') }}"
    platform_argocd_controller_readiness_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_ARGOCD_CONTROLLER_READINESS_TIMEOUT') }}"
    platform_argocd_controller_readiness_failure_threshold_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_ARGOCD_CONTROLLER_READINESS_FAILURE_THRESHOLD') }}"
    platform_argocd_health_probe_recycle_min_age_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_ARGOCD_HEALTH_PROBE_RECYCLE_MIN_AGE') }}"
    platform_argocd_health_probe_recovery_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_ARGOCD_HEALTH_PROBE_RECOVERY_TIMEOUT') }}"
    platform_argocd_service_repair_retry_apps_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_ARGOCD_SERVICE_REPAIR_RETRY_APPS') }}"
    platform_argocd_service_repair_app_sync_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_ARGOCD_SERVICE_REPAIR_APP_SYNC_TIMEOUT') }}"
    platform_argocd_service_repair_recover_stuck_operations_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_ARGOCD_SERVICE_REPAIR_RECOVER_STUCK_OPERATIONS') }}"
    platform_argocd_service_repair_operation_termination_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_ARGOCD_SERVICE_REPAIR_OPERATION_TERMINATION_TIMEOUT') }}"
    platform_argocd_service_repair_guarded_prune_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_ARGOCD_SERVICE_REPAIR_GUARDED_PRUNE') }}"
    platform_argocd_prune_legacy_traefik_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_ARGOCD_PRUNE_LEGACY_TRAEFIK') }}"
    platform_argocd_service_repair_timeout_effective: "{{ platform_argocd_service_repair_timeout | default(platform_argocd_service_repair_timeout_from_env, true) | default(180, true) | int }}"
    platform_argocd_service_repair_refresh_apps_effective: "{{ platform_argocd_service_repair_refresh_apps | default(platform_argocd_service_repair_refresh_apps_from_env, true) | default(true, true) | bool }}"
    platform_argocd_service_repair_refresh_timeout_effective: "{{ platform_argocd_service_repair_refresh_timeout | default(platform_argocd_service_repair_refresh_timeout_from_env, true) | default(120, true) | int }}"
    platform_argocd_service_repair_node_local_effective: "{{ platform_argocd_service_repair_node_local | default(platform_argocd_service_repair_node_local_from_env, true) | default(true, true) | bool }}"
    platform_argocd_service_repair_host_network_effective: "{{ platform_argocd_service_repair_host_network | default(platform_argocd_service_repair_host_network_from_env, true) | default(true, true) | bool }}"
    platform_argocd_service_repair_rollout_timeout_effective: "{{ platform_argocd_service_repair_rollout_timeout | default(platform_argocd_service_repair_rollout_timeout_from_env, true) | default(60, true) | int }}"
    platform_argocd_service_repair_rollout_strict_effective: "{{ platform_argocd_service_repair_rollout_strict | default(platform_argocd_service_repair_rollout_strict_from_env, true) | default(false, true) | bool }}"
    platform_argocd_service_repair_headless_internals_effective: "{{ platform_argocd_service_repair_headless_internals | default(platform_argocd_service_repair_headless_internals_from_env, true) | default(true, true) | bool }}"
    platform_argocd_cleanup_stale_bootstrap_effective: "{{ platform_argocd_cleanup_stale_bootstrap | default(platform_argocd_cleanup_stale_bootstrap_from_env, true) | default(true, true) | bool }}"
    platform_argocd_controller_readiness_timeout_effective: "{{ platform_argocd_controller_readiness_timeout | default(platform_argocd_controller_readiness_timeout_from_env, true) | default(10, true) | int }}"
    platform_argocd_controller_readiness_failure_threshold_effective: "{{ platform_argocd_controller_readiness_failure_threshold | default(platform_argocd_controller_readiness_failure_threshold_from_env, true) | default(18, true) | int }}"
    platform_argocd_health_probe_recycle_min_age_effective: "{{ platform_argocd_health_probe_recycle_min_age | default(platform_argocd_health_probe_recycle_min_age_from_env, true) | default(300, true) | int }}"
    platform_argocd_health_probe_recovery_timeout_effective: "{{ platform_argocd_health_probe_recovery_timeout | default(platform_argocd_health_probe_recovery_timeout_from_env, true) | default(600, true) | int }}"
    platform_argocd_service_repair_retry_apps_effective: "{{ platform_argocd_service_repair_retry_apps | default(platform_argocd_service_repair_retry_apps_from_env, true) | default('argocd-ha traefik woodpecker', true) }}"
    platform_argocd_service_repair_app_sync_timeout_effective: "{{ platform_argocd_service_repair_app_sync_timeout | default(platform_argocd_service_repair_app_sync_timeout_from_env, true) | default(600, true) | int }}"
    platform_argocd_service_repair_recover_stuck_operations_effective: "{{ platform_argocd_service_repair_recover_stuck_operations | default(platform_argocd_service_repair_recover_stuck_operations_from_env, true) | default(true, true) | bool }}"
    platform_argocd_service_repair_operation_termination_timeout_effective: "{{ platform_argocd_service_repair_operation_termination_timeout | default(platform_argocd_service_repair_operation_termination_timeout_from_env, true) | default(180, true) | int }}"
    platform_argocd_service_repair_guarded_prune_effective: "{{ platform_argocd_service_repair_guarded_prune | default(platform_argocd_service_repair_guarded_prune_from_env, true) | default(true, true) | bool }}"
    platform_argocd_prune_legacy_traefik_effective: "{{ platform_argocd_prune_legacy_traefik | default(platform_argocd_prune_legacy_traefik_from_env, true) | default(true, true) | bool }}"
  tasks:
    - name: Show current Argo CD service path state
      ansible.builtin.shell: |
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml

        echo "===== argocd active stack ====="
        if "$K" --kubeconfig "$C" -n argocd get service/argo-cd-argocd-server >/dev/null 2>&1 ||
          "$K" --kubeconfig "$C" -n argocd get deployment/argo-cd-argocd-server >/dev/null 2>&1; then
          echo "argocd_active_stack=helm-ha release=argo-cd"
        else
          echo "argocd_active_stack=bootstrap"
        fi

        echo "===== argocd services ====="
        "$K" --kubeconfig "$C" -n argocd get svc -o wide || true
        echo "===== argocd endpointslices ====="
        "$K" --kubeconfig "$C" -n argocd get endpointslice -o wide || true
        echo "===== argocd command parameters ====="
        for cm in argo-cd-argocd-cmd-params-cm argocd-cmd-params-cm; do
          echo "--- configmap/${cm} ---"
          "$K" --kubeconfig "$C" -n argocd get "cm/${cm}" \
            -o jsonpath='repo.server={.data.repo\.server}{"\n"}redis.server={.data.redis\.server}{"\n"}' 2>/dev/null ||
            echo "missing"
        done
        echo "===== argocd workloads ====="
        "$K" --kubeconfig "$C" -n argocd get deploy,statefulset,pods -o wide || true
      args:
        executable: /bin/bash
      register: platform_argocd_service_path_before
      changed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Print current Argo CD service path state
      ansible.builtin.debug:
        var: platform_argocd_service_path_before.stdout_lines
      run_once: true

    - name: Convert active Argo CD HA internal services to headless services
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        HEADLESS="{{ platform_argocd_service_repair_headless_internals_effective | bool | lower }}"

        if [ "${HEADLESS}" != "true" ]; then
          echo "argocd_headless_internals=disabled"
          exit 0
        fi
        if ! "$K" --kubeconfig "$C" -n argocd get service/argo-cd-argocd-server >/dev/null 2>&1 &&
          ! "$K" --kubeconfig "$C" -n argocd get deployment/argo-cd-argocd-server >/dev/null 2>&1; then
          echo "argocd_active_stack=bootstrap headless_internal_conversion=skipped"
          exit 0
        fi

        make_headless() {
          service="$1"
          current_ip="$("$K" --kubeconfig "$C" -n argocd get "service/${service}" \
            -o jsonpath='{.spec.clusterIP}' 2>/dev/null || true)"
          if [ -z "${current_ip}" ]; then
            echo "service=${service} state=absent"
            return 1
          fi
          if [ "${current_ip}" = "None" ]; then
            "$K" --kubeconfig "$C" -n argocd patch "service/${service}" --type merge \
              -p '{"spec":{"publishNotReadyAddresses":false}}' >/dev/null
            echo "service=${service} state=headless"
            return 0
          fi

          source_json="$(mktemp)"
          headless_json="$(mktemp)"
          "$K" --kubeconfig "$C" -n argocd get "service/${service}" -o json >"${source_json}"
          python3 - "${source_json}" "${headless_json}" <<'PY'
        import json
        import sys

        source_path, output_path = sys.argv[1:]
        with open(source_path, encoding="utf-8") as handle:
            source = json.load(handle)

        ports = []
        for source_port in source["spec"].get("ports", []):
            port = {
                "name": source_port.get("name"),
                "port": source_port["port"],
                "protocol": source_port.get("protocol", "TCP"),
                "targetPort": source_port.get("targetPort", source_port["port"]),
            }
            if source_port.get("appProtocol"):
                port["appProtocol"] = source_port["appProtocol"]
            ports.append({key: value for key, value in port.items() if value is not None})

        manifest = {
            "apiVersion": "v1",
            "kind": "Service",
            "metadata": {
                "name": source["metadata"]["name"],
                "namespace": source["metadata"].get("namespace", "argocd"),
                "labels": source["metadata"].get("labels", {}),
            },
            "spec": {
                "clusterIP": "None",
                "publishNotReadyAddresses": False,
                "selector": source["spec"].get("selector", {}),
                "ports": ports,
            },
        }
        manifest["metadata"]["labels"]["platform.gitops/internal-service"] = "headless"
        with open(output_path, "w", encoding="utf-8") as handle:
            json.dump(manifest, handle)
        PY
          "$K" --kubeconfig "$C" -n argocd delete "service/${service}" --wait=true --timeout=60s
          "$K" --kubeconfig "$C" apply -f "${headless_json}"
          rm -f "${source_json}" "${headless_json}"
          echo "service=${service} converted=headless previous_cluster_ip=${current_ip}"
        }

        make_headless argo-cd-argocd-repo-server
        make_headless argo-cd-redis-ha-haproxy
      args:
        executable: /bin/bash
      register: platform_argocd_headless_internal_services
      changed_when: >-
        'converted=headless' in platform_argocd_headless_internal_services.stdout or
        'patched' in platform_argocd_headless_internal_services.stdout
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Reconcile Traefik IngressClass permission in active platform project
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml

        if ! "$K" --kubeconfig "$C" -n argocd get appproject/platform >/dev/null 2>&1; then
          echo "argocd_platform_project=absent ingressclass_permission=skipped"
          exit 0
        fi

        project_json="$(mktemp)"
        patch_json="$(mktemp)"
        trap 'rm -f "${project_json}" "${patch_json}"' EXIT
        "$K" --kubeconfig "$C" -n argocd get appproject/platform -o json >"${project_json}"
        python3 - "${project_json}" "${patch_json}" <<'PY'
        import json
        import sys

        source_path, patch_path = sys.argv[1:]
        with open(source_path, encoding="utf-8") as handle:
            project = json.load(handle)

        required = {"group": "networking.k8s.io", "kind": "IngressClass"}
        whitelist = project.get("spec", {}).get("clusterResourceWhitelist", [])
        changed = required not in whitelist
        if changed:
            whitelist.append(required)

        with open(patch_path, "w", encoding="utf-8") as handle:
            json.dump({"changed": changed, "spec": {"clusterResourceWhitelist": whitelist}}, handle)
        PY

        changed="$(python3 - "${patch_json}" <<'PY'
        import json
        import sys
        with open(sys.argv[1], encoding="utf-8") as handle:
            print(str(json.load(handle)["changed"]).lower())
        PY
        )"
        if [ "${changed}" != "true" ]; then
          echo "argocd_platform_project=present ingressclass_permission=present"
          exit 0
        fi

        python3 - "${patch_json}" <<'PY'
        import json
        import sys
        with open(sys.argv[1], encoding="utf-8") as handle:
            patch = json.load(handle)
        patch.pop("changed", None)
        with open(sys.argv[1], "w", encoding="utf-8") as handle:
            json.dump(patch, handle)
        PY
        "$K" --kubeconfig "$C" -n argocd patch appproject/platform \
          --type merge --patch-file "${patch_json}" >/dev/null
        echo "argocd_platform_project=patched ingressclass_permission=added"

        if "$K" --kubeconfig "$C" -n argocd get application/traefik >/dev/null 2>&1; then
          "$K" --kubeconfig "$C" -n argocd annotate application/traefik \
            argocd.argoproj.io/refresh=hard --overwrite >/dev/null
          phase="$("$K" --kubeconfig "$C" -n argocd get application/traefik \
            -o jsonpath='{.status.operationState.phase}' 2>/dev/null || true)"
          if [ "${phase}" != "Running" ]; then
            revision="$("$K" --kubeconfig "$C" -n argocd get application/traefik \
              -o jsonpath='{.spec.source.targetRevision}' 2>/dev/null || true)"
            revision="${revision:-main}"
            "$K" --kubeconfig "$C" -n argocd patch application/traefik --type merge \
              -p "$(printf '{\"operation\":{\"sync\":{\"revision\":\"%s\",\"prune\":false}}}' "${revision}")" >/dev/null
            echo "argocd_application_traefik=refresh-sync-requested revision=${revision}"
          else
            echo "argocd_application_traefik=sync-already-running"
          fi
        fi
      args:
        executable: /bin/bash
      register: platform_argocd_platform_project_repair
      changed_when: "'ingressclass_permission=added' in platform_argocd_platform_project_repair.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true


    - name: Patch active Argo CD command parameters and restart active workloads
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml

        active_stack=bootstrap
        if "$K" --kubeconfig "$C" -n argocd get service/argo-cd-argocd-server >/dev/null 2>&1 ||
          "$K" --kubeconfig "$C" -n argocd get deployment/argo-cd-argocd-server >/dev/null 2>&1; then
          active_stack=helm-ha
        fi
        echo "argocd_active_stack=${active_stack}"
        restart_required=0

        patch_cm_if_present() {
          cm="$1"
          repo_server="$2"
          redis_server="$3"
          if "$K" --kubeconfig "$C" -n argocd get "configmap/${cm}" >/dev/null 2>&1; then
            current_repo_server="$("$K" --kubeconfig "$C" -n argocd get "configmap/${cm}" \
              -o jsonpath='{.data.repo\.server}' 2>/dev/null || true)"
            current_redis_server="$("$K" --kubeconfig "$C" -n argocd get "configmap/${cm}" \
              -o jsonpath='{.data.redis\.server}' 2>/dev/null || true)"
            current_status_processors="$("$K" --kubeconfig "$C" -n argocd get "configmap/${cm}" \
              -o jsonpath='{.data.controller\.status\.processors}' 2>/dev/null || true)"
            current_operation_processors="$("$K" --kubeconfig "$C" -n argocd get "configmap/${cm}" \
              -o jsonpath='{.data.controller\.operation\.processors}' 2>/dev/null || true)"
            current_kubectl_parallelism="$("$K" --kubeconfig "$C" -n argocd get "configmap/${cm}" \
              -o jsonpath='{.data.controller\.kubectl\.parallelism\.limit}' 2>/dev/null || true)"
            current_repo_timeout="$("$K" --kubeconfig "$C" -n argocd get "configmap/${cm}" \
              -o jsonpath='{.data.controller\.repo\.server\.timeout\.seconds}' 2>/dev/null || true)"
            current_repo_parallelism="$("$K" --kubeconfig "$C" -n argocd get "configmap/${cm}" \
              -o jsonpath='{.data.reposerver\.parallelism\.limit}' 2>/dev/null || true)"
            if [ "${current_repo_server}" = "${repo_server}" ] && \
              [ "${current_redis_server}" = "${redis_server}" ] && \
              [ "${current_status_processors}" = "10" ] && \
              [ "${current_operation_processors}" = "5" ] && \
              [ "${current_kubectl_parallelism}" = "5" ] && \
              [ "${current_repo_timeout}" = "120" ] && \
              [ "${current_repo_parallelism}" = "2" ]; then
              echo "configmap=${cm} state=current"
              return 0
            fi
            "$K" --kubeconfig "$C" -n argocd patch "configmap/${cm}" \
              --type merge \
              -p "$(printf '{"data":{"repo.server":"%s","redis.server":"%s","controller.status.processors":"10","controller.operation.processors":"5","controller.kubectl.parallelism.limit":"5","controller.repo.server.timeout.seconds":"120","reposerver.parallelism.limit":"2"}}' "${repo_server}" "${redis_server}")"
            echo "configmap=${cm} state=updated"
            restart_required=1
          fi
        }

        restart_if_present() {
          workload="$1"
          if "$K" --kubeconfig "$C" -n argocd get "${workload}" >/dev/null 2>&1; then
            "$K" --kubeconfig "$C" -n argocd rollout restart "${workload}"
          fi
        }

        if [ "${active_stack}" = "helm-ha" ]; then
          patch_cm_if_present argo-cd-argocd-cmd-params-cm \
            argo-cd-argocd-repo-server:8081 \
            argo-cd-redis-ha-haproxy:6379
          patch_cm_if_present argocd-cmd-params-cm \
            argo-cd-argocd-repo-server:8081 \
            argo-cd-redis-ha-haproxy:6379

          if [ "${restart_required}" -eq 1 ]; then
            for workload in \
              deployment/argo-cd-argocd-repo-server \
              statefulset/argo-cd-argocd-application-controller; do
              restart_if_present "${workload}"
            done
          else
            echo "argocd_active_stack=helm-ha action=skip-unchanged-rollout"
          fi
        else
          "$K" --kubeconfig "$C" apply -f - <<'YAML'
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: argocd-repo-server-headless
          namespace: argocd
          labels:
            app.kubernetes.io/name: argocd-repo-server-headless
            platform.gitops/repair: argocd-service-path
        spec:
          clusterIP: None
          publishNotReadyAddresses: true
          selector:
            app.kubernetes.io/name: argocd-repo-server
          ports:
            - name: repo-server
              port: 8081
              targetPort: 8081
              protocol: TCP
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: argocd-redis-headless
          namespace: argocd
          labels:
            app.kubernetes.io/name: argocd-redis-headless
            platform.gitops/repair: argocd-service-path
        spec:
          clusterIP: None
          publishNotReadyAddresses: true
          selector:
            app.kubernetes.io/name: argocd-redis
          ports:
            - name: redis
              port: 6379
              targetPort: 6379
              protocol: TCP
        YAML

          patch_cm_if_present argocd-cmd-params-cm \
            argocd-repo-server-headless:8081 \
            argocd-redis-headless:6379

          if [ "${restart_required}" -eq 1 ]; then
            for workload in \
              deployment/argocd-repo-server \
              statefulset/argocd-application-controller; do
              restart_if_present "${workload}"
            done
          else
            echo "argocd_active_stack=bootstrap action=skip-unchanged-rollout"
          fi
        fi
      args:
        executable: /bin/bash
      register: platform_argocd_service_path_repair
      changed_when: >-
        'created' in platform_argocd_service_path_repair.stdout or
        'configured' in platform_argocd_service_path_repair.stdout or
        'patched' in platform_argocd_service_path_repair.stdout or
        'restarted' in platform_argocd_service_path_repair.stdout
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Co-locate bootstrap Argo CD internals on first server when bootstrap stack is active
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml

        if "$K" --kubeconfig "$C" -n argocd get service/argo-cd-argocd-server >/dev/null 2>&1 ||
          "$K" --kubeconfig "$C" -n argocd get deployment/argo-cd-argocd-server >/dev/null 2>&1; then
          echo "argocd_active_stack=helm-ha action=skip-bootstrap-node-local-patch"
          exit 0
        fi

        target_node="{{ rke2_first_server }}"
        hostname_label="$("$K" --kubeconfig "$C" get node "${target_node}" \
          -o jsonpath='{.metadata.labels.kubernetes\.io/hostname}' 2>/dev/null || true)"
        if [ -z "${hostname_label}" ]; then
          hostname_label="${target_node}"
        fi

        fallback_node_ip="{{ hostvars[rke2_first_server].ansible_host | default(rke2_first_server) }}"
        node_ip="$("$K" --kubeconfig "$C" get node "${target_node}" \
          -o jsonpath='{range .status.addresses[?(@.type=="InternalIP")]}{.address}{" "}{end}' 2>/dev/null |
          awk '{print $1}')"
        if [ -z "${node_ip}" ]; then
          node_ip="${fallback_node_ip}"
        fi

        if [ "{{ platform_argocd_service_repair_host_network_effective | bool | lower }}" = "true" ]; then
          patch="$(printf '{"spec":{"template":{"spec":{"hostNetwork":true,"dnsPolicy":"ClusterFirstWithHostNet","nodeSelector":{"kubernetes.io/hostname":"%s"}}}}}' "${hostname_label}")"
          repo_server_patch="$(printf '{"spec":{"template":{"spec":{"hostNetwork":true,"dnsPolicy":"Default","nodeSelector":{"kubernetes.io/hostname":"%s"}}}}}' "${hostname_label}")"
          "$K" --kubeconfig "$C" -n argocd patch configmap argocd-cmd-params-cm \
            --type merge \
            -p "$(printf '{"data":{"repo.server":"%s:8081","redis.server":"%s:6379"}}' "${node_ip}" "${node_ip}")"
        else
          patch="$(printf '{"spec":{"template":{"spec":{"nodeSelector":{"kubernetes.io/hostname":"%s"}}}}}' "${hostname_label}")"
          repo_server_patch="${patch}"
        fi

        for deployment in argocd-redis; do
          if "$K" --kubeconfig "$C" -n argocd get "deployment/${deployment}" >/dev/null 2>&1; then
            "$K" --kubeconfig "$C" -n argocd patch "deployment/${deployment}" \
              --type merge -p "${patch}"
            "$K" --kubeconfig "$C" -n argocd rollout restart "deployment/${deployment}"
          fi
        done

        if "$K" --kubeconfig "$C" -n argocd get deployment/argocd-repo-server >/dev/null 2>&1; then
          "$K" --kubeconfig "$C" -n argocd patch deployment/argocd-repo-server \
            --type merge -p "${repo_server_patch}"
          "$K" --kubeconfig "$C" -n argocd rollout restart deployment/argocd-repo-server
        fi

        if "$K" --kubeconfig "$C" -n argocd get statefulset/argocd-application-controller >/dev/null 2>&1; then
          "$K" --kubeconfig "$C" -n argocd patch statefulset/argocd-application-controller \
            --type merge -p "${patch}"
          "$K" --kubeconfig "$C" -n argocd rollout restart statefulset/argocd-application-controller
        fi

        echo "Argo CD bootstrap internals pinned to kubernetes.io/hostname=${hostname_label}"
      args:
        executable: /bin/bash
      register: platform_argocd_service_path_node_local
      changed_when: >-
        'patched' in platform_argocd_service_path_node_local.stdout or
        'restarted' in platform_argocd_service_path_node_local.stdout
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      when: platform_argocd_service_repair_node_local_effective | bool

    - name: Stabilize active Argo CD controller and repo server for loaded clusters
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml

        patch_repo_deployment() {
          resource="$1"
          if ! "$K" --kubeconfig "$C" -n argocd get "${resource}" >/dev/null 2>&1; then
            return 0
          fi

          container_name="$("$K" --kubeconfig "$C" -n argocd get "${resource}" \
            -o jsonpath='{.spec.template.spec.containers[0].name}')"
          before_generation="$("$K" --kubeconfig "$C" -n argocd get "${resource}" \
            -o jsonpath='{.metadata.generation}')"
          patch="$(python3 - "${container_name}" <<'PY'
        import json
        import sys

        container_name = sys.argv[1]
        def local_http_exec_probe(port, path, initial_delay, failure_threshold):
            command = (
                f"exec 3<>/dev/tcp/127.0.0.1/{port}; "
                f"printf 'GET {path} HTTP/1.0\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; "
                "/usr/bin/head -n 1 <&3 | /usr/bin/grep -q ' 200 '"
            )
            return {
                "exec": {
                    "command": ["/usr/bin/timeout", "5", "/usr/bin/bash", "-ec", command],
                },
                "httpGet": None,
                "tcpSocket": None,
                "grpc": None,
                "failureThreshold": failure_threshold,
                "initialDelaySeconds": initial_delay,
                "periodSeconds": 10,
                "successThreshold": 1,
                "timeoutSeconds": {{ platform_argocd_controller_readiness_timeout_effective }},
            }

        probe_common = {
            "failureThreshold": {{ platform_argocd_controller_readiness_failure_threshold_effective }},
            "periodSeconds": 10,
            "successThreshold": 1,
            "timeoutSeconds": {{ platform_argocd_controller_readiness_timeout_effective }},
        }
        readiness = local_http_exec_probe(8084, "/healthz", 10, probe_common["failureThreshold"])
        liveness = local_http_exec_probe(8084, "/healthz?full=true", 30, probe_common["failureThreshold"])
        startup = local_http_exec_probe(8084, "/healthz", 10, 60)
        print(json.dumps({
            "spec": {
                "strategy": {
                    "type": "RollingUpdate",
                    "rollingUpdate": {"maxSurge": 0, "maxUnavailable": 1},
                },
                "template": {
                    "spec": {
                        "containers": [{
                            "name": container_name,
                            "readinessProbe": readiness,
                            "livenessProbe": liveness,
                            "startupProbe": startup,
                            "resources": {
                                "requests": {"cpu": "200m", "memory": "512Mi"},
                                "limits": {"memory": "2Gi"},
                            },
                        }],
                    },
                },
            },
        }))
        PY
          )"
          "$K" --kubeconfig "$C" -n argocd patch "${resource}" \
            --type strategic -p "${patch}" >/dev/null
          after_generation="$("$K" --kubeconfig "$C" -n argocd get "${resource}" \
            -o jsonpath='{.metadata.generation}')"
          if [ "${before_generation}" != "${after_generation}" ]; then
            echo "workload=${resource} state=updated generation=${before_generation}->${after_generation}"
          else
            echo "workload=${resource} state=current generation=${after_generation}"
          fi
        }

        patch_controller_statefulset() {
          resource="$1"
          if ! "$K" --kubeconfig "$C" -n argocd get "${resource}" >/dev/null 2>&1; then
            return 0
          fi

          container_name="$("$K" --kubeconfig "$C" -n argocd get "${resource}" \
            -o jsonpath='{.spec.template.spec.containers[0].name}')"
          before_generation="$("$K" --kubeconfig "$C" -n argocd get "${resource}" \
            -o jsonpath='{.metadata.generation}')"
          patch="$(python3 - "${container_name}" <<'PY'
        import json
        import sys

        container_name = sys.argv[1]
        timeout = {{ platform_argocd_controller_readiness_timeout_effective }}
        def local_http_exec_probe(initial_delay, failure_threshold):
            command = (
                "exec 3<>/dev/tcp/127.0.0.1/8082; "
                "printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; "
                "/usr/bin/head -n 1 <&3 | /usr/bin/grep -q ' 200 '"
            )
            return {
                "exec": {
                    "command": ["/usr/bin/timeout", "5", "/usr/bin/bash", "-ec", command],
                },
                "httpGet": None,
                "tcpSocket": None,
                "grpc": None,
                "failureThreshold": failure_threshold,
                "initialDelaySeconds": initial_delay,
                "periodSeconds": 10,
                "successThreshold": 1,
                "timeoutSeconds": timeout,
            }

        readiness = local_http_exec_probe(10, {{ platform_argocd_controller_readiness_failure_threshold_effective }})
        startup = local_http_exec_probe(10, 60)
        print(json.dumps({
            "spec": {
                "template": {
                    "spec": {
                        "containers": [{
                            "name": container_name,
                            "readinessProbe": readiness,
                            "startupProbe": startup,
                            "resources": {
                                "requests": {"cpu": "250m", "memory": "1Gi"},
                                "limits": {"memory": "2Gi"},
                            },
                        }],
                    },
                },
            },
        }))
        PY
          )"
          "$K" --kubeconfig "$C" -n argocd patch "${resource}" \
            --type strategic -p "${patch}" >/dev/null
          after_generation="$("$K" --kubeconfig "$C" -n argocd get "${resource}" \
            -o jsonpath='{.metadata.generation}')"
          if [ "${before_generation}" != "${after_generation}" ]; then
            echo "workload=${resource} state=updated generation=${before_generation}->${after_generation}"
          else
            echo "workload=${resource} state=current generation=${after_generation}"
          fi
        }

        patch_deployment_strategy() {
          resource="$1"
          if ! "$K" --kubeconfig "$C" -n argocd get "${resource}" >/dev/null 2>&1; then
            return 0
          fi
          before_generation="$("$K" --kubeconfig "$C" -n argocd get "${resource}" \
            -o jsonpath='{.metadata.generation}')"
          "$K" --kubeconfig "$C" -n argocd patch "${resource}" --type strategic \
            -p '{"spec":{"strategy":{"type":"RollingUpdate","rollingUpdate":{"maxSurge":0,"maxUnavailable":1}}}}' \
            >/dev/null
          after_generation="$("$K" --kubeconfig "$C" -n argocd get "${resource}" \
            -o jsonpath='{.metadata.generation}')"
          if [ "${before_generation}" != "${after_generation}" ]; then
            echo "workload=${resource} state=updated generation=${before_generation}->${after_generation}"
          else
            echo "workload=${resource} state=current generation=${after_generation}"
          fi
        }

        patch_repo_deployment deployment/argo-cd-argocd-repo-server
        patch_repo_deployment deployment/argocd-repo-server
        patch_controller_statefulset statefulset/argo-cd-argocd-application-controller
        patch_controller_statefulset statefulset/argocd-application-controller
        patch_deployment_strategy deployment/argo-cd-redis-ha-haproxy

      args:
        executable: /bin/bash
      register: platform_argocd_workload_stabilization
      changed_when: "'state=updated' in platform_argocd_workload_stabilization.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Remove obsolete Cilium kubelet health policy after local exec probe migration
      ansible.builtin.shell: |
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        "$K" --kubeconfig "$C" -n argocd delete \
          ciliumnetworkpolicy/platform-argocd-kubelet-health-probes \
          --ignore-not-found=true --wait=false
      args:
        executable: /bin/bash
      register: platform_argocd_obsolete_kubelet_health_policy
      changed_when: "' deleted' in platform_argocd_obsolete_kubelet_health_policy.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Recycle Argo CD pods with timed-out local health probes
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        MIN_AGE={{ platform_argocd_health_probe_recycle_min_age_effective }}
        recycled=0

        while IFS='|' read -r pod phase created_at ready_statuses; do
          [ -n "${pod}" ] || continue
          case "${pod}" in
            argo-cd-argocd-application-controller-*|\
            argo-cd-argocd-repo-server-*|\
            argo-cd-argocd-server-*|\
            argocd-application-controller-*|\
            argocd-repo-server-*|\
            argocd-server-*)
              ;;
            *)
              continue
              ;;
          esac

          case ",${ready_statuses}," in
            *,false,*) ;;
            *) continue ;;
          esac

          created_epoch="$(date -d "${created_at}" +%s 2>/dev/null || echo 0)"
          pod_age=0
          if [ "${created_epoch}" -gt 0 ]; then
            pod_age="$(( $(date +%s) - created_epoch ))"
          fi
          if [ "${pod_age}" -lt "${MIN_AGE}" ]; then
            echo "pod=${pod} phase=${phase} ready=${ready_statuses} age=${pod_age}s action=keep reason=pod-too-young-for-recycle"
            continue
          fi

          diagnostics="$("$K" --kubeconfig "$C" -n argocd describe "pod/${pod}" 2>&1 || true)"
          if printf '%s\n' "${diagnostics}" |
            grep -Eiq '(Readiness|Liveness|Startup) probe failed.*(context deadline exceeded|Client\.Timeout exceeded|i/o timeout)'; then
            echo "pod=${pod} phase=${phase} ready=${ready_statuses} age=${pod_age}s action=recycle reason=local-health-probe-timeout"
            "$K" --kubeconfig "$C" -n argocd delete "pod/${pod}" --wait=false
            recycled=$((recycled + 1))
          else
            echo "pod=${pod} phase=${phase} ready=${ready_statuses} action=keep reason=no-local-health-probe-timeout"
          fi
        done < <("$K" --kubeconfig "$C" -n argocd get pods \
          -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.status.phase}{"|"}{.metadata.creationTimestamp}{"|"}{range .status.containerStatuses[*]}{.ready}{","}{end}{"\n"}{end}' 2>/dev/null || true)

        echo "argocd_health_probe_recovery recycled=${recycled}"
        if [ "${recycled}" -gt 0 ]; then
          sleep 5
        fi
      args:
        executable: /bin/bash
      register: platform_argocd_health_probe_recovery
      changed_when: "'action=recycle' in platform_argocd_health_probe_recovery.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Wait for stabilized or recycled Argo CD workloads to become ready
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        RECOVERY_TIMEOUT={{ platform_argocd_health_probe_recovery_timeout_effective }}

        if "$K" --kubeconfig "$C" -n argocd get deployment/argo-cd-argocd-server >/dev/null 2>&1; then
          workloads="
          deployment/argo-cd-argocd-repo-server
          deployment/argo-cd-argocd-server
          deployment/argo-cd-redis-ha-haproxy
          statefulset/argo-cd-argocd-application-controller
          statefulset/argo-cd-redis-ha-server
          "
        else
          workloads="
          deployment/argocd-repo-server
          deployment/argocd-server
          deployment/argocd-redis
          statefulset/argocd-application-controller
          "
        fi

        for workload in ${workloads}; do
          if ! "$K" --kubeconfig "$C" -n argocd get "${workload}" >/dev/null 2>&1; then
            echo "workload=${workload} action=skip reason=not-found"
            continue
          fi
          echo "workload=${workload} action=wait-ready timeout=${RECOVERY_TIMEOUT}s"
          "$K" --kubeconfig "$C" -n argocd rollout status "${workload}" \
            --timeout="${RECOVERY_TIMEOUT}s"
          echo "workload=${workload} result=ready"
        done
      args:
        executable: /bin/bash
      register: platform_argocd_health_probe_recovery_wait
      changed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      when: >-
        platform_argocd_service_path_repair.changed or
        platform_argocd_workload_stabilization.changed or
        platform_argocd_health_probe_recovery.changed

    - name: Wait for active Argo CD internal service endpoints
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml

        if "$K" --kubeconfig "$C" -n argocd get service/argo-cd-argocd-server >/dev/null 2>&1 ||
          "$K" --kubeconfig "$C" -n argocd get deployment/argo-cd-argocd-server >/dev/null 2>&1; then
          services="argo-cd-argocd-server argo-cd-argocd-repo-server argo-cd-redis-ha-haproxy"
        else
          services="argocd-server argocd-repo-server-headless argocd-redis-headless"
        fi

        for service in ${services}; do
          endpoints="$("$K" --kubeconfig "$C" -n argocd get endpointslice \
            -l "kubernetes.io/service-name=${service}" \
            -o jsonpath='{range .items[*].endpoints[*]}{.conditions.ready}{"\n"}{end}' 2>/dev/null |
            awk '$1 == "true" || $1 == "<none>" || $1 == "" { count++ } END { print count + 0 }')"
          echo "service=${service} ready_endpoints=${endpoints}"
          test "${endpoints}" -ge 1
        done
      args:
        executable: /bin/bash
      register: platform_argocd_service_path_endpoints
      retries: "{{ (((platform_argocd_service_repair_timeout_effective | int) / 5) | round(0, 'ceil') | int) + 1 }}"
      delay: 5
      until: platform_argocd_service_path_endpoints.rc == 0
      changed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Check active Argo CD workload rollouts after internal service repair
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        STRICT="{{ platform_argocd_service_repair_rollout_strict_effective | bool | lower }}"
        ROLLOUT_TIMEOUT={{ platform_argocd_service_repair_rollout_timeout_effective }}
        failed=0

        if "$K" --kubeconfig "$C" -n argocd get service/argo-cd-argocd-server >/dev/null 2>&1 ||
          "$K" --kubeconfig "$C" -n argocd get deployment/argo-cd-argocd-server >/dev/null 2>&1; then
          workloads="
          deployment/argo-cd-argocd-applicationset-controller
          deployment/argo-cd-argocd-dex-server
          deployment/argo-cd-argocd-notifications-controller
          deployment/argo-cd-argocd-repo-server
          deployment/argo-cd-argocd-server
          deployment/argo-cd-redis-ha-haproxy
          statefulset/argo-cd-argocd-application-controller
          statefulset/argo-cd-redis-ha-server
          "
        else
          workloads="
          deployment/argocd-applicationset-controller
          deployment/argocd-dex-server
          deployment/argocd-notifications-controller
          deployment/argocd-redis
          deployment/argocd-repo-server
          deployment/argocd-server
          statefulset/argocd-application-controller
          "
        fi

        for workload in ${workloads}; do
          if "$K" --kubeconfig "$C" -n argocd get "${workload}" >/dev/null 2>&1; then
            echo "checking rollout workload=${workload} timeout=${ROLLOUT_TIMEOUT}s strict=${STRICT}"
            if "$K" --kubeconfig "$C" -n argocd rollout status "${workload}" --timeout="${ROLLOUT_TIMEOUT}s"; then
              echo "result=ok workload=${workload}"
            else
              echo "result=warn reason=argocd-workload-rollout-timeout workload=${workload}"
              failed=1
            fi
          fi
        done

        echo "===== argocd workload summary after rollout check ====="
        "$K" --kubeconfig "$C" -n argocd get deploy,statefulset,pods -o wide || true

        if [ "${failed}" -ne 0 ] && [ "${STRICT}" = "true" ]; then
          exit 1
        fi
        exit 0
      args:
        executable: /bin/bash
      register: platform_argocd_service_path_rollout
      changed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Remove stale bootstrap Argo CD workloads when Helm HA stack is active
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml

        if ! "$K" --kubeconfig "$C" -n argocd get service/argo-cd-argocd-server >/dev/null 2>&1 &&
          ! "$K" --kubeconfig "$C" -n argocd get deployment/argo-cd-argocd-server >/dev/null 2>&1; then
          echo "argocd_active_stack=bootstrap cleanup=skipped"
          exit 0
        fi

        echo "argocd_active_stack=helm-ha cleanup=stale-bootstrap"
        for kind in deployment statefulset service ingress ingressroute.traefik.io poddisruptionbudget networkpolicy; do
          while IFS= read -r resource; do
            case "${resource}" in
              */argocd-*)
                "$K" --kubeconfig "$C" -n argocd delete "${resource}" --ignore-not-found=true --wait=false
                ;;
            esac
          done < <("$K" --kubeconfig "$C" -n argocd get "${kind}" -o name 2>/dev/null || true)
        done

        while IFS= read -r pod; do
          case "${pod}" in
            pod/argocd-*)
              "$K" --kubeconfig "$C" -n argocd delete "${pod}" --ignore-not-found=true --wait=false
              ;;
          esac
        done < <("$K" --kubeconfig "$C" -n argocd get pod -o name 2>/dev/null || true)
      args:
        executable: /bin/bash
      register: platform_argocd_stale_bootstrap_cleanup
      changed_when: "'deleted' in platform_argocd_stale_bootstrap_cleanup.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      when: platform_argocd_cleanup_stale_bootstrap_effective | bool

    - name: Reconcile guarded pruning for refreshed Argo CD applications
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        APPS="{{ platform_argocd_service_repair_retry_apps_effective }}"
        for app in ${APPS}; do
          app_changed=0
          if ! "$K" --kubeconfig "$C" -n argocd get "application/${app}" >/dev/null 2>&1; then
            echo "application=${app} action=skip-guarded-prune reason=not-found"
            continue
          fi

          application_json="$($K --kubeconfig "$C" -n argocd get "application/${app}" \
            -o json 2>/dev/null || true)"
          automated="$(printf '%s' "${application_json}" | /usr/bin/python3 -c \
            'import json, sys; data = json.load(sys.stdin); automated = ((data.get("spec") or {}).get("syncPolicy") or {}).get("automated") or {}; flag = lambda value: "true" if value is True else ("false" if value is False else ""); print("|".join(flag(automated.get(key)) for key in ("prune", "selfHeal", "allowEmpty")))' \
            2>/dev/null || true)"
          if [ "${automated}" != "true|true|false" ]; then
            "$K" --kubeconfig "$C" -n argocd patch "application/${app}" --type=merge \
              -p '{"spec":{"syncPolicy":{"automated":{"prune":true,"selfHeal":true,"allowEmpty":false}}}}' \
              >/dev/null
            echo "application=${app} action=reconciled-guarded-prune field=automated"
            app_changed=1
          fi

          options_json="$(printf '%s' "${application_json}" | /usr/bin/python3 -c \
            'import json, sys; data = json.load(sys.stdin); policy = (data.get("spec") or {}).get("syncPolicy") or {}; print(json.dumps(policy.get("syncOptions"), separators=(",", ":")))' \
            2>/dev/null || true)"
          if [ -z "${options_json}" ] || [ "${options_json}" = "null" ]; then
            "$K" --kubeconfig "$C" -n argocd patch "application/${app}" --type=merge \
              -p '{"spec":{"syncPolicy":{"syncOptions":[]}}}' >/dev/null
            options_json='[]'
          fi

          for option in \
            CreateNamespace=true \
            Prune=confirm \
            PruneLast=true \
            PrunePropagationPolicy=foreground; do
            if printf '%s\n' "${options_json}" | grep -Fq -- "\"${option}\""; then
              continue
            fi
            "$K" --kubeconfig "$C" -n argocd patch "application/${app}" --type=json \
              -p "[{\"op\":\"add\",\"path\":\"/spec/syncPolicy/syncOptions/-\",\"value\":\"${option}\"}]" \
              >/dev/null
            echo "application=${app} action=reconciled-guarded-prune syncOption=${option}"
            app_changed=1
          done

          if [ "${app_changed}" -eq 0 ]; then
            echo "application=${app} action=guarded-prune-already-current"
          fi
        done
      args:
        executable: /bin/bash
      register: platform_argocd_guarded_prune_reconcile
      changed_when: "'action=reconciled-guarded-prune' in platform_argocd_guarded_prune_reconcile.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      when: platform_argocd_service_repair_guarded_prune_effective | bool

    - name: Refresh platform applications after Argo CD service repair
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        APPS="{{ platform_argocd_service_repair_retry_apps_effective }}"
        REFRESH_TIMEOUT={{ platform_argocd_service_repair_refresh_timeout_effective }}

        declare -a refresh_apps=()
        declare -A refresh_baseline_reconciled_at=()
        declare -A refresh_pending=()
        declare -A refresh_last_state=()
        failed=0

        # Request every refresh first so one stuck application cannot consume a
        # full timeout before the remaining applications are even notified.
        for app in ${APPS}; do
          if ! "$K" --kubeconfig "$C" -n argocd get "application/${app}" >/dev/null 2>&1; then
            echo "application=${app} action=skip-refresh reason=not-found"
            continue
          fi
          baseline_state="$("$K" --kubeconfig "$C" -n argocd get "application/${app}" \
            -o jsonpath='{.status.reconciledAt}{"|"}{.metadata.annotations.argocd\.argoproj\.io/refresh}' \
            2>/dev/null || true)"
          baseline_reconciled_at="$(printf '%s' "${baseline_state}" | cut -d'|' -f1)"
          preexisting_refresh="$(printf '%s' "${baseline_state}" | cut -d'|' -f2)"
          if [ -n "${preexisting_refresh}" ]; then
            if ! "$K" --kubeconfig "$C" -n argocd annotate "application/${app}" \
              argocd.argoproj.io/refresh- >/dev/null; then
              echo "application=${app} action=stop reason=preexisting-refresh-cleanup-failed value=${preexisting_refresh}" >&2
              failed=1
              continue
            fi
            echo "application=${app} action=clear-preexisting-refresh value=${preexisting_refresh}"
          fi
          if ! "$K" --kubeconfig "$C" -n argocd annotate "application/${app}" \
            argocd.argoproj.io/refresh=hard --overwrite; then
            echo "application=${app} action=stop reason=hard-refresh-request-failed" >&2
            failed=1
            continue
          fi
          echo "application=${app} action=hard-refresh-requested"
          refresh_apps+=("${app}")
          refresh_baseline_reconciled_at["${app}"]="${baseline_reconciled_at}"
          refresh_pending["${app}"]=true
          refresh_last_state["${app}"]=not-observed
        done

        refresh_deadline="$(( $(date +%s) + REFRESH_TIMEOUT ))"
        while [ "$(date +%s)" -lt "${refresh_deadline}" ]; do
          pending_count=0
          for app in "${refresh_apps[@]}"; do
            if [ "${refresh_pending[${app}]:-false}" != "true" ]; then
              continue
            fi
            pending_count="$((pending_count + 1))"
            if ! state="$("$K" --kubeconfig "$C" -n argocd get "application/${app}" \
              -o jsonpath='{.status.reconciledAt}{"|"}{.metadata.annotations.argocd\.argoproj\.io/refresh}{"|"}{.operation.sync.revision}{"|"}{.status.operationState.phase}{"|"}{.status.sync.status}' \
              2>/dev/null)"; then
              refresh_last_state["${app}"]=unavailable
              continue
            fi
            refresh_last_state["${app}"]="${state}"
            reconciled_at="$(printf '%s' "${state}" | cut -d'|' -f1)"
            refresh="$(printf '%s' "${state}" | cut -d'|' -f2)"
            requested_revision="$(printf '%s' "${state}" | cut -d'|' -f3)"
            phase="$(printf '%s' "${state}" | cut -d'|' -f4)"
            sync_status="$(printf '%s' "${state}" | cut -d'|' -f5)"
            baseline_reconciled_at="${refresh_baseline_reconciled_at[${app}]:-}"
            reconciliation_observed=false
            if [ -z "${refresh}" ] || \
              { [ -n "${reconciled_at}" ] && [ "${reconciled_at}" != "${baseline_reconciled_at}" ]; }; then
              reconciliation_observed=true
            fi
            if [ "${reconciliation_observed}" = "true" ]; then
              echo "application=${app} action=hard-refresh-acknowledged reconciledAt=${reconciled_at:-unknown} operation=${phase:-none} requestedRevision=${requested_revision:-none} sync=${sync_status:-unknown}"
              if [ -n "${refresh}" ]; then
                if "$K" --kubeconfig "$C" -n argocd annotate "application/${app}" \
                  argocd.argoproj.io/refresh- >/dev/null 2>&1; then
                  echo "application=${app} action=clear-refresh reason=reconciled-at-advanced"
                else
                  echo "application=${app} action=warn reason=refresh-cleanup-failed" >&2
                fi
              fi
              refresh_pending["${app}"]=false
              pending_count="$((pending_count - 1))"
            fi
          done
          if [ "${pending_count}" -eq 0 ]; then
            break
          fi
          sleep 5
        done

        for app in "${refresh_apps[@]}"; do
          if [ "${refresh_pending[${app}]:-false}" = "true" ]; then
            state="${refresh_last_state[${app}]:-}"
            requested_revision="$(printf '%s' "${state}" | cut -d'|' -f3)"
            phase="$(printf '%s' "${state}" | cut -d'|' -f4)"
            sync_status="$(printf '%s' "${state}" | cut -d'|' -f5)"
            cleanup=failed
            if "$K" --kubeconfig "$C" -n argocd annotate "application/${app}" \
              argocd.argoproj.io/refresh- >/dev/null 2>&1; then
              cleanup=cleared
            fi
            stable=false
            if [ -z "${requested_revision}" ] && [ "${sync_status}" = "Synced" ]; then
              case "${phase}" in
                ""|Succeeded) stable=true ;;
              esac
            fi
            if [ "${stable}" = "true" ]; then
              echo "application=${app} action=continue reason=hard-refresh-unacknowledged timeout=${REFRESH_TIMEOUT}s cleanup=${cleanup} phase=${phase:-none} sync=${sync_status}"
            else
              echo "application=${app} action=stop reason=hard-refresh-not-acknowledged timeout=${REFRESH_TIMEOUT}s cleanup=${cleanup} baselineReconciledAt=${refresh_baseline_reconciled_at[${app}]:-none} lastState=${state:-not-observed}" >&2
              failed=1
            fi
          fi
        done
        exit "${failed}"
      args:
        executable: /bin/bash
      register: platform_argocd_service_path_app_refresh
      changed_when: "'annotated' in platform_argocd_service_path_app_refresh.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      when: platform_argocd_service_repair_refresh_apps_effective | bool

    - name: Retry failed Argo CD application operations after service repair
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        RETRY_APPS="{{ platform_argocd_service_repair_retry_apps_effective }}"
        APP_SYNC_TIMEOUT={{ platform_argocd_service_repair_app_sync_timeout_effective }}
        RECOVER_STUCK_OPERATIONS="{{ platform_argocd_service_repair_recover_stuck_operations_effective | bool | lower }}"
        OPERATION_TERMINATION_TIMEOUT={{ platform_argocd_service_repair_operation_termination_timeout_effective }}
        failed=0

        read_application_state() {
          app="$1"
          if ! application_state="$("$K" --kubeconfig "$C" -n argocd get "application/${app}" \
            -o jsonpath='{.metadata.resourceVersion}{"|"}{.operation.sync.revision}{"|"}{.status.operationState.phase}{"|"}{.status.sync.status}{"|"}{.status.operationState.startedAt}{"|"}{.status.operationState.operation.sync.revision}' \
            2>/dev/null)"; then
            application_resource_version=""
            requested_revision=""
            operation_phase=""
            sync_status=""
            operation_started_at=""
            state_operation_revision=""
            return 1
          fi
          application_resource_version="$(printf '%s' "${application_state}" | cut -d'|' -f1)"
          requested_revision="$(printf '%s' "${application_state}" | cut -d'|' -f2)"
          operation_phase="$(printf '%s' "${application_state}" | cut -d'|' -f3)"
          sync_status="$(printf '%s' "${application_state}" | cut -d'|' -f4)"
          operation_started_at="$(printf '%s' "${application_state}" | cut -d'|' -f5)"
          state_operation_revision="$(printf '%s' "${application_state}" | cut -d'|' -f6)"
        }

        read_operation_message() {
          app="$1"
          "$K" --kubeconfig "$C" -n argocd get "application/${app}" \
            -o jsonpath='{.status.operationState.message}' 2>/dev/null || true
        }

        remaining_operation_timeout() {
          started_at="$1"
          if [ -z "${started_at}" ] || \
            ! started_epoch="$(date -d "${started_at}" +%s 2>/dev/null)"; then
            printf '%s\n' "${APP_SYNC_TIMEOUT}"
            return
          fi
          now_epoch="$(date +%s)"
          age="$((now_epoch - started_epoch))"
          if [ "${age}" -lt 0 ]; then
            age=0
          fi
          remaining="$((APP_SYNC_TIMEOUT - age))"
          if [ "${remaining}" -lt 0 ]; then
            remaining=0
          fi
          printf '%s\n' "${remaining}"
        }

        wait_for_requested_operation() {
          app="$1"
          timeout="${2:-${APP_SYNC_TIMEOUT}}"
          deadline="$(( $(date +%s) + timeout ))"
          while [ "$(date +%s)" -lt "${deadline}" ]; do
            if ! read_application_state "${app}"; then
              sleep 5
              continue
            fi
            if [ -z "${requested_revision}" ] && [ "${operation_phase}" != "Running" ] && [ "${operation_phase}" != "Terminating" ]; then
              echo "application=${app} action=sync-finished phase=${operation_phase:-none} sync=${sync_status:-unknown}"
              return 0
            fi
            sleep 5
          done
          echo "application=${app} action=sync-wait-timeout timeout=${timeout}s"
          return 1
        }

        recover_timed_out_operation() {
          app="$1"
          expected_requested_revision="$2"
          expected_started_at="$3"
          expected_state_revision="$4"
          application_json="$(mktemp)"
          patch_json="$(mktemp)"

          if ! "$K" --kubeconfig "$C" -n argocd get "application/${app}" -o json >"${application_json}"; then
            rm -f "${application_json}" "${patch_json}"
            echo "application=${app} action=stop-recovery reason=state-unavailable" >&2
            return 1
          fi
          if ! recovery_action="$(python3 - "${application_json}" "${patch_json}" \
            "${expected_requested_revision}" "${expected_started_at}" "${expected_state_revision}" <<'PY'
        import json
        import sys

        source_path, patch_path, expected_requested, expected_started, expected_state_revision = sys.argv[1:]
        with open(source_path, encoding="utf-8") as handle:
            application = json.load(handle)

        metadata = application.get("metadata", {})
        operation = application.get("operation")
        status = application.get("status", {})
        operation_state = status.get("operationState") or {}
        state_operation = operation_state.get("operation") or {}
        state_sync = state_operation.get("sync") or {}
        current_requested = ((operation or {}).get("sync") or {}).get("revision", "")
        current_started = operation_state.get("startedAt", "")
        current_state_revision = state_sync.get("revision", "")
        phase = operation_state.get("phase", "")
        sync_status = (status.get("sync") or {}).get("status", "")
        resource_version = metadata.get("resourceVersion", "")

        same_started = bool(expected_started) and current_started == expected_started
        same_state_revision = (
            not expected_state_revision or current_state_revision == expected_state_revision
        )
        identity_available = bool(expected_started and current_started)
        action = "reject-unidentified-operation"
        patch = []

        if not resource_version or phase not in {"Running", "Terminating"}:
            action = "reject-operation-changed"
        elif not identity_available:
            action = "reject-unidentified-operation"
        elif not operation:
            if (
                sync_status == "Synced"
                and identity_available
                and same_started
                and same_state_revision
            ):
                action = "clear-stale-state"
                patch = [
                    {
                        "op": "test",
                        "path": "/metadata/resourceVersion",
                        "value": resource_version,
                    },
                    {"op": "test", "path": "/status/operationState/phase", "value": phase},
                    {"op": "remove", "path": "/status/operationState"},
                ]
            else:
                action = "reject-stale-state-not-synced"
        elif (
            identity_available
            and (not expected_requested or current_requested == expected_requested)
            and same_started
            and same_state_revision
        ):
            if phase == "Running":
                action = "terminate"
                patch = [
                    {
                        "op": "test",
                        "path": "/metadata/resourceVersion",
                        "value": resource_version,
                    },
                    {"op": "test", "path": "/status/operationState/phase", "value": phase},
                    {
                        "op": "replace",
                        "path": "/status/operationState/phase",
                        "value": "Terminating",
                    },
                ]
            else:
                action = "wait-terminating"
        else:
            action = "reject-operation-changed"

        with open(patch_path, "w", encoding="utf-8") as handle:
            json.dump(patch, handle)
        print(action)
        PY
          )"; then
            rm -f "${application_json}" "${patch_json}"
            echo "application=${app} action=stop-recovery reason=decision-failed" >&2
            return 1
          fi

          case "${recovery_action}" in
            terminate)
              if ! "$K" --kubeconfig "$C" -n argocd patch "application/${app}" \
                --type json --patch-file "${patch_json}" >/dev/null; then
                rm -f "${application_json}" "${patch_json}"
                echo "application=${app} action=stop-recovery reason=operation-changed-during-termination" >&2
                return 1
              fi
              echo "application=${app} action=terminate-stuck-operation revision=${expected_requested_revision:-default} startedAt=${expected_started_at:-unknown}"
              ;;
            clear-stale-state)
              if ! "$K" --kubeconfig "$C" -n argocd patch "application/${app}" \
                --type json --patch-file "${patch_json}" >/dev/null; then
                rm -f "${application_json}" "${patch_json}"
                echo "application=${app} action=stop-recovery reason=operation-changed-during-stale-state-cleanup" >&2
                return 1
              fi
              if "$K" --kubeconfig "$C" -n argocd annotate "application/${app}" \
                argocd.argoproj.io/refresh=hard --overwrite >/dev/null 2>&1; then
                echo "application=${app} action=clear-stale-operation-state refresh=requested"
              else
                echo "application=${app} action=clear-stale-operation-state refresh=failed" >&2
              fi
              ;;
            wait-terminating)
              echo "application=${app} action=wait-stuck-operation-termination"
              ;;
            reject-*)
              rm -f "${application_json}" "${patch_json}"
              echo "application=${app} action=stop-recovery reason=${recovery_action#reject-}" >&2
              return 1
              ;;
            *)
              rm -f "${application_json}" "${patch_json}"
              echo "application=${app} action=stop-recovery reason=unknown-decision decision=${recovery_action}" >&2
              return 1
              ;;
          esac
          rm -f "${application_json}" "${patch_json}"
        }

        for app in ${RETRY_APPS}; do
          if ! "$K" --kubeconfig "$C" -n argocd get "application/${app}" >/dev/null 2>&1; then
            echo "application=${app} action=skip reason=not-found"
            continue
          fi
          if ! read_application_state "${app}"; then
            echo "application=${app} action=stop-retries reason=state-unavailable" >&2
            failed=1
            continue
          fi
          retry_reason=""

          case "${operation_phase}" in
            Running|Terminating)
              echo "application=${app} action=keep operation=${operation_phase}"
              timed_out_requested_revision="${requested_revision}"
              timed_out_started_at="${operation_started_at}"
              timed_out_state_revision="${state_operation_revision}"
              initial_operation_timeout="$(remaining_operation_timeout "${operation_started_at}")"
              echo "application=${app} action=wait-existing-operation remaining=${initial_operation_timeout}s startedAt=${operation_started_at:-unknown}"
              if ! wait_for_requested_operation "${app}" "${initial_operation_timeout}"; then
                if [ "${RECOVER_STUCK_OPERATIONS}" != "true" ]; then
                  echo "application=${app} action=stop-retries reason=sync-wait-timeout recovery=disabled" >&2
                  failed=1
                  continue
                fi
                if ! recover_timed_out_operation "${app}" \
                  "${timed_out_requested_revision}" "${timed_out_started_at}" \
                  "${timed_out_state_revision}"; then
                  echo "application=${app} action=stop-retries reason=stuck-operation-recovery-rejected" >&2
                  failed=1
                  continue
                fi
                if ! wait_for_requested_operation "${app}" "${OPERATION_TERMINATION_TIMEOUT}"; then
                  operation_message="$(read_operation_message "${app}")"
                  echo "application=${app} action=stop-retries reason=operation-termination-timeout timeout=${OPERATION_TERMINATION_TIMEOUT}s message=${operation_message:-unavailable}" >&2
                  failed=1
                  continue
                fi
              fi
              if ! read_application_state "${app}"; then
                echo "application=${app} action=stop-retries reason=state-unavailable-after-wait" >&2
                failed=1
                continue
              fi
              ;;
          esac
          case "${operation_phase}" in
            Error|Failed)
              retry_reason="operation-${operation_phase}"
              ;;
          esac
          if [ -z "${retry_reason}" ]; then
            echo "application=${app} action=keep sync=${sync_status:-unknown} operation=${operation_phase:-none}"
            continue
          fi

          revision="$("$K" --kubeconfig "$C" -n argocd get "application/${app}" \
            -o jsonpath='{.spec.source.targetRevision}' 2>/dev/null || true)"
          if [ -z "${revision}" ]; then
            revision="$("$K" --kubeconfig "$C" -n argocd get "application/${app}" \
              -o jsonpath='{.spec.sources[0].targetRevision}' 2>/dev/null || true)"
          fi
          revision="${revision:-main}"
          if ! "$K" --kubeconfig "$C" -n argocd patch "application/${app}" --type merge \
            -p "$(printf '{"operation":{"sync":{"revision":"%s","prune":false}},"status":{"operationState":null}}' "${revision}")" >/dev/null; then
            echo "application=${app} action=stop-retries reason=sync-request-failed" >&2
            failed=1
            continue
          fi
          echo "application=${app} action=sync-requested reason=${retry_reason} revision=${revision} prune=false"
          sleep 5
          if ! wait_for_requested_operation "${app}"; then
            echo "application=${app} action=stop-retries reason=sync-wait-timeout" >&2
            failed=1
            continue
          fi
          if ! read_application_state "${app}"; then
            echo "application=${app} action=stop-retries reason=state-unavailable-after-retry" >&2
            failed=1
            continue
          fi
          case "${operation_phase}" in
            Error|Failed)
              operation_message="$(read_operation_message "${app}")"
              echo "application=${app} action=stop-retries reason=retry-${operation_phase} sync=${sync_status:-unknown} message=${operation_message:-unavailable}" >&2
              failed=1
              ;;
          esac
        done
        exit "${failed}"
      args:
        executable: /bin/bash
      register: platform_argocd_failed_app_retry
      changed_when: >-
        'action=sync-requested' in platform_argocd_failed_app_retry.stdout or
        'action=terminate-stuck-operation' in platform_argocd_failed_app_retry.stdout or
        'action=clear-stale-operation-state' in platform_argocd_failed_app_retry.stdout
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      when: platform_argocd_service_repair_refresh_apps_effective | bool

    - name: Explain skipped legacy Traefik prune after unacknowledged refresh
      ansible.builtin.debug:
        msg: >-
          Skipping legacy Traefik pruning because Argo CD did not acknowledge
          the requested Traefik hard refresh. The application remains idle and
          Synced, but pruning from an unrefreshed resource inventory is unsafe.
      run_once: true
      when:
        - platform_argocd_prune_legacy_traefik_effective | bool
        - >-
          'application=traefik action=continue reason=hard-refresh-unacknowledged'
          in (platform_argocd_service_path_app_refresh.stdout | default(''))

    - name: Prune known stale Traefik chart resources
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        APP_SYNC_TIMEOUT={{ platform_argocd_service_repair_app_sync_timeout_effective }}

        if ! "$K" --kubeconfig "$C" -n argocd get application/traefik >/dev/null 2>&1; then
          echo "application=traefik action=skip reason=not-found"
          exit 0
        fi

        wait_for_reconciliation() {
          baseline_reconciled_at="$1"
          last_state="not-observed"
          deadline="$(( $(date +%s) + APP_SYNC_TIMEOUT ))"
          while [ "$(date +%s)" -lt "${deadline}" ]; do
            state="$($K --kubeconfig "$C" -n argocd get application/traefik \
              -o jsonpath='{.status.reconciledAt}{"|"}{.metadata.annotations.argocd\.argoproj\.io/refresh}{"|"}{.operation.sync.revision}{"|"}{.status.operationState.phase}{"|"}{.status.sync.status}' \
              2>/dev/null || true)"
            last_state="${state}"
            reconciled_at="$(printf '%s' "${state}" | cut -d'|' -f1)"
            refresh="$(printf '%s' "${state}" | cut -d'|' -f2)"
            requested_revision="$(printf '%s' "${state}" | cut -d'|' -f3)"
            phase="$(printf '%s' "${state}" | cut -d'|' -f4)"
            sync_status="$(printf '%s' "${state}" | cut -d'|' -f5)"
            reconciliation_observed=false
            if [ -z "${refresh}" ] || \
              { [ -n "${reconciled_at}" ] && [ "${reconciled_at}" != "${baseline_reconciled_at}" ]; }; then
              reconciliation_observed=true
            fi
            if [ "${reconciliation_observed}" = "true" ] && [ -z "${requested_revision}" ] && \
              [ "${phase}" != "Running" ] && [ "${phase}" != "Terminating" ]; then
              echo "application=traefik action=hard-refresh-finished reconciledAt=${reconciled_at:-unknown} phase=${phase:-none} sync=${sync_status:-unknown}"
              return 0
            fi
            sleep 5
          done
          echo "application=traefik action=hard-refresh-timeout baselineReconciledAt=${baseline_reconciled_at:-none} lastState=${last_state}" >&2
          return 1
        }

        baseline_reconciled_at="$($K --kubeconfig "$C" -n argocd get application/traefik \
          -o jsonpath='{.status.reconciledAt}' 2>/dev/null || true)"
        if ! "$K" --kubeconfig "$C" -n argocd annotate application/traefik \
          argocd.argoproj.io/refresh=hard --overwrite >/dev/null; then
          echo "application=traefik action=stop reason=hard-refresh-request-failed" >&2
          exit 1
        fi
        if ! wait_for_reconciliation "${baseline_reconciled_at}"; then
          echo "application=traefik action=stop reason=hard-refresh-not-reconciled" >&2
          exit 1
        fi

        app_json="$(mktemp)"
        trap 'rm -f "${app_json}"' EXIT
        "$K" --kubeconfig "$C" -n argocd get application/traefik -o json >"${app_json}"

        set +e
        python3 - "${app_json}" <<'PY'
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as handle:
            application = json.load(handle)

        allowed = {
            ("", "ServiceAccount", "traefik", "traefik"),
            ("networking.k8s.io", "IngressClass", "", "platform-traefik"),
            ("policy", "PodDisruptionBudget", "traefik", "traefik"),
            ("rbac.authorization.k8s.io", "ClusterRole", "", "traefik-traefik"),
            ("rbac.authorization.k8s.io", "ClusterRoleBinding", "", "traefik-traefik"),
        }
        stale = {
            (
                resource.get("group", ""),
                resource.get("kind", ""),
                resource.get("namespace", ""),
                resource.get("name", ""),
            )
            for resource in application.get("status", {}).get("resources", [])
            if resource.get("requiresPruning") is True
        }
        if not stale:
            print("application=traefik action=keep reason=no-prune-candidates")
            raise SystemExit(0)

        unexpected = stale - allowed
        for group, kind, namespace, name in sorted(stale):
            classification = "unexpected" if (group, kind, namespace, name) in unexpected else "legacy"
            print(
                "application=traefik prune_candidate="
                f"{group or 'core'}/{kind}/{namespace or 'cluster'}/{name} classification={classification}"
            )
        if unexpected:
            print("application=traefik action=stop reason=unexpected-prune-candidates", file=sys.stderr)
            raise SystemExit(42)
        raise SystemExit(10)
        PY
        classify_rc=$?
        set -e

        case "${classify_rc}" in
          0)
            exit 0
            ;;
          10)
            ;;
          42)
            echo "Refusing to prune Traefik because Argo CD reported resources outside the known legacy chart identity set." >&2
            exit 1
            ;;
          *)
            echo "Unable to classify Traefik prune candidates (rc=${classify_rc})." >&2
            exit 1
            ;;
        esac

        revision="$($K --kubeconfig "$C" -n argocd get application/traefik \
          -o jsonpath='{.spec.source.targetRevision}' 2>/dev/null || true)"
        revision="${revision:-main}"
        "$K" --kubeconfig "$C" -n argocd patch application/traefik --type merge \
          -p "$(printf '{\"operation\":{\"sync\":{\"revision\":\"%s\",\"prune\":true}}}' "${revision}")" >/dev/null
        echo "application=traefik action=prune-requested revision=${revision} prune=true"

        deadline="$(( $(date +%s) + APP_SYNC_TIMEOUT ))"
        while [ "$(date +%s)" -lt "${deadline}" ]; do
          state="$($K --kubeconfig "$C" -n argocd get application/traefik \
            -o jsonpath='{.operation.sync.revision}{"|"}{.status.operationState.phase}{"|"}{.status.sync.status}' \
            2>/dev/null || true)"
          requested_revision="$(printf '%s' "${state}" | cut -d'|' -f1)"
          phase="$(printf '%s' "${state}" | cut -d'|' -f2)"
          sync_status="$(printf '%s' "${state}" | cut -d'|' -f3)"
          case "${phase}" in
            Error|Failed)
              if [ -z "${requested_revision}" ]; then
                echo "application=traefik action=stop reason=prune-sync-${phase} sync=${sync_status:-unknown}" >&2
                exit 1
              fi
              ;;
          esac
          if [ -z "${requested_revision}" ] && [ "${phase}" = "Succeeded" ] && [ "${sync_status}" = "Synced" ]; then
            echo "application=traefik action=prune-finished phase=${phase} sync=${sync_status}"
            exit 0
          fi
          sleep 5
        done

        echo "application=traefik action=stop reason=prune-sync-timeout lastState=${state:-not-observed}" >&2
        exit 1
      args:
        executable: /bin/bash
      register: platform_argocd_legacy_traefik_prune
      changed_when: "'action=prune-requested' in platform_argocd_legacy_traefik_prune.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      when:
        - platform_argocd_prune_legacy_traefik_effective | bool
        - >-
          'application=traefik action=continue reason=hard-refresh-unacknowledged'
          not in (platform_argocd_service_path_app_refresh.stdout | default(''))

    - name: Verify final Argo CD core readiness after application retries
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        RECOVERY_TIMEOUT={{ platform_argocd_health_probe_recovery_timeout_effective }}

        if "$K" --kubeconfig "$C" -n argocd get deployment/argo-cd-argocd-server >/dev/null 2>&1; then
          workloads="
          deployment/argo-cd-argocd-repo-server
          deployment/argo-cd-argocd-server
          deployment/argo-cd-redis-ha-haproxy
          statefulset/argo-cd-argocd-application-controller
          statefulset/argo-cd-redis-ha-server
          "
          services="argo-cd-argocd-repo-server argo-cd-argocd-server argo-cd-redis-ha-haproxy"
        else
          workloads="
          deployment/argocd-repo-server
          deployment/argocd-server
          deployment/argocd-redis
          statefulset/argocd-application-controller
          "
          services="argocd-repo-server-headless argocd-server argocd-redis-headless"
        fi

        for workload in ${workloads}; do
          if ! "$K" --kubeconfig "$C" -n argocd get "${workload}" >/dev/null 2>&1; then
            echo "workload=${workload} action=skip-final-check reason=not-found"
            continue
          fi
          echo "workload=${workload} action=final-wait timeout=${RECOVERY_TIMEOUT}s"
          "$K" --kubeconfig "$C" -n argocd rollout status "${workload}" \
            --timeout="${RECOVERY_TIMEOUT}s"
          echo "workload=${workload} final_result=ready"
        done

        for service in ${services}; do
          ready_endpoints="$("$K" --kubeconfig "$C" -n argocd get endpointslice \
            -l "kubernetes.io/service-name=${service}" \
            -o jsonpath='{range .items[*].endpoints[*]}{.conditions.ready}{"\n"}{end}' 2>/dev/null |
            awk '$1 == "true" || $1 == "<none>" || $1 == "" { count++ } END { print count + 0 }')"
          echo "service=${service} final_ready_endpoints=${ready_endpoints}"
          test "${ready_endpoints}" -ge 1
        done
      args:
        executable: /bin/bash
      register: platform_argocd_final_core_readiness
      changed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Show repaired Argo CD service path state
      ansible.builtin.shell: |
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml

        echo "===== argocd active stack ====="
        if "$K" --kubeconfig "$C" -n argocd get service/argo-cd-argocd-server >/dev/null 2>&1 ||
          "$K" --kubeconfig "$C" -n argocd get deployment/argo-cd-argocd-server >/dev/null 2>&1; then
          echo "argocd_active_stack=helm-ha release=argo-cd"
        else
          echo "argocd_active_stack=bootstrap"
        fi

        echo "===== argocd command parameters ====="
        for cm in argo-cd-argocd-cmd-params-cm argocd-cmd-params-cm; do
          echo "--- configmap/${cm} ---"
          "$K" --kubeconfig "$C" -n argocd get "cm/${cm}" \
            -o jsonpath='repo.server={.data.repo\.server}{"\n"}redis.server={.data.redis\.server}{"\n"}' 2>/dev/null ||
            echo "missing"
        done

        echo "===== argocd services ====="
        "$K" --kubeconfig "$C" -n argocd get svc -o wide || true
        echo "===== argocd endpoints ====="
        "$K" --kubeconfig "$C" -n argocd get endpointslice -o wide || true
        echo "===== argocd pods ====="
        "$K" --kubeconfig "$C" -n argocd get pods -o wide || true
        echo "===== platform applications ====="
        "$K" --kubeconfig "$C" -n argocd get applications.argoproj.io || true
      args:
        executable: /bin/bash
      register: platform_argocd_service_path_after
      changed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Print repaired Argo CD service path state
      ansible.builtin.debug:
        var: platform_argocd_service_path_after.stdout_lines
      run_once: true
