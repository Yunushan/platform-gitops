---
- name: Verify and repair cluster DNS for platform bootstrap jobs
  hosts: rke2_servers
  become: true
  gather_facts: false
  vars:
    rke2_first_server: "{{ groups['rke2_servers'][0] }}"
    platform_dns_upstreams_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_DNS_UPSTREAMS') }}"
    platform_dns_check_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_DNS_CHECK_TIMEOUT') }}"
    platform_dns_check_image_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_DNS_CHECK_IMAGE') }}"
    platform_dns_check_repo_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_DNS_CHECK_REPO') }}"
    platform_dns_ipv4_only_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_DNS_IPV4_ONLY') }}"
    platform_dns_probe_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_DNS_PROBE_TIMEOUT') }}"
    platform_dns_helm_attempts_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_DNS_HELM_ATTEMPTS') }}"
    platform_dns_helm_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_DNS_HELM_TIMEOUT') }}"
    platform_dns_job_cleanup_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_DNS_JOB_CLEANUP_TIMEOUT') }}"
    platform_dns_service_path_repair_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_DNS_SERVICE_PATH_REPAIR') }}"
    platform_dns_force_service_path_repair_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_DNS_FORCE_SERVICE_PATH_REPAIR') }}"
    platform_dns_service_path_rollout_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_DNS_SERVICE_PATH_ROLLOUT_TIMEOUT') }}"
    platform_dns_service_path_poll_interval_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_DNS_SERVICE_PATH_POLL_INTERVAL') }}"
    platform_dns_kube_proxy_delete_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_DNS_KUBE_PROXY_DELETE_TIMEOUT') }}"
    platform_dns_pod_cidrs_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_DNS_POD_CIDRS') }}"
    platform_dns_coredns_replicas_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_DNS_COREDNS_REPLICAS') }}"
    platform_dns_coredns_rollout_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_DNS_COREDNS_ROLLOUT_TIMEOUT') }}"
    platform_dns_openbao_webhook_guard_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_DNS_OPENBAO_WEBHOOK_GUARD') }}"
    platform_dns_cilium_api_bootstrap_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_DNS_CILIUM_API_BOOTSTRAP') }}"
    platform_dns_cilium_api_host_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_DNS_CILIUM_API_HOST') }}"
    platform_dns_cilium_api_port_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_DNS_CILIUM_API_PORT') }}"
    platform_dns_cilium_api_rollout_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_DNS_CILIUM_API_ROLLOUT_TIMEOUT') }}"
    platform_dns_upstreams_raw: "{{ platform_dns_upstreams | default(platform_dns_upstreams_from_env, true) | default('', true) }}"
    platform_dns_check_timeout_effective: "{{ platform_dns_check_timeout | default(platform_dns_check_timeout_from_env, true) | default(120, true) | int }}"
    platform_dns_probe_timeout_effective: "{{ platform_dns_probe_timeout | default(platform_dns_probe_timeout_from_env, true) | default(20, true) | int }}"
    platform_dns_helm_attempts_effective: "{{ platform_dns_helm_attempts | default(platform_dns_helm_attempts_from_env, true) | default(3, true) | int }}"
    platform_dns_helm_timeout_effective: "{{ platform_dns_helm_timeout | default(platform_dns_helm_timeout_from_env, true) | default(90, true) | int }}"
    platform_dns_job_cleanup_timeout_effective: "{{ platform_dns_job_cleanup_timeout | default(platform_dns_job_cleanup_timeout_from_env, true) | default(30, true) | int }}"
    platform_dns_chart_check_timeout_effective: "{{ [platform_dns_check_timeout_effective | int, ((((platform_dns_helm_timeout_effective | int) * 2) + (platform_dns_probe_timeout_effective | int) + 10) * (platform_dns_helm_attempts_effective | int) + ((platform_dns_probe_timeout_effective | int) * 3) + 30)] | max }}"
    platform_dns_check_image_effective: "{{ platform_dns_check_image | default(platform_dns_check_image_from_env, true) | default('rancher/klipper-helm:v0.10.0-build20260513', true) }}"
    platform_dns_check_repo_effective: "{{ platform_dns_check_repo | default(platform_dns_check_repo_from_env, true) | default('https://metallb.github.io/metallb', true) }}"
    platform_dns_ipv4_only_effective: "{{ platform_dns_ipv4_only | default(platform_dns_ipv4_only_from_env, true) | default(true, true) | bool }}"
    platform_dns_service_path_repair_effective: "{{ platform_dns_service_path_repair | default(platform_dns_service_path_repair_from_env, true) | default(true, true) | bool }}"
    platform_dns_force_service_path_repair_effective: "{{ platform_dns_force_service_path_repair | default(platform_dns_force_service_path_repair_from_env, true) | default(false, true) | bool }}"
    platform_dns_service_path_rollout_timeout_effective: "{{ platform_dns_service_path_rollout_timeout | default(platform_dns_service_path_rollout_timeout_from_env, true) | default(120, true) | int }}"
    platform_dns_service_path_poll_interval_effective: "{{ platform_dns_service_path_poll_interval | default(platform_dns_service_path_poll_interval_from_env, true) | default(5, true) | int }}"
    platform_dns_service_path_rollout_retries_effective: "{{ (((platform_dns_service_path_rollout_timeout_effective | int) / (platform_dns_service_path_poll_interval_effective | int)) | round(0, 'ceil') | int) + 1 }}"
    platform_dns_kube_proxy_delete_timeout_effective: "{{ platform_dns_kube_proxy_delete_timeout | default(platform_dns_kube_proxy_delete_timeout_from_env, true) | default(30, true) | int }}"
    platform_dns_pod_cidrs_raw: "{{ platform_dns_pod_cidrs | default(platform_dns_pod_cidrs_from_env, true) | default('', true) }}"
    platform_dns_coredns_replicas_effective: "{{ platform_dns_coredns_replicas | default(platform_dns_coredns_replicas_from_env, true) | default(groups['rke2_servers'] | length, true) | int }}"
    platform_dns_coredns_rollout_timeout_effective: "{{ platform_dns_coredns_rollout_timeout | default(platform_dns_coredns_rollout_timeout_from_env, true) | default(300, true) | int }}"
    platform_dns_coredns_progress_deadline_effective: "{{ [((platform_dns_coredns_rollout_timeout_effective | int) * 2), 600] | max }}"
    platform_dns_openbao_webhook_guard_effective: "{{ platform_dns_openbao_webhook_guard | default(platform_dns_openbao_webhook_guard_from_env, true) | default(true, true) | bool }}"
    platform_dns_cilium_api_bootstrap_effective: "{{ platform_dns_cilium_api_bootstrap | default(platform_dns_cilium_api_bootstrap_from_env, true) | default(true, true) | bool }}"
    platform_dns_cilium_api_host_effective: >-
      {{
        platform_dns_cilium_api_host
        | default(platform_dns_cilium_api_host_from_env, true)
        | default(rke2_api_vip | default('', true), true)
        | default(rke2_api_dns | default('', true), true)
        | default(hostvars[rke2_first_server].ansible_host | default(rke2_first_server), true)
      }}
    platform_dns_cilium_api_port_effective: "{{ platform_dns_cilium_api_port | default(platform_dns_cilium_api_port_from_env, true) | default(6443, true) | int }}"
    platform_dns_cilium_api_rollout_timeout_effective: "{{ platform_dns_cilium_api_rollout_timeout | default(platform_dns_cilium_api_rollout_timeout_from_env, true) | default(300, true) | int }}"
    platform_dns_cilium_api_rollout_retries_effective: "{{ (((platform_dns_cilium_api_rollout_timeout_effective | int) / 5) | round(0, 'ceil') | int) + 1 }}"
    platform_dns_check_job_name: platform-dns-check
    platform_dns_service_path_job_name: platform-dns-service-path-check
    platform_dns_upstream_selection_job_name: platform-dns-upstream-select
    platform_dns_service_path_sysctl_file: /etc/sysctl.d/99-platform-cni-dns-service-path.conf
    platform_dns_service_path_firewalld_ports:
      - 4240/tcp
      - 4244/tcp
      - 8472/udp
      - 8223/udp
      - 6081/udp
      - 10250/tcp
    platform_dns_service_path_firewalld_trusted_interfaces:
      - cilium_host
      - cilium_net
      - cilium_vxlan
      - cilium_geneve
    platform_coredns_configmap: rke2-coredns-rke2-coredns
    platform_coredns_deployment: rke2-coredns-rke2-coredns
  tasks:
    - name: Read node resolver nameservers
      ansible.builtin.shell: |
        {
          for file in /etc/resolv.conf /run/systemd/resolve/resolv.conf /run/NetworkManager/no-stub-resolv.conf; do
            if [ -f "${file}" ]; then
              awk '$1 == "nameserver" { print $2 }' "${file}"
            fi
          done
          if command -v resolvectl >/dev/null 2>&1; then
            resolvectl dns 2>/dev/null | awk '{ for (i = 2; i <= NF; i++) print $i }'
          fi
          if command -v nmcli >/dev/null 2>&1; then
            nmcli -t -f IP4.DNS,IP6.DNS dev show 2>/dev/null | awk -F: '$2 != "" { print $2 }'
          fi
        } |
          awk '
            $0 !~ /^127[.]/ &&
            $0 != "::1" &&
            $0 !~ /^fe80:/ &&
            ($0 ~ /^([0-9]{1,3}[.]){3}[0-9]{1,3}$/ || $0 ~ /^[0-9A-Fa-f:]+$/) {
              print
            }
          ' |
          sort -u |
          xargs
      args:
        executable: /bin/bash
      register: platform_node_nameservers
      changed_when: false

    - name: Detect cluster DNS service IPs
      ansible.builtin.shell: |
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        "$K" --kubeconfig "$C" -n kube-system get svc -l k8s-app=kube-dns \
          -o jsonpath='{range .items[*]}{.spec.clusterIP}{" "}{end}' 2>/dev/null || true
      args:
        executable: /bin/bash
      register: platform_cluster_dns_service_ips
      changed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Build node resolver candidate lists
      ansible.builtin.set_fact:
        platform_cluster_dns_service_ips_list: "{{ (platform_cluster_dns_service_ips.stdout | default('', true)).split() | unique }}"
        platform_node_nameservers_detected_all: >-
          {{
            (groups['rke2_servers']
              | map('extract', hostvars, 'platform_node_nameservers')
              | selectattr('stdout', 'defined')
              | map(attribute='stdout')
              | join(' ')
            ).split()
              | unique
              | join(' ')
          }}
      run_once: true

    - name: Detect CoreDNS upstreams from node resolvers
      ansible.builtin.set_fact:
        platform_node_nameservers_detected: >-
          {{
            (platform_node_nameservers_detected_all.split()
              | difference(platform_cluster_dns_service_ips_list)
              | unique
              | join(' ')
            )
          }}
      run_once: true

    - name: Select CoreDNS upstream candidates
      ansible.builtin.set_fact:
        platform_dns_upstream_candidates_effective: >-
          {{
            ((platform_dns_upstreams_raw | trim | length) > 0)
            | ternary(platform_dns_upstreams_raw | regex_replace(',', ' '), platform_node_nameservers_detected)
            | trim
            | regex_replace('\s+', ' ')
          }}
      run_once: true

    - name: Require DNS upstream candidates for repair fallback
      ansible.builtin.assert:
        that:
          - (platform_dns_check_timeout_effective | int) > 0
          - (platform_dns_probe_timeout_effective | int) > 0
          - (platform_dns_helm_attempts_effective | int) > 0
          - (platform_dns_helm_timeout_effective | int) > 0
          - (platform_dns_job_cleanup_timeout_effective | int) > 0
          - (platform_dns_service_path_rollout_timeout_effective | int) > 0
          - (platform_dns_service_path_poll_interval_effective | int) > 0
          - (platform_dns_kube_proxy_delete_timeout_effective | int) > 0
          - (platform_dns_coredns_replicas_effective | int) > 0
          - (platform_dns_coredns_rollout_timeout_effective | int) > 0
          - (platform_dns_probe_timeout_effective | int) < (platform_dns_check_timeout_effective | int)
          - platform_dns_check_image_effective | length > 0
          - platform_dns_check_repo_effective | length > 0
          - platform_dns_upstream_candidates_effective | length > 0
          - (platform_dns_upstream_candidates_effective.split() | intersect(platform_cluster_dns_service_ips_list) | length) == 0
        fail_msg: >-
          Could not auto-detect valid non-cluster DNS upstreams from node resolver configuration.
          Detected node resolver candidates were: {{ platform_node_nameservers_detected_all | default('') }}.
          Ignored Kubernetes DNS service IPs were: {{ platform_cluster_dns_service_ips_list | default([]) | join(' ') }}.
          Set PLATFORM_DNS_UPSTREAMS, for example:
          PLATFORM_DNS_UPSTREAMS="DNS_SERVER_1 DNS_SERVER_2" make platform-ingress
      run_once: true

    - name: Guard platform workloads from unavailable OpenBao injector admission
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        state_file="$(mktemp)"
        patches_file="$(mktemp)"
        patch_file="$(mktemp)"
        trap 'rm -f "${state_file}" "${patches_file}" "${patch_file}"' EXIT

        "$K" --kubeconfig "$C" get mutatingwebhookconfigurations -o json >"${state_file}"
        python3 - "${state_file}" >"${patches_file}" <<'PY'
        import base64
        import json
        import sys

        label_key = "platform.gitops/openbao-injection"
        label_value = "enabled"
        protected_namespaces = {"kube-system", "kube-public", "kube-node-lease", "openbao"}
        state = json.load(open(sys.argv[1], encoding="utf-8"))

        for item in state.get("items", []):
            changed = False
            webhooks = item.get("webhooks", [])
            for webhook in webhooks:
                service = webhook.get("clientConfig", {}).get("service", {})
                service_name = service.get("name", "")
                if service.get("namespace") != "openbao" and "openbao-agent-injector" not in service_name:
                    continue

                selector = webhook.get("namespaceSelector") or {}
                webhook["namespaceSelector"] = selector
                labels = selector.get("matchLabels") or {}
                selector["matchLabels"] = labels
                if labels.get(label_key) != label_value:
                    labels[label_key] = label_value
                    changed = True

                expressions = selector.get("matchExpressions") or []
                selector["matchExpressions"] = expressions
                exclusion = next(
                    (
                        expression
                        for expression in expressions
                        if expression.get("key") == "kubernetes.io/metadata.name"
                        and expression.get("operator") == "NotIn"
                    ),
                    None,
                )
                if exclusion is None:
                    expressions.append(
                        {
                            "key": "kubernetes.io/metadata.name",
                            "operator": "NotIn",
                            "values": sorted(protected_namespaces),
                        }
                    )
                    changed = True
                else:
                    values = set(exclusion.get("values") or [])
                    if not protected_namespaces.issubset(values):
                        exclusion["values"] = sorted(values | protected_namespaces)
                        changed = True

            if changed:
                payload = json.dumps({"webhooks": webhooks}, separators=(",", ":")).encode()
                encoded = base64.b64encode(payload).decode()
                print(f"{item['metadata']['name']}\t{encoded}")
        PY

        changed=false
        while IFS=$'\t' read -r configuration encoded_patch; do
          [ -n "${configuration}" ] || continue
          printf '%s' "${encoded_patch}" | base64 --decode >"${patch_file}"
          "$K" --kubeconfig "$C" patch "mutatingwebhookconfiguration/${configuration}" \
            --type merge --patch-file "${patch_file}"
          echo "openbao_injector_guard state=patched configuration=${configuration}"
          changed=true
        done <"${patches_file}"
        if [ "${changed}" = "false" ]; then
          echo "openbao_injector_guard state=absent-or-current"
        fi

        "$K" --kubeconfig "$C" --request-timeout={{ platform_dns_probe_timeout_effective }}s \
          -n kube-system run platform-openbao-admission-guard-check \
          --image={{ platform_dns_check_image_effective }} --restart=Never \
          --dry-run=server --command -o name -- /bin/true
        echo "openbao_injector_guard admission_dry_run=ok namespace=kube-system"
        if [ "${changed}" = "true" ] &&
          "$K" --kubeconfig "$C" -n kube-system get \
            deployment/{{ platform_coredns_deployment }} >/dev/null 2>&1; then
          "$K" --kubeconfig "$C" -n kube-system patch \
            deployment/{{ platform_coredns_deployment }} --type merge \
            -p '{"spec":{"progressDeadlineSeconds":{{ platform_dns_coredns_progress_deadline_effective }},"strategy":{"type":"RollingUpdate","rollingUpdate":{"maxUnavailable":1,"maxSurge":0}}}}'
          "$K" --kubeconfig "$C" -n kube-system rollout restart \
            deployment/{{ platform_coredns_deployment }}
          echo "openbao_injector_guard coredns_restart=triggered"
        fi
      args:
        executable: /bin/bash
      register: platform_dns_openbao_webhook_guard
      changed_when: "'state=patched' in platform_dns_openbao_webhook_guard.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      when: platform_dns_openbao_webhook_guard_effective | bool

    - name: Wait for CoreDNS after OpenBao admission guard
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        deployment={{ platform_coredns_deployment }}
        deadline=$((SECONDS + {{ platform_dns_coredns_rollout_timeout_effective }}))
        while [ "${SECONDS}" -lt "${deadline}" ]; do
          desired="$("$K" --kubeconfig "$C" -n kube-system get "deployment/${deployment}" \
            -o jsonpath='{.spec.replicas}')"
          ready="$("$K" --kubeconfig "$C" -n kube-system get "deployment/${deployment}" \
            -o jsonpath='{.status.readyReplicas}')"
          updated="$("$K" --kubeconfig "$C" -n kube-system get "deployment/${deployment}" \
            -o jsonpath='{.status.updatedReplicas}')"
          desired=${desired:-0}
          ready=${ready:-0}
          updated=${updated:-0}
          echo "admission_recovery deployment=${deployment} desired=${desired} updated=${updated} ready=${ready}"
          if [ "${desired}" -gt 0 ] &&
            [ "${updated}" -ge "${desired}" ] &&
            [ "${ready}" -ge "${desired}" ]; then
            echo "openbao_injector_guard coredns_recovery=ready"
            exit 0
          fi
          sleep {{ platform_dns_service_path_poll_interval_effective }}
        done
        echo "CoreDNS did not recover after the OpenBao admission guard was applied." >&2
        "$K" --kubeconfig "$C" -n kube-system get \
          deployment/{{ platform_coredns_deployment }} -o wide >&2 || true
        "$K" --kubeconfig "$C" -n kube-system get pods \
          -l k8s-app=kube-dns -o wide >&2 || true
        "$K" --kubeconfig "$C" -n kube-system get events --sort-by=.lastTimestamp 2>/dev/null |
          grep -E 'coredns|webhook|FailedCreate|NAME' | tail -n 40 >&2 || true
        exit 1
      args:
        executable: /bin/bash
      register: platform_dns_coredns_after_openbao_guard
      changed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      when:
        - platform_dns_openbao_webhook_guard_effective | bool
        - platform_dns_openbao_webhook_guard is changed

    - name: Select reachable DNS upstreams from inside the cluster
      ansible.builtin.shell: |
        set -e -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        JOB={{ platform_dns_upstream_selection_job_name }}
        cleanup_deadline=$((SECONDS + {{ platform_dns_job_cleanup_timeout_effective }}))
        "$K" --kubeconfig "$C" -n kube-system delete job "${JOB}" --ignore-not-found=true --wait=false >/dev/null 2>&1 || true
        while "$K" --kubeconfig "$C" -n kube-system get job "${JOB}" >/dev/null 2>&1; do
          if [ "${SECONDS}" -ge "${cleanup_deadline}" ]; then
            echo "Timed out waiting for stale DNS job ${JOB} to be deleted." >&2
            "$K" --kubeconfig "$C" -n kube-system get job "${JOB}" -o wide >&2 || true
            "$K" --kubeconfig "$C" -n kube-system describe job "${JOB}" >&2 || true
            exit 1
          fi
          sleep 1
        done
        "$K" --kubeconfig "$C" -n kube-system apply -f -
        deadline=$((SECONDS + {{ platform_dns_check_timeout_effective }}))
        while [ "${SECONDS}" -lt "${deadline}" ]; do
          succeeded="$("$K" --kubeconfig "$C" -n kube-system get job "${JOB}" -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"
          failed="$("$K" --kubeconfig "$C" -n kube-system get job "${JOB}" -o jsonpath='{.status.failed}' 2>/dev/null || true)"
          if [ "${succeeded}" = "1" ] || { [ -n "${failed}" ] && [ "${failed}" != "0" ]; }; then
            break
          fi
          sleep 5
        done
        logs="$("$K" --kubeconfig "$C" -n kube-system logs -l job-name="${JOB}" --tail=240 || true)"
        printf '%s\n' "${logs}"
        selected="$(printf '%s\n' "${logs}" | awk -F= '/^PLATFORM_DNS_SELECTED_UPSTREAMS=/{print $2; exit}')"
        if [ -n "${selected}" ]; then
          echo "ANSIBLE_SELECTED_UPSTREAMS=${selected}"
          exit 0
        fi
        echo "No reachable DNS upstream candidates were selected from inside the cluster." >&2
        exit 1
      args:
        executable: /bin/bash
        stdin: |
          ---
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: {{ platform_dns_upstream_selection_job_name }}
            namespace: kube-system
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: {{ platform_dns_check_timeout_effective }}
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                nodeSelector:
                  kubernetes.io/os: linux
                containers:
                  - name: dns-upstream-select
                    image: {{ platform_dns_check_image_effective }}
                    imagePullPolicy: IfNotPresent
                    command:
                      - sh
                      - -c
                    args:
                      - |
                        set -ex
                        REPO_URL='{{ platform_dns_check_repo_effective }}'
                        REPO_HOST="$(printf '%s' "${REPO_URL}" | sed -E 's#^https?://([^/]+).*#\1#')"
                        PROBE_TIMEOUT={{ platform_dns_probe_timeout_effective }}
                        DNS_CANDIDATES='{{ platform_dns_upstream_candidates_effective }}'
                        run_bounded() {
                          seconds="$1"
                          shift
                          if command -v timeout >/dev/null 2>&1; then
                            timeout "${seconds}" "$@"
                          else
                            "$@"
                          fi
                        }
                        echo "===== pod resolver ====="
                        cat /etc/resolv.conf
                        echo "===== DNS upstream candidates ====="
                        printf '%s\n' "${DNS_CANDIDATES}"
                        if ! command -v nslookup >/dev/null 2>&1; then
                          echo "nslookup is missing from the DNS check image." >&2
                          exit 1
                        fi
                        selected=""
                        for dns in ${DNS_CANDIDATES}; do
                          echo "===== checking upstream ${dns} ====="
                          if run_bounded "${PROBE_TIMEOUT}" nslookup "${REPO_HOST}" "${dns}"; then
                            selected="${selected} ${dns}"
                          else
                            echo "upstream ${dns} did not resolve ${REPO_HOST} from a pod"
                          fi
                        done
                        selected="$(printf '%s' "${selected}" | xargs)"
                        echo "PLATFORM_DNS_SELECTED_UPSTREAMS=${selected}"
                        test -n "${selected}"
      register: platform_dns_upstream_selection
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Select CoreDNS upstreams that passed pod reachability checks
      ansible.builtin.set_fact:
        platform_dns_upstreams_selected_from_pods: >-
          {{
            (
              platform_dns_upstream_selection.stdout_lines
              | select('match', '^ANSIBLE_SELECTED_UPSTREAMS=')
              | list
              | first
              | default('')
              | regex_replace('^ANSIBLE_SELECTED_UPSTREAMS=', '')
            )
            | trim
          }}
      run_once: true

    - name: Select CoreDNS upstreams from pod checks or node resolver fallback
      ansible.builtin.set_fact:
        platform_dns_upstreams_effective: >-
          {{
            ((platform_dns_upstreams_selected_from_pods | default('') | trim | length) > 0)
            | ternary(platform_dns_upstreams_selected_from_pods, platform_dns_upstream_candidates_effective)
          }}
      run_once: true

    - name: Continue DNS repair with node resolver fallback when pod upstream checks fail
      ansible.builtin.debug:
        msg: |
          No discovered DNS upstream resolved {{ platform_dns_check_repo_effective }} from inside the cluster before repair.

          Candidate upstreams were:
          {{ platform_dns_upstream_candidates_effective }}

          Upstream selection output was:
          {{ platform_dns_upstream_selection.stdout | default('') }}
          {{ platform_dns_upstream_selection.stderr | default('') }}

          Continuing automatically with the node-discovered upstreams so the CoreDNS, CNI,
          kube-proxy, and firewalld repair path can run. If these upstreams are still
          unreachable after repair, the final DNS verification will stop with diagnostics.
      when: (platform_dns_upstreams_selected_from_pods | default('') | trim | length) == 0
      run_once: true

    - name: Show cluster DNS check settings
      ansible.builtin.debug:
        msg: >-
          Checking pod DNS with {{ platform_dns_check_image_effective }} against
          {{ platform_dns_check_repo_effective }}. CoreDNS repair upstreams are:
          {{ platform_dns_upstreams_effective }}. IPv4-only external DNS mode:
          {{ platform_dns_ipv4_only_effective | bool }}. Per-probe timeout:
          {{ platform_dns_probe_timeout_effective }}s. Ignored Kubernetes DNS
          service IPs: {{ platform_cluster_dns_service_ips_list | join(' ') }}.
          Helm repository timeout:
          {{ platform_dns_helm_timeout_effective }}s per Helm command,
          {{ platform_dns_helm_attempts_effective }} attempts.
          Stale DNS check job cleanup timeout:
          {{ platform_dns_job_cleanup_timeout_effective }}s.
          Chart check timeout:
          {{ platform_dns_chart_check_timeout_effective }}s.
          DNS service path repair:
          {{ 'enabled' if platform_dns_service_path_repair_effective else 'disabled' }}.
          DNS service path rollout timeout:
          {{ platform_dns_service_path_rollout_timeout_effective }}s per component.
          DNS service path poll interval:
          {{ platform_dns_service_path_poll_interval_effective }}s.
          Static kube-proxy delete request timeout:
          {{ platform_dns_kube_proxy_delete_timeout_effective }}s.
          CoreDNS HA local routing target:
          {{ platform_dns_coredns_replicas_effective }} replicas with
          internalTrafficPolicy=Local on the kube-dns service.
          Cilium Kubernetes API bootstrap:
          {{
            (platform_dns_cilium_api_host_effective ~ ':' ~ platform_dns_cilium_api_port_effective)
            if platform_dns_cilium_api_bootstrap_effective
            else 'disabled'
          }}. The built-in Kubernetes Service remains on
          internalTrafficPolicy=Cluster.
      run_once: true

    - name: Restore Kubernetes API service cluster routing before pod service probes
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        current="$(${K} --kubeconfig "${C}" get service/kubernetes -o jsonpath='{.spec.internalTrafficPolicy}')"
        if [ "${current:-Cluster}" = "Cluster" ]; then
          echo "kubernetes_api_service_routing=cluster action=unchanged"
          exit 0
        fi
        ${K} --kubeconfig "${C}" patch service/kubernetes --type=merge \
          -p '{"spec":{"internalTrafficPolicy":"Cluster"}}'
        echo "kubernetes_api_service_routing=cluster action=patch-cluster"
      args:
        executable: /bin/bash
      register: platform_dns_kubernetes_api_cluster_routing
      changed_when: "'action=patch-cluster' in (platform_dns_kubernetes_api_cluster_routing.stdout | default(''))"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      when:
        - platform_dns_service_path_repair_effective | bool
        - platform_dns_cilium_api_bootstrap_effective | bool

    - name: Read existing RKE2 Cilium API bootstrap values
      ansible.builtin.command:
        argv:
          - /var/lib/rancher/rke2/bin/kubectl
          - --kubeconfig
          - /etc/rancher/rke2/rke2.yaml
          - -n
          - kube-system
          - get
          - helmchartconfig.helm.cattle.io/rke2-cilium
          - -o
          - json
      register: platform_dns_cilium_helmchartconfig_before
      changed_when: false
      failed_when:
        - platform_dns_cilium_helmchartconfig_before.rc != 0
        - >-
          '(NotFound)' not in
          (platform_dns_cilium_helmchartconfig_before.stderr | default(''))
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      when:
        - platform_dns_service_path_repair_effective | bool
        - platform_dns_cilium_api_bootstrap_effective | bool

    - name: Decode existing RKE2 Cilium API bootstrap values
      ansible.builtin.set_fact:
        platform_dns_cilium_helmchartconfig_exists: >-
          {{ platform_dns_cilium_helmchartconfig_before.rc == 0 }}
        platform_dns_cilium_helmchartconfig_document: >-
          {{
            (platform_dns_cilium_helmchartconfig_before.stdout | from_json)
            if platform_dns_cilium_helmchartconfig_before.rc == 0
            else {}
          }}
      delegate_to: "{{ rke2_first_server }}"
      delegate_facts: true
      run_once: true
      when:
        - platform_dns_service_path_repair_effective | bool
        - platform_dns_cilium_api_bootstrap_effective | bool

    - name: Validate existing RKE2 Cilium API bootstrap values
      ansible.builtin.assert:
        that:
          - >-
            (
              hostvars[rke2_first_server]
              .platform_dns_cilium_helmchartconfig_document
              .get('spec', {})
              .get('valuesContent', '{}')
              | default('{}', true)
              | from_yaml
              | default({}, true)
            ) is mapping
          - >-
            (
              hostvars[rke2_first_server]
              .platform_dns_cilium_helmchartconfig_document
              .get('spec', {})
              .get('values', {})
              | default({})
            ) is mapping
        fail_msg: >-
          The existing rke2-cilium HelmChartConfig contains non-mapping
          valuesContent or structured values, so the API bootstrap endpoint
          cannot be merged without risking unrelated Cilium settings.
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      when:
        - platform_dns_service_path_repair_effective | bool
        - platform_dns_cilium_api_bootstrap_effective | bool

    - name: Merge RKE2 Cilium API bootstrap endpoint with existing values
      ansible.builtin.set_fact:
        platform_dns_cilium_values_content_current: >-
          {{
            hostvars[rke2_first_server]
            .platform_dns_cilium_helmchartconfig_document
            .get('spec', {})
            .get('valuesContent', '{}')
            | default('{}', true)
            | from_yaml
            | default({}, true)
          }}
        platform_dns_cilium_values_content_merged: >-
          {{
            (
              hostvars[rke2_first_server]
              .platform_dns_cilium_helmchartconfig_document
              .get('spec', {})
              .get('valuesContent', '{}')
              | default('{}', true)
              | from_yaml
              | default({}, true)
            )
            | combine(
                {
                  'k8sServiceHost': platform_dns_cilium_api_host_effective,
                  'k8sServicePort': platform_dns_cilium_api_port_effective | int
                },
                recursive=true
              )
          }}
        platform_dns_cilium_structured_values_current: >-
          {{
            hostvars[rke2_first_server]
            .platform_dns_cilium_helmchartconfig_document
            .get('spec', {})
            .get('values', {})
            | default({})
          }}
        platform_dns_cilium_structured_values_merged: >-
          {{
            (
              hostvars[rke2_first_server]
              .platform_dns_cilium_helmchartconfig_document
              .get('spec', {})
              .get('values', {})
              | default({})
            )
            | combine(
                {
                  'k8sServiceHost': platform_dns_cilium_api_host_effective,
                  'k8sServicePort': platform_dns_cilium_api_port_effective | int
                },
                recursive=true
              )
          }}
      delegate_to: "{{ rke2_first_server }}"
      delegate_facts: true
      run_once: true
      when:
        - platform_dns_service_path_repair_effective | bool
        - platform_dns_cilium_api_bootstrap_effective | bool

    - name: Patch existing RKE2 Cilium API bootstrap values
      ansible.builtin.command:
        argv:
          - /var/lib/rancher/rke2/bin/kubectl
          - --kubeconfig
          - /etc/rancher/rke2/rke2.yaml
          - -n
          - kube-system
          - patch
          - helmchartconfig.helm.cattle.io/rke2-cilium
          - --type=merge
          - >-
            --patch={{
              {
                'spec': {
                  'valuesContent': (
                    hostvars[rke2_first_server]
                    .platform_dns_cilium_values_content_merged
                    | to_nice_yaml(indent=2, sort_keys=false)
                  )
                }
                | combine(
                    {
                      'values': hostvars[rke2_first_server]
                        .platform_dns_cilium_structured_values_merged
                    }
                    if (
                      'values'
                      in hostvars[rke2_first_server]
                        .platform_dns_cilium_helmchartconfig_document
                        .get('spec', {})
                    )
                    else {}
                  )
              }
              | to_json
            }}
      register: platform_dns_cilium_helmchartconfig_patch
      changed_when: true
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      when:
        - platform_dns_service_path_repair_effective | bool
        - platform_dns_cilium_api_bootstrap_effective | bool
        - hostvars[rke2_first_server].platform_dns_cilium_helmchartconfig_exists | bool
        - >-
          hostvars[rke2_first_server].platform_dns_cilium_values_content_current
          != hostvars[rke2_first_server].platform_dns_cilium_values_content_merged
          or (
            'values'
            in hostvars[rke2_first_server]
              .platform_dns_cilium_helmchartconfig_document
              .get('spec', {})
            and hostvars[rke2_first_server].platform_dns_cilium_structured_values_current
              != hostvars[rke2_first_server].platform_dns_cilium_structured_values_merged
          )

    - name: Create RKE2 Cilium API bootstrap values
      ansible.builtin.command:
        argv:
          - /var/lib/rancher/rke2/bin/kubectl
          - --kubeconfig
          - /etc/rancher/rke2/rke2.yaml
          - apply
          - -f
          - "-"
        stdin: >-
          {{
            {
              'apiVersion': 'helm.cattle.io/v1',
              'kind': 'HelmChartConfig',
              'metadata': {
                'name': 'rke2-cilium',
                'namespace': 'kube-system'
              },
              'spec': {
                'valuesContent': (
                  hostvars[rke2_first_server]
                  .platform_dns_cilium_values_content_merged
                  | to_nice_yaml(indent=2, sort_keys=false)
                )
              }
            }
            | to_nice_yaml(indent=2, sort_keys=false)
          }}
      register: platform_dns_cilium_helmchartconfig_create
      changed_when: true
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      when:
        - platform_dns_service_path_repair_effective | bool
        - platform_dns_cilium_api_bootstrap_effective | bool
        - not (hostvars[rke2_first_server].platform_dns_cilium_helmchartconfig_exists | bool)

    - name: Wait for Cilium API bootstrap endpoint rollout
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        host="$(${K} --kubeconfig "${C}" -n kube-system get daemonset/cilium \
          -o jsonpath='{range .spec.template.spec.initContainers[?(@.name=="config")].env[?(@.name=="KUBERNETES_SERVICE_HOST")]}{.value}{end}')"
        port="$(${K} --kubeconfig "${C}" -n kube-system get daemonset/cilium \
          -o jsonpath='{range .spec.template.spec.initContainers[?(@.name=="config")].env[?(@.name=="KUBERNETES_SERVICE_PORT")]}{.value}{end}')"
        desired="$(${K} --kubeconfig "${C}" -n kube-system get daemonset/cilium \
          -o jsonpath='{.status.desiredNumberScheduled}')"
        ready="$(${K} --kubeconfig "${C}" -n kube-system get daemonset/cilium \
          -o jsonpath='{.status.numberReady}')"
        echo "cilium_api_host=${host:-unset} cilium_api_port=${port:-unset} cilium_ready=${ready:-0}/${desired:-0}"
        test "${host}" = "{{ platform_dns_cilium_api_host_effective }}"
        test "${port}" = "{{ platform_dns_cilium_api_port_effective }}"
        test "${desired:-0}" -gt 0
        test "${ready:-0}" = "${desired}"
      args:
        executable: /bin/bash
      register: platform_dns_cilium_api_bootstrap_rollout
      changed_when: false
      retries: "{{ platform_dns_cilium_api_rollout_retries_effective }}"
      delay: 5
      until: platform_dns_cilium_api_bootstrap_rollout.rc == 0
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      when:
        - platform_dns_service_path_repair_effective | bool
        - platform_dns_cilium_api_bootstrap_effective | bool

    - name: Run cluster DNS check before repair
      ansible.builtin.shell: |
        set -e -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        JOB={{ platform_dns_check_job_name }}
        cleanup_deadline=$((SECONDS + {{ platform_dns_job_cleanup_timeout_effective }}))
        "$K" --kubeconfig "$C" -n kube-system delete job "${JOB}" --ignore-not-found=true --wait=false >/dev/null 2>&1 || true
        while "$K" --kubeconfig "$C" -n kube-system get job "${JOB}" >/dev/null 2>&1; do
          if [ "${SECONDS}" -ge "${cleanup_deadline}" ]; then
            echo "Timed out waiting for stale DNS job ${JOB} to be deleted." >&2
            "$K" --kubeconfig "$C" -n kube-system get job "${JOB}" -o wide >&2 || true
            "$K" --kubeconfig "$C" -n kube-system describe job "${JOB}" >&2 || true
            exit 1
          fi
          sleep 1
        done
        "$K" --kubeconfig "$C" -n kube-system apply -f -
        deadline=$((SECONDS + {{ platform_dns_chart_check_timeout_effective }}))
        while [ "${SECONDS}" -lt "${deadline}" ]; do
          succeeded="$("$K" --kubeconfig "$C" -n kube-system get job "${JOB}" -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"
          failed="$("$K" --kubeconfig "$C" -n kube-system get job "${JOB}" -o jsonpath='{.status.failed}' 2>/dev/null || true)"
          if [ "${succeeded}" = "1" ]; then
            "$K" --kubeconfig "$C" -n kube-system logs -l job-name="${JOB}" --tail=120 || true
            exit 0
          fi
          if [ -n "${failed}" ] && [ "${failed}" != "0" ]; then
            "$K" --kubeconfig "$C" -n kube-system logs -l job-name="${JOB}" --tail=120 || true
            exit 1
          fi
          sleep 5
        done
        "$K" --kubeconfig "$C" -n kube-system logs -l job-name="${JOB}" --tail=120 || true
        exit 1
      args:
        executable: /bin/bash
        stdin: |
          ---
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: {{ platform_dns_check_job_name }}
            namespace: kube-system
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: {{ platform_dns_chart_check_timeout_effective }}
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                nodeSelector:
                  kubernetes.io/os: linux
                containers:
                  - name: helm
                    image: {{ platform_dns_check_image_effective }}
                    imagePullPolicy: IfNotPresent
                    command:
                      - sh
                      - -c
                    args:
                      - |
                        set -ex
                        REPO_URL='{{ platform_dns_check_repo_effective }}'
                        REPO_INDEX="${REPO_URL%/}/index.yaml"
                        REPO_HOST="$(printf '%s' "${REPO_URL}" | sed -E 's#^https?://([^/]+).*#\1#')"
                        PROBE_TIMEOUT={{ platform_dns_probe_timeout_effective }}
                        HELM_ATTEMPTS={{ platform_dns_helm_attempts_effective }}
                        HELM_TIMEOUT={{ platform_dns_helm_timeout_effective }}
                        DNS_UPSTREAMS='{{ platform_dns_upstreams_effective }}'
                        export RES_OPTIONS='ndots:1 timeout:2 attempts:2 single-request-reopen'
                        run_bounded() {
                          seconds="$1"
                          shift
                          if command -v timeout >/dev/null 2>&1; then
                            timeout "${seconds}" "$@"
                          else
                            "$@"
                          fi
                        }
                        helm_output_has_failure() {
                          grep -E 'Unable to get an update|Error:|i/o timeout|no such host|bad address|TLS handshake timeout|connection timed out|context deadline exceeded|network is unreachable'
                        }
                        api_output_has_path_failure() {
                          grep -Ei 'TLS handshake timeout|i/o timeout|context deadline exceeded|connection timed out|operation timed out|connection refused|no such host|bad address|temporary failure in name resolution|server misbehaving|network is unreachable|no route to host|Client\.Timeout exceeded|connection reset by peer|x509:|remote error: tls'
                        }
                        run_kubernetes_api_service_check() {
                          echo "===== Kubernetes API ClusterIP TLS service-path probe ====="
                          nslookup kubernetes.default.svc || true
                          helm repo remove platform-kubernetes-api-check >/dev/null 2>&1 || true

                          set +e
                          api_output="$(run_bounded "${HELM_TIMEOUT}" helm repo add platform-kubernetes-api-check \
                            https://kubernetes.default.svc \
                            --ca-file /var/run/secrets/kubernetes.io/serviceaccount/ca.crt 2>&1)"
                          api_rc="$?"
                          set -e
                          printf '%s\n' "${api_output}"

                          case "${api_rc}" in
                            124|137|143)
                              echo "Kubernetes API ClusterIP probe timed out with rc=${api_rc}." >&2
                              return 1
                              ;;
                          esac
                          if printf '%s\n' "${api_output}" | api_output_has_path_failure >/dev/null 2>&1; then
                            echo "Kubernetes API ClusterIP probe reported a service-path or TLS failure." >&2
                            return 1
                          fi
                          if [ "${api_rc}" -ne 0 ] && ! printf '%s\n' "${api_output}" |
                            grep -Eq '401 Unauthorized|403 Forbidden|404 Not Found|status code:?[[:space:]]*[0-9]{3}'; then
                            echo "Kubernetes API ClusterIP probe failed without a conclusive HTTP response (rc=${api_rc})." >&2
                            return 1
                          fi

                          echo "Kubernetes API ClusterIP returned a bounded TLS/HTTP response (helm_rc=${api_rc})."
                          return 0
                        }
                        run_helm_repo_check() {
                          attempt=1
                          while [ "${attempt}" -le "${HELM_ATTEMPTS}" ]; do
                            echo "===== helm repository attempt ${attempt}/${HELM_ATTEMPTS} ====="
                            nslookup "${REPO_HOST}" || true
                            helm repo remove platform-dns-check >/dev/null 2>&1 || true

                            set +e
                            add_output="$(run_bounded "${HELM_TIMEOUT}" helm repo add platform-dns-check "${REPO_URL}" 2>&1)"
                            add_rc="$?"
                            printf '%s\n' "${add_output}"
                            update_rc="not-run"
                            update_unhealthy=false
                            if [ "${add_rc}" -eq 0 ]; then
                              update_output="$(run_bounded "${HELM_TIMEOUT}" helm repo update platform-dns-check 2>&1)"
                              update_rc="$?"
                              printf '%s\n' "${update_output}"
                              if printf '%s\n' "${update_output}" | helm_output_has_failure >/dev/null 2>&1; then
                                update_unhealthy=true
                                update_rc=1
                                echo "helm repo update returned an unhealthy repository access result." >&2
                              fi
                            fi
                            set -e

                            if [ "${add_rc}" -eq 0 ] && [ "${update_rc}" = "0" ] && [ "${update_unhealthy}" = "false" ]; then
                              echo "Helm repository check succeeded on attempt ${attempt}."
                              return 0
                            fi

                            echo "Helm repository check attempt ${attempt}/${HELM_ATTEMPTS} failed: repo_add_rc=${add_rc} repo_update_rc=${update_rc} repo_update_unhealthy=${update_unhealthy}" >&2
                            if [ "${attempt}" -lt "${HELM_ATTEMPTS}" ]; then
                              sleep 5
                            fi
                            attempt=$((attempt + 1))
                          done
                          return 1
                        }
                        echo "===== pod resolver ====="
                        cat /etc/resolv.conf
                        echo "===== repository host ====="
                        printf '%s\n' "${REPO_HOST}"
                        echo "===== configured CoreDNS upstreams ====="
                        printf '%s\n' "${DNS_UPSTREAMS}"
                        echo "===== IPv4 resolution ====="
                        (getent ahostsv4 "${REPO_HOST}" || nslookup "${REPO_HOST}" || true)
                        echo "===== IPv6 resolution ====="
                        (getent ahostsv6 "${REPO_HOST}" || true)
                        echo "===== direct upstream DNS checks ====="
                        for dns in ${DNS_UPSTREAMS}; do
                          echo "--- ${dns} ---"
                          run_bounded "${PROBE_TIMEOUT}" nslookup "${REPO_HOST}" "${dns}" || true
                        done
                        echo "===== repository HTTPS index probe ====="
                        if command -v curl >/dev/null 2>&1; then
                          run_bounded "${PROBE_TIMEOUT}" curl --fail --silent --show-error --location \
                            --connect-timeout "${PROBE_TIMEOUT}" --max-time "${PROBE_TIMEOUT}" \
                            --output /dev/null "${REPO_INDEX}" || {
                              rc="$?"
                              echo "Repository HTTPS index probe failed or timed out after ${PROBE_TIMEOUT}s with rc=${rc}; continuing to Helm repo check." >&2
                            }
                        elif command -v wget >/dev/null 2>&1; then
                          run_bounded "${PROBE_TIMEOUT}" wget -S -T "${PROBE_TIMEOUT}" \
                            -O /dev/null "${REPO_INDEX}" || {
                              rc="$?"
                              echo "Repository HTTPS index probe failed or timed out after ${PROBE_TIMEOUT}s with rc=${rc}; continuing to Helm repo check." >&2
                            }
                        else
                          echo "No curl or wget found in check image; skipping direct HTTPS index probe."
                        fi
                        api_service_rc=0
                        run_kubernetes_api_service_check || api_service_rc="$?"
                        if [ "${api_service_rc}" -eq 0 ]; then
                          echo "PLATFORM_KUBERNETES_API_SERVICE_PATH=true"
                        else
                          echo "PLATFORM_KUBERNETES_API_SERVICE_PATH=false"
                        fi
                        repo_rc=0
                        run_helm_repo_check || repo_rc="$?"
                        if [ "${api_service_rc}" -ne 0 ] || [ "${repo_rc}" -ne 0 ]; then
                          exit 1
                        fi
      register: platform_dns_check_before
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Show healthy cluster DNS
      ansible.builtin.debug:
        msg: "Cluster DNS resolves external chart repositories and the Kubernetes API ClusterIP TLS path responds from pods."
      when:
        - platform_dns_check_before.rc == 0
        - not (platform_dns_force_service_path_repair_effective | bool)
      run_once: true

    - name: Repair CoreDNS upstreams when pod DNS check fails
      when: >-
        (platform_dns_force_service_path_repair_effective | bool) or
        platform_dns_check_before.rc != 0
      block:
        - name: Collect cluster DNS diagnostics before repair
          ansible.builtin.shell: |
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            echo "===== DNS check job logs ====="
            "$K" --kubeconfig "$C" -n kube-system logs -l job-name={{ platform_dns_check_job_name }} --tail=160 || true
            echo "===== CoreDNS service/endpoints ====="
            "$K" --kubeconfig "$C" -n kube-system get svc,endpoints,endpointslice -l k8s-app=kube-dns -o wide || true
            "$K" --kubeconfig "$C" -n kube-system get svc,endpoints,endpointslice | grep -E 'coredns|kube-dns|NAME' || true
            echo "===== CoreDNS pods ====="
            "$K" --kubeconfig "$C" -n kube-system get pods -l k8s-app=kube-dns -o wide || true
            echo "===== CoreDNS logs ====="
            "$K" --kubeconfig "$C" -n kube-system logs -l k8s-app=kube-dns --tail=160 || true
            echo "===== CoreDNS Corefile ====="
            "$K" --kubeconfig "$C" -n kube-system get configmap {{ platform_coredns_configmap }} -o jsonpath='{.data.Corefile}' || true
            echo
          args:
            executable: /bin/bash
          register: platform_dns_diagnostics_before_repair
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Print cluster DNS diagnostics before repair
          ansible.builtin.debug:
            var: platform_dns_diagnostics_before_repair.stdout_lines
          run_once: true

        - name: Apply CoreDNS repair with rollback guard
          block:
            - name: Back up current CoreDNS ConfigMap
              ansible.builtin.shell: |
                set -e -o pipefail
                K=/var/lib/rancher/rke2/bin/kubectl
                C=/etc/rancher/rke2/rke2.yaml
                "$K" --kubeconfig "$C" -n kube-system get configmap {{ platform_coredns_configmap }} \
                  -o yaml >/tmp/platform-coredns-before-repair.yaml
              args:
                executable: /bin/bash
              changed_when: false
              delegate_to: "{{ rke2_first_server }}"
              run_once: true

            - name: Patch CoreDNS forward upstreams
              ansible.builtin.shell: |
                set -e -o pipefail
                K=/var/lib/rancher/rke2/bin/kubectl
                C=/etc/rancher/rke2/rke2.yaml
                UPSTREAMS="{{ platform_dns_upstreams_effective }}"
                cat >/tmp/platform-coredns-patch.yaml <<EOF
                data:
                  Corefile: |
                    .:53 {
                        errors
                        health
                        ready
                        kubernetes cluster.local cluster.local in-addr.arpa ip6.arpa {
                          pods insecure
                          fallthrough in-addr.arpa ip6.arpa
                        }
                        hosts /etc/coredns/NodeHosts {
                          ttl 60
                          reload 15s
                          fallthrough
                        }
                        prometheus :9153
                {% if platform_dns_ipv4_only_effective | bool %}
                        template IN AAAA . {
                          rcode NOERROR
                        }
                {% endif %}
                        forward . ${UPSTREAMS} {
                          max_concurrent 1000
                        }
                        cache 30
                        loop
                        reload
                        loadbalance
                        import /etc/coredns/custom/*.override
                    }
                    import /etc/coredns/custom/*.server
                EOF
                "$K" --kubeconfig "$C" -n kube-system patch configmap {{ platform_coredns_configmap }} \
                  --type merge --patch-file /tmp/platform-coredns-patch.yaml
              args:
                executable: /bin/bash
              register: platform_coredns_patch
              changed_when: "'patched' in platform_coredns_patch.stdout"
              delegate_to: "{{ rke2_first_server }}"
              run_once: true

            - name: Configure CoreDNS rollout strategy for strict node spreading
              ansible.builtin.shell: |
                set -euo pipefail
                K=/var/lib/rancher/rke2/bin/kubectl
                C=/etc/rancher/rke2/rke2.yaml
                deployment={{ platform_coredns_deployment }}
                cat >/tmp/platform-coredns-rollout-strategy-patch.json <<EOF
                {
                  "spec": {
                    "progressDeadlineSeconds": {{ platform_dns_coredns_progress_deadline_effective }},
                    "strategy": {
                      "type": "RollingUpdate",
                      "rollingUpdate": {
                        "maxUnavailable": 1,
                        "maxSurge": 0
                      }
                    }
                  }
                }
                EOF
                "$K" --kubeconfig "$C" -n kube-system patch "deployment/${deployment}" \
                  --type merge --patch-file /tmp/platform-coredns-rollout-strategy-patch.json
                replicas="$("$K" --kubeconfig "$C" -n kube-system get "deployment/${deployment}" \
                  -o jsonpath='{.spec.replicas}')"
                echo "deployment=${deployment} replicas=${replicas:-0} maxUnavailable=1 maxSurge=0"
              args:
                executable: /bin/bash
              register: platform_coredns_rollout_strategy
              changed_when: >-
                'patched' in platform_coredns_rollout_strategy.stdout
                and 'patched (no change)' not in platform_coredns_rollout_strategy.stdout
              delegate_to: "{{ rke2_first_server }}"
              run_once: true

            - name: Restart CoreDNS
              ansible.builtin.command: >-
                /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
                -n kube-system rollout restart deployment/{{ platform_coredns_deployment }}
              register: platform_coredns_restart
              changed_when: "'restarted' in platform_coredns_restart.stdout"
              delegate_to: "{{ rke2_first_server }}"
              run_once: true

            - name: Wait for CoreDNS rollout with one stuck rollout recovery
              ansible.builtin.shell: |
                set -euo pipefail
                K=/var/lib/rancher/rke2/bin/kubectl
                C=/etc/rancher/rke2/rke2.yaml
                deployment={{ platform_coredns_deployment }}
                deadline=$((SECONDS + {{ platform_dns_coredns_rollout_timeout_effective }}))
                recovery_attempted=false

                while [ "${SECONDS}" -lt "${deadline}" ]; do
                  generation="$("$K" --kubeconfig "$C" -n kube-system get "deployment/${deployment}" \
                    -o jsonpath='{.metadata.generation}')"
                  observed="$("$K" --kubeconfig "$C" -n kube-system get "deployment/${deployment}" \
                    -o jsonpath='{.status.observedGeneration}')"
                  desired="$("$K" --kubeconfig "$C" -n kube-system get "deployment/${deployment}" \
                    -o jsonpath='{.spec.replicas}')"
                  updated="$("$K" --kubeconfig "$C" -n kube-system get "deployment/${deployment}" \
                    -o jsonpath='{.status.updatedReplicas}')"
                  ready="$("$K" --kubeconfig "$C" -n kube-system get "deployment/${deployment}" \
                    -o jsonpath='{.status.readyReplicas}')"
                  available="$("$K" --kubeconfig "$C" -n kube-system get "deployment/${deployment}" \
                    -o jsonpath='{.status.availableReplicas}')"
                  progressing_reason="$("$K" --kubeconfig "$C" -n kube-system get "deployment/${deployment}" \
                    -o jsonpath='{range .status.conditions[?(@.type=="Progressing")]}{.reason}{end}')"
                  observed=${observed:-0}
                  desired=${desired:-0}
                  updated=${updated:-0}
                  ready=${ready:-0}
                  available=${available:-0}
                  echo "deployment=${deployment} generation=${generation} observed=${observed} desired=${desired} updated=${updated} ready=${ready} available=${available} progressing=${progressing_reason:-none}"

                  if [ "${desired}" -gt 0 ] &&
                    [ "${observed}" -ge "${generation}" ] &&
                    [ "${updated}" -ge "${desired}" ] &&
                    [ "${ready}" -ge "${desired}" ] &&
                    [ "${available}" -ge "${desired}" ]; then
                    echo "result=ready recovery_attempted=${recovery_attempted}"
                    exit 0
                  fi

                  if [ "${observed}" -ge "${generation}" ] &&
                    [ "${progressing_reason}" = "ProgressDeadlineExceeded" ] &&
                    [ "${recovery_attempted}" = "false" ]; then
                    recovery_at="$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)"
                    "$K" --kubeconfig "$C" -n kube-system patch "deployment/${deployment}" --type merge \
                      -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"platform.gitops/coredns-recovery-at\":\"${recovery_at}\"}}}}}"
                    recovery_attempted=true
                    echo "result=recovered reason=ProgressDeadlineExceeded recovery_at=${recovery_at}"
                  fi
                  sleep {{ platform_dns_service_path_poll_interval_effective }}
                done

                echo "CoreDNS rollout did not converge within {{ platform_dns_coredns_rollout_timeout_effective }}s." >&2
                echo "===== CoreDNS deployment =====" >&2
                "$K" --kubeconfig "$C" -n kube-system get "deployment/${deployment}" -o wide >&2 || true
                "$K" --kubeconfig "$C" -n kube-system describe "deployment/${deployment}" >&2 || true
                echo "===== CoreDNS replica sets and pods =====" >&2
                "$K" --kubeconfig "$C" -n kube-system get replicasets,pods -l k8s-app=kube-dns -o wide >&2 || true
                echo "===== CoreDNS events =====" >&2
                "$K" --kubeconfig "$C" -n kube-system get events --sort-by=.lastTimestamp 2>/dev/null | tail -n 50 >&2 || true
                echo "===== CoreDNS logs =====" >&2
                "$K" --kubeconfig "$C" -n kube-system logs -l k8s-app=kube-dns \
                  --all-containers=true --prefix --tail=30 >&2 || true
                exit 1
              args:
                executable: /bin/bash
              register: platform_coredns_rollout
              changed_when: "'result=recovered' in platform_coredns_rollout.stdout"
              delegate_to: "{{ rke2_first_server }}"
              run_once: true
          rescue:
            - name: Roll back CoreDNS ConfigMap after failed repair rollout
              ansible.builtin.shell: |
                set -uo pipefail
                K=/var/lib/rancher/rke2/bin/kubectl
                C=/etc/rancher/rke2/rke2.yaml
                apply_rc=1
                restart_rc=1
                rollback_rc=1
                if [ -f /tmp/platform-coredns-before-repair.yaml ]; then
                  if "$K" --kubeconfig "$C" apply -f /tmp/platform-coredns-before-repair.yaml; then
                    apply_rc=0
                  fi
                  if [ "${apply_rc}" -eq 0 ] &&
                    "$K" --kubeconfig "$C" -n kube-system rollout restart \
                      deployment/{{ platform_coredns_deployment }}; then
                    restart_rc=0
                  fi
                  deadline=$((SECONDS + {{ platform_dns_coredns_rollout_timeout_effective }}))
                  while [ "${restart_rc}" -eq 0 ] && [ "${SECONDS}" -lt "${deadline}" ]; do
                    state="$("$K" --kubeconfig "$C" -n kube-system get \
                      deployment/{{ platform_coredns_deployment }} \
                      -o jsonpath='{.metadata.generation}{"|"}{.status.observedGeneration}{"|"}{.spec.replicas}{"|"}{.status.updatedReplicas}{"|"}{.status.readyReplicas}{"|"}{.status.availableReplicas}')"
                    IFS='|' read -r generation observed desired updated ready available <<<"${state}"
                    observed=${observed:-0}
                    desired=${desired:-0}
                    updated=${updated:-0}
                    ready=${ready:-0}
                    available=${available:-0}
                    echo "rollback generation=${generation} observed=${observed} desired=${desired} updated=${updated} ready=${ready} available=${available}"
                    if [ "${desired}" -gt 0 ] &&
                      [ "${observed}" -ge "${generation}" ] &&
                      [ "${updated}" -ge "${desired}" ] &&
                      [ "${ready}" -ge "${desired}" ] &&
                      [ "${available}" -ge "${desired}" ]; then
                      rollback_rc=0
                      break
                    fi
                    sleep {{ platform_dns_service_path_poll_interval_effective }}
                  done
                  if [ "${rollback_rc}" -ne 0 ]; then
                    "$K" --kubeconfig "$C" -n kube-system get \
                      deployment/{{ platform_coredns_deployment }} -o wide >&2 || true
                    "$K" --kubeconfig "$C" -n kube-system get pods \
                      -l k8s-app=kube-dns -o wide >&2 || true
                  fi
                fi
                echo "coredns_configmap_apply_rc=${apply_rc} restart_rc=${restart_rc} rollback_rc=${rollback_rc}"
                exit "${rollback_rc}"
              args:
                executable: /bin/bash
              register: platform_coredns_rollback
              changed_when: platform_coredns_rollback.rc == 0
              failed_when: false
              delegate_to: "{{ rke2_first_server }}"
              run_once: true

            - name: Stop after failed CoreDNS repair rollout
              ansible.builtin.fail:
                msg: |
                  CoreDNS repair did not roll out cleanly. The previous CoreDNS
                  ConfigMap restoration was attempted automatically.

                  Repair rollout state tail:
                  {{ (platform_coredns_rollout.stdout_lines | default(['not run'], true))[-12:] | join('\n') }}

                  OpenBao injector admission blocker detected:
                  {{ 'yes' if 'failed calling webhook "vault.hashicorp.com"' in (platform_coredns_rollout.stderr | default('', true)) else 'no' }}

                  ConfigMap rollback state tail:
                  {{ (platform_coredns_rollback.stdout_lines | default(['not run'], true))[-12:] | join('\n') }}

                  The failed rollout task above contains the bounded deployment,
                  ReplicaSet, event, and CoreDNS log diagnostics.
              run_once: true
          when: not (platform_dns_force_service_path_repair_effective | bool)

        - name: Ensure CoreDNS HA local service routing after CoreDNS repair
          ansible.builtin.shell: |
            set -euo pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            replicas={{ platform_dns_coredns_replicas_effective | int }}
            expected_nodes={{ [platform_dns_coredns_replicas_effective | int, groups['rke2_servers'] | length] | min }}
            deployment="$("$K" --kubeconfig "$C" -n kube-system get deployment -l k8s-app=kube-dns -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
            if [ -z "${deployment}" ] && "$K" --kubeconfig "$C" -n kube-system get deployment/{{ platform_coredns_deployment }} >/dev/null 2>&1; then
              deployment={{ platform_coredns_deployment }}
            fi
            if [ -z "${deployment}" ]; then
              echo "No CoreDNS deployment with label k8s-app=kube-dns was found." >&2
              "$K" --kubeconfig "$C" -n kube-system get deployment,pods -o wide | grep -E 'NAME|coredns|kube-dns' || true
              exit 1
            fi

            autoscaler="$("$K" --kubeconfig "$C" -n kube-system get deployment -o name 2>/dev/null |
              grep -E '/.*coredns.*autoscaler' |
              head -n 1 || true)"
            if [ -n "${autoscaler}" ]; then
              "$K" --kubeconfig "$C" -n kube-system scale "${autoscaler}" --replicas=0
              echo "Scaled ${autoscaler} to 0 so fixed HA CoreDNS placement is not reconciled back to fewer replicas."
            else
              echo "No CoreDNS autoscaler deployment found."
            fi

            cat >/tmp/platform-coredns-ha-local-routing-patch.json <<EOF
            {
              "spec": {
                "replicas": ${replicas},
                "progressDeadlineSeconds": {{ platform_dns_coredns_progress_deadline_effective }},
                "strategy": {
                  "type": "RollingUpdate",
                  "rollingUpdate": {
                    "maxUnavailable": 1,
                    "maxSurge": 0
                  }
                },
                "template": {
                  "spec": {
                    "topologySpreadConstraints": [
                      {
                        "maxSkew": 1,
                        "topologyKey": "kubernetes.io/hostname",
                        "whenUnsatisfiable": "DoNotSchedule",
                        "labelSelector": {
                          "matchLabels": {
                            "k8s-app": "kube-dns"
                          }
                        }
                      }
                    ],
                    "affinity": {
                      "podAntiAffinity": {
                        "requiredDuringSchedulingIgnoredDuringExecution": [
                          {
                            "labelSelector": {
                              "matchLabels": {
                                "k8s-app": "kube-dns"
                              }
                            },
                            "topologyKey": "kubernetes.io/hostname"
                          }
                        ],
                        "preferredDuringSchedulingIgnoredDuringExecution": []
                      }
                    }
                  }
                }
              }
            }
            EOF
            "$K" --kubeconfig "$C" -n kube-system patch "deployment/${deployment}" \
              --type merge --patch-file /tmp/platform-coredns-ha-local-routing-patch.json
            "$K" --kubeconfig "$C" -n kube-system scale "deployment/${deployment}" --replicas="${replicas}"

            service_names="$("$K" --kubeconfig "$C" -n kube-system get svc -l k8s-app=kube-dns -o name 2>/dev/null || true)"
            if [ -z "${service_names}" ]; then
              echo "No CoreDNS service with label k8s-app=kube-dns was found." >&2
              "$K" --kubeconfig "$C" -n kube-system get svc,endpoints,endpointslice -o wide |
                grep -E 'NAME|coredns|kube-dns' || true
              exit 1
            fi
            for service in ${service_names}; do
              "$K" --kubeconfig "$C" -n kube-system patch "${service}" --type merge \
                -p '{"spec":{"internalTrafficPolicy":"Local"}}'
              echo "patched ${service} with internalTrafficPolicy=Local."
            done

            "$K" --kubeconfig "$C" -n kube-system rollout status "deployment/${deployment}" \
              --timeout={{ platform_dns_coredns_rollout_timeout_effective }}s
            echo "===== CoreDNS deployment ====="
            "$K" --kubeconfig "$C" -n kube-system get "deployment/${deployment}" -o wide
            echo "===== CoreDNS autoscaler ====="
            if [ -n "${autoscaler}" ]; then
              "$K" --kubeconfig "$C" -n kube-system get "${autoscaler}" -o wide || true
            else
              echo "not found"
            fi
            echo "===== CoreDNS service local routing ====="
            "$K" --kubeconfig "$C" -n kube-system get svc -l k8s-app=kube-dns \
              -o jsonpath='{range .items[*]}{.metadata.name}{" internalTrafficPolicy="}{.spec.internalTrafficPolicy}{" clusterIP="}{.spec.clusterIP}{"\n"}{end}'
            echo "===== CoreDNS pods ====="
            "$K" --kubeconfig "$C" -n kube-system get pods -l k8s-app=kube-dns -o wide
            endpoint_count="$("$K" --kubeconfig "$C" -n kube-system get endpoints -l k8s-app=kube-dns \
              -o jsonpath='{range .items[*].subsets[*].addresses[*]}{.ip}{" "}{end}' 2>/dev/null |
              wc -w | xargs)"
            endpoint_nodes="$("$K" --kubeconfig "$C" -n kube-system get pods -l k8s-app=kube-dns \
              -o jsonpath='{range .items[?(@.status.phase=="Running")]}{.spec.nodeName}{" "}{end}' 2>/dev/null |
              xargs -n1 2>/dev/null |
              sort -u |
              xargs || true)"
            endpoint_node_count="$(printf '%s\n' ${endpoint_nodes:-} 2>/dev/null | awk 'NF { count++ } END { print count + 0 }')"
            echo "CoreDNS endpoint count=${endpoint_count}; expected replicas=${replicas}"
            echo "CoreDNS endpoint nodes=${endpoint_nodes:-none}; expected node coverage=${expected_nodes}"
            test "${endpoint_count}" -ge "${replicas}"
            test "${endpoint_node_count}" -ge "${expected_nodes}"
          args:
            executable: /bin/bash
          register: platform_dns_coredns_ha_local_routing
          changed_when: >-
            'patched' in (platform_dns_coredns_ha_local_routing.stdout | lower)
            or 'scaled' in (platform_dns_coredns_ha_local_routing.stdout | lower)
          failed_when: platform_dns_coredns_ha_local_routing.rc != 0
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when: not (platform_dns_force_service_path_repair_effective | bool)

        - name: Detect CoreDNS endpoint IPs after CoreDNS repair
          ansible.builtin.shell: |
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            "$K" --kubeconfig "$C" -n kube-system get endpoints -l k8s-app=kube-dns \
              -o jsonpath='{range .items[*].subsets[*].addresses[*]}{.ip}{" "}{end}' 2>/dev/null || true
          args:
            executable: /bin/bash
          register: platform_coredns_endpoint_ips
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Select CoreDNS endpoint IPs for DNS service path check
          ansible.builtin.set_fact:
            platform_coredns_endpoint_ips_effective: "{{ platform_coredns_endpoint_ips.stdout | default('', true) | trim }}"
          run_once: true

        - name: Check Kubernetes DNS service path after CoreDNS repair
          ansible.builtin.shell: |
            set -e -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            JOB={{ platform_dns_service_path_job_name }}
            cleanup_deadline=$((SECONDS + {{ platform_dns_job_cleanup_timeout_effective }}))
            "$K" --kubeconfig "$C" -n kube-system delete job "${JOB}" --ignore-not-found=true --wait=false >/dev/null 2>&1 || true
            while "$K" --kubeconfig "$C" -n kube-system get job "${JOB}" >/dev/null 2>&1; do
              if [ "${SECONDS}" -ge "${cleanup_deadline}" ]; then
                echo "Timed out waiting for stale DNS job ${JOB} to be deleted." >&2
                "$K" --kubeconfig "$C" -n kube-system get job "${JOB}" -o wide >&2 || true
                "$K" --kubeconfig "$C" -n kube-system describe job "${JOB}" >&2 || true
                exit 1
              fi
              sleep 1
            done
            "$K" --kubeconfig "$C" -n kube-system apply -f -
            deadline=$((SECONDS + {{ platform_dns_check_timeout_effective }}))
            while [ "${SECONDS}" -lt "${deadline}" ]; do
              succeeded="$("$K" --kubeconfig "$C" -n kube-system get job "${JOB}" -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"
              failed="$("$K" --kubeconfig "$C" -n kube-system get job "${JOB}" -o jsonpath='{.status.failed}' 2>/dev/null || true)"
              if [ "${succeeded}" = "1" ] || { [ -n "${failed}" ] && [ "${failed}" != "0" ]; }; then
                break
              fi
              sleep 5
            done
            "$K" --kubeconfig "$C" -n kube-system logs -l job-name="${JOB}" --tail=240 || true
          args:
            executable: /bin/bash
            stdin: |
              ---
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: {{ platform_dns_service_path_job_name }}
                namespace: kube-system
              spec:
                backoffLimit: 0
                activeDeadlineSeconds: {{ platform_dns_check_timeout_effective }}
                ttlSecondsAfterFinished: 300
                template:
                  spec:
                    restartPolicy: Never
                    nodeSelector:
                      kubernetes.io/os: linux
                    containers:
                      - name: dns-service-path-check
                        image: {{ platform_dns_check_image_effective }}
                        imagePullPolicy: IfNotPresent
                        command:
                          - sh
                          - -c
                        args:
                          - |
                            set -ex
                            REPO_URL='{{ platform_dns_check_repo_effective }}'
                            REPO_HOST="$(printf '%s' "${REPO_URL}" | sed -E 's#^https?://([^/]+).*#\1#')"
                            PROBE_TIMEOUT={{ platform_dns_probe_timeout_effective }}
                            DNS_UPSTREAMS='{{ platform_dns_upstreams_effective }}'
                            KUBE_DNS_SERVICE_IPS='{{ platform_cluster_dns_service_ips_list | join(' ') }}'
                            COREDNS_ENDPOINT_IPS='{{ platform_coredns_endpoint_ips_effective }}'
                            run_bounded() {
                              seconds="$1"
                              shift
                              if command -v timeout >/dev/null 2>&1; then
                                timeout "${seconds}" "$@"
                              else
                                "$@"
                              fi
                            }
                            echo "===== pod resolver ====="
                            cat /etc/resolv.conf
                            echo "===== default Kubernetes DNS service check ====="
                            if run_bounded "${PROBE_TIMEOUT}" nslookup "${REPO_HOST}"; then
                              default_ok=true
                            else
                              default_ok=false
                            fi
                            echo "===== explicit Kubernetes DNS service IP checks ====="
                            service_ip_ok=false
                            for dns in ${KUBE_DNS_SERVICE_IPS}; do
                              echo "--- ${dns} ---"
                              if run_bounded "${PROBE_TIMEOUT}" nslookup "${REPO_HOST}" "${dns}"; then
                                service_ip_ok=true
                              fi
                            done
                            echo "===== direct CoreDNS endpoint IP checks ====="
                            endpoint_ok=true
                            endpoint_count=0
                            for dns in ${COREDNS_ENDPOINT_IPS}; do
                              endpoint_count=$((endpoint_count + 1))
                              echo "--- ${dns} ---"
                              if ! run_bounded "${PROBE_TIMEOUT}" nslookup "${REPO_HOST}" "${dns}"; then
                                endpoint_ok=false
                              fi
                            done
                            if [ "${endpoint_count}" -eq 0 ]; then
                              endpoint_ok=false
                            fi
                            echo "===== direct upstream DNS checks ====="
                            direct_ok=false
                            for dns in ${DNS_UPSTREAMS}; do
                              echo "--- ${dns} ---"
                              if run_bounded "${PROBE_TIMEOUT}" nslookup "${REPO_HOST}" "${dns}"; then
                                direct_ok=true
                              fi
                            done
                            echo "PLATFORM_DNS_DEFAULT_RESOLUTION=${default_ok}"
                            echo "PLATFORM_DNS_SERVICE_IP_RESOLUTION=${service_ip_ok}"
                            echo "PLATFORM_DNS_COREDNS_ENDPOINT_RESOLUTION=${endpoint_ok}"
                            echo "PLATFORM_DNS_DIRECT_UPSTREAM_RESOLUTION=${direct_ok}"
          register: platform_dns_service_path_check
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Detect Kubernetes DNS service path state
          ansible.builtin.set_fact:
            platform_dns_default_resolution_ok: "{{ (platform_dns_service_path_check.stdout | default('')) is search('PLATFORM_DNS_DEFAULT_RESOLUTION=true') }}"
            platform_dns_service_ip_resolution_ok: "{{ (platform_dns_service_path_check.stdout | default('')) is search('PLATFORM_DNS_SERVICE_IP_RESOLUTION=true') }}"
            platform_dns_coredns_endpoint_resolution_ok: "{{ (platform_dns_service_path_check.stdout | default('')) is search('PLATFORM_DNS_COREDNS_ENDPOINT_RESOLUTION=true') }}"
            platform_dns_direct_upstream_resolution_ok: "{{ (platform_dns_service_path_check.stdout | default('')) is search('PLATFORM_DNS_DIRECT_UPSTREAM_RESOLUTION=true') }}"
            platform_dns_kubernetes_api_service_path_ok: "{{ (platform_dns_check_before.stdout | default('')) is search('PLATFORM_KUBERNETES_API_SERVICE_PATH=true') }}"
          run_once: true

        - name: Determine whether CNI service-path repair is required
          ansible.builtin.set_fact:
            platform_dns_service_path_repair_required: >-
              {{
                (platform_dns_force_service_path_repair_effective | bool) or
                not (platform_dns_default_resolution_ok | bool) or
                not (platform_dns_kubernetes_api_service_path_ok | bool)
              }}
          run_once: true

        - name: Detect Kubernetes pod CIDRs for DNS service path repair
          ansible.builtin.shell: |
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            "$K" --kubeconfig "$C" get nodes \
              -o jsonpath='{range .items[*]}{.spec.podCIDR}{" "}{range .spec.podCIDRs[*]}{.}{" "}{end}{end}' 2>/dev/null |
              xargs -n1 2>/dev/null |
              awk 'NF' |
              sort -u |
              xargs || true
          args:
            executable: /bin/bash
          register: platform_dns_pod_cidrs_detected
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when:
            - platform_dns_service_path_repair_effective | bool
            - platform_dns_service_path_repair_required | bool

        - name: Select Kubernetes pod CIDRs for DNS service path repair
          ansible.builtin.set_fact:
            platform_dns_pod_cidrs_effective: >-
              {{
                ((platform_dns_pod_cidrs_raw | trim | length) > 0)
                | ternary(platform_dns_pod_cidrs_raw, platform_dns_pod_cidrs_detected.stdout | default(''))
                | trim
                | regex_replace('\s+', ' ')
              }}
          run_once: true
          when:
            - platform_dns_service_path_repair_effective | bool
            - platform_dns_service_path_repair_required | bool

        - name: Write CNI DNS service path sysctl repair on all nodes
          ansible.builtin.copy:
            dest: "{{ platform_dns_service_path_sysctl_file }}"
            owner: root
            group: root
            mode: "0644"
            content: |
              net.ipv4.ip_forward=1
              net.ipv4.conf.all.rp_filter=0
              net.ipv4.conf.default.rp_filter=0
          when:
            - platform_dns_service_path_repair_effective | bool
            - hostvars[rke2_first_server].platform_dns_service_path_repair_required | default(false) | bool

        - name: Apply CNI DNS service path sysctl repair on all nodes
          ansible.builtin.command: sysctl --system
          changed_when: false
          when:
            - platform_dns_service_path_repair_effective | bool
            - hostvars[rke2_first_server].platform_dns_service_path_repair_required | default(false) | bool

        - name: Repair CNI DNS service path kernel modules and interface rp_filter
          ansible.builtin.shell: |
            set -u
            for module in br_netfilter overlay nf_conntrack; do
              modprobe "${module}" >/dev/null 2>&1 || true
            done
            for path in /proc/sys/net/ipv4/conf/*/rp_filter; do
              if [ -w "${path}" ]; then
                printf '0\n' > "${path}" || true
              fi
            done
            echo "===== kernel modules ====="
            lsmod | grep -E 'br_netfilter|overlay|nf_conntrack|vxlan' || true
            echo "===== rp_filter ====="
            grep -H . /proc/sys/net/ipv4/conf/*/rp_filter 2>/dev/null || true
          args:
            executable: /bin/bash
          changed_when: false
          when:
            - platform_dns_service_path_repair_effective | bool
            - hostvars[rke2_first_server].platform_dns_service_path_repair_required | default(false) | bool

        - name: Prune transient CNI interfaces from permanent firewalld trust
          ansible.builtin.script:
            cmd: "{{ playbook_dir }}/../../scripts/cleanup_firewalld_cni_interfaces.py --path /etc/firewalld/zones/trusted.xml"
            executable: /usr/bin/python3
          register: platform_dns_service_path_firewalld_interface_cleanup
          changed_when: >-
            'firewalld_ephemeral_interface_cleanup=changed' in
            (platform_dns_service_path_firewalld_interface_cleanup.stdout | default(''))
          when:
            - platform_dns_service_path_repair_effective | bool
            - hostvars[rke2_first_server].platform_dns_service_path_repair_required | default(false) | bool

        - name: Restore firewalld trusted zone SELinux context after cleanup
          ansible.builtin.command: restorecon -F /etc/firewalld/zones/trusted.xml
          register: platform_dns_service_path_firewalld_interface_cleanup_restorecon
          changed_when: false
          failed_when: false
          when:
            - platform_dns_service_path_firewalld_interface_cleanup is changed

        - name: Check and recover firewalld state for DNS service path repair
          ansible.builtin.shell: |
            set -o pipefail
            set -u

            run_bounded() {
              seconds="$1"
              shift
              if command -v timeout >/dev/null 2>&1; then
                timeout --foreground "${seconds}s" "$@"
              else
                "$@"
              fi
            }

            wait_for_firewalld() {
              timeout_seconds="${1:-120}"
              deadline=$(( $(date +%s) + timeout_seconds ))
              attempt=1
              while [ "$(date +%s)" -lt "${deadline}" ]; do
                state="$(run_bounded 10 firewall-cmd --state 2>/dev/null || true)"
                if [ "${state}" = "running" ]; then
                  echo "firewalld_state=running attempt=${attempt}"
                  return 0
                fi
                sleep 2
                attempt=$((attempt + 1))
              done
              return 1
            }

            if ! command -v firewall-cmd >/dev/null 2>&1; then
              echo "firewalld_state_recovery=skipped-unavailable"
              exit 3
            fi

            state="$(run_bounded 15 firewall-cmd --state 2>/dev/null || true)"
            if [ "${state}" = "running" ]; then
              echo "firewalld_state_recovery=already-running"
              exit 0
            fi

            if ! run_bounded 10 systemctl is-enabled --quiet firewalld; then
              echo "firewalld_state_recovery=skipped-disabled"
              exit 3
            fi

            echo "firewalld_state_recovery_action=restart-after-interface-cleanup"
            stop_rc=0
            run_bounded 45 systemctl stop firewalld || stop_rc=$?
            if [ "${stop_rc}" -ne 0 ]; then
              echo "firewalld_stop_rc=${stop_rc} action=force-stop"
              run_bounded 10 systemctl kill --kill-who=all --signal=KILL firewalld || true
              run_bounded 15 systemctl stop firewalld || true
            fi
            run_bounded 10 systemctl reset-failed firewalld || true

            start_rc=0
            start_output="$(run_bounded 120 systemctl start firewalld 2>&1)" || start_rc=$?
            printf 'firewalld_start_rc=%s\n%s\n' "${start_rc}" "${start_output}"
            if wait_for_firewalld 120; then
              echo "firewalld_state_recovery_result=recovered"
              exit 0
            fi

            echo "firewalld_state_recovery_result=failed" >&2
            run_bounded 15 systemctl --no-pager --full status firewalld >&2 || true
            run_bounded 15 journalctl --no-pager -u firewalld -n 80 >&2 || true
            exit 1
          args:
            executable: /bin/bash
          register: platform_dns_service_path_firewalld_state
          changed_when: >-
            'firewalld_state_recovery_action=restart-after-interface-cleanup' in
            (platform_dns_service_path_firewalld_state.stdout | default(''))
          failed_when: (platform_dns_service_path_firewalld_state.rc | default(1)) not in [0, 3]
          throttle: 1
          when:
            - platform_dns_service_path_repair_effective | bool
            - hostvars[rke2_first_server].platform_dns_service_path_repair_required | default(false) | bool

        - name: Query CNI DNS service path firewalld ports
          ansible.builtin.command: "firewall-cmd --permanent --query-port={{ item }}"
          register: platform_dns_service_path_firewalld_port_queries
          changed_when: false
          failed_when: false
          loop: "{{ platform_dns_service_path_firewalld_ports }}"
          when:
            - platform_dns_service_path_repair_effective | bool
            - hostvars[rke2_first_server].platform_dns_service_path_repair_required | default(false) | bool
            - (platform_dns_service_path_firewalld_state.rc | default(1)) == 0

        - name: Open CNI DNS service path firewalld ports
          ansible.builtin.command: "firewall-cmd --permanent --add-port={{ item.item }}"
          register: platform_dns_service_path_firewalld_open
          changed_when: true
          loop: "{{ platform_dns_service_path_firewalld_port_queries.results | default([]) }}"
          when:
            - platform_dns_service_path_repair_effective | bool
            - hostvars[rke2_first_server].platform_dns_service_path_repair_required | default(false) | bool
            - (platform_dns_service_path_firewalld_state.rc | default(1)) == 0
            - item.rc != 0

        - name: Query CNI DNS service path trusted pod CIDRs
          ansible.builtin.command: "firewall-cmd --permanent --zone=trusted --query-source={{ item }}"
          register: platform_dns_service_path_firewalld_source_queries
          changed_when: false
          failed_when: false
          loop: "{{ (hostvars[rke2_first_server].platform_dns_pod_cidrs_effective | default('')).split() }}"
          when:
            - platform_dns_service_path_repair_effective | bool
            - hostvars[rke2_first_server].platform_dns_service_path_repair_required | default(false) | bool
            - (platform_dns_service_path_firewalld_state.rc | default(1)) == 0
            - (hostvars[rke2_first_server].platform_dns_pod_cidrs_effective | default('') | trim | length) > 0

        - name: Trust CNI DNS service path pod CIDRs in firewalld
          ansible.builtin.command: "firewall-cmd --permanent --zone=trusted --add-source={{ item.item }}"
          register: platform_dns_service_path_firewalld_trust_sources
          changed_when: platform_dns_service_path_firewalld_trust_sources.rc == 0
          failed_when: false
          loop: "{{ platform_dns_service_path_firewalld_source_queries.results | default([]) }}"
          when:
            - platform_dns_service_path_repair_effective | bool
            - hostvars[rke2_first_server].platform_dns_service_path_repair_required | default(false) | bool
            - (platform_dns_service_path_firewalld_state.rc | default(1)) == 0
            - item.rc != 0

        - name: Query CNI DNS service path trusted node IPs
          ansible.builtin.command: "firewall-cmd --permanent --zone=trusted --query-source={{ (hostvars[item].ansible_host | default(item)) ~ '/32' }}"
          register: platform_dns_service_path_firewalld_node_source_queries
          changed_when: false
          failed_when: false
          loop: "{{ groups['rke2_servers'] | default([]) }}"
          when:
            - platform_dns_service_path_repair_effective | bool
            - hostvars[rke2_first_server].platform_dns_service_path_repair_required | default(false) | bool
            - (platform_dns_service_path_firewalld_state.rc | default(1)) == 0
            - (hostvars[item].ansible_host | default(item)) is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')

        - name: Trust CNI DNS service path node IPs in firewalld
          ansible.builtin.command: "firewall-cmd --permanent --zone=trusted --add-source={{ (hostvars[item.item].ansible_host | default(item.item)) ~ '/32' }}"
          register: platform_dns_service_path_firewalld_trust_node_sources
          changed_when: platform_dns_service_path_firewalld_trust_node_sources.rc == 0
          failed_when: false
          loop: "{{ platform_dns_service_path_firewalld_node_source_queries.results | default([]) }}"
          when:
            - platform_dns_service_path_repair_effective | bool
            - hostvars[rke2_first_server].platform_dns_service_path_repair_required | default(false) | bool
            - (platform_dns_service_path_firewalld_state.rc | default(1)) == 0
            - (item.rc | default(0)) != 0

        - name: Query CNI DNS service path trusted interfaces
          ansible.builtin.command: "firewall-cmd --permanent --zone=trusted --query-interface={{ item }}"
          register: platform_dns_service_path_firewalld_interface_queries
          changed_when: false
          failed_when: false
          loop: "{{ platform_dns_service_path_firewalld_trusted_interfaces }}"
          when:
            - platform_dns_service_path_repair_effective | bool
            - hostvars[rke2_first_server].platform_dns_service_path_repair_required | default(false) | bool
            - (platform_dns_service_path_firewalld_state.rc | default(1)) == 0

        - name: Trust CNI DNS service path interfaces in firewalld
          ansible.builtin.command: "firewall-cmd --permanent --zone=trusted --change-interface={{ item.item }}"
          register: platform_dns_service_path_firewalld_trust_interfaces
          changed_when: platform_dns_service_path_firewalld_trust_interfaces.rc == 0
          failed_when: false
          loop: "{{ platform_dns_service_path_firewalld_interface_queries.results | default([]) }}"
          when:
            - platform_dns_service_path_repair_effective | bool
            - hostvars[rke2_first_server].platform_dns_service_path_repair_required | default(false) | bool
            - (platform_dns_service_path_firewalld_state.rc | default(1)) == 0
            - item.rc != 0

        - name: Install CNI DNS service path direct firewalld accept rules
          ansible.builtin.shell: |
            set -u
            changed=false
            pod_cidrs="{{ hostvars[rke2_first_server].platform_dns_pod_cidrs_effective | default('') }}"

            add_direct_rule() {
              family="$1"
              table="$2"
              chain="$3"
              priority="$4"
              shift 4
              if ! firewall-cmd --permanent --direct --query-rule "${family}" "${table}" "${chain}" "${priority}" "$@" >/dev/null 2>&1; then
                if firewall-cmd --permanent --direct --add-rule "${family}" "${table}" "${chain}" "${priority}" "$@"; then
                  changed=true
                  echo "added direct rule: ${family} ${table} ${chain} ${priority} $*"
                fi
              fi
            }

            for source in ${pod_cidrs}; do
              case "${source}" in
                ''|*[!0-9./]*) continue ;;
              esac
              add_direct_rule ipv4 filter INPUT 0 -s "${source}" -j ACCEPT
              add_direct_rule ipv4 filter OUTPUT 0 -d "${source}" -j ACCEPT
              # RKE2 commonly allocates one pod CIDR per node, so every
              # source CIDR must be allowed to reach every destination CIDR.
              for destination in ${pod_cidrs}; do
                case "${destination}" in
                  ''|*[!0-9./]*) continue ;;
                esac
                add_direct_rule ipv4 filter FORWARD 0 \
                  -s "${source}" -d "${destination}" -j ACCEPT
              done
            done

            for prefix in cilium+ lxc+ cni+ veth+; do
              add_direct_rule ipv4 filter FORWARD 0 -i "${prefix}" -j ACCEPT
              add_direct_rule ipv4 filter FORWARD 0 -o "${prefix}" -j ACCEPT
            done

            firewall-cmd --direct --get-all-rules || true
            echo "changed=${changed}"
          args:
            executable: /bin/bash
          register: platform_dns_service_path_firewalld_direct_cni_rules
          changed_when: "'changed=true' in (platform_dns_service_path_firewalld_direct_cni_rules.stdout | default(''))"
          failed_when: false
          when:
            - platform_dns_service_path_repair_effective | bool
            - hostvars[rke2_first_server].platform_dns_service_path_repair_required | default(false) | bool
            - (platform_dns_service_path_firewalld_state.rc | default(1)) == 0

        - name: Reload and recover firewalld after CNI DNS service path repair
          ansible.builtin.shell: |
            set -o pipefail
            set -u

            run_bounded() {
              seconds="$1"
              shift
              if command -v timeout >/dev/null 2>&1; then
                timeout --foreground "${seconds}s" "$@"
              else
                "$@"
              fi
            }

            wait_for_firewalld() {
              timeout_seconds="${1:-120}"
              deadline=$(( $(date +%s) + timeout_seconds ))
              attempt=1
              while [ "$(date +%s)" -lt "${deadline}" ]; do
                state="$(run_bounded 10 firewall-cmd --state 2>/dev/null || true)"
                if [ "${state}" = "running" ]; then
                  echo "firewalld_state=running attempt=${attempt}"
                  return 0
                fi
                sleep 2
                attempt=$((attempt + 1))
              done
              return 1
            }

            recover_firewalld() {
              stop_rc=0
              run_bounded 45 systemctl stop firewalld || stop_rc=$?
              if [ "${stop_rc}" -ne 0 ]; then
                echo "firewalld_stop_rc=${stop_rc} action=force-stop"
                run_bounded 10 systemctl kill --kill-who=all --signal=KILL firewalld || true
                run_bounded 15 systemctl stop firewalld || true
              fi
              run_bounded 10 systemctl reset-failed firewalld || true
              run_bounded 120 systemctl start firewalld
            }

            verify_firewalld_runtime() {
              missing=false
              ports="{{ platform_dns_service_path_firewalld_ports | join(' ') }}"
              pod_cidrs="{{ hostvars[rke2_first_server].platform_dns_pod_cidrs_effective | default('') }}"
              node_ips="{% for node in groups['rke2_servers'] | default([]) %}{{ hostvars[node].ansible_host | default(node) }} {% endfor %}"
              trusted_interfaces="{{ platform_dns_service_path_firewalld_trusted_interfaces | join(' ') }}"

              for port in ${ports}; do
                if ! run_bounded 10 firewall-cmd --query-port="${port}" >/dev/null 2>&1; then
                  echo "firewalld_runtime_missing=port:${port}"
                  missing=true
                fi
              done

              for source in ${pod_cidrs}; do
                if ! run_bounded 10 firewall-cmd --zone=trusted --query-source="${source}" >/dev/null 2>&1; then
                  echo "firewalld_runtime_missing=trusted-source:${source}"
                  missing=true
                fi
                for destination in ${pod_cidrs}; do
                  if ! run_bounded 10 firewall-cmd --direct --query-rule \
                    ipv4 filter FORWARD 0 \
                    -s "${source}" -d "${destination}" -j ACCEPT >/dev/null 2>&1; then
                    echo "firewalld_runtime_missing=forward:${source}->${destination}"
                    missing=true
                  fi
                done
              done

              for node_ip in ${node_ips}; do
                case "${node_ip}" in
                  ''|*[!0-9.]*) continue ;;
                esac
                source="${node_ip}/32"
                if ! run_bounded 10 firewall-cmd --zone=trusted --query-source="${source}" >/dev/null 2>&1; then
                  echo "firewalld_runtime_missing=trusted-source:${source}"
                  missing=true
                fi
              done

              for interface in ${trusted_interfaces}; do
                if ! ip link show "${interface}" >/dev/null 2>&1; then
                  continue
                fi
                if ! run_bounded 10 firewall-cmd --zone=trusted --query-interface="${interface}" >/dev/null 2>&1; then
                  echo "firewalld_runtime_missing=trusted-interface:${interface}"
                  missing=true
                fi
              done

              [ "${missing}" = "false" ]
            }

            reload_rc=0
            reload_output="$(run_bounded 40 firewall-cmd --reload 2>&1)" || reload_rc=$?
            printf 'firewalld_reload_rc=%s\n%s\n' "${reload_rc}" "${reload_output}"

            runtime_ready=false
            if wait_for_firewalld 120 && verify_firewalld_runtime; then
              runtime_ready=true
            fi

            if [ "${runtime_ready}" != "true" ]; then
              echo "firewalld_reload_action=rolling-restart"
              restart_rc=0
              restart_output="$(recover_firewalld 2>&1)" || restart_rc=$?
              printf 'firewalld_restart_rc=%s\n%s\n' "${restart_rc}" "${restart_output}"

              if ! wait_for_firewalld 120; then
                echo "firewalld_reload_result=failed" >&2
                run_bounded 15 systemctl --no-pager --full status firewalld >&2 || true
                run_bounded 15 journalctl --no-pager -u firewalld -n 80 >&2 || true
                exit 1
              fi
              if ! verify_firewalld_runtime; then
                echo "firewalld_reload_result=failed-runtime-verification" >&2
                run_bounded 15 firewall-cmd --get-active-zones >&2 || true
                run_bounded 15 firewall-cmd --zone=trusted --list-all >&2 || true
                run_bounded 15 firewall-cmd --direct --get-all-rules >&2 || true
                exit 1
              fi
              echo "firewalld_reload_result=recovered"
            elif [ "${reload_rc}" -ne 0 ]; then
              echo "firewalld_reload_result=completed-after-dbus-timeout"
            else
              echo "firewalld_reload_result=success"
            fi

            echo "===== active firewalld zones after CNI repair ====="
            run_bounded 15 firewall-cmd --get-active-zones || true
            echo "===== trusted firewalld zone after CNI repair ====="
            run_bounded 15 firewall-cmd --zone=trusted --list-all || true
            echo "===== direct firewalld rules after CNI repair ====="
            run_bounded 15 firewall-cmd --direct --get-all-rules || true
          args:
            executable: /bin/bash
          register: platform_dns_service_path_firewalld_reload
          changed_when: true
          throttle: 1
          when:
            - platform_dns_service_path_repair_effective | bool
            - hostvars[rke2_first_server].platform_dns_service_path_repair_required | default(false) | bool
            - (platform_dns_service_path_firewalld_state.rc | default(1)) == 0

        - name: Collect Kubernetes DNS service path state before component repair
          ansible.builtin.shell: |
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            "$K" --kubeconfig "$C" -n kube-system get svc,endpoints,endpointslice -l k8s-app=kube-dns -o wide || true
            "$K" --kubeconfig "$C" -n kube-system get ds,pods -o wide |
              grep -E 'NAME|coredns|kube-proxy|cilium' || true
            echo "===== detected pod CIDRs for firewalld trust ====="
            printf '%s\n' "{{ hostvars[rke2_first_server].platform_dns_pod_cidrs_effective | default('') }}"
            echo "===== RKE2 node sources for firewalld trust ====="
            {% for node in groups['rke2_servers'] | default([]) %}
            printf '%s\n' "{{ hostvars[node].ansible_host | default(node) }}/32"
            {% endfor %}
            echo "===== rp_filter ====="
            grep -H . /proc/sys/net/ipv4/conf/*/rp_filter 2>/dev/null || true
            echo "===== firewalld zones ====="
            if command -v firewall-cmd >/dev/null 2>&1; then
              firewall-cmd --get-active-zones || true
              firewall-cmd --zone=trusted --list-all || true
              firewall-cmd --direct --get-all-rules || true
            fi
            echo "===== Cilium config ====="
            "$K" --kubeconfig "$C" -n kube-system get configmap cilium-config -o yaml 2>/dev/null || true
          args:
            executable: /bin/bash
          register: platform_dns_service_path_state_before_repair
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when:
            - platform_dns_service_path_repair_effective | bool
            - platform_dns_service_path_repair_required | bool

        - name: Print Kubernetes DNS service path state before component repair
          ansible.builtin.debug:
            var: platform_dns_service_path_state_before_repair.stdout_lines
          when: platform_dns_service_path_state_before_repair is defined and platform_dns_service_path_state_before_repair.stdout_lines is defined
          run_once: true

        - name: Detect kube-proxy DNS service path component
          ansible.builtin.shell: |
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            if "$K" --kubeconfig "$C" -n kube-system get daemonset kube-proxy >/dev/null 2>&1; then
              echo daemonset/kube-proxy
            elif "$K" --kubeconfig "$C" -n kube-system get daemonset rke2-kube-proxy >/dev/null 2>&1; then
              echo daemonset/rke2-kube-proxy
            else
              echo none
            fi
          args:
            executable: /bin/bash
          register: platform_dns_kube_proxy_workload
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when:
            - platform_dns_service_path_repair_effective | bool
            - platform_dns_service_path_repair_required | bool

        - name: Restart kube-proxy DNS service path component
          ansible.builtin.command: >-
            /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
            -n kube-system rollout restart {{ platform_dns_kube_proxy_workload.stdout }}
          register: platform_dns_service_path_kube_proxy_restart
          changed_when: "'restarted' in platform_dns_service_path_kube_proxy_restart.stdout"
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when:
            - platform_dns_service_path_repair_effective | bool
            - platform_dns_service_path_repair_required | bool
            - platform_dns_kube_proxy_workload.stdout | default('none') != 'none'

        - name: Poll kube-proxy DNS service path component
          ansible.builtin.command: >-
            /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
            -n kube-system rollout status {{ platform_dns_kube_proxy_workload.stdout }}
            --timeout={{ platform_dns_service_path_poll_interval_effective }}s
          register: platform_dns_service_path_kube_proxy_rollout
          retries: "{{ platform_dns_service_path_rollout_retries_effective }}"
          delay: "{{ platform_dns_service_path_poll_interval_effective }}"
          until: platform_dns_service_path_kube_proxy_rollout.rc == 0
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when:
            - platform_dns_service_path_repair_effective | bool
            - platform_dns_service_path_repair_required | bool
            - platform_dns_kube_proxy_workload.stdout | default('none') != 'none'

        - name: Delete kube-proxy pods when no DaemonSet exists
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            request_timeout={{ platform_dns_kube_proxy_delete_timeout_effective }}s
            "$K" --kubeconfig "$C" --request-timeout="${request_timeout}" -n kube-system \
              delete pod -l k8s-app=kube-proxy --ignore-not-found=true --wait=false || true
            "$K" --kubeconfig "$C" --request-timeout="${request_timeout}" -n kube-system get pods -o name |
              awk -F/ '/\/kube-proxy-/ {print $2}' |
              xargs -r "$K" --kubeconfig "$C" --request-timeout="${request_timeout}" -n kube-system \
                delete pod --ignore-not-found=true --wait=false || true
            "$K" --kubeconfig "$C" --request-timeout="${request_timeout}" -n kube-system get pods -o wide |
              grep -E 'NAME|kube-proxy' || true
          args:
            executable: /bin/bash
          register: platform_dns_service_path_kube_proxy_delete
          changed_when: "'deleted' in platform_dns_service_path_kube_proxy_delete.stdout"
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when:
            - platform_dns_service_path_repair_effective | bool
            - platform_dns_service_path_repair_required | bool
            - platform_dns_kube_proxy_workload.stdout | default('none') == 'none'

        - name: Poll static kube-proxy pods after delete
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            expected={{ groups['rke2_servers'] | length }}
            "$K" --kubeconfig "$C" -n kube-system get pods -o wide | awk -v expected="${expected}" '
              NR == 1 { print; next }
              $1 ~ /^kube-proxy-/ {
                print
                total++
                split($2, ready, "/")
                if ($3 == "Running" && ready[1] == ready[2]) running++
              }
              END { exit(total == expected && running == expected ? 0 : 1) }
            '
          args:
            executable: /bin/bash
          register: platform_dns_service_path_static_kube_proxy_ready
          retries: "{{ platform_dns_service_path_rollout_retries_effective }}"
          delay: "{{ platform_dns_service_path_poll_interval_effective }}"
          until: platform_dns_service_path_static_kube_proxy_ready.rc == 0
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when:
            - platform_dns_service_path_repair_effective | bool
            - platform_dns_service_path_repair_required | bool
            - platform_dns_kube_proxy_workload.stdout | default('none') == 'none'

        - name: Restart Cilium DNS service path component
          ansible.builtin.command: >-
            /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
            -n kube-system rollout restart daemonset/cilium
          register: platform_dns_service_path_cilium_restart
          changed_when: "'restarted' in platform_dns_service_path_cilium_restart.stdout"
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when:
            - platform_dns_service_path_repair_effective | bool
            - platform_dns_service_path_repair_required | bool

        - name: Poll Cilium DNS service path component
          ansible.builtin.command: >-
            /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
            -n kube-system rollout status daemonset/cilium
            --timeout={{ platform_dns_service_path_poll_interval_effective }}s
          register: platform_dns_service_path_cilium_rollout
          retries: "{{ platform_dns_service_path_rollout_retries_effective }}"
          delay: "{{ platform_dns_service_path_poll_interval_effective }}"
          until: platform_dns_service_path_cilium_rollout.rc == 0
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when:
            - platform_dns_service_path_repair_effective | bool
            - platform_dns_service_path_repair_required | bool
            - platform_dns_service_path_cilium_restart.rc | default(1) == 0

        - name: Show Cilium DNS service path component
          ansible.builtin.shell: |
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            "$K" --kubeconfig "$C" -n kube-system get ds,pods -o wide |
              grep -E 'NAME|cilium' || true
          args:
            executable: /bin/bash
          register: platform_dns_service_path_cilium_state
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when:
            - platform_dns_service_path_repair_effective | bool
            - platform_dns_service_path_repair_required | bool

        - name: Restart CoreDNS DNS service path component
          ansible.builtin.command: >-
            /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
            -n kube-system rollout restart deployment/{{ platform_coredns_deployment }}
          register: platform_dns_service_path_coredns_restart
          changed_when: "'restarted' in platform_dns_service_path_coredns_restart.stdout"
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when:
            - platform_dns_service_path_repair_effective | bool
            - not (platform_dns_default_resolution_ok | bool)

        - name: Poll CoreDNS DNS service path component
          ansible.builtin.command: >-
            /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
            -n kube-system rollout status deployment/{{ platform_coredns_deployment }}
            --timeout={{ platform_dns_service_path_poll_interval_effective }}s
          register: platform_dns_service_path_coredns_rollout
          retries: "{{ platform_dns_service_path_rollout_retries_effective }}"
          delay: "{{ platform_dns_service_path_poll_interval_effective }}"
          until: platform_dns_service_path_coredns_rollout.rc == 0
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when:
            - platform_dns_service_path_repair_effective | bool
            - not (platform_dns_default_resolution_ok | bool)
            - platform_dns_service_path_coredns_restart.rc | default(1) == 0

        - name: Collect Kubernetes DNS service path state after component repair
          ansible.builtin.shell: |
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            "$K" --kubeconfig "$C" -n kube-system get svc,endpoints,endpointslice -l k8s-app=kube-dns -o wide || true
            "$K" --kubeconfig "$C" -n kube-system get ds,pods -o wide |
              grep -E 'NAME|coredns|kube-proxy|cilium' || true
          args:
            executable: /bin/bash
          register: platform_dns_service_path_state_after_repair
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when:
            - platform_dns_service_path_repair_effective | bool
            - platform_dns_service_path_repair_required | bool

        - name: Print Kubernetes DNS service path repair output
          ansible.builtin.debug:
            msg:
              - "kube-proxy repair:"
              - "{{ platform_dns_service_path_kube_proxy_rollout.stdout_lines | default(platform_dns_service_path_kube_proxy_delete.stdout_lines | default(['not run'])) }}"
              - "Cilium repair:"
              - "{{ platform_dns_service_path_cilium_rollout.stdout_lines | default(platform_dns_service_path_cilium_state.stdout_lines | default(['not run'])) }}"
              - "CoreDNS repair:"
              - "{{ platform_dns_service_path_coredns_rollout.stdout_lines | default(['not run']) }}"
              - "CoreDNS HA local routing:"
              - "{{ platform_dns_coredns_ha_local_routing.stdout_lines | default(['not run']) }}"
              - "Post-repair state:"
              - "{{ platform_dns_service_path_state_after_repair.stdout_lines | default(['not collected']) }}"
          when:
            - platform_dns_service_path_repair_effective | bool
            - platform_dns_service_path_repair_required | bool
          run_once: true

        - name: Detect CoreDNS endpoint IPs after DNS service path component repair
          ansible.builtin.shell: |
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            "$K" --kubeconfig "$C" -n kube-system get endpoints -l k8s-app=kube-dns \
              -o jsonpath='{range .items[*].subsets[*].addresses[*]}{.ip}{" "}{end}' 2>/dev/null || true
          args:
            executable: /bin/bash
          register: platform_coredns_endpoint_ips_after_component_repair
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when:
            - platform_dns_service_path_repair_effective | bool
            - not (platform_dns_default_resolution_ok | bool)

        - name: Select current CoreDNS endpoint IPs for final DNS service path check
          ansible.builtin.set_fact:
            platform_coredns_endpoint_ips_effective: "{{ platform_coredns_endpoint_ips_after_component_repair.stdout | default(platform_coredns_endpoint_ips_effective, true) | trim }}"
          run_once: true
          when:
            - platform_dns_service_path_repair_effective | bool
            - not (platform_dns_default_resolution_ok | bool)

        - name: Check Kubernetes DNS service path after component repair
          ansible.builtin.shell: |
            set -e -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            JOB={{ platform_dns_service_path_job_name }}
            cleanup_deadline=$((SECONDS + {{ platform_dns_job_cleanup_timeout_effective }}))
            "$K" --kubeconfig "$C" -n kube-system delete job "${JOB}" --ignore-not-found=true --wait=false >/dev/null 2>&1 || true
            while "$K" --kubeconfig "$C" -n kube-system get job "${JOB}" >/dev/null 2>&1; do
              if [ "${SECONDS}" -ge "${cleanup_deadline}" ]; then
                echo "Timed out waiting for stale DNS job ${JOB} to be deleted." >&2
                "$K" --kubeconfig "$C" -n kube-system get job "${JOB}" -o wide >&2 || true
                "$K" --kubeconfig "$C" -n kube-system describe job "${JOB}" >&2 || true
                exit 1
              fi
              sleep 1
            done
            "$K" --kubeconfig "$C" -n kube-system apply -f -
            deadline=$((SECONDS + {{ platform_dns_check_timeout_effective }}))
            while [ "${SECONDS}" -lt "${deadline}" ]; do
              succeeded="$("$K" --kubeconfig "$C" -n kube-system get job "${JOB}" -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"
              failed="$("$K" --kubeconfig "$C" -n kube-system get job "${JOB}" -o jsonpath='{.status.failed}' 2>/dev/null || true)"
              if [ "${succeeded}" = "1" ] || { [ -n "${failed}" ] && [ "${failed}" != "0" ]; }; then
                break
              fi
              sleep 5
            done
            "$K" --kubeconfig "$C" -n kube-system logs -l job-name="${JOB}" --tail=240 || true
          args:
            executable: /bin/bash
            stdin: |
              ---
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: {{ platform_dns_service_path_job_name }}
                namespace: kube-system
              spec:
                backoffLimit: 0
                activeDeadlineSeconds: {{ platform_dns_check_timeout_effective }}
                ttlSecondsAfterFinished: 300
                template:
                  spec:
                    restartPolicy: Never
                    nodeSelector:
                      kubernetes.io/os: linux
                    containers:
                      - name: dns-service-path-check
                        image: {{ platform_dns_check_image_effective }}
                        imagePullPolicy: IfNotPresent
                        command:
                          - sh
                          - -c
                        args:
                          - |
                            set -ex
                            REPO_URL='{{ platform_dns_check_repo_effective }}'
                            REPO_HOST="$(printf '%s' "${REPO_URL}" | sed -E 's#^https?://([^/]+).*#\1#')"
                            PROBE_TIMEOUT={{ platform_dns_probe_timeout_effective }}
                            DNS_UPSTREAMS='{{ platform_dns_upstreams_effective }}'
                            KUBE_DNS_SERVICE_IPS='{{ platform_cluster_dns_service_ips_list | join(' ') }}'
                            COREDNS_ENDPOINT_IPS='{{ platform_coredns_endpoint_ips_effective }}'
                            run_bounded() {
                              seconds="$1"
                              shift
                              if command -v timeout >/dev/null 2>&1; then
                                timeout "${seconds}" "$@"
                              else
                                "$@"
                              fi
                            }
                            echo "===== pod resolver ====="
                            cat /etc/resolv.conf
                            echo "===== current CoreDNS endpoint IPs ====="
                            printf '%s\n' "${COREDNS_ENDPOINT_IPS}"
                            echo "===== default Kubernetes DNS service check ====="
                            if run_bounded "${PROBE_TIMEOUT}" nslookup "${REPO_HOST}"; then
                              default_ok=true
                            else
                              default_ok=false
                            fi
                            echo "===== explicit Kubernetes DNS service IP checks ====="
                            service_ip_ok=false
                            for dns in ${KUBE_DNS_SERVICE_IPS}; do
                              echo "--- ${dns} ---"
                              if run_bounded "${PROBE_TIMEOUT}" nslookup "${REPO_HOST}" "${dns}"; then
                                service_ip_ok=true
                              fi
                            done
                            echo "===== direct CoreDNS endpoint IP checks ====="
                            endpoint_ok=true
                            endpoint_count=0
                            for dns in ${COREDNS_ENDPOINT_IPS}; do
                              endpoint_count=$((endpoint_count + 1))
                              echo "--- ${dns} ---"
                              if ! run_bounded "${PROBE_TIMEOUT}" nslookup "${REPO_HOST}" "${dns}"; then
                                endpoint_ok=false
                              fi
                            done
                            if [ "${endpoint_count}" -eq 0 ]; then
                              endpoint_ok=false
                            fi
                            echo "===== direct upstream DNS checks ====="
                            direct_ok=false
                            for dns in ${DNS_UPSTREAMS}; do
                              echo "--- ${dns} ---"
                              if run_bounded "${PROBE_TIMEOUT}" nslookup "${REPO_HOST}" "${dns}"; then
                                direct_ok=true
                              fi
                            done
                            echo "PLATFORM_DNS_DEFAULT_RESOLUTION=${default_ok}"
                            echo "PLATFORM_DNS_SERVICE_IP_RESOLUTION=${service_ip_ok}"
                            echo "PLATFORM_DNS_COREDNS_ENDPOINT_RESOLUTION=${endpoint_ok}"
                            echo "PLATFORM_DNS_DIRECT_UPSTREAM_RESOLUTION=${direct_ok}"
          register: platform_dns_service_path_check_after_component_repair
          changed_when: false
          failed_when: false
          retries: "{{ platform_dns_service_path_rollout_retries_effective }}"
          delay: "{{ platform_dns_service_path_poll_interval_effective }}"
          until: platform_dns_service_path_check_after_component_repair.stdout is search('PLATFORM_DNS_DEFAULT_RESOLUTION=true')
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when:
            - platform_dns_service_path_repair_effective | bool
            - not (platform_dns_default_resolution_ok | bool)

        - name: Detect final Kubernetes DNS service path state after component repair
          ansible.builtin.set_fact:
            platform_dns_default_resolution_ok: "{{ (platform_dns_service_path_check_after_component_repair.stdout | default('')) is search('PLATFORM_DNS_DEFAULT_RESOLUTION=true') }}"
            platform_dns_service_ip_resolution_ok: "{{ (platform_dns_service_path_check_after_component_repair.stdout | default('')) is search('PLATFORM_DNS_SERVICE_IP_RESOLUTION=true') }}"
            platform_dns_coredns_endpoint_resolution_ok: "{{ (platform_dns_service_path_check_after_component_repair.stdout | default('')) is search('PLATFORM_DNS_COREDNS_ENDPOINT_RESOLUTION=true') }}"
            platform_dns_direct_upstream_resolution_ok: "{{ (platform_dns_service_path_check_after_component_repair.stdout | default('')) is search('PLATFORM_DNS_DIRECT_UPSTREAM_RESOLUTION=true') }}"
          run_once: true
          when:
            - platform_dns_service_path_repair_effective | bool
            - platform_dns_service_path_check_after_component_repair is defined
            - not (platform_dns_default_resolution_ok | bool)

        - name: Print final Kubernetes DNS service path check
          ansible.builtin.debug:
            var: platform_dns_service_path_check_after_component_repair.stdout_lines
          when:
            - platform_dns_service_path_repair_effective | bool
            - platform_dns_service_path_check_after_component_repair is defined
            - platform_dns_service_path_check_after_component_repair.stdout_lines is defined
          run_once: true

        - name: Run cluster DNS check after repair
          ansible.builtin.shell: |
            set -e -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            JOB={{ platform_dns_check_job_name }}
            cleanup_deadline=$((SECONDS + {{ platform_dns_job_cleanup_timeout_effective }}))
            "$K" --kubeconfig "$C" -n kube-system delete job "${JOB}" --ignore-not-found=true --wait=false >/dev/null 2>&1 || true
            while "$K" --kubeconfig "$C" -n kube-system get job "${JOB}" >/dev/null 2>&1; do
              if [ "${SECONDS}" -ge "${cleanup_deadline}" ]; then
                echo "Timed out waiting for stale DNS job ${JOB} to be deleted." >&2
                "$K" --kubeconfig "$C" -n kube-system get job "${JOB}" -o wide >&2 || true
                "$K" --kubeconfig "$C" -n kube-system describe job "${JOB}" >&2 || true
                exit 1
              fi
              sleep 1
            done
            "$K" --kubeconfig "$C" -n kube-system apply -f -
            deadline=$((SECONDS + {{ platform_dns_chart_check_timeout_effective }}))
            while [ "${SECONDS}" -lt "${deadline}" ]; do
              succeeded="$("$K" --kubeconfig "$C" -n kube-system get job "${JOB}" -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"
              failed="$("$K" --kubeconfig "$C" -n kube-system get job "${JOB}" -o jsonpath='{.status.failed}' 2>/dev/null || true)"
              if [ "${succeeded}" = "1" ]; then
                "$K" --kubeconfig "$C" -n kube-system logs -l job-name="${JOB}" --tail=120 || true
                exit 0
              fi
              if [ -n "${failed}" ] && [ "${failed}" != "0" ]; then
                "$K" --kubeconfig "$C" -n kube-system logs -l job-name="${JOB}" --tail=120 || true
                exit 1
              fi
              sleep 5
            done
            "$K" --kubeconfig "$C" -n kube-system logs -l job-name="${JOB}" --tail=120 || true
            exit 1
          args:
            executable: /bin/bash
            stdin: |
              ---
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: {{ platform_dns_check_job_name }}
                namespace: kube-system
              spec:
                backoffLimit: 0
                activeDeadlineSeconds: {{ platform_dns_chart_check_timeout_effective }}
                ttlSecondsAfterFinished: 300
                template:
                  spec:
                    restartPolicy: Never
                    nodeSelector:
                      kubernetes.io/os: linux
                    containers:
                      - name: helm
                        image: {{ platform_dns_check_image_effective }}
                        imagePullPolicy: IfNotPresent
                        command:
                          - sh
                          - -c
                        args:
                          - |
                            set -ex
                            REPO_URL='{{ platform_dns_check_repo_effective }}'
                            REPO_INDEX="${REPO_URL%/}/index.yaml"
                            REPO_HOST="$(printf '%s' "${REPO_URL}" | sed -E 's#^https?://([^/]+).*#\1#')"
                            PROBE_TIMEOUT={{ platform_dns_probe_timeout_effective }}
                            HELM_ATTEMPTS={{ platform_dns_helm_attempts_effective }}
                            HELM_TIMEOUT={{ platform_dns_helm_timeout_effective }}
                            DNS_UPSTREAMS='{{ platform_dns_upstreams_effective }}'
                            export RES_OPTIONS='ndots:1 timeout:2 attempts:2 single-request-reopen'
                            run_bounded() {
                              seconds="$1"
                              shift
                              if command -v timeout >/dev/null 2>&1; then
                                timeout "${seconds}" "$@"
                              else
                                "$@"
                              fi
                            }
                            helm_output_has_failure() {
                              grep -E 'Unable to get an update|Error:|i/o timeout|no such host|bad address|TLS handshake timeout|connection timed out|context deadline exceeded|network is unreachable'
                            }
                            api_output_has_path_failure() {
                              grep -Ei 'TLS handshake timeout|i/o timeout|context deadline exceeded|connection timed out|operation timed out|connection refused|no such host|bad address|temporary failure in name resolution|server misbehaving|network is unreachable|no route to host|Client\.Timeout exceeded|connection reset by peer|x509:|remote error: tls'
                            }
                            run_kubernetes_api_service_check() {
                              echo "===== Kubernetes API ClusterIP TLS service-path probe ====="
                              nslookup kubernetes.default.svc || true
                              helm repo remove platform-kubernetes-api-check >/dev/null 2>&1 || true

                              set +e
                              api_output="$(run_bounded "${HELM_TIMEOUT}" helm repo add platform-kubernetes-api-check \
                                https://kubernetes.default.svc \
                                --ca-file /var/run/secrets/kubernetes.io/serviceaccount/ca.crt 2>&1)"
                              api_rc="$?"
                              set -e
                              printf '%s\n' "${api_output}"

                              case "${api_rc}" in
                                124|137|143)
                                  echo "Kubernetes API ClusterIP probe timed out with rc=${api_rc}." >&2
                                  return 1
                                  ;;
                              esac
                              if printf '%s\n' "${api_output}" | api_output_has_path_failure >/dev/null 2>&1; then
                                echo "Kubernetes API ClusterIP probe reported a service-path or TLS failure." >&2
                                return 1
                              fi
                              if [ "${api_rc}" -ne 0 ] && ! printf '%s\n' "${api_output}" |
                                grep -Eq '401 Unauthorized|403 Forbidden|404 Not Found|status code:?[[:space:]]*[0-9]{3}'; then
                                echo "Kubernetes API ClusterIP probe failed without a conclusive HTTP response (rc=${api_rc})." >&2
                                return 1
                              fi

                              echo "Kubernetes API ClusterIP returned a bounded TLS/HTTP response (helm_rc=${api_rc})."
                              return 0
                            }
                            run_helm_repo_check() {
                              attempt=1
                              while [ "${attempt}" -le "${HELM_ATTEMPTS}" ]; do
                                echo "===== helm repository attempt ${attempt}/${HELM_ATTEMPTS} ====="
                                nslookup "${REPO_HOST}" || true
                                helm repo remove platform-dns-check >/dev/null 2>&1 || true

                                set +e
                                add_output="$(run_bounded "${HELM_TIMEOUT}" helm repo add platform-dns-check "${REPO_URL}" 2>&1)"
                                add_rc="$?"
                                printf '%s\n' "${add_output}"
                                update_rc="not-run"
                                update_unhealthy=false
                                if [ "${add_rc}" -eq 0 ]; then
                                  update_output="$(run_bounded "${HELM_TIMEOUT}" helm repo update platform-dns-check 2>&1)"
                                  update_rc="$?"
                                  printf '%s\n' "${update_output}"
                                  if printf '%s\n' "${update_output}" | helm_output_has_failure >/dev/null 2>&1; then
                                    update_unhealthy=true
                                    update_rc=1
                                    echo "helm repo update returned an unhealthy repository access result." >&2
                                  fi
                                fi
                                set -e

                                if [ "${add_rc}" -eq 0 ] && [ "${update_rc}" = "0" ] && [ "${update_unhealthy}" = "false" ]; then
                                  echo "Helm repository check succeeded on attempt ${attempt}."
                                  return 0
                                fi

                                echo "Helm repository check attempt ${attempt}/${HELM_ATTEMPTS} failed: repo_add_rc=${add_rc} repo_update_rc=${update_rc} repo_update_unhealthy=${update_unhealthy}" >&2
                                if [ "${attempt}" -lt "${HELM_ATTEMPTS}" ]; then
                                  sleep 5
                                fi
                                attempt=$((attempt + 1))
                              done
                              return 1
                            }
                            echo "===== pod resolver ====="
                            cat /etc/resolv.conf
                            echo "===== repository host ====="
                            printf '%s\n' "${REPO_HOST}"
                            echo "===== configured CoreDNS upstreams ====="
                            printf '%s\n' "${DNS_UPSTREAMS}"
                            echo "===== IPv4 resolution ====="
                            (getent ahostsv4 "${REPO_HOST}" || nslookup "${REPO_HOST}" || true)
                            echo "===== IPv6 resolution ====="
                            (getent ahostsv6 "${REPO_HOST}" || true)
                            echo "===== direct upstream DNS checks ====="
                            for dns in ${DNS_UPSTREAMS}; do
                              echo "--- ${dns} ---"
                              run_bounded "${PROBE_TIMEOUT}" nslookup "${REPO_HOST}" "${dns}" || true
                            done
                            echo "===== repository HTTPS index probe ====="
                            if command -v curl >/dev/null 2>&1; then
                              run_bounded "${PROBE_TIMEOUT}" curl --fail --silent --show-error --location \
                                --connect-timeout "${PROBE_TIMEOUT}" --max-time "${PROBE_TIMEOUT}" \
                                --output /dev/null "${REPO_INDEX}" || {
                                  rc="$?"
                                  echo "Repository HTTPS index probe failed or timed out after ${PROBE_TIMEOUT}s with rc=${rc}; continuing to Helm repo check." >&2
                                }
                            elif command -v wget >/dev/null 2>&1; then
                              run_bounded "${PROBE_TIMEOUT}" wget -S -T "${PROBE_TIMEOUT}" \
                                -O /dev/null "${REPO_INDEX}" || {
                                  rc="$?"
                                  echo "Repository HTTPS index probe failed or timed out after ${PROBE_TIMEOUT}s with rc=${rc}; continuing to Helm repo check." >&2
                                }
                            else
                              echo "No curl or wget found in check image; skipping direct HTTPS index probe."
                            fi
                            api_service_rc=0
                            run_kubernetes_api_service_check || api_service_rc="$?"
                            if [ "${api_service_rc}" -eq 0 ]; then
                              echo "PLATFORM_KUBERNETES_API_SERVICE_PATH=true"
                            else
                              echo "PLATFORM_KUBERNETES_API_SERVICE_PATH=false"
                            fi
                            repo_rc=0
                            run_helm_repo_check || repo_rc="$?"
                            if [ "${api_service_rc}" -ne 0 ] || [ "${repo_rc}" -ne 0 ]; then
                              exit 1
                            fi
          register: platform_dns_check_after
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when: not (platform_dns_force_service_path_repair_effective | bool)

        - name: Collect cluster DNS diagnostics after failed repair
          ansible.builtin.shell: |
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            echo "===== selected CoreDNS upstreams ====="
            printf '%s\n' "{{ platform_dns_upstreams_effective }}"
            echo "===== ignored Kubernetes DNS service IPs ====="
            printf '%s\n' "{{ platform_cluster_dns_service_ips_list | join(' ') }}"
            echo "===== CoreDNS service/endpoints ====="
            "$K" --kubeconfig "$C" -n kube-system get svc,endpoints,endpointslice -l k8s-app=kube-dns -o wide || true
            "$K" --kubeconfig "$C" -n kube-system get svc,endpoints,endpointslice | grep -E 'coredns|kube-dns|NAME' || true
            echo "===== CoreDNS service local routing ====="
            "$K" --kubeconfig "$C" -n kube-system get svc -l k8s-app=kube-dns \
              -o jsonpath='{range .items[*]}{.metadata.name}{" internalTrafficPolicy="}{.spec.internalTrafficPolicy}{" clusterIP="}{.spec.clusterIP}{"\n"}{end}' || true
            echo "===== DNS service path check job logs ====="
            "$K" --kubeconfig "$C" -n kube-system logs -l job-name={{ platform_dns_service_path_job_name }} --tail=240 || true
            echo "===== DNS service path repair output ====="
            cat <<'PLATFORM_DNS_SERVICE_PATH_REPAIR_OUTPUT'
            kube-proxy:
            {{ platform_dns_service_path_kube_proxy_rollout.stdout | default(platform_dns_service_path_kube_proxy_delete.stdout | default('not run')) }}

            cilium:
            {{ platform_dns_service_path_cilium_rollout.stdout | default(platform_dns_service_path_cilium_state.stdout | default('not run')) }}

            coredns:
            {{ platform_dns_service_path_coredns_rollout.stdout | default('not run') }}
            PLATFORM_DNS_SERVICE_PATH_REPAIR_OUTPUT
            echo "===== kube-proxy and Cilium workloads ====="
            "$K" --kubeconfig "$C" -n kube-system get ds,pods -o wide | grep -E 'NAME|kube-proxy|cilium|coredns' || true
            echo "===== kube-proxy logs ====="
            for pod in $("$K" --kubeconfig "$C" -n kube-system get pods -o name | grep '/kube-proxy-' || true); do
              echo "--- ${pod} ---"
              "$K" --kubeconfig "$C" -n kube-system logs "${pod}" --tail=180 || true
            done
            echo "===== Cilium config ====="
            "$K" --kubeconfig "$C" -n kube-system get configmap cilium-config -o yaml 2>/dev/null || true
            echo "===== firewalld trusted zone ====="
            if command -v firewall-cmd >/dev/null 2>&1; then
              firewall-cmd --get-active-zones || true
              firewall-cmd --zone=trusted --list-all || true
              firewall-cmd --direct --get-all-rules || true
            else
              echo "firewall-cmd not found"
            fi
            echo "===== node-1 kube service routing rules ====="
            if command -v iptables-save >/dev/null 2>&1; then
              iptables-save | grep -E 'KUBE-SVC|KUBE-SEP|10[.]43[.]0[.]10|10[.]42[.]' | head -240 || true
            else
              echo "iptables-save not found"
            fi
            if command -v nft >/dev/null 2>&1; then
              nft list ruleset 2>/dev/null | grep -E 'KUBE-SVC|KUBE-SEP|10[.]43[.]0[.]10|10[.]42[.]' | head -240 || true
            fi
            echo "===== CoreDNS pods ====="
            "$K" --kubeconfig "$C" -n kube-system get pods -l k8s-app=kube-dns -o wide || true
            echo "===== CoreDNS logs ====="
            "$K" --kubeconfig "$C" -n kube-system logs -l k8s-app=kube-dns --tail=220 || true
            echo "===== CoreDNS Corefile ====="
            "$K" --kubeconfig "$C" -n kube-system get configmap {{ platform_coredns_configmap }} -o jsonpath='{.data.Corefile}' || true
            echo
            echo "===== DNS check job events ====="
            "$K" --kubeconfig "$C" -n kube-system describe job {{ platform_dns_check_job_name }} || true
          args:
            executable: /bin/bash
          register: platform_dns_diagnostics_after_failed_repair
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when: >-
            not (platform_dns_force_service_path_repair_effective | bool) and
            platform_dns_check_after.rc != 0

        - name: Stop when cluster chart repository access still fails after repair
          ansible.builtin.fail:
            msg: |
              Cluster pods still cannot reach external chart repositories after CoreDNS repair.

              The first failure was:
              {{ platform_dns_check_before.stdout }}
              {{ platform_dns_check_before.stderr }}

              The post-repair failure was:
              {{ platform_dns_check_after.stdout }}
              {{ platform_dns_check_after.stderr }}

              Post-repair CoreDNS diagnostics were:
              {{ platform_dns_diagnostics_after_failed_repair.stdout | default('not collected') }}

              DNS service path summary:
              - Default pod DNS resolution: {{ platform_dns_default_resolution_ok | default(false) }}
              - Kubernetes DNS service IP resolution: {{ platform_dns_service_ip_resolution_ok | default(false) }}
              - Direct CoreDNS endpoint resolution: {{ platform_dns_coredns_endpoint_resolution_ok | default(false) }}
              - Direct upstream DNS resolution: {{ platform_dns_direct_upstream_resolution_ok | default(false) }}

              {% if platform_dns_direct_upstream_resolution_ok | default(false) and (not (platform_dns_service_ip_resolution_ok | default(false)) or not (platform_dns_coredns_endpoint_resolution_ok | default(false))) %}
              Classification: direct upstream DNS works, but the Kubernetes DNS
              service/CoreDNS endpoint path is still inconsistent. A default
              pod lookup may occasionally succeed while Helm fails when service
              VIP load balancing chooses an unreachable CoreDNS path.
              {% elif platform_dns_default_resolution_ok | default(false) %}
              Classification: Kubernetes pod DNS is working through the normal
              resolver path. The remaining failure is chart repository access
              through the Helm check image, not CoreDNS service-path repair.
              The direct HTTPS index probe is diagnostic only; Helm repo
              add/update is the authoritative chart repository check.
              {% elif platform_dns_direct_upstream_resolution_ok | default(false) and platform_dns_coredns_endpoint_resolution_ok | default(false) and not (platform_dns_service_ip_resolution_ok | default(false)) %}
              Classification: direct upstream and CoreDNS endpoint DNS work, but
              the Kubernetes DNS service IP does not. Focus on kube-proxy service
              rules, iptables/nftables compatibility, and service VIP translation.
              {% elif platform_dns_direct_upstream_resolution_ok | default(false) and not (platform_dns_coredns_endpoint_resolution_ok | default(false)) %}
              Classification: direct upstream DNS works, but CoreDNS endpoint DNS
              does not. Focus on pod-to-pod/Cilium overlay routing between the
              check pod and CoreDNS pods.
              {% endif %}

              If normal pod DNS resolution fails while direct upstream DNS checks
              succeed, the remaining problem is cluster service or pod-to-pod
              networking, not upstream DNS. This playbook already attempted the
              automatic service-path repair: CNI sysctls, per-interface
              reverse-path filtering, firewalld overlay ports, node-peer trust,
              kube-proxy, Cilium, CoreDNS restart, CoreDNS HA placement, and
              CoreDNS service internalTrafficPolicy=Local.

              To re-run the full host preparation and retry:
              make rke2-prepare
              make platform-ingress

              If no upstream DNS checks succeed, set explicit DNS servers and retry:
              PLATFORM_DNS_UPSTREAMS="DNS_SERVER_1 DNS_SERVER_2" make platform-ingress

              If the output shows successful resolution but Helm command times
              out, fix pod egress/NAT/firewall/proxy access to the chart
              repository, or configure an internal chart mirror. To tolerate
              short Helm DNS/egress flaps while debugging:
              PLATFORM_DNS_HELM_ATTEMPTS=5 PLATFORM_DNS_HELM_TIMEOUT=60 make platform-ingress

              This playbook defaults to IPv4-only external DNS mode so Helm jobs
              do not choose unreachable public IPv6 addresses on IPv4-only networks.
              If your environment has working IPv6 egress, disable that mode with:
              PLATFORM_DNS_IPV4_ONLY=false make platform-ingress
          when: >-
            not (platform_dns_force_service_path_repair_effective | bool) and
            platform_dns_check_after.rc != 0
          run_once: true

        - name: Show repaired cluster DNS
          ansible.builtin.debug:
            msg: "Cluster DNS repair succeeded. Continuing with platform ingress."
          when: >-
            not (platform_dns_force_service_path_repair_effective | bool) and
            platform_dns_check_after.rc == 0
          run_once: true

        - name: Show forced CNI service-path recovery result
          ansible.builtin.debug:
            msg: >-
              Forced CNI service-path recovery completed: host sysctls,
              reverse-path filtering, firewalld rules, kube-proxy, and Cilium
              were reconciled without restarting CoreDNS or running the chart
              repository check.
          when: platform_dns_force_service_path_repair_effective | bool
          run_once: true
