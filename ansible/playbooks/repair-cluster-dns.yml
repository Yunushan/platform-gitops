---
- name: Verify and repair cluster DNS for platform bootstrap jobs
  hosts: rke2_servers
  become: true
  gather_facts: false
  vars:
    rke2_first_server: "{{ groups['rke2_servers'][0] }}"
    platform_dns_upstreams_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_DNS_UPSTREAMS') }}"
    platform_dns_check_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_DNS_CHECK_TIMEOUT') }}"
    platform_dns_check_image_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_DNS_CHECK_IMAGE') }}"
    platform_dns_check_repo_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_DNS_CHECK_REPO') }}"
    platform_dns_ipv4_only_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_DNS_IPV4_ONLY') }}"
    platform_dns_probe_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_DNS_PROBE_TIMEOUT') }}"
    platform_dns_upstreams_raw: "{{ platform_dns_upstreams | default(platform_dns_upstreams_from_env, true) | default('', true) }}"
    platform_dns_check_timeout_effective: "{{ platform_dns_check_timeout | default(platform_dns_check_timeout_from_env, true) | default(120, true) | int }}"
    platform_dns_probe_timeout_effective: "{{ platform_dns_probe_timeout | default(platform_dns_probe_timeout_from_env, true) | default(20, true) | int }}"
    platform_dns_check_image_effective: "{{ platform_dns_check_image | default(platform_dns_check_image_from_env, true) | default('rancher/klipper-helm:v0.10.0-build20260513', true) }}"
    platform_dns_check_repo_effective: "{{ platform_dns_check_repo | default(platform_dns_check_repo_from_env, true) | default('https://metallb.github.io/metallb', true) }}"
    platform_dns_ipv4_only_effective: "{{ platform_dns_ipv4_only | default(platform_dns_ipv4_only_from_env, true) | default(true, true) | bool }}"
    platform_dns_check_job_name: platform-dns-check
    platform_coredns_configmap: rke2-coredns-rke2-coredns
    platform_coredns_deployment: rke2-coredns-rke2-coredns
  tasks:
    - name: Read node resolver nameservers
      ansible.builtin.shell: |
        {
          for file in /etc/resolv.conf /run/systemd/resolve/resolv.conf /run/NetworkManager/no-stub-resolv.conf; do
            if [ -f "${file}" ]; then
              awk '$1 == "nameserver" { print $2 }' "${file}"
            fi
          done
          if command -v resolvectl >/dev/null 2>&1; then
            resolvectl dns 2>/dev/null | awk '{ for (i = 2; i <= NF; i++) print $i }'
          fi
          if command -v nmcli >/dev/null 2>&1; then
            nmcli -t -f IP4.DNS,IP6.DNS dev show 2>/dev/null | awk -F: '$2 != "" { print $2 }'
          fi
        } |
          awk '
            $0 !~ /^127[.]/ &&
            $0 != "::1" &&
            $0 !~ /^fe80:/ &&
            ($0 ~ /^([0-9]{1,3}[.]){3}[0-9]{1,3}$/ || $0 ~ /^[0-9A-Fa-f:]+$/) {
              print
            }
          ' |
          sort -u |
          xargs
      args:
        executable: /bin/bash
      register: platform_node_nameservers
      changed_when: false

    - name: Detect cluster DNS service IPs
      ansible.builtin.shell: |
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        "$K" --kubeconfig "$C" -n kube-system get svc -l k8s-app=kube-dns \
          -o jsonpath='{range .items[*]}{.spec.clusterIP}{" "}{end}' 2>/dev/null || true
      args:
        executable: /bin/bash
      register: platform_cluster_dns_service_ips
      changed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Build node resolver candidate lists
      ansible.builtin.set_fact:
        platform_cluster_dns_service_ips_list: "{{ (platform_cluster_dns_service_ips.stdout | default('', true)).split() | unique }}"
        platform_node_nameservers_detected_all: >-
          {{
            (groups['rke2_servers']
              | map('extract', hostvars, 'platform_node_nameservers')
              | selectattr('stdout', 'defined')
              | map(attribute='stdout')
              | join(' ')
            ).split()
              | unique
              | join(' ')
          }}
      run_once: true

    - name: Detect CoreDNS upstreams from node resolvers
      ansible.builtin.set_fact:
        platform_node_nameservers_detected: >-
          {{
            (platform_node_nameservers_detected_all.split()
              | difference(platform_cluster_dns_service_ips_list)
              | unique
              | join(' ')
            )
          }}
      run_once: true

    - name: Select CoreDNS upstreams
      ansible.builtin.set_fact:
        platform_dns_upstreams_effective: >-
          {{
            ((platform_dns_upstreams_raw | trim | length) > 0)
            | ternary(platform_dns_upstreams_raw | regex_replace(',', ' '), platform_node_nameservers_detected)
            | trim
            | regex_replace('\s+', ' ')
          }}
      run_once: true

    - name: Require DNS upstreams for repair fallback
      ansible.builtin.assert:
        that:
          - (platform_dns_check_timeout_effective | int) > 0
          - (platform_dns_probe_timeout_effective | int) > 0
          - (platform_dns_probe_timeout_effective | int) < (platform_dns_check_timeout_effective | int)
          - platform_dns_check_image_effective | length > 0
          - platform_dns_check_repo_effective | length > 0
          - platform_dns_upstreams_effective | length > 0
          - (platform_dns_upstreams_effective.split() | intersect(platform_cluster_dns_service_ips_list) | length) == 0
        fail_msg: >-
          Could not auto-detect valid non-cluster DNS upstreams from node resolver configuration.
          Detected node resolver candidates were: {{ platform_node_nameservers_detected_all | default('') }}.
          Ignored Kubernetes DNS service IPs were: {{ platform_cluster_dns_service_ips_list | default([]) | join(' ') }}.
          Set PLATFORM_DNS_UPSTREAMS, for example:
          PLATFORM_DNS_UPSTREAMS="DNS_SERVER_1 DNS_SERVER_2" make platform-ingress
      run_once: true

    - name: Show cluster DNS check settings
      ansible.builtin.debug:
        msg: >-
          Checking pod DNS with {{ platform_dns_check_image_effective }} against
          {{ platform_dns_check_repo_effective }}. CoreDNS repair upstreams are:
          {{ platform_dns_upstreams_effective }}. IPv4-only external DNS mode:
          {{ platform_dns_ipv4_only_effective | bool }}. Per-probe timeout:
          {{ platform_dns_probe_timeout_effective }}s. Ignored Kubernetes DNS
          service IPs: {{ platform_cluster_dns_service_ips_list | join(' ') }}.
      run_once: true

    - name: Run cluster DNS check before repair
      ansible.builtin.shell: |
        set -e -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        JOB={{ platform_dns_check_job_name }}
        "$K" --kubeconfig "$C" -n kube-system delete job "${JOB}" --ignore-not-found=true >/dev/null 2>&1 || true
        "$K" --kubeconfig "$C" -n kube-system apply -f -
        deadline=$((SECONDS + {{ platform_dns_check_timeout_effective }}))
        while [ "${SECONDS}" -lt "${deadline}" ]; do
          succeeded="$("$K" --kubeconfig "$C" -n kube-system get job "${JOB}" -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"
          failed="$("$K" --kubeconfig "$C" -n kube-system get job "${JOB}" -o jsonpath='{.status.failed}' 2>/dev/null || true)"
          if [ "${succeeded}" = "1" ]; then
            "$K" --kubeconfig "$C" -n kube-system logs -l job-name="${JOB}" --tail=120 || true
            exit 0
          fi
          if [ -n "${failed}" ] && [ "${failed}" != "0" ]; then
            "$K" --kubeconfig "$C" -n kube-system logs -l job-name="${JOB}" --tail=120 || true
            exit 1
          fi
          sleep 5
        done
        "$K" --kubeconfig "$C" -n kube-system logs -l job-name="${JOB}" --tail=120 || true
        exit 1
      args:
        executable: /bin/bash
        stdin: |
          ---
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: {{ platform_dns_check_job_name }}
            namespace: kube-system
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: {{ platform_dns_check_timeout_effective }}
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                nodeSelector:
                  kubernetes.io/os: linux
                containers:
                  - name: helm
                    image: {{ platform_dns_check_image_effective }}
                    imagePullPolicy: IfNotPresent
                    command:
                      - sh
                      - -c
                    args:
                      - |
                        set -ex
                        REPO_URL='{{ platform_dns_check_repo_effective }}'
                        REPO_INDEX="${REPO_URL%/}/index.yaml"
                        REPO_HOST="$(printf '%s' "${REPO_URL}" | sed -E 's#^https?://([^/]+).*#\1#')"
                        PROBE_TIMEOUT={{ platform_dns_probe_timeout_effective }}
                        run_bounded() {
                          seconds="$1"
                          shift
                          if command -v timeout >/dev/null 2>&1; then
                            timeout "${seconds}" "$@"
                          else
                            "$@"
                          fi
                        }
                        echo "===== pod resolver ====="
                        cat /etc/resolv.conf
                        echo "===== repository host ====="
                        printf '%s\n' "${REPO_HOST}"
                        echo "===== IPv4 resolution ====="
                        (getent ahostsv4 "${REPO_HOST}" || nslookup "${REPO_HOST}" || true)
                        echo "===== IPv6 resolution ====="
                        (getent ahostsv6 "${REPO_HOST}" || true)
                        echo "===== repository HTTPS index probe ====="
                        if command -v curl >/dev/null 2>&1; then
                          run_bounded "${PROBE_TIMEOUT}" curl --fail --silent --show-error --location \
                            --connect-timeout "${PROBE_TIMEOUT}" --max-time "${PROBE_TIMEOUT}" \
                            --output /dev/null "${REPO_INDEX}" || {
                              rc="$?"
                              echo "Repository HTTPS index probe failed or timed out after ${PROBE_TIMEOUT}s with rc=${rc}" >&2
                              exit "${rc}"
                            }
                        elif command -v wget >/dev/null 2>&1; then
                          run_bounded "${PROBE_TIMEOUT}" wget -S -T "${PROBE_TIMEOUT}" \
                            -O /dev/null "${REPO_INDEX}" || {
                              rc="$?"
                              echo "Repository HTTPS index probe failed or timed out after ${PROBE_TIMEOUT}s with rc=${rc}" >&2
                              exit "${rc}"
                            }
                        else
                          echo "No curl or wget found in check image; skipping direct HTTPS index probe."
                        fi
                        echo "===== helm repo add ====="
                        run_bounded "${PROBE_TIMEOUT}" helm repo add platform-dns-check "${REPO_URL}" || {
                          rc="$?"
                          echo "helm repo add failed or timed out after ${PROBE_TIMEOUT}s with rc=${rc}" >&2
                          exit "${rc}"
                        }
                        run_bounded "${PROBE_TIMEOUT}" helm repo update || {
                          rc="$?"
                          echo "helm repo update failed or timed out after ${PROBE_TIMEOUT}s with rc=${rc}" >&2
                          exit "${rc}"
                        }
      register: platform_dns_check_before
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Show healthy cluster DNS
      ansible.builtin.debug:
        msg: "Cluster DNS already resolves external chart repositories from pods."
      when: platform_dns_check_before.rc == 0
      run_once: true

    - name: Repair CoreDNS upstreams when pod DNS check fails
      when: platform_dns_check_before.rc != 0
      block:
        - name: Collect cluster DNS diagnostics before repair
          ansible.builtin.shell: |
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            echo "===== DNS check job logs ====="
            "$K" --kubeconfig "$C" -n kube-system logs -l job-name={{ platform_dns_check_job_name }} --tail=160 || true
            echo "===== CoreDNS service/endpoints ====="
            "$K" --kubeconfig "$C" -n kube-system get svc,endpoints,endpointslice -l k8s-app=kube-dns -o wide || true
            "$K" --kubeconfig "$C" -n kube-system get svc,endpoints,endpointslice | grep -E 'coredns|kube-dns|NAME' || true
            echo "===== CoreDNS pods ====="
            "$K" --kubeconfig "$C" -n kube-system get pods -l k8s-app=kube-dns -o wide || true
            echo "===== CoreDNS logs ====="
            "$K" --kubeconfig "$C" -n kube-system logs -l k8s-app=kube-dns --tail=160 || true
            echo "===== CoreDNS Corefile ====="
            "$K" --kubeconfig "$C" -n kube-system get configmap {{ platform_coredns_configmap }} -o jsonpath='{.data.Corefile}' || true
            echo
          args:
            executable: /bin/bash
          register: platform_dns_diagnostics_before_repair
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Print cluster DNS diagnostics before repair
          ansible.builtin.debug:
            var: platform_dns_diagnostics_before_repair.stdout_lines
          run_once: true

        - name: Apply CoreDNS repair with rollback guard
          block:
            - name: Back up current CoreDNS ConfigMap
              ansible.builtin.shell: |
                set -e -o pipefail
                K=/var/lib/rancher/rke2/bin/kubectl
                C=/etc/rancher/rke2/rke2.yaml
                "$K" --kubeconfig "$C" -n kube-system get configmap {{ platform_coredns_configmap }} \
                  -o yaml >/tmp/platform-coredns-before-repair.yaml
              args:
                executable: /bin/bash
              changed_when: false
              delegate_to: "{{ rke2_first_server }}"
              run_once: true

            - name: Patch CoreDNS forward upstreams
              ansible.builtin.shell: |
                set -e -o pipefail
                K=/var/lib/rancher/rke2/bin/kubectl
                C=/etc/rancher/rke2/rke2.yaml
                UPSTREAMS="{{ platform_dns_upstreams_effective }}"
                cat >/tmp/platform-coredns-patch.yaml <<EOF
                data:
                  Corefile: |
                    .:53 {
                        errors
                        health
                        ready
                        kubernetes cluster.local cluster.local in-addr.arpa ip6.arpa {
                          pods insecure
                          fallthrough in-addr.arpa ip6.arpa
                        }
                        hosts /etc/coredns/NodeHosts {
                          ttl 60
                          reload 15s
                          fallthrough
                        }
                        prometheus :9153
                {% if platform_dns_ipv4_only_effective | bool %}
                        template IN AAAA . {
                          rcode NOERROR
                        }
                {% endif %}
                        forward . ${UPSTREAMS} {
                          max_concurrent 1000
                        }
                        cache 30
                        loop
                        reload
                        loadbalance
                        import /etc/coredns/custom/*.override
                    }
                    import /etc/coredns/custom/*.server
                EOF
                "$K" --kubeconfig "$C" -n kube-system patch configmap {{ platform_coredns_configmap }} \
                  --type merge --patch-file /tmp/platform-coredns-patch.yaml
              args:
                executable: /bin/bash
              register: platform_coredns_patch
              changed_when: "'patched' in platform_coredns_patch.stdout"
              delegate_to: "{{ rke2_first_server }}"
              run_once: true

            - name: Restart CoreDNS
              ansible.builtin.command: >-
                /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
                -n kube-system rollout restart deployment/{{ platform_coredns_deployment }}
              register: platform_coredns_restart
              changed_when: "'restarted' in platform_coredns_restart.stdout"
              delegate_to: "{{ rke2_first_server }}"
              run_once: true

            - name: Wait for CoreDNS rollout
              ansible.builtin.command: >-
                /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
                -n kube-system rollout status deployment/{{ platform_coredns_deployment }} --timeout=10s
              register: platform_coredns_rollout
              retries: 30
              delay: 10
              until: platform_coredns_rollout.rc == 0
              changed_when: false
              delegate_to: "{{ rke2_first_server }}"
              run_once: true
          rescue:
            - name: Roll back CoreDNS ConfigMap after failed repair rollout
              ansible.builtin.shell: |
                K=/var/lib/rancher/rke2/bin/kubectl
                C=/etc/rancher/rke2/rke2.yaml
                if [ -f /tmp/platform-coredns-before-repair.yaml ]; then
                  "$K" --kubeconfig "$C" apply -f /tmp/platform-coredns-before-repair.yaml || true
                  "$K" --kubeconfig "$C" -n kube-system rollout restart deployment/{{ platform_coredns_deployment }} || true
                  "$K" --kubeconfig "$C" -n kube-system rollout status deployment/{{ platform_coredns_deployment }} --timeout=120s || true
                fi
              args:
                executable: /bin/bash
              changed_when: true
              delegate_to: "{{ rke2_first_server }}"
              run_once: true

            - name: Stop after failed CoreDNS repair rollout
              ansible.builtin.fail:
                msg: >-
                  CoreDNS repair did not roll out cleanly, so the previous
                  CoreDNS ConfigMap was restored. Review CoreDNS diagnostics
                  above before retrying.
              run_once: true

        - name: Run cluster DNS check after repair
          ansible.builtin.shell: |
            set -e -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            JOB={{ platform_dns_check_job_name }}
            "$K" --kubeconfig "$C" -n kube-system delete job "${JOB}" --ignore-not-found=true >/dev/null 2>&1 || true
            "$K" --kubeconfig "$C" -n kube-system apply -f -
            deadline=$((SECONDS + {{ platform_dns_check_timeout_effective }}))
            while [ "${SECONDS}" -lt "${deadline}" ]; do
              succeeded="$("$K" --kubeconfig "$C" -n kube-system get job "${JOB}" -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"
              failed="$("$K" --kubeconfig "$C" -n kube-system get job "${JOB}" -o jsonpath='{.status.failed}' 2>/dev/null || true)"
              if [ "${succeeded}" = "1" ]; then
                "$K" --kubeconfig "$C" -n kube-system logs -l job-name="${JOB}" --tail=120 || true
                exit 0
              fi
              if [ -n "${failed}" ] && [ "${failed}" != "0" ]; then
                "$K" --kubeconfig "$C" -n kube-system logs -l job-name="${JOB}" --tail=120 || true
                exit 1
              fi
              sleep 5
            done
            "$K" --kubeconfig "$C" -n kube-system logs -l job-name="${JOB}" --tail=120 || true
            exit 1
          args:
            executable: /bin/bash
            stdin: |
              ---
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: {{ platform_dns_check_job_name }}
                namespace: kube-system
              spec:
                backoffLimit: 0
                activeDeadlineSeconds: {{ platform_dns_check_timeout_effective }}
                ttlSecondsAfterFinished: 300
                template:
                  spec:
                    restartPolicy: Never
                    nodeSelector:
                      kubernetes.io/os: linux
                    containers:
                      - name: helm
                        image: {{ platform_dns_check_image_effective }}
                        imagePullPolicy: IfNotPresent
                        command:
                          - sh
                          - -c
                        args:
                          - |
                            set -ex
                            REPO_URL='{{ platform_dns_check_repo_effective }}'
                            REPO_INDEX="${REPO_URL%/}/index.yaml"
                            REPO_HOST="$(printf '%s' "${REPO_URL}" | sed -E 's#^https?://([^/]+).*#\1#')"
                            PROBE_TIMEOUT={{ platform_dns_probe_timeout_effective }}
                            run_bounded() {
                              seconds="$1"
                              shift
                              if command -v timeout >/dev/null 2>&1; then
                                timeout "${seconds}" "$@"
                              else
                                "$@"
                              fi
                            }
                            echo "===== pod resolver ====="
                            cat /etc/resolv.conf
                            echo "===== repository host ====="
                            printf '%s\n' "${REPO_HOST}"
                            echo "===== IPv4 resolution ====="
                            (getent ahostsv4 "${REPO_HOST}" || nslookup "${REPO_HOST}" || true)
                            echo "===== IPv6 resolution ====="
                            (getent ahostsv6 "${REPO_HOST}" || true)
                            echo "===== repository HTTPS index probe ====="
                            if command -v curl >/dev/null 2>&1; then
                              run_bounded "${PROBE_TIMEOUT}" curl --fail --silent --show-error --location \
                                --connect-timeout "${PROBE_TIMEOUT}" --max-time "${PROBE_TIMEOUT}" \
                                --output /dev/null "${REPO_INDEX}" || {
                                  rc="$?"
                                  echo "Repository HTTPS index probe failed or timed out after ${PROBE_TIMEOUT}s with rc=${rc}" >&2
                                  exit "${rc}"
                                }
                            elif command -v wget >/dev/null 2>&1; then
                              run_bounded "${PROBE_TIMEOUT}" wget -S -T "${PROBE_TIMEOUT}" \
                                -O /dev/null "${REPO_INDEX}" || {
                                  rc="$?"
                                  echo "Repository HTTPS index probe failed or timed out after ${PROBE_TIMEOUT}s with rc=${rc}" >&2
                                  exit "${rc}"
                                }
                            else
                              echo "No curl or wget found in check image; skipping direct HTTPS index probe."
                            fi
                            echo "===== helm repo add ====="
                            run_bounded "${PROBE_TIMEOUT}" helm repo add platform-dns-check "${REPO_URL}" || {
                              rc="$?"
                              echo "helm repo add failed or timed out after ${PROBE_TIMEOUT}s with rc=${rc}" >&2
                              exit "${rc}"
                            }
                            run_bounded "${PROBE_TIMEOUT}" helm repo update || {
                              rc="$?"
                              echo "helm repo update failed or timed out after ${PROBE_TIMEOUT}s with rc=${rc}" >&2
                              exit "${rc}"
                            }
          register: platform_dns_check_after
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Stop when cluster DNS still fails after repair
          ansible.builtin.fail:
            msg: |
              Cluster pods still cannot reach external chart repositories after CoreDNS repair.

              The first failure was:
              {{ platform_dns_check_before.stdout }}
              {{ platform_dns_check_before.stderr }}

              The post-repair failure was:
              {{ platform_dns_check_after.stdout }}
              {{ platform_dns_check_after.stderr }}

              Set explicit DNS servers and retry:
              PLATFORM_DNS_UPSTREAMS="DNS_SERVER_1 DNS_SERVER_2" make platform-ingress

              If the output shows successful resolution but the HTTPS index probe
              or Helm command times out, fix pod egress/NAT/firewall/proxy access
              to the chart repository, or configure an internal chart mirror.

              This playbook defaults to IPv4-only external DNS mode so Helm jobs
              do not choose unreachable public IPv6 addresses on IPv4-only networks.
              If your environment has working IPv6 egress, disable that mode with:
              PLATFORM_DNS_IPV4_ONLY=false make platform-ingress
          when: platform_dns_check_after.rc != 0
          run_once: true

        - name: Show repaired cluster DNS
          ansible.builtin.debug:
            msg: "Cluster DNS repair succeeded. Continuing with platform ingress."
          when: platform_dns_check_after.rc == 0
          run_once: true
