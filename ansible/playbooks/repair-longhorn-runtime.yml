---
- name: Repair Longhorn manager and CSI runtime without storage capacity gates
  hosts: rke2_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    rke2_first_server: "{{ groups['rke2_servers'][0] }}"
    platform_longhorn_runtime_repair_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_LONGHORN_RUNTIME_REPAIR_TIMEOUT') }}"
    platform_longhorn_runtime_force_restart_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_LONGHORN_RUNTIME_FORCE_RESTART') }}"
    platform_longhorn_runtime_stale_replica_repair_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_LONGHORN_RUNTIME_STALE_REPLICA_REPAIR') }}"
    platform_longhorn_runtime_empty_unscheduled_replica_repair_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_LONGHORN_RUNTIME_EMPTY_UNSCHEDULED_REPLICA_REPAIR') }}"
    platform_longhorn_runtime_empty_faulted_claim_repair_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_LONGHORN_RUNTIME_EMPTY_FAULTED_CLAIM_REPAIR') }}"
    platform_longhorn_runtime_repair_timeout_effective: "{{ platform_longhorn_runtime_repair_timeout | default(platform_longhorn_runtime_repair_timeout_from_env, true) | default(300, true) | int }}"
    platform_longhorn_runtime_force_restart_effective: "{{ platform_longhorn_runtime_force_restart | default(platform_longhorn_runtime_force_restart_from_env, true) | default(false, true) | bool }}"
    platform_longhorn_runtime_stale_replica_repair_effective: "{{ platform_longhorn_runtime_stale_replica_repair | default(platform_longhorn_runtime_stale_replica_repair_from_env, true) | default(true, true) | bool }}"
    platform_longhorn_runtime_empty_unscheduled_replica_repair_effective: "{{ platform_longhorn_runtime_empty_unscheduled_replica_repair | default(platform_longhorn_runtime_empty_unscheduled_replica_repair_from_env, true) | default(true, true) | bool }}"
    platform_longhorn_runtime_empty_faulted_claim_repair_effective: "{{ platform_longhorn_runtime_empty_faulted_claim_repair | default(platform_longhorn_runtime_empty_faulted_claim_repair_from_env, true) | default(true, true) | bool }}"
  tasks:
    - name: Repair unhealthy Longhorn manager and CSI registration
      ansible.builtin.shell: |
        set -o pipefail
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        TIMEOUT={{ platform_longhorn_runtime_repair_timeout_effective }}
        FORCE_RESTART="{{ 'true' if platform_longhorn_runtime_force_restart_effective else 'false' }}"

        diagnose() {
          echo "===== Longhorn runtime diagnostics =====" >&2
          "$K" --kubeconfig "$C" -n longhorn-system get daemonset/longhorn-manager daemonset/longhorn-csi-plugin deployment/longhorn-driver-deployer -o wide >&2 || true
          "$K" --kubeconfig "$C" -n longhorn-system get pods -o wide >&2 || true
          "$K" --kubeconfig "$C" get csinode -o custom-columns='NAME:.metadata.name,DRIVERS:.spec.drivers[*].name' >&2 || true
        }

        daemonset_counts() {
          "$K" --kubeconfig "$C" -n longhorn-system get "daemonset/$1" \
            -o jsonpath='{.status.desiredNumberScheduled} {.status.numberReady}' 2>/dev/null || true
        }

        deployment_counts() {
          "$K" --kubeconfig "$C" -n longhorn-system get "deployment/$1" \
            -o jsonpath='{.spec.replicas} {.status.availableReplicas}' 2>/dev/null || true
        }

        missing_csi_nodes() {
          for node in $("$K" --kubeconfig "$C" get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null); do
            if ! "$K" --kubeconfig "$C" get "csinode/${node}" \
                -o jsonpath='{range .spec.drivers[*]}{.name}{"\n"}{end}' 2>/dev/null |
                grep -Fx 'driver.longhorn.io' >/dev/null; then
              printf '%s\n' "${node}"
            fi
          done
        }

        wait_for_csi_daemonset() {
          deadline=$(( $(date +%s) + TIMEOUT ))
          while [ "$(date +%s)" -lt "${deadline}" ]; do
            if "$K" --kubeconfig "$C" -n longhorn-system get daemonset/longhorn-csi-plugin >/dev/null 2>&1; then
              return 0
            fi
            sleep 5
          done
          return 1
        }

        wait_for_csi_registration() {
          deadline=$(( $(date +%s) + TIMEOUT ))
          while [ "$(date +%s)" -lt "${deadline}" ]; do
            missing="$(missing_csi_nodes | xargs)"
            if [ -z "${missing}" ]; then
              return 0
            fi
            echo "longhorn_csi_registration=waiting missing_nodes=${missing}"
            sleep 5
          done
          return 1
        }

        if ! "$K" --kubeconfig "$C" get namespace/longhorn-system >/dev/null 2>&1; then
          echo "result=fail reason=longhorn-namespace-absent" >&2
          exit 1
        fi
        if ! "$K" --kubeconfig "$C" -n longhorn-system get daemonset/longhorn-manager >/dev/null 2>&1; then
          echo "result=fail reason=longhorn-manager-daemonset-absent" >&2
          diagnose
          exit 1
        fi

        read -r manager_desired manager_ready <<<"$(daemonset_counts longhorn-manager)"
        manager_desired="${manager_desired:-0}"
        manager_ready="${manager_ready:-0}"
        manager_restarted=false
        if [ "${FORCE_RESTART}" = "true" ] || [ "${manager_desired}" -eq 0 ] || [ "${manager_ready}" -lt "${manager_desired}" ]; then
          echo "action=rollout-restart-longhorn-manager ready=${manager_ready}/${manager_desired}"
          "$K" --kubeconfig "$C" -n longhorn-system rollout restart daemonset/longhorn-manager
          manager_restarted=true
        fi

        driver_restarted=false
        if "$K" --kubeconfig "$C" -n longhorn-system get deployment/longhorn-driver-deployer >/dev/null 2>&1; then
          read -r driver_desired driver_ready <<<"$(deployment_counts longhorn-driver-deployer)"
          driver_desired="${driver_desired:-0}"
          driver_ready="${driver_ready:-0}"
          if [ "${FORCE_RESTART}" = "true" ] || [ "${driver_desired}" -eq 0 ] || [ "${driver_ready}" -lt "${driver_desired}" ] ||
            ! "$K" --kubeconfig "$C" -n longhorn-system get daemonset/longhorn-csi-plugin >/dev/null 2>&1; then
            echo "action=rollout-restart-longhorn-driver-deployer ready=${driver_ready}/${driver_desired}"
            "$K" --kubeconfig "$C" -n longhorn-system rollout restart deployment/longhorn-driver-deployer
            driver_restarted=true
          fi
        fi

        if [ "${manager_restarted}" = "true" ]; then
          if ! "$K" --kubeconfig "$C" -n longhorn-system rollout status daemonset/longhorn-manager --timeout="${TIMEOUT}s"; then
            echo "result=fail reason=longhorn-manager-rollout-timeout" >&2
            diagnose
            exit 1
          fi
        fi
        if [ "${driver_restarted}" = "true" ]; then
          if ! "$K" --kubeconfig "$C" -n longhorn-system rollout status deployment/longhorn-driver-deployer --timeout="${TIMEOUT}s"; then
            echo "result=fail reason=longhorn-driver-deployer-rollout-timeout" >&2
            diagnose
            exit 1
          fi
        fi

        if ! wait_for_csi_daemonset; then
          echo "result=fail reason=longhorn-csi-plugin-daemonset-absent" >&2
          diagnose
          exit 1
        fi

        read -r csi_desired csi_ready <<<"$(daemonset_counts longhorn-csi-plugin)"
        csi_desired="${csi_desired:-0}"
        csi_ready="${csi_ready:-0}"
        missing_nodes="$(missing_csi_nodes | xargs)"
        if [ "${FORCE_RESTART}" = "true" ] || [ "${csi_desired}" -eq 0 ] || [ "${csi_ready}" -lt "${csi_desired}" ] || [ -n "${missing_nodes}" ]; then
          echo "action=rollout-restart-longhorn-csi-plugin ready=${csi_ready}/${csi_desired} missing_registrations=${missing_nodes:-none}"
          "$K" --kubeconfig "$C" -n longhorn-system rollout restart daemonset/longhorn-csi-plugin
          if ! "$K" --kubeconfig "$C" -n longhorn-system rollout status daemonset/longhorn-csi-plugin --timeout="${TIMEOUT}s"; then
            echo "result=fail reason=longhorn-csi-plugin-rollout-timeout" >&2
            diagnose
            exit 1
          fi
        fi

        if [ "${FORCE_RESTART}" = "true" ]; then
          for controller in csi-attacher csi-provisioner csi-resizer csi-snapshotter; do
            if ! "$K" --kubeconfig "$C" -n longhorn-system get "deployment/${controller}" >/dev/null 2>&1; then
              continue
            fi
            echo "action=rollout-restart-longhorn-${controller}"
            "$K" --kubeconfig "$C" -n longhorn-system rollout restart "deployment/${controller}"
            if ! "$K" --kubeconfig "$C" -n longhorn-system rollout status \
              "deployment/${controller}" --timeout="${TIMEOUT}s"; then
              echo "result=fail reason=longhorn-${controller}-rollout-timeout" >&2
              diagnose
              exit 1
            fi
          done
        fi

        if ! wait_for_csi_registration; then
          echo "result=fail reason=longhorn-csi-registration-timeout missing_nodes=$(missing_csi_nodes | xargs)" >&2
          diagnose
          exit 1
        fi

        read -r manager_desired manager_ready <<<"$(daemonset_counts longhorn-manager)"
        read -r csi_desired csi_ready <<<"$(daemonset_counts longhorn-csi-plugin)"
        if [ "${manager_desired:-0}" -eq 0 ] || [ "${manager_ready:-0}" -lt "${manager_desired:-0}" ] ||
          [ "${csi_desired:-0}" -eq 0 ] || [ "${csi_ready:-0}" -lt "${csi_desired:-0}" ]; then
          echo "result=fail reason=longhorn-runtime-not-ready manager=${manager_ready:-0}/${manager_desired:-0} csi=${csi_ready:-0}/${csi_desired:-0}" >&2
          diagnose
          exit 1
        fi

        echo "result=ok longhorn_manager=${manager_ready}/${manager_desired} longhorn_csi=${csi_ready}/${csi_desired} csi_registrations=all-nodes"
      args:
        executable: /bin/bash
      register: platform_longhorn_runtime_repair
      changed_when: "'action=rollout-restart-' in platform_longhorn_runtime_repair.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Remove only empty duplicate Longhorn disk registrations
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml

        "$K" --kubeconfig "$C" -n longhorn-system get nodes.longhorn.io -o json |
          python3 -c '
        import json
        import re
        import subprocess
        import sys
        import time

        data = json.load(sys.stdin)

        def kubectl_patch(node, patch):
            return subprocess.run(
                [
                    "/var/lib/rancher/rke2/bin/kubectl",
                    "--kubeconfig",
                    "/etc/rancher/rke2/rke2.yaml",
                    "-n",
                    "longhorn-system",
                    "patch",
                    f"nodes.longhorn.io/{node}",
                    "--type=merge",
                    "-p",
                    json.dumps(patch),
                ],
                text=True,
                capture_output=True,
            )


        def kubectl_get_node(node):
            result = subprocess.run(
                [
                    "/var/lib/rancher/rke2/bin/kubectl",
                    "--kubeconfig",
                    "/etc/rancher/rke2/rke2.yaml",
                    "-n",
                    "longhorn-system",
                    "get",
                    f"nodes.longhorn.io/{node}",
                    "-o",
                    "json",
                ],
                text=True,
                capture_output=True,
            )
            if result.returncode != 0:
                return None, result
            return json.loads(result.stdout), result


        for item in data.get("items", []):
            node = item.get("metadata", {}).get("name", "")
            spec_disks = item.get("spec", {}).get("disks") or {}
            status_disks = item.get("status", {}).get("diskStatus") or {}
            if len(spec_disks) <= 1:
                continue

            duplicate_names = set()
            for disk_name, status in status_disks.items():
                conditions = status.get("conditions") or []
                for condition in conditions:
                    message = condition.get("message") or ""
                    duplicate = (
                        condition.get("type") == "Ready"
                        and condition.get("status") == "False"
                        and (
                            condition.get("reason") == "DiskFilesystemChanged"
                            or "same file system ID" in message
                        )
                    )
                    if not duplicate:
                        continue
                    duplicate_names.add(disk_name)
                    for group in re.findall(r"\[([^\]]+)\]", message):
                        duplicate_names.update(
                            candidate
                            for candidate in group.split()
                            if candidate in spec_disks
                        )

            candidates = sorted(
                disk_name
                for disk_name in duplicate_names
                if disk_name in spec_disks and disk_name != "default-disk"
            )
            if "default-disk" in duplicate_names:
                print(
                    f"longhorn_duplicate_disk={node}/default-disk action=retain "
                    "reason=managed-default-disk"
                )

            for disk_name in candidates:
                status = status_disks.get(disk_name) or {}
                scheduled_replicas = status.get("scheduledReplica") or {}
                scheduled_backing_images = status.get("scheduledBackingImage") or {}
                storage_scheduled = int(status.get("storageScheduled") or 0)
                if (
                    scheduled_replicas
                    or scheduled_backing_images
                    or storage_scheduled > 0
                ):
                    print(
                        f"longhorn_duplicate_disk={node}/{disk_name} action=retain "
                        f"reason=scheduled-data-present "
                        f"replicas={len(scheduled_replicas)} "
                        f"backingImages={len(scheduled_backing_images)} "
                        f"storageScheduled={storage_scheduled}"
                    )
                    continue

                path = spec_disks[disk_name].get("path", "")
                if spec_disks[disk_name].get("allowScheduling", False):
                    result = kubectl_patch(
                        node,
                        {"spec": {"disks": {disk_name: {"allowScheduling": False}}}},
                    )
                    if result.returncode != 0:
                        sys.stderr.write((result.stderr or "") + (result.stdout or ""))
                        raise SystemExit(result.returncode)
                    print(
                        f"longhorn_duplicate_disk={node}/{disk_name} path={path} "
                        "action=disable-empty-duplicate"
                    )
                    time.sleep(3)

                removed = False
                last_error = ""
                for _ in range(12):
                    result = kubectl_patch(
                        node,
                        {"spec": {"disks": {disk_name: None}}},
                    )
                    refreshed, get_result = kubectl_get_node(node)
                    if refreshed is not None and disk_name not in (
                        refreshed.get("spec", {}).get("disks") or {}
                    ):
                        removed = True
                        break
                    last_error = (
                        (result.stderr or "")
                        + (result.stdout or "")
                        + (get_result.stderr or "")
                    )
                    time.sleep(5)

                if removed:
                    print(
                        f"longhorn_duplicate_disk={node}/{disk_name} path={path} "
                        "action=remove-empty-duplicate"
                    )
                else:
                    print(
                        f"longhorn_duplicate_disk={node}/{disk_name} path={path} "
                        "action=fail reason=empty-duplicate-removal-timeout"
                    )
                    if last_error:
                        sys.stderr.write(last_error)
                    raise SystemExit(1)

            if duplicate_names and not candidates:
                print(
                    f"longhorn_duplicate_disk={node} action=retain "
                    f"reason=no-safe-non-default-removal-candidate "
                    f"disks={sorted(duplicate_names)}"
                )
        '
      args:
        executable: /bin/bash
      register: platform_longhorn_duplicate_runtime_repair
      changed_when: >-
        'action=disable-empty-duplicate' in platform_longhorn_duplicate_runtime_repair.stdout or
        'action=remove-empty-duplicate' in platform_longhorn_duplicate_runtime_repair.stdout
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Remove stopped Longhorn replicas whose registered disk no longer exists
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml

        "$K" --kubeconfig "$C" -n longhorn-system get nodes.longhorn.io -o json |
          python3 -c '
        import json
        import subprocess
        import sys

        kubectl = [
            "/var/lib/rancher/rke2/bin/kubectl",
            "--kubeconfig",
            "/etc/rancher/rke2/rke2.yaml",
            "-n",
            "longhorn-system",
        ]


        def get_json(resource):
            result = subprocess.run(
                kubectl + ["get", resource, "-o", "json"],
                text=True,
                capture_output=True,
            )
            if result.returncode != 0:
                sys.stderr.write((result.stderr or "") + (result.stdout or ""))
                raise SystemExit(result.returncode)
            return json.loads(result.stdout)


        nodes = json.load(sys.stdin).get("items", [])
        valid_disk_ids = {
            disk.get("diskUUID")
            for node in nodes
            for disk in (node.get("status", {}).get("diskStatus") or {}).values()
            if disk.get("diskUUID")
        }
        replicas = get_json("replicas.longhorn.io").get("items", [])
        volumes = {
            volume.get("metadata", {}).get("name", ""): volume
            for volume in get_json("volumes.longhorn.io").get("items", [])
        }
        by_volume = {}
        for replica in replicas:
            volume_name = replica.get("spec", {}).get("volumeName", "")
            if volume_name:
                by_volume.setdefault(volume_name, []).append(replica)

        for volume_name, volume_replicas in sorted(by_volume.items()):
            volume = volumes.get(volume_name)
            if not volume or volume.get("metadata", {}).get("deletionTimestamp"):
                continue

            healthy_peers = [
                replica
                for replica in volume_replicas
                if replica.get("spec", {}).get("diskID") in valid_disk_ids
                and replica.get("status", {}).get("currentState") == "running"
                and replica.get("spec", {}).get("healthyAt")
                and not replica.get("spec", {}).get("failedAt")
                and not replica.get("metadata", {}).get("deletionTimestamp")
            ]
            if len(healthy_peers) < 2:
                continue

            stale_replicas = [
                replica
                for replica in volume_replicas
                if replica.get("spec", {}).get("diskID")
                and replica.get("spec", {}).get("diskID") not in valid_disk_ids
                and replica.get("status", {}).get("currentState") != "running"
                and not replica.get("metadata", {}).get("deletionTimestamp")
            ]
            for replica in stale_replicas:
                replica_name = replica.get("metadata", {}).get("name", "")
                result = subprocess.run(
                    kubectl
                    + [
                        "delete",
                        f"replicas.longhorn.io/{replica_name}",
                        "--wait=false",
                    ],
                    text=True,
                    capture_output=True,
                )
                if result.returncode != 0:
                    sys.stderr.write((result.stderr or "") + (result.stdout or ""))
                    raise SystemExit(result.returncode)
                print(
                    f"longhorn_stale_replica={replica_name} volume={volume_name} "
                    f"action=remove-invalid-disk-reference healthyPeers={len(healthy_peers)}"
                )
        '
      args:
        executable: /bin/bash
      register: platform_longhorn_stale_replica_repair
      changed_when: "'action=remove-invalid-disk-reference' in platform_longhorn_stale_replica_repair.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      when: platform_longhorn_runtime_stale_replica_repair_effective | bool

    - name: Reset zero-byte unscheduled Longhorn replica placeholders
      ansible.builtin.shell: |
        set -o pipefail
        python3 - "{{ platform_longhorn_runtime_repair_timeout_effective }}" <<'PY'
        import json
        import subprocess
        import sys
        import time

        timeout_seconds = int(sys.argv[1])
        kubectl = [
            "/var/lib/rancher/rke2/bin/kubectl",
            "--kubeconfig",
            "/etc/rancher/rke2/rke2.yaml",
        ]


        def run(*args):
            result = subprocess.run(
                kubectl + list(args),
                text=True,
                capture_output=True,
            )
            if result.returncode != 0:
                sys.stderr.write((result.stderr or "") + (result.stdout or ""))
                raise SystemExit(result.returncode)
            return result.stdout


        def get_json(*args):
            return json.loads(run(*args, "-o", "json"))


        def delete_if_present(*args):
            result = subprocess.run(
                kubectl + ["delete", *args, "--wait=false"],
                text=True,
                capture_output=True,
            )
            if result.returncode != 0 and "NotFound" not in (result.stderr or ""):
                sys.stderr.write((result.stderr or "") + (result.stdout or ""))
                raise SystemExit(result.returncode)


        def pod_uses_claim(pod, claim_name):
            return any(
                volume.get("persistentVolumeClaim", {}).get("claimName") == claim_name
                for volume in pod.get("spec", {}).get("volumes", [])
            )


        def pod_is_ready(pod):
            statuses = pod.get("status", {}).get("containerStatuses", [])
            return (
                pod.get("status", {}).get("phase") == "Running"
                and bool(statuses)
                and all(status.get("ready") is True for status in statuses)
            )


        volumes = get_json("-n", "longhorn-system", "get", "volumes.longhorn.io").get("items", [])
        replicas = get_json("-n", "longhorn-system", "get", "replicas.longhorn.io").get("items", [])
        pvs = {
            item.get("metadata", {}).get("name", ""): item
            for item in get_json("get", "persistentvolumes").get("items", [])
        }
        replicas_by_volume = {}
        for replica in replicas:
            volume_name = replica.get("spec", {}).get("volumeName", "")
            if volume_name:
                replicas_by_volume.setdefault(volume_name, []).append(replica)

        repaired = []
        for volume in volumes:
            metadata = volume.get("metadata", {})
            status = volume.get("status", {})
            volume_name = metadata.get("name", "")
            if not volume_name or metadata.get("deletionTimestamp"):
                continue
            try:
                actual_size = int(status.get("actualSize") or 0)
            except (TypeError, ValueError):
                continue
            scheduled = next(
                (
                    condition
                    for condition in status.get("conditions", [])
                    if condition.get("type") == "Scheduled"
                ),
                {},
            )
            if not (
                actual_size == 0
                and status.get("state") == "detached"
                and scheduled.get("status") == "False"
                and scheduled.get("reason") == "ReplicaSchedulingFailure"
            ):
                continue

            kubernetes_status = status.get("kubernetesStatus", {})
            namespace = kubernetes_status.get("namespace", "")
            pvc_name = kubernetes_status.get("pvcName", "")
            pv_name = kubernetes_status.get("pvName", "")
            if not namespace or not pvc_name or not pv_name:
                continue
            pvc = get_json("-n", namespace, "get", f"persistentvolumeclaim/{pvc_name}")
            pv = pvs.get(pv_name, {})
            csi = pv.get("spec", {}).get("csi", {})
            if not (
                pvc.get("status", {}).get("phase") == "Bound"
                and not pvc.get("metadata", {}).get("deletionTimestamp")
                and pvc.get("spec", {}).get("volumeName") == pv_name
                and csi.get("driver") == "driver.longhorn.io"
                and csi.get("volumeHandle") == volume_name
            ):
                continue

            volume_replicas = replicas_by_volume.get(volume_name, [])
            if not volume_replicas:
                continue
            safe_placeholders = all(
                replica.get("status", {}).get("currentState") == "stopped"
                and not replica.get("spec", {}).get("nodeID")
                and not replica.get("spec", {}).get("diskID")
                and not replica.get("metadata", {}).get("deletionTimestamp")
                for replica in volume_replicas
            )
            if not safe_placeholders:
                continue

            for replica in volume_replicas:
                replica_name = replica.get("metadata", {}).get("name", "")
                run(
                    "-n",
                    "longhorn-system",
                    "delete",
                    f"replicas.longhorn.io/{replica_name}",
                    "--wait=false",
                )
                print(
                    f"longhorn_replica={replica_name} volume={volume_name} "
                    "action=remove-empty-unscheduled-placeholder"
                )
            repaired.append((volume_name, namespace, pvc_name, pv_name))

        if not repaired:
            print("longhorn_empty_unscheduled_replica_repair=not-needed")
            raise SystemExit(0)

        deadline = time.monotonic() + timeout_seconds
        pending = {
            name: (namespace, pvc_name, pv_name)
            for name, namespace, pvc_name, pv_name in repaired
        }
        while pending and time.monotonic() < deadline:
            for volume_name in list(pending):
                volume = get_json("-n", "longhorn-system", "get", f"volumes.longhorn.io/{volume_name}")
                scheduled = next(
                    (
                        condition
                        for condition in volume.get("status", {}).get("conditions", [])
                        if condition.get("type") == "Scheduled"
                    ),
                    {},
                )
                if scheduled.get("status") == "True":
                    namespace, pvc_name, _ = pending.pop(volume_name)
                    print(
                        f"longhorn_volume={volume_name} namespace={namespace} pvc={pvc_name} "
                        "result=rescheduled"
                    )
            if pending:
                time.sleep(5)

        if pending:
            for volume_name, (namespace, pvc_name, _) in sorted(pending.items()):
                print(
                    f"longhorn_volume={volume_name} namespace={namespace} pvc={pvc_name} "
                    "result=fail reason=empty-volume-reschedule-timeout",
                    file=sys.stderr,
                )
            raise SystemExit(1)

        attachments = get_json("get", "volumeattachments.storage.k8s.io").get("items", [])
        workload_recovery = {}
        for volume_name, namespace, pvc_name, pv_name in repaired:
            for attachment in attachments:
                metadata = attachment.get("metadata", {})
                source = attachment.get("spec", {}).get("source", {})
                if source.get("persistentVolumeName") != pv_name:
                    continue
                if attachment.get("status", {}).get("attached") is True:
                    continue
                attachment_name = metadata.get("name", "")
                if not attachment_name or metadata.get("deletionTimestamp"):
                    continue
                delete_if_present(f"volumeattachment.storage.k8s.io/{attachment_name}")
                print(
                    f"longhorn_volume={volume_name} volumeattachment={attachment_name} "
                    "action=remove-stale-unattached-record"
                )

            pods = get_json("-n", namespace, "get", "pods").get("items", [])
            for pod in pods:
                metadata = pod.get("metadata", {})
                pod_name = metadata.get("name", "")
                if not pod_name or metadata.get("deletionTimestamp"):
                    continue
                if not pod_uses_claim(pod, pvc_name) or pod_is_ready(pod):
                    continue
                if not metadata.get("ownerReferences"):
                    print(
                        f"longhorn_volume={volume_name} namespace={namespace} pod={pod_name} "
                        "action=retain-unmanaged-nonready-consumer"
                    )
                    continue
                delete_if_present("-n", namespace, f"pod/{pod_name}")
                workload_recovery[(namespace, pvc_name)] = volume_name
                print(
                    f"longhorn_volume={volume_name} namespace={namespace} pod={pod_name} "
                    "action=refresh-controller-managed-consumer"
                )

        deadline = time.monotonic() + timeout_seconds
        pending_workloads = dict(workload_recovery)
        while pending_workloads and time.monotonic() < deadline:
            for (namespace, pvc_name), volume_name in list(pending_workloads.items()):
                volume = get_json(
                    "-n",
                    "longhorn-system",
                    "get",
                    f"volumes.longhorn.io/{volume_name}",
                )
                volume_ready = (
                    volume.get("status", {}).get("state") == "attached"
                    and volume.get("status", {}).get("robustness") == "healthy"
                )
                pods = get_json("-n", namespace, "get", "pods").get("items", [])
                ready_pods = [
                    pod
                    for pod in pods
                    if not pod.get("metadata", {}).get("deletionTimestamp")
                    and pod_uses_claim(pod, pvc_name)
                    and pod_is_ready(pod)
                ]
                if volume_ready and ready_pods:
                    pod_names = ",".join(
                        sorted(pod.get("metadata", {}).get("name", "") for pod in ready_pods)
                    )
                    pending_workloads.pop((namespace, pvc_name))
                    print(
                        f"longhorn_volume={volume_name} namespace={namespace} pvc={pvc_name} "
                        f"pods={pod_names} result=workload-recovered"
                    )
            if pending_workloads:
                time.sleep(5)

        if pending_workloads:
            for (namespace, pvc_name), volume_name in sorted(pending_workloads.items()):
                volume = get_json(
                    "-n",
                    "longhorn-system",
                    "get",
                    f"volumes.longhorn.io/{volume_name}",
                )
                pods = get_json("-n", namespace, "get", "pods").get("items", [])
                pod_state = ",".join(
                    sorted(
                        f"{pod.get('metadata', {}).get('name', '')}:"
                        f"{pod.get('status', {}).get('phase', 'Unknown')}:"
                        f"ready={pod_is_ready(pod)}"
                        for pod in pods
                        if pod_uses_claim(pod, pvc_name)
                    )
                ) or "none"
                print(
                    f"longhorn_volume={volume_name} namespace={namespace} pvc={pvc_name} "
                    f"state={volume.get('status', {}).get('state', 'unknown')} "
                    f"robustness={volume.get('status', {}).get('robustness', 'unknown')} "
                    f"pods={pod_state} result=fail reason=empty-volume-workload-recovery-timeout",
                    file=sys.stderr,
                )
            raise SystemExit(1)
        PY
      args:
        executable: /bin/bash
      register: platform_longhorn_empty_unscheduled_replica_repair
      changed_when: >-
        'action=remove-empty-unscheduled-placeholder' in
        (platform_longhorn_empty_unscheduled_replica_repair.stdout | default(''))
        or 'action=remove-stale-unattached-record' in
        (platform_longhorn_empty_unscheduled_replica_repair.stdout | default(''))
        or 'action=refresh-controller-managed-consumer' in
        (platform_longhorn_empty_unscheduled_replica_repair.stdout | default(''))
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      when: platform_longhorn_runtime_empty_unscheduled_replica_repair_effective | bool

    - name: Recreate only empty faulted StatefulSet claims without recovery sources
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/../../scripts/repair_empty_faulted_longhorn_claims.py
          --timeout {{ platform_longhorn_runtime_repair_timeout_effective }}
        executable: /usr/bin/python3
      register: platform_longhorn_empty_faulted_claim_repair
      changed_when: >-
        'action=recycle-empty-faulted-statefulset-claim result=healthy' in
        (platform_longhorn_empty_faulted_claim_repair.stdout | default(''))
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      when: platform_longhorn_runtime_empty_faulted_claim_repair_effective | bool

    - name: Show focused Longhorn runtime repair result
      ansible.builtin.debug:
        msg:
          - "{{ platform_longhorn_runtime_repair.stdout_lines | default(['runtime repair did not run']) }}"
          - "{{ platform_longhorn_duplicate_runtime_repair.stdout_lines | default(['duplicate disk repair did not run']) }}"
          - "{{ platform_longhorn_stale_replica_repair.stdout_lines | default(['stale replica repair did not run']) }}"
          - "{{ platform_longhorn_empty_unscheduled_replica_repair.stdout_lines | default(['empty unscheduled replica repair did not run']) }}"
          - "{{ platform_longhorn_empty_faulted_claim_repair.stdout_lines | default(['empty faulted claim repair did not run']) }}"
      run_once: true
