---
- name: Repair Forgejo storage and backend runtime
  hosts: rke2_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    rke2_first_server: "{{ groups['rke2_servers'][0] }}"
    platform_forgejo_namespace_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_FORGEJO_NAMESPACE') }}"
    platform_forgejo_pvc_name_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_FORGEJO_PVC_NAME') }}"
    platform_forgejo_reset_stuck_pvc_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_FORGEJO_RESET_STUCK_PVC') }}"
    platform_forgejo_reset_longhorn_volume_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_FORGEJO_RESET_LONGHORN_VOLUME') }}"
    platform_forgejo_pod_termination_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_FORGEJO_POD_TERMINATION_TIMEOUT') }}"
    platform_forgejo_storage_repair_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_FORGEJO_STORAGE_REPAIR_TIMEOUT') }}"
    platform_forgejo_volume_attach_repair_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_FORGEJO_VOLUME_ATTACH_REPAIR_TIMEOUT') }}"
    platform_forgejo_pod_ip_wait_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_FORGEJO_POD_IP_WAIT_TIMEOUT') }}"
    platform_forgejo_stale_pod_min_age_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_FORGEJO_STALE_POD_MIN_AGE') }}"
    platform_forgejo_backend_ready_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_FORGEJO_BACKEND_READY_TIMEOUT') }}"
    platform_longhorn_default_disk_path_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_LONGHORN_DEFAULT_DISK_PATH') }}"
    platform_longhorn_default_disk_repair_enabled_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_LONGHORN_DEFAULT_DISK_REPAIR_ENABLED') }}"
    platform_forgejo_namespace_effective: "{{ platform_forgejo_namespace | default(platform_forgejo_namespace_from_env, true) | default('forgejo', true) }}"
    platform_forgejo_pvc_name_effective: "{{ platform_forgejo_pvc_name | default(platform_forgejo_pvc_name_from_env, true) | default('gitea-shared-storage', true) }}"
    platform_forgejo_reset_stuck_pvc_effective: "{{ platform_forgejo_reset_stuck_pvc | default(platform_forgejo_reset_stuck_pvc_from_env, true) | default(false, true) | bool }}"
    platform_forgejo_reset_longhorn_volume_effective: "{{ platform_forgejo_reset_longhorn_volume | default(platform_forgejo_reset_longhorn_volume_from_env, true) | default(true, true) | bool }}"
    platform_forgejo_pod_termination_timeout_effective: "{{ platform_forgejo_pod_termination_timeout | default(platform_forgejo_pod_termination_timeout_from_env, true) | default(60, true) | int }}"
    platform_forgejo_storage_repair_timeout_effective: "{{ platform_forgejo_storage_repair_timeout | default(platform_forgejo_storage_repair_timeout_from_env, true) | default(300, true) | int }}"
    platform_forgejo_volume_attach_repair_timeout_effective: "{{ platform_forgejo_volume_attach_repair_timeout | default(platform_forgejo_volume_attach_repair_timeout_from_env, true) | default(600, true) | int }}"
    platform_forgejo_pod_ip_wait_timeout_effective: "{{ platform_forgejo_pod_ip_wait_timeout | default(platform_forgejo_pod_ip_wait_timeout_from_env, true) | default(180, true) | int }}"
    platform_forgejo_stale_pod_min_age_effective: "{{ platform_forgejo_stale_pod_min_age | default(platform_forgejo_stale_pod_min_age_from_env, true) | default(120, true) | int }}"
    platform_forgejo_backend_ready_timeout_effective: "{{ platform_forgejo_backend_ready_timeout | default(platform_forgejo_backend_ready_timeout_from_env, true) | default(600, true) | int }}"
    platform_longhorn_default_disk_path_effective: "{{ platform_longhorn_default_disk_path | default(platform_longhorn_default_disk_path_from_env, true) | default('/var/lib/longhorn', true) }}"
    platform_longhorn_default_disk_repair_enabled_effective: "{{ platform_longhorn_default_disk_repair_enabled | default(platform_longhorn_default_disk_repair_enabled_from_env, true) | default(true, true) | bool }}"
  tasks:
    - name: Inspect Forgejo storage state
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        ns={{ platform_forgejo_namespace_effective | quote }}
        pvc={{ platform_forgejo_pvc_name_effective | quote }}

        echo "===== Forgejo namespace ====="
        if ! "$K" --kubeconfig "$C" get "namespace/${ns}" >/dev/null 2>&1; then
          echo "namespace/${ns} does not exist"
          exit 0
        fi
        "$K" --kubeconfig "$C" get "namespace/${ns}"

        echo "===== Forgejo resources ====="
        "$K" --kubeconfig "$C" -n "$ns" get deployment,statefulset,pods,pvc,svc,ingress -o wide || true

        echo "===== target PVC state ====="
        if ! "$K" --kubeconfig "$C" -n "$ns" get "pvc/${pvc}" >/dev/null 2>&1; then
          echo "pvc/${pvc} is not present"
          echo "FORGEJO_PVC_ABSENT=true"
          exit 43
        fi

        deletion="$("$K" --kubeconfig "$C" -n "$ns" get "pvc/${pvc}" -o jsonpath='{.metadata.deletionTimestamp}' 2>/dev/null || true)"
        phase="$("$K" --kubeconfig "$C" -n "$ns" get "pvc/${pvc}" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
        pv="$("$K" --kubeconfig "$C" -n "$ns" get "pvc/${pvc}" -o jsonpath='{.spec.volumeName}' 2>/dev/null || true)"
        handle=""
        if [ -n "${pv}" ]; then
          handle="$("$K" --kubeconfig "$C" get "pv/${pv}" -o jsonpath='{.spec.csi.volumeHandle}' 2>/dev/null || true)"
        fi
        printf 'pvc=%s\nphase=%s\ndeletionTimestamp=%s\npv=%s\nlonghornVolume=%s\n' \
          "${pvc}" "${phase:-unknown}" "${deletion:-none}" "${pv:-none}" "${handle:-none}"

        if [ -n "${deletion}" ]; then
          echo "FORGEJO_PVC_TERMINATING=true"
          exit 42
        fi

        echo "FORGEJO_PVC_TERMINATING=false"
      args:
        executable: /bin/bash
      register: forgejo_storage_state
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Print Forgejo storage state
      ansible.builtin.debug:
        var: forgejo_storage_state.stdout_lines
      run_once: true

    - name: Stop before destructive Forgejo PVC reset unless explicitly enabled
      ansible.builtin.fail:
        msg: |-
          Forgejo PVC {{ platform_forgejo_namespace_effective }}/{{ platform_forgejo_pvc_name_effective }}
          is stuck in Terminating.

          This repair can delete and recreate the Forgejo data PVC/PV. That is
          acceptable for an empty first deployment, but not for a Forgejo instance
          that already contains repositories, users, or issues.

          If this is still your first deployment and Forgejo has no data yet, run:

          PLATFORM_FORGEJO_RESET_STUCK_PVC=true make platform-forgejo-storage-repair

          Current state:
          {{ forgejo_storage_state.stdout }}
      when:
        - forgejo_storage_state.rc == 42
        - not platform_forgejo_reset_stuck_pvc_effective
      run_once: true

    - block:
        - name: Scale Forgejo workloads down before PVC reset
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            ns={{ platform_forgejo_namespace_effective | quote }}

            workloads="$("$K" --kubeconfig "$C" -n "$ns" get deployment,statefulset \
              -l app.kubernetes.io/instance=forgejo -o name 2>/dev/null || true)"
            fallback_workloads="$(
              for item in deployment/forgejo statefulset/forgejo; do
                if "$K" --kubeconfig "$C" -n "$ns" get "$item" >/dev/null 2>&1; then
                  printf '%s\n' "$item"
                fi
              done
            )"
            workloads="$(printf '%s\n%s\n' "${workloads}" "${fallback_workloads}" | sed '/^$/d' | sort -u)"
            if [ -z "${workloads}" ]; then
              echo "No Forgejo deployment/statefulset exists to scale down."
            else
              printf '%s\n' "${workloads}" |
                xargs -r "$K" --kubeconfig "$C" -n "$ns" scale --replicas=0
            fi

            "$K" --kubeconfig "$C" -n "$ns" delete pod \
              -l app.kubernetes.io/instance=forgejo --ignore-not-found=true --wait=false
            "$K" --kubeconfig "$C" -n "$ns" delete pod \
              -l app.kubernetes.io/name=forgejo --ignore-not-found=true --wait=false
          args:
            executable: /bin/bash
          register: forgejo_scale_down
          changed_when: true
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Wait briefly for Forgejo pods to terminate
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            ns={{ platform_forgejo_namespace_effective | quote }}
            pods="$(
              "$K" --kubeconfig "$C" -n "$ns" get pods \
                -l app.kubernetes.io/instance=forgejo -o name 2>/dev/null || true
              "$K" --kubeconfig "$C" -n "$ns" get pods \
                -l app.kubernetes.io/name=forgejo -o name 2>/dev/null || true
            )"
            pods="$(printf '%s\n' "${pods}" | sed '/^$/d' | sort -u)"
            if [ -n "${pods}" ]; then
              printf '%s\n' "${pods}"
              exit 1
            fi
            echo "No Forgejo pods remain."
          args:
            executable: /bin/bash
          register: forgejo_pods_gone
          retries: "{{ (((platform_forgejo_pod_termination_timeout_effective | int) / 10) | round(0, 'ceil') | int) + 1 }}"
          delay: 10
          until: forgejo_pods_gone.rc == 0
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Force-delete Forgejo pods still stuck after graceful wait
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            ns={{ platform_forgejo_namespace_effective | quote }}
            pods="$(
              "$K" --kubeconfig "$C" -n "$ns" get pods \
                -l app.kubernetes.io/instance=forgejo -o name 2>/dev/null || true
              "$K" --kubeconfig "$C" -n "$ns" get pods \
                -l app.kubernetes.io/name=forgejo -o name 2>/dev/null || true
            )"
            pods="$(printf '%s\n' "${pods}" | sed '/^$/d' | sort -u)"
            if [ -z "${pods}" ]; then
              echo "No Forgejo pods require force deletion."
              exit 0
            fi

            echo "Force-deleting Forgejo pods still present after {{ platform_forgejo_pod_termination_timeout_effective }}s:"
            printf '%s\n' "${pods}"
            printf '%s\n' "${pods}" |
              xargs -r "$K" --kubeconfig "$C" -n "$ns" delete \
                --force --grace-period=0 --wait=false
          args:
            executable: /bin/bash
          register: forgejo_force_delete_pods
          changed_when: "'Force-deleting Forgejo pods' in forgejo_force_delete_pods.stdout"
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when: forgejo_pods_gone.rc != 0

        - name: Confirm Forgejo pods are gone after force deletion
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            ns={{ platform_forgejo_namespace_effective | quote }}
            pods="$(
              "$K" --kubeconfig "$C" -n "$ns" get pods \
                -l app.kubernetes.io/instance=forgejo -o name 2>/dev/null || true
              "$K" --kubeconfig "$C" -n "$ns" get pods \
                -l app.kubernetes.io/name=forgejo -o name 2>/dev/null || true
            )"
            pods="$(printf '%s\n' "${pods}" | sed '/^$/d' | sort -u)"
            if [ -n "${pods}" ]; then
              printf '%s\n' "${pods}"
              exit 1
            fi
            echo "No Forgejo pods remain."
          args:
            executable: /bin/bash
          register: forgejo_pods_gone_after_force
          retries: "{{ (((platform_forgejo_pod_termination_timeout_effective | int) / 10) | round(0, 'ceil') | int) + 1 }}"
          delay: 10
          until: forgejo_pods_gone_after_force.rc == 0
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Capture Forgejo PVC backing objects before reset
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            ns={{ platform_forgejo_namespace_effective | quote }}
            pvc={{ platform_forgejo_pvc_name_effective | quote }}

            pv=""
            handle=""
            if "$K" --kubeconfig "$C" -n "$ns" get "pvc/${pvc}" >/dev/null 2>&1; then
              pv="$("$K" --kubeconfig "$C" -n "$ns" get "pvc/${pvc}" -o jsonpath='{.spec.volumeName}' 2>/dev/null || true)"
            fi
            if [ -n "${pv}" ] && "$K" --kubeconfig "$C" get "pv/${pv}" >/dev/null 2>&1; then
              handle="$("$K" --kubeconfig "$C" get "pv/${pv}" -o jsonpath='{.spec.csi.volumeHandle}' 2>/dev/null || true)"
            fi
            printf 'pv=%s\nlonghornVolume=%s\n' "${pv}" "${handle}"
          args:
            executable: /bin/bash
          register: forgejo_backing_storage
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Delete stuck Forgejo PVC
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            ns={{ platform_forgejo_namespace_effective | quote }}
            pvc={{ platform_forgejo_pvc_name_effective | quote }}
            timeout={{ platform_forgejo_storage_repair_timeout_effective | int }}

            "$K" --kubeconfig "$C" -n "$ns" delete "pvc/${pvc}" \
              --ignore-not-found=true --wait=false

            deadline=$((SECONDS + timeout))
            while "$K" --kubeconfig "$C" -n "$ns" get "pvc/${pvc}" >/dev/null 2>&1; do
              if [ "${SECONDS}" -ge "${deadline}" ]; then
                echo "PVC still exists after ${timeout}s; removing finalizers for first-deploy reset."
                "$K" --kubeconfig "$C" -n "$ns" patch "pvc/${pvc}" \
                  --type=merge -p '{"metadata":{"finalizers":[]}}' || true
                "$K" --kubeconfig "$C" -n "$ns" delete "pvc/${pvc}" \
                  --ignore-not-found=true --wait=false
                break
              fi
              sleep 5
            done

            deadline=$((SECONDS + 60))
            while "$K" --kubeconfig "$C" -n "$ns" get "pvc/${pvc}" >/dev/null 2>&1; do
              if [ "${SECONDS}" -ge "${deadline}" ]; then
                echo "PVC ${ns}/${pvc} still exists after finalizer cleanup." >&2
                exit 1
              fi
              sleep 5
            done
            echo "PVC ${ns}/${pvc} has been removed."
          args:
            executable: /bin/bash
          register: forgejo_pvc_reset
          changed_when: true
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Delete retained Forgejo PV
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            pv="$(printf '%s\n' {{ forgejo_backing_storage.stdout | quote }} | sed -n 's/^pv=//p' | head -1)"
            timeout={{ platform_forgejo_storage_repair_timeout_effective | int }}
            if [ -z "${pv}" ] || ! "$K" --kubeconfig "$C" get "pv/${pv}" >/dev/null 2>&1; then
              echo "No retained Forgejo PV found."
              exit 0
            fi

            "$K" --kubeconfig "$C" delete "pv/${pv}" --wait=false
            deadline=$((SECONDS + timeout))
            while "$K" --kubeconfig "$C" get "pv/${pv}" >/dev/null 2>&1; do
              if [ "${SECONDS}" -ge "${deadline}" ]; then
                echo "PV still exists after ${timeout}s; removing finalizers for first-deploy reset."
                "$K" --kubeconfig "$C" patch "pv/${pv}" \
                  --type=merge -p '{"metadata":{"finalizers":[]}}' || true
                "$K" --kubeconfig "$C" delete "pv/${pv}" --wait=false || true
                break
              fi
              sleep 5
            done
            echo "PV ${pv} removal requested."
          args:
            executable: /bin/bash
          register: forgejo_pv_reset
          changed_when: "'No retained Forgejo PV found' not in forgejo_pv_reset.stdout"
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Delete old Longhorn volume for first-deploy reset
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            handle="$(printf '%s\n' {{ forgejo_backing_storage.stdout | quote }} | sed -n 's/^longhornVolume=//p' | head -1)"
            if [ -z "${handle}" ]; then
              echo "No Longhorn volume handle was recorded."
              exit 0
            fi
            if ! "$K" --kubeconfig "$C" get crd/volumes.longhorn.io >/dev/null 2>&1; then
              echo "Longhorn volume CRD is not registered."
              exit 0
            fi
            if ! "$K" --kubeconfig "$C" -n longhorn-system get "volumes.longhorn.io/${handle}" >/dev/null 2>&1; then
              echo "Longhorn volume ${handle} is already absent."
              exit 0
            fi

            "$K" --kubeconfig "$C" -n longhorn-system delete \
              "volumes.longhorn.io/${handle}" --wait=false || true
            echo "Longhorn volume ${handle} removal requested."
          args:
            executable: /bin/bash
          register: forgejo_longhorn_volume_reset
          changed_when: "'removal requested' in forgejo_longhorn_volume_reset.stdout"
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when: platform_forgejo_reset_longhorn_volume_effective | bool

        - name: Refresh and sync Forgejo Argo CD application
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            if ! "$K" --kubeconfig "$C" -n argocd get application/forgejo >/dev/null 2>&1; then
              echo "Argo CD application/forgejo is not present."
              exit 0
            fi
            "$K" --kubeconfig "$C" -n argocd annotate application/forgejo \
              argocd.argoproj.io/refresh=hard --overwrite
            revision="$("$K" --kubeconfig "$C" -n argocd get application/forgejo \
              -o jsonpath='{.spec.source.targetRevision}' 2>/dev/null || true)"
            revision="${revision:-main}"
            "$K" --kubeconfig "$C" -n argocd patch application/forgejo --type merge \
              -p "$(printf '{\"operation\":{\"sync\":{\"revision\":\"%s\",\"prune\":false}}}' "${revision}")" || true
          args:
            executable: /bin/bash
          register: forgejo_argocd_refresh
          changed_when: true
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Wait for Forgejo PVC to be recreated cleanly
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            ns={{ platform_forgejo_namespace_effective | quote }}
            pvc={{ platform_forgejo_pvc_name_effective | quote }}

            "$K" --kubeconfig "$C" -n "$ns" get "pvc/${pvc}" >/dev/null
            deletion="$("$K" --kubeconfig "$C" -n "$ns" get "pvc/${pvc}" -o jsonpath='{.metadata.deletionTimestamp}' 2>/dev/null || true)"
            phase="$("$K" --kubeconfig "$C" -n "$ns" get "pvc/${pvc}" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
            printf 'pvc=%s phase=%s deletionTimestamp=%s\n' "${pvc}" "${phase:-unknown}" "${deletion:-none}"
            test -z "${deletion}"
          args:
            executable: /bin/bash
          register: forgejo_pvc_recreated
          retries: "{{ (((platform_forgejo_storage_repair_timeout_effective | int) / 10) | round(0, 'ceil') | int) + 1 }}"
          delay: 10
          until: forgejo_pvc_recreated.rc == 0
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

      when:
        - forgejo_storage_state.rc == 42
        - platform_forgejo_reset_stuck_pvc_effective

    - block:
        - name: Refresh and sync Forgejo Argo CD application when PVC is absent
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            if ! "$K" --kubeconfig "$C" -n argocd get application/forgejo >/dev/null 2>&1; then
              echo "Argo CD application/forgejo is not present."
              exit 1
            fi
            "$K" --kubeconfig "$C" -n argocd annotate application/forgejo \
              argocd.argoproj.io/refresh=hard --overwrite
            revision="$("$K" --kubeconfig "$C" -n argocd get application/forgejo \
              -o jsonpath='{.spec.source.targetRevision}' 2>/dev/null || true)"
            revision="${revision:-main}"
            "$K" --kubeconfig "$C" -n argocd patch application/forgejo --type merge \
              -p "$(printf '{\"operation\":{\"sync\":{\"revision\":\"%s\",\"prune\":false}}}' "${revision}")" || true
          args:
            executable: /bin/bash
          register: forgejo_absent_pvc_argocd_refresh
          changed_when: true
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Wait for Forgejo PVC after absent-PVC resync
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            ns={{ platform_forgejo_namespace_effective | quote }}
            pvc={{ platform_forgejo_pvc_name_effective | quote }}

            "$K" --kubeconfig "$C" -n "$ns" get "pvc/${pvc}" >/dev/null
            deletion="$("$K" --kubeconfig "$C" -n "$ns" get "pvc/${pvc}" -o jsonpath='{.metadata.deletionTimestamp}' 2>/dev/null || true)"
            phase="$("$K" --kubeconfig "$C" -n "$ns" get "pvc/${pvc}" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
            printf 'pvc=%s phase=%s deletionTimestamp=%s\n' "${pvc}" "${phase:-unknown}" "${deletion:-none}"
            test -z "${deletion}"
          args:
            executable: /bin/bash
          register: forgejo_absent_pvc_recreated
          retries: "{{ (((platform_forgejo_storage_repair_timeout_effective | int) / 10) | round(0, 'ceil') | int) + 1 }}"
          delay: 10
          until: forgejo_absent_pvc_recreated.rc == 0
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

      when: forgejo_storage_state.rc == 43

    - name: Detect Forgejo Longhorn attach problems
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        ns={{ platform_forgejo_namespace_effective | quote }}
        pvc={{ platform_forgejo_pvc_name_effective | quote }}

        if ! "$K" --kubeconfig "$C" get "namespace/${ns}" >/dev/null 2>&1; then
          echo "namespace/${ns} does not exist"
          exit 0
        fi

        pods="$(
          "$K" --kubeconfig "$C" -n "$ns" get pods \
            -l app.kubernetes.io/instance=forgejo -o name 2>/dev/null || true
          "$K" --kubeconfig "$C" -n "$ns" get pods \
            -l app.kubernetes.io/name=forgejo -o name 2>/dev/null || true
        )"
        pods="$(printf '%s\n' "${pods}" | sed '/^$/d' | sort -u)"
        if [ -z "${pods}" ]; then
          echo "No Forgejo pods exist."
          exit 0
        fi

        echo "===== Forgejo pod summary ====="
        "$K" --kubeconfig "$C" -n "$ns" get pods -l app.kubernetes.io/name=forgejo -o wide || true
        echo "===== Forgejo PVC ====="
        "$K" --kubeconfig "$C" -n "$ns" get "pvc/${pvc}" -o wide || true
        pv="$("$K" --kubeconfig "$C" -n "$ns" get "pvc/${pvc}" -o jsonpath='{.spec.volumeName}' 2>/dev/null || true)"
        handle=""
        if [ -n "${pv}" ]; then
          handle="$("$K" --kubeconfig "$C" get "pv/${pv}" -o jsonpath='{.spec.csi.volumeHandle}' 2>/dev/null || true)"
        fi
        printf 'pv=%s\nlonghornVolume=%s\n' "${pv:-none}" "${handle:-none}"

        echo "===== Forgejo pod events ====="
        describe="$("$K" --kubeconfig "$C" -n "$ns" describe ${pods} || true)"
        printf '%s\n' "${describe}" | sed -n '/Events:/,$p'

        if printf '%s\n' "${describe}" |
          grep -E 'AttachVolume.Attach failed.*(node .* not found|volume .* is not ready for workloads|not ready for workloads)' >/dev/null; then
          echo "FORGEJO_LONGHORN_ATTACH_REPAIR_NEEDED=true"
          exit 42
        fi

        echo "FORGEJO_LONGHORN_ATTACH_REPAIR_NEEDED=false"
      args:
        executable: /bin/bash
      register: forgejo_longhorn_attach_problem
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Print Forgejo Longhorn attach detection
      ansible.builtin.debug:
        var: forgejo_longhorn_attach_problem.stdout_lines
      run_once: true

    - block:
        - name: Restart Longhorn manager for node registration and attach repair
          ansible.builtin.command:
            argv:
              - /var/lib/rancher/rke2/bin/kubectl
              - --kubeconfig
              - /etc/rancher/rke2/rke2.yaml
              - -n
              - longhorn-system
              - rollout
              - restart
              - daemonset/longhorn-manager
          register: forgejo_attach_longhorn_manager_restart
          changed_when: "'restarted' in forgejo_attach_longhorn_manager_restart.stdout"
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Ensure Longhorn default disk path exists on all nodes
          ansible.builtin.file:
            path: "{{ platform_longhorn_default_disk_path_effective }}"
            state: directory
            owner: root
            group: root
            mode: "0755"
          when: platform_longhorn_default_disk_repair_enabled_effective | bool

        - name: Wait for Longhorn manager after attach repair restart
          ansible.builtin.command:
            argv:
              - /var/lib/rancher/rke2/bin/kubectl
              - --kubeconfig
              - /etc/rancher/rke2/rke2.yaml
              - -n
              - longhorn-system
              - rollout
              - status
              - daemonset/longhorn-manager
              - --timeout=30s
          register: forgejo_attach_longhorn_manager_rollout
          retries: "{{ (((platform_forgejo_volume_attach_repair_timeout_effective | int) / 30) | round(0, 'ceil') | int) + 1 }}"
          delay: 10
          until: forgejo_attach_longhorn_manager_rollout.rc == 0
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Wait for Longhorn node objects to match Kubernetes nodes
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            missing=""
            for node in $("$K" --kubeconfig "$C" get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'); do
              if ! "$K" --kubeconfig "$C" -n longhorn-system get "nodes.longhorn.io/${node}" >/dev/null 2>&1; then
                missing="${missing} ${node}"
              fi
            done
            missing="$(printf '%s' "${missing}" | xargs)"
            echo "===== Kubernetes nodes ====="
            "$K" --kubeconfig "$C" get nodes -o wide
            echo "===== Longhorn nodes ====="
            "$K" --kubeconfig "$C" -n longhorn-system get nodes.longhorn.io -o wide || true
            if [ -n "${missing}" ]; then
              echo "Missing Longhorn node objects: ${missing}" >&2
              exit 1
            fi
          args:
            executable: /bin/bash
          register: forgejo_attach_longhorn_nodes_ready
          retries: "{{ (((platform_forgejo_volume_attach_repair_timeout_effective | int) / 10) | round(0, 'ceil') | int) + 1 }}"
          delay: 10
          until: forgejo_attach_longhorn_nodes_ready.rc == 0
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Repair missing Longhorn default disks on all nodes
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            disk_path={{ platform_longhorn_default_disk_path_effective | quote }}
            changed=0

            for node in $("$K" --kubeconfig "$C" get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'); do
              if ! "$K" --kubeconfig "$C" -n longhorn-system get "nodes.longhorn.io/${node}" >/dev/null 2>&1; then
                echo "Skipping ${node}; Longhorn node object is not present yet."
                continue
              fi

              disk_paths="$("$K" --kubeconfig "$C" -n longhorn-system get "nodes.longhorn.io/${node}" \
                -o jsonpath='{range .spec.disks[*]}{.path}{"\n"}{end}' 2>/dev/null || true)"
              if [ -n "${disk_paths}" ]; then
                echo "${node} already has Longhorn disk configuration."
                continue
              fi

              echo "Adding default Longhorn disk on ${node}: ${disk_path}"
              "$K" --kubeconfig "$C" -n longhorn-system patch "nodes.longhorn.io/${node}" \
                --type=merge \
                -p "{\"spec\":{\"allowScheduling\":true,\"disks\":{\"default-disk\":{\"path\":\"${disk_path}\",\"allowScheduling\":true,\"storageReserved\":0,\"tags\":[],\"diskType\":\"filesystem\",\"evictionRequested\":false}}}}"
              changed=1
            done

            echo "===== Longhorn node disk state ====="
            "$K" --kubeconfig "$C" -n longhorn-system get nodes.longhorn.io -o yaml |
              sed -n '/^metadata:/d; /name: node-/p; /disks:/,/conditions:/p' || true

            if [ "${changed}" -eq 0 ]; then
              echo "No Longhorn disk repair changes were required."
            fi
            exit 0
          args:
            executable: /bin/bash
          register: forgejo_attach_longhorn_disk_repair
          changed_when: "'Adding default Longhorn disk' in forgejo_attach_longhorn_disk_repair.stdout"
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when: platform_longhorn_default_disk_repair_enabled_effective | bool

        - name: Wait for Longhorn disks to become schedulable
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            "$K" --kubeconfig "$C" -n longhorn-system get nodes.longhorn.io -o json |
              python3 -c '
            import json
            import sys

            data = json.load(sys.stdin)
            missing_spec = []
            missing_status = []
            not_schedulable = []

            for item in data.get("items", []):
                name = item.get("metadata", {}).get("name", "")
                spec_disks = item.get("spec", {}).get("disks") or {}
                status_disks = item.get("status", {}).get("diskStatus") or {}
                if not spec_disks:
                    missing_spec.append(name)
                    continue
                if not status_disks:
                    missing_status.append(name)
                    continue

                ready_disk = False
                for disk_name, disk in status_disks.items():
                    conditions = {
                        condition.get("type"): condition.get("status")
                        for condition in disk.get("conditions", [])
                    }
                    allow_scheduling = spec_disks.get(disk_name, {}).get("allowScheduling", False)
                    ready = conditions.get("Ready") == "True"
                    schedulable = conditions.get("Schedulable") == "True"
                    if allow_scheduling and ready and schedulable:
                        ready_disk = True
                        break
                if not ready_disk:
                    not_schedulable.append(name)

            print("===== Longhorn disk readiness =====")
            for item in data.get("items", []):
                name = item.get("metadata", {}).get("name", "")
                spec_disks = item.get("spec", {}).get("disks") or {}
                status_disks = item.get("status", {}).get("diskStatus") or {}
                print(f"{name}: specDisks={list(spec_disks.keys())} statusDisks={list(status_disks.keys())}")

            problems = []
            if missing_spec:
                problems.append("missing Spec.Disks: " + " ".join(missing_spec))
            if missing_status:
                problems.append("missing status.diskStatus: " + " ".join(missing_status))
            if not_schedulable:
                problems.append("no ready schedulable disk: " + " ".join(not_schedulable))

            if problems:
                print("Longhorn disk readiness problems: " + "; ".join(problems), file=sys.stderr)
                sys.exit(1)
            '
            echo "===== Longhorn nodes ====="
            "$K" --kubeconfig "$C" -n longhorn-system get nodes.longhorn.io -o wide || true
            echo "===== Longhorn node disks ====="
            "$K" --kubeconfig "$C" -n longhorn-system get nodes.longhorn.io -o yaml |
              sed -n '/name: node-/p; /disks:/,/conditions:/p' || true
          args:
            executable: /bin/bash
          register: forgejo_attach_longhorn_disks_ready
          retries: "{{ (((platform_forgejo_volume_attach_repair_timeout_effective | int) / 10) | round(0, 'ceil') | int) + 1 }}"
          delay: 10
          until: forgejo_attach_longhorn_disks_ready.rc == 0
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when: platform_longhorn_default_disk_repair_enabled_effective | bool

        - name: Restart Longhorn CSI components before Forgejo attach retry
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            ns=longhorn-system
            for workload in \
              deployment/csi-attacher \
              deployment/csi-provisioner \
              deployment/csi-resizer \
              deployment/csi-snapshotter \
              daemonset/longhorn-csi-plugin; do
              if "$K" --kubeconfig "$C" -n "$ns" get "$workload" >/dev/null 2>&1; then
                "$K" --kubeconfig "$C" -n "$ns" rollout restart "$workload"
              fi
            done
          args:
            executable: /bin/bash
          register: forgejo_attach_longhorn_csi_restart
          changed_when: "'restarted' in forgejo_attach_longhorn_csi_restart.stdout"
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Wait for Longhorn CSI components after attach repair restart
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            ns=longhorn-system
            for workload in \
              deployment/csi-attacher \
              deployment/csi-provisioner \
              deployment/csi-resizer \
              deployment/csi-snapshotter \
              daemonset/longhorn-csi-plugin; do
              if "$K" --kubeconfig "$C" -n "$ns" get "$workload" >/dev/null 2>&1; then
                "$K" --kubeconfig "$C" -n "$ns" rollout status "$workload" --timeout=30s
              fi
            done
          args:
            executable: /bin/bash
          register: forgejo_attach_longhorn_csi_rollout
          retries: "{{ (((platform_forgejo_volume_attach_repair_timeout_effective | int) / 30) | round(0, 'ceil') | int) + 1 }}"
          delay: 10
          until: forgejo_attach_longhorn_csi_rollout.rc == 0
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Restart Forgejo pod after Longhorn attach repair
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            ns={{ platform_forgejo_namespace_effective | quote }}

            "$K" --kubeconfig "$C" -n "$ns" delete pod \
              -l app.kubernetes.io/instance=forgejo --ignore-not-found=true --wait=false
            "$K" --kubeconfig "$C" -n "$ns" delete pod \
              -l app.kubernetes.io/name=forgejo --ignore-not-found=true --wait=false
          args:
            executable: /bin/bash
          register: forgejo_attach_pod_restart
          changed_when: true
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Wait for Forgejo pod to get a pod IP after attach repair
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            ns={{ platform_forgejo_namespace_effective | quote }}
            pod_lines="$("$K" --kubeconfig "$C" -n "$ns" get pods \
              -l app.kubernetes.io/name=forgejo \
              -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.status.phase}{"|"}{.status.podIP}{"|"}{.spec.nodeName}{"\n"}{end}' 2>/dev/null || true)"
            printf '%s\n' "${pod_lines}"
            printf '%s\n' "${pod_lines}" |
              awk -F'|' 'NF >= 4 && $3 != "" && $3 != "<none>" { found=1 } END { exit(found ? 0 : 1) }'
          args:
            executable: /bin/bash
          register: forgejo_attach_pod_has_ip
          retries: "{{ (((platform_forgejo_pod_ip_wait_timeout_effective | int) / 10) | round(0, 'ceil') | int) + 1 }}"
          delay: 10
          until: forgejo_attach_pod_has_ip.rc == 0
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

      rescue:
        - name: Collect Forgejo attach repair failure diagnostics
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            ns={{ platform_forgejo_namespace_effective | quote }}
            pvc={{ platform_forgejo_pvc_name_effective | quote }}

            echo "===== Forgejo pods ====="
            "$K" --kubeconfig "$C" -n "$ns" get pods -l app.kubernetes.io/name=forgejo -o wide || true
            for pod in $("$K" --kubeconfig "$C" -n "$ns" get pods -l app.kubernetes.io/name=forgejo -o name 2>/dev/null); do
              echo "===== ${pod} describe ====="
              "$K" --kubeconfig "$C" -n "$ns" describe "$pod" || true
            done

            echo "===== Forgejo PVC/PV ====="
            "$K" --kubeconfig "$C" -n "$ns" get "pvc/${pvc}" -o wide || true
            "$K" --kubeconfig "$C" -n "$ns" describe "pvc/${pvc}" || true
            pv="$("$K" --kubeconfig "$C" -n "$ns" get "pvc/${pvc}" -o jsonpath='{.spec.volumeName}' 2>/dev/null || true)"
            handle=""
            if [ -n "${pv}" ]; then
              "$K" --kubeconfig "$C" get "pv/${pv}" -o wide || true
              "$K" --kubeconfig "$C" describe "pv/${pv}" || true
              handle="$("$K" --kubeconfig "$C" get "pv/${pv}" -o jsonpath='{.spec.csi.volumeHandle}' 2>/dev/null || true)"
            fi

            echo "===== Longhorn nodes ====="
            "$K" --kubeconfig "$C" -n longhorn-system get nodes.longhorn.io -o wide || true
            for node in $("$K" --kubeconfig "$C" get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null); do
              "$K" --kubeconfig "$C" -n longhorn-system describe "nodes.longhorn.io/${node}" || true
            done

            echo "===== Longhorn volume ====="
            if [ -n "${handle}" ]; then
              "$K" --kubeconfig "$C" -n longhorn-system get "volumes.longhorn.io/${handle}" -o yaml || true
            fi

            echo "===== Longhorn workloads ====="
            "$K" --kubeconfig "$C" -n longhorn-system get pods,daemonset,deployment -o wide || true
            echo "===== Longhorn recent events ====="
            "$K" --kubeconfig "$C" -n longhorn-system get events --sort-by=.lastTimestamp | tail -120 || true
          args:
            executable: /bin/bash
          register: forgejo_attach_repair_failure
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Stop after Forgejo attach repair failure
          ansible.builtin.fail:
            msg: |-
              Forgejo still did not receive a pod IP after Longhorn attach repair
              within {{ platform_forgejo_pod_ip_wait_timeout_effective }}s.

              Diagnostic summary:
              {{ forgejo_attach_repair_failure.stdout }}
          run_once: true

      when: forgejo_longhorn_attach_problem.rc == 42

    - name: Recycle stale non-ready Forgejo pods after storage recovery
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        ns={{ platform_forgejo_namespace_effective | quote }}
        min_age={{ platform_forgejo_stale_pod_min_age_effective | int }}

        if ! "$K" --kubeconfig "$C" get "namespace/${ns}" >/dev/null 2>&1; then
          echo "forgejo_stale_pod_recycle=not-needed reason=namespace-absent"
          exit 0
        fi

        pod_lines="$("$K" --kubeconfig "$C" -n "$ns" get pods \
          -l app.kubernetes.io/name=forgejo \
          -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.metadata.creationTimestamp}{"|"}{.metadata.deletionTimestamp}{"|"}{.status.phase}{"|"}{.spec.nodeName}{"|"}{range .status.conditions[?(@.type=="Ready")]}{.status}{end}{"\n"}{end}' \
          2>/dev/null || true)"
        if [ -z "${pod_lines}" ]; then
          pod_lines="$("$K" --kubeconfig "$C" -n "$ns" get pods \
            -l app.kubernetes.io/instance=forgejo \
            -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.metadata.creationTimestamp}{"|"}{.metadata.deletionTimestamp}{"|"}{.status.phase}{"|"}{.spec.nodeName}{"|"}{range .status.conditions[?(@.type=="Ready")]}{.status}{end}{"\n"}{end}' \
            2>/dev/null || true)"
        fi
        if [ -z "${pod_lines}" ]; then
          echo "forgejo_stale_pod_recycle=not-needed reason=no-pods"
          exit 0
        fi

        ready_count="$(printf '%s\n' "${pod_lines}" | awk -F'|' '$6 == "True" { count++ } END { print count + 0 }')"
        if [ "${ready_count}" -gt 0 ]; then
          echo "forgejo_stale_pod_recycle=not-needed reason=ready-backend-present ready=${ready_count}"
          exit 0
        fi

        now="$(date +%s)"
        changed=0
        while IFS='|' read -r pod created deleting phase node ready; do
          [ -n "${pod}" ] || continue
          if [ -n "${deleting}" ]; then
            echo "pod=${pod} action=retain reason=already-terminating"
            continue
          fi
          created_epoch="$(date -d "${created}" +%s 2>/dev/null || printf '%s' "${now}")"
          age=$((now - created_epoch))
          reason=""
          case "${phase}" in
            Failed|Unknown)
              reason="terminal-${phase}"
              ;;
            Pending)
              if [ -z "${node}" ] && [ "${age}" -ge "${min_age}" ]; then
                reason="unscheduled-pending"
              fi
              ;;
          esac
          if [ -z "${reason}" ]; then
            echo "pod=${pod} action=retain phase=${phase:-unknown} node=${node:-none} age_seconds=${age}"
            continue
          fi
          echo "pod=${pod} action=delete-stale-forgejo-pod reason=${reason} age_seconds=${age}"
          "$K" --kubeconfig "$C" -n "$ns" delete "pod/${pod}" \
            --ignore-not-found=true --wait=false
          changed=1
        done <<<"${pod_lines}"

        if [ "${changed}" -eq 0 ]; then
          echo "forgejo_stale_pod_recycle=not-needed"
        else
          echo "forgejo_stale_pod_recycle=requested"
        fi
      args:
        executable: /bin/bash
      register: forgejo_stale_pod_recycle
      changed_when: "'action=delete-stale-forgejo-pod' in forgejo_stale_pod_recycle.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Print Forgejo stale pod recovery
      ansible.builtin.debug:
        var: forgejo_stale_pod_recycle.stdout_lines
      run_once: true

    - block:
        - name: Wait for a ready Forgejo backend and service endpoint
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            ns={{ platform_forgejo_namespace_effective | quote }}

            pod_lines="$("$K" --kubeconfig "$C" -n "$ns" get pods \
              -l app.kubernetes.io/name=forgejo \
              -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.status.phase}{"|"}{.spec.nodeName}{"|"}{range .status.conditions[?(@.type=="Ready")]}{.status}{end}{"\n"}{end}' \
              2>/dev/null || true)"
            ready_pods="$(printf '%s\n' "${pod_lines}" | awk -F'|' '$4 == "True" { count++ } END { print count + 0 }')"
            endpoint_lines="$("$K" --kubeconfig "$C" -n "$ns" get endpointslice \
              -l kubernetes.io/service-name=forgejo-http \
              -o jsonpath='{range .items[*].endpoints[*]}{.addresses[0]}{"|"}{.conditions.ready}{"\n"}{end}' \
              2>/dev/null || true)"
            ready_endpoints="$(printf '%s\n' "${endpoint_lines}" | awk -F'|' '$1 != "" && $2 != "false" { count++ } END { print count + 0 }')"

            printf '%s\n' "${pod_lines}"
            printf 'forgejo_ready_pods=%s forgejo_ready_endpoints=%s\n' \
              "${ready_pods}" "${ready_endpoints}"
            test "${ready_pods}" -ge 1
            test "${ready_endpoints}" -ge 1
          args:
            executable: /bin/bash
          register: forgejo_backend_ready
          retries: "{{ (((platform_forgejo_backend_ready_timeout_effective | int) / 10) | round(0, 'ceil') | int) + 1 }}"
          delay: 10
          until: forgejo_backend_ready.rc == 0
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

      rescue:
        - name: Collect Forgejo backend recovery failure diagnostics
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            ns={{ platform_forgejo_namespace_effective | quote }}
            pvc={{ platform_forgejo_pvc_name_effective | quote }}

            echo "===== Forgejo workloads ====="
            "$K" --kubeconfig "$C" -n "$ns" get deployment,statefulset,replicaset,pods -o wide || true
            echo "===== Forgejo service endpoints ====="
            "$K" --kubeconfig "$C" -n "$ns" get service,endpointslice -o wide || true
            echo "===== Forgejo scheduling and mount events ====="
            for pod in $("$K" --kubeconfig "$C" -n "$ns" get pods \
              -l app.kubernetes.io/name=forgejo -o name 2>/dev/null); do
              echo "===== ${pod} ====="
              "$K" --kubeconfig "$C" -n "$ns" describe "$pod" | sed -n '/Events:/,$p' || true
            done
            echo "===== Node capacity and conditions ====="
            "$K" --kubeconfig "$C" get nodes \
              -o custom-columns='NAME:.metadata.name,CPU:.status.allocatable.cpu,MEMORY:.status.allocatable.memory,EPHEMERAL:.status.allocatable.ephemeral-storage,TAINTS:.spec.taints' || true
            echo "===== Forgejo PVC and Longhorn volume ====="
            "$K" --kubeconfig "$C" -n "$ns" get "pvc/${pvc}" -o wide || true
            pv="$("$K" --kubeconfig "$C" -n "$ns" get "pvc/${pvc}" -o jsonpath='{.spec.volumeName}' 2>/dev/null || true)"
            handle=""
            if [ -n "${pv}" ]; then
              "$K" --kubeconfig "$C" get "pv/${pv}" -o wide || true
              handle="$("$K" --kubeconfig "$C" get "pv/${pv}" -o jsonpath='{.spec.csi.volumeHandle}' 2>/dev/null || true)"
            fi
            if [ -n "${handle}" ]; then
              "$K" --kubeconfig "$C" -n longhorn-system get \
                "volumes.longhorn.io/${handle}" -o wide || true
              "$K" --kubeconfig "$C" -n longhorn-system get replicas.longhorn.io \
                -l "longhornvolume=${handle}" -o wide || true
            fi
            echo "===== Volume attachments ====="
            if [ -n "${handle}" ]; then
              "$K" --kubeconfig "$C" get volumeattachment -o wide | \
                { grep -F "${handle}" || true; }
            else
              echo "No Forgejo Longhorn volume handle was resolved."
            fi
            echo "===== Recent Forgejo events ====="
            "$K" --kubeconfig "$C" -n "$ns" get events --sort-by=.lastTimestamp | tail -120 || true
          args:
            executable: /bin/bash
          register: forgejo_backend_recovery_failure
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Stop when Forgejo backend recovery remains incomplete
          ansible.builtin.fail:
            msg: |-
              Forgejo still has no ready Kubernetes Service endpoint after
              {{ platform_forgejo_backend_ready_timeout_effective }}s.

              The recovery did not delete the Forgejo PVC, PV, Longhorn volume,
              or any Longhorn replica. Do not enable
              PLATFORM_FORGEJO_RESET_STUCK_PVC for an instance that may contain
              repositories or other data.

              Diagnostics:
              {{ forgejo_backend_recovery_failure.stdout }}
          run_once: true

    - name: Show Forgejo storage repair result
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        ns={{ platform_forgejo_namespace_effective | quote }}

        echo "===== Argo CD Forgejo app ====="
        "$K" --kubeconfig "$C" -n argocd get application/forgejo -o wide || true
        echo "===== Forgejo resources ====="
        "$K" --kubeconfig "$C" -n "$ns" get deployment,statefulset,pods,pvc,svc,ingress -o wide || true
        echo "===== Longhorn nodes ====="
        if "$K" --kubeconfig "$C" get crd/nodes.longhorn.io >/dev/null 2>&1; then
          "$K" --kubeconfig "$C" -n longhorn-system get nodes.longhorn.io -o wide || true
        fi
        echo "===== Longhorn volumes ====="
        if "$K" --kubeconfig "$C" get crd/volumes.longhorn.io >/dev/null 2>&1; then
          "$K" --kubeconfig "$C" -n longhorn-system get volumes.longhorn.io -o wide || true
        fi
      args:
        executable: /bin/bash
      register: forgejo_storage_repair_result
      changed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Print Forgejo storage repair result
      ansible.builtin.debug:
        var: forgejo_storage_repair_result.stdout_lines
      run_once: true
