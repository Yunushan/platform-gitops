---
- name: Prepare Ansible root temporary directory
  hosts: rke2_servers
  become: true
  gather_facts: false
  tasks:
    - name: Ensure root Ansible temporary directory exists
      ansible.builtin.raw: install -d -m 0700 -o root -g root /root/.ansible/tmp
      changed_when: false

- name: Prepare Linux nodes for RKE2
  hosts: rke2_servers
  become: true
  vars:
    rke2_packages_by_os_family:
      RedHat:
        - curl
        - tar
        - iptables
        - iscsi-initiator-utils
        - nfs-utils
        - chrony
        - cryptsetup
      Debian:
        - curl
        - tar
        - iptables
        - open-iscsi
        - nfs-common
        - chrony
        - cryptsetup
      Suse:
        - curl
        - tar
        - iptables
        - open-iscsi
        - nfs-client
        - chrony
        - cryptsetup
      Archlinux:
        - curl
        - tar
        - iptables-nft
        - open-iscsi
        - nfs-utils
        - chrony
        - cryptsetup
      Gentoo:
        - net-misc/curl
        - app-arch/tar
        - net-firewall/iptables
        - sys-block/open-iscsi
        - net-fs/nfs-utils
        - net-misc/chrony
        - sys-fs/cryptsetup
    rke2_iscsi_service_by_os_family:
      RedHat: iscsid
      Debian: iscsid
      Suse: iscsid
      Archlinux: iscsid
      Gentoo: iscsid
    rke2_time_service_by_os_family:
      RedHat: chronyd
      Debian: chrony
      Suse: chronyd
      Archlinux: chronyd
      Gentoo: chronyd
    rke2_firewalld_ports:
      - 6443/tcp
      - 9345/tcp
      - 2379-2380/tcp
      - 10250/tcp
      - 4240/tcp
      - 4244/tcp
      - 8472/udp
      - 6081/udp
      - 30000-32767/tcp
      - 30000-32767/udp
    rke2_default_cluster_cidr: "{{ ['10', '42', '0', '0'] | join('.') }}/16"
    rke2_firewalld_trusted_sources:
      - "{{ rke2_cluster_cidr | default(rke2_default_cluster_cidr, true) }}"
    rke2_firewalld_trusted_interfaces:
      - cilium_host
      - cilium_net
      - cilium_vxlan
    rke2_core_kernel_modules:
      - br_netfilter
      - overlay
      - nf_conntrack
    rke2_optional_kernel_modules:
      - iscsi_tcp
  handlers:
    - name: Reload firewalld
      ansible.builtin.command: firewall-cmd --reload
      changed_when: true
  tasks:
    - name: Show detected operating system
      ansible.builtin.debug:
        msg: "Preparing {{ ansible_distribution }} {{ ansible_distribution_version }} (family {{ ansible_os_family }}) for RKE2."

    - name: Ensure node hostname matches inventory identity
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Ensure required packages are present
      ansible.builtin.package:
        name: "{{ rke2_packages_by_os_family.get(ansible_os_family, ['curl', 'tar', 'iptables']) }}"
        state: present

    - name: Disable active swap for Kubernetes
      ansible.builtin.command: swapoff -a
      changed_when: ansible_swaptotal_mb | default(0) | int > 0
      when: ansible_swaptotal_mb | default(0) | int > 0

    - name: Disable swap entries in fstab for Kubernetes
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#]\S+\s+\S+\s+swap\s+.*)$'
        replace: '# disabled by platform-gitops RKE2 prepare: \1'
        backup: true

    - name: Install nf_conntrack package on RHEL 10 compatible systems
      ansible.builtin.package:
        name: kernel-modules-extra
        state: present
      when:
        - ansible_os_family == "RedHat"
        - ansible_distribution in ["RedHat", "Rocky", "AlmaLinux", "OracleLinux", "CentOS", "CentOS Stream"]
        - ansible_distribution_major_version | int >= 10

    - name: Persist core Kubernetes kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/rke2.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          {% for module in rke2_core_kernel_modules %}
          {{ module }}
          {% endfor %}

    - name: Load core Kubernetes kernel modules
      ansible.builtin.command: "modprobe {{ item }}"
      changed_when: false
      loop: "{{ rke2_core_kernel_modules }}"

    - name: Load optional storage kernel modules
      ansible.builtin.command: "modprobe {{ item }}"
      register: rke2_optional_kernel_module_load
      changed_when: false
      failed_when: false
      loop: "{{ rke2_optional_kernel_modules }}"

    - name: Verify core Kubernetes kernel modules are loaded
      ansible.builtin.shell: |
        set -eu
        for module in {{ rke2_core_kernel_modules | join(' ') }}; do
          lsmod | awk '{print $1}' | grep -Fx "${module}" >/dev/null
        done
      args:
        executable: /bin/bash
      changed_when: false

    - name: Configure NetworkManager to ignore Kubernetes CNI interfaces
      ansible.builtin.copy:
        dest: /etc/NetworkManager/conf.d/99-rke2-cni.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [keyfile]
          unmanaged-devices=interface-name:cni*;interface-name:flannel*;interface-name:cilium*;interface-name:lxc*;interface-name:veth*;interface-name:calico*;interface-name:tunl*
      register: rke2_networkmanager_cni_config
      when: ansible_service_mgr == "systemd"

    - name: Reload NetworkManager configuration when available
      ansible.builtin.command: nmcli general reload
      register: rke2_networkmanager_reload
      changed_when: rke2_networkmanager_cni_config.changed | default(false)
      failed_when: false
      when: rke2_networkmanager_cni_config.changed | default(false)

    - name: Write Kubernetes sysctl baseline
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-rke2.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          net.ipv4.ip_forward=1
          net.ipv4.conf.all.rp_filter=0
          net.ipv4.conf.default.rp_filter=0
          net.bridge.bridge-nf-call-iptables=1
          net.bridge.bridge-nf-call-ip6tables=1
          fs.inotify.max_user_instances=8192
          fs.inotify.max_user_watches=524288

    - name: Apply sysctl baseline
      ansible.builtin.command: sysctl --system
      changed_when: false

    - name: Disable reverse path filtering on active interfaces
      ansible.builtin.shell: |
        set -u
        for path in /proc/sys/net/ipv4/conf/*/rp_filter; do
          if [ -w "${path}" ]; then
            printf '0\n' > "${path}" || true
          fi
        done
        grep -H . /proc/sys/net/ipv4/conf/*/rp_filter 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    - name: Verify RKE2 host kernel prerequisites
      ansible.builtin.shell: |
        set -eu
        test -z "$(swapon --noheadings)"
        test "$(sysctl -n net.ipv4.ip_forward)" = "1"
        test "$(sysctl -n net.bridge.bridge-nf-call-iptables)" = "1"
        test "$(sysctl -n net.bridge.bridge-nf-call-ip6tables)" = "1"
        {% if ansible_os_family == "RedHat" and (ansible_distribution_major_version | int) >= 10 %}
        rpm -q kernel-modules-extra >/dev/null
        modprobe nf_conntrack
        {% endif %}
      args:
        executable: /bin/bash
      changed_when: false

    - name: Enable iSCSI service when available
      ansible.builtin.service:
        name: "{{ rke2_iscsi_service_by_os_family.get(ansible_os_family, 'iscsid') }}"
        enabled: true
        state: started
      register: rke2_iscsi_service_enable
      failed_when: false

    - name: Enable time synchronization service when available
      ansible.builtin.service:
        name: "{{ rke2_time_service_by_os_family.get(ansible_os_family, 'chronyd') }}"
        enabled: true
        state: started
      register: rke2_time_service_enable
      failed_when: false

    - name: Prune transient CNI interfaces from permanent firewalld trust
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/../../scripts/cleanup_firewalld_cni_interfaces.py --path /etc/firewalld/zones/trusted.xml"
        executable: /usr/bin/python3
      register: rke2_firewalld_interface_cleanup
      changed_when: >-
        'firewalld_ephemeral_interface_cleanup=changed' in
        (rke2_firewalld_interface_cleanup.stdout | default(''))

    - name: Restore firewalld trusted zone SELinux context after cleanup
      ansible.builtin.command: restorecon -F /etc/firewalld/zones/trusted.xml
      register: rke2_firewalld_interface_cleanup_restorecon
      changed_when: false
      failed_when: false
      when: rke2_firewalld_interface_cleanup is changed

    - name: Check firewalld state
      ansible.builtin.command: firewall-cmd --state
      register: rke2_firewalld_state
      changed_when: false
      failed_when: false

    - name: Query required RKE2 firewalld ports
      ansible.builtin.command: "firewall-cmd --permanent --query-port={{ item }}"
      register: rke2_firewalld_port_queries
      changed_when: false
      failed_when: false
      loop: "{{ rke2_firewalld_ports }}"
      when: rke2_firewalld_state.rc == 0

    - name: Open required RKE2 firewalld ports
      ansible.builtin.command: "firewall-cmd --permanent --add-port={{ item.item }}"
      changed_when: true
      loop: "{{ rke2_firewalld_port_queries.results | default([]) }}"
      when:
        - rke2_firewalld_state.rc == 0
        - (item.rc | default(0)) != 0
      notify: Reload firewalld

    - name: Query trusted RKE2 pod CIDR firewalld sources
      ansible.builtin.command: "firewall-cmd --permanent --zone=trusted --query-source={{ item }}"
      register: rke2_firewalld_source_queries
      changed_when: false
      failed_when: false
      loop: "{{ rke2_firewalld_trusted_sources }}"
      when: rke2_firewalld_state.rc == 0

    - name: Trust RKE2 pod CIDR firewalld sources
      ansible.builtin.command: "firewall-cmd --permanent --zone=trusted --add-source={{ item.item }}"
      register: rke2_firewalld_trust_sources
      changed_when: rke2_firewalld_trust_sources.rc == 0
      failed_when: false
      loop: "{{ rke2_firewalld_source_queries.results | default([]) }}"
      when:
        - rke2_firewalld_state.rc == 0
        - item.rc != 0
      notify: Reload firewalld

    - name: Query trusted RKE2 node IP firewalld sources
      ansible.builtin.command: "firewall-cmd --permanent --zone=trusted --query-source={{ (hostvars[item].ansible_host | default(item)) ~ '/32' }}"
      register: rke2_firewalld_node_source_queries
      changed_when: false
      failed_when: false
      loop: "{{ groups['rke2_servers'] | default([]) }}"
      when:
        - rke2_firewalld_state.rc == 0
        - (hostvars[item].ansible_host | default(item)) is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')

    - name: Trust RKE2 node IP firewalld sources
      ansible.builtin.command: "firewall-cmd --permanent --zone=trusted --add-source={{ (hostvars[item.item].ansible_host | default(item.item)) ~ '/32' }}"
      register: rke2_firewalld_trust_node_sources
      changed_when: rke2_firewalld_trust_node_sources.rc == 0
      failed_when: false
      loop: "{{ rke2_firewalld_node_source_queries.results | default([]) }}"
      when:
        - rke2_firewalld_state.rc == 0
        - (item.rc | default(0)) != 0
      notify: Reload firewalld

    - name: Query trusted Cilium firewalld interfaces
      ansible.builtin.command: "firewall-cmd --permanent --zone=trusted --query-interface={{ item }}"
      register: rke2_firewalld_interface_queries
      changed_when: false
      failed_when: false
      loop: "{{ rke2_firewalld_trusted_interfaces }}"
      when: rke2_firewalld_state.rc == 0

    - name: Trust Cilium firewalld interfaces
      ansible.builtin.command: "firewall-cmd --permanent --zone=trusted --change-interface={{ item.item }}"
      register: rke2_firewalld_trust_interfaces
      changed_when: rke2_firewalld_trust_interfaces.rc == 0
      failed_when: false
      loop: "{{ rke2_firewalld_interface_queries.results | default([]) }}"
      when:
        - rke2_firewalld_state.rc == 0
        - item.rc != 0
      notify: Reload firewalld

    - name: Install direct CNI firewalld accept rules
      ansible.builtin.shell: |
        set -u
        changed=false
        pod_cidrs="{{ rke2_firewalld_trusted_sources | join(' ') }}"

        add_direct_rule() {
          family="$1"
          table="$2"
          chain="$3"
          priority="$4"
          shift 4
          if ! firewall-cmd --permanent --direct --query-rule "${family}" "${table}" "${chain}" "${priority}" "$@" >/dev/null 2>&1; then
            if firewall-cmd --permanent --direct --add-rule "${family}" "${table}" "${chain}" "${priority}" "$@"; then
              changed=true
              echo "added direct rule: ${family} ${table} ${chain} ${priority} $*"
            fi
          fi
        }

        for source in ${pod_cidrs}; do
          case "${source}" in
            ''|*[!0-9./]*) continue ;;
          esac
          add_direct_rule ipv4 filter INPUT 0 -s "${source}" -j ACCEPT
          add_direct_rule ipv4 filter OUTPUT 0 -d "${source}" -j ACCEPT
          # RKE2 commonly allocates one pod CIDR per node, so every
          # source CIDR must be allowed to reach every destination CIDR.
          for destination in ${pod_cidrs}; do
            case "${destination}" in
              ''|*[!0-9./]*) continue ;;
            esac
            add_direct_rule ipv4 filter FORWARD 0 \
              -s "${source}" -d "${destination}" -j ACCEPT
          done
        done

        for prefix in cilium+ lxc+ cni+ veth+; do
          add_direct_rule ipv4 filter FORWARD 0 -i "${prefix}" -j ACCEPT
          add_direct_rule ipv4 filter FORWARD 0 -o "${prefix}" -j ACCEPT
        done

        firewall-cmd --direct --get-all-rules || true
        echo "changed=${changed}"
      args:
        executable: /bin/bash
      register: rke2_firewalld_direct_cni_rules
      changed_when: "'changed=true' in (rke2_firewalld_direct_cni_rules.stdout | default(''))"
      failed_when: false
      when: rke2_firewalld_state.rc == 0
      notify: Reload firewalld

    - name: Show skipped firewalld configuration
      ansible.builtin.debug:
        msg: "firewalld is not active on this node; skipping firewalld port, pod CIDR, and Cilium interface configuration."
      when: rke2_firewalld_state.rc != 0

    - name: Remind about distro support tier
      ansible.builtin.debug:
        msg: "Verify this node OS against docs/NODE_OS_SUPPORT.md before production use."
