---
- name: Verify platform application ingress and service health
  hosts: rke2_servers
  become: true
  gather_facts: false
  vars:
    rke2_first_server: "{{ groups['rke2_servers'][0] }}"
    rke2_ingress_vip_effective: "{{ rke2_ingress_vip | default(ingress_vip | default('', true), true) }}"
    platform_domain_effective: "{{ platform_domain | default(rke2_platform_domain | default((rke2_api_dns | default('', true)) | regex_replace('^api[.]', ''), true), true) }}"
    platform_app_health_connect_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_APP_HEALTH_CONNECT_TIMEOUT') }}"
    platform_app_health_max_time_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_APP_HEALTH_MAX_TIME') }}"
