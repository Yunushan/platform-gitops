            or (((hostvars[rke2_first_server].platform_app_health_argocd_source_probe | default({'rc': 1})).rc | int) != 0)
            or (((hostvars[rke2_first_server].platform_app_health_pod_probe | default({'rc': 1})).rc | int) != 0)
            or (((hostvars[rke2_first_server].platform_app_health_argocd_runtime_probe | default({'rc': 1})).rc | int) != 0)
