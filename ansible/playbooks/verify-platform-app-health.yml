    platform_app_health_velero_backup_storage_effective: "{{ platform_app_health_velero_backup_storage | default(platform_app_health_velero_backup_storage_from_env, true) | default(true, true) | bool }}"
    platform_app_health_velero_schedules_effective: "{{ platform_app_health_velero_schedules | default(platform_app_health_velero_schedules_from_env, true) | default(true, true) | bool }}"
    platform_app_health_app_secrets_effective: "{{ platform_app_health_app_secrets | default(platform_app_health_app_secrets_from_env, true) | default('auto', true) }}"
    platform_app_health_harbor_production_secrets_effective: "{{ platform_app_health_harbor_production_secrets | default(platform_app_health_harbor_production_secrets_from_env, true) | default(false, true) | bool }}"
