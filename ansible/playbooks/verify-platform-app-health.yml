        failed=0
        GUI_HOSTS_FILE="$(mktemp)"
        cat >"${GUI_HOSTS_FILE}" <<'GUIHOSTS'
        {% for entry in platform_gui_host_entries %}
        {{ entry.app }}|{{ entry.namespace }}|{{ entry.host }}
        {% endfor %}
        GUIHOSTS

        if [ "${REQUIRE_HTTP_REDIRECT}" != "true" ]; then
          echo "result=skip reason=http-redirect-check-disabled"
          rm -f "${GUI_HOSTS_FILE}"
          exit 0
        fi

        probe_http_redirect() {
          name="$1"
          host="$2"
          url="http://${host}/"

          echo "===== ${name} HTTP redirect from Ansible controller ====="
          echo "url=${url} vip=${VIP}"

          if ! command -v curl >/dev/null 2>&1; then
            echo "result=fail reason=curl-not-installed"
            failed=1
            return
          fi

          result="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}|%{redirect_url}' \
            --connect-timeout "${CONNECT_TIMEOUT}" \
            --max-time "${MAX_TIME}" \
            --resolve "${host}:80:${VIP}" \
            "${url}" 2>/tmp/platform-app-health-http-redirect-curl.err || true)"

          stderr="$(cat /tmp/platform-app-health-http-redirect-curl.err 2>/dev/null || true)"
          rm -f /tmp/platform-app-health-http-redirect-curl.err
          http_code="${result%%|*}"
          redirect_url="${result#*|}"
          echo "http_code=${http_code:-000}"
          echo "redirect_url=${redirect_url}"
          if [ -n "${stderr}" ]; then
            printf '%s\n' "${stderr}" | sed 's/^/stderr=/'
          fi

          case "${http_code}" in
            301|302|303|307|308) ;;
            *)
              echo "result=fail"
              failed=1
              return
              ;;
          esac

          case "${redirect_url}" in
            "https://${host}"|"https://${host}/"|"https://${host}/"*|"https://${host}:443"|"https://${host}:443/"*)
              echo "result=ok"
              ;;
            *)
              echo "result=fail"
              failed=1
              ;;
          esac
        }

        while IFS='|' read -r app namespace host; do
          [ -n "${host}" ] || continue
          case " ${GUI_APPS} " in
            *" ${app} "*) ;;
            *)
              echo "===== ${app} HTTP redirect from Ansible controller ====="
              echo "result=skip reason=not-required-by-platform-app-health-gui-apps"
              continue
              ;;
          esac
          probe_http_redirect "${app}" "${host}"
        done <"${GUI_HOSTS_FILE}"
        rm -f "${GUI_HOSTS_FILE}"
        exit "${failed}"
      args:
        executable: /bin/bash
      register: platform_app_health_http_redirect_probe
      changed_when: false
      failed_when: false
      delegate_to: localhost
      become: false
      run_once: true

