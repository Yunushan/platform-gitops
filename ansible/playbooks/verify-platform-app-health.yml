    platform_sso_argocd_secret_name_effective: "{{ platform_sso_argocd_secret_name | default(platform_sso_argocd_secret_name_from_env, true) | default('platform-sso-argocd', true) }}"
    platform_sso_grafana_secret_name_effective: "{{ platform_sso_grafana_secret_name | default(platform_sso_grafana_secret_name_from_env, true) | default('platform-sso-grafana', true) }}"
    platform_sso_prometheus_secret_name_effective: "{{ platform_sso_prometheus_secret_name | default(platform_sso_prometheus_secret_name_from_env, true) | default('platform-sso-prometheus', true) }}"
    platform_grafana_admin_secret_name_effective: "{{ platform_grafana_admin_secret_name | default(platform_grafana_admin_secret_name_from_env, true) | default('grafana-admin', true) }}"
    platform_grafana_database_secret_name_effective: "{{ platform_grafana_database_secret_name | default(platform_grafana_database_secret_name_from_env, true) | default('grafana-database', true) }}"
