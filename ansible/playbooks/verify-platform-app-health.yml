    - name: Probe Argo CD and Woodpecker ClusterIP service paths from every RKE2 node
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        CONNECT_TIMEOUT={{ platform_app_health_connect_timeout_effective }}
        MAX_TIME={{ platform_app_health_max_time_effective }}
        failed=0

        tcp_probe() {
          name="$1"
          host="$2"
          port="$3"

          echo "===== ${name} tcp service path from $(hostname -f 2>/dev/null || hostname) ====="
          echo "target=${host}:${port}"
          if timeout "${CONNECT_TIMEOUT}" bash -c "cat < /dev/null > /dev/tcp/${host}/${port}" 2>/tmp/platform-app-health-tcp.err; then
            echo "result=ok"
          else
            echo "result=fail"
            if [ -s /tmp/platform-app-health-tcp.err ]; then
              sed 's/^/stderr=/' /tmp/platform-app-health-tcp.err
            fi
            failed=1
          fi
          rm -f /tmp/platform-app-health-tcp.err
        }

        http_probe() {
          name="$1"
          host="$2"
          port="$3"
          path="$4"

          echo "===== ${name} http service path from $(hostname -f 2>/dev/null || hostname) ====="
          echo "target=http://${host}:${port}${path}"
          if ! command -v curl >/dev/null 2>&1; then
            echo "result=skip reason=curl-not-installed"
            return
          fi

          code="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' \
            --connect-timeout "${CONNECT_TIMEOUT}" \
            --max-time "${MAX_TIME}" \
            "http://${host}:${port}${path}" 2>/tmp/platform-app-health-service-curl.err || true)"
          stderr="$(cat /tmp/platform-app-health-service-curl.err 2>/dev/null || true)"
          rm -f /tmp/platform-app-health-service-curl.err
          echo "http_code=${code:-000}"
          if [ -n "${stderr}" ]; then
            printf '%s\n' "${stderr}" | sed 's/^/stderr=/'
          fi

          case "${code}" in
            200|301|302|303|307|308|401|403|404)
              echo "result=ok"
              ;;
            *)
              echo "result=fail"
              failed=1
              ;;
          esac
        }

        argocd_service=argocd-server
        if "$K" --kubeconfig "$C" -n argocd get service/argo-cd-argocd-server >/dev/null 2>&1; then
          argocd_service=argo-cd-argocd-server
        fi
        argocd_ip="$("$K" --kubeconfig "$C" -n argocd get "service/${argocd_service}" -o jsonpath='{.spec.clusterIP}' 2>/dev/null || true)"
        woodpecker_ip="$("$K" --kubeconfig "$C" -n woodpecker get service woodpecker-server -o jsonpath='{.spec.clusterIP}' 2>/dev/null || true)"

        if [ -z "${argocd_ip}" ] || [ "${argocd_ip}" = "None" ]; then
          echo "argocd service clusterIP missing service=${argocd_service}"
          failed=1
        else
          tcp_probe "argocd-server" "${argocd_ip}" 80
          http_probe "argocd-server" "${argocd_ip}" 80 /
        fi

        if [ -z "${woodpecker_ip}" ] || [ "${woodpecker_ip}" = "None" ]; then
          echo "woodpecker service clusterIP missing"
          failed=1
        else
          tcp_probe "woodpecker-http" "${woodpecker_ip}" 80
          http_probe "woodpecker-http" "${woodpecker_ip}" 80 /
          tcp_probe "woodpecker-grpc" "${woodpecker_ip}" 9000
        fi

        exit "${failed}"
      args:
        executable: /bin/bash
      register: platform_app_health_service_probe
      changed_when: false
      failed_when: false

    - name: Print per-node service path probe results
      ansible.builtin.debug:
        var: platform_app_health_service_probe.stdout_lines

    - name: Probe Argo CD and Woodpecker ClusterIP service paths from pods pinned to every RKE2 node
      ansible.builtin.shell: |
        set -uo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        NAMESPACE=kube-system
        CHECK_NAME=platform-app-service-path-check
        CHECK_ID="$(date +%s)-$$"
        CHECK_IMAGE="{{ platform_app_health_service_check_image_effective }}"
        CONNECT_TIMEOUT={{ platform_app_health_connect_timeout_effective }}
        MAX_TIME={{ platform_app_health_max_time_effective }}
        JOB_TIMEOUT={{ platform_app_health_service_check_timeout_effective }}
        JOB_APPLY_ATTEMPTS={{ platform_app_health_service_check_create_attempts_effective }}
        failed=0

        safe_name() {
          printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9.-]+/-/g; s/^-+//; s/-+$//'
        }

        cleanup_previous() {
          "$K" --kubeconfig "$C" -n "${NAMESPACE}" delete job \
            -l "app.kubernetes.io/name=${CHECK_NAME}" \
            --ignore-not-found=true --wait=false >/dev/null 2>&1 || true
        }

        cleanup_previous
        nodes="$("$K" --kubeconfig "$C" get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)"
        if [ -z "${nodes}" ]; then
          echo "result=fail reason=no-kubernetes-nodes"
          exit 1
        fi

        argocd_service_dns=argocd-server.argocd.svc.cluster.local
        if "$K" --kubeconfig "$C" -n argocd get service/argo-cd-argocd-server >/dev/null 2>&1; then
          argocd_service_dns=argo-cd-argocd-server.argocd.svc.cluster.local
        fi

        expected=0
        created=0
        for node in ${nodes}; do
          expected=$((expected + 1))
          node_safe="$(safe_name "${node}")"
          job_name="platform-app-svc-${node_safe}-${CHECK_ID}"
          job_manifest="$(mktemp)"
          cat >"${job_manifest}" <<YAML
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: ${job_name}
          namespace: ${NAMESPACE}
          labels:
            app.kubernetes.io/name: ${CHECK_NAME}
            platform.gitops/check-id: ${CHECK_ID}
            platform.gitops/node: ${node_safe}
        spec:
          backoffLimit: 0
          activeDeadlineSeconds: ${JOB_TIMEOUT}
          ttlSecondsAfterFinished: 300
          template:
            metadata:
              labels:
                app.kubernetes.io/name: ${CHECK_NAME}
                platform.gitops/check-id: ${CHECK_ID}
                platform.gitops/node: ${node_safe}
            spec:
              restartPolicy: Never
              nodeName: "${node}"
              tolerations:
                - operator: Exists
              containers:
                - name: check
                  image: "${CHECK_IMAGE}"
                  imagePullPolicy: IfNotPresent
                  env:
                    - name: CONNECT_TIMEOUT
                      value: "${CONNECT_TIMEOUT}"
                    - name: MAX_TIME
                      value: "${MAX_TIME}"
                    - name: ARGOCD_SERVICE_DNS
                      value: "${argocd_service_dns}"
                  command:
                    - sh
                    - -c
                  args:
                    - |
                      set -u
                      failed=0
                      http_ok_code() {
                        case "\$1" in
                          200|301|302|303|307|308|401|403|404) return 0 ;;
                          *) return 1 ;;
                        esac
                      }
                      probe_http() {
                        name="\$1"
                        host="\$2"
                        port="\$3"
                        path="\$4"
                        echo "===== \${name} pod HTTP service path from \$(hostname) ====="
                        echo "target=http://\${host}:\${port}\${path}"
                        stderr=""
                        if command -v curl >/dev/null 2>&1; then
                          code="\$(curl --silent --show-error --output /dev/null \
                            --write-out '%{http_code}' \
                            --connect-timeout "\${CONNECT_TIMEOUT}" \
                            --max-time "\${MAX_TIME}" \
                            "http://\${host}:\${port}\${path}" 2>/tmp/platform-app-health-pod-http.err || true)"
                          stderr="\$(cat /tmp/platform-app-health-pod-http.err 2>/dev/null || true)"
                          rm -f /tmp/platform-app-health-pod-http.err
                        elif command -v wget >/dev/null 2>&1; then
                          wget -S --spider -T "\${MAX_TIME}" \
                            "http://\${host}:\${port}\${path}" >/tmp/platform-app-health-pod-http.out 2>/tmp/platform-app-health-pod-http.err || true
                          stderr="\$(cat /tmp/platform-app-health-pod-http.err 2>/dev/null || true)"
                          code="\$(printf '%s\n' "\${stderr}" | sed -n 's/.*HTTP\/[0-9.]* \([0-9][0-9][0-9]\).*/\1/p' | tail -n 1)"
                          rm -f /tmp/platform-app-health-pod-http.out /tmp/platform-app-health-pod-http.err
                        else
                          echo "result=fail reason=no-curl-or-wget"
                          failed=1
                          return
                        fi
                        echo "http_code=\${code:-000}"
                        if [ -n "\${stderr}" ]; then
                          printf '%s\n' "\${stderr}" | sed 's/^/stderr=/'
                        fi
                        if http_ok_code "\${code}"; then
                          echo "result=ok"
                        else
                          echo "result=fail"
                          failed=1
                        fi
                      }
                      probe_tcp() {
                        name="\$1"
                        host="\$2"
                        port="\$3"
                        echo "===== \${name} pod TCP service path from \$(hostname) ====="
                        echo "target=\${host}:\${port}"
                        stderr=""
                        if command -v curl >/dev/null 2>&1; then
                          curl --silent --show-error --output /dev/null \
                            --connect-timeout "\${CONNECT_TIMEOUT}" \
                            --max-time "\${MAX_TIME}" \
                            "http://\${host}:\${port}/" >/tmp/platform-app-health-pod-tcp.out 2>/tmp/platform-app-health-pod-tcp.err
                          rc="\$?"
                          stderr="\$(cat /tmp/platform-app-health-pod-tcp.err 2>/dev/null || true)"
                          rm -f /tmp/platform-app-health-pod-tcp.out /tmp/platform-app-health-pod-tcp.err
                          echo "curl_rc=\${rc}"
                          case "\${rc}" in
                            0|52|56)
                              echo "result=ok"
                              return
                              ;;
                          esac
                        elif command -v nc >/dev/null 2>&1; then
                          nc -z -w "\${CONNECT_TIMEOUT}" "\${host}" "\${port}" >/tmp/platform-app-health-pod-tcp.out 2>/tmp/platform-app-health-pod-tcp.err
                          rc="\$?"
                          stderr="\$(cat /tmp/platform-app-health-pod-tcp.err 2>/dev/null || true)"
                          rm -f /tmp/platform-app-health-pod-tcp.out /tmp/platform-app-health-pod-tcp.err
                          echo "nc_rc=\${rc}"
                          if [ "\${rc}" -eq 0 ]; then
                            echo "result=ok"
                            return
                          fi
                        else
                          echo "result=fail reason=no-curl-or-nc"
                          failed=1
                          return
                        fi
                        if [ -n "\${stderr}" ]; then
                          printf '%s\n' "\${stderr}" | sed 's/^/stderr=/'
                        fi
                        echo "result=fail"
                        failed=1
                      }

                      probe_http argocd-server "\${ARGOCD_SERVICE_DNS}" 80 /
                      probe_http woodpecker-http woodpecker-server.woodpecker.svc.cluster.local 80 /
                      probe_tcp woodpecker-grpc woodpecker-server.woodpecker.svc.cluster.local 9000
                      exit "\${failed}"
        YAML
          manifest_bytes="$(wc -c <"${job_manifest}" | tr -d '[:space:]')"
          echo "job_manifest node=${node} job=${job_name} bytes=${manifest_bytes:-0}"
          apply_attempt=1
          apply_rc=1
          while [ "${apply_attempt}" -le "${JOB_APPLY_ATTEMPTS}" ]; do
            apply_output="$("$K" --kubeconfig "$C" apply -f "${job_manifest}" 2>&1)"
            apply_rc=$?
            echo "job_apply node=${node} job=${job_name} attempt=${apply_attempt}/${JOB_APPLY_ATTEMPTS} rc=${apply_rc}"
            if [ -n "${apply_output}" ]; then
              printf '%s\n' "${apply_output}" | sed 's/^/job_apply_output=/'
            fi
            if [ "${apply_rc}" -eq 0 ]; then
              created=$((created + 1))
              break
            fi
            apply_attempt=$((apply_attempt + 1))
            if [ "${apply_attempt}" -le "${JOB_APPLY_ATTEMPTS}" ]; then
              sleep 2
            fi
          done
          rm -f "${job_manifest}"
          if [ "${apply_rc}" -ne 0 ]; then
            echo "result=fail reason=service-path-check-job-create-failed node=${node} job=${job_name}"
            failed=1
          fi
        done

        echo "job_apply_summary expected=${expected} created=${created}"
        if [ "${created}" -gt 0 ]; then
          deadline=$(( $(date +%s) + JOB_TIMEOUT ))
          while [ "$(date +%s)" -lt "${deadline}" ]; do
            succeeded="$("$K" --kubeconfig "$C" -n "${NAMESPACE}" get jobs \
              -l "app.kubernetes.io/name=${CHECK_NAME},platform.gitops/check-id=${CHECK_ID}" \
              -o jsonpath='{range .items[*]}{.status.succeeded}{"\n"}{end}' 2>/dev/null |
              awk '{ total += $1 + 0 } END { print total + 0 }')"
            failed_jobs="$("$K" --kubeconfig "$C" -n "${NAMESPACE}" get jobs \
              -l "app.kubernetes.io/name=${CHECK_NAME},platform.gitops/check-id=${CHECK_ID}" \
              -o jsonpath='{range .items[*]}{.status.failed}{"\n"}{end}' 2>/dev/null |
              awk '{ total += $1 + 0 } END { print total + 0 }')"
            if [ "$((succeeded + failed_jobs))" -ge "${created}" ]; then
              break
            fi
            sleep 3
          done
        fi

        pods="$("$K" --kubeconfig "$C" -n "${NAMESPACE}" get pods \
          -l "app.kubernetes.io/name=${CHECK_NAME},platform.gitops/check-id=${CHECK_ID}" \
          -o name 2>/dev/null || true)"
        for pod in ${pods}; do
          node="$("$K" --kubeconfig "$C" -n "${NAMESPACE}" get "${pod}" -o jsonpath='{.spec.nodeName}' 2>/dev/null || true)"
          phase="$("$K" --kubeconfig "$C" -n "${NAMESPACE}" get "${pod}" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
          echo "===== ${pod} node=${node:-unknown} phase=${phase:-unknown} ====="
          "$K" --kubeconfig "$C" -n "${NAMESPACE}" logs "${pod}" || true
          if [ "${phase}" != "Succeeded" ]; then
            failed=1
          fi
        done

        pod_count="$(printf '%s\n' "${pods}" | awk 'NF { count++ } END { print count + 0 }')"
        if [ "${pod_count}" -lt "${expected}" ]; then
          echo "result=fail reason=missing-service-path-check-pods expected=${expected} actual=${pod_count}"
          echo "===== service-path check jobs ====="
          "$K" --kubeconfig "$C" -n "${NAMESPACE}" get jobs \
            -l "app.kubernetes.io/name=${CHECK_NAME},platform.gitops/check-id=${CHECK_ID}" -o wide 2>&1 || true
          echo "===== recent service-path check events ====="
          "$K" --kubeconfig "$C" -n "${NAMESPACE}" get events \
            --field-selector involvedObject.kind=Job --sort-by=.lastTimestamp 2>&1 | tail -40 || true
          failed=1
        fi

        "$K" --kubeconfig "$C" -n "${NAMESPACE}" delete job \
          -l "app.kubernetes.io/name=${CHECK_NAME},platform.gitops/check-id=${CHECK_ID}" \
          --ignore-not-found=true --wait=false >/dev/null 2>&1 || true

        exit "${failed}"
      args:
        executable: /bin/bash
      register: platform_app_health_pod_service_probe
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Print pod-pinned service path probe results
      ansible.builtin.debug:
        var: platform_app_health_pod_service_probe.stdout_lines
      run_once: true

    - name: Record per-node app health verdict
      ansible.builtin.set_fact:
