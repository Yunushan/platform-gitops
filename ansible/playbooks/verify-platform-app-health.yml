    - name: Verify Velero backup schedule readiness
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        required_apps="{{ platform_app_health_required_apps_effective }}"
        REQUIRE_VELERO_SCHEDULES="{{ platform_app_health_velero_schedules_effective | ternary('true', 'false') }}"
        failed=0

        echo "===== Velero backup schedule readiness ====="

        if [ "${REQUIRE_VELERO_SCHEDULES}" != "true" ]; then
          echo "result=skip reason=platform-app-health-velero-schedules-disabled"
          exit 0
        fi

        case " ${required_apps} " in
          *" velero "*) ;;
          *)
            echo "result=skip reason=velero-not-required-by-platform-app-health-required-apps"
            exit 0
            ;;
        esac

        if ! "$K" --kubeconfig "$C" get crd schedules.velero.io >/dev/null 2>&1; then
          echo "result=fail reason=velero-schedule-crd-missing"
          exit 1
        fi

        schedules="$("$K" --kubeconfig "$C" get schedules.velero.io -A \
          -o jsonpath='{range .items[*]}{.metadata.namespace}{"/"}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)"
        if [ -z "${schedules}" ]; then
          echo "result=fail reason=no-velero-backup-schedules"
          exit 1
        fi

        for schedule_ref in ${schedules}; do
          namespace="${schedule_ref%%/*}"
          name="${schedule_ref#*/}"
          echo "===== Velero Schedule ${schedule_ref} ====="
          info="$("$K" --kubeconfig "$C" -n "${namespace}" get "schedules.velero.io/${name}" \
            -o jsonpath='{.metadata.name}{"|"}{.spec.schedule}{"|"}{.spec.paused}{"|"}{.status.phase}{"|"}{.status.lastBackup}{"\n"}' 2>/dev/null || true)"
          schedule_name="$(printf '%s' "${info}" | cut -d'|' -f1)"
          cron="$(printf '%s' "${info}" | cut -d'|' -f2)"
          paused="$(printf '%s' "${info}" | cut -d'|' -f3)"
          phase="$(printf '%s' "${info}" | cut -d'|' -f4)"
          last_backup="$(printf '%s' "${info}" | cut -d'|' -f5)"
          echo "name=${schedule_name:-unknown} schedule=${cron:-none} paused=${paused:-false} phase=${phase:-unknown} lastBackup=${last_backup:-none}"

          schedule_failed=0
          if [ -z "${cron}" ]; then
            echo "result=fail reason=velero-schedule-cron-missing"
            schedule_failed=1
          fi
          if [ "${paused}" = "true" ] || [ "${paused}" = "True" ]; then
            echo "result=fail reason=velero-schedule-paused"
            schedule_failed=1
          fi
          if [ -n "${phase}" ] && [ "${phase}" != "Enabled" ] && [ "${phase}" != "New" ]; then
            echo "result=fail reason=velero-schedule-not-enabled"
            schedule_failed=1
          fi

          if [ "${schedule_failed}" -eq 0 ]; then
            echo "result=ok"
          else
            failed=1
          fi
        done

        exit "${failed}"
      args:
