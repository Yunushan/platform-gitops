      args:
        executable: /bin/bash
      register: platform_app_health_failure_diagnostics
      changed_when: false
      failed_when: false
      run_once: true
      when: ansible_play_hosts | map('extract', hostvars, 'platform_app_health_failed') | map('bool') | select('equalto', true) | list | length > 0

    - name: Print app health failure diagnostics
      ansible.builtin.debug:
        var: platform_app_health_failure_diagnostics.stdout_lines
      run_once: true
      when: platform_app_health_failure_diagnostics is defined and platform_app_health_failure_diagnostics.stdout_lines is defined

    - name: Build compact platform app health failure summary
      ansible.builtin.set_fact:
        platform_app_health_failure_summary: |-
          {% set probes = [
            ('Argo CD applications', hostvars[rke2_first_server].platform_app_health_argocd_app_probe | default(none)),
            ('Argo CD guarded pruning policy', hostvars[rke2_first_server].platform_app_health_argocd_guarded_prune_probe | default(none)),
            ('Argo CD source repositories', hostvars[rke2_first_server].platform_app_health_argocd_source_probe | default(none)),
            ('platform pod readiness', hostvars[rke2_first_server].platform_app_health_pod_probe | default(none)),
            ('Argo CD runtime', hostvars[rke2_first_server].platform_app_health_argocd_runtime_probe | default(none)),
            ('HA replica coverage', hostvars[rke2_first_server].platform_app_health_ha_replica_probe | default(none)),
            ('Forgejo singleton disruption safeguards', hostvars[rke2_first_server].platform_app_health_forgejo_singleton_safety_probe | default(none)),
            ('Woodpecker image tags', hostvars[rke2_first_server].platform_app_health_woodpecker_image_probe | default(none)),
            ('cert-manager Certificates', hostvars[rke2_first_server].platform_app_health_certificate_probe | default(none)),
            ('trust-manager Bundles', hostvars[rke2_first_server].platform_app_health_trust_bundle_probe | default(none)),
            ('step-ca API', hostvars[rke2_first_server].platform_app_health_step_ca_api_probe | default(none)),
            ('CloudNativePG clusters', hostvars[rke2_first_server].platform_app_health_cnpg_cluster_probe | default(none)),
            ('Loki API', hostvars[rke2_first_server].platform_app_health_loki_api_probe | default(none)),
            ('Velero backup storage', hostvars[rke2_first_server].platform_app_health_velero_backup_storage_probe | default(none)),
            ('Velero schedules', hostvars[rke2_first_server].platform_app_health_velero_schedule_probe | default(none)),
            ('generated app secrets', hostvars[rke2_first_server].platform_app_health_app_secret_probe | default(none)),
            ('StorageClasses', hostvars[rke2_first_server].platform_app_health_storage_class_probe | default(none)),
            ('PVCs', hostvars[rke2_first_server].platform_app_health_pvc_probe | default(none)),
            ('Longhorn runtime', hostvars[rke2_first_server].platform_app_health_longhorn_runtime_probe | default(none)),
            ('GUI backend endpoints', hostvars[rke2_first_server].platform_app_health_ingress_backend_probe | default(none)),
            ('controller app VIP ingress', hostvars[rke2_first_server].platform_app_health_controller_ingress_probe | default(none)),
            ('Harbor registry API', hostvars[rke2_first_server].platform_app_health_registry_api_probe | default(none)),
            ('Grafana/Prometheus API', hostvars[rke2_first_server].platform_app_health_monitoring_api_probe | default(none)),
            ('HTTP to HTTPS redirect', hostvars[rke2_first_server].platform_app_health_http_redirect_probe | default(none)),
            ('host ClusterIP service paths', platform_app_health_service_probe | default(none)),
            ('pod-pinned ClusterIP service paths', hostvars[rke2_first_server].platform_app_health_pod_service_probe | default(none))
          ] %}
          {% for label, probe in probes %}
          {% if probe is mapping and probe.rc is defined and (probe.rc | int) != 0 %}
          ===== {{ label }} =====
          rc={{ probe.rc | default('not run') }}
          {{ probe.stdout | default('not collected') }}
          {% endif %}
          {% endfor %}
          {% if (platform_app_health_node_ingress_strict_effective | bool) and (platform_app_health_ingress_probe is defined) and (platform_app_health_ingress_probe.rc is defined) and (platform_app_health_ingress_probe.rc | int) != 0 %}
          ===== strict node-originated app VIP ingress =====
          rc={{ platform_app_health_ingress_probe.rc | default('not run') }}
          {{ platform_app_health_ingress_probe.stdout | default('not collected') }}
          {% endif %}
      run_once: true
      when: ansible_play_hosts | map('extract', hostvars, 'platform_app_health_failed') | map('bool') | select('equalto', true) | list | length > 0

    - name: Stop when platform app health checks fail
      ansible.builtin.fail:
        msg: |
          Platform app health verification failed.

          Failed probe summary:
          {{ platform_app_health_failure_summary | default('not collected') }}

          At least one required Argo CD Application, live Argo CD guarded pruning policy, platform namespace,
          Argo CD source repository, Argo CD runtime component/service endpoint, critical HA workload replica contract,
          Forgejo singleton disruption safeguard, Woodpecker runtime image tag, cert-manager Certificate,
          trust-manager Bundle, step-ca API,
          CloudNativePG cluster, Loki API, Velero backup storage, Velero backup
          schedule, generated app secret contract, StorageClass, PVC, Longhorn
          runtime storage, app ingress backend, controller/client app VIP ingress
          path, Harbor registry API path, Grafana/Prometheus monitoring API path,
          HTTP-to-HTTPS redirect, strict node-originated app VIP ingress path,
          Kubernetes host ClusterIP service path, or Kubernetes pod-to-ClusterIP
          service path failed.

          Common causes are Traefik backend routing, kube-proxy/Cilium service
          routing, host firewall forwarding, or node-to-pod networking drift.
          The report above also fails when required Argo CD Applications are
          OutOfSync/Progressing/Degraded, have active Argo CD operations,
          do not enable self-healing and approval-gated foreground pruning in
          the final sync wave with empty-target protection,
          still use temporary seed Git or insecure git:// sources,
          differ from PLATFORM_APP_HEALTH_EXPECTED_REPO_URL / PLATFORM_REPO_URL
          when one is set,
          or when platform namespace pods are Pending,
          CrashLoopBackOff, otherwise not Ready, when the Argo CD server,
          repo-server, application-controller, configured repo-server service,
          or configured Redis service is missing or has no ready endpoint, when critical HA workloads do
          not have the expected minimum desired and ready replicas, when the
          singleton Forgejo deployment is not protected by a Recreate strategy
          and minAvailable=1 PodDisruptionBudget, when
          Woodpecker server or agent pods are not running the expected pinned
          image tag, cert-manager
          Certificates are missing or not Ready, trust-manager Bundles are missing or not synced,
          step-ca does not answer `/health` on its ClusterIP service, required
          CloudNativePG clusters are missing or not Ready, required StorageClasses
          are missing or misconfigured, or platform PVCs are Pending, Lost, or
          stuck Terminating, or when Longhorn node objects are not Ready or
          attached Longhorn volumes are degraded/faulted/not healthy, or when
          generated Harbor, Forgejo, Woodpecker, Keycloak, Grafana, Loki, or Velero secrets are missing or
          lack required keys, including Harbor external PostgreSQL, Redis, and
          registry S3 secret keys when PLATFORM_APP_HEALTH_HARBOR_PRODUCTION_SECRETS=true,
          Forgejo SQL password, optional Redis secret keys, and S3 object-storage
          secret keys when PLATFORM_APP_HEALTH_FORGEJO_PRODUCTION_SECRETS=true,
          Keycloak admin and database secrets when Keycloak is required,
          or the Grafana external PostgreSQL password secret when
          PLATFORM_APP_HEALTH_GRAFANA_DATABASE_SECRET=true.
          It also fails when a configured GUI host has no
          Ingress/IngressRoute or no ready backend endpoints, when the Harbor
          `/v2/` registry API does not answer with the Docker Distribution API
          header, when Grafana or Prometheus accepts an unauthenticated public
          request instead of redirecting or rejecting it, when Loki does not answer
          a known `/ready` endpoint, when Velero BackupStorageLocations are not
          Available, when no enabled Velero backup schedule exists, or when a
          pod pinned to any RKE2 node cannot reach the Argo CD or Woodpecker
          ClusterIP service.

          Recommended repair sequence:
          make platform-service-path-repair
          make platform-argocd-service-repair
          make platform-ingress

          Node-originated app VIP self-probes are advisory by default because
          MetalLB L2 VIP self-access can differ from real client access. To
          require them too:
          PLATFORM_APP_HEALTH_NODE_INGRESS_STRICT=true make platform-app-health

          To skip required StorageClass enforcement for a temporary non-Longhorn
          subset debug run:
          PLATFORM_APP_HEALTH_STORAGE_CLASSES=skip make platform-app-health

          To skip Longhorn runtime node/volume enforcement temporarily:
          PLATFORM_APP_HEALTH_LONGHORN_RUNTIME=false make platform-app-health

          To skip Argo CD runtime component/service enforcement temporarily:
          PLATFORM_APP_HEALTH_ARGOCD_RUNTIME=false make platform-app-health

          To skip live Argo CD guarded pruning policy enforcement temporarily:
          PLATFORM_APP_HEALTH_ARGOCD_GUARDED_PRUNE=false make platform-app-health

          To skip critical HA replica enforcement temporarily:
          PLATFORM_APP_HEALTH_HA_REPLICAS=false make platform-app-health

          To skip Forgejo singleton disruption-safety enforcement temporarily:
          PLATFORM_APP_HEALTH_FORGEJO_SINGLETON_SAFETY=false make platform-app-health

          To set the expected Woodpecker image tag after an intentional upgrade:
          PLATFORM_APP_HEALTH_WOODPECKER_IMAGE_TAG=v3.16.0 make platform-app-health

          To skip HTTP-to-HTTPS redirect enforcement for a temporary debug run:
          PLATFORM_APP_HEALTH_HTTP_REDIRECT=false make platform-app-health

          To skip Harbor registry API enforcement for a temporary debug run:
          PLATFORM_APP_HEALTH_REGISTRY_API=false make platform-app-health

          To skip Grafana/Prometheus API enforcement for a temporary debug run:
          PLATFORM_APP_HEALTH_MONITORING_API=false make platform-app-health

          To skip Loki API or Velero object storage enforcement temporarily:
          PLATFORM_APP_HEALTH_LOKI_API=false make platform-app-health
          PLATFORM_APP_HEALTH_VELERO_BACKUP_STORAGE=false make platform-app-health

          To skip Velero backup schedule enforcement temporarily:
          PLATFORM_APP_HEALTH_VELERO_SCHEDULES=false make platform-app-health

          To skip generated app secret contract enforcement temporarily:
          PLATFORM_APP_HEALTH_APP_SECRETS=skip make platform-app-health

          To enforce Harbor external PostgreSQL, Redis, and registry S3
          credential secrets during production checks:
          PLATFORM_APP_HEALTH_HARBOR_PRODUCTION_SECRETS=true make platform-app-health

          To enforce Forgejo SQL password, Redis credentials, and object-storage
          credentials during production checks:
          PLATFORM_APP_HEALTH_FORGEJO_PRODUCTION_SECRETS=true make platform-app-health

          To enforce the Grafana external PostgreSQL password secret during
          production checks:
          PLATFORM_APP_HEALTH_GRAFANA_DATABASE_SECRET=true make platform-app-health

          To allow temporary seed Git or git:// sources during bootstrap only:
          PLATFORM_APP_HEALTH_FORBID_TEMPORARY_REPO=false make platform-app-health

          To permit only an explicitly uninitialized and sealed OpenBao server
          during the bootstrap ceremony:
          PLATFORM_APP_HEALTH_OPENBAO_READY=false make platform-app-health

          To force all production checks even when private/seed-git.env exists:
          PLATFORM_APP_HEALTH_MODE=production make platform-app-health

          To require the exact intended production Git source:
          PLATFORM_APP_HEALTH_EXPECTED_REPO_URL=<PRIVATE_REPO_URL> make platform-app-health

          To skip certificate or trust bundle resource enforcement temporarily:
          PLATFORM_APP_HEALTH_CERTIFICATES=skip make platform-app-health
          PLATFORM_APP_HEALTH_TRUST_BUNDLES=skip make platform-app-health

          To skip step-ca API enforcement for a temporary debug run:
          PLATFORM_APP_HEALTH_STEP_CA_API=false make platform-app-health

          If this cluster intentionally runs only a subset of the premium stack,
          override the enforced list for this check:
          PLATFORM_APP_HEALTH_REQUIRED_APPS="cert-manager trust-manager metallb traefik longhorn cloudnativepg platform-postgres platform-valkey forgejo woodpecker"
          PLATFORM_APP_HEALTH_NAMESPACES="argocd cert-manager cnpg-system platform-databases platform-cache forgejo woodpecker longhorn-system metallb-system traefik"
          PLATFORM_APP_HEALTH_GUI_APPS="argocd forgejo woodpecker"
          make platform-app-health

          To require specific CloudNativePG PostgreSQL clusters:
          PLATFORM_APP_HEALTH_CNPG_CLUSTERS="platform-databases/platform-postgres" make platform-app-health

          To require specific cert-manager Certificates or trust-manager Bundles:
          PLATFORM_APP_HEALTH_CERTIFICATES="argocd/argocd-server-tls" make platform-app-health
          PLATFORM_APP_HEALTH_TRUST_BUNDLES="platform-public-roots" make platform-app-health
      run_once: true
      when: ansible_play_hosts | map('extract', hostvars, 'platform_app_health_failed') | map('bool') | select('equalto', true) | list | length > 0

    - name: Show successful platform app health verification
      ansible.builtin.debug:
        msg: "Required Argo CD Applications are Synced/Healthy with no active or failed operations, or OpenBao is explicitly uninitialized and sealed during bootstrap when that state is permitted (historical failed operations are ignored after a clean reconciliation); live Argo CD Applications enable self-healing and approval-gated foreground pruning in the final sync wave with empty-target protection; when production source enforcement is enabled, Argo CD Applications use production-safe repository sources instead of temporary seed Git or insecure git:// URLs and match the expected production repo URL when one is set; platform pods are Ready except for the verified OpenBao bootstrap state; Argo CD runtime components and configured repo-server/Redis service endpoints are present; shared platform Valkey is present with its auth secret when required; critical HA workloads meet minimum desired and ready replica coverage; singleton Forgejo uses a Recreate rollout and a minAvailable=1 PodDisruptionBudget; Woodpecker server and agent pods run the expected pinned image tag; cert-manager Certificates are Ready when present or explicitly required; trust-manager Bundles are synced when present or explicitly required; step-ca answers /health on its ClusterIP service when required; CloudNativePG clusters are Ready when present or explicitly required; CloudNativePG object-storage credentials are present when enforced; Loki answers a known /ready endpoint when required; Velero BackupStorageLocations are Available and an enabled Velero backup schedule exists when Velero is required; generated Harbor/Forgejo/Woodpecker/Keycloak/Grafana/Loki/Velero/CloudNativePG/Valkey and SSO secrets exist with required keys; Harbor production dependency secrets, Forgejo SQL/Redis/object-storage production secrets, and the Grafana external database secret are present when enforced; required StorageClasses exist; platform PVCs are Bound; Longhorn nodes are Ready/schedulable and Longhorn volumes backing Bound PVCs are healthy; configured GUI hosts have ready backend endpoints and answer through the app VIP from the controller/client path; Harbor registry API answers on /v2/ with the Docker Distribution header when Harbor is required; Grafana and Prometheus deny or redirect unauthenticated public access when monitoring is required; and Argo CD/Woodpecker ClusterIP service paths are reachable from every RKE2 node and from pods pinned to every RKE2 node."
      run_once: true
