    platform_valkey_auth_secret_name_effective: "{{ platform_valkey_auth_secret_name | default(platform_valkey_auth_secret_name_from_env, true) | default('platform-valkey-auth', true) }}"
    platform_valkey_password_key_effective: "{{ platform_valkey_password_key | default(platform_valkey_password_key_from_env, true) | default('valkey-password', true) }}"
    platform_forgejo_database_secret_name_effective: "{{ platform_forgejo_database_secret_name | default(platform_forgejo_database_secret_name_from_env, true) | default('forgejo-database', true) }}"
    platform_forgejo_redis_mode_effective: "{{ platform_forgejo_redis_mode | default(platform_forgejo_redis_mode_from_env, true) | default('redis', true) }}"
    platform_forgejo_redis_secret_name_effective: "{{ platform_forgejo_redis_secret_name | default(platform_forgejo_redis_secret_name_from_env, true) | default('forgejo-redis', true) }}"
    platform_forgejo_object_storage_secret_name_effective: "{{ platform_forgejo_object_storage_secret_name | default(platform_forgejo_object_storage_secret_name_from_env, true) | default('forgejo-object-storage', true) }}"
    platform_woodpecker_oauth_secret_name_effective: "{{ platform_woodpecker_oauth_secret_name | default(platform_woodpecker_oauth_secret_name_from_env, true) | default('woodpecker-forgejo-oauth', true) }}"
    platform_woodpecker_agent_secret_name_effective: "{{ platform_woodpecker_agent_secret_name | default(platform_woodpecker_agent_secret_name_from_env, true) | default('woodpecker-agent-secret', true) }}"
    platform_woodpecker_database_mode_effective: "{{ platform_woodpecker_database_mode | default(platform_woodpecker_database_mode_from_env, true) | default('auto', true) | lower }}"
    platform_woodpecker_database_secret_name_effective: "{{ platform_woodpecker_database_secret_name | default(platform_woodpecker_database_secret_name_from_env, true) | default('woodpecker-database', true) }}"
