        if [ "${REQUIRE_MONITORING_API}" != "true" ]; then
          echo "result=skip reason=platform-app-health-monitoring-api-disabled"
          exit 0
        fi

        if ! command -v curl >/dev/null 2>&1; then
          echo "result=fail reason=curl-not-installed"
          exit 1
        fi

        probe_auth_boundary() {
          app="$1"
          host="$2"
          case " ${GUI_APPS} " in
            *" ${app} "*) ;;
            *)
              echo "===== ${app} monitoring authentication boundary from Ansible controller ====="
              echo "result=skip reason=not-required-by-platform-app-health-gui-apps"
              return
              ;;
          esac

          headers_file="$(mktemp)"
          error_file="$(mktemp)"
          url="https://${host}/"
          echo "===== ${app} monitoring authentication boundary from Ansible controller ====="
          echo "url=${url} vip=${VIP}"

          code="$(curl --silent --show-error --insecure --output /dev/null \
            --dump-header "${headers_file}" \
            --write-out '%{http_code}' \
            --connect-timeout "${CONNECT_TIMEOUT}" \
            --max-time "${MAX_TIME}" \
            --resolve "${host}:443:${VIP}" \
            "${url}" 2>"${error_file}" || true)"

          stderr="$(cat "${error_file}" 2>/dev/null || true)"
          echo "http_code=${code:-000}"
          if [ -n "${stderr}" ]; then
            printf '%s\n' "${stderr}" | sed 's/^/stderr=/'
          fi

          case "${code}" in
            302|303|307|401|403)
              echo "authentication_boundary=protected"
              echo "result=ok"
              ;;
            *)
              echo "result=fail reason=monitoring-public-authentication-not-enforced"
              failed=1
              ;;
          esac
          rm -f "${headers_file}" "${error_file}"
        }

        probe_auth_boundary grafana "${GRAFANA_HOST}"
        probe_auth_boundary prometheus "${PROMETHEUS_HOST}"

        exit "${failed}"
      args:
        executable: /bin/bash
      register: platform_app_health_monitoring_api_probe
      changed_when: false
      failed_when: false
      delegate_to: localhost
      become: false
      run_once: true

    - name: Print monitoring authentication boundary results
      ansible.builtin.debug:
        var: platform_app_health_monitoring_api_probe.stdout_lines
      run_once: true

    - name: Probe configured GUI HTTP redirects from Ansible controller
      ansible.builtin.shell: |
        set -u
        VIP="{{ rke2_ingress_vip_effective }}"
        CONNECT_TIMEOUT={{ platform_app_health_connect_timeout_effective }}
        MAX_TIME={{ platform_app_health_max_time_effective }}
        GUI_APPS="{{ platform_app_health_gui_apps_effective }}"
