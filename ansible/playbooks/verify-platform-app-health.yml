        var: platform_app_health_velero_schedule_probe.stdout_lines
      run_once: true

    - name: Verify generated platform app secret contracts
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        required_apps="{{ platform_app_health_required_apps_effective }}"
        requested_secrets="{{ platform_app_health_app_secrets_effective }}"
        requested_secrets_normalized="$(printf '%s' "${requested_secrets}" | tr '\n\t' '  ' | xargs || true)"
        requested_secrets_lower="$(printf '%s' "${requested_secrets_normalized}" | tr '[:upper:]' '[:lower:]')"
        failed=0

        echo "===== generated platform app secret contracts ====="

        case " ${requested_secrets_lower} " in
          *" none "*|*" skip "*|*" disabled "*)
            echo "result=skip reason=platform-app-health-app-secrets-disabled"
            exit 0
            ;;
        esac

        check_secret_contract() {
          namespace="$1"
          secret_name="$2"
          shift 2
          keys="$*"

          echo "===== secret ${namespace}/${secret_name} ====="
          if ! "$K" --kubeconfig "$C" get "namespace/${namespace}" >/dev/null 2>&1; then
            echo "result=fail reason=missing-platform-app-secret-namespace namespace=${namespace}"
            failed=1
            return
          fi
          if ! "$K" --kubeconfig "$C" -n "${namespace}" get "secret/${secret_name}" >/dev/null 2>&1; then
            echo "result=fail reason=missing-platform-app-secret namespace=${namespace} name=${secret_name}"
            failed=1
            return
          fi

          secret_failed=0
          for key in ${keys}; do
            encoded="$("$K" --kubeconfig "$C" -n "${namespace}" get "secret/${secret_name}" \
              -o "go-template={{ '{{' }} index .data \"${key}\" {{ '}}' }}" 2>/dev/null || true)"
            if [ -z "${encoded}" ]; then
              echo "result=fail reason=missing-platform-app-secret-key namespace=${namespace} name=${secret_name} key=${key}"
              secret_failed=1
              continue
            fi
            if ! printf '%s' "${encoded}" | base64 -d >/dev/null 2>&1; then
              echo "result=fail reason=invalid-platform-app-secret-key-encoding namespace=${namespace} name=${secret_name} key=${key}"
              secret_failed=1
              continue
            fi
            echo "key=${key} state=present"
          done

          if [ "${secret_failed}" -eq 0 ]; then
            echo "result=ok"
          else
            failed=1
          fi
        }

        woodpecker_uses_postgres() {
          mode="{{ platform_woodpecker_database_mode_effective }}"
          case "${mode}" in
            postgres|postgresql|external)
              echo "woodpecker_database_mode=${mode}"
              return 0
              ;;
            sqlite)
              echo "woodpecker_database_mode=sqlite"
              return 1
              ;;
          esac

          for workload in statefulset/woodpecker-server deployment/woodpecker-server; do
            if ! "$K" --kubeconfig "$C" -n woodpecker get "${workload}" >/dev/null 2>&1; then
              continue
            fi
            driver="$("$K" --kubeconfig "$C" -n woodpecker get "${workload}" -o jsonpath='{range .spec.template.spec.containers[*].env[?(@.name=="WOODPECKER_DATABASE_DRIVER")]}{.value}{"\n"}{end}' 2>/dev/null || true)"
            env_from="$("$K" --kubeconfig "$C" -n woodpecker get "${workload}" -o jsonpath='{range .spec.template.spec.containers[*].envFrom[*].secretRef}{.name}{"\n"}{end}' 2>/dev/null || true)"
            case "${driver}" in
              *postgres*|*postgresql*)
                echo "woodpecker_database_mode=postgres source=${workload}/env"
                return 0
                ;;
            esac
            case " ${env_from} " in
              *" {{ platform_woodpecker_database_secret_name_effective }} "*)
                echo "woodpecker_database_mode=postgres source=${workload}/envFrom"
                return 0
                ;;
            esac
          done

          echo "woodpecker_database_mode=sqlite source=auto"
          return 1
        }

        if [ "${requested_secrets_lower}" = "auto" ]; then
          case " ${required_apps} " in
            *" platform-valkey "*)
              check_secret_contract platform-cache "{{ platform_valkey_auth_secret_name_effective }}" "{{ platform_valkey_password_key_effective }}"
              ;;
            *)
              echo "result=skip reason=platform-valkey-not-required-by-platform-app-health-required-apps"
              ;;
          esac

          case " ${required_apps} " in
            *" minio "*)
              check_secret_contract object-storage "{{ platform_minio_root_secret_name_effective }}" root-user root-password
              ;;
            *)
              echo "result=skip reason=minio-not-required-by-platform-app-health-required-apps"
              ;;
          esac

          case " ${required_apps} " in
            *" harbor "*)
              check_secret_contract harbor "{{ platform_harbor_admin_secret_name_effective }}" HARBOR_ADMIN_PASSWORD
              check_secret_contract harbor "{{ platform_harbor_secret_key_secret_name_effective }}" secretKey
              if [ "{{ platform_app_health_harbor_production_secrets_effective | ternary('true', 'false') }}" = "true" ]; then
                check_secret_contract harbor "{{ platform_harbor_database_secret_name_effective }}" password
                check_secret_contract harbor "{{ platform_harbor_redis_secret_name_effective }}" REDIS_PASSWORD
                check_secret_contract harbor "{{ platform_harbor_s3_secret_name_effective }}" REGISTRY_STORAGE_S3_ACCESSKEY REGISTRY_STORAGE_S3_SECRETKEY
              else
                echo "result=skip reason=harbor-production-secret-contracts-disabled"
              fi
              ;;
            *)
              echo "result=skip reason=harbor-not-required-by-platform-app-health-required-apps"
              ;;
          esac

          case " ${required_apps} " in
            *" cloudnativepg "*)
              if [ "{{ platform_app_health_cnpg_object_storage_secret_effective | ternary('true', 'false') }}" = "true" ]; then
                check_secret_contract platform-databases "{{ platform_cnpg_object_store_secret_name_effective }}" ACCESS_KEY_ID SECRET_ACCESS_KEY
              else
                echo "result=skip reason=cnpg-object-storage-secret-contract-disabled"
              fi
              ;;
            *)
              echo "result=skip reason=cloudnativepg-not-required-by-platform-app-health-required-apps"
              ;;
          esac

          case " ${required_apps} " in
            *" forgejo "*)
              if [ "{{ platform_app_health_forgejo_production_secrets_effective | ternary('true', 'false') }}" = "true" ]; then
                check_secret_contract forgejo "{{ platform_forgejo_database_secret_name_effective }}" username password
                case "{{ platform_forgejo_redis_mode_effective }}" in
                  redis|external)
                    check_secret_contract forgejo "{{ platform_forgejo_redis_secret_name_effective }}" uri
                    ;;
                  *)
                    echo "result=skip reason=forgejo-redis-secret-contract-disabled"
                    ;;
                esac
                check_secret_contract forgejo "{{ platform_forgejo_object_storage_secret_name_effective }}" access-key-id secret-access-key
              else
                echo "result=skip reason=forgejo-production-secret-contracts-disabled"
              fi
              ;;
            *)
              echo "result=skip reason=forgejo-not-required-by-platform-app-health-required-apps"
              ;;
          esac

          case " ${required_apps} " in
            *" woodpecker "*)
              check_secret_contract woodpecker "{{ platform_woodpecker_oauth_secret_name_effective }}" WOODPECKER_FORGEJO_CLIENT WOODPECKER_FORGEJO_SECRET
              check_secret_contract woodpecker "{{ platform_woodpecker_agent_secret_name_effective }}" WOODPECKER_AGENT_SECRET
              if woodpecker_uses_postgres; then
                check_secret_contract woodpecker "{{ platform_woodpecker_database_secret_name_effective }}" WOODPECKER_DATABASE_DATASOURCE
              else
                echo "result=skip reason=woodpecker-database-secret-not-required"
              fi
              ;;
            *)
              echo "result=skip reason=woodpecker-not-required-by-platform-app-health-required-apps"
              ;;
          esac

          case " ${required_apps} " in
            *" keycloak "*)
              check_secret_contract keycloak "{{ platform_keycloak_admin_secret_name_effective }}" admin-user admin-password
              check_secret_contract keycloak "{{ platform_keycloak_database_secret_name_effective }}" username password
              check_secret_contract platform-databases "{{ platform_keycloak_database_secret_name_effective }}" username password
              ;;
            *)
              echo "result=skip reason=keycloak-not-required-by-platform-app-health-required-apps"
              ;;
          esac

          if [ "{{ platform_app_health_sso_effective | ternary('true', 'false') }}" = "true" ]; then
            check_secret_contract keycloak "{{ platform_sso_keycloak_secret_name_effective }}" \
              PLATFORM_SSO_BOOTSTRAP_ADMIN_PASSWORD \
              PLATFORM_SSO_ARGOCD_CLIENT_SECRET \
              PLATFORM_SSO_GRAFANA_CLIENT_SECRET \
              PLATFORM_SSO_PROMETHEUS_CLIENT_SECRET \
              PLATFORM_SSO_PROMETHEUS_COOKIE_SECRET
            check_secret_contract argocd "{{ platform_sso_argocd_secret_name_effective }}" client-secret
            argocd_sso_label="$("$K" --kubeconfig "$C" -n argocd get "secret/{{ platform_sso_argocd_secret_name_effective }}" \
              -o 'jsonpath={.metadata.labels.app\.kubernetes\.io/part-of}' 2>/dev/null || true)"
            if [ "${argocd_sso_label}" != "argocd" ]; then
              echo "result=fail reason=argocd-sso-secret-missing-required-label expected=app.kubernetes.io/part-of=argocd"
              failed=1
            else
              echo "argocd_sso_secret_label=app.kubernetes.io/part-of=argocd"
            fi
            check_secret_contract monitoring "{{ platform_sso_grafana_secret_name_effective }}" GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
            check_secret_contract monitoring "{{ platform_sso_prometheus_secret_name_effective }}" client-secret cookie-secret
          else
            echo "result=skip reason=platform-sso-secret-contract-disabled"
          fi

          case " ${required_apps} " in
            *" monitoring "*)
              check_secret_contract monitoring "{{ platform_grafana_admin_secret_name_effective }}" admin-user admin-password
              if [ "{{ platform_app_health_grafana_database_secret_effective | ternary('true', 'false') }}" = "true" ]; then
                check_secret_contract monitoring "{{ platform_grafana_database_secret_name_effective }}" password
              else
                echo "result=skip reason=grafana-database-secret-contract-disabled"
              fi
              ;;
            *)
              echo "result=skip reason=monitoring-not-required-by-platform-app-health-required-apps"
              ;;
          esac

          case " ${required_apps} " in
            *" loki "*)
              check_secret_contract logging "{{ platform_loki_object_storage_secret_name_effective }}" LOKI_S3_ACCESS_KEY_ID LOKI_S3_SECRET_ACCESS_KEY
              ;;
            *)
              echo "result=skip reason=loki-not-required-by-platform-app-health-required-apps"
              ;;
          esac

          case " ${required_apps} " in
            *" velero "*)
              check_secret_contract velero "{{ platform_velero_credentials_secret_name_effective }}" cloud
              ;;
            *)
              echo "result=skip reason=velero-not-required-by-platform-app-health-required-apps"
              ;;
          esac
          exit "${failed}"
        fi

        for secret_contract in ${requested_secrets_normalized}; do
          case "${secret_contract}" in
            */*:*) ;;
            *)
              echo "result=fail reason=invalid-platform-app-secret-contract expected=namespace/name:key[,key] contract=${secret_contract}"
              failed=1
              continue
              ;;
          esac
          namespace="${secret_contract%%/*}"
          rest="${secret_contract#*/}"
          secret_name="${rest%%:*}"
          key_list="${rest#*:}"
          keys="$(printf '%s' "${key_list}" | tr ',' ' ' | xargs || true)"
          if [ -z "${namespace}" ] || [ -z "${secret_name}" ] || [ -z "${keys}" ]; then
            echo "result=fail reason=invalid-platform-app-secret-contract expected=namespace/name:key[,key] contract=${secret_contract}"
            failed=1
            continue
          fi
          check_secret_contract "${namespace}" "${secret_name}" ${keys}
        done

        exit "${failed}"
      args:
        executable: /bin/bash
      register: platform_app_health_app_secret_probe
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Print generated platform app secret contract results
      ansible.builtin.debug:
        var: platform_app_health_app_secret_probe.stdout_lines
      run_once: true

    - name: Verify required platform StorageClasses
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        storage_classes="{{ platform_app_health_storage_classes_effective }}"
        failed=0

        storage_classes_lower="$(printf '%s' "${storage_classes}" | tr '[:upper:]' '[:lower:]')"
        case " ${storage_classes_lower} " in
          *" none "*|*" skip "*|*" disabled "*)
            echo "result=skip reason=platform-app-health-storage-classes-disabled"
            exit 0
            ;;
        esac

        for storage_class in ${storage_classes}; do
          echo "===== StorageClass ${storage_class} ====="
          if ! "$K" --kubeconfig "$C" get "storageclass/${storage_class}" >/dev/null 2>&1; then
            echo "result=fail reason=missing-storageclass"
            failed=1
            continue
          fi

          info="$("$K" --kubeconfig "$C" get "storageclass/${storage_class}" -o jsonpath='{.metadata.name}{"|"}{.provisioner}{"|"}{.reclaimPolicy}{"|"}{.volumeBindingMode}{"|"}{.allowVolumeExpansion}{"\n"}' 2>/dev/null || true)"
          name="$(printf '%s' "${info}" | cut -d'|' -f1)"
          provisioner="$(printf '%s' "${info}" | cut -d'|' -f2)"
          reclaim_policy="$(printf '%s' "${info}" | cut -d'|' -f3)"
          volume_binding_mode="$(printf '%s' "${info}" | cut -d'|' -f4)"
          allow_volume_expansion="$(printf '%s' "${info}" | cut -d'|' -f5)"
          echo "name=${name:-unknown} provisioner=${provisioner:-unknown} reclaimPolicy=${reclaim_policy:-unknown} volumeBindingMode=${volume_binding_mode:-unknown} allowVolumeExpansion=${allow_volume_expansion:-unknown}"

          class_failed=0
          case "${storage_class}" in
            longhorn-*)
              if [ "${provisioner}" != "driver.longhorn.io" ]; then
                echo "result=fail reason=unexpected-longhorn-provisioner"
                class_failed=1
              fi
              ;;
          esac
          if [ -z "${provisioner}" ] || [ -z "${volume_binding_mode}" ]; then
            echo "result=fail reason=incomplete-storageclass"
            class_failed=1
          fi

          if [ "${class_failed}" -eq 0 ]; then
            echo "result=ok"
          else
            failed=1
          fi
        done

        exit "${failed}"
      args:
        executable: /bin/bash
      register: platform_app_health_storage_class_probe
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Print platform StorageClass readiness results
      ansible.builtin.debug:
        var: platform_app_health_storage_class_probe.stdout_lines
      run_once: true

    - name: Verify platform namespace PVC readiness
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        namespaces="{{ platform_app_health_namespaces_effective }}"
        failed=0

        for namespace in ${namespaces}; do
          echo "===== namespace ${namespace} PVCs ====="
          if ! "$K" --kubeconfig "$C" get "namespace/${namespace}" >/dev/null 2>&1; then
            echo "result=fail reason=missing-namespace"
            failed=1
            continue
          fi

          pvcs="$("$K" --kubeconfig "$C" -n "${namespace}" get pvc -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.status.phase}{"|"}{.metadata.deletionTimestamp}{"|"}{.spec.storageClassName}{"\n"}{end}' 2>/dev/null || true)"
          if [ -z "${pvcs}" ]; then
            echo "result=ok reason=no-pvcs"
            continue
          fi

          namespace_failed=0
          while IFS='|' read -r name phase deletion_timestamp storage_class; do
            [ -n "${name}" ] || continue
            echo "pvc=${name} phase=${phase:-unknown} storageClass=${storage_class:-none} deletionTimestamp=${deletion_timestamp:-none}"
            if [ "${phase}" != "Bound" ] || [ -n "${deletion_timestamp}" ]; then
              namespace_failed=1
            fi
          done <<< "${pvcs}"

          if [ "${namespace_failed}" -eq 0 ]; then
            echo "result=ok"
          else
            echo "result=fail"
            failed=1
          fi
        done

        exit "${failed}"
      args:
        executable: /bin/bash
      register: platform_app_health_pvc_probe
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Print platform PVC readiness results
      ansible.builtin.debug:
        var: platform_app_health_pvc_probe.stdout_lines
      run_once: true

    - name: Verify Longhorn node and volume runtime health
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        required_apps="{{ platform_app_health_required_apps_effective }}"
        REQUIRE_LONGHORN_RUNTIME="{{ platform_app_health_longhorn_runtime_effective | ternary('true', 'false') }}"
        NAMESPACE=longhorn-system
        expected_nodes="{{ groups['rke2_servers'] | join(' ') }}"
        failed=0

        echo "===== Longhorn runtime health ====="

        if [ "${REQUIRE_LONGHORN_RUNTIME}" != "true" ]; then
          echo "result=skip reason=platform-app-health-longhorn-runtime-disabled"
          exit 0
        fi

        case " ${required_apps} " in
          *" longhorn "*) ;;
          *)
            echo "result=skip reason=longhorn-not-required-by-platform-app-health-required-apps"
            exit 0
            ;;
        esac

        if ! "$K" --kubeconfig "$C" get "namespace/${NAMESPACE}" >/dev/null 2>&1; then
          echo "result=fail reason=missing-longhorn-namespace namespace=${NAMESPACE}"
          exit 1
        fi

        for crd in nodes.longhorn.io volumes.longhorn.io; do
          if ! "$K" --kubeconfig "$C" get "crd/${crd}" >/dev/null 2>&1; then
            echo "result=fail reason=longhorn-crd-missing crd=${crd}"
            failed=1
          fi
        done
        if [ "${failed}" -ne 0 ]; then
          exit "${failed}"
        fi

        longhorn_nodes="$("$K" --kubeconfig "$C" -n "${NAMESPACE}" get nodes.longhorn.io \
          -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)"
        if [ -z "${longhorn_nodes}" ]; then
          echo "result=fail reason=no-longhorn-nodes"
          exit 1
        fi

        for expected_node in ${expected_nodes}; do
          echo "===== Longhorn node ${expected_node} ====="
          if ! "$K" --kubeconfig "$C" -n "${NAMESPACE}" get "nodes.longhorn.io/${expected_node}" >/dev/null 2>&1; then
            echo "result=fail reason=missing-longhorn-node node=${expected_node}"
            failed=1
            continue
          fi
          info="$("$K" --kubeconfig "$C" -n "${NAMESPACE}" get "nodes.longhorn.io/${expected_node}" \
            -o jsonpath='{.metadata.name}{"|"}{.spec.allowScheduling}{"|"}{.status.conditions[?(@.type=="Ready")].status}{"|"}{.status.conditions[?(@.type=="Schedulable")].status}{"\n"}' 2>/dev/null || true)"
          node_name="$(printf '%s' "${info}" | cut -d'|' -f1)"
          allow_scheduling="$(printf '%s' "${info}" | cut -d'|' -f2)"
          ready_condition="$(printf '%s' "${info}" | cut -d'|' -f3)"
          schedulable_condition="$(printf '%s' "${info}" | cut -d'|' -f4)"
          echo "node=${node_name:-unknown} allowScheduling=${allow_scheduling:-unknown} readyCondition=${ready_condition:-unknown} schedulableCondition=${schedulable_condition:-unknown}"
          node_failed=0
          if [ "${allow_scheduling}" = "false" ] || [ "${allow_scheduling}" = "False" ]; then
            echo "result=fail reason=longhorn-node-scheduling-disabled"
            node_failed=1
          fi
          if [ "${ready_condition}" != "True" ]; then
            echo "result=fail reason=longhorn-node-not-ready"
            node_failed=1
          fi
          if [ -n "${schedulable_condition}" ] && [ "${schedulable_condition}" != "True" ]; then
            echo "result=fail reason=longhorn-node-not-schedulable"
            node_failed=1
          fi
          if [ "${node_failed}" -eq 0 ]; then
            echo "result=ok"
          else
            failed=1
          fi
        done

        # Only enforce volumes that back a currently Bound PVC. Longhorn retains
        # detached CRs after old PVCs are removed, and those historical objects
        # must not make an otherwise healthy platform fail its readiness gate.
        bound_volume_handles="$(
          "$K" --kubeconfig "$C" get pvc -A \
            -o jsonpath='{range .items[*]}{.status.phase}{"|"}{.spec.volumeName}{"\n"}{end}' 2>/dev/null |
            while IFS='|' read -r pvc_phase pv_name; do
              [ "${pvc_phase}" = "Bound" ] || continue
              [ -n "${pv_name}" ] || continue
              pv_info="$("$K" --kubeconfig "$C" get "pv/${pv_name}" \
                -o jsonpath='{.spec.csi.driver}{"|"}{.spec.csi.volumeHandle}{"\n"}' 2>/dev/null || true)"
              pv_driver="${pv_info%%|*}"
              pv_handle="${pv_info#*|}"
              [ "${pv_driver}" = "driver.longhorn.io" ] || continue
              [ -n "${pv_handle}" ] || continue
              printf '%s\n' "${pv_handle}"
            done | sort -u
        )"

        volumes="$("$K" --kubeconfig "$C" -n "${NAMESPACE}" get volumes.longhorn.io \
          -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)"
        if [ -z "${volumes}" ]; then
          echo "result=ok reason=no-longhorn-volumes"
          exit "${failed}"
        fi

        for volume in ${volumes}; do
          echo "===== Longhorn volume ${volume} ====="
          if ! printf '%s\n' "${bound_volume_handles}" | grep -F -x -- "${volume}" >/dev/null 2>&1; then
            echo "result=skip reason=longhorn-volume-not-backed-by-bound-pvc"
            continue
          fi
          info="$("$K" --kubeconfig "$C" -n "${NAMESPACE}" get "volumes.longhorn.io/${volume}" \
            -o jsonpath='{.metadata.name}{"|"}{.status.state}{"|"}{.status.robustness}{"|"}{.status.ownerID}{"|"}{.status.conditions[?(@.type=="Scheduled")].status}{"\n"}' 2>/dev/null || true)"
          volume_name="$(printf '%s' "${info}" | cut -d'|' -f1)"
          state="$(printf '%s' "${info}" | cut -d'|' -f2)"
          robustness="$(printf '%s' "${info}" | cut -d'|' -f3)"
          owner_id="$(printf '%s' "${info}" | cut -d'|' -f4)"
          scheduled_condition="$(printf '%s' "${info}" | cut -d'|' -f5)"
          echo "volume=${volume_name:-unknown} state=${state:-unknown} robustness=${robustness:-unknown} ownerID=${owner_id:-none} scheduledCondition=${scheduled_condition:-unknown}"
          volume_failed=0
          case "${robustness}" in
            degraded|faulted)
              echo "result=fail reason=longhorn-volume-${robustness}"
              volume_failed=1
              ;;
          esac
          if [ "${state}" = "attached" ] && [ "${robustness}" != "healthy" ]; then
            echo "result=fail reason=longhorn-attached-volume-not-healthy"
            volume_failed=1
          fi
          if [ "${scheduled_condition}" = "False" ] || [ "${scheduled_condition}" = "false" ]; then
            echo "result=fail reason=longhorn-volume-not-scheduled"
            volume_failed=1
          fi
          if [ "${volume_failed}" -eq 0 ]; then
            echo "result=ok"
          else
            failed=1
          fi
        done

        exit "${failed}"
      args:
        executable: /bin/bash
      register: platform_app_health_longhorn_runtime_probe
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Print Longhorn runtime health results
      ansible.builtin.debug:
        var: platform_app_health_longhorn_runtime_probe.stdout_lines
      run_once: true

    - name: Verify configured GUI ingress backend endpoints
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        GUI_APPS="{{ platform_app_health_gui_apps_effective }}"
        failed=0
        GUI_HOSTS_FILE="$(mktemp)"
        cat >"${GUI_HOSTS_FILE}" <<'GUIHOSTS'
        {% for entry in platform_gui_host_entries %}
        {{ entry.app }}|{{ entry.namespace }}|{{ entry.host }}
        {% endfor %}
        GUIHOSTS

        service_has_ready_endpoint() {
          namespace="$1"
          service="$2"

          if [ -z "${service}" ]; then
            return 1
          fi

          if ! "$K" --kubeconfig "$C" -n "${namespace}" get "service/${service}" >/dev/null 2>&1; then
            echo "service=${service} result=fail reason=service-missing"
            return 1
          fi

          endpoint_lines="$("$K" --kubeconfig "$C" -n "${namespace}" get endpointslice \
            -l "kubernetes.io/service-name=${service}" \
            -o jsonpath='{range .items[*].endpoints[*]}{.conditions.ready}{"|"}{.addresses[*]}{"\n"}{end}' 2>/dev/null || true)"
          if printf '%s\n' "${endpoint_lines}" |
            awk -F'|' 'NF >= 2 && $2 != "" && $1 != "false" { found=1 } END { exit(found ? 0 : 1) }'; then
            echo "service=${service} result=ok reason=endpointslice-ready"
            return 0
          fi

          endpoint_ips="$("$K" --kubeconfig "$C" -n "${namespace}" get "endpoints/${service}" \
            -o jsonpath='{range .subsets[*].addresses[*]}{.ip}{"\n"}{end}' 2>/dev/null || true)"
          if [ -n "${endpoint_ips}" ]; then
            echo "service=${service} result=ok reason=endpoints-ready"
            return 0
          fi

          echo "service=${service} result=fail reason=no-ready-endpoints"
          return 1
        }

        check_backend_services() {
          namespace="$1"
          services="$2"
          ready=1

          for service_ref in $(printf '%s' "${services}" | tr ',' ' '); do
            service="${service_ref%%:*}"
            [ -n "${service}" ] || continue
            if service_has_ready_endpoint "${namespace}" "${service}"; then
              ready=0
            fi
          done

          return "${ready}"
        }

        while IFS='|' read -r app namespace host; do
          [ -n "${host}" ] || continue
          case " ${GUI_APPS} " in
            *" ${app} "*) ;;
            *)
              echo "===== ${app} ingress backend endpoints ====="
              echo "result=skip reason=not-required-by-platform-app-health-gui-apps"
              continue
              ;;
          esac

          echo "===== ${app} ingress backend endpoints ====="
          echo "namespace=${namespace} host=${host}"

          if ! "$K" --kubeconfig "$C" get "namespace/${namespace}" >/dev/null 2>&1; then
            echo "result=fail reason=missing-namespace"
            failed=1
            continue
          fi

          matched_route=0
          backend_ready=1

          ingress_rows="$("$K" --kubeconfig "$C" -n "${namespace}" get ingress \
            -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{range .spec.rules[*]}{.host}{","}{end}{"|"}{range .spec.rules[*].http.paths[*]}{.backend.service.name}{":"}{.backend.service.port.number}{":"}{.backend.service.port.name}{","}{end}{"\n"}{end}' 2>/dev/null || true)"
          while IFS='|' read -r route_name route_hosts services; do
            [ -n "${route_name}" ] || continue
            case ",${route_hosts}," in
              *",${host},"*)
                matched_route=1
                echo "route=ingress/${route_name} services=${services:-none}"
                if check_backend_services "${namespace}" "${services}"; then
                  backend_ready=0
                fi
                ;;
            esac
          done <<< "${ingress_rows}"

          for ingressroute_resource in ingressroutes.traefik.io ingressroutes.traefik.containo.us; do
            ingressroute_rows="$("$K" --kubeconfig "$C" -n "${namespace}" get "${ingressroute_resource}" \
              -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{range .spec.routes[*]}{.match}{" "}{end}{"|"}{range .spec.routes[*].services[*]}{.name}{":"}{.port}{","}{end}{"\n"}{end}' 2>/dev/null || true)"
            while IFS='|' read -r route_name route_matches services; do
              [ -n "${route_name}" ] || continue
              case "${route_matches}" in
                *"${host}"*)
                  matched_route=1
                  echo "route=${ingressroute_resource}/${route_name} services=${services:-none}"
                  if check_backend_services "${namespace}" "${services}"; then
                    backend_ready=0
                  fi
                  ;;
              esac
            done <<< "${ingressroute_rows}"
          done

          if [ "${matched_route}" -eq 0 ]; then
            echo "result=fail reason=no-ingress-or-ingressroute-for-host"
            failed=1
          elif [ "${backend_ready}" -eq 0 ]; then
            echo "result=ok"
          else
            echo "result=fail reason=no-ready-backend-endpoints"
            failed=1
          fi
        done <"${GUI_HOSTS_FILE}"

        rm -f "${GUI_HOSTS_FILE}"
        exit "${failed}"
      args:
        executable: /bin/bash
      register: platform_app_health_ingress_backend_probe
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

