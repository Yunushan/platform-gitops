        fi

        for location_ref in ${locations}; do
          namespace="${location_ref%%/*}"
          name="${location_ref#*/}"
          echo "===== Velero BackupStorageLocation ${location_ref} ====="
          info="$("$K" --kubeconfig "$C" -n "${namespace}" get "backupstoragelocations.velero.io/${name}" \
            -o jsonpath='{.metadata.name}{"|"}{.spec.provider}{"|"}{.spec.objectStorage.bucket}{"|"}{.status.phase}{"|"}{.status.lastValidationTime}{"|"}{.status.message}{"\n"}' 2>/dev/null || true)"
          bsl_name="$(printf '%s' "${info}" | cut -d'|' -f1)"
          provider="$(printf '%s' "${info}" | cut -d'|' -f2)"
          bucket="$(printf '%s' "${info}" | cut -d'|' -f3)"
          phase="$(printf '%s' "${info}" | cut -d'|' -f4)"
          last_validation="$(printf '%s' "${info}" | cut -d'|' -f5)"
          message="$(printf '%s' "${info}" | cut -d'|' -f6-)"
