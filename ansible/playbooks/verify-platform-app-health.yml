            or (((hostvars[rke2_first_server].platform_app_health_step_ca_api_probe | default({'rc': 1})).rc | int) != 0)
            or (((hostvars[rke2_first_server].platform_app_health_cnpg_cluster_probe | default({'rc': 1})).rc | int) != 0)
            or (((hostvars[rke2_first_server].platform_app_health_loki_api_probe | default({'rc': 1})).rc | int) != 0)
            or (((hostvars[rke2_first_server].platform_app_health_velero_backup_storage_probe | default({'rc': 1})).rc | int) != 0)
            or (((hostvars[rke2_first_server].platform_app_health_velero_schedule_probe | default({'rc': 1})).rc | int) != 0)
