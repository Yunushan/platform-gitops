    platform_app_health_namespaces_effective: "{{ platform_app_health_namespaces | default(platform_app_health_namespaces_from_env, true) | default('argocd cert-manager step-ca kyverno tetragon external-secrets openbao cnpg-system platform-databases platform-cache object-storage keycloak forgejo woodpecker harbor longhorn-system metallb-system monitoring logging traefik velero', true) }}"
    platform_app_health_storage_classes_effective: "{{ platform_app_health_storage_classes | default(platform_app_health_storage_classes_from_env, true) | default('longhorn-standard longhorn-critical longhorn-cache longhorn-standard-encrypted longhorn-critical-encrypted longhorn-cache-encrypted', true) }}"
    platform_app_health_certificates_effective: "{{ platform_app_health_certificates | default(platform_app_health_certificates_from_env, true) | default('auto', true) }}"
    platform_app_health_trust_bundles_effective: "{{ platform_app_health_trust_bundles | default(platform_app_health_trust_bundles_from_env, true) | default('auto', true) }}"
    platform_app_health_cnpg_clusters_effective: "{{ platform_app_health_cnpg_clusters | default(platform_app_health_cnpg_clusters_from_env, true) | default('auto', true) }}"
    platform_app_health_gui_apps_effective: "{{ platform_app_health_gui_apps | default(platform_app_health_gui_apps_from_env, true) | default('argocd forgejo harbor woodpecker keycloak grafana prometheus', true) }}"
    platform_app_health_discover_live_hosts_effective: "{{ platform_app_health_discover_live_hosts | default(platform_app_health_discover_live_hosts_from_env, true) | default(false, true) | bool }}"
    platform_app_health_registry_api_effective: "{{ platform_app_health_registry_api | default(platform_app_health_registry_api_from_env, true) | default(true, true) | bool }}"
    platform_app_health_monitoring_api_effective: "{{ platform_app_health_monitoring_api | default(platform_app_health_monitoring_api_from_env, true) | default(true, true) | bool }}"
    platform_app_health_step_ca_api_effective: "{{ platform_app_health_step_ca_api | default(platform_app_health_step_ca_api_from_env, true) | default(true, true) | bool }}"
