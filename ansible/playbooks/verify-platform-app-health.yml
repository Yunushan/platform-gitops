          echo "result=skip reason=platform-app-health-registry-api-disabled"
          exit 0
        fi

        case " ${GUI_APPS} " in
          *" harbor "*) ;;
          *)
            echo "result=skip reason=not-required-by-platform-app-health-gui-apps"
            exit 0
            ;;
        esac

        if ! command -v curl >/dev/null 2>&1; then
          echo "result=fail reason=curl-not-installed"
          exit 1
        fi

        headers_file="$(mktemp)"
        error_file="$(mktemp)"
        trap 'rm -f "${headers_file}" "${error_file}"' EXIT
        url="https://${HOST}/v2/"
        echo "url=${url} vip=${VIP}"

        code="$(curl --silent --show-error --insecure --output /dev/null \
          --dump-header "${headers_file}" \
          --write-out '%{http_code}' \
          --connect-timeout "${CONNECT_TIMEOUT}" \
          --max-time "${MAX_TIME}" \
          --resolve "${HOST}:443:${VIP}" \
          "${url}" 2>"${error_file}" || true)"

        stderr="$(cat "${error_file}" 2>/dev/null || true)"
        echo "http_code=${code:-000}"
        if [ -n "${stderr}" ]; then
          printf '%s\n' "${stderr}" | sed 's/^/stderr=/'
        fi

        if grep -Eiq '^Docker-Distribution-Api-Version:[[:space:]]*registry/2\.0' "${headers_file}"; then
          echo "docker_distribution_api_version=registry/2.0"
        else
          echo "docker_distribution_api_version=missing"
          failed=1
        fi

        case "${code}" in
          200|401)
            ;;
          *)
            echo "result=fail reason=unexpected-registry-api-http-code"
            failed=1
            ;;
        esac

        if [ "${failed}" -eq 0 ]; then
          echo "result=ok"
        fi
        exit "${failed}"
      args:
        executable: /bin/bash
      register: platform_app_health_registry_api_probe
      changed_when: false
      failed_when: false
