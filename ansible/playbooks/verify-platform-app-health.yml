        "$K" --kubeconfig "$C" -n woodpecker get "secret/{{ platform_woodpecker_oauth_secret_name_effective }}" "secret/{{ platform_woodpecker_agent_secret_name_effective }}" "secret/{{ platform_woodpecker_database_secret_name_effective }}" -o wide || true
