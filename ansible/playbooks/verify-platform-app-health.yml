        "$K" --kubeconfig "$C" -n velero get pods,backupstoragelocations.velero.io,volumesnapshotlocations.velero.io,schedules.velero.io -o wide || true
        echo
        echo "===== Generated app secrets ====="
        "$K" --kubeconfig "$C" -n platform-cache get "secret/{{ platform_valkey_auth_secret_name_effective }}" -o wide || true
        "$K" --kubeconfig "$C" -n harbor get "secret/{{ platform_harbor_admin_secret_name_effective }}" "secret/{{ platform_harbor_secret_key_secret_name_effective }}" -o wide || true
        "$K" --kubeconfig "$C" -n harbor get "secret/{{ platform_harbor_database_secret_name_effective }}" "secret/{{ platform_harbor_redis_secret_name_effective }}" "secret/{{ platform_harbor_s3_secret_name_effective }}" -o wide || true
