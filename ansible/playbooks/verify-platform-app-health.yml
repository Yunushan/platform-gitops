    platform_velero_credentials_secret_name_effective: "{{ platform_velero_credentials_secret_name | default(platform_velero_credentials_secret_name_from_env, true) | default('velero-credentials', true) }}"
    platform_cnpg_object_store_secret_name_effective: "{{ platform_cnpg_object_store_secret_name | default(platform_cnpg_object_store_secret_name_from_env, true) | default('cnpg-object-store', true) }}"
    platform_minio_root_secret_name_effective: "{{ platform_minio_root_secret_name | default(platform_minio_root_secret_name_from_env, true) | default('minio-root', true) }}"
  vars_files:
    - ../vars/platform-hostnames.yml

  tasks:
    - name: Require platform app health settings
      ansible.builtin.assert:
        that:
          - rke2_ingress_vip_effective | length > 0
          - not (rke2_ingress_vip_effective is match("^<.*>$"))
          - platform_domain_effective | length > 0
          - not (platform_domain_effective is match("^<.*>$"))
          - platform_argocd_host_effective | length > 0
          - platform_woodpecker_host_effective | length > 0
          - platform_app_health_connect_timeout_effective | int > 0
          - platform_app_health_max_time_effective | int > 0
          - platform_app_health_required_apps_effective | length > 0
          - platform_app_health_namespaces_effective | length > 0
          - platform_app_health_storage_classes_effective | length > 0
          - platform_app_health_certificates_effective | length > 0
          - platform_app_health_trust_bundles_effective | length > 0
          - platform_app_health_cnpg_clusters_effective | length > 0
          - platform_app_health_app_secrets_effective | length > 0
          - platform_app_health_gui_apps_effective | length > 0
          - platform_app_health_service_check_image_effective | length > 0
          - platform_app_health_service_check_timeout_effective | int > 0
          - platform_app_health_service_check_create_attempts_effective | int > 0
          - platform_app_health_woodpecker_image_tag_effective | length > 0
          - platform_harbor_admin_secret_name_effective | length > 0
          - platform_harbor_secret_key_secret_name_effective | length > 0
          - platform_harbor_database_secret_name_effective | length > 0
          - platform_harbor_redis_secret_name_effective | length > 0
          - platform_harbor_s3_secret_name_effective | length > 0
          - platform_forgejo_database_secret_name_effective | length > 0
          - platform_forgejo_redis_secret_name_effective | length > 0
          - platform_forgejo_object_storage_secret_name_effective | length > 0
          - platform_woodpecker_oauth_secret_name_effective | length > 0
          - platform_woodpecker_agent_secret_name_effective | length > 0
          - platform_woodpecker_database_secret_name_effective | length > 0
          - platform_keycloak_admin_secret_name_effective | length > 0
          - platform_keycloak_database_secret_name_effective | length > 0
          - platform_grafana_admin_secret_name_effective | length > 0
          - platform_grafana_database_secret_name_effective | length > 0
          - platform_loki_object_storage_secret_name_effective | length > 0
          - platform_velero_credentials_secret_name_effective | length > 0
          - platform_cnpg_object_store_secret_name_effective | length > 0
          - platform_minio_root_secret_name_effective | length > 0
        fail_msg: "Set rke2_ingress_vip, platform_domain/rke2_platform_domain, platform_argocd_host, and platform_ci_host/platform_woodpecker_host."
      run_once: true

    - name: Record configured focused GUI hosts before optional discovery
      ansible.builtin.set_fact:
        platform_app_health_argocd_host_before_discovery: "{{ platform_argocd_host_effective }}"
        platform_app_health_woodpecker_host_before_discovery: "{{ platform_woodpecker_host_effective }}"
        platform_app_health_argocd_host_is_explicit: >-
          {{
            (platform_argocd_host | default('', true) | string | trim | length > 0)
            or (platform_argocd_host_from_env | default('', true) | string | trim | length > 0)
          }}
        platform_app_health_woodpecker_host_is_explicit: >-
          {{
            (platform_woodpecker_host | default('', true) | string | trim | length > 0)
            or (platform_ci_host | default('', true) | string | trim | length > 0)
            or (platform_woodpecker_host_from_env | default('', true) | string | trim | length > 0)
            or (platform_ci_host_from_env | default('', true) | string | trim | length > 0)
          }}
      when: platform_app_health_discover_live_hosts_effective | bool

    - name: Discover focused GUI hosts from uniquely named live Ingresses
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml

        discover_ingress_host() {
          app="$1"
          namespace="$2"
          route_pattern="$3"
          rows="$($K --kubeconfig "$C" -n "${namespace}" get ingress \
            -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{range .spec.rules[*]}{.host}{","}{end}{"\n"}{end}' \
            2>/dev/null || true)"
          hosts="$({
            while IFS='|' read -r route_name route_hosts; do
              [ -n "${route_name}" ] || continue
              if ! printf '%s\n' "${route_name}" | grep -Eq "${route_pattern}"; then
                continue
              fi
              printf '%s' "${route_hosts}" | tr ',' '\n'
            done <<<"${rows}"
          } | sed '/^$/d' | sort -u)"
          count="$(printf '%s\n' "${hosts}" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "${count}" -ne 1 ]; then
            echo "application=${app} action=skip-live-host-discovery candidates=${count}" >&2
            return 0
          fi
          host="$(printf '%s\n' "${hosts}" | head -n 1)"
          if ! printf '%s\n' "${host}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9.-]*[A-Za-z0-9]$'; then
            echo "application=${app} action=skip-live-host-discovery reason=invalid-host" >&2
            return 0
          fi
          printf '%s|%s\n' "${app}" "${host}"
        }

        discover_ingress_host argocd argocd '^(argo-cd-argocd-server|argocd-server)$'
        discover_ingress_host woodpecker woodpecker '^(woodpecker-server|woodpecker)$'
      args:
        executable: /bin/bash
      register: platform_app_health_live_host_discovery
      changed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      when: platform_app_health_discover_live_hosts_effective | bool

    - name: Parse discovered focused GUI hosts
      ansible.builtin.set_fact:
        platform_app_health_argocd_host_discovered: >-
          {{
            (
              platform_app_health_live_host_discovery.stdout_lines
              | default([])
              | select('match', '^argocd[|]')
              | map('regex_replace', '^[^|]+[|]', '')
              | list
              | first
            ) | default('')
          }}
        platform_app_health_woodpecker_host_discovered: >-
          {{
            (
              platform_app_health_live_host_discovery.stdout_lines
              | default([])
              | select('match', '^woodpecker[|]')
              | map('regex_replace', '^[^|]+[|]', '')
              | list
              | first
            ) | default('')
          }}
      when: platform_app_health_discover_live_hosts_effective | bool

    - name: Use live focused GUI hosts only when no explicit host is configured
      ansible.builtin.set_fact:
        platform_argocd_host: >-
          {{
            platform_app_health_argocd_host_before_discovery
            if platform_app_health_argocd_host_is_explicit | bool
            else platform_app_health_argocd_host_discovered
              | default(platform_app_health_argocd_host_before_discovery, true)
          }}
        platform_woodpecker_host: >-
          {{
            platform_app_health_woodpecker_host_before_discovery
            if platform_app_health_woodpecker_host_is_explicit | bool
            else platform_app_health_woodpecker_host_discovered
              | default(platform_app_health_woodpecker_host_before_discovery, true)
          }}
      when: platform_app_health_discover_live_hosts_effective | bool

    - name: Show focused GUI host selection
      ansible.builtin.debug:
        msg:
          - >-
            argocd_host={{ platform_argocd_host_effective }}
            source={{ 'configured' if platform_app_health_argocd_host_is_explicit | bool else ('live-ingress' if platform_app_health_argocd_host_discovered | length > 0 else 'default') }}
          - >-
            woodpecker_host={{ platform_woodpecker_host_effective }}
            source={{ 'configured' if platform_app_health_woodpecker_host_is_explicit | bool else ('live-ingress' if platform_app_health_woodpecker_host_discovered | length > 0 else 'default') }}
      run_once: true
      when: platform_app_health_discover_live_hosts_effective | bool

    - name: Verify Argo CD platform application health
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        required_apps="{{ platform_app_health_required_apps_effective }}"
        include_existing_apps="{{ platform_app_health_include_existing_apps_effective | ternary('true', 'false') }}"
        require_openbao_ready="{{ platform_app_health_openbao_ready_effective | ternary('true', 'false') }}"
        existing_apps="$("$K" --kubeconfig "$C" -n argocd get applications.argoproj.io -o jsonpath='{range .items[*]}{.metadata.name}{" "}{end}' 2>/dev/null || true)"
        failed=0
        seen=" "

        if ! "$K" --kubeconfig "$C" get crd applications.argoproj.io >/dev/null 2>&1; then
          echo "result=fail reason=argocd-application-crd-missing"
          exit 1
        fi

        if [ "${include_existing_apps}" = "true" ]; then
          app_check_list="${existing_apps} ${required_apps}"
        else
          app_check_list="${required_apps}"
        fi

        if [ -z "${app_check_list}" ]; then
          echo "result=fail reason=no-applications"
          exit 1
        fi

        for app in ${app_check_list}; do
          case "${seen}" in
            *" ${app} "*) continue ;;
          esac
          seen="${seen}${app} "
          echo "===== Argo CD application ${app} ====="
          if ! "$K" --kubeconfig "$C" -n argocd get "application/${app}" >/dev/null 2>&1; then
            echo "result=fail reason=missing-application"
            failed=1
            continue
          fi

          status="$("$K" --kubeconfig "$C" -n argocd get "application/${app}" -o jsonpath='{.status.sync.status}{"|"}{.status.health.status}{"|"}{.status.operationState.phase}{"|"}{.status.conditions[*].type}{"|"}{.status.conditions[*].message}{"\n"}' 2>/dev/null || true)"
          sync_status="$(printf '%s' "${status}" | cut -d'|' -f1)"
          health_status="$(printf '%s' "${status}" | cut -d'|' -f2)"
          operation_phase="$(printf '%s' "${status}" | cut -d'|' -f3)"
          condition_types="$(printf '%s' "${status}" | cut -d'|' -f4)"
          condition_messages="$(printf '%s' "${status}" | cut -d'|' -f5-)"
          blocking_condition_types=""
          for condition_type in ${condition_types}; do
            case "${condition_type}" in
              OrphanedResourceWarning)
                ;;
              *)
                blocking_condition_types="${blocking_condition_types}${condition_type} "
                ;;
            esac
          done
          blocking_condition_types="${blocking_condition_types% }"

          echo "sync=${sync_status:-unknown} health=${health_status:-unknown} operation=${operation_phase:-none} conditions=${condition_types:-none} blocking_conditions=${blocking_condition_types:-none}"
          if [ -n "${condition_messages}" ]; then
            printf '%s\n' "${condition_messages}" | sed 's/^/condition_message=/'
          fi

          # A failed operation can be historical: Argo CD may subsequently reconcile
          # the application successfully. Only an operation that is still active is
          # a current health failure when sync and resource health are both good.
          operation_unhealthy=0
          case "${operation_phase}" in
            ""|Succeeded|Error|Failed) ;;
            Running|Terminating)
              operation_unhealthy=1
              ;;
            *)
              operation_unhealthy=1
              ;;
          esac

          if [ "${app}" = "openbao" ] && [ "${require_openbao_ready}" != "true" ] &&
            [ "${sync_status}" = "Synced" ] && [ "${health_status}" = "Progressing" ] &&
            [ -z "${blocking_condition_types}" ] && [ "${operation_unhealthy}" -eq 0 ]; then
            echo "result=skip reason=openbao-initialization-ceremony-pending"
          elif [ "${sync_status}" = "Synced" ] && [ "${health_status}" = "Healthy" ] && [ -z "${blocking_condition_types}" ] && [ "${operation_unhealthy}" -eq 0 ]; then
            echo "result=ok"
          else
            echo "result=fail"
            failed=1
          fi
        done

        exit "${failed}"
      args:
        executable: /bin/bash
      register: platform_app_health_argocd_app_probe
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Print Argo CD application health results
      ansible.builtin.debug:
        var: platform_app_health_argocd_app_probe.stdout_lines
      run_once: true

    - name: Verify live Argo CD Applications use guarded pruning
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        required_apps="{{ platform_app_health_required_apps_effective }}"
        include_existing_apps="{{ platform_app_health_include_existing_apps_effective | ternary('true', 'false') }}"
        enforce_guarded_prune="{{ platform_app_health_argocd_guarded_prune_effective | ternary('true', 'false') }}"
        existing_apps="$("$K" --kubeconfig "$C" -n argocd get applications.argoproj.io -o jsonpath='{range .items[*]}{.metadata.name}{" "}{end}' 2>/dev/null || true)"
        failed=0
        seen=" "

        echo "===== Argo CD guarded pruning policy ====="
        if [ "${enforce_guarded_prune}" != "true" ]; then
          echo "result=skip reason=platform-app-health-argocd-guarded-prune-disabled"
          exit 0
        fi

        if [ "${include_existing_apps}" = "true" ]; then
          app_check_list="${existing_apps} ${required_apps}"
        else
          app_check_list="${required_apps}"
        fi

        if [ -z "${app_check_list}" ]; then
          echo "result=fail reason=no-applications"
          exit 1
        fi

        for app in ${app_check_list}; do
          case "${seen}" in
            *" ${app} "*) continue ;;
          esac
          seen="${seen}${app} "
          if ! "$K" --kubeconfig "$C" -n argocd get "application/${app}" >/dev/null 2>&1; then
            echo "app=${app} result=fail reason=missing-application"
            failed=1
            continue
          fi

          policy="$("$K" --kubeconfig "$C" -n argocd get "application/${app}" \
            -o jsonpath='{.spec.syncPolicy.automated.prune}{"|"}{.spec.syncPolicy.automated.selfHeal}{"|"}{.spec.syncPolicy.automated.allowEmpty}{"\n"}' 2>/dev/null || true)"
          prune="$(printf '%s' "${policy}" | cut -d'|' -f1)"
          self_heal="$(printf '%s' "${policy}" | cut -d'|' -f2)"
          allow_empty="$(printf '%s' "${policy}" | cut -d'|' -f3)"
          sync_options_json="$("$K" --kubeconfig "$C" -n argocd get "application/${app}" \
            -o jsonpath='{.spec.syncPolicy.syncOptions}' 2>/dev/null || true)"
          missing=""

          [ "${prune}" = "true" ] || missing="${missing} automated.prune=true"
          [ "${self_heal}" = "true" ] || missing="${missing} automated.selfHeal=true"
          [ "${allow_empty}" = "false" ] || missing="${missing} automated.allowEmpty=false"
          for option in \
            "Prune=confirm" \
            "PruneLast=true" \
            "PrunePropagationPolicy=foreground"; do
            if ! printf '%s\n' "${sync_options_json}" | grep -Fq -- "\"${option}\""; then
              missing="${missing} syncOption:${option}"
            fi
          done

          if [ -n "${missing}" ]; then
            echo "app=${app} result=fail reason=unguarded-pruning-policy missing=${missing# }"
            failed=1
          else
            echo "app=${app} result=ok prune=${prune} self_heal=${self_heal} allow_empty=${allow_empty} approval=confirm order=last propagation=foreground"
          fi
        done

        exit "${failed}"
      args:
        executable: /bin/bash
      register: platform_app_health_argocd_guarded_prune_probe
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Print live Argo CD guarded pruning results
      ansible.builtin.debug:
        var: platform_app_health_argocd_guarded_prune_probe.stdout_lines
      run_once: true

    - name: Verify Argo CD application source repositories are production-safe
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        required_apps="{{ platform_app_health_required_apps_effective }}"
        include_existing_apps="{{ platform_app_health_include_existing_apps_effective | ternary('true', 'false') }}"
        forbid_temporary_repo="{{ platform_app_health_forbid_temporary_repo_effective | ternary('true', 'false') }}"
        expected_repo_url="{{ platform_app_health_expected_repo_url_effective }}"
        existing_apps="$("$K" --kubeconfig "$C" -n argocd get applications.argoproj.io -o jsonpath='{range .items[*]}{.metadata.name}{" "}{end}' 2>/dev/null || true)"
        failed=0
        seen=" "

        echo "===== Argo CD application source repositories ====="
        if [ -n "${expected_repo_url}" ]; then
          echo "expected_repo_url=${expected_repo_url}"
        else
          echo "expected_repo_url=not-set"
        fi
        if [ "${forbid_temporary_repo}" != "true" ]; then
          echo "result=skip reason=platform-app-health-forbid-temporary-repo-disabled"
          exit 0
        fi

        if [ "${include_existing_apps}" = "true" ]; then
          app_check_list="${existing_apps} ${required_apps}"
        else
          app_check_list="${required_apps}"
        fi

        if [ -z "${app_check_list}" ]; then
          echo "result=fail reason=no-applications"
          exit 1
        fi

        for app in ${app_check_list}; do
          case "${seen}" in
            *" ${app} "*) continue ;;
          esac
          seen="${seen}${app} "
          if ! "$K" --kubeconfig "$C" -n argocd get "application/${app}" >/dev/null 2>&1; then
            echo "app=${app} result=fail reason=missing-application"
            failed=1
            continue
          fi
          repo_urls="$("$K" --kubeconfig "$C" -n argocd get "application/${app}" -o jsonpath='{range .spec.sources[*]}{.repoURL}{"\n"}{end}{.spec.source.repoURL}{"\n"}' 2>/dev/null | sed '/^$/d' | sort -u || true)"
          if [ -z "${repo_urls}" ]; then
            echo "app=${app} result=fail reason=missing-repo-url"
            failed=1
            continue
          fi
          while IFS= read -r repo_url; do
            [ -n "${repo_url}" ] || continue
            result=ok
            reason=production-source
            case "${repo_url}" in
              git://*)
                result=fail
                reason=temporary-or-insecure-git-protocol
                ;;
              *:9418*|*seed-git*)
                result=fail
                reason=temporary-seed-git-source
                ;;
            esac
            if [ -n "${expected_repo_url}" ] && [ "${repo_url}" != "${expected_repo_url}" ]; then
              result=fail
              reason=unexpected-repo-url
            fi
            echo "app=${app} repo_url=${repo_url} expected_repo_url=${expected_repo_url:-not-set} result=${result} reason=${reason}"
            if [ "${result}" != "ok" ]; then
              failed=1
            fi
          done <<EOF
        ${repo_urls}
        EOF
        done

        exit "${failed}"
      args:
        executable: /bin/bash
      register: platform_app_health_argocd_source_probe
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Print Argo CD application source repository results
      ansible.builtin.debug:
        var: platform_app_health_argocd_source_probe.stdout_lines
      run_once: true

    - name: Verify platform namespace pod readiness
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        namespaces="{{ platform_app_health_namespaces_effective }}"
        require_openbao_ready="{{ platform_app_health_openbao_ready_effective | ternary('true', 'false') }}"
        failed=0
        argocd_helm_stack=false
        if "$K" --kubeconfig "$C" -n argocd get service/argo-cd-argocd-server >/dev/null 2>&1 ||
          "$K" --kubeconfig "$C" -n argocd get deployment/argo-cd-argocd-server >/dev/null 2>&1; then
          argocd_helm_stack=true
        fi

        fully_available_owner_deployment() {
          namespace="$1"
          pod="$2"
          owner_kind="$("$K" --kubeconfig "$C" -n "${namespace}" get "pod/${pod}" \
            -o jsonpath='{.metadata.ownerReferences[0].kind}' 2>/dev/null || true)"
          owner_name="$("$K" --kubeconfig "$C" -n "${namespace}" get "pod/${pod}" \
            -o jsonpath='{.metadata.ownerReferences[0].name}' 2>/dev/null || true)"
          [ "${owner_kind}" = "ReplicaSet" ] || return 1
          deployment_kind="$("$K" --kubeconfig "$C" -n "${namespace}" get "replicaset/${owner_name}" \
            -o jsonpath='{.metadata.ownerReferences[0].kind}' 2>/dev/null || true)"
          deployment_name="$("$K" --kubeconfig "$C" -n "${namespace}" get "replicaset/${owner_name}" \
            -o jsonpath='{.metadata.ownerReferences[0].name}' 2>/dev/null || true)"
          [ "${deployment_kind}" = "Deployment" ] || return 1
          stats="$("$K" --kubeconfig "$C" -n "${namespace}" get "deployment/${deployment_name}" \
            -o jsonpath='{.spec.replicas}{"|"}{.status.readyReplicas}{"|"}{.status.availableReplicas}' 2>/dev/null || true)"
          IFS='|' read -r desired ready available <<< "${stats}"
          case "${desired:-}" in ''|*[!0-9]*) desired=0 ;; esac
          case "${ready:-}" in ''|*[!0-9]*) ready=0 ;; esac
          case "${available:-}" in ''|*[!0-9]*) available=0 ;; esac
          if [ "${desired}" -gt 0 ] && [ "${ready}" -ge "${desired}" ] && [ "${available}" -ge "${desired}" ]; then
            printf '%s' "${deployment_name}"
            return 0
          fi
          return 1
        }

        for namespace in ${namespaces}; do
          echo "===== namespace ${namespace} pods ====="
          if ! "$K" --kubeconfig "$C" get "namespace/${namespace}" >/dev/null 2>&1; then
            echo "result=fail reason=missing-namespace"
            failed=1
            continue
          fi

          pods="$("$K" --kubeconfig "$C" -n "${namespace}" get pods --no-headers 2>/dev/null || true)"
          if [ -z "${pods}" ]; then
            echo "result=fail reason=no-pods"
            failed=1
            continue
          fi

          namespace_failed=0
          while read -r name ready status rest; do
            [ -n "${name}" ] || continue
            if [ "${namespace}" = "argocd" ] && [ "${argocd_helm_stack}" = "true" ]; then
              case "${name}" in
                argocd-*)
                  echo "pod=${name} ready=${ready} status=${status} result=skip reason=stale-bootstrap-argocd-workload"
                  continue
                  ;;
              esac
            fi
            case "${status}" in
              Running|Succeeded|Completed)
                ;;
              *)
                owner_deployment="$(fully_available_owner_deployment "${namespace}" "${name}" || true)"
                if [ -n "${owner_deployment}" ]; then
                  echo "pod=${name} ready=${ready} status=${status} result=skip reason=surplus-rollout-pod deployment=${owner_deployment}"
                  continue
                fi
                ;;
            esac
            echo "pod=${name} ready=${ready} status=${status}"
            case "${status}" in
              Running)
                ready_count="${ready%/*}"
                desired_count="${ready#*/}"
                if [ "${ready_count}" != "${desired_count}" ] || [ "${desired_count}" = "0" ]; then
                  openbao_state=""
                  if [ "${namespace}" = "openbao" ] && [ "${require_openbao_ready}" != "true" ]; then
                    case "${name}" in
                      openbao-[0-9]*)
                        openbao_state="$("$K" --kubeconfig "$C" -n openbao exec "pod/${name}" -- bao status -format=json 2>/dev/null || true)"
                        ;;
                    esac
                  fi
                  if printf '%s' "${openbao_state}" | grep -Eq '"initialized"[[:space:]]*:[[:space:]]*false' &&
                    printf '%s' "${openbao_state}" | grep -Eq '"sealed"[[:space:]]*:[[:space:]]*true'; then
                    echo "pod=${name} result=skip reason=openbao-uninitialized-and-sealed-bootstrap-state"
                  else
                    namespace_failed=1
                  fi
                fi
                ;;
              Succeeded|Completed)
                ;;
              *)
                namespace_failed=1
                ;;
            esac
          done <<< "${pods}"

          if [ "${namespace_failed}" -eq 0 ]; then
            echo "result=ok"
          else
            echo "result=fail"
            failed=1
          fi
        done

        exit "${failed}"
      args:
        executable: /bin/bash
      register: platform_app_health_pod_probe
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Print platform pod readiness results
      ansible.builtin.debug:
        var: platform_app_health_pod_probe.stdout_lines
      run_once: true

    - name: Verify Argo CD runtime component coverage
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        CHECK_ARGOCD_RUNTIME="{{ platform_app_health_argocd_runtime_effective | ternary('true', 'false') }}"
        failed=0

        if [ "${CHECK_ARGOCD_RUNTIME}" != "true" ]; then
          echo "result=skip reason=platform-app-health-argocd-runtime-disabled"
          exit 0
        fi

        echo "===== Argo CD runtime component coverage ====="
        if ! "$K" --kubeconfig "$C" get namespace/argocd >/dev/null 2>&1; then
          echo "result=fail reason=missing-namespace namespace=argocd"
          exit 1
        fi

        sanitize_uint() {
          case "${1:-}" in
            ''|*[!0-9]*) printf '0' ;;
            *) printf '%s' "$1" ;;
          esac
        }

        check_workload_ready() {
          workload="$1"
          min_ready="$2"
          if ! "$K" --kubeconfig "$C" -n argocd get "${workload}" >/dev/null 2>&1; then
            echo "result=fail reason=missing-argocd-workload workload=${workload}"
            failed=1
            return
          fi

          kind="${workload%%/*}"
          case "${kind}" in
            deployment|deploy|deployments)
              raw="$("$K" --kubeconfig "$C" -n argocd get "${workload}" -o jsonpath='{.spec.replicas}{"|"}{.status.readyReplicas}{"|"}{.status.availableReplicas}{"\n"}' 2>/dev/null || true)"
              ;;
            statefulset|sts|statefulsets)
              raw="$("$K" --kubeconfig "$C" -n argocd get "${workload}" -o jsonpath='{.spec.replicas}{"|"}{.status.readyReplicas}{"|"}{.status.availableReplicas}{"\n"}' 2>/dev/null || true)"
              ;;
            *)
              echo "result=fail reason=unsupported-argocd-workload-kind workload=${workload}"
              failed=1
              return
              ;;
          esac

          IFS='|' read -r desired ready available <<< "${raw}"
          desired="$(sanitize_uint "${desired:-0}")"
          ready="$(sanitize_uint "${ready:-0}")"
          available="$(sanitize_uint "${available:-${ready}}")"

          echo "workload=${workload} desired=${desired} ready=${ready} available=${available} min_ready=${min_ready}"
          if [ "${desired}" -lt 1 ] || [ "${ready}" -lt "${min_ready}" ] || [ "${available}" -lt "${min_ready}" ]; then
            echo "result=fail reason=argocd-workload-not-ready workload=${workload}"
            failed=1
          fi
        }

        service_ready_endpoint_count() {
          service="$1"
          "$K" --kubeconfig "$C" -n argocd get endpointslice \
            -l "kubernetes.io/service-name=${service}" \
            -o jsonpath='{range .items[*].endpoints[*]}{.conditions.ready}{"\n"}{end}' 2>/dev/null |
            awk '$1 == "true" || $1 == "<none>" || $1 == "" { count++ } END { print count + 0 }'
        }

        check_service_ready() {
          service="$1"
          port="$2"
          if ! "$K" --kubeconfig "$C" -n argocd get "service/${service}" >/dev/null 2>&1; then
            echo "result=fail reason=missing-argocd-service service=${service}"
            failed=1
            return
          fi

          cluster_ip="$("$K" --kubeconfig "$C" -n argocd get "service/${service}" -o jsonpath='{.spec.clusterIP}' 2>/dev/null || true)"
          endpoints="$(service_ready_endpoint_count "${service}")"
          service_mode=cluster-ip
          if [ "${cluster_ip}" = "None" ]; then
            service_mode=headless
          fi
          echo "service=${service} port=${port} cluster_ip=${cluster_ip:-missing} service_mode=${service_mode} ready_endpoints=${endpoints}"
          if [ -z "${cluster_ip}" ]; then
            echo "result=fail reason=argocd-service-has-no-address service=${service}"
            failed=1
          elif [ "${endpoints}" -lt 1 ]; then
            echo "result=fail reason=argocd-service-has-no-ready-endpoints service=${service}"
            failed=1
          fi
        }

        service_name_from_hostport() {
          value="$1"
          value="${value%%,*}"
          value="${value%%:*}"
          value="${value%%.*}"
          printf '%s' "${value}"
        }

        active_stack=bootstrap
        server_service=argocd-server
        repo_server_default=argocd-repo-server:8081
        redis_server_default=argocd-redis:6379
        cmd_params_cm=argocd-cmd-params-cm
        if "$K" --kubeconfig "$C" -n argocd get service/argo-cd-argocd-server >/dev/null 2>&1 ||
          "$K" --kubeconfig "$C" -n argocd get deployment/argo-cd-argocd-server >/dev/null 2>&1; then
          active_stack=helm-ha
          server_service=argo-cd-argocd-server
          repo_server_default=argo-cd-argocd-repo-server:8081
          redis_server_default=argo-cd-redis-ha-haproxy:6379
          cmd_params_cm=argo-cd-argocd-cmd-params-cm
        fi

        repo_server="$("$K" --kubeconfig "$C" -n argocd get "configmap/${cmd_params_cm}" -o jsonpath='{.data.repo\.server}' 2>/dev/null || true)"
        redis_server="$("$K" --kubeconfig "$C" -n argocd get "configmap/${cmd_params_cm}" -o jsonpath='{.data.redis\.server}' 2>/dev/null || true)"
        repo_server="${repo_server:-${repo_server_default}}"
        redis_server="${redis_server:-${redis_server_default}}"
        repo_service="$(service_name_from_hostport "${repo_server}")"
        redis_service="$(service_name_from_hostport "${redis_server}")"

        echo "active_stack=${active_stack} cmd_params_cm=${cmd_params_cm}"
        echo "configured_repo_server=${repo_server} repo_service=${repo_service}"
        echo "configured_redis_server=${redis_server} redis_service=${redis_service}"

        if [ "${active_stack}" = "helm-ha" ]; then
          check_workload_ready deployment/argo-cd-argocd-server 1
          check_workload_ready deployment/argo-cd-argocd-repo-server 1
          check_workload_ready statefulset/argo-cd-argocd-application-controller 1
          check_service_ready "${server_service}" 80
        else
          check_workload_ready deployment/argocd-server 1
          check_workload_ready deployment/argocd-repo-server 1
          check_workload_ready statefulset/argocd-application-controller 1
          check_service_ready "${server_service}" 80
        fi
        check_service_ready "${repo_service}" 8081
        check_service_ready "${redis_service}" 6379

        if [ "${failed}" -eq 0 ]; then
          echo "result=ok"
        fi
        exit "${failed}"
      args:
        executable: /bin/bash
      register: platform_app_health_argocd_runtime_probe
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Print Argo CD runtime component coverage results
      ansible.builtin.debug:
        var: platform_app_health_argocd_runtime_probe.stdout_lines
      run_once: true

    - name: Verify critical HA workload replica coverage
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        required_apps=" {{ platform_app_health_required_apps_effective }} "
        REQUIRE_HA_REPLICAS="{{ platform_app_health_ha_replicas_effective | ternary('true', 'false') }}"
        failed=0

        if [ "${REQUIRE_HA_REPLICAS}" != "true" ]; then
          echo "result=skip reason=platform-app-health-ha-replicas-disabled"
          exit 0
        fi

        required_app_present() {
          case "${required_apps}" in
            *" $1 "*) return 0 ;;
            *) return 1 ;;
          esac
        }

        woodpecker_uses_postgres() {
          mode="{{ platform_woodpecker_database_mode_effective }}"
          case "${mode}" in
            postgres|postgresql|external)
              echo "woodpecker_database_mode=${mode}"
              return 0
              ;;
            sqlite)
              echo "woodpecker_database_mode=sqlite"
              return 1
              ;;
          esac

          for workload in statefulset/woodpecker-server deployment/woodpecker-server; do
            if ! "$K" --kubeconfig "$C" -n woodpecker get "${workload}" >/dev/null 2>&1; then
              continue
            fi
            driver="$("$K" --kubeconfig "$C" -n woodpecker get "${workload}" -o jsonpath='{range .spec.template.spec.containers[*].env[?(@.name=="WOODPECKER_DATABASE_DRIVER")]}{.value}{"\n"}{end}' 2>/dev/null || true)"
            env_from="$("$K" --kubeconfig "$C" -n woodpecker get "${workload}" -o jsonpath='{range .spec.template.spec.containers[*].envFrom[*].secretRef}{.name}{"\n"}{end}' 2>/dev/null || true)"
            case "${driver}" in
              *postgres*|*postgresql*)
                echo "woodpecker_database_mode=postgres source=${workload}/env"
                return 0
                ;;
            esac
            case " ${env_from} " in
              *" {{ platform_woodpecker_database_secret_name_effective }} "*)
                echo "woodpecker_database_mode=postgres source=${workload}/envFrom"
                return 0
                ;;
            esac
          done

          echo "woodpecker_database_mode=sqlite source=auto"
          return 1
        }

        sanitize_uint() {
          case "${1:-}" in
            ''|*[!0-9]*) printf '0' ;;
            *) printf '%s' "$1" ;;
          esac
        }

        check_workload() {
          namespace="$1"
          workload="$2"
          min_desired="$3"
          min_ready="$4"
          label="$5"

          echo "===== HA workload ${label} (${namespace}/${workload}) ====="
          if ! "$K" --kubeconfig "$C" -n "${namespace}" get "${workload}" >/dev/null 2>&1; then
            echo "result=fail reason=missing-ha-workload workload=${namespace}/${workload}"
            failed=1
            return
          fi

          kind="${workload%%/*}"
          case "${kind}" in
            deployment|deploy|deployments)
              raw="$("$K" --kubeconfig "$C" -n "${namespace}" get "${workload}" -o jsonpath='{.spec.replicas}{"|"}{.status.updatedReplicas}{"|"}{.status.readyReplicas}{"|"}{.status.availableReplicas}{"\n"}' 2>/dev/null || true)"
              ;;
            statefulset|sts|statefulsets)
              raw="$("$K" --kubeconfig "$C" -n "${namespace}" get "${workload}" -o jsonpath='{.spec.replicas}{"|"}{.status.updatedReplicas}{"|"}{.status.readyReplicas}{"|"}{.status.availableReplicas}{"\n"}' 2>/dev/null || true)"
              ;;
            daemonset|ds|daemonsets)
              raw="$("$K" --kubeconfig "$C" -n "${namespace}" get "${workload}" -o jsonpath='{.status.desiredNumberScheduled}{"|"}{.status.updatedNumberScheduled}{"|"}{.status.numberReady}{"|"}{.status.numberAvailable}{"\n"}' 2>/dev/null || true)"
              ;;
            *)
              echo "result=fail reason=unsupported-ha-workload-kind workload=${namespace}/${workload}"
              failed=1
              return
              ;;
          esac

          IFS='|' read -r desired updated ready available <<< "${raw}"
          desired="$(sanitize_uint "${desired:-0}")"
          updated="$(sanitize_uint "${updated:-0}")"
          ready="$(sanitize_uint "${ready:-0}")"
          available="$(sanitize_uint "${available:-${ready}}")"
          echo "desired=${desired} updated=${updated} ready=${ready} available=${available} min_desired=${min_desired} min_ready=${min_ready}"

          if [ "${desired}" -lt "${min_desired}" ]; then
            echo "result=fail reason=ha-workload-replicas-below-minimum"
            failed=1
            return
          fi

          if [ "${updated}" -lt "${min_ready}" ] || [ "${ready}" -lt "${min_ready}" ] || [ "${available}" -lt "${min_ready}" ]; then
            echo "result=fail reason=ha-workload-ready-replicas-below-minimum"
            failed=1
            return
          fi

          echo "result=ok"
        }

        check_first_workload() {
          namespace="$1"
          min_desired="$2"
          min_ready="$3"
          label="$4"
          shift 4

          for workload in "$@"; do
            if "$K" --kubeconfig "$C" -n "${namespace}" get "${workload}" >/dev/null 2>&1; then
              check_workload "${namespace}" "${workload}" "${min_desired}" "${min_ready}" "${label}"
              return
            fi
          done

          echo "===== HA workload ${label} (${namespace}) ====="
          echo "result=fail reason=missing-ha-workload candidates=$*"
          failed=1
        }

        if required_app_present argocd-ha; then
          check_first_workload argocd 2 2 argocd-server deployment/argo-cd-argocd-server deployment/argocd-server
          check_first_workload argocd 2 2 argocd-repo-server deployment/argo-cd-argocd-repo-server deployment/argocd-repo-server
          check_first_workload argocd 2 2 argocd-applicationset-controller deployment/argo-cd-argocd-applicationset-controller deployment/argocd-applicationset-controller
          check_first_workload argocd 3 3 argocd-redis-ha-server statefulset/argo-cd-redis-ha-server statefulset/argocd-redis-ha-server
        else
          echo "result=skip reason=argocd-ha-not-required-by-platform-app-health-required-apps"
        fi

        if required_app_present traefik; then
          check_first_workload traefik 3 3 traefik deployment/platform-traefik deployment/traefik
        else
          echo "result=skip reason=traefik-not-required-by-platform-app-health-required-apps"
        fi

        if required_app_present woodpecker; then
          if woodpecker_uses_postgres; then
            check_first_workload woodpecker 2 2 woodpecker-server statefulset/woodpecker-server deployment/woodpecker-server
          else
            check_first_workload woodpecker 1 1 woodpecker-server statefulset/woodpecker-server deployment/woodpecker-server
          fi
          check_first_workload woodpecker 3 3 woodpecker-agent statefulset/woodpecker-agent deployment/woodpecker-agent
        else
          echo "result=skip reason=woodpecker-not-required-by-platform-app-health-required-apps"
        fi

        exit "${failed}"
      args:
        executable: /bin/bash
      register: platform_app_health_ha_replica_probe
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Print HA workload replica coverage results
      ansible.builtin.debug:
        var: platform_app_health_ha_replica_probe.stdout_lines
      run_once: true

    - name: Verify Forgejo singleton disruption safeguards
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        required_apps=" {{ platform_app_health_required_apps_effective }} "

        if [ "{{ platform_app_health_forgejo_singleton_safety_effective | ternary('true', 'false') }}" != "true" ]; then
          echo "result=skip reason=forgejo-singleton-safety-disabled"
          exit 0
        fi

        case "${required_apps}" in
          *" forgejo "*) ;;
          *)
            echo "result=skip reason=forgejo-not-required-by-platform-app-health-required-apps"
            exit 0
            ;;
        esac

        if ! "$K" --kubeconfig "$C" -n forgejo get deployment/forgejo >/dev/null 2>&1; then
          echo "result=fail reason=missing-forgejo-deployment"
          exit 1
        fi

        deployment_state="$("$K" --kubeconfig "$C" -n forgejo get deployment/forgejo \
          -o jsonpath='{.spec.replicas}{"|"}{.spec.strategy.type}{"\n"}' 2>/dev/null || true)"
        IFS='|' read -r replicas strategy <<< "${deployment_state}"
        echo "forgejo_replicas=${replicas:-unknown} rollout_strategy=${strategy:-unknown}"

        if [ "${replicas:-}" != "1" ]; then
          echo "result=fail reason=forgejo-singleton-replica-contract-mismatch"
          exit 1
        fi
        if [ "${strategy:-}" != "Recreate" ]; then
          echo "result=fail reason=forgejo-singleton-overlapping-rollout-risk"
          exit 1
        fi

        pdb_names="$("$K" --kubeconfig "$C" -n forgejo get poddisruptionbudgets.policy \
          -l app.kubernetes.io/name=forgejo,app.kubernetes.io/instance=forgejo \
          -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)"
        if [ -z "${pdb_names}" ]; then
          echo "result=fail reason=missing-forgejo-singleton-pdb"
          exit 1
        fi

        protected=false
        while IFS= read -r pdb; do
          [ -n "${pdb}" ] || continue
          pdb_state="$("$K" --kubeconfig "$C" -n forgejo get "poddisruptionbudget.policy/${pdb}" \
            -o jsonpath='{.spec.minAvailable}{"|"}{.spec.maxUnavailable}{"\n"}' 2>/dev/null || true)"
          IFS='|' read -r min_available max_unavailable <<< "${pdb_state}"
          echo "pdb=${pdb} min_available=${min_available:-unset} max_unavailable=${max_unavailable:-unset}"
          if [ "${min_available:-}" = "1" ] && [ -z "${max_unavailable:-}" ]; then
            protected=true
          fi
        done <<< "${pdb_names}"

        if [ "${protected}" != "true" ]; then
          echo "result=fail reason=forgejo-singleton-pdb-does-not-preserve-one-replica"
          exit 1
        fi

        echo "result=ok"
      args:
        executable: /bin/bash
      register: platform_app_health_forgejo_singleton_safety_probe
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Print Forgejo singleton disruption safeguard results
      ansible.builtin.debug:
        var: platform_app_health_forgejo_singleton_safety_probe.stdout_lines
      run_once: true

    - name: Verify Woodpecker runtime image tags
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        required_apps=" {{ platform_app_health_required_apps_effective }} "
        expected_tag="{{ platform_app_health_woodpecker_image_tag_effective }}"
        case "${expected_tag}" in
          [0-9]*)
            expected_tag="v${expected_tag}"
            ;;
        esac
        failed=0

        case "${required_apps}" in
          *" woodpecker "*) ;;
          *)
            echo "result=skip reason=woodpecker-not-required-by-platform-app-health-required-apps"
            exit 0
            ;;
        esac

        echo "===== Woodpecker runtime image tags ====="
        echo "expected_tag=${expected_tag}"
        if ! "$K" --kubeconfig "$C" get namespace/woodpecker >/dev/null 2>&1; then
          echo "result=fail reason=missing-namespace namespace=woodpecker"
          exit 1
        fi

        pods="$("$K" --kubeconfig "$C" -n woodpecker get pods -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{range .spec.containers[*]}{.image}{" "}{end}{"\n"}{end}' 2>/dev/null || true)"
        if [ -z "${pods}" ]; then
          echo "result=fail reason=no-woodpecker-pods"
          exit 1
        fi

        check_role() {
          role="$1"
          prefix="$2"
          role_pods="$(printf '%s\n' "${pods}" | awk -F'|' -v prefix="${prefix}" '$1 ~ prefix { print }')"
          count="$(printf '%s\n' "${role_pods}" | awk 'NF { count++ } END { print count + 0 }')"
          if [ "${count}" -eq 0 ]; then
            echo "result=fail reason=missing-woodpecker-role role=${role}"
            failed=1
            return
          fi

          while IFS='|' read -r pod images; do
            [ -n "${pod}" ] || continue
            for image in ${images}; do
              [ -n "${image}" ] || continue
              echo "role=${role} pod=${pod} image=${image}"
              image_tag="${image##*:}"
              case "${image_tag}" in
                "${expected_tag}")
                  ;;
                *)
                  echo "result=fail reason=woodpecker-image-tag-mismatch role=${role} pod=${pod} image=${image} expected_tag=${expected_tag}"
                  failed=1
                  ;;
              esac
            done
          done <<< "${role_pods}"
        }

        check_role server '^woodpecker-server'
        check_role agent '^woodpecker-agent'

        if [ "${failed}" -eq 0 ]; then
          echo "result=ok"
        fi
        exit "${failed}"
      args:
        executable: /bin/bash
      register: platform_app_health_woodpecker_image_probe
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Print Woodpecker runtime image tag results
      ansible.builtin.debug:
        var: platform_app_health_woodpecker_image_probe.stdout_lines
      run_once: true

    - name: Verify cert-manager Certificate readiness
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        required_apps="{{ platform_app_health_required_apps_effective }}"
        requested_certificates="{{ platform_app_health_certificates_effective }}"
        requested_certificates_normalized="$(printf '%s' "${requested_certificates}" | tr ',\n\t' '    ' | xargs || true)"
        requested_certificates_lower="$(printf '%s' "${requested_certificates_normalized}" | tr '[:upper:]' '[:lower:]')"
        failed=0

        echo "===== cert-manager Certificate readiness ====="

        case " ${requested_certificates_lower} " in
          *" none "*|*" skip "*|*" disabled "*)
            echo "result=skip reason=platform-app-health-certificates-disabled"
            exit 0
            ;;
        esac

        case " ${required_apps} " in
          *" cert-manager "*) ;;
          *)
            echo "result=skip reason=cert-manager-not-required-by-platform-app-health-required-apps"
            exit 0
            ;;
        esac

        if ! "$K" --kubeconfig "$C" get crd certificates.cert-manager.io >/dev/null 2>&1; then
          echo "result=fail reason=cert-manager-certificate-crd-missing"
          exit 1
        fi

        if [ "${requested_certificates_lower}" = "auto" ]; then
          certificate_refs="$("$K" --kubeconfig "$C" get certificates.cert-manager.io -A \
            -o jsonpath='{range .items[*]}{.metadata.namespace}{"/"}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)"
        else
          certificate_refs="${requested_certificates_normalized}"
        fi

        if [ -z "${certificate_refs}" ]; then
          echo "result=ok reason=no-cert-manager-certificates"
          exit 0
        fi

        for certificate_ref in ${certificate_refs}; do
          echo "===== Certificate ${certificate_ref} ====="
          case "${certificate_ref}" in
            */*) ;;
            *)
              echo "result=fail reason=invalid-cert-manager-certificate-ref expected=namespace/name"
              failed=1
              continue
              ;;
          esac
          namespace="${certificate_ref%%/*}"
          name="${certificate_ref#*/}"
          if ! "$K" --kubeconfig "$C" -n "${namespace}" get "certificates.cert-manager.io/${name}" >/dev/null 2>&1; then
            echo "result=fail reason=missing-cert-manager-certificate namespace=${namespace} name=${name}"
            failed=1
            continue
          fi

          info="$("$K" --kubeconfig "$C" -n "${namespace}" get "certificates.cert-manager.io/${name}" \
            -o jsonpath='{.metadata.name}{"|"}{.spec.secretName}{"|"}{.status.conditions[?(@.type=="Ready")].status}{"|"}{.status.notAfter}{"|"}{.status.renewalTime}{"\n"}' 2>/dev/null || true)"
          certificate_name="$(printf '%s' "${info}" | cut -d'|' -f1)"
          secret_name="$(printf '%s' "${info}" | cut -d'|' -f2)"
          ready_condition="$(printf '%s' "${info}" | cut -d'|' -f3)"
          not_after="$(printf '%s' "${info}" | cut -d'|' -f4)"
          renewal_time="$(printf '%s' "${info}" | cut -d'|' -f5)"
          echo "name=${certificate_name:-unknown} secret=${secret_name:-none} readyCondition=${ready_condition:-unknown} notAfter=${not_after:-unknown} renewalTime=${renewal_time:-unknown}"

          certificate_failed=0
          if [ "${ready_condition}" != "True" ]; then
            echo "result=fail reason=cert-manager-certificate-not-ready"
            certificate_failed=1
          fi
          if [ -z "${secret_name}" ]; then
            echo "result=fail reason=cert-manager-certificate-secret-name-missing"
            certificate_failed=1
          elif ! "$K" --kubeconfig "$C" -n "${namespace}" get "secret/${secret_name}" >/dev/null 2>&1; then
            echo "result=fail reason=cert-manager-certificate-secret-missing namespace=${namespace} secret=${secret_name}"
            certificate_failed=1
          fi

          if [ "${certificate_failed}" -eq 0 ]; then
            echo "result=ok"
          else
            failed=1
          fi
        done

        exit "${failed}"
      args:
        executable: /bin/bash
      register: platform_app_health_certificate_probe
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Print cert-manager Certificate readiness results
      ansible.builtin.debug:
        var: platform_app_health_certificate_probe.stdout_lines
      run_once: true

    - name: Verify trust-manager Bundle readiness
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        required_apps="{{ platform_app_health_required_apps_effective }}"
        requested_bundles="{{ platform_app_health_trust_bundles_effective }}"
        requested_bundles_normalized="$(printf '%s' "${requested_bundles}" | tr ',\n\t' '    ' | xargs || true)"
        requested_bundles_lower="$(printf '%s' "${requested_bundles_normalized}" | tr '[:upper:]' '[:lower:]')"
        failed=0

        echo "===== trust-manager Bundle readiness ====="

        case " ${requested_bundles_lower} " in
          *" none "*|*" skip "*|*" disabled "*)
            echo "result=skip reason=platform-app-health-trust-bundles-disabled"
            exit 0
            ;;
        esac

        case " ${required_apps} " in
          *" trust-manager "*) ;;
          *)
            echo "result=skip reason=trust-manager-not-required-by-platform-app-health-required-apps"
            exit 0
            ;;
        esac

        if ! "$K" --kubeconfig "$C" get crd bundles.trust.cert-manager.io >/dev/null 2>&1; then
          echo "result=fail reason=trust-manager-bundle-crd-missing"
          exit 1
        fi

        if [ "${requested_bundles_lower}" = "auto" ]; then
          bundle_refs="$("$K" --kubeconfig "$C" get bundles.trust.cert-manager.io \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)"
        else
          bundle_refs="${requested_bundles_normalized}"
        fi

        if [ -z "${bundle_refs}" ]; then
          echo "result=ok reason=no-trust-manager-bundles"
          exit 0
        fi

        for bundle_ref in ${bundle_refs}; do
          echo "===== Bundle ${bundle_ref} ====="
          case "${bundle_ref}" in
            */*)
              echo "result=fail reason=invalid-trust-manager-bundle-ref expected=name"
              failed=1
              continue
              ;;
          esac
          if ! "$K" --kubeconfig "$C" get "bundles.trust.cert-manager.io/${bundle_ref}" >/dev/null 2>&1; then
            echo "result=fail reason=missing-trust-manager-bundle name=${bundle_ref}"
            failed=1
            continue
          fi

          info="$("$K" --kubeconfig "$C" get "bundles.trust.cert-manager.io/${bundle_ref}" \
            -o jsonpath='{.metadata.name}{"|"}{.status.conditions[?(@.type=="Ready")].status}{"|"}{.status.conditions[?(@.type=="Synced")].status}{"|"}{.status.defaultCAVersion}{"\n"}' 2>/dev/null || true)"
          bundle_name="$(printf '%s' "${info}" | cut -d'|' -f1)"
          ready_condition="$(printf '%s' "${info}" | cut -d'|' -f2)"
          synced_condition="$(printf '%s' "${info}" | cut -d'|' -f3)"
          default_ca_version="$(printf '%s' "${info}" | cut -d'|' -f4)"
          echo "name=${bundle_name:-unknown} readyCondition=${ready_condition:-unknown} syncedCondition=${synced_condition:-unknown} defaultCAVersion=${default_ca_version:-unknown}"

          if [ "${ready_condition}" = "True" ] || [ "${synced_condition}" = "True" ]; then
            echo "result=ok"
