    platform_app_health_argocd_guarded_prune_effective: "{{ platform_app_health_argocd_guarded_prune | default(platform_app_health_argocd_guarded_prune_from_env, true) | default(true, true) | bool }}"
    platform_app_health_argocd_runtime_effective: "{{ platform_app_health_argocd_runtime | default(platform_app_health_argocd_runtime_from_env, true) | default(true, true) | bool }}"
    platform_app_health_longhorn_runtime_effective: "{{ platform_app_health_longhorn_runtime | default(platform_app_health_longhorn_runtime_from_env, true) | default(true, true) | bool }}"
