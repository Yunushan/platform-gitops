    platform_harbor_admin_secret_name_effective: "{{ platform_harbor_admin_secret_name | default(platform_harbor_admin_secret_name_from_env, true) | default('harbor-admin', true) }}"
    platform_harbor_secret_key_secret_name_effective: "{{ platform_harbor_secret_key_secret_name | default(platform_harbor_secret_key_secret_name_from_env, true) | default('harbor-secret-key', true) }}"
    platform_harbor_database_secret_name_effective: "{{ platform_harbor_database_secret_name | default(platform_harbor_database_secret_name_from_env, true) | default('harbor-database', true) }}"
    platform_harbor_redis_secret_name_effective: "{{ platform_harbor_redis_secret_name | default(platform_harbor_redis_secret_name_from_env, true) | default('harbor-redis', true) }}"
