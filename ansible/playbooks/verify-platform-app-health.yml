    - name: Verify step-ca API readiness
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        required_apps="{{ platform_app_health_required_apps_effective }}"
        REQUIRE_STEP_CA_API="{{ platform_app_health_step_ca_api_effective | ternary('true', 'false') }}"
        NAMESPACE=step-ca
        failed=0

        echo "===== step-ca API readiness ====="

        if [ "${REQUIRE_STEP_CA_API}" != "true" ]; then
          echo "result=skip reason=platform-app-health-step-ca-api-disabled"
          exit 0
        fi

        case " ${required_apps} " in
          *" step-ca "*) ;;
          *)
            echo "result=skip reason=step-ca-not-required-by-platform-app-health-required-apps"
            exit 0
            ;;
        esac

        if ! command -v curl >/dev/null 2>&1; then
          echo "result=fail reason=curl-not-installed"
          exit 1
        fi

        if ! "$K" --kubeconfig "$C" get "namespace/${NAMESPACE}" >/dev/null 2>&1; then
          echo "result=fail reason=missing-step-ca-namespace namespace=${NAMESPACE}"
          exit 1
        fi

        probe_step_ca_service() {
          service="$1"
          if ! "$K" --kubeconfig "$C" -n "${NAMESPACE}" get "service/${service}" >/dev/null 2>&1; then
            echo "service=${service} result=skip reason=service-missing"
            return 2
          fi
          cluster_ip="$("$K" --kubeconfig "$C" -n "${NAMESPACE}" get "service/${service}" -o jsonpath='{.spec.clusterIP}' 2>/dev/null || true)"
          if [ -z "${cluster_ip}" ] || [ "${cluster_ip}" = "None" ]; then
            echo "service=${service} result=skip reason=headless-or-missing-cluster-ip"
            return 2
          fi
          ports="$("$K" --kubeconfig "$C" -n "${NAMESPACE}" get "service/${service}" \
            -o jsonpath='{range .spec.ports[*]}{.port}{"\n"}{end}' 2>/dev/null || true)"
          port=443
          if ! printf '%s\n' "${ports}" | grep -qx '443'; then
            port="$(printf '%s\n' "${ports}" | awk 'NF { print; exit }')"
          fi
          if [ -z "${port}" ]; then
            echo "service=${service} result=fail reason=no-service-port"
            return 1
          fi
          url="https://${cluster_ip}:${port}/health"
          body_file="$(mktemp)"
          error_file="$(mktemp)"
          code="$(curl --silent --show-error --insecure --output "${body_file}" \
            --write-out '%{http_code}' \
            --connect-timeout {{ platform_app_health_connect_timeout_effective }} \
            --max-time {{ platform_app_health_max_time_effective }} \
            "${url}" 2>"${error_file}" || true)"
          body="$(cat "${body_file}" 2>/dev/null || true)"
          stderr="$(cat "${error_file}" 2>/dev/null || true)"
          rm -f "${body_file}" "${error_file}"
          echo "service=${service} url=${url} http_code=${code:-000}"
          if [ -n "${stderr}" ]; then
            printf '%s\n' "${stderr}" | sed "s/^/service=${service} stderr=/"
          fi
          if [ -n "${body}" ]; then
            printf '%s\n' "${body}" | head -c 240 | sed "s/^/service=${service} body=/"
            printf '\n'
          fi
          if [ "${code}" = "200" ]; then
            echo "service=${service} result=ok"
            return 0
          fi
          echo "service=${service} result=fail reason=unexpected-step-ca-health-http-code"
          return 1
        }

        found=0
        for service in step-ca step-certificates step-ca-step-certificates; do
          if "$K" --kubeconfig "$C" -n "${NAMESPACE}" get "service/${service}" >/dev/null 2>&1; then
            found=1
            if probe_step_ca_service "${service}"; then
              exit 0
            fi
            failed=1
          fi
        done

        if [ "${found}" -eq 0 ]; then
          echo "result=fail reason=no-known-step-ca-service"
          exit 1
        fi
        echo "result=fail reason=no-step-ca-service-ready"
        exit "${failed}"
      args:
        executable: /bin/bash
      register: platform_app_health_step_ca_api_probe
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Print step-ca API readiness results
      ansible.builtin.debug:
        var: platform_app_health_step_ca_api_probe.stdout_lines
      run_once: true

    - name: Verify CloudNativePG cluster readiness
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        requested_clusters="{{ platform_app_health_cnpg_clusters_effective }}"
        requested_clusters_normalized="$(printf '%s' "${requested_clusters}" | tr ',\n\t' '    ' | xargs || true)"
        requested_clusters_lower="$(printf '%s' "${requested_clusters_normalized}" | tr '[:upper:]' '[:lower:]')"
        failed=0

        case " ${requested_clusters_lower} " in
          *" none "*|*" skip "*|*" disabled "*)
            echo "result=skip reason=platform-app-health-cnpg-clusters-disabled"
            exit 0
            ;;
        esac

        if ! "$K" --kubeconfig "$C" get crd clusters.postgresql.cnpg.io >/dev/null 2>&1; then
          if [ "${requested_clusters_lower}" = "auto" ]; then
            echo "result=ok reason=no-cloudnativepg-cluster-crd"
            exit 0
          fi
          echo "result=fail reason=cloudnativepg-cluster-crd-missing"
          exit 1
        fi

        if [ "${requested_clusters_lower}" = "auto" ]; then
          cluster_refs="$("$K" --kubeconfig "$C" get clusters.postgresql.cnpg.io -A \
            -o jsonpath='{range .items[*]}{.metadata.namespace}{"/"}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)"
        else
          cluster_refs="${requested_clusters_normalized}"
        fi

        if [ -z "${cluster_refs}" ]; then
          echo "result=ok reason=no-cloudnativepg-clusters"
          exit 0
        fi

        for cluster_ref in ${cluster_refs}; do
          echo "===== CloudNativePG cluster ${cluster_ref} ====="
          case "${cluster_ref}" in
            */*) ;;
            *)
              echo "result=fail reason=invalid-cnpg-cluster-ref expected=namespace/name"
              failed=1
              continue
              ;;
          esac
          namespace="${cluster_ref%%/*}"
          name="${cluster_ref#*/}"
          if ! "$K" --kubeconfig "$C" -n "${namespace}" get "clusters.postgresql.cnpg.io/${name}" >/dev/null 2>&1; then
            echo "result=fail reason=missing-cnpg-cluster namespace=${namespace} name=${name}"
            failed=1
            continue
          fi

          info="$("$K" --kubeconfig "$C" -n "${namespace}" get "clusters.postgresql.cnpg.io/${name}" \
            -o jsonpath='{.metadata.name}{"|"}{.spec.instances}{"|"}{.status.instances}{"|"}{.status.readyInstances}{"|"}{.status.currentPrimary}{"|"}{.status.phase}{"|"}{.status.conditions[?(@.type=="Ready")].status}{"\n"}' 2>/dev/null || true)"
          cluster_name="$(printf '%s' "${info}" | cut -d'|' -f1)"
          desired_instances="$(printf '%s' "${info}" | cut -d'|' -f2)"
          observed_instances="$(printf '%s' "${info}" | cut -d'|' -f3)"
          ready_instances="$(printf '%s' "${info}" | cut -d'|' -f4)"
          current_primary="$(printf '%s' "${info}" | cut -d'|' -f5)"
          phase="$(printf '%s' "${info}" | cut -d'|' -f6)"
          ready_condition="$(printf '%s' "${info}" | cut -d'|' -f7)"
          echo "name=${cluster_name:-unknown} desired=${desired_instances:-unknown} observed=${observed_instances:-unknown} ready=${ready_instances:-unknown} primary=${current_primary:-none} phase=${phase:-unknown} readyCondition=${ready_condition:-unknown}"

          cluster_failed=0
          if [ "${ready_condition}" != "True" ]; then
            echo "result=fail reason=cnpg-cluster-not-ready"
            cluster_failed=1
          fi
          if printf '%s' "${desired_instances}" | grep -Eq '^[0-9]+$' &&
            printf '%s' "${ready_instances}" | grep -Eq '^[0-9]+$' &&
            [ "${ready_instances}" -lt "${desired_instances}" ]; then
            echo "result=fail reason=cnpg-ready-instances-below-desired"
            cluster_failed=1
          fi
          if [ -z "${current_primary}" ]; then
            echo "result=fail reason=cnpg-current-primary-missing"
            cluster_failed=1
          fi

          if [ "${cluster_failed}" -eq 0 ]; then
            echo "result=ok"
          else
            failed=1
          fi
        done

        exit "${failed}"
      args:
        executable: /bin/bash
      register: platform_app_health_cnpg_cluster_probe
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Print CloudNativePG cluster readiness results
      ansible.builtin.debug:
        var: platform_app_health_cnpg_cluster_probe.stdout_lines
      run_once: true

    - name: Verify Loki API readiness
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        required_apps="{{ platform_app_health_required_apps_effective }}"
        REQUIRE_LOKI_API="{{ platform_app_health_loki_api_effective | ternary('true', 'false') }}"
        NAMESPACE=logging
        failed=0

        echo "===== Loki API readiness ====="

        if [ "${REQUIRE_LOKI_API}" != "true" ]; then
          echo "result=skip reason=platform-app-health-loki-api-disabled"
          exit 0
        fi

        case " ${required_apps} " in
          *" loki "*) ;;
          *)
            echo "result=skip reason=loki-not-required-by-platform-app-health-required-apps"
            exit 0
            ;;
        esac

        if ! command -v curl >/dev/null 2>&1; then
          echo "result=fail reason=curl-not-installed"
          exit 1
        fi

        if ! "$K" --kubeconfig "$C" get "namespace/${NAMESPACE}" >/dev/null 2>&1; then
          echo "result=fail reason=missing-loki-namespace namespace=${NAMESPACE}"
          exit 1
        fi

        probe_loki_service() {
          service="$1"
          port="$2"
          path="$3"
          if ! "$K" --kubeconfig "$C" -n "${NAMESPACE}" get "service/${service}" >/dev/null 2>&1; then
            return 2
          fi
          cluster_ip="$("$K" --kubeconfig "$C" -n "${NAMESPACE}" get "service/${service}" -o jsonpath='{.spec.clusterIP}' 2>/dev/null || true)"
          if [ -z "${cluster_ip}" ] || [ "${cluster_ip}" = "None" ]; then
            echo "service=${service} result=skip reason=headless-or-missing-cluster-ip"
            return 2
          fi
          body_file="$(mktemp)"
          error_file="$(mktemp)"
          url="http://${cluster_ip}:${port}${path}"
          echo "service=${service} url=${url}"
          code="$(curl --silent --show-error --output "${body_file}" \
            --write-out '%{http_code}' \
            --connect-timeout 5 \
            --max-time 15 \
            "${url}" 2>"${error_file}" || true)"
          stderr="$(cat "${error_file}" 2>/dev/null || true)"
          echo "service=${service} http_code=${code:-000}"
          if [ -n "${stderr}" ]; then
            printf '%s\n' "${stderr}" | sed "s/^/service=${service} stderr=/"
          fi
          if [ "${code}" = "200" ] && grep -Eiq 'ready|Ready' "${body_file}"; then
            echo "service=${service} result=ok"
            rm -f "${body_file}" "${error_file}"
            return 0
          fi
          echo "service=${service} result=fail"
          rm -f "${body_file}" "${error_file}"
          return 1
        }

        found_candidate=0
        for candidate in \
          loki-gateway:80:/ready \
          loki-read:3100:/ready \
          loki:3100:/ready \
          loki-query-frontend:3100:/ready; do
          service="${candidate%%:*}"
          rest="${candidate#*:}"
          port="${rest%%:*}"
          path="${rest#*:}"
          if "$K" --kubeconfig "$C" -n "${NAMESPACE}" get "service/${service}" >/dev/null 2>&1; then
            found_candidate=1
            if probe_loki_service "${service}" "${port}" "${path}"; then
              exit 0
            fi
          fi
        done

        if [ "${found_candidate}" -eq 0 ]; then
          echo "result=fail reason=no-known-loki-service"
        else
          echo "result=fail reason=no-loki-service-ready"
        fi
        exit 1
      args:
        executable: /bin/bash
      register: platform_app_health_loki_api_probe
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Print Loki API readiness results
      ansible.builtin.debug:
        var: platform_app_health_loki_api_probe.stdout_lines
      run_once: true

