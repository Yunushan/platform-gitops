---
- name: Diagnose and optionally reclaim safe node-local storage
  hosts: rke2_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    platform_node_storage_cleanup_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_NODE_STORAGE_CLEANUP') }}"
    platform_node_storage_cri_prune_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_NODE_STORAGE_CRI_PRUNE') }}"
    platform_node_storage_dnf_clean_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_NODE_STORAGE_DNF_CLEAN') }}"
    platform_node_storage_tmpfiles_clean_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_NODE_STORAGE_TMPFILES_CLEAN') }}"
    platform_node_storage_docker_prune_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_NODE_STORAGE_DOCKER_PRUNE') }}"
    platform_node_storage_docker_prune_until_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_NODE_STORAGE_DOCKER_PRUNE_UNTIL') }}"
    platform_node_storage_gitlab_runner_cache_prune_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_NODE_STORAGE_GITLAB_RUNNER_CACHE_PRUNE') }}"
    platform_node_storage_gitlab_runner_cache_prune_until_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_NODE_STORAGE_GITLAB_RUNNER_CACHE_PRUNE_UNTIL') }}"
    platform_node_storage_pressure_only_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_NODE_STORAGE_PRESSURE_ONLY') }}"
    platform_node_storage_wait_for_pressure_clear_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_NODE_STORAGE_WAIT_FOR_PRESSURE_CLEAR') }}"
    platform_node_storage_pressure_clear_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_NODE_STORAGE_PRESSURE_CLEAR_TIMEOUT') }}"
    platform_node_storage_journal_vacuum_size_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_NODE_STORAGE_JOURNAL_VACUUM_SIZE') }}"
    platform_node_storage_longhorn_trim_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_NODE_STORAGE_LONGHORN_TRIM') }}"
    platform_node_storage_longhorn_trim_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_NODE_STORAGE_LONGHORN_TRIM_TIMEOUT') }}"
    platform_node_storage_longhorn_orphan_wait_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_NODE_STORAGE_LONGHORN_ORPHAN_WAIT_TIMEOUT') }}"
    platform_node_storage_longhorn_pressure_eviction_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_NODE_STORAGE_LONGHORN_PRESSURE_EVICTION') }}"
    platform_node_storage_longhorn_pressure_eviction_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_NODE_STORAGE_LONGHORN_PRESSURE_EVICTION_TIMEOUT') }}"
    platform_node_storage_longhorn_target_free_percentage_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_NODE_STORAGE_LONGHORN_TARGET_FREE_PERCENTAGE') }}"
    platform_node_storage_longhorn_path_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_LONGHORN_DEFAULT_DISK_PATH') }}"
    platform_node_storage_cleanup_effective: "{{ platform_node_storage_cleanup | default(platform_node_storage_cleanup_from_env, true) | default(false, true) | bool }}"
    platform_node_storage_cri_prune_effective: "{{ platform_node_storage_cri_prune | default(platform_node_storage_cri_prune_from_env, true) | default(true, true) | bool }}"
    platform_node_storage_dnf_clean_effective: "{{ platform_node_storage_dnf_clean | default(platform_node_storage_dnf_clean_from_env, true) | default(true, true) | bool }}"
    platform_node_storage_tmpfiles_clean_effective: "{{ platform_node_storage_tmpfiles_clean | default(platform_node_storage_tmpfiles_clean_from_env, true) | default(true, true) | bool }}"
    platform_node_storage_docker_prune_effective: "{{ platform_node_storage_docker_prune | default(platform_node_storage_docker_prune_from_env, true) | default(false, true) | bool }}"
    platform_node_storage_docker_prune_until_effective: "{{ platform_node_storage_docker_prune_until | default(platform_node_storage_docker_prune_until_from_env, true) | default('168h', true) }}"
    platform_node_storage_gitlab_runner_cache_prune_effective: "{{ platform_node_storage_gitlab_runner_cache_prune | default(platform_node_storage_gitlab_runner_cache_prune_from_env, true) | default(false, true) | bool }}"
    platform_node_storage_gitlab_runner_cache_prune_until_effective: "{{ platform_node_storage_gitlab_runner_cache_prune_until | default(platform_node_storage_gitlab_runner_cache_prune_until_from_env, true) | default('168h', true) }}"
    platform_node_storage_pressure_only_effective: "{{ platform_node_storage_pressure_only | default(platform_node_storage_pressure_only_from_env, true) | default(false, true) | bool }}"
    platform_node_storage_wait_for_pressure_clear_effective: "{{ platform_node_storage_wait_for_pressure_clear | default(platform_node_storage_wait_for_pressure_clear_from_env, true) | default(false, true) | bool }}"
    platform_node_storage_pressure_clear_timeout_effective: "{{ platform_node_storage_pressure_clear_timeout | default(platform_node_storage_pressure_clear_timeout_from_env, true) | default(300, true) | int }}"
    platform_node_storage_journal_vacuum_size_effective: "{{ platform_node_storage_journal_vacuum_size | default(platform_node_storage_journal_vacuum_size_from_env, true) | default('0', true) }}"
    platform_node_storage_longhorn_trim_effective: "{{ platform_node_storage_longhorn_trim | default(platform_node_storage_longhorn_trim_from_env, true) | default(true, true) | bool }}"
    platform_node_storage_longhorn_trim_timeout_effective: "{{ platform_node_storage_longhorn_trim_timeout | default(platform_node_storage_longhorn_trim_timeout_from_env, true) | default(60, true) | int }}"
    platform_node_storage_longhorn_orphan_wait_timeout_effective: "{{ platform_node_storage_longhorn_orphan_wait_timeout | default(platform_node_storage_longhorn_orphan_wait_timeout_from_env, true) | default(420, true) | int }}"
    platform_node_storage_longhorn_pressure_eviction_effective: "{{ platform_node_storage_longhorn_pressure_eviction | default(platform_node_storage_longhorn_pressure_eviction_from_env, true) | default(true, true) | bool }}"
    platform_node_storage_longhorn_pressure_eviction_timeout_effective: "{{ platform_node_storage_longhorn_pressure_eviction_timeout | default(platform_node_storage_longhorn_pressure_eviction_timeout_from_env, true) | default(1200, true) | int }}"
    platform_node_storage_longhorn_target_free_percentage_effective: "{{ platform_node_storage_longhorn_target_free_percentage | default(platform_node_storage_longhorn_target_free_percentage_from_env, true) | default(20, true) | int }}"
    platform_node_storage_longhorn_path_effective: "{{ platform_node_storage_longhorn_path | default(platform_node_storage_longhorn_path_from_env, true) | default('/var/lib/longhorn', true) }}"

  tasks:
    - name: Validate node storage cleanup controls
      ansible.builtin.assert:
        that:
          - platform_node_storage_docker_prune_until_effective is match('^[0-9]+[smhdw]$')
          - platform_node_storage_gitlab_runner_cache_prune_until_effective is match('^[0-9]+[smhdw]$')
          - platform_node_storage_pressure_clear_timeout_effective | int >= 30
          - platform_node_storage_longhorn_trim_timeout_effective | int >= 10
          - platform_node_storage_longhorn_orphan_wait_timeout_effective | int >= 300
          - platform_node_storage_longhorn_pressure_eviction_timeout_effective | int >= 300
          - platform_node_storage_longhorn_target_free_percentage_effective | int >= 15
          - platform_node_storage_longhorn_target_free_percentage_effective | int <= 50
          - platform_node_storage_journal_vacuum_size_effective == '0' or platform_node_storage_journal_vacuum_size_effective is match('^[0-9]+[KMG]$')
          - platform_node_storage_longhorn_path_effective.startswith('/')
        fail_msg: >-
          Node storage cleanup controls are invalid. Docker retention must look
          like 168h, journal vacuum must be 0 or a size such as 2G, and the
          Longhorn path must be absolute.

    - name: Inspect Kubernetes DiskPressure before cleanup
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        if [ ! -x "${K}" ] || [ ! -r "${C}" ]; then
          echo 'disk_pressure=unknown reason=kubectl-or-kubeconfig-unavailable'
          exit 2
        fi
        pressure="$("${K}" --kubeconfig "${C}" get node {{ inventory_hostname | quote }} \
          -o jsonpath='{.status.conditions[?(@.type=="DiskPressure")].status}' 2>/dev/null || true)"
        printf 'disk_pressure=%s\n' "${pressure:-unknown}"
        case "${pressure}" in
          True) exit 42 ;;
          False) exit 0 ;;
          *) exit 2 ;;
        esac
      args:
        executable: /bin/bash
      register: platform_node_storage_pressure_before
      changed_when: false
      failed_when: false

    - name: Stop when pressure-only cleanup cannot classify the node
      ansible.builtin.assert:
        that:
          - platform_node_storage_pressure_before.rc in [0, 42]
        fail_msg: >-
          Pressure-only storage cleanup could not read Kubernetes DiskPressure
          for {{ inventory_hostname }}. Refusing to run an automatic cleanup
          without a positive pressure classification.
      when: platform_node_storage_pressure_only_effective | bool

    - name: Select nodes eligible for guarded storage cleanup
      ansible.builtin.set_fact:
        platform_node_storage_should_cleanup: >-
          {{
            (platform_node_storage_cleanup_effective | bool)
            and (
              not (platform_node_storage_pressure_only_effective | bool)
              or (platform_node_storage_pressure_before.rc == 42)
            )
          }}

    - name: Initialize cluster DiskPressure classification
      ansible.builtin.set_fact:
        platform_node_storage_cluster_has_pressure: false

    - name: Detect DiskPressure anywhere in the RKE2 server set
      ansible.builtin.set_fact:
        platform_node_storage_cluster_has_pressure: true
      loop: "{{ ansible_play_hosts_all }}"
      when:
        - >-
          (hostvars[item].get('platform_node_storage_pressure_before', {}).get('rc', -1) | int) == 42

    - name: Select nodes eligible for Longhorn filesystem trim
      ansible.builtin.set_fact:
        platform_node_storage_should_trim_longhorn: >-
          {{
            (platform_node_storage_cleanup_effective | bool)
            and (platform_node_storage_longhorn_trim_effective | bool)
            and (
              not (platform_node_storage_pressure_only_effective | bool)
              or (platform_node_storage_cluster_has_pressure | bool)
            )
          }}

    - name: Reconcile pressure-safe Longhorn reclamation settings
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml

        if ! "${K}" --kubeconfig "${C}" get namespace/longhorn-system >/dev/null 2>&1; then
          echo 'longhorn_reclamation_settings=skipped reason=namespace-absent'
          exit 0
        fi

        changed=0
        for pair in \
          'orphan-resource-auto-deletion=replica-data;instance' \
          'orphan-resource-auto-deletion-grace-period=300' \
          'storage-minimal-available-percentage=25' \
          'remove-snapshots-during-filesystem-trim=false' \
          'auto-cleanup-system-generated-snapshot=true' \
          'auto-cleanup-recurring-job-backup-snapshot=true'
        do
          setting="${pair%%=*}"
          desired="${pair#*=}"
          if ! "${K}" --kubeconfig "${C}" -n longhorn-system get \
            "settings.longhorn.io/${setting}" >/dev/null 2>&1; then
            echo "longhorn_setting=${setting} action=skip reason=setting-absent"
            continue
          fi
          current="$("${K}" --kubeconfig "${C}" -n longhorn-system get \
            "settings.longhorn.io/${setting}" -o jsonpath='{.value}')"
          if [ "${current}" = "${desired}" ]; then
            echo "longhorn_setting=${setting} action=retain value=${current}"
            continue
          fi
          "${K}" --kubeconfig "${C}" -n longhorn-system patch \
            "settings.longhorn.io/${setting}" --type=merge \
            -p "{\"value\":\"${desired}\"}" >/dev/null
          observed="$("${K}" --kubeconfig "${C}" -n longhorn-system get \
            "settings.longhorn.io/${setting}" -o jsonpath='{.value}')"
          if [ "${observed}" != "${desired}" ]; then
            echo "longhorn_setting=${setting} result=fail desired=${desired} observed=${observed:-missing}" >&2
            exit 1
          fi
          echo "longhorn_setting=${setting} action=reconcile previous=${current:-unset} value=${observed}"
          changed=1
        done
        echo "longhorn_reclamation_settings=reconciled changed=${changed}"
      args:
        executable: /bin/bash
      register: platform_node_storage_longhorn_reclamation_settings
      changed_when: >-
        'action=reconcile' in
        platform_node_storage_longhorn_reclamation_settings.stdout
      run_once: true
      delegate_to: "{{ groups['rke2_servers'][0] }}"
      when:
        - platform_node_storage_cleanup_effective | bool
        - platform_node_storage_cluster_has_pressure | bool

    - name: Collect root and Longhorn filesystem usage
      ansible.builtin.shell: |
        set -o pipefail
        longhorn_path={{ platform_node_storage_longhorn_path_effective | quote }}
        root_device="$(df -P / | awk 'NR == 2 { print $1 }')"
        root_used="$(df -P / | awk 'NR == 2 { print $5 }')"
        root_available_kib="$(df -P / | awk 'NR == 2 { print $4 }')"
        if [ -e "${longhorn_path}" ]; then
          longhorn_device="$(df -P "${longhorn_path}" | awk 'NR == 2 { print $1 }')"
          longhorn_used="$(df -P "${longhorn_path}" | awk 'NR == 2 { print $5 }')"
          longhorn_available_kib="$(df -P "${longhorn_path}" | awk 'NR == 2 { print $4 }')"
        else
          longhorn_device=absent
          longhorn_used=unknown
          longhorn_available_kib=unknown
        fi

        printf 'node=%s root_device=%s root_used=%s root_available_kib=%s longhorn_path=%s longhorn_device=%s longhorn_used=%s longhorn_available_kib=%s\n' \
          {{ inventory_hostname | quote }} \
          "${root_device:-unknown}" \
          "${root_used:-unknown}" \
          "${root_available_kib:-unknown}" \
          "${longhorn_path}" \
          "${longhorn_device:-unknown}" \
          "${longhorn_used:-unknown}" \
          "${longhorn_available_kib:-unknown}"

        if [ "${root_device}" = "${longhorn_device}" ]; then
          echo 'longhorn_default_path_shares_root=true'
          echo 'warning=Longhorn replica and snapshot data can consume root filesystem space.'
        elif [ "${longhorn_device}" = absent ]; then
          echo 'longhorn_default_path_shares_root=unknown'
        else
          echo 'longhorn_default_path_shares_root=false'
        fi

        echo 'top_root_filesystems_bytes:'
        if command -v timeout >/dev/null 2>&1; then
          timeout 120 du -x -d 1 -B1 / 2>/dev/null | sort -n | tail -20 || true
        else
          du -x -d 1 -B1 / 2>/dev/null | sort -n | tail -20 || true
        fi

        if [ -d "${longhorn_path}" ]; then
          echo 'top_longhorn_paths_bytes:'
          if command -v timeout >/dev/null 2>&1; then
            timeout 120 du -x -d 2 -B1 "${longhorn_path}" 2>/dev/null | sort -n | tail -20 || true
          else
            du -x -d 2 -B1 "${longhorn_path}" 2>/dev/null | sort -n | tail -20 || true
          fi
        fi

        echo 'journal_usage:'
        journalctl --disk-usage 2>/dev/null || true
        echo 'container_log_usage:'
        for path in /var/log/pods /var/log/containers; do
          if [ -d "${path}" ]; then
            du -shx "${path}" 2>/dev/null || true
          fi
        done
      args:
        executable: /bin/bash
      register: platform_node_storage_before
      changed_when: false

    - name: Print root and Longhorn filesystem usage
      ansible.builtin.debug:
        var: platform_node_storage_before.stdout_lines

    - name: Reclaim unused RKE2 container images
      ansible.builtin.shell: |
        set -o pipefail
        if [ "{{ platform_node_storage_should_cleanup | bool | lower }}" != "true" ] ||
          [ "{{ platform_node_storage_cri_prune_effective | bool | lower }}" != "true" ]; then
          echo 'cri_image_prune=skipped'
          exit 0
        fi

        CRICTL=/var/lib/rancher/rke2/bin/crictl
        if [ ! -x "${CRICTL}" ]; then
          echo 'cri_image_prune=skipped reason=crictl-not-found'
          exit 0
        fi

        endpoints=()
        endpoint_count=0
        for socket in /run/k3s/containerd/containerd.sock /run/containerd/containerd.sock; do
          if [ -S "${socket}" ]; then
            endpoints+=("unix://${socket}")
            endpoint_count=$((endpoint_count + 1))
          fi
        done
        if [ "${endpoint_count}" -eq 0 ]; then
          echo 'cri_image_prune=skipped reason=no-containerd-cri-socket'
          exit 0
        fi

        responsive=0
        completed=0
        failed=0
        for endpoint in "${endpoints[@]}"; do
          crictl_args=(
            --timeout 60s
            --runtime-endpoint "${endpoint}"
            --image-endpoint "${endpoint}"
          )
          if ! "${CRICTL}" "${crictl_args[@]}" info >/dev/null 2>&1; then
            echo "cri_image_prune=skipped endpoint=${endpoint} reason=cri-endpoint-unresponsive"
            continue
          fi
          responsive=$((responsive + 1))
          echo "cri_image_prune=started endpoint=${endpoint}"
          if prune_output="$("${CRICTL}" "${crictl_args[@]}" rmi --prune 2>&1)"; then
            printf '%s\n' "${prune_output}"
            echo "cri_image_prune=endpoint-completed endpoint=${endpoint}"
            completed=$((completed + 1))
          else
            printf '%s\n' "${prune_output}" >&2
            echo "cri_image_prune=endpoint-failed endpoint=${endpoint}" >&2
            failed=1
          fi
        done
        if [ "${responsive}" -eq 0 ]; then
          echo 'cri_image_prune=skipped reason=no-responsive-cri-endpoint'
          exit 0
        fi
        if [ "${failed}" -ne 0 ]; then
          exit 1
        fi
        echo "cri_image_prune=completed endpoints=${completed}"
      args:
        executable: /bin/bash
      register: platform_node_storage_cri_prune
      changed_when: "'cri_image_prune=completed endpoints=' in platform_node_storage_cri_prune.stdout"

    - name: Clean package-manager caches
      ansible.builtin.shell: |
        set -o pipefail
        if [ "{{ platform_node_storage_should_cleanup | bool | lower }}" != "true" ] ||
          [ "{{ platform_node_storage_dnf_clean_effective | bool | lower }}" != "true" ]; then
          echo 'dnf_clean=skipped'
          exit 0
        fi
        if ! command -v dnf >/dev/null 2>&1; then
          echo 'dnf_clean=skipped reason=dnf-not-found'
          exit 0
        fi
        dnf clean all
        echo 'dnf_clean=completed'
      register: platform_node_storage_dnf_clean
      args:
        executable: /bin/bash
      changed_when: "'dnf_clean=completed' in platform_node_storage_dnf_clean.stdout"

    - name: Trim mounted Longhorn filesystems during guarded cleanup
      ansible.builtin.shell: |
        set -o pipefail
        if [ "{{ platform_node_storage_should_trim_longhorn | bool | lower }}" != "true" ]; then
          echo 'longhorn_filesystem_trim=skipped'
          exit 0
        fi
        if ! command -v findmnt >/dev/null 2>&1 ||
          ! command -v fstrim >/dev/null 2>&1 ||
          ! command -v timeout >/dev/null 2>&1; then
          echo 'longhorn_filesystem_trim=skipped reason=required-tool-unavailable'
          exit 0
        fi

        candidates=0
        completed=0
        failed=0
        while read -r source target fstype; do
          [ -n "${source}" ] && [ -n "${target}" ] || continue
          case "${target}" in
            /var/lib/kubelet/plugins/kubernetes.io/csi/driver.longhorn.io/*/globalmount | \
              /var/lib/kubelet/pods/*/volumes/kubernetes.io~csi/*/mount) ;;
            *) continue ;;
          esac
          candidates=$((candidates + 1))
          echo "longhorn_filesystem_trim=started source=${source} target=${target} fstype=${fstype}"
          if timeout {{ platform_node_storage_longhorn_trim_timeout_effective | int }} \
            fstrim --verbose "${target}"; then
            completed=$((completed + 1))
            echo "longhorn_filesystem_trim=volume-completed source=${source}"
          else
            rc=$?
            failed=$((failed + 1))
            echo "longhorn_filesystem_trim=volume-skipped source=${source} rc=${rc}"
          fi
        done < <(findmnt -rn -t ext4,xfs -o SOURCE,TARGET,FSTYPE | awk '!seen[$1]++')

        if [ "${candidates}" -eq 0 ]; then
          echo 'longhorn_filesystem_trim=not-needed reason=no-mounted-longhorn-filesystem'
          exit 0
        fi
        echo "longhorn_filesystem_trim=completed volumes=${completed} skipped=${failed}"
      args:
        executable: /bin/bash
      register: platform_node_storage_longhorn_trim
      changed_when: >-
        'longhorn_filesystem_trim=volume-completed' in
        platform_node_storage_longhorn_trim.stdout

    - name: Wait for Longhorn to reclaim eligible orphan data
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        TIMEOUT={{ platform_node_storage_longhorn_orphan_wait_timeout_effective | int }}

        if ! "${K}" --kubeconfig "${C}" -n longhorn-system get \
          orphans.longhorn.io >/dev/null 2>&1; then
          echo 'longhorn_orphan_reclamation=skipped reason=resource-unavailable'
          exit 0
        fi

        ready_nodes="$("${K}" --kubeconfig "${C}" -n longhorn-system get \
          nodes.longhorn.io \
          -o jsonpath='{range .items[*]}{.metadata.name}|{range .status.conditions[?(@.type=="Ready")]}{.status}{end}{"\n"}{end}' \
          2>/dev/null | awk -F'|' '$1 != "" && $2 == "True" { print $1 }')"

        eligible_orphans() {
          "${K}" --kubeconfig "${C}" -n longhorn-system get \
            orphans.longhorn.io \
            -o jsonpath='{range .items[*]}{.metadata.name}|{.spec.orphanType}|{.spec.nodeID}|{.metadata.deletionTimestamp}{"\n"}{end}' \
            2>/dev/null |
            while IFS='|' read -r name orphan_type node_id deletion_timestamp; do
              [ -n "${name}" ] || continue
              case "${orphan_type}" in
                replica-data | instance) ;;
                *) continue ;;
              esac
              [ -z "${deletion_timestamp}" ] || continue
              if printf '%s\n' "${ready_nodes}" | grep -Fx "${node_id}" >/dev/null; then
                printf '%s\n' "${name}"
              fi
            done
        }

        pending="$(eligible_orphans)"
        if [ -z "${pending}" ]; then
          echo 'longhorn_orphan_reclamation=not-needed reason=no-eligible-orphans-on-ready-nodes'
          exit 0
        fi

        deadline=$(( $(date +%s) + TIMEOUT ))
        while [ "$(date +%s)" -lt "${deadline}" ]; do
          pending="$(eligible_orphans)"
          if [ -z "${pending}" ]; then
            echo 'longhorn_orphan_reclamation=completed'
            exit 0
          fi
          count="$(printf '%s\n' "${pending}" | awk 'NF { count++ } END { print count + 0 }')"
          echo "longhorn_orphan_reclamation=waiting eligible=${count}"
          sleep 10
        done

        count="$(printf '%s\n' "${pending}" | awk 'NF { count++ } END { print count + 0 }')"
        echo "longhorn_orphan_reclamation=deferred eligible=${count} timeout=${TIMEOUT}s"
      args:
        executable: /bin/bash
      register: platform_node_storage_longhorn_orphan_reclamation
      changed_when: >-
        'longhorn_orphan_reclamation=completed' in
        platform_node_storage_longhorn_orphan_reclamation.stdout
      run_once: true
      delegate_to: "{{ groups['rke2_servers'][0] }}"
      when:
        - platform_node_storage_cleanup_effective | bool
        - platform_node_storage_cluster_has_pressure | bool

    - name: Clean system-managed temporary files
      ansible.builtin.shell: |
        set -o pipefail
        if [ "{{ platform_node_storage_should_cleanup | bool | lower }}" != "true" ] ||
          [ "{{ platform_node_storage_tmpfiles_clean_effective | bool | lower }}" != "true" ]; then
          echo 'tmpfiles_clean=skipped'
          exit 0
        fi
        if ! command -v systemd-tmpfiles >/dev/null 2>&1; then
          echo 'tmpfiles_clean=skipped reason=systemd-tmpfiles-not-found'
          exit 0
        fi
        systemd-tmpfiles --clean
        echo 'tmpfiles_clean=completed'
      register: platform_node_storage_tmpfiles_clean
      args:
        executable: /bin/bash
      changed_when: "'tmpfiles_clean=completed' in platform_node_storage_tmpfiles_clean.stdout"

    - name: Optionally prune old Docker images and build cache
      ansible.builtin.shell: |
        set -o pipefail
        if ! command -v docker >/dev/null 2>&1; then
          echo 'docker_prune=skipped reason=docker-not-found'
          exit 0
        fi
        if ! docker info >/dev/null 2>&1; then
          echo 'docker_prune=skipped reason=docker-daemon-unavailable'
          exit 0
        fi
        docker system prune --all --force --filter "until={{ platform_node_storage_docker_prune_until_effective }}"
        echo 'docker_prune=completed'
      args:
        executable: /bin/bash
      register: platform_node_storage_docker_prune
      changed_when: "'docker_prune=completed' in platform_node_storage_docker_prune.stdout"
      when:
        - platform_node_storage_should_cleanup | bool
        - platform_node_storage_docker_prune_effective | bool

    - name: Prune old unused GitLab Runner cache volumes under disk pressure
      ansible.builtin.shell: |
        set -o pipefail
        if ! command -v docker >/dev/null 2>&1; then
          echo 'gitlab_runner_cache_prune=skipped reason=docker-not-found'
          exit 0
        fi
        if ! docker info >/dev/null 2>&1; then
          echo 'gitlab_runner_cache_prune=skipped reason=docker-daemon-unavailable'
          exit 0
        fi

        retention={{ platform_node_storage_gitlab_runner_cache_prune_until_effective | quote }}
        retention_value="${retention%?}"
        retention_unit="${retention#${retention_value}}"
        case "${retention_unit}" in
          s) multiplier=1 ;;
          m) multiplier=60 ;;
          h) multiplier=3600 ;;
          d) multiplier=86400 ;;
          w) multiplier=604800 ;;
          *) echo "invalid retention unit: ${retention_unit}" >&2; exit 2 ;;
        esac
        retention_seconds=$((retention_value * multiplier))
        now="$(date +%s)"
        changed=0

        candidates="$(docker volume ls -q \
          --filter dangling=true \
          --filter label=com.gitlab.gitlab-runner.type=cache \
          --filter label=com.gitlab.gitlab-runner.managed=true)"
        if [ -z "${candidates}" ]; then
          echo 'gitlab_runner_cache_prune=not-needed'
          exit 0
        fi

        while IFS= read -r volume; do
          [ -n "${volume}" ] || continue
          case "${volume}" in
            runner-*-cache-*) ;;
            *)
              echo "volume=${volume} action=retain reason=unexpected-cache-name"
              continue
              ;;
          esac

          metadata="$(docker volume inspect "${volume}" 2>/dev/null || true)"
          if [ -z "${metadata}" ]; then
            echo "volume=${volume} action=retain reason=inspect-failed"
            continue
          fi
          created="$(printf '%s' "${metadata}" | python3 -c \
            'import json,sys; print(json.load(sys.stdin)[0].get("CreatedAt", ""))')"
          created_epoch="$(date -d "${created}" +%s 2>/dev/null || true)"
          if [ -z "${created_epoch}" ]; then
            echo "volume=${volume} action=retain reason=creation-time-unreadable"
            continue
          fi
          age_seconds=$((now - created_epoch))
          if [ "${age_seconds}" -lt "${retention_seconds}" ]; then
            echo "volume=${volume} action=retain reason=within-retention age_seconds=${age_seconds}"
            continue
          fi

          if docker ps -aq --filter "volume=${volume}" | grep -q .; then
            echo "volume=${volume} action=retain reason=container-reference-present"
            continue
          fi
          if docker volume rm "${volume}" >/dev/null; then
            echo "volume=${volume} action=delete-stale-gitlab-runner-cache age_seconds=${age_seconds}"
            changed=1
          else
            echo "volume=${volume} action=retain reason=remove-refused"
          fi
        done <<<"${candidates}"

        if [ "${changed}" -eq 0 ]; then
          echo 'gitlab_runner_cache_prune=not-needed'
        else
          echo 'gitlab_runner_cache_prune=completed'
        fi
      args:
        executable: /bin/bash
      register: platform_node_storage_gitlab_runner_cache_prune
      changed_when: >-
        'action=delete-stale-gitlab-runner-cache' in
        platform_node_storage_gitlab_runner_cache_prune.stdout
      when:
        - platform_node_storage_should_cleanup | bool
        - platform_node_storage_gitlab_runner_cache_prune_effective | bool

    - name: Optionally vacuum old system journal entries
      ansible.builtin.shell: |
        set -o pipefail
        if ! command -v journalctl >/dev/null 2>&1; then
          echo 'journal_vacuum=skipped reason=journalctl-not-found'
          exit 0
        fi
        journalctl --vacuum-size={{ platform_node_storage_journal_vacuum_size_effective | quote }}
        echo 'journal_vacuum=completed'
      register: platform_node_storage_journal_vacuum
      args:
        executable: /bin/bash
      changed_when: "'journal_vacuum=completed' in platform_node_storage_journal_vacuum.stdout"
      when:
        - platform_node_storage_should_cleanup | bool
        - platform_node_storage_journal_vacuum_size_effective != '0'

    - name: Wait for Kubernetes DiskPressure to clear after guarded cleanup
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        pressure="$("${K}" --kubeconfig "${C}" get node {{ inventory_hostname | quote }} \
          -o jsonpath='{.status.conditions[?(@.type=="DiskPressure")].status}')"
        root_usage="$(df -P / | awk 'NR == 2 { print $5 }')"
        printf 'node=%s disk_pressure=%s root_used=%s\n' \
          {{ inventory_hostname | quote }} "${pressure:-unknown}" "${root_usage:-unknown}"
        test "${pressure}" != True
      args:
        executable: /bin/bash
      register: platform_node_storage_pressure_after
      retries: "{{ (((platform_node_storage_pressure_clear_timeout_effective | int) / 10) | round(0, 'ceil') | int) + 1 }}"
      delay: 10
      until: platform_node_storage_pressure_after.rc == 0
      changed_when: false
      failed_when: false
      when:
        - platform_node_storage_wait_for_pressure_clear_effective | bool
        - platform_node_storage_pressure_before.rc == 42

    - name: Inspect resumable Longhorn root-pressure evacuation state
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        annotation="$("${K}" --kubeconfig "${C}" -n longhorn-system get \
          "nodes.longhorn.io/{{ inventory_hostname }}" \
          -o jsonpath='{.metadata.annotations.platform\.gitops\.io/root-pressure-eviction}' \
          2>/dev/null || true)"
        if [ -n "${annotation}" ]; then
          echo 'longhorn_pressure_evacuation_state=present'
          exit 42
        fi
        echo 'longhorn_pressure_evacuation_state=absent'
      args:
        executable: /bin/bash
      register: platform_node_storage_longhorn_pressure_state_before
      retries: 3
      delay: 5
      until: >-
        (platform_node_storage_longhorn_pressure_state_before.rc | default(-1) | int)
        in [0, 42]
      changed_when: false
      failed_when: >-
        (platform_node_storage_longhorn_pressure_state_before.rc | default(-1) | int)
        not in [0, 42]
      when:
        - platform_node_storage_cleanup_effective | bool
        - platform_node_storage_longhorn_pressure_eviction_effective | bool

    - name: Run guarded Longhorn root-pressure evacuation
      block:
        - name: Create private Longhorn pressure helper directory
          ansible.builtin.tempfile:
            state: directory
            path: /var/tmp
            prefix: platform-longhorn-pressure-
          register: platform_node_storage_longhorn_pressure_helper_dir

        - name: Stage bounded Longhorn pressure helper bundle
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../scripts/{{ item }}"
            dest: "{{ platform_node_storage_longhorn_pressure_helper_dir.path }}/{{ item }}"
            mode: "0600"
          loop:
            - relieve_longhorn_disk_pressure.py
            - bounded_subprocess.py
            - strict_json.py
            - subprocess_timeout.py

        - name: Evacuate Longhorn replicas from pressured root-backed disks
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - "{{ platform_node_storage_longhorn_pressure_helper_dir.path }}/relieve_longhorn_disk_pressure.py"
              - --node
              - "{{ inventory_hostname }}"
              - --timeout
              - "{{ platform_node_storage_longhorn_pressure_eviction_timeout_effective | int }}"
              - --target-free-percentage
              - "{{ platform_node_storage_longhorn_target_free_percentage_effective | int }}"
          register: platform_node_storage_longhorn_pressure_eviction
          changed_when: >-
            ('longhorn_pressure_evacuation=requested' in
            (platform_node_storage_longhorn_pressure_eviction.stdout | default('')))
            or
            ('longhorn_pressure_evacuation=completed' in
            (platform_node_storage_longhorn_pressure_eviction.stdout | default('')))
          throttle: 1
      always:
        - name: Remove private Longhorn pressure helper directory
          ansible.builtin.file:
            path: "{{ platform_node_storage_longhorn_pressure_helper_dir.path }}"
            state: absent
          when:
            - (platform_node_storage_longhorn_pressure_helper_dir | default({})).path is defined
      when:
        - platform_node_storage_cleanup_effective | bool
        - platform_node_storage_longhorn_pressure_eviction_effective | bool
        - >-
          (platform_node_storage_cluster_has_pressure | bool)
          or
          ((platform_node_storage_longhorn_pressure_state_before.rc | default(0) | int) == 42)

    - name: Print guarded Longhorn pressure evacuation result
      ansible.builtin.debug:
        var: platform_node_storage_longhorn_pressure_eviction.stdout_lines
      when:
        - (platform_node_storage_longhorn_pressure_eviction | default({})).stdout is defined
        - platform_node_storage_longhorn_pressure_eviction.stdout | length > 0

    - name: Wait for Kubernetes DiskPressure to clear after Longhorn evacuation
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        pressure="$("${K}" --kubeconfig "${C}" get node {{ inventory_hostname | quote }} \
          -o jsonpath='{.status.conditions[?(@.type=="DiskPressure")].status}')"
        root_usage="$(df -P / | awk 'NR == 2 { print $5 }')"
        printf 'node=%s disk_pressure=%s root_used=%s\n' \
          {{ inventory_hostname | quote }} "${pressure:-unknown}" "${root_usage:-unknown}"
        test "${pressure}" != True
      args:
        executable: /bin/bash
      register: platform_node_storage_pressure_after_evacuation
      retries: "{{ (((platform_node_storage_pressure_clear_timeout_effective | int) / 10) | round(0, 'ceil') | int) + 1 }}"
      delay: 10
      until: platform_node_storage_pressure_after_evacuation.rc == 0
      changed_when: false
      failed_when: false
      when:
        - platform_node_storage_wait_for_pressure_clear_effective | bool
        - platform_node_storage_pressure_before.rc == 42
        - (platform_node_storage_pressure_after.rc | default(1) | int) != 0

    - name: Select final Kubernetes DiskPressure result
      ansible.builtin.set_fact:
        platform_node_storage_pressure_final_rc: >-
          {{
            platform_node_storage_pressure_after_evacuation.rc
            | default(platform_node_storage_pressure_after.rc | default(1), true)
            | int
          }}

    - name: Collect persistent DiskPressure diagnostics after safe cleanup
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        longhorn_path={{ platform_node_storage_longhorn_path_effective | quote }}

        echo '===== Kubernetes DiskPressure ====='
        "${K}" --kubeconfig "${C}" get node {{ inventory_hostname | quote }} \
          -o jsonpath='{range .status.conditions[?(@.type=="DiskPressure")]}status={.status} reason={.reason} message={.message}{"\n"}{end}' || true
        "${K}" --kubeconfig "${C}" get node {{ inventory_hostname | quote }} \
          -o jsonpath='taints={.spec.taints}{"\n"}' || true

        echo '===== Filesystems ====='
        df -hT / "${longhorn_path}" 2>/dev/null || df -hT /
        root_device="$(df -P / | awk 'NR == 2 { print $1 }')"
        longhorn_device="$(df -P "${longhorn_path}" 2>/dev/null | awk 'NR == 2 { print $1 }')"
        if [ -n "${longhorn_device}" ] && [ "${root_device}" = "${longhorn_device}" ]; then
          echo 'longhorn_default_path_shares_root=true'
        else
          echo 'longhorn_default_path_shares_root=false'
        fi

        echo '===== Largest /var/lib consumers (bytes) ====='
        if command -v timeout >/dev/null 2>&1; then
          timeout 120 du -x -d 1 -B1 /var/lib 2>/dev/null | sort -n | tail -20 || true
        else
          du -x -d 1 -B1 /var/lib 2>/dev/null | sort -n | tail -20 || true
        fi

        echo '===== Largest Longhorn replica paths (bytes) ====='
        if [ -d "${longhorn_path}/replicas" ]; then
          if command -v timeout >/dev/null 2>&1; then
            timeout 120 du -x -d 1 -B1 "${longhorn_path}/replicas" 2>/dev/null | sort -n | tail -20 || true
          else
            du -x -d 1 -B1 "${longhorn_path}/replicas" 2>/dev/null | sort -n | tail -20 || true
          fi
        else
          echo 'longhorn_replicas_path=absent'
        fi

        echo '===== Longhorn volume allocation ====='
        "${K}" --kubeconfig "${C}" -n longhorn-system get volumes.longhorn.io \
          -o custom-columns=NAME:.metadata.name,SIZE:.spec.size,ACTUAL:.status.actualSize,STATE:.status.state,ROBUSTNESS:.status.robustness,NODE:.status.currentNodeID \
          --no-headers 2>/dev/null || true

        echo '===== Longhorn pressure evacuation state ====='
        "${K}" --kubeconfig "${C}" -n longhorn-system get \
          "nodes.longhorn.io/{{ inventory_hostname }}" -o json 2>/dev/null |
          python3 -c '
        import json
        import sys

        node = json.load(sys.stdin)
        annotation = (
            node.get("metadata", {})
            .get("annotations", {})
            .get("platform.gitops.io/root-pressure-eviction", "absent")
        )
        print(f"root_pressure_eviction_annotation={annotation}")
        for name, disk in sorted((node.get("spec", {}).get("disks") or {}).items()):
            print(
                "disk={} path={} allowScheduling={} evictionRequested={}".format(
                    name,
                    disk.get("path", "?"),
                    disk.get("allowScheduling", False),
                    disk.get("evictionRequested", False),
                )
            )
        ' || true
        "${K}" --kubeconfig "${C}" -n longhorn-system get replicas.longhorn.io \
          -o custom-columns=NAME:.metadata.name,VOLUME:.spec.volumeName,NODE:.spec.nodeID,DISK:.spec.diskID,EVICTION:.spec.evictionRequested,FAILED:.spec.failedAt \
          --no-headers 2>/dev/null | awk '$3 == "{{ inventory_hostname }}"' || true

        echo '===== Longhorn orphan resources ====='
        "${K}" --kubeconfig "${C}" -n longhorn-system get orphans.longhorn.io \
          -o custom-columns=NAME:.metadata.name,TYPE:.spec.orphanType,NODE:.spec.nodeID \
          --no-headers 2>/dev/null || true

        echo '===== Longhorn reclamation settings ====='
        for setting in \
          orphan-resource-auto-deletion \
          orphan-resource-auto-deletion-grace-period \
          storage-minimal-available-percentage \
          remove-snapshots-during-filesystem-trim \
          auto-cleanup-system-generated-snapshot \
          auto-cleanup-recurring-job-backup-snapshot
        do
          value="$("${K}" --kubeconfig "${C}" -n longhorn-system get \
            "settings.longhorn.io/${setting}" -o jsonpath='{.value}' \
            2>/dev/null || true)"
          printf '%s=%s\n' "${setting}" "${value:-unavailable}"
        done

        echo '===== Runtime services ====='
        for service in rke2-server containerd docker; do
          printf '%s=' "${service}"
          systemctl is-active "${service}" 2>/dev/null || true
        done

        echo '===== Deleted files still held open ====='
        if command -v lsof >/dev/null 2>&1; then
          lsof +L1 2>/dev/null | sort -k7,7n | tail -20 || true
        else
          echo 'lsof=unavailable'
        fi
      args:
        executable: /bin/bash
      register: platform_node_storage_persistent_pressure_diagnostics
      changed_when: false
      failed_when: false
      when:
        - platform_node_storage_wait_for_pressure_clear_effective | bool
        - platform_node_storage_pressure_before.rc == 42
        - platform_node_storage_pressure_final_rc | int != 0

    - name: Print persistent DiskPressure diagnostics
      ansible.builtin.debug:
        var: platform_node_storage_persistent_pressure_diagnostics.stdout_lines
      when:
        - (platform_node_storage_persistent_pressure_diagnostics | default({})).stdout is defined
        - platform_node_storage_persistent_pressure_diagnostics.stdout | length > 0

    - name: Stop when safe cleanup cannot clear Kubernetes DiskPressure
      ansible.builtin.fail:
        msg: |
          Kubernetes DiskPressure remains active on {{ inventory_hostname }}
          after unused images, caches, package metadata, temporary files, and
          unused blocks from mounted Longhorn filesystems across the RKE2
          server set eligible under the configured policy were reclaimed.

          The cleanup intentionally retained Longhorn replicas, snapshots,
          PVC data, active container images, and referenced Docker volumes.
          It also reconciled Longhorn's safe orphan and system-snapshot cleanup
          settings, reserved 25 percent free space, and allowed eligible orphans
          on Ready nodes their configured grace period. When alternate Longhorn
          capacity passed the scheduler and replica-safety checks, the cleanup
          also requested native disk eviction and retained resumable state until
          Kubernetes pressure cleared. No replica directory was deleted.

          Longhorn pressure evacuation result:
          {{ platform_node_storage_longhorn_pressure_eviction.stdout | default('not run') }}

          Review the focused diagnostics above. A deferred evacuation names the
          missing capacity or safety prerequisite. Add a dedicated Longhorn disk
          when alternate capacity is absent, or remove confirmed-unused PVCs and
          snapshots through Kubernetes and Longhorn after backup verification.
          If another runtime store dominates, verify that runtime is still
          required before removing its data.

          Rerun `make platform-node-storage-cleanup` after capacity is restored,
          then rerun the original focused repair command.
      when:
        - platform_node_storage_wait_for_pressure_clear_effective | bool
        - platform_node_storage_pressure_before.rc == 42
        - platform_node_storage_pressure_final_rc | int != 0

    - name: Collect root filesystem usage after cleanup
      ansible.builtin.shell: |
        set -o pipefail
        df -hT /
        echo 'cleanup_policy=Longhorn replicas, snapshots, volume heads, PVCs, and mounted application data were not deleted'
      args:
        executable: /bin/bash
      register: platform_node_storage_after
      changed_when: false

    - name: Print root filesystem usage after cleanup
      ansible.builtin.debug:
        var: platform_node_storage_after.stdout_lines
