---
- name: Repair Woodpecker CI rollout and runtime drift
  hosts: rke2_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    rke2_first_server: "{{ groups['rke2_servers'][0] }}"
    platform_woodpecker_repair_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_WOODPECKER_REPAIR_TIMEOUT') }}"
    platform_woodpecker_repair_expected_image_tag_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_WOODPECKER_REPAIR_EXPECTED_IMAGE_TAG') }}"
    platform_woodpecker_image_tag_from_env: "{{ lookup('ansible.builtin.env', 'WOODPECKER_IMAGE_TAG') }}"
    platform_woodpecker_repair_timeout_effective: "{{ platform_woodpecker_repair_timeout | default(platform_woodpecker_repair_timeout_from_env, true) | default(300, true) | int }}"
    platform_woodpecker_repair_expected_image_tag_effective: "{{ platform_woodpecker_repair_expected_image_tag | default(platform_woodpecker_repair_expected_image_tag_from_env, true) | default(platform_woodpecker_image_tag_from_env, true) | default('v3.16.0', true) }}"
  tasks:
    - name: Show Woodpecker state before repair
      ansible.builtin.shell: |
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        echo "===== Argo CD Woodpecker application ====="
        "$K" --kubeconfig "$C" -n argocd get application/woodpecker -o wide || true
        echo "===== Woodpecker pods ====="
        "$K" --kubeconfig "$C" -n woodpecker get pods -o wide || true
        echo "===== Woodpecker services/endpoints ====="
        "$K" --kubeconfig "$C" -n woodpecker get svc,endpoints,endpointslice,ingress,pvc -o wide || true
        echo "===== Woodpecker pod images ====="
        "$K" --kubeconfig "$C" -n woodpecker get pods \
          -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{range .spec.containers[*]}{.image}{" "}{end}{"\n"}{end}' || true
      args:
        executable: /bin/bash
      register: platform_woodpecker_repair_state_before
      changed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Print Woodpecker state before repair
      ansible.builtin.debug:
        var: platform_woodpecker_repair_state_before.stdout_lines
      run_once: true

    - name: Ensure platform PostgreSQL backend is available when Woodpecker uses Postgres
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        TIMEOUT={{ platform_woodpecker_repair_timeout_effective }}

        redact() {
          sed -E \
            -e 's#(postgres(ql)?://[^:/ @]+:)[^@]+@#\1<redacted>@#g' \
            -e 's#([?&](password|secret|token)=)[^[:space:]&]+#\1<redacted>#Ig' \
            -e 's#((password|secret|token)[[:space:]]*[:=][[:space:]]*)[^[:space:]]+#\1<redacted>#Ig'
        }

        workload=""
        for candidate in statefulset/woodpecker-server deployment/woodpecker-server; do
          if "$K" --kubeconfig "$C" -n woodpecker get "${candidate}" >/dev/null 2>&1; then
            workload="${candidate}"
            break
          fi
        done
        if [ -z "${workload}" ]; then
          echo "woodpecker_server_workload=absent postgres_backend_check=skipped"
          exit 0
        fi

        driver="$("$K" --kubeconfig "$C" -n woodpecker get "${workload}" \
          -o jsonpath='{range .spec.template.spec.containers[*].env[?(@.name=="WOODPECKER_DATABASE_DRIVER")]}{.value}{"\n"}{end}' 2>/dev/null |
          tail -n 1 || true)"
        case "${driver}" in
          postgres|postgresql)
            ;;
          *)
            echo "woodpecker_database_driver=${driver:-unset} postgres_backend_check=skipped"
            exit 0
            ;;
        esac

        echo "woodpecker_database_driver=${driver}"
        echo "required_postgres_service=platform-databases/platform-postgres-rw"

        if "$K" --kubeconfig "$C" get crd applications.argoproj.io >/dev/null 2>&1; then
          repo_url="$("$K" --kubeconfig "$C" -n argocd get application/woodpecker -o jsonpath='{.spec.source.repoURL}' 2>/dev/null || true)"
          target_revision="$("$K" --kubeconfig "$C" -n argocd get application/woodpecker -o jsonpath='{.spec.source.targetRevision}' 2>/dev/null || true)"
          project="$("$K" --kubeconfig "$C" -n argocd get application/woodpecker -o jsonpath='{.spec.project}' 2>/dev/null || true)"
          target_revision="${target_revision:-main}"
          project="${project:-platform}"

          yaml_escape() {
            sed -e 's/\\/\\\\/g' -e 's/"/\\"/g'
          }

          repo_url_yaml="$(printf '%s' "${repo_url}" | yaml_escape)"
          target_revision_yaml="$(printf '%s' "${target_revision}" | yaml_escape)"
          project_yaml="$(printf '%s' "${project}" | yaml_escape)"

          register_app_if_missing() {
            name="$1"
            wave="$2"
            path="$3"
            namespace="$4"
            safe_name="$(printf '%s' "${name}" | tr '-' '_')"
            if "$K" --kubeconfig "$C" -n argocd get "application/${name}" >/dev/null 2>&1; then
              echo "argocd_application_${safe_name}=present"
              return 0
            fi
            if [ -z "${repo_url}" ]; then
              echo "argocd_application_${safe_name}=absent reason=woodpecker-source-repo-url-empty"
              return 1
            fi
            {
              printf '%s\n' 'apiVersion: argoproj.io/v1alpha1'
              printf '%s\n' 'kind: Application'
              printf '%s\n' 'metadata:'
              printf '  name: %s\n' "${name}"
              printf '%s\n' '  namespace: argocd'
              printf '%s\n' '  annotations:'
              printf '    argocd.argoproj.io/sync-wave: "%s"\n' "${wave}"
              printf '%s\n' 'spec:'
              printf '  project: "%s"\n' "${project_yaml}"
              printf '%s\n' '  source:'
              printf '    repoURL: "%s"\n' "${repo_url_yaml}"
              printf '    targetRevision: "%s"\n' "${target_revision_yaml}"
              printf '    path: %s\n' "${path}"
              printf '%s\n' '  destination:'
              printf '%s\n' '    server: https://kubernetes.default.svc'
              printf '    namespace: %s\n' "${namespace}"
              printf '%s\n' '  syncPolicy:'
              printf '%s\n' '    automated:'
              printf '%s\n' '      prune: false'
              printf '%s\n' '      selfHeal: true'
              printf '%s\n' '    syncOptions:'
              printf '%s\n' '      - CreateNamespace=true'
              printf '%s\n' '      - ServerSideApply=true'
            } | "$K" --kubeconfig "$C" apply -f -
            echo "argocd_application_${safe_name}=auto-registered repo=${repo_url_yaml} revision=${target_revision_yaml} path=${path}"
          }

          register_app_if_missing cloudnativepg 2 gitops/clusters/rke2-main/premium-3node/apps/cloudnativepg cnpg-system
          register_app_if_missing platform-postgres 4 gitops/clusters/rke2-main/premium-3node/apps/platform-postgres platform-databases

          for app in cloudnativepg platform-postgres; do
            if ! "$K" --kubeconfig "$C" -n argocd get "application/${app}" >/dev/null 2>&1; then
              echo "argocd_application_${app}=absent"
              continue
            fi
            "$K" --kubeconfig "$C" -n argocd annotate "application/${app}" \
              argocd.argoproj.io/refresh=hard --overwrite >/dev/null
            "$K" --kubeconfig "$C" -n argocd patch "application/${app}" --type merge \
              -p '{"operation":{"sync":{"revision":"HEAD","prune":false}}}' >/dev/null 2>&1 || true
          done

          sync_deadline=$(( $(date +%s) + TIMEOUT ))
          while [ "$(date +%s)" -lt "${sync_deadline}" ]; do
            cnpg_sync="$("$K" --kubeconfig "$C" -n argocd get application/cloudnativepg -o jsonpath='{.status.sync.status}' 2>/dev/null || true)"
            cnpg_health="$("$K" --kubeconfig "$C" -n argocd get application/cloudnativepg -o jsonpath='{.status.health.status}' 2>/dev/null || true)"
            cnpg_operation="$("$K" --kubeconfig "$C" -n argocd get application/cloudnativepg -o jsonpath='{.status.operationState.phase}' 2>/dev/null || true)"
            sync_status="$("$K" --kubeconfig "$C" -n argocd get application/platform-postgres -o jsonpath='{.status.sync.status}' 2>/dev/null || true)"
            health_status="$("$K" --kubeconfig "$C" -n argocd get application/platform-postgres -o jsonpath='{.status.health.status}' 2>/dev/null || true)"
            operation_phase="$("$K" --kubeconfig "$C" -n argocd get application/platform-postgres -o jsonpath='{.status.operationState.phase}' 2>/dev/null || true)"
            conditions="$("$K" --kubeconfig "$C" -n argocd get application/platform-postgres -o jsonpath='{range .status.conditions[*]}{.type}{":"}{.message}{";"}{end}' 2>/dev/null || true)"
            echo "cloudnativepg sync=${cnpg_sync:-unknown} health=${cnpg_health:-unknown} operation=${cnpg_operation:-none}" | redact
            echo "platform-postgres sync=${sync_status:-unknown} health=${health_status:-unknown} operation=${operation_phase:-none} conditions=${conditions:-none}" | redact
            case "${cnpg_operation}:${operation_phase}" in
              Error:*|Failed:*|*:Error|*:Failed)
                break
                ;;
            esac
            if [ "${cnpg_operation}" = "Running" ] || [ "${operation_phase}" = "Running" ]; then
              sleep 5
              continue
            fi
            case "${sync_status}" in
              Synced)
                break
                ;;
            esac
            case "${operation_phase}" in
              Error|Failed)
                break
                ;;
            esac
            sleep 5
          done
        else
          echo "argocd_application_crd=absent"
        fi

        deadline=$(( $(date +%s) + TIMEOUT ))
        while [ "$(date +%s)" -lt "${deadline}" ]; do
          if "$K" --kubeconfig "$C" -n platform-databases get service/platform-postgres-rw >/dev/null 2>&1; then
            ready_endpoints="$("$K" --kubeconfig "$C" -n platform-databases get endpointslice \
              -l kubernetes.io/service-name=platform-postgres-rw \
              -o jsonpath='{range .items[*].endpoints[*]}{.conditions.ready}{"\n"}{end}' 2>/dev/null |
              awk '$1 == "true" || $1 == "<none>" || $1 == "" { count++ } END { print count + 0 }')"
            echo "platform_postgres_rw_service=present ready_endpoints=${ready_endpoints}"
            if [ "${ready_endpoints}" -ge 1 ]; then
              exit 0
            fi
          else
            echo "platform_postgres_rw_service=absent"
          fi
          "$K" --kubeconfig "$C" -n platform-databases get pods,svc,clusters.postgresql.cnpg.io,databases.postgresql.cnpg.io -o wide 2>&1 | redact || true
          sleep 10
        done

        echo "result=fail reason=woodpecker-postgres-backend-not-ready"
        echo "===== platform-postgres application ====="
        "$K" --kubeconfig "$C" -n argocd get application/platform-postgres -o wide 2>&1 | redact || true
        "$K" --kubeconfig "$C" -n argocd describe application/platform-postgres 2>&1 |
          sed -n '/Status:/,/Events:/p' |
          redact || true
        echo "===== platform-databases runtime ====="
        "$K" --kubeconfig "$C" -n platform-databases get pods,svc,endpoints,endpointslice,clusters.postgresql.cnpg.io,databases.postgresql.cnpg.io -o wide 2>&1 | redact || true
        exit 1
      args:
        executable: /bin/bash
      register: platform_woodpecker_postgres_backend_check
      changed_when: >-
        'platform-postgres sync=' in platform_woodpecker_postgres_backend_check.stdout or
        'argocd_application_platform_postgres=auto-registered' in platform_woodpecker_postgres_backend_check.stdout or
        'argocd_application_cloudnativepg=auto-registered' in platform_woodpecker_postgres_backend_check.stdout
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Stop when Woodpecker PostgreSQL backend is missing
      ansible.builtin.fail:
        msg: |
          {% set backend_output = platform_woodpecker_postgres_backend_check.stdout | default('', true) %}
          {% if backend_output | regex_search('dial tcp [0-9.]+:8081: i/o timeout|Failed to load target state|repo-server') %}
          Argo CD could not render/sync the platform PostgreSQL backend because
          its repo-server path is unhealthy. Repair Argo CD internal service
          reachability first, then rerun the Woodpecker repair:

          make platform-argocd-service-repair
          make platform-woodpecker-repair

          {% endif %}
          {% if backend_output | regex_search('cnpg-webhook-service|mcluster\\.cnpg\\.io|failed calling webhook.*cnpg|context deadline exceeded') %}
          CloudNativePG webhook calls are timing out while applying
          platform-postgres. Restart/verify the CloudNativePG operator and
          service endpoints before rerunning Woodpecker repair:

          ansible -i inventory/hosts.local.ini node-1 -b -m shell -a '
          K=/var/lib/rancher/rke2/bin/kubectl
          C=/etc/rancher/rke2/rke2.yaml
          $K --kubeconfig "$C" -n cnpg-system rollout restart deployment/cloudnative-pg
          $K --kubeconfig "$C" -n cnpg-system rollout status deployment/cloudnative-pg --timeout=300s
          $K --kubeconfig "$C" -n cnpg-system get pods,svc,endpointslice -o wide
          '

          make platform-woodpecker-repair

          {% endif %}
          Woodpecker is configured for PostgreSQL, but the required
          platform PostgreSQL backend is not ready.

          Woodpecker cannot start until this Kubernetes service has ready
          endpoints:
          - platform-databases/platform-postgres-rw

          Backend check output:
          {{ platform_woodpecker_postgres_backend_check.stdout | default('not run') }}

          Usual recovery:
          1. Sync the private GitOps source that Argo CD reads.
          2. Ensure the platform-postgres Argo CD Application exists and is Synced.
          3. Rerun:
             make platform-woodpecker-repair

          If the platform-postgres Application is absent, rerun the Argo CD
          application registration with your PLATFORM_REPO_URL and
          PLATFORM_APPLY_GITOPS=true before rerunning this repair.
      run_once: true
      when: platform_woodpecker_postgres_backend_check.rc | int != 0

    - name: Refresh and sync Woodpecker Argo CD application
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        if ! "$K" --kubeconfig "$C" get crd applications.argoproj.io >/dev/null 2>&1; then
          echo "argocd_application_crd=absent"
          exit 0
        fi
        if ! "$K" --kubeconfig "$C" -n argocd get application/woodpecker >/dev/null 2>&1; then
          echo "argocd_application_woodpecker=absent"
          exit 0
        fi
        "$K" --kubeconfig "$C" -n argocd annotate application/woodpecker \
          argocd.argoproj.io/refresh=hard --overwrite
        "$K" --kubeconfig "$C" -n argocd patch application/woodpecker --type merge \
          -p '{"operation":{"sync":{"revision":"HEAD","prune":false}}}' || true
      args:
        executable: /bin/bash
      register: platform_woodpecker_argocd_refresh
      changed_when: >-
        'annotated' in platform_woodpecker_argocd_refresh.stdout or
        'patched' in platform_woodpecker_argocd_refresh.stdout
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Wait for Woodpecker Argo CD sync after repair
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        TIMEOUT={{ platform_woodpecker_repair_timeout_effective }}
        if ! "$K" --kubeconfig "$C" -n argocd get application/woodpecker >/dev/null 2>&1; then
          echo "argocd_application_woodpecker=absent"
          exit 0
        fi
        deadline=$(( $(date +%s) + TIMEOUT ))
        while [ "$(date +%s)" -lt "${deadline}" ]; do
          sync_status="$("$K" --kubeconfig "$C" -n argocd get application/woodpecker -o jsonpath='{.status.sync.status}' 2>/dev/null || true)"
          health_status="$("$K" --kubeconfig "$C" -n argocd get application/woodpecker -o jsonpath='{.status.health.status}' 2>/dev/null || true)"
          operation_phase="$("$K" --kubeconfig "$C" -n argocd get application/woodpecker -o jsonpath='{.status.operationState.phase}' 2>/dev/null || true)"
          conditions="$("$K" --kubeconfig "$C" -n argocd get application/woodpecker -o jsonpath='{range .status.conditions[*]}{.type}{":"}{.message}{";"}{end}' 2>/dev/null || true)"
          echo "woodpecker sync=${sync_status:-unknown} health=${health_status:-unknown} operation=${operation_phase:-none} conditions=${conditions:-none}"
          case "${operation_phase}" in
            Error|Failed)
              exit 1
              ;;
          esac
          if [ "${sync_status}" = "Synced" ] && [ "${operation_phase}" != "Running" ]; then
            exit 0
          fi
          sleep 5
        done
        exit 1
      args:
        executable: /bin/bash
      register: platform_woodpecker_argocd_sync_wait
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Wait for Woodpecker server and agents after repair
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        TIMEOUT={{ platform_woodpecker_repair_timeout_effective }}
        if ! "$K" --kubeconfig "$C" get namespace woodpecker >/dev/null 2>&1; then
          echo "woodpecker_namespace=absent"
          exit 1
        fi
        wait_controller() {
          role="$1"
          shift
          found=false
          for controller in "$@"; do
            if "$K" --kubeconfig "$C" -n woodpecker get "${controller}" >/dev/null 2>&1; then
              found=true
              echo "waiting role=${role} controller=${controller}"
              "$K" --kubeconfig "$C" -n woodpecker rollout status "${controller}" --timeout="${TIMEOUT}s"
              return $?
            fi
          done
          echo "result=fail reason=missing-woodpecker-${role}-controller"
          return 1
        }
        wait_controller server statefulset/woodpecker-server deployment/woodpecker-server
        wait_controller agent statefulset/woodpecker-agent deployment/woodpecker-agent
      args:
        executable: /bin/bash
      register: platform_woodpecker_rollout_wait
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Verify Woodpecker runtime images and service endpoints after repair
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        EXPECTED_TAG="{{ platform_woodpecker_repair_expected_image_tag_effective }}"
        case "${EXPECTED_TAG}" in
          [0-9]*)
            EXPECTED_TAG="v${EXPECTED_TAG}"
            ;;
        esac
        failed=0
        server_seen=0
        agent_seen=0
        if ! "$K" --kubeconfig "$C" get namespace woodpecker >/dev/null 2>&1; then
          echo "result=fail reason=woodpecker-namespace-absent"
          exit 1
        fi
        echo "expected_woodpecker_image_tag=${EXPECTED_TAG}"
        pods="$("$K" --kubeconfig "$C" -n woodpecker get pods -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.status.phase}{"|"}{range .status.containerStatuses[*]}{.ready}{","}{.restartCount}{","}{.state.waiting.reason}{";"}{end}{"|"}{range .spec.containers[*]}{.image}{" "}{end}{"\n"}{end}' 2>/dev/null || true)"
        pods_file="$(mktemp)"
        printf '%s\n' "${pods}" > "${pods_file}"
        while IFS='|' read -r pod phase statuses images; do
          [ -n "${pod}" ] || continue
          role=unknown
          expected_repo=
          case "${pod}" in
            woodpecker-server*)
              role=server
              expected_repo=woodpeckerci/woodpecker-server
              server_seen=$((server_seen + 1))
              ;;
            woodpecker-agent*)
              role=agent
              expected_repo=woodpeckerci/woodpecker-agent
              agent_seen=$((agent_seen + 1))
              ;;
            *)
              continue
              ;;
          esac
          echo "role=${role} pod=${pod} phase=${phase:-unknown} statuses=${statuses:-unknown} images=${images:-unknown}"
          if [ "${phase}" != "Running" ]; then
            echo "result=fail reason=woodpecker-pod-not-running role=${role} pod=${pod} phase=${phase:-unknown}"
            failed=1
          fi
          if ! printf '%s\n' "${statuses}" | grep -q '^true,'; then
            echo "result=fail reason=woodpecker-pod-not-ready role=${role} pod=${pod} statuses=${statuses:-unknown}"
            failed=1
          fi
          for image in ${images}; do
            image_tag="${image##*:}"
            image_repo="${image%:*}"
            case "${image_repo}:${image_tag}" in
              *"${expected_repo}:${EXPECTED_TAG}") ;;
              *)
                echo "result=fail reason=woodpecker-image-tag-mismatch role=${role} pod=${pod} image=${image} expected_repo=${expected_repo} expected_tag=${EXPECTED_TAG}"
                failed=1
                ;;
            esac
          done
        done < "${pods_file}"
        rm -f "${pods_file}"
        if [ "${server_seen}" -lt 1 ]; then
          echo "result=fail reason=woodpecker-server-pods-missing"
          failed=1
        fi
        if [ "${agent_seen}" -lt 1 ]; then
          echo "result=fail reason=woodpecker-agent-pods-missing"
          failed=1
        fi
        ready_endpoints="$("$K" --kubeconfig "$C" -n woodpecker get endpointslice \
          -l kubernetes.io/service-name=woodpecker-server \
          -o jsonpath='{range .items[*].endpoints[*]}{.conditions.ready}{"\n"}{end}' 2>/dev/null |
          awk '$1 == "true" || $1 == "<none>" || $1 == "" { count++ } END { print count + 0 }')"
        echo "woodpecker_server_ready_endpoints=${ready_endpoints}"
        if [ "${ready_endpoints}" -lt 1 ]; then
          echo "result=fail reason=woodpecker-server-has-no-ready-endpoints"
          failed=1
        fi
        exit "${failed}"
      args:
        executable: /bin/bash
      register: platform_woodpecker_runtime_verify
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Collect Woodpecker crash diagnostics after repair failure
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml

        redact() {
          sed -E \
            -e 's#(postgres(ql)?://[^:/ @]+:)[^@]+@#\1<redacted>@#g' \
            -e 's#(mysql://[^:/ @]+:)[^@]+@#\1<redacted>@#g' \
            -e 's#([?&](password|secret|token)=)[^[:space:]&]+#\1<redacted>#Ig' \
            -e 's#((password|secret|token)[[:space:]]*[:=][[:space:]]*)[^[:space:]]+#\1<redacted>#Ig'
        }

        echo "===== woodpecker pods/services/endpoints ====="
        "$K" --kubeconfig "$C" -n woodpecker get pods,svc,endpoints,endpointslice,pvc -o wide 2>&1 | redact || true

        echo "===== woodpecker app status ====="
        "$K" --kubeconfig "$C" -n argocd get application/woodpecker -o wide 2>&1 | redact || true
        "$K" --kubeconfig "$C" -n argocd get application/woodpecker \
          -o jsonpath='{range .status.conditions[*]}{.type}{": "}{.message}{"\n"}{end}' 2>&1 | redact || true

        echo "===== woodpecker workload env refs ====="
        for workload in statefulset/woodpecker-server deployment/woodpecker-server statefulset/woodpecker-agent deployment/woodpecker-agent; do
          if "$K" --kubeconfig "$C" -n woodpecker get "${workload}" >/dev/null 2>&1; then
            echo "--- ${workload} ---"
            "$K" --kubeconfig "$C" -n woodpecker get "${workload}" \
              -o jsonpath='images={range .spec.template.spec.containers[*]}{.image}{" "}{end}{"\n"}env_names={range .spec.template.spec.containers[*].env[*]}{.name}{" "}{end}{"\n"}env_from_secrets={range .spec.template.spec.containers[*].envFrom[*].secretRef}{.name}{" "}{end}{"\n"}' 2>&1 | redact || true
          fi
        done

        echo "===== required secrets state ====="
        for item in \
          woodpecker/woodpecker-forgejo-oauth \
          woodpecker/woodpecker-database \
          platform-databases/woodpecker-database
        do
          ns="${item%/*}"
          secret="${item#*/}"
          if "$K" --kubeconfig "$C" -n "${ns}" get "secret/${secret}" >/dev/null 2>&1; then
            keys="$("$K" --kubeconfig "$C" -n "${ns}" get "secret/${secret}" \
              -o jsonpath='{range $key,$value := .data}{$key}{" "}{end}' 2>/dev/null || true)"
            echo "secret=${item} state=present keys=${keys:-none}"
          else
            echo "secret=${item} state=absent"
          fi
        done

        echo "===== platform postgres state ====="
        "$K" --kubeconfig "$C" -n platform-databases get pods,svc,clusters.postgresql.cnpg.io,databases.postgresql.cnpg.io -o wide 2>&1 | redact || true

        echo "===== woodpecker logs and events ====="
        pods="$("$K" --kubeconfig "$C" -n woodpecker get pods \
          -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null |
          grep '^woodpecker-' || true)"
        for pod in ${pods}; do
          echo "--- pod/${pod} current logs ---"
          "$K" --kubeconfig "$C" -n woodpecker logs "pod/${pod}" --all-containers --tail=120 2>&1 | redact || true
          echo "--- pod/${pod} previous logs ---"
          "$K" --kubeconfig "$C" -n woodpecker logs "pod/${pod}" --all-containers --previous --tail=120 2>&1 | redact || true
          echo "--- pod/${pod} events ---"
          "$K" --kubeconfig "$C" -n woodpecker describe "pod/${pod}" 2>&1 |
            sed -n '/Events:/,$p' |
            tail -120 |
            redact || true
        done
      args:
        executable: /bin/bash
      register: platform_woodpecker_failure_diagnostics
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      when: >
        ((platform_woodpecker_argocd_sync_wait | default({})).rc | default(0) | int != 0) or
        ((platform_woodpecker_rollout_wait | default({})).rc | default(0) | int != 0) or
        ((platform_woodpecker_runtime_verify | default({})).rc | default(0) | int != 0)

    - name: Stop after Woodpecker repair failure
      ansible.builtin.fail:
        msg: |
          Woodpecker did not become reconciled, rolled out, and image-aligned
          within {{ platform_woodpecker_repair_timeout_effective }}s.

          Argo CD sync wait:
          rc={{ (platform_woodpecker_argocd_sync_wait | default({})).rc | default('not run') }}
          stdout:
          {{ (platform_woodpecker_argocd_sync_wait | default({})).stdout | default('not run') }}
          stderr:
          {{ (platform_woodpecker_argocd_sync_wait | default({})).stderr | default('not run') }}

          Rollout wait:
          rc={{ (platform_woodpecker_rollout_wait | default({})).rc | default('not run') }}
          stdout:
          {{ (platform_woodpecker_rollout_wait | default({})).stdout | default('not run') }}
          stderr:
          {{ (platform_woodpecker_rollout_wait | default({})).stderr | default('not run') }}

          Runtime verification:
          rc={{ (platform_woodpecker_runtime_verify | default({})).rc | default('not run') }}
          stdout:
          {{ (platform_woodpecker_runtime_verify | default({})).stdout | default('not run') }}
          stderr:
          {{ (platform_woodpecker_runtime_verify | default({})).stderr | default('not run') }}

          Failure diagnostics:
          {{ (platform_woodpecker_failure_diagnostics | default({})).stdout | default('not run') }}

          If runtime verification shows `woodpecker-image-tag-mismatch`, the
          Argo CD source still contains stale rendered Woodpecker values. For
          example, `woodpecker-server:3.16.0` must be rendered and synced as
          `woodpecker-server:v3.16.0`.

          Update your private/seed deployment values, sync them into the GitOps
          source that Argo CD reads, and rerun:
          WOODPECKER_IMAGE_TAG=v3.16.0 make platform-render-private-values
          PLATFORM_AUTO_COMMIT=true make platform-seed-git-sync
          make platform-woodpecker-repair
      run_once: true
      when: >
        ((platform_woodpecker_argocd_sync_wait | default({})).rc | default(0) | int != 0) or
        ((platform_woodpecker_rollout_wait | default({})).rc | default(0) | int != 0) or
        ((platform_woodpecker_runtime_verify | default({})).rc | default(0) | int != 0)

    - name: Show successful Woodpecker repair result
      ansible.builtin.debug:
        msg: |
          Woodpecker Argo CD sync, server/agent rollout, runtime image tag, and
          server service endpoint checks passed. Run `make platform-ci-health`
          for the focused Argo CD/Woodpecker ingress and service-path gate.
      run_once: true
