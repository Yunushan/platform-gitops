---
- name: Repair Woodpecker CI rollout and runtime drift
  hosts: rke2_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    rke2_first_server: "{{ groups['rke2_servers'][0] }}"
    platform_woodpecker_repair_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_WOODPECKER_REPAIR_TIMEOUT') }}"
    platform_woodpecker_repair_expected_image_tag_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_WOODPECKER_REPAIR_EXPECTED_IMAGE_TAG') }}"
    platform_woodpecker_repair_auto_prerequisites_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_WOODPECKER_REPAIR_AUTO_PREREQUISITES') }}"
    platform_woodpecker_repair_reset_failed_replica_pvcs_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_WOODPECKER_REPAIR_RESET_FAILED_REPLICA_PVCS') }}"
    platform_woodpecker_repair_reset_failed_server_replica_pvcs_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_WOODPECKER_REPAIR_RESET_FAILED_SERVER_REPLICA_PVCS') }}"
    platform_woodpecker_repair_reset_unrecoverable_postgres_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_WOODPECKER_REPAIR_RESET_UNRECOVERABLE_POSTGRES') }}"
    platform_woodpecker_repair_recycle_stale_postgres_instance_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_WOODPECKER_REPAIR_RECYCLE_STALE_POSTGRES_INSTANCE') }}"
    platform_woodpecker_repair_stale_postgres_instance_min_age_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_WOODPECKER_REPAIR_STALE_POSTGRES_INSTANCE_MIN_AGE') }}"
    platform_woodpecker_repair_check_image_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_WOODPECKER_REPAIR_CHECK_IMAGE') }}"
    platform_woodpecker_repair_auto_service_path_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_WOODPECKER_REPAIR_AUTO_SERVICE_PATH') }}"
    platform_woodpecker_repair_service_path_rollout_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_WOODPECKER_REPAIR_SERVICE_PATH_ROLLOUT_TIMEOUT') }}"
    platform_woodpecker_repair_service_path_convergence_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_WOODPECKER_REPAIR_SERVICE_PATH_CONVERGENCE_TIMEOUT') }}"
    platform_woodpecker_agent_secret_name_from_env: "{{ lookup('ansible.builtin.env', 'WOODPECKER_AGENT_SECRET_NAME') }}"
    platform_woodpecker_image_tag_from_env: "{{ lookup('ansible.builtin.env', 'WOODPECKER_IMAGE_TAG') }}"
    platform_woodpecker_repair_timeout_effective: "{{ platform_woodpecker_repair_timeout | default(platform_woodpecker_repair_timeout_from_env, true) | default(300, true) | int }}"
    platform_woodpecker_repair_expected_image_tag_effective: "{{ platform_woodpecker_repair_expected_image_tag | default(platform_woodpecker_repair_expected_image_tag_from_env, true) | default(platform_woodpecker_image_tag_from_env, true) | default('v3.16.0', true) }}"
    platform_woodpecker_repair_auto_prerequisites_effective: "{{ platform_woodpecker_repair_auto_prerequisites | default(platform_woodpecker_repair_auto_prerequisites_from_env, true) | default(true, true) | bool }}"
    platform_woodpecker_repair_reset_failed_replica_pvcs_effective: "{{ platform_woodpecker_repair_reset_failed_replica_pvcs | default(platform_woodpecker_repair_reset_failed_replica_pvcs_from_env, true) | default(true, true) | bool }}"
    platform_woodpecker_repair_reset_failed_server_replica_pvcs_effective: "{{ platform_woodpecker_repair_reset_failed_server_replica_pvcs | default(platform_woodpecker_repair_reset_failed_server_replica_pvcs_from_env, true) | default(true, true) | bool }}"
    platform_woodpecker_repair_reset_unrecoverable_postgres_effective: "{{ platform_woodpecker_repair_reset_unrecoverable_postgres | default(platform_woodpecker_repair_reset_unrecoverable_postgres_from_env, true) | default(false, true) | bool }}"
    platform_woodpecker_repair_recycle_stale_postgres_instance_effective: "{{ platform_woodpecker_repair_recycle_stale_postgres_instance | default(platform_woodpecker_repair_recycle_stale_postgres_instance_from_env, true) | default(true, true) | bool }}"
    platform_woodpecker_repair_stale_postgres_instance_min_age_effective: "{{ platform_woodpecker_repair_stale_postgres_instance_min_age | default(platform_woodpecker_repair_stale_postgres_instance_min_age_from_env, true) | default(600, true) | int }}"
    platform_woodpecker_repair_check_image_effective: "{{ platform_woodpecker_repair_check_image | default(platform_woodpecker_repair_check_image_from_env, true) | default('rancher/klipper-helm:v0.10.0-build20260513', true) }}"
    platform_woodpecker_repair_auto_service_path_effective: "{{ platform_woodpecker_repair_auto_service_path | default(platform_woodpecker_repair_auto_service_path_from_env, true) | default(true, true) | bool }}"
    platform_woodpecker_repair_service_path_rollout_timeout_effective: "{{ platform_woodpecker_repair_service_path_rollout_timeout | default(platform_woodpecker_repair_service_path_rollout_timeout_from_env, true) | default(120, true) | int }}"
    platform_woodpecker_repair_service_path_convergence_timeout_effective: "{{ platform_woodpecker_repair_service_path_convergence_timeout | default(platform_woodpecker_repair_service_path_convergence_timeout_from_env, true) | default(180, true) | int }}"
    platform_woodpecker_agent_secret_name_effective: "{{ platform_woodpecker_agent_secret_name | default(platform_woodpecker_agent_secret_name_from_env, true) | default('woodpecker-agent-secret', true) }}"
  tasks:
    - name: Show Woodpecker state before repair
      ansible.builtin.shell: |
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        echo "===== Argo CD Woodpecker application ====="
        "$K" --kubeconfig "$C" -n argocd get application/woodpecker -o wide || true
        echo "===== Woodpecker pods ====="
        "$K" --kubeconfig "$C" -n woodpecker get pods -o wide || true
        echo "===== Woodpecker services/endpoints ====="
        "$K" --kubeconfig "$C" -n woodpecker get svc,endpoints,endpointslice,ingress,pvc -o wide || true
        echo "===== Woodpecker pod images ====="
        "$K" --kubeconfig "$C" -n woodpecker get pods \
          -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{range .spec.containers[*]}{.image}{" "}{end}{"\n"}{end}' || true
      args:
        executable: /bin/bash
      register: platform_woodpecker_repair_state_before
      changed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Print Woodpecker state before repair
      ansible.builtin.debug:
        var: platform_woodpecker_repair_state_before.stdout_lines
      run_once: true

    - name: Ensure platform PostgreSQL backend is available when Woodpecker uses Postgres
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        TIMEOUT={{ platform_woodpecker_repair_timeout_effective }}

        redact() {
          sed -E \
            -e 's#(postgres(ql)?://[^:/ @]+:)[^@]+@#\1<redacted>@#g' \
            -e 's#([?&](password|secret|token)=)[^[:space:]&]+#\1<redacted>#Ig' \
            -e 's#((password|secret|token)[[:space:]]*[:=][[:space:]]*)[^[:space:]]+#\1<redacted>#Ig'
        }

        workload=""
        for candidate in statefulset/woodpecker-server deployment/woodpecker-server; do
          if "$K" --kubeconfig "$C" -n woodpecker get "${candidate}" >/dev/null 2>&1; then
            workload="${candidate}"
            break
          fi
        done
        if [ -z "${workload}" ]; then
          echo "woodpecker_server_workload=absent postgres_backend_check=skipped"
          exit 0
        fi

        driver="$("$K" --kubeconfig "$C" -n woodpecker get "${workload}" \
          -o jsonpath='{range .spec.template.spec.containers[*].env[?(@.name=="WOODPECKER_DATABASE_DRIVER")]}{.value}{"\n"}{end}' 2>/dev/null |
          tail -n 1 || true)"
        case "${driver}" in
          postgres|postgresql)
            ;;
          *)
            echo "woodpecker_database_driver=${driver:-unset} postgres_backend_check=skipped"
            exit 0
            ;;
        esac

        echo "woodpecker_database_driver=${driver}"
        echo "required_postgres_service=platform-databases/platform-postgres-rw"

        if "$K" --kubeconfig "$C" get crd applications.argoproj.io >/dev/null 2>&1; then
          repo_url="$("$K" --kubeconfig "$C" -n argocd get application/woodpecker -o jsonpath='{.spec.source.repoURL}' 2>/dev/null || true)"
          target_revision="$("$K" --kubeconfig "$C" -n argocd get application/woodpecker -o jsonpath='{.spec.source.targetRevision}' 2>/dev/null || true)"
          project="$("$K" --kubeconfig "$C" -n argocd get application/woodpecker -o jsonpath='{.spec.project}' 2>/dev/null || true)"
          target_revision="${target_revision:-main}"
          project="${project:-platform}"

          yaml_escape() {
            sed -e 's/\\/\\\\/g' -e 's/"/\\"/g'
          }

          repo_url_yaml="$(printf '%s' "${repo_url}" | yaml_escape)"
          target_revision_yaml="$(printf '%s' "${target_revision}" | yaml_escape)"
          project_yaml="$(printf '%s' "${project}" | yaml_escape)"

          register_app_if_missing() {
            name="$1"
            wave="$2"
            path="$3"
            namespace="$4"
            safe_name="$(printf '%s' "${name}" | tr '-' '_')"
            if "$K" --kubeconfig "$C" -n argocd get "application/${name}" >/dev/null 2>&1; then
              echo "argocd_application_${safe_name}=present"
              return 0
            fi
            if [ -z "${repo_url}" ]; then
              echo "argocd_application_${safe_name}=absent reason=woodpecker-source-repo-url-empty"
              return 1
            fi
            {
              printf '%s\n' 'apiVersion: argoproj.io/v1alpha1'
              printf '%s\n' 'kind: Application'
              printf '%s\n' 'metadata:'
              printf '  name: %s\n' "${name}"
              printf '%s\n' '  namespace: argocd'
              printf '%s\n' '  annotations:'
              printf '    argocd.argoproj.io/sync-wave: "%s"\n' "${wave}"
              printf '%s\n' 'spec:'
              printf '  project: "%s"\n' "${project_yaml}"
              printf '%s\n' '  source:'
              printf '    repoURL: "%s"\n' "${repo_url_yaml}"
              printf '    targetRevision: "%s"\n' "${target_revision_yaml}"
              printf '    path: %s\n' "${path}"
              printf '%s\n' '  destination:'
              printf '%s\n' '    server: https://kubernetes.default.svc'
              printf '    namespace: %s\n' "${namespace}"
              printf '%s\n' '  syncPolicy:'
              printf '%s\n' '    automated:'
              printf '%s\n' '      prune: true'
              printf '%s\n' '      selfHeal: true'
              printf '%s\n' '      allowEmpty: false'
              printf '%s\n' '    syncOptions:'
              printf '%s\n' '      - CreateNamespace=true'
              printf '%s\n' '      - Prune=confirm'
              printf '%s\n' '      - PruneLast=true'
              printf '%s\n' '      - PrunePropagationPolicy=foreground'
              printf '%s\n' '      - ServerSideApply=true'
            } | "$K" --kubeconfig "$C" apply -f -
            echo "argocd_application_${safe_name}=auto-registered repo=${repo_url_yaml} revision=${target_revision_yaml} path=${path}"
          }

          register_app_if_missing cloudnativepg 2 gitops/clusters/rke2-main/premium-3node/apps/cloudnativepg cnpg-system
          register_app_if_missing platform-postgres 4 gitops/clusters/rke2-main/premium-3node/apps/platform-postgres platform-databases

          for app in cloudnativepg platform-postgres; do
            if ! "$K" --kubeconfig "$C" -n argocd get "application/${app}" >/dev/null 2>&1; then
              echo "argocd_application_${app}=absent"
              continue
            fi
            "$K" --kubeconfig "$C" -n argocd annotate "application/${app}" \
              argocd.argoproj.io/refresh=hard --overwrite >/dev/null
            revision="$("$K" --kubeconfig "$C" -n argocd get "application/${app}" \
              -o jsonpath='{.spec.source.targetRevision}' 2>/dev/null || true)"
            revision="${revision:-main}"
            "$K" --kubeconfig "$C" -n argocd patch "application/${app}" --type merge \
              -p "$(printf '{\"operation\":{\"sync\":{\"revision\":\"%s\",\"prune\":false}}}' "${revision}")" >/dev/null 2>&1 || true
          done

          sync_deadline=$(( $(date +%s) + TIMEOUT ))
          while [ "$(date +%s)" -lt "${sync_deadline}" ]; do
            cnpg_sync="$("$K" --kubeconfig "$C" -n argocd get application/cloudnativepg -o jsonpath='{.status.sync.status}' 2>/dev/null || true)"
            cnpg_health="$("$K" --kubeconfig "$C" -n argocd get application/cloudnativepg -o jsonpath='{.status.health.status}' 2>/dev/null || true)"
            cnpg_operation="$("$K" --kubeconfig "$C" -n argocd get application/cloudnativepg -o jsonpath='{.status.operationState.phase}' 2>/dev/null || true)"
            sync_status="$("$K" --kubeconfig "$C" -n argocd get application/platform-postgres -o jsonpath='{.status.sync.status}' 2>/dev/null || true)"
            health_status="$("$K" --kubeconfig "$C" -n argocd get application/platform-postgres -o jsonpath='{.status.health.status}' 2>/dev/null || true)"
            operation_phase="$("$K" --kubeconfig "$C" -n argocd get application/platform-postgres -o jsonpath='{.status.operationState.phase}' 2>/dev/null || true)"
            conditions="$("$K" --kubeconfig "$C" -n argocd get application/platform-postgres -o jsonpath='{range .status.conditions[*]}{.type}{":"}{.message}{";"}{end}' 2>/dev/null || true)"
            echo "cloudnativepg sync=${cnpg_sync:-unknown} health=${cnpg_health:-unknown} operation=${cnpg_operation:-none}" | redact
            echo "platform-postgres sync=${sync_status:-unknown} health=${health_status:-unknown} operation=${operation_phase:-none} conditions=${conditions:-none}" | redact
            case "${cnpg_operation}:${operation_phase}" in
              Error:*|Failed:*|*:Error|*:Failed)
                break
                ;;
            esac
            if [ "${cnpg_operation}" = "Running" ] || [ "${operation_phase}" = "Running" ]; then
              sleep 5
              continue
            fi
            if [ "${operation_phase}" = "Succeeded" ]; then
              break
            fi
            case "${sync_status}" in
              Synced)
                break
                ;;
            esac
            case "${operation_phase}" in
              Error|Failed)
                break
                ;;
            esac
            sleep 5
          done
        else
          echo "argocd_application_crd=absent"
        fi

        deadline=$(( $(date +%s) + TIMEOUT ))
        while [ "$(date +%s)" -lt "${deadline}" ]; do
          if "$K" --kubeconfig "$C" -n platform-databases get service/platform-postgres-rw >/dev/null 2>&1; then
            ready_endpoints="$("$K" --kubeconfig "$C" -n platform-databases get endpointslice \
              -l kubernetes.io/service-name=platform-postgres-rw \
              -o jsonpath='{range .items[*].endpoints[*]}{.conditions.ready}{"\n"}{end}' 2>/dev/null |
              awk '$1 == "true" || $1 == "<none>" || $1 == "" { count++ } END { print count + 0 }')"
            cluster_instances="$("$K" --kubeconfig "$C" -n platform-databases get cluster.postgresql.cnpg.io/platform-postgres \
              -o jsonpath='{.spec.instances}' 2>/dev/null || true)"
            cluster_ready="$("$K" --kubeconfig "$C" -n platform-databases get cluster.postgresql.cnpg.io/platform-postgres \
              -o jsonpath='{.status.readyInstances}' 2>/dev/null || true)"
            cluster_phase="$("$K" --kubeconfig "$C" -n platform-databases get cluster.postgresql.cnpg.io/platform-postgres \
              -o jsonpath='{.status.phase}' 2>/dev/null || true)"
            case "${cluster_instances}" in ""|*[!0-9]*) cluster_instances=0 ;; esac
            case "${cluster_ready}" in ""|*[!0-9]*) cluster_ready=0 ;; esac
            echo "platform_postgres_rw_service=present ready_endpoints=${ready_endpoints} cluster_ready=${cluster_ready}/${cluster_instances} cluster_phase=${cluster_phase:-unknown}"
            if [ "${ready_endpoints}" -ge 1 ]; then
              if [ "${cluster_instances}" -gt 0 ] && [ "${cluster_ready}" -lt "${cluster_instances}" ]; then
                echo "platform_postgres_ha_state=progressing ready=${cluster_ready}/${cluster_instances} action=continue-woodpecker-repair"
              fi
              exit 0
            fi
            case "${cluster_phase}" in
              *"Instance Status Extraction Error: HTTP communication issue"*)
                echo "result=fail reason=stale-cnpg-instance-status-http-path"
                break
                ;;
            esac
          else
            echo "platform_postgres_rw_service=absent"
          fi
          "$K" --kubeconfig "$C" -n platform-databases get pods,svc,clusters.postgresql.cnpg.io,databases.postgresql.cnpg.io -o wide 2>&1 | redact || true
          sleep 10
        done

        echo "result=fail reason=woodpecker-postgres-backend-not-ready"
        echo "===== platform-postgres application ====="
        "$K" --kubeconfig "$C" -n argocd get application/platform-postgres -o wide 2>&1 | redact || true
        "$K" --kubeconfig "$C" -n argocd describe application/platform-postgres 2>&1 |
          sed -n '/Status:/,/Events:/p' |
          redact || true
        echo "===== platform-databases runtime ====="
        "$K" --kubeconfig "$C" -n platform-databases get pods,svc,endpoints,endpointslice,clusters.postgresql.cnpg.io,databases.postgresql.cnpg.io -o wide 2>&1 | redact || true
        echo "===== Longhorn node and disk scheduling state ====="
        "$K" --kubeconfig "$C" -n longhorn-system get nodes.longhorn.io -o wide 2>&1 | redact || true
        nodes="$("$K" --kubeconfig "$C" -n longhorn-system get nodes.longhorn.io \
          -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)"
        for node in ${nodes}; do
          echo "----- longhorn-node/${node} -----"
          "$K" --kubeconfig "$C" -n longhorn-system describe "nodes.longhorn.io/${node}" 2>&1 |
            sed -n '/Spec:/,/Events:/p' |
            redact || true
        done
        echo "===== platform-databases pod events ====="
        pods="$("$K" --kubeconfig "$C" -n platform-databases get pods \
          -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)"
        for pod in ${pods}; do
          echo "----- pod/${pod} -----"
          "$K" --kubeconfig "$C" -n platform-databases describe "pod/${pod}" 2>&1 |
            sed -n '/Events:/,$p' |
            redact || true
        done
        echo "===== platform-databases PVC and Longhorn backing volumes ====="
        pvcs="$("$K" --kubeconfig "$C" -n platform-databases get pvc \
          -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)"
        for pvc in ${pvcs}; do
          echo "----- pvc/${pvc} -----"
          "$K" --kubeconfig "$C" -n platform-databases describe "pvc/${pvc}" 2>&1 | redact || true
          pv="$("$K" --kubeconfig "$C" -n platform-databases get "pvc/${pvc}" -o jsonpath='{.spec.volumeName}' 2>/dev/null || true)"
          if [ -n "${pv}" ]; then
            handle="$("$K" --kubeconfig "$C" get "pv/${pv}" -o jsonpath='{.spec.csi.volumeHandle}' 2>/dev/null || true)"
            printf 'pv=%s longhornVolume=%s\n' "${pv}" "${handle:-none}"
            if [ -n "${handle}" ] && "$K" --kubeconfig "$C" get crd/volumes.longhorn.io >/dev/null 2>&1; then
              "$K" --kubeconfig "$C" -n longhorn-system get "volumes.longhorn.io/${handle}" -o wide 2>&1 | redact || true
              "$K" --kubeconfig "$C" -n longhorn-system describe "volumes.longhorn.io/${handle}" 2>&1 | redact || true
            fi
          fi
        done
        exit 1
      args:
        executable: /bin/bash
      register: platform_woodpecker_postgres_backend_check
      changed_when: >-
        'platform-postgres sync=' in platform_woodpecker_postgres_backend_check.stdout or
        'argocd_application_platform_postgres=auto-registered' in platform_woodpecker_postgres_backend_check.stdout or
        'argocd_application_cloudnativepg=auto-registered' in platform_woodpecker_postgres_backend_check.stdout
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Automatically repair PostgreSQL prerequisites for Woodpecker when safe
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        TIMEOUT={{ platform_woodpecker_repair_timeout_effective }}
        ALLOW_DESTRUCTIVE_RESET={{ platform_woodpecker_repair_reset_unrecoverable_postgres_effective | bool | lower }}
        RESET_FAILED_REPLICA_PVCS={{ platform_woodpecker_repair_reset_failed_replica_pvcs_effective | bool | lower }}
        RECYCLE_STALE_POSTGRES_INSTANCE={{ platform_woodpecker_repair_recycle_stale_postgres_instance_effective | bool | lower }}
        STALE_POSTGRES_INSTANCE_MIN_AGE={{ platform_woodpecker_repair_stale_postgres_instance_min_age_effective }}

        case "${STALE_POSTGRES_INSTANCE_MIN_AGE}" in
          ""|*[!0-9]*) STALE_POSTGRES_INSTANCE_MIN_AGE=600 ;;
        esac

        redact() {
          sed -E \
            -e 's#(postgres(ql)?://[^:/ @]+:)[^@]+@#\1<redacted>@#g' \
            -e 's#([?&](password|secret|token)=)[^[:space:]&]+#\1<redacted>#Ig' \
            -e 's#((password|secret|token)[[:space:]]*[:=][[:space:]]*)[^[:space:]]+#\1<redacted>#Ig'
        }

        echo "===== automatic Woodpecker PostgreSQL prerequisite repair ====="

        if "$K" --kubeconfig "$C" -n cnpg-system get deployment/cloudnative-pg >/dev/null 2>&1; then
          echo "action=restart-cloudnativepg-operator"
          "$K" --kubeconfig "$C" -n cnpg-system rollout restart deployment/cloudnative-pg
          "$K" --kubeconfig "$C" -n cnpg-system rollout status deployment/cloudnative-pg --timeout=300s || true
          "$K" --kubeconfig "$C" -n cnpg-system get pods,svc,endpointslice -o wide 2>&1 | redact || true
        else
          echo "cloudnativepg_operator=absent"
        fi

        ensure_cnpg_webhook_fail_open() {
          for configuration in \
            mutatingwebhookconfiguration/cnpg-mutating-webhook-configuration \
            validatingwebhookconfiguration/cnpg-validating-webhook-configuration; do
            if ! "$K" --kubeconfig "$C" get "${configuration}" >/dev/null 2>&1; then
              echo "cnpg_webhook_configuration=${configuration} state=absent"
              continue
            fi
            patch="$("$K" --kubeconfig "$C" get "${configuration}" -o json |
              python3 -c '
        import json
        import sys

        document = json.load(sys.stdin)
        operations = [
            {
                "op": "add",
                "path": f"/webhooks/{index}/failurePolicy",
                "value": "Ignore",
            }
            for index, webhook in enumerate(document.get("webhooks", []))
            if webhook.get("failurePolicy") != "Ignore"
        ]
        print(json.dumps(operations))
        ' 2>/dev/null || true)"
            if [ -z "${patch}" ]; then
              echo "cnpg_webhook_configuration=${configuration} state=inspect-failed"
              return 1
            fi
            if [ "${patch}" = "[]" ]; then
              echo "cnpg_webhook_configuration=${configuration} failure_policy=Ignore state=present"
              continue
            fi
            "$K" --kubeconfig "$C" patch "${configuration}" --type=json -p "${patch}" >/dev/null
            echo "cnpg_webhook_configuration=${configuration} action=set-failure-policy-ignore"
          done
        }

        # The premium GitOps profile owns the same Ignore policy. Enforce it
        # immediately so a broken webhook service path cannot deadlock the
        # platform-postgres sync that is needed to recover Woodpecker.
        ensure_cnpg_webhook_fail_open

        recycle_stale_postgres_instance() {
          if [ "${RECYCLE_STALE_POSTGRES_INSTANCE}" != "true" ]; then
            echo "platform_postgres_stale_instance_recycle=disabled"
            return 0
          fi
          if ! "$K" --kubeconfig "$C" -n platform-databases \
            get cluster.postgresql.cnpg.io/platform-postgres >/dev/null 2>&1; then
            return 0
          fi

          cluster_phase="$("$K" --kubeconfig "$C" -n platform-databases \
            get cluster.postgresql.cnpg.io/platform-postgres \
            -o jsonpath='{.status.phase}' 2>/dev/null || true)"
          case "${cluster_phase}" in
            *"Instance Status Extraction Error: HTTP communication issue"*) ;;
            *) return 0 ;;
          esac

          ready_endpoints="$("$K" --kubeconfig "$C" -n platform-databases get endpointslice \
            -l kubernetes.io/service-name=platform-postgres-rw \
            -o jsonpath='{range .items[*].endpoints[*]}{.conditions.ready}{"\n"}{end}' 2>/dev/null |
            awk '$1 == "true" || $1 == "<none>" || $1 == "" { count++ } END { print count + 0 }')"
          cluster_ready="$("$K" --kubeconfig "$C" -n platform-databases \
            get cluster.postgresql.cnpg.io/platform-postgres \
            -o jsonpath='{.status.readyInstances}' 2>/dev/null || true)"
          case "${ready_endpoints}" in ""|*[!0-9]*) ready_endpoints=0 ;; esac
          case "${cluster_ready}" in ""|*[!0-9]*) cluster_ready=0 ;; esac
          if [ "${ready_endpoints}" -gt 0 ] || [ "${cluster_ready}" -gt 0 ]; then
            echo "platform_postgres_stale_instance_recycle=skipped reason=ready-backend-present ready_endpoints=${ready_endpoints} cluster_ready=${cluster_ready}"
            return 0
          fi

          current_primary="$("$K" --kubeconfig "$C" -n platform-databases \
            get cluster.postgresql.cnpg.io/platform-postgres \
            -o jsonpath='{.status.currentPrimary}' 2>/dev/null || true)"
          if [ -z "${current_primary}" ] || ! "$K" --kubeconfig "$C" -n platform-databases \
            get "pod/${current_primary}" >/dev/null 2>&1; then
            echo "platform_postgres_stale_instance_recycle=skipped reason=current-primary-pod-absent"
            return 0
          fi

          pod_owner="$("$K" --kubeconfig "$C" -n platform-databases get "pod/${current_primary}" \
            -o jsonpath='{range .metadata.ownerReferences[*]}{.kind}{"/"}{.name}{"\n"}{end}' 2>/dev/null || true)"
          if ! printf '%s\n' "${pod_owner}" | grep -qx 'Cluster/platform-postgres'; then
            echo "platform_postgres_stale_instance_recycle=skipped reason=unexpected-pod-owner pod=${current_primary}"
            return 0
          fi

          pod_uid="$("$K" --kubeconfig "$C" -n platform-databases get "pod/${current_primary}" \
            -o jsonpath='{.metadata.uid}' 2>/dev/null || true)"
          pod_phase="$("$K" --kubeconfig "$C" -n platform-databases get "pod/${current_primary}" \
            -o jsonpath='{.status.phase}' 2>/dev/null || true)"
          pod_deleting="$("$K" --kubeconfig "$C" -n platform-databases get "pod/${current_primary}" \
            -o jsonpath='{.metadata.deletionTimestamp}' 2>/dev/null || true)"
          pod_created="$("$K" --kubeconfig "$C" -n platform-databases get "pod/${current_primary}" \
            -o jsonpath='{.metadata.creationTimestamp}' 2>/dev/null || true)"
          pod_ready="$("$K" --kubeconfig "$C" -n platform-databases get "pod/${current_primary}" \
            -o jsonpath='{range .status.containerStatuses[*]}{.ready}{"\n"}{end}' 2>/dev/null |
            awk '$1 == "true" { count++ } END { print count + 0 }')"
          pod_created_epoch="$(date -d "${pod_created}" +%s 2>/dev/null || echo 0)"
          case "${pod_ready}" in ""|*[!0-9]*) pod_ready=0 ;; esac
          case "${pod_created_epoch}" in ""|*[!0-9]*) pod_created_epoch=0 ;; esac
          pod_age=0
          if [ "${pod_created_epoch}" -gt 0 ]; then
            pod_age=$(( $(date +%s) - pod_created_epoch ))
          fi

          if [ -z "${pod_uid}" ] || [ "${pod_phase}" != "Running" ] || [ "${pod_ready}" -gt 0 ] || \
            [ -n "${pod_deleting}" ] || [ "${pod_age}" -lt "${STALE_POSTGRES_INSTANCE_MIN_AGE}" ]; then
            echo "platform_postgres_stale_instance_recycle=skipped reason=pod-not-eligible pod=${current_primary} uid=${pod_uid:-absent} phase=${pod_phase:-unknown} ready_containers=${pod_ready} age=${pod_age} deleting=${pod_deleting:-false}"
            return 0
          fi

          pvc_names="$("$K" --kubeconfig "$C" -n platform-databases get "pod/${current_primary}" \
            -o jsonpath='{range .spec.volumes[*]}{.persistentVolumeClaim.claimName}{"\n"}{end}' 2>/dev/null |
            awk 'NF' | sort -u)"
          if [ -z "${pvc_names}" ]; then
            echo "platform_postgres_stale_instance_recycle=skipped reason=pod-has-no-pvc pod=${current_primary}"
            return 0
          fi

          pvc_contract_safe=true
          for pvc in ${pvc_names}; do
            pvc_phase="$("$K" --kubeconfig "$C" -n platform-databases get "pvc/${pvc}" \
              -o jsonpath='{.status.phase}' 2>/dev/null || true)"
            pvc_uid="$("$K" --kubeconfig "$C" -n platform-databases get "pvc/${pvc}" \
              -o jsonpath='{.metadata.uid}' 2>/dev/null || true)"
            pvc_deleting="$("$K" --kubeconfig "$C" -n platform-databases get "pvc/${pvc}" \
              -o jsonpath='{.metadata.deletionTimestamp}' 2>/dev/null || true)"
            if [ "${pvc_phase}" != "Bound" ] || [ -z "${pvc_uid}" ] || [ -n "${pvc_deleting}" ]; then
              echo "platform_postgres_stale_instance_pvc=${pvc} action=retain reason=pvc-not-safe-for-pod-recycle phase=${pvc_phase:-absent} deleting=${pvc_deleting:-false}"
              pvc_contract_safe=false
              continue
            fi
            echo "platform_postgres_stale_instance_pvc=${pvc} action=retain reason=pvc-retained uid=${pvc_uid}"
          done
          if [ "${pvc_contract_safe}" != "true" ]; then
            echo "platform_postgres_stale_instance_recycle=skipped reason=pvc-contract-not-safe pod=${current_primary}"
            return 0
          fi

          echo "----- stale CNPG instance diagnostics pod/${current_primary} -----"
          "$K" --kubeconfig "$C" -n platform-databases get "pod/${current_primary}" -o wide 2>&1 | redact || true
          "$K" --kubeconfig "$C" -n platform-databases describe "pod/${current_primary}" 2>&1 |
            sed -n '/Events:/,$p' |
            redact || true
          echo "platform_postgres_stale_instance_pod=${current_primary} uid=${pod_uid} age=${pod_age} action=recycle-stale-unready-cnpg-instance-pod pvc_action=retain"
          if ! "$K" --kubeconfig "$C" -n platform-databases delete "pod/${current_primary}" \
            --ignore-not-found=true --wait=false; then
            echo "platform_postgres_stale_instance_recycle=failed reason=pod-delete-request-failed pod=${current_primary}"
            return 0
          fi

          replacement_wait=120
          if [ "${TIMEOUT}" -lt "${replacement_wait}" ]; then
            replacement_wait="${TIMEOUT}"
          fi
          replacement_deadline=$(( $(date +%s) + replacement_wait ))
          while [ "$(date +%s)" -lt "${replacement_deadline}" ]; do
            replacement_uid="$("$K" --kubeconfig "$C" -n platform-databases get "pod/${current_primary}" \
              -o jsonpath='{.metadata.uid}' 2>/dev/null || true)"
            if [ -n "${replacement_uid}" ] && [ "${replacement_uid}" != "${pod_uid}" ]; then
              echo "platform_postgres_stale_instance_pod=${current_primary} old_uid=${pod_uid} replacement_uid=${replacement_uid} action=replacement-created pvc_action=retain"
              return 0
            fi
            sleep 5
          done
          echo "platform_postgres_stale_instance_pod=${current_primary} old_uid=${pod_uid} action=replacement-pending pvc_action=retain"
        }

        # The Make target has already repaired the all-node service path. A
        # long-lived unready primary can retain a stale CNI endpoint or old
        # instance manager, so recycle only that Pod and keep every PVC.
        recycle_stale_postgres_instance

        reset_postgres=false
        cluster_status="$("$K" --kubeconfig "$C" -n platform-databases get cluster.postgresql.cnpg.io/platform-postgres \
          -o jsonpath='{.status.phase} {.status.conditions[*].message}' 2>/dev/null || true)"
        if printf '%s\n' "${cluster_status}" | grep -qi 'unrecoverable'; then
          pvc_names="$(
            {
              "$K" --kubeconfig "$C" -n platform-databases get pvc \
                -l cnpg.io/cluster=platform-postgres \
                -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true
              "$K" --kubeconfig "$C" -n platform-databases get pvc \
                -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null |
                grep -E '^platform-postgres-[0-9]+$' || true
            } | sort -u
          )"
          if [ -z "${pvc_names}" ]; then
            echo "platform_postgres_unrecoverable=true pvc_count=0 action=reset-empty-cnpg-cluster"
            reset_postgres=true
          elif [ "${ALLOW_DESTRUCTIVE_RESET}" = "true" ]; then
            echo "platform_postgres_unrecoverable=true pvc_count=$(printf '%s\n' "${pvc_names}" | wc -l) action=destructive-reset-enabled"
            reset_postgres=true
          else
            echo "platform_postgres_unrecoverable=true pvc_count=$(printf '%s\n' "${pvc_names}" | wc -l) action=blocked-needs-PLATFORM_WOODPECKER_REPAIR_RESET_UNRECOVERABLE_POSTGRES"
          fi
        fi

        if [ "${reset_postgres}" = "true" ]; then
          pv_names=""
          longhorn_handles=""
          pvc_names="$(
            {
              "$K" --kubeconfig "$C" -n platform-databases get pvc \
                -l cnpg.io/cluster=platform-postgres \
                -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true
              "$K" --kubeconfig "$C" -n platform-databases get pvc \
                -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null |
                grep -E '^platform-postgres-[0-9]+$' || true
            } | sort -u
          )"
          for pvc in ${pvc_names}; do
            pv="$("$K" --kubeconfig "$C" -n platform-databases get "pvc/${pvc}" -o jsonpath='{.spec.volumeName}' 2>/dev/null || true)"
            [ -n "${pv}" ] || continue
            handle="$("$K" --kubeconfig "$C" get "pv/${pv}" -o jsonpath='{.spec.csi.volumeHandle}' 2>/dev/null || true)"
            pv_names="${pv_names} ${pv}"
            if [ -n "${handle}" ]; then
              longhorn_handles="${longhorn_handles} ${handle}"
            fi
          done

          for database in platform-postgres-keycloak platform-postgres-woodpecker; do
            "$K" --kubeconfig "$C" -n platform-databases delete "database.postgresql.cnpg.io/${database}" --ignore-not-found=true --wait=false || true
          done
          "$K" --kubeconfig "$C" -n platform-databases delete cluster.postgresql.cnpg.io/platform-postgres --ignore-not-found=true --wait=false || true
          "$K" --kubeconfig "$C" -n platform-databases delete job,pod -l cnpg.io/cluster=platform-postgres --ignore-not-found=true --wait=false || true

          if [ -n "${pvc_names}" ] && [ "${ALLOW_DESTRUCTIVE_RESET}" = "true" ]; then
            for pvc in ${pvc_names}; do
              "$K" --kubeconfig "$C" -n platform-databases delete "pvc/${pvc}" --ignore-not-found=true --wait=false
            done
            for pv in ${pv_names}; do
              "$K" --kubeconfig "$C" delete "pv/${pv}" --ignore-not-found=true --wait=false
            done
            for handle in ${longhorn_handles}; do
              "$K" --kubeconfig "$C" -n longhorn-system delete "volumes.longhorn.io/${handle}" --ignore-not-found=true --wait=false || true
            done
          fi

          delete_deadline=$(( $(date +%s) + 90 ))
          while [ "$(date +%s)" -lt "${delete_deadline}" ]; do
            if ! "$K" --kubeconfig "$C" -n platform-databases get cluster.postgresql.cnpg.io/platform-postgres >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done

          if "$K" --kubeconfig "$C" -n platform-databases get cluster.postgresql.cnpg.io/platform-postgres >/dev/null 2>&1; then
            echo "platform_postgres_cluster_delete=stuck action=clear-empty-cluster-finalizers"
            "$K" --kubeconfig "$C" -n platform-databases patch cluster.postgresql.cnpg.io/platform-postgres \
              --type=merge -p '{"metadata":{"finalizers":[]}}' || true
            "$K" --kubeconfig "$C" -n platform-databases delete cluster.postgresql.cnpg.io/platform-postgres --ignore-not-found=true --wait=false || true
          fi

          for database in platform-postgres-keycloak platform-postgres-woodpecker; do
            if "$K" --kubeconfig "$C" -n platform-databases get "database.postgresql.cnpg.io/${database}" >/dev/null 2>&1; then
              echo "platform_postgres_database_delete=stuck name=${database} action=clear-finalizers"
              "$K" --kubeconfig "$C" -n platform-databases patch "database.postgresql.cnpg.io/${database}" \
                --type=merge -p '{"metadata":{"finalizers":[]}}' || true
              "$K" --kubeconfig "$C" -n platform-databases delete "database.postgresql.cnpg.io/${database}" --ignore-not-found=true --wait=false || true
            fi
          done

          "$K" --kubeconfig "$C" -n platform-databases delete service/platform-postgres-r service/platform-postgres-ro service/platform-postgres-rw \
            --ignore-not-found=true --wait=false || true
          "$K" --kubeconfig "$C" -n platform-databases delete endpoints/platform-postgres-r endpoints/platform-postgres-ro endpoints/platform-postgres-rw \
            --ignore-not-found=true --wait=false || true
          "$K" --kubeconfig "$C" -n platform-databases delete endpointslice \
            -l cnpg.io/cluster=platform-postgres --ignore-not-found=true --wait=false || true
        fi

        cleaned_replica_instances=""

        active_replica_pod() {
          local instance="$1"
          local pod_object
          local pod_phase
          for pod_object in $("$K" --kubeconfig "$C" -n platform-databases get pod -o name 2>/dev/null |
            grep -E "^pod/${instance}($|-join)" || true); do
            pod_phase="$("$K" --kubeconfig "$C" -n platform-databases get "${pod_object}" \
              -o jsonpath='{.status.phase}' 2>/dev/null || true)"
            if [ -n "${pod_phase}" ] && [ "${pod_phase}" != "Failed" ] && [ "${pod_phase}" != "Succeeded" ]; then
              printf '%s|%s\n' "${pod_object#pod/}" "${pod_phase}"
              return 0
            fi
          done
          return 1
        }

        cleanup_failed_postgres_replica_pvcs() {
          [ "${RESET_FAILED_REPLICA_PVCS}" = "true" ] || return 0
          "$K" --kubeconfig "$C" -n platform-databases get cluster.postgresql.cnpg.io/platform-postgres >/dev/null 2>&1 || return 0

          replica_pvcs="$(
            "$K" --kubeconfig "$C" -n platform-databases get pvc \
              -l cnpg.io/cluster=platform-postgres \
              -o json 2>/dev/null |
              python3 -c 'import json,sys; data=json.load(sys.stdin); [print("|".join([((item.get("metadata") or {}).get("name") or ""), (((item.get("metadata") or {}).get("labels") or {}).get("role") or ""), (((item.get("metadata") or {}).get("labels") or {}).get("cnpg.io/instanceName") or ""), (((item.get("metadata") or {}).get("annotations") or {}).get("cnpg.io/pvcStatus") or ""), ((item.get("spec") or {}).get("volumeName") or ""), ((item.get("metadata") or {}).get("uid") or "")])) for item in data.get("items", [])]' || true
          )"
          while IFS='|' read -r pvc role instance pvc_status pv pvc_uid; do
            [ -n "${pvc}" ] || continue
            [ "${role}" = "replica" ] || continue
            [ "${pvc_status}" = "initializing" ] || continue
            if [ -z "${instance}" ] || [ -z "${pvc_uid}" ]; then
              echo "platform_postgres_replica_pvc=${pvc} action=retain reason=replica-identity-incomplete"
              continue
            fi
            case " ${cleaned_replica_instances} " in
              *" ${instance} "*) continue ;;
            esac

            active_pod="$(active_replica_pod "${instance}" || true)"
            if [ -n "${active_pod}" ]; then
              echo "platform_postgres_replica_pvc=${pvc} action=retain reason=replica-pod-active pod=${active_pod%%|*} phase=${active_pod#*|}"
              continue
            fi

            handle=""
            actual_size=0
            volume_state=""
            volume_exists=false
            if [ -n "${pv}" ]; then
              handle="$("$K" --kubeconfig "$C" get "pv/${pv}" -o jsonpath='{.spec.csi.volumeHandle}' 2>/dev/null || true)"
            fi
            if [ -n "${handle}" ] && "$K" --kubeconfig "$C" get crd/volumes.longhorn.io >/dev/null 2>&1 &&
              "$K" --kubeconfig "$C" -n longhorn-system get "volumes.longhorn.io/${handle}" >/dev/null 2>&1; then
              volume_exists=true
              actual_size="$("$K" --kubeconfig "$C" -n longhorn-system get "volumes.longhorn.io/${handle}" \
                -o jsonpath='{.status.actualSize}' 2>/dev/null || echo 0)"
              volume_state="$("$K" --kubeconfig "$C" -n longhorn-system get "volumes.longhorn.io/${handle}" \
                -o jsonpath='{.status.state}' 2>/dev/null || true)"
            fi
            case "${actual_size}" in ""|*[!0-9]*) actual_size=1 ;; esac

            if [ "${actual_size}" -gt 0 ]; then
              echo "platform_postgres_replica_pvc=${pvc} action=retain reason=replica-volume-has-data actual_size=${actual_size} state=${volume_state:-unknown}"
              continue
            fi
            if [ "${volume_exists}" = "true" ] && [ "${volume_state}" != "detached" ]; then
              echo "platform_postgres_replica_pvc=${pvc} action=retain reason=replica-volume-not-detached actual_size=${actual_size} state=${volume_state:-unknown}"
              continue
            fi

            echo "platform_postgres_replica_pvc=${pvc} action=delete-failed-cnpg-replica-pvc instance=${instance} uid=${pvc_uid} pv=${pv:-none} longhornVolume=${handle:-none} state=${volume_state:-absent}"
            for object in $("$K" --kubeconfig "$C" -n platform-databases get job,pod -o name 2>/dev/null |
              grep -E "^(.+/)?${instance}-join" || true); do
              echo "platform_postgres_replica_init_object=${object} action=delete-failed-cnpg-replica-join"
              "$K" --kubeconfig "$C" -n platform-databases delete "${object}" --ignore-not-found=true --wait=false || true
            done
            "$K" --kubeconfig "$C" -n platform-databases delete "pvc/${pvc}" --ignore-not-found=true --wait=false || true

            delete_deadline=$(( $(date +%s) + 20 ))
            while [ "$(date +%s)" -lt "${delete_deadline}" ]; do
              current_uid="$("$K" --kubeconfig "$C" -n platform-databases get "pvc/${pvc}" \
                -o jsonpath='{.metadata.uid}' 2>/dev/null || true)"
              if [ -z "${current_uid}" ] || [ "${current_uid}" != "${pvc_uid}" ]; then
                break
              fi
              active_pod="$(active_replica_pod "${instance}" || true)"
              if [ -n "${active_pod}" ]; then
                echo "platform_postgres_replica_pvc=${pvc} action=retain-finalizer reason=replica-pod-became-active pod=${active_pod%%|*} phase=${active_pod#*|}"
                break
              fi
              sleep 2
            done

            current_uid="$("$K" --kubeconfig "$C" -n platform-databases get "pvc/${pvc}" \
              -o jsonpath='{.metadata.uid}' 2>/dev/null || true)"
            if [ "${current_uid}" = "${pvc_uid}" ]; then
              deletion_timestamp="$("$K" --kubeconfig "$C" -n platform-databases get "pvc/${pvc}" \
                -o jsonpath='{.metadata.deletionTimestamp}' 2>/dev/null || true)"
              active_pod="$(active_replica_pod "${instance}" || true)"
              current_actual_size=0
              current_volume_state=""
              current_volume_exists=false
              if [ -n "${handle}" ] && "$K" --kubeconfig "$C" -n longhorn-system get "volumes.longhorn.io/${handle}" >/dev/null 2>&1; then
                current_volume_exists=true
                current_actual_size="$("$K" --kubeconfig "$C" -n longhorn-system get "volumes.longhorn.io/${handle}" \
                  -o jsonpath='{.status.actualSize}' 2>/dev/null || echo 0)"
                current_volume_state="$("$K" --kubeconfig "$C" -n longhorn-system get "volumes.longhorn.io/${handle}" \
                  -o jsonpath='{.status.state}' 2>/dev/null || true)"
              fi
              case "${current_actual_size}" in ""|*[!0-9]*) current_actual_size=1 ;; esac
              if [ -n "${deletion_timestamp}" ] && [ -z "${active_pod}" ] && [ "${current_actual_size}" -eq 0 ] &&
                { [ "${current_volume_exists}" = "false" ] || [ "${current_volume_state}" = "detached" ]; }; then
                echo "platform_postgres_replica_pvc=${pvc} action=clear-zero-byte-failed-replica-pvc-finalizer uid=${pvc_uid}"
                "$K" --kubeconfig "$C" -n platform-databases patch "pvc/${pvc}" \
                  --type=merge -p '{"metadata":{"finalizers":[]}}' || true
                "$K" --kubeconfig "$C" -n platform-databases delete "pvc/${pvc}" --ignore-not-found=true --wait=false || true
                finalizer_deadline=$(( $(date +%s) + 15 ))
                while [ "$(date +%s)" -lt "${finalizer_deadline}" ]; do
                  current_uid="$("$K" --kubeconfig "$C" -n platform-databases get "pvc/${pvc}" \
                    -o jsonpath='{.metadata.uid}' 2>/dev/null || true)"
                  if [ -z "${current_uid}" ] || [ "${current_uid}" != "${pvc_uid}" ]; then
                    break
                  fi
                  sleep 2
                done
              fi
            fi

            current_uid="$("$K" --kubeconfig "$C" -n platform-databases get "pvc/${pvc}" \
              -o jsonpath='{.metadata.uid}' 2>/dev/null || true)"
            if [ "${current_uid}" = "${pvc_uid}" ]; then
              echo "platform_postgres_replica_pvc=${pvc} action=retain reason=zero-byte-replica-cleanup-pending uid=${pvc_uid}"
              cleaned_replica_instances="${cleaned_replica_instances} ${instance}"
              continue
            fi

            longhorn_cleanup_allowed=false
            if [ -n "${handle}" ] && "$K" --kubeconfig "$C" -n longhorn-system get "volumes.longhorn.io/${handle}" >/dev/null 2>&1; then
              cleanup_actual_size="$("$K" --kubeconfig "$C" -n longhorn-system get "volumes.longhorn.io/${handle}" \
                -o jsonpath='{.status.actualSize}' 2>/dev/null || echo 0)"
              cleanup_volume_state="$("$K" --kubeconfig "$C" -n longhorn-system get "volumes.longhorn.io/${handle}" \
                -o jsonpath='{.status.state}' 2>/dev/null || true)"
              cleanup_pvc="$("$K" --kubeconfig "$C" -n longhorn-system get "volumes.longhorn.io/${handle}" \
                -o jsonpath='{.status.kubernetesStatus.pvcName}' 2>/dev/null || true)"
              cleanup_namespace="$("$K" --kubeconfig "$C" -n longhorn-system get "volumes.longhorn.io/${handle}" \
                -o jsonpath='{.status.kubernetesStatus.namespace}' 2>/dev/null || true)"
              case "${cleanup_actual_size}" in ""|*[!0-9]*) cleanup_actual_size=1 ;; esac
              if [ "${cleanup_actual_size}" -eq 0 ] && [ "${cleanup_volume_state}" = "detached" ] &&
                [ "${cleanup_pvc}" = "${pvc}" ] && [ "${cleanup_namespace}" = "platform-databases" ]; then
                longhorn_cleanup_allowed=true
              fi
            fi

            if [ -n "${pv}" ] && "$K" --kubeconfig "$C" get "pv/${pv}" >/dev/null 2>&1; then
              pv_claim_uid="$("$K" --kubeconfig "$C" get "pv/${pv}" -o jsonpath='{.spec.claimRef.uid}' 2>/dev/null || true)"
              pv_handle="$("$K" --kubeconfig "$C" get "pv/${pv}" -o jsonpath='{.spec.csi.volumeHandle}' 2>/dev/null || true)"
              if [ "${pv_claim_uid}" = "${pvc_uid}" ] && { [ -z "${handle}" ] || [ "${pv_handle}" = "${handle}" ]; }; then
                echo "platform_postgres_replica_pv=${pv} action=delete-zero-byte-failed-replica-pv claim_uid=${pvc_uid}"
                "$K" --kubeconfig "$C" delete "pv/${pv}" --ignore-not-found=true --wait=false || true
              fi
            fi
            if [ "${longhorn_cleanup_allowed}" = "true" ]; then
              echo "platform_postgres_replica_longhorn_volume=${handle} action=delete-zero-byte-failed-replica-longhorn-volume"
              "$K" --kubeconfig "$C" -n longhorn-system delete "volumes.longhorn.io/${handle}" \
                --ignore-not-found=true --wait=false || true
            fi
            cleaned_replica_instances="${cleaned_replica_instances} ${instance}"
          done <<< "${replica_pvcs}"
        }

        cleanup_failed_postgres_replica_pvcs

        if "$K" --kubeconfig "$C" get crd applications.argoproj.io >/dev/null 2>&1; then
          for app in cloudnativepg platform-postgres; do
            if "$K" --kubeconfig "$C" -n argocd get "application/${app}" >/dev/null 2>&1; then
              "$K" --kubeconfig "$C" -n argocd annotate "application/${app}" \
                argocd.argoproj.io/refresh=hard --overwrite >/dev/null || true
              revision="$("$K" --kubeconfig "$C" -n argocd get "application/${app}" \
                -o jsonpath='{.spec.source.targetRevision}' 2>/dev/null || true)"
              revision="${revision:-main}"
              "$K" --kubeconfig "$C" -n argocd patch "application/${app}" --type merge \
                -p "$(printf '{\"operation\":{\"sync\":{\"revision\":\"%s\",\"prune\":false}}}' "${revision}")" >/dev/null 2>&1 || true
              echo "argocd_application_${app}=refresh-sync-requested"
            else
              echo "argocd_application_${app}=absent"
            fi
          done
        fi

        deadline=$(( $(date +%s) + TIMEOUT ))
        while [ "$(date +%s)" -lt "${deadline}" ]; do
          cleanup_failed_postgres_replica_pvcs
          ready_endpoints="$("$K" --kubeconfig "$C" -n platform-databases get endpointslice \
            -l kubernetes.io/service-name=platform-postgres-rw \
            -o jsonpath='{range .items[*].endpoints[*]}{.conditions.ready}{"\n"}{end}' 2>/dev/null |
            awk '$1 == "true" || $1 == "<none>" || $1 == "" { count++ } END { print count + 0 }')"
          cluster_instances="$("$K" --kubeconfig "$C" -n platform-databases get cluster.postgresql.cnpg.io/platform-postgres \
            -o jsonpath='{.spec.instances}' 2>/dev/null || true)"
          cluster_ready="$("$K" --kubeconfig "$C" -n platform-databases get cluster.postgresql.cnpg.io/platform-postgres \
            -o jsonpath='{.status.readyInstances}' 2>/dev/null || true)"
          cluster_phase="$("$K" --kubeconfig "$C" -n platform-databases get cluster.postgresql.cnpg.io/platform-postgres \
            -o jsonpath='{.status.phase}' 2>/dev/null || true)"
          case "${cluster_instances}" in ""|*[!0-9]*) cluster_instances=0 ;; esac
          case "${cluster_ready}" in ""|*[!0-9]*) cluster_ready=0 ;; esac
          echo "platform_postgres_rw_service=present ready_endpoints=${ready_endpoints} cluster_ready=${cluster_ready}/${cluster_instances} cluster_phase=${cluster_phase:-unknown}"
          if [ "${ready_endpoints}" -ge 1 ]; then
            if [ "${cluster_instances}" -gt 0 ] && [ "${cluster_ready}" -lt "${cluster_instances}" ]; then
              echo "platform_postgres_ha_state=progressing ready=${cluster_ready}/${cluster_instances} action=continue-woodpecker-repair"
            fi
            exit 0
          fi
          "$K" --kubeconfig "$C" -n platform-databases get pods,svc,endpointslice,clusters.postgresql.cnpg.io,databases.postgresql.cnpg.io -o wide 2>&1 | redact || true
          sleep 10
        done

        echo "result=fail reason=automatic-postgres-prerequisite-repair-did-not-produce-ready-endpoint"
        exit 1
      args:
        executable: /bin/bash
      register: platform_woodpecker_postgres_auto_repair
      changed_when: >-
        'action=restart-cloudnativepg-operator' in platform_woodpecker_postgres_auto_repair.stdout or
        'action=reset-empty-cnpg-cluster' in platform_woodpecker_postgres_auto_repair.stdout or
        'action=destructive-reset-enabled' in platform_woodpecker_postgres_auto_repair.stdout or
        'action=delete-failed-cnpg-replica-pvc' in platform_woodpecker_postgres_auto_repair.stdout or
        'action=clear-zero-byte-failed-replica-pvc-finalizer' in platform_woodpecker_postgres_auto_repair.stdout or
        'action=delete-zero-byte-failed-replica-pv' in platform_woodpecker_postgres_auto_repair.stdout or
        'action=delete-zero-byte-failed-replica-longhorn-volume' in platform_woodpecker_postgres_auto_repair.stdout or
        'action=set-failure-policy-ignore' in platform_woodpecker_postgres_auto_repair.stdout or
        'action=recycle-stale-unready-cnpg-instance-pod' in platform_woodpecker_postgres_auto_repair.stdout or
        'refresh-sync-requested' in platform_woodpecker_postgres_auto_repair.stdout
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      when: >
        platform_woodpecker_repair_auto_prerequisites_effective | bool and
        platform_woodpecker_postgres_backend_check.rc | int != 0

    - name: Re-check platform PostgreSQL backend after automatic prerequisite repair
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        TIMEOUT={{ platform_woodpecker_repair_timeout_effective }}

        redact() {
          sed -E \
            -e 's#(postgres(ql)?://[^:/ @]+:)[^@]+@#\1<redacted>@#g' \
            -e 's#([?&](password|secret|token)=)[^[:space:]&]+#\1<redacted>#Ig' \
            -e 's#((password|secret|token)[[:space:]]*[:=][[:space:]]*)[^[:space:]]+#\1<redacted>#Ig'
        }

        deadline=$(( $(date +%s) + TIMEOUT ))
        while [ "$(date +%s)" -lt "${deadline}" ]; do
          ready_endpoints="$("$K" --kubeconfig "$C" -n platform-databases get endpointslice \
            -l kubernetes.io/service-name=platform-postgres-rw \
            -o jsonpath='{range .items[*].endpoints[*]}{.conditions.ready}{"\n"}{end}' 2>/dev/null |
            awk '$1 == "true" || $1 == "<none>" || $1 == "" { count++ } END { print count + 0 }')"
          cluster_instances="$("$K" --kubeconfig "$C" -n platform-databases get cluster.postgresql.cnpg.io/platform-postgres \
            -o jsonpath='{.spec.instances}' 2>/dev/null || true)"
          cluster_ready="$("$K" --kubeconfig "$C" -n platform-databases get cluster.postgresql.cnpg.io/platform-postgres \
            -o jsonpath='{.status.readyInstances}' 2>/dev/null || true)"
          cluster_phase="$("$K" --kubeconfig "$C" -n platform-databases get cluster.postgresql.cnpg.io/platform-postgres \
            -o jsonpath='{.status.phase}' 2>/dev/null || true)"
          case "${cluster_instances}" in ""|*[!0-9]*) cluster_instances=0 ;; esac
          case "${cluster_ready}" in ""|*[!0-9]*) cluster_ready=0 ;; esac
          echo "platform_postgres_rw_service=present ready_endpoints=${ready_endpoints} cluster_ready=${cluster_ready}/${cluster_instances} cluster_phase=${cluster_phase:-unknown}"
          if [ "${ready_endpoints}" -ge 1 ]; then
            if [ "${cluster_instances}" -gt 0 ] && [ "${cluster_ready}" -lt "${cluster_instances}" ]; then
              echo "platform_postgres_ha_state=progressing ready=${cluster_ready}/${cluster_instances} action=continue-woodpecker-repair"
            fi
            exit 0
          fi
          "$K" --kubeconfig "$C" -n platform-databases get pods,svc,endpointslice,clusters.postgresql.cnpg.io,databases.postgresql.cnpg.io -o wide 2>&1 | redact || true
          sleep 10
        done

        echo "result=fail reason=woodpecker-postgres-backend-not-ready-after-auto-repair"
        echo "===== platform-postgres application ====="
        "$K" --kubeconfig "$C" -n argocd get application/platform-postgres -o wide 2>&1 | redact || true
        "$K" --kubeconfig "$C" -n argocd describe application/platform-postgres 2>&1 |
          sed -n '/Status:/,/Events:/p' |
          redact || true
        echo "===== platform-databases runtime ====="
        "$K" --kubeconfig "$C" -n platform-databases get pods,svc,endpoints,endpointslice,clusters.postgresql.cnpg.io,databases.postgresql.cnpg.io -o wide 2>&1 | redact || true
        exit 1
      args:
        executable: /bin/bash
      register: platform_woodpecker_postgres_backend_recheck
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      when: >
        platform_woodpecker_repair_auto_prerequisites_effective | bool and
        platform_woodpecker_postgres_backend_check.rc | int != 0

    - name: Stop when Woodpecker PostgreSQL backend is missing
      ansible.builtin.fail:
        msg: |
          {% set backend_output = [
            (platform_woodpecker_postgres_backend_check | default({})).stdout | default('', true),
            (platform_woodpecker_postgres_auto_repair | default({})).stdout | default('', true),
            (platform_woodpecker_postgres_backend_recheck | default({})).stdout | default('', true)
          ] | join('\n') %}
          {% if (platform_woodpecker_postgres_auto_repair | default({})).stdout | default('', true) %}
          Automatic prerequisite repair output:
          {{ platform_woodpecker_postgres_auto_repair.stdout | default('not run') }}

          {% endif %}
          {% if backend_output | regex_search('dial tcp [0-9.]+:8081: i/o timeout|Failed to load target state|repo-server') %}
          Argo CD could not render/sync the platform PostgreSQL backend because
          its repo-server path is unhealthy. Repair Argo CD internal service
          reachability first, then rerun the Woodpecker repair:

          make platform-argocd-service-repair
          make platform-woodpecker-repair

          {% endif %}
          {% if backend_output | regex_search('cnpg-webhook-service|mcluster\\.cnpg\\.io|failed calling webhook.*cnpg|context deadline exceeded') %}
          CloudNativePG webhook calls are timing out while applying
          platform-postgres. The parent Make target classifies this as a
          service-path fault, forces one all-node CNI/firewalld recovery, and
          retries the Woodpecker repair once. To run that recovery separately:

          PLATFORM_DNS_SERVICE_PATH_REPAIR=true PLATFORM_DNS_FORCE_SERVICE_PATH_REPAIR=true make platform-dns-repair

          {% endif %}
          {% if backend_output | regex_search('driver name driver\\.longhorn\\.io not found in the list of registered CSI drivers|MountVolume\\.(MountDevice|SetUp) failed.*driver\\.longhorn\\.io|longhorn-csi-(plugin|registration)') %}
          Longhorn CSI is not registered on one or more RKE2 nodes. The parent
          Make target runs a focused manager/CSI recovery before its one
          Woodpecker retry. This target does not wait for cluster-wide storage
          capacity and does not delete the active PostgreSQL volume:

          make platform-longhorn-runtime-repair

          {% endif %}
          {% if backend_output | regex_search('blocked-needs-PLATFORM_WOODPECKER_REPAIR_RESET_UNRECOVERABLE_POSTGRES') %}
          platform-postgres is unrecoverable and still has PVCs, so automatic
          repair did not delete it. If this is an empty redeploy and the
          platform-postgres database contains no real data, rerun:

          PLATFORM_WOODPECKER_REPAIR_RESET_UNRECOVERABLE_POSTGRES=true make platform-woodpecker-repair

          {% endif %}
          {% if backend_output | regex_search('AttachVolume\\.Attach failed|not ready for workloads|MountVolume\\.(MountDevice|SetUp) failed') %}
          The platform PostgreSQL PVC is blocked by a Longhorn attach/volume
          readiness problem. PostgreSQL init cannot start until the Longhorn
          volume backing platform-databases/platform-postgres-1 is healthy.

          Run the focused Longhorn runtime repair, then rerun Woodpecker:

          make platform-longhorn-runtime-repair
          make platform-woodpecker-repair

          The active primary PVC is never reset automatically. Only a failed
          initializing replica whose Longhorn volume is detached and contains
          zero bytes is eligible for automatic cleanup.

          {% endif %}
          {% if backend_output | regex_search('ReplicaSchedulingFailure|insufficient storage|disks are unavailable') %}
          Longhorn cannot schedule enough replicas for the platform PostgreSQL
          volume. In this deployment the platform-postgres PVC is 50Gi on the
          longhorn-critical StorageClass, so three Longhorn replicas need
          schedulable disk capacity on the RKE2 nodes.

          Fix Longhorn capacity/disk scheduling first:

          make platform-longhorn-bootstrap

          Then check the Longhorn node disk state:

          ansible -i inventory/hosts.local.ini rke2_servers -b -m shell -a 'df -h /var/lib/longhorn || df -h /'

          After Longhorn has enough schedulable free space, rerun:

          make platform-woodpecker-repair

          If this is still an empty first deployment and CloudNativePG now says
          platform-postgres is unrecoverable, reset only the empty
          platform-postgres PVC/PV/Longhorn volume after fixing capacity. Do
          not reset it if it ever contained real database data.

          {% endif %}
          Woodpecker is configured for PostgreSQL, but the required
          platform PostgreSQL backend is not ready.

          Woodpecker cannot start until this Kubernetes service has ready
          endpoints:
          - platform-databases/platform-postgres-rw

          Backend check output:
          {{ platform_woodpecker_postgres_backend_check.stdout | default('not run') }}

          Backend re-check output:
          {{ (platform_woodpecker_postgres_backend_recheck | default({})).stdout | default('not run') }}

          Usual recovery:
          1. Sync the private GitOps source that Argo CD reads.
          2. Ensure the platform-postgres Argo CD Application exists and is Synced.
          3. Rerun:
             make platform-woodpecker-repair

          If the platform-postgres Application is absent, rerun the Argo CD
          application registration with your PLATFORM_REPO_URL and
          PLATFORM_APPLY_GITOPS=true before rerunning this repair.
      run_once: true
      when: >
        platform_woodpecker_postgres_backend_check.rc | int != 0 and
        ((platform_woodpecker_postgres_backend_recheck | default({})).rc | default(1) | int != 0)

    - name: Verify PostgreSQL service path from the Woodpecker server node
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        CHECK_ID="$(date +%s)-$$"
        CHECK_NAME="platform-woodpecker-postgres-check-${CHECK_ID}"
        CHECK_IMAGE="{{ platform_woodpecker_repair_check_image_effective }}"
        TIMEOUT={{ platform_woodpecker_repair_timeout_effective }}
        AUTO_SERVICE_PATH_REPAIR="{{ platform_woodpecker_repair_auto_service_path_effective | ternary('true', 'false') }}"
        SERVICE_PATH_ROLLOUT_TIMEOUT={{ platform_woodpecker_repair_service_path_rollout_timeout_effective }}
        SERVICE_PATH_CONVERGENCE_TIMEOUT={{ platform_woodpecker_repair_service_path_convergence_timeout_effective }}

        workload=""
        for candidate in statefulset/woodpecker-server deployment/woodpecker-server; do
          if "$K" --kubeconfig "$C" -n woodpecker get "${candidate}" >/dev/null 2>&1; then
            workload="${candidate}"
            break
          fi
        done
        if [ -z "${workload}" ]; then
          echo "woodpecker_server_workload=absent postgres_service_path_check=skipped"
          exit 0
        fi
        driver="$("$K" --kubeconfig "$C" -n woodpecker get "${workload}" \
          -o jsonpath='{range .spec.template.spec.containers[*].env[?(@.name=="WOODPECKER_DATABASE_DRIVER")]}{.value}{"\n"}{end}' 2>/dev/null |
          tail -n 1 || true)"
        case "${driver}" in
          postgres|postgresql) ;;
          *)
            echo "woodpecker_database_driver=${driver:-unset} postgres_service_path_check=skipped"
            exit 0
            ;;
        esac

        server_node="$("$K" --kubeconfig "$C" -n woodpecker get pods \
          -l app.kubernetes.io/name=server \
          -o jsonpath='{range .items[*]}{.spec.nodeName}{"\n"}{end}' 2>/dev/null |
          awk 'NF { print; exit }')"
        if [ -z "${server_node}" ]; then
          server_node="$("$K" --kubeconfig "$C" -n woodpecker get pods \
            -o jsonpath='{range .items[?(@.metadata.name=="woodpecker-server-0")]}{.spec.nodeName}{"\n"}{end}' 2>/dev/null || true)"
        fi

        service_ip="$("$K" --kubeconfig "$C" -n platform-databases get \
          service/platform-postgres-rw -o jsonpath='{.spec.clusterIP}')"
        internal_policy="$("$K" --kubeconfig "$C" -n platform-databases get \
          service/platform-postgres-rw -o jsonpath='{.spec.internalTrafficPolicy}' 2>/dev/null || true)"
        endpoint_records="$(
          "$K" --kubeconfig "$C" -n platform-databases get endpointslice \
            -l kubernetes.io/service-name=platform-postgres-rw -o json 2>/dev/null |
            python3 -c '
        import json
        import sys

        document = json.load(sys.stdin)
        for item in document.get("items", []):
            for endpoint in item.get("endpoints", []):
                if endpoint.get("conditions", {}).get("ready") is False:
                    continue
                node = endpoint.get("nodeName", "")
                for address in endpoint.get("addresses", []):
                    print(f"{address}|{node}")
        ' 2>/dev/null || true
        )"
        endpoint_ips="$(printf '%s\n' "${endpoint_records}" |
          awk -F'|' 'NF && $1 != "" { print $1 }' |
          sort -u |
          xargs || true)"
        endpoint_nodes="$(printf '%s\n' "${endpoint_records}" |
          awk -F'|' 'NF >= 2 && $2 != "" { print $2 }' |
          sort -u |
          xargs || true)"
        repair_nodes="$(printf '%s\n%s\n' "${server_node}" "${endpoint_nodes}" |
          xargs -n1 2>/dev/null |
          awk 'NF' |
          sort -u |
          xargs || true)"
        echo "woodpecker_server_node=${server_node:-unscheduled}"
        echo "postgres_service_ip=${service_ip:-missing} internal_traffic_policy=${internal_policy:-Cluster}"
        echo "postgres_ready_endpoint_ips=${endpoint_ips:-none}"
        echo "postgres_ready_endpoint_records=$(printf '%s' "${endpoint_records:-none}" | tr '\n' ' ')"
        echo "postgres_service_path_repair_nodes=${repair_nodes:-none}"
        if [ "${internal_policy:-Cluster}" = "Local" ]; then
          "$K" --kubeconfig "$C" -n platform-databases patch \
            service/platform-postgres-rw --type merge \
            -p '{"spec":{"internalTrafficPolicy":"Cluster"}}'
          echo "result=repaired reason=postgres-service-internal-traffic-policy value=Cluster"
        fi

        component_rows_on_node() {
          component="$1"
          selector="$2"
          node="$3"
          if [ "${component}" = "kube-proxy" ]; then
            "$K" --kubeconfig "$C" -n kube-system get pods \
              --field-selector "spec.nodeName=${node}" \
              -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.metadata.deletionTimestamp}{"|"}{.status.phase}{"|"}{range .status.containerStatuses[*]}{.ready}{" "}{end}{"\n"}{end}' \
              2>/dev/null |
              awk -F'|' '$1 ~ /^(rke2-)?kube-proxy-/ { print }'
          else
            "$K" --kubeconfig "$C" -n kube-system get pods \
              -l "${selector}" \
              --field-selector "spec.nodeName=${node}" \
              -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.metadata.deletionTimestamp}{"|"}{.status.phase}{"|"}{range .status.containerStatuses[*]}{.ready}{" "}{end}{"\n"}{end}' \
              2>/dev/null
          fi
        }

        component_pods_on_node() {
          component="$1"
          selector="$2"
          node="$3"
          if [ "${component}" = "kube-proxy" ]; then
            "$K" --kubeconfig "$C" -n kube-system get pods \
              --field-selector "spec.nodeName=${node}" \
              -o name 2>/dev/null |
              grep -E '^pod/(rke2-)?kube-proxy-' || true
          else
            "$K" --kubeconfig "$C" -n kube-system get pods \
              -l "${selector}" \
              --field-selector "spec.nodeName=${node}" \
              -o name 2>/dev/null || true
          fi
        }

        component_ready_on_node() {
          component="$1"
          selector="$2"
          node="$3"
          component_rows_on_node "${component}" "${selector}" "${node}" |
            awk -F'|' '
              $1 != "" && ($2 == "" || $2 == "<no value>") && $3 == "Running" {
                count = split($4, statuses, " ")
                seen = 0
                ready = 1
                for (i = 1; i <= count; i++) {
                  if (statuses[i] == "") continue
                  seen = 1
                  if (statuses[i] != "true") ready = 0
                }
                if (seen && ready) ready_pods++
              }
              END { exit(ready_pods > 0 ? 0 : 1) }
            '
        }

        refresh_node_component() {
          component="$1"
          selector="$2"
          for node in ${repair_nodes}; do
            pods="$(component_pods_on_node "${component}" "${selector}" "${node}")"
            if [ -z "${pods}" ]; then
              echo "service_path_component=${component} node=${node} action=skip reason=no-matching-pod"
              continue
            fi
            echo "service_path_component=${component} node=${node} action=refresh pods=$(printf '%s' "${pods}" | tr '\n' ' ')"
            # Resource names contain no shell whitespace; expansion intentionally
            # sends each selected pod as a separate kubectl argument.
            "$K" --kubeconfig "$C" --request-timeout=20s -n kube-system \
              delete ${pods} --ignore-not-found=true --wait=false || true
            component_deadline=$(( $(date +%s) + SERVICE_PATH_ROLLOUT_TIMEOUT ))
            while [ "$(date +%s)" -lt "${component_deadline}" ]; do
              if component_ready_on_node "${component}" "${selector}" "${node}"; then
                echo "service_path_component=${component} node=${node} state=ready"
                break
              fi
              sleep 3
            done
            if ! component_ready_on_node "${component}" "${selector}" "${node}"; then
              echo "service_path_component=${component} node=${node} state=rollout-timeout"
            fi
          done
        }

        refresh_cilium_operator() {
          operator="$("$K" --kubeconfig "$C" -n kube-system get deployment -o name 2>/dev/null |
            grep -E '^deployment\.apps/(rke2-)?cilium-operator$' |
            head -n 1 || true)"
          if [ -z "${operator}" ]; then
            echo "service_path_component=cilium-operator action=skip reason=no-matching-deployment"
            return 0
          fi
          echo "service_path_component=cilium-operator action=refresh workload=${operator}"
          "$K" --kubeconfig "$C" -n kube-system rollout restart "${operator}" || true
          if "$K" --kubeconfig "$C" -n kube-system rollout status "${operator}" \
            --timeout="${SERVICE_PATH_ROLLOUT_TIMEOUT}s"; then
            echo "service_path_component=cilium-operator state=ready"
          else
            echo "service_path_component=cilium-operator state=rollout-timeout"
          fi
        }

        collect_cilium_service_path_state() {
          echo "===== Cilium cross-node service-path diagnostics ====="
          for node in ${repair_nodes}; do
            cilium_pod="$($K --kubeconfig "$C" -n kube-system get pods \
              -l k8s-app=cilium --field-selector "spec.nodeName=${node}" \
              -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
            echo "----- cilium node=${node} pod=${cilium_pod:-absent} -----"
            if [ -z "${cilium_pod}" ]; then
              continue
            fi
            "$K" --kubeconfig "$C" -n kube-system exec "pod/${cilium_pod}" -- \
              cilium-dbg status --verbose 2>&1 | sed -n '1,120p' || true
            "$K" --kubeconfig "$C" -n kube-system exec "pod/${cilium_pod}" -- \
              cilium-health status --verbose 2>&1 | sed -n '1,160p' || true
            "$K" --kubeconfig "$C" -n kube-system exec "pod/${cilium_pod}" -- \
              cilium-dbg node list 2>&1 | sed -n '1,120p' || true
            "$K" --kubeconfig "$C" -n kube-system exec "pod/${cilium_pod}" -- \
              cilium-dbg bpf tunnel list 2>&1 | sed -n '1,120p' || true
          done
          echo "===== Network policies selecting the probe or database namespaces ====="
          "$K" --kubeconfig "$C" get networkpolicy -A \
            -o custom-columns='NAMESPACE:.metadata.namespace,NAME:.metadata.name' \
            --no-headers 2>/dev/null |
            awk '$1 == "woodpecker" || $1 == "platform-databases"' || true
          "$K" --kubeconfig "$C" get ciliumnetworkpolicy -A \
            -o custom-columns='NAMESPACE:.metadata.namespace,NAME:.metadata.name' \
            --no-headers 2>/dev/null |
            awk '$1 == "woodpecker" || $1 == "platform-databases"' || true
          "$K" --kubeconfig "$C" get ciliumclusterwidenetworkpolicy -o name 2>/dev/null || true
        }

        repair_postgres_service_path() {
          echo "automatic_postgres_service_path_repair=started nodes=${repair_nodes:-none}"
          if [ -z "${repair_nodes}" ]; then
            echo "automatic_postgres_service_path_repair=skipped reason=no-affected-nodes"
            return 0
          fi
          refresh_cilium_operator
          refresh_node_component kube-proxy k8s-app=kube-proxy
          refresh_node_component cilium k8s-app=cilium
          echo "service_path_component_settle_seconds=15"
          sleep 15
          echo "result=repaired reason=woodpecker-postgres-service-path-components-refreshed nodes=${repair_nodes}"
        }

        "$K" --kubeconfig "$C" -n woodpecker delete pod \
          -l platform.gitops/check=woodpecker-postgres \
          --ignore-not-found=true --wait=false >/dev/null 2>&1 || true
        node_line=""
        if [ -n "${server_node}" ]; then
          node_line="  nodeName: ${server_node}"
        fi
        manifest="$(mktemp)"
        cat >"${manifest}" <<YAML
        apiVersion: v1
        kind: Pod
        metadata:
          name: ${CHECK_NAME}
          namespace: woodpecker
          labels:
            platform.gitops/check: woodpecker-postgres
        spec:
        ${node_line}
          restartPolicy: Never
          tolerations:
            - operator: Exists
          containers:
            - name: check
              image: ${CHECK_IMAGE}
              imagePullPolicy: IfNotPresent
              env:
                - name: SERVICE_IP
                  value: "${service_ip}"
                - name: ENDPOINT_IPS
                  value: "${endpoint_ips}"
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  host=platform-postgres-rw.platform-databases.svc.cluster.local
                  port=5432
                  probe_tcp() {
                    label="\$1"
                    target="\$2"
                    tool=none
                    rc=127
                    : >/tmp/platform-postgres-probe-error
                    if command -v bash >/dev/null 2>&1 && command -v timeout >/dev/null 2>&1; then
                      tool=bash-dev-tcp
                      if timeout 5 bash -c 'exec 3<>/dev/tcp/\$1/\$2' _ \
                        "\${target}" "\${port}" 2>/tmp/platform-postgres-probe-error; then
                        rc=0
                      else
                        rc=\$?
                      fi
                    elif command -v nc >/dev/null 2>&1; then
                      tool=netcat
                      if nc -z -v -w 5 "\${target}" "\${port}" \
                        2>/tmp/platform-postgres-probe-error; then
                        rc=0
                      else
                        rc=\$?
                      fi
                    elif command -v curl >/dev/null 2>&1; then
                      tool=curl-connect-only
                      if curl --connect-only --silent --show-error \
                        --connect-timeout 5 --max-time 5 \
                        "telnet://\${target}:\${port}" \
                        2>/tmp/platform-postgres-probe-error; then
                        rc=0
                      else
                        rc=\$?
                      fi
                    fi
                    detail="\$(tr '\n' ' ' </tmp/platform-postgres-probe-error 2>/dev/null || true)"
                    echo "probe=\${label} target=\${target}:\${port} tool=\${tool} rc=\${rc} detail=\${detail:-none}"
                    return "\${rc}"
                  }

                  echo "===== PostgreSQL probe resolver ====="
                  cat /etc/resolv.conf || true
                  if command -v getent >/dev/null 2>&1; then
                    getent hosts "\${host}" || true
                  elif command -v nslookup >/dev/null 2>&1; then
                    nslookup "\${host}" || true
                  fi

                  dns_service_ok=false
                  cluster_ip_ok=false
                  endpoint_ok=false
                  if probe_tcp service-dns "\${host}"; then
                    dns_service_ok=true
                  fi
                  if [ -n "\${SERVICE_IP:-}" ] && probe_tcp service-cluster-ip "\${SERVICE_IP}"; then
                    cluster_ip_ok=true
                  fi
                  for endpoint in \${ENDPOINT_IPS:-}; do
                    if probe_tcp direct-endpoint "\${endpoint}"; then
                      endpoint_ok=true
                    fi
                  done

                  if [ "\${dns_service_ok}" = "true" ]; then
                    echo "result=ok target=platform-databases/platform-postgres-rw:5432"
                    exit 0
                  fi
                  if [ "\${cluster_ip_ok}" = "true" ]; then
                    echo "result=fail reason=postgres-service-dns-unreachable"
                  elif [ "\${endpoint_ok}" = "true" ]; then
                    echo "result=fail reason=postgres-clusterip-service-path-unreachable"
                  elif ! command -v bash >/dev/null 2>&1 &&
                    ! command -v nc >/dev/null 2>&1 &&
                    ! command -v curl >/dev/null 2>&1; then
                    echo "result=fail reason=postgres-probe-tool-unavailable"
                  else
                    echo "result=fail reason=postgres-endpoint-path-unreachable"
                  fi
                  exit 1
        YAML
        max_attempts=1
        convergence_retry_interval_seconds=15
        if [ "${AUTO_SERVICE_PATH_REPAIR}" = "true" ]; then
          convergence_attempts=$(( (
            SERVICE_PATH_CONVERGENCE_TIMEOUT +
            convergence_retry_interval_seconds - 1
          ) / convergence_retry_interval_seconds ))
          if [ "${convergence_attempts}" -lt 1 ]; then
            convergence_attempts=1
          fi
          max_attempts=$(( 1 + convergence_attempts ))
        fi
        echo "postgres_service_path_convergence_timeout=${SERVICE_PATH_CONVERGENCE_TIMEOUT}s max_attempts=${max_attempts}"
        attempt=1
        result=1
        service_path_repair_started=false
        service_path_repair_started_at=0
        service_path_repair_deadline=0
        while [ "${attempt}" -le "${max_attempts}" ]; do
          echo "postgres_service_path_probe_attempt=${attempt}/${max_attempts}"
          if ! create_output="$("$K" --kubeconfig "$C" create -f "${manifest}" 2>&1)"; then
            printf '%s\n' "${create_output}"
            rm -f "${manifest}"
            echo "result=fail reason=woodpecker-postgres-check-pod-create-failed node=${server_node:-unscheduled}"
            exit 1
          fi
          printf '%s\n' "${create_output}"

          deadline=$(( $(date +%s) + TIMEOUT ))
          result=1
          while [ "$(date +%s)" -lt "${deadline}" ]; do
            phase="$("$K" --kubeconfig "$C" -n woodpecker get "pod/${CHECK_NAME}" \
              -o jsonpath='{.status.phase}' 2>/dev/null || true)"
            case "${phase}" in
              Succeeded) result=0; break ;;
              Failed) break ;;
            esac
            sleep 3
          done
          probe_output="$("$K" --kubeconfig "$C" -n woodpecker logs "pod/${CHECK_NAME}" 2>&1 || true)"
          printf '%s\n' "${probe_output}"
          if [ "${result}" -eq 0 ]; then
            "$K" --kubeconfig "$C" -n woodpecker delete "pod/${CHECK_NAME}" \
              --ignore-not-found=true --wait=false >/dev/null 2>&1 || true
            rm -f "${manifest}"
            exit 0
          fi

          echo "result=fail reason=woodpecker-to-postgres-service-path-unreachable node=${server_node:-unscheduled} attempt=${attempt}"
          "$K" --kubeconfig "$C" -n woodpecker describe "pod/${CHECK_NAME}" 2>&1 |
            sed -n '/Events:/,$p' || true
          "$K" --kubeconfig "$C" -n woodpecker delete "pod/${CHECK_NAME}" \
            --ignore-not-found=true --wait=true --timeout=30s >/dev/null 2>&1 ||
            "$K" --kubeconfig "$C" -n woodpecker delete "pod/${CHECK_NAME}" \
              --ignore-not-found=true --wait=false >/dev/null 2>&1 || true

          if [ "${attempt}" -ge "${max_attempts}" ]; then
            break
          fi
          if ! printf '%s\n' "${probe_output}" |
            grep -Eq 'reason=postgres-(clusterip-service-path|endpoint-path)-unreachable'; then
            echo "automatic_postgres_service_path_repair=skipped reason=non-network-probe-failure"
            break
          fi

          if [ "${service_path_repair_started}" != "true" ]; then
            repair_postgres_service_path
            service_path_repair_started=true
            service_path_repair_started_at="$(date +%s)"
            service_path_repair_deadline=$(( service_path_repair_started_at + SERVICE_PATH_CONVERGENCE_TIMEOUT ))
          else
            convergence_elapsed=$(( $(date +%s) - service_path_repair_started_at ))
            echo "automatic_postgres_service_path_repair=converging elapsed=${convergence_elapsed}s timeout=${SERVICE_PATH_CONVERGENCE_TIMEOUT}s"
          fi
          convergence_remaining=$(( service_path_repair_deadline - $(date +%s) ))
          if [ "${convergence_remaining}" -le 0 ]; then
            echo "automatic_postgres_service_path_repair=expired timeout=${SERVICE_PATH_CONVERGENCE_TIMEOUT}s"
            break
          fi
          convergence_sleep="${convergence_retry_interval_seconds}"
          if [ "${convergence_remaining}" -lt "${convergence_sleep}" ]; then
            convergence_sleep="${convergence_remaining}"
          fi
          attempt=$(( attempt + 1 ))
          sleep "${convergence_sleep}"
        done
        if [ "${result}" -ne 0 ]; then
          collect_cilium_service_path_state
        fi
        rm -f "${manifest}"
        exit "${result}"
      args:
        executable: /bin/bash
      register: platform_woodpecker_postgres_service_path_check
      changed_when: >-
        ('result=repaired reason=postgres-service-internal-traffic-policy'
        in platform_woodpecker_postgres_service_path_check.stdout) or
        ('result=repaired reason=woodpecker-postgres-service-path-components-refreshed'
        in platform_woodpecker_postgres_service_path_check.stdout)
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Stop when Woodpecker PostgreSQL service-path preflight fails
      ansible.builtin.fail:
        msg: |
          Woodpecker's PostgreSQL Service has ready endpoints, but the
          in-cluster preflight did not complete successfully. The output now
          distinguishes a check-pod admission/create failure from a real
          PostgreSQL service-path failure.

          The repair first normalizes internalTrafficPolicy, discovers ready
          EndpointSlice addresses, and then runs the probe from the Woodpecker
          server node. For ClusterIP or direct endpoint timeouts it refreshes
          kube-proxy and Cilium only on the affected source/endpoint nodes,
          waits for replacements, and repeatedly probes the real DNS,
          ClusterIP, and direct endpoint paths during the bounded Cilium
          convergence window. All attempts are shown below:

          {{ platform_woodpecker_postgres_service_path_check.stdout | default('not run') }}

          stderr:
          {{ platform_woodpecker_postgres_service_path_check.stderr | default('none') }}

          Probe classifications:
          - postgres-service-dns-unreachable: DNS name failed but ClusterIP worked.
          - postgres-clusterip-service-path-unreachable: direct endpoint worked
            but the Kubernetes Service path failed.
          - postgres-endpoint-path-unreachable: the direct pod endpoint also failed.
          - postgres-probe-tool-unavailable: the configured check image has no
            supported bounded TCP probe.

          A failure here is therefore the post-repair result. Inspect the
          component rollout lines and direct-endpoint result above before
          changing database credentials or application configuration. Set
          PLATFORM_WOODPECKER_REPAIR_AUTO_SERVICE_PATH=false only when you
          intentionally want a diagnostic-only run. Adjust the bounded
          convergence window with
          PLATFORM_WOODPECKER_REPAIR_SERVICE_PATH_CONVERGENCE_TIMEOUT.
      when: platform_woodpecker_postgres_service_path_check.rc | int != 0
      run_once: true

    - name: Reconcile and verify Woodpecker PostgreSQL role credentials
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml

        workload=""
        for candidate in statefulset/woodpecker-server deployment/woodpecker-server; do
          if "$K" --kubeconfig "$C" -n woodpecker get "${candidate}" >/dev/null 2>&1; then
            workload="${candidate}"
            break
          fi
        done
        [ -n "${workload}" ] || exit 0
        driver="$("$K" --kubeconfig "$C" -n woodpecker get "${workload}" \
          -o jsonpath='{range .spec.template.spec.containers[*].env[?(@.name=="WOODPECKER_DATABASE_DRIVER")]}{.value}{"\n"}{end}' 2>/dev/null |
          tail -n 1 || true)"
        case "${driver}" in postgres|postgresql) ;; *) exit 0 ;; esac

        username="$("$K" --kubeconfig "$C" -n platform-databases get secret/woodpecker-database \
          -o jsonpath='{.data.username}' | base64 -d)"
        password="$("$K" --kubeconfig "$C" -n platform-databases get secret/woodpecker-database \
          -o jsonpath='{.data.password}' | base64 -d)"

        verify_login() {
          primary="$("$K" --kubeconfig "$C" -n platform-databases get pods \
            -l cnpg.io/cluster=platform-postgres,cnpg.io/instanceRole=primary \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null |
            head -n 1)"
          [ -n "${primary}" ] || return 1
          printf '%s\n' "${password}" |
            "$K" --kubeconfig "$C" -n platform-databases exec -i "pod/${primary}" -- \
              sh -ceu 'IFS= read -r PGPASSWORD; export PGPASSWORD; exec psql -h 127.0.0.1 -U "$1" -d woodpecker -qAt -c "select 1"' sh "${username}" |
            grep -qx '1'
        }

        if verify_login; then
          exit 0
        fi

        if "$K" --kubeconfig "$C" -n cnpg-system get deployment/cloudnative-pg >/dev/null 2>&1; then
          "$K" --kubeconfig "$C" -n cnpg-system rollout restart deployment/cloudnative-pg >/dev/null
          "$K" --kubeconfig "$C" -n cnpg-system rollout status deployment/cloudnative-pg --timeout=180s >/dev/null
        fi
        if "$K" --kubeconfig "$C" -n argocd get application/platform-postgres >/dev/null 2>&1; then
          "$K" --kubeconfig "$C" -n argocd annotate application/platform-postgres \
            argocd.argoproj.io/refresh=hard --overwrite >/dev/null
        fi
        for _ in $(seq 1 24); do
          if verify_login; then
            exit 0
          fi
          sleep 5
        done
        exit 1
      args:
        executable: /bin/bash
      register: platform_woodpecker_postgres_credentials_check
      changed_when: false
      failed_when: false
      no_log: true
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Stop when Woodpecker PostgreSQL credentials are not usable
      ansible.builtin.fail:
        msg: |
          The Woodpecker database Secret exists and PostgreSQL is reachable,
          but the managed `woodpecker` role cannot log in to database
          `woodpecker`. The repair restarted CloudNativePG and allowed it to
          reconcile the managed role, but the credential test still failed.

          Do not expose the Secret values. Inspect the CloudNativePG operator
          and Cluster conditions, then rerun `make platform-app-secrets` and
          `make platform-woodpecker-repair`.
      when: platform_woodpecker_postgres_credentials_check.rc | int != 0
      run_once: true

    - name: Recycle only zero-byte failed Woodpecker server replica PVCs
      ansible.builtin.shell: |
        set -u
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        TIMEOUT={{ platform_woodpecker_repair_timeout_effective }}
        ALLOW_RESET="{{ 'true' if platform_woodpecker_repair_reset_failed_server_replica_pvcs_effective else 'false' }}"
        STS=woodpecker-server

        if ! "$K" --kubeconfig "$C" -n woodpecker get "statefulset/${STS}" >/dev/null 2>&1; then
          echo "woodpecker_server_replica_pvc_repair=skipped reason=statefulset-absent"
          exit 0
        fi
        if ! "$K" --kubeconfig "$C" get crd/volumes.longhorn.io >/dev/null 2>&1; then
          echo "woodpecker_server_replica_pvc_repair=skipped reason=longhorn-volume-crd-absent"
          exit 0
        fi

        candidates="$(mktemp)"
        scaled=false
        argocd_reconcile_paused=false
        argocd_skip_reconcile_previous=""
        desired="$("$K" --kubeconfig "$C" -n woodpecker get "statefulset/${STS}" \
          -o jsonpath='{.spec.replicas}' 2>/dev/null || echo 1)"
        case "${desired}" in ""|*[!0-9]*) desired=1 ;; esac

        resume_argocd_reconcile() {
          if [ "${argocd_reconcile_paused}" != "true" ]; then
            return
          fi
          if [ -n "${argocd_skip_reconcile_previous}" ]; then
            "$K" --kubeconfig "$C" -n argocd annotate application/woodpecker \
              argocd.argoproj.io/skip-reconcile="${argocd_skip_reconcile_previous}" \
              --overwrite >/dev/null 2>&1 || true
          else
            "$K" --kubeconfig "$C" -n argocd annotate application/woodpecker \
              argocd.argoproj.io/skip-reconcile- >/dev/null 2>&1 || true
          fi
          echo "woodpecker_argocd_reconcile action=resume previous=${argocd_skip_reconcile_previous:-absent}"
          argocd_reconcile_paused=false
        }
        restore_replicas() {
          if [ "${scaled}" = "true" ]; then
            "$K" --kubeconfig "$C" -n woodpecker scale "statefulset/${STS}" \
              --replicas="${desired}" >/dev/null 2>&1 || true
          fi
        }
        cleanup() {
          restore_replicas
          resume_argocd_reconcile
          rm -f "${candidates}"
        }
        trap cleanup EXIT

        for pod_object in $("$K" --kubeconfig "$C" -n woodpecker get pod -o name 2>/dev/null |
          grep -E '^pod/woodpecker-server-[1-9][0-9]*$' || true); do
          pod="${pod_object#pod/}"
          ordinal="${pod##*-}"
          phase="$("$K" --kubeconfig "$C" -n woodpecker get "${pod_object}" \
            -o jsonpath='{.status.phase}' 2>/dev/null || true)"
          ready="$("$K" --kubeconfig "$C" -n woodpecker get "${pod_object}" \
            -o jsonpath='{range .status.containerStatuses[*]}{.ready}{"\n"}{end}' 2>/dev/null |
            grep -c '^true$' || true)"
          restarts="$("$K" --kubeconfig "$C" -n woodpecker get "${pod_object}" \
            -o jsonpath='{range .status.containerStatuses[*]}{.restartCount}{"\n"}{end}' 2>/dev/null |
            awk '{ total += $1 } END { print total + 0 }')"
          if [ "${phase}" = "Running" ] && [ "${ready}" -gt 0 ]; then
            continue
          fi

          events="$("$K" --kubeconfig "$C" -n woodpecker describe "${pod_object}" 2>/dev/null |
            sed -n '/Events:/,$p' || true)"
          if ! printf '%s\n' "${events}" |
            grep -Eq 'AttachVolume\.Attach failed.*volume .*not ready for workloads|AttachVolume\.Attach failed.*volume .*is not ready for workloads'; then
            continue
          fi

          pvc="$("$K" --kubeconfig "$C" -n woodpecker get "${pod_object}" \
            -o jsonpath='{.spec.volumes[?(@.name=="data")].persistentVolumeClaim.claimName}' 2>/dev/null || true)"
          expected_pvc="data-woodpecker-server-${ordinal}"
          if [ "${pvc}" != "${expected_pvc}" ]; then
            echo "result=fail reason=woodpecker-server-replica-volume-not-ready pod=${pod} action=retain detail=unexpected-pvc pvc=${pvc:-absent}"
            continue
          fi

          pvc_uid="$("$K" --kubeconfig "$C" -n woodpecker get "pvc/${pvc}" \
            -o jsonpath='{.metadata.uid}' 2>/dev/null || true)"
          pvc_phase="$("$K" --kubeconfig "$C" -n woodpecker get "pvc/${pvc}" \
            -o jsonpath='{.status.phase}' 2>/dev/null || true)"
          pvc_deleting="$("$K" --kubeconfig "$C" -n woodpecker get "pvc/${pvc}" \
            -o jsonpath='{.metadata.deletionTimestamp}' 2>/dev/null || true)"
          pv="$("$K" --kubeconfig "$C" -n woodpecker get "pvc/${pvc}" \
            -o jsonpath='{.spec.volumeName}' 2>/dev/null || true)"
          driver="$("$K" --kubeconfig "$C" get "pv/${pv}" \
            -o jsonpath='{.spec.csi.driver}' 2>/dev/null || true)"
          handle="$("$K" --kubeconfig "$C" get "pv/${pv}" \
            -o jsonpath='{.spec.csi.volumeHandle}' 2>/dev/null || true)"
          actual_size="$("$K" --kubeconfig "$C" -n longhorn-system get "volumes.longhorn.io/${handle}" \
            -o jsonpath='{.status.actualSize}' 2>/dev/null || true)"
          volume_state="$("$K" --kubeconfig "$C" -n longhorn-system get "volumes.longhorn.io/${handle}" \
            -o jsonpath='{.status.state}' 2>/dev/null || true)"
          volume_robustness="$("$K" --kubeconfig "$C" -n longhorn-system get "volumes.longhorn.io/${handle}" \
            -o jsonpath='{.status.robustness}' 2>/dev/null || true)"
          volume_pvc="$("$K" --kubeconfig "$C" -n longhorn-system get "volumes.longhorn.io/${handle}" \
            -o jsonpath='{.status.kubernetesStatus.pvcName}' 2>/dev/null || true)"
          volume_namespace="$("$K" --kubeconfig "$C" -n longhorn-system get "volumes.longhorn.io/${handle}" \
            -o jsonpath='{.status.kubernetesStatus.namespace}' 2>/dev/null || true)"

          echo "woodpecker_server_replica_volume pod=${pod} ordinal=${ordinal} pvc=${pvc} uid=${pvc_uid:-absent} phase=${pvc_phase:-absent} pv=${pv:-absent} longhornVolume=${handle:-absent} actualSize=${actual_size:-unknown} state=${volume_state:-unknown} robustness=${volume_robustness:-unknown} restarts=${restarts}"

          if [ "${ALLOW_RESET}" != "true" ]; then
            echo "result=fail reason=woodpecker-server-replica-volume-not-ready pod=${pod} action=retain detail=automatic-reset-disabled"
            continue
          fi
          if [ -z "${pvc_uid}" ] || [ "${pvc_phase}" != "Bound" ] || [ -n "${pvc_deleting}" ] ||
            [ "${driver}" != "driver.longhorn.io" ] || [ -z "${handle}" ]; then
            echo "result=fail reason=woodpecker-server-replica-volume-not-ready pod=${pod} action=retain detail=pvc-contract-not-safe"
            continue
          fi
          if [ "${actual_size}" != "0" ]; then
            echo "result=fail reason=woodpecker-server-replica-volume-not-ready pod=${pod} action=retain detail=replica-volume-has-data actualSize=${actual_size:-unknown}"
            continue
          fi
          case "${volume_state}" in
            ""|detached|faulted|unknown) ;;
            *)
              echo "result=fail reason=woodpecker-server-replica-volume-not-ready pod=${pod} action=retain detail=replica-volume-not-detached state=${volume_state}"
              continue
              ;;
          esac
          if [ "${restarts}" -ne 0 ]; then
            echo "result=fail reason=woodpecker-server-replica-volume-not-ready pod=${pod} action=retain detail=container-has-started restarts=${restarts}"
            continue
          fi
          if [ -n "${volume_pvc}" ] && [ "${volume_pvc}" != "${pvc}" ]; then
            echo "result=fail reason=woodpecker-server-replica-volume-not-ready pod=${pod} action=retain detail=longhorn-pvc-mismatch"
            continue
          fi
          if [ -n "${volume_namespace}" ] && [ "${volume_namespace}" != "woodpecker" ]; then
            echo "result=fail reason=woodpecker-server-replica-volume-not-ready pod=${pod} action=retain detail=longhorn-namespace-mismatch"
            continue
          fi
          printf '%s|%s|%s|%s|%s|%s\n' \
            "${ordinal}" "${pod}" "${pvc}" "${pvc_uid}" "${pv}" "${handle}" >> "${candidates}"
        done

        if [ ! -s "${candidates}" ]; then
          echo "woodpecker_server_replica_pvc_repair=unchanged"
          exit 0
        fi

        min_ordinal="$(cut -d'|' -f1 "${candidates}" | sort -n | head -n 1)"
        if "$K" --kubeconfig "$C" -n argocd get application/woodpecker >/dev/null 2>&1; then
          argocd_skip_reconcile_previous="$("$K" --kubeconfig "$C" -n argocd \
            get application/woodpecker \
            -o jsonpath='{.metadata.annotations.argocd\.argoproj\.io/skip-reconcile}' \
            2>/dev/null || true)"
          if ! "$K" --kubeconfig "$C" -n argocd annotate application/woodpecker \
            argocd.argoproj.io/skip-reconcile=true --overwrite >/dev/null; then
            echo "result=fail reason=woodpecker-server-replica-volume-not-ready action=retain detail=argocd-reconcile-pause-failed"
            exit 1
          fi
          argocd_reconcile_paused=true
          echo "woodpecker_argocd_reconcile action=pause-for-empty-replica-repair previous=${argocd_skip_reconcile_previous:-absent}"
          sleep 3
        fi

        if [ "${desired}" -gt "${min_ordinal}" ]; then
          echo "woodpecker_server_statefulset=${STS} action=scale-down-for-empty-replica-repair replicas=${min_ordinal} restore=${desired}"
          "$K" --kubeconfig "$C" -n woodpecker scale "statefulset/${STS}" --replicas="${min_ordinal}"
          scaled=true
        fi

        delete_deadline=$(( $(date +%s) + 90 ))
        while [ "$(date +%s)" -lt "${delete_deadline}" ]; do
          current_replicas="$("$K" --kubeconfig "$C" -n woodpecker get "statefulset/${STS}" \
            -o jsonpath='{.spec.replicas}' 2>/dev/null || true)"
          case "${current_replicas}" in
            ""|*[!0-9]*) ;;
            *)
              if [ "${current_replicas}" -gt "${min_ordinal}" ]; then
                echo "woodpecker_server_statefulset=${STS} action=reassert-scale-down replicas=${min_ordinal} observed=${current_replicas}"
                "$K" --kubeconfig "$C" -n woodpecker scale "statefulset/${STS}" \
                  --replicas="${min_ordinal}" >/dev/null 2>&1 || true
              fi
              ;;
          esac
          remaining="$("$K" --kubeconfig "$C" -n woodpecker get pod -o name 2>/dev/null |
            awk -F- -v minimum="${min_ordinal}" '/^pod\/woodpecker-server-[0-9]+$/ { if (($NF + 0) >= minimum) print }')"
          [ -z "${remaining}" ] && break
          "$K" --kubeconfig "$C" -n woodpecker delete ${remaining} \
            --ignore-not-found=true --wait=false >/dev/null 2>&1 || true
          sleep 3
        done
        if [ -n "${remaining:-}" ]; then
          echo "result=fail reason=woodpecker-server-replica-volume-not-ready action=retain detail=replica-pod-scale-down-timeout pods=$(printf '%s' "${remaining}" | xargs)"
          exit 1
        fi

        failed=0
        while IFS='|' read -r ordinal pod pvc expected_uid pv handle; do
          current_uid="$("$K" --kubeconfig "$C" -n woodpecker get "pvc/${pvc}" \
            -o jsonpath='{.metadata.uid}' 2>/dev/null || true)"
          if [ "${current_uid}" != "${expected_uid}" ]; then
            echo "result=fail reason=woodpecker-server-replica-volume-not-ready pod=${pod} action=retain detail=pvc-uid-changed"
            failed=1
            continue
          fi

          echo "woodpecker_server_replica_pvc=${pvc} action=delete-zero-byte-failed-server-replica-pvc uid=${expected_uid} pv=${pv} longhornVolume=${handle}"
          "$K" --kubeconfig "$C" -n woodpecker delete "pvc/${pvc}" --wait=false

          pvc_deadline=$(( $(date +%s) + 90 ))
          while [ "$(date +%s)" -lt "${pvc_deadline}" ]; do
            if ! "$K" --kubeconfig "$C" -n woodpecker get "pvc/${pvc}" >/dev/null 2>&1; then
              break
            fi
            sleep 3
          done
          if "$K" --kubeconfig "$C" -n woodpecker get "pvc/${pvc}" >/dev/null 2>&1; then
            echo "result=fail reason=woodpecker-server-replica-volume-not-ready pod=${pod} action=retain detail=pvc-delete-timeout"
            failed=1
          else
            echo "woodpecker_server_replica_pvc=${pvc} action=recycled-zero-byte-failed-server-replica"
          fi
        done < "${candidates}"

        restore_replicas
        scaled=false
        resume_argocd_reconcile
        exit "${failed}"
      args:
        executable: /bin/bash
      register: platform_woodpecker_server_replica_volume_repair
      changed_when: "'action=recycled-zero-byte-failed-server-replica' in platform_woodpecker_server_replica_volume_repair.stdout"
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Refresh and sync Woodpecker Argo CD application
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        if ! "$K" --kubeconfig "$C" get crd applications.argoproj.io >/dev/null 2>&1; then
          echo "argocd_application_crd=absent"
          exit 0
        fi
        if ! "$K" --kubeconfig "$C" -n argocd get application/woodpecker >/dev/null 2>&1; then
          echo "argocd_application_woodpecker=absent"
          exit 0
        fi
        "$K" --kubeconfig "$C" -n argocd annotate application/woodpecker \
          argocd.argoproj.io/refresh=hard --overwrite
        revision="$("$K" --kubeconfig "$C" -n argocd get application/woodpecker \
          -o jsonpath='{.spec.source.targetRevision}' 2>/dev/null || true)"
        revision="${revision:-main}"
        "$K" --kubeconfig "$C" -n argocd patch application/woodpecker --type merge \
          -p "$(printf '{\"operation\":{\"sync\":{\"revision\":\"%s\",\"prune\":false}}}' "${revision}")" || true
      args:
        executable: /bin/bash
      register: platform_woodpecker_argocd_refresh
      changed_when: >-
        'annotated' in platform_woodpecker_argocd_refresh.stdout or
        'patched' in platform_woodpecker_argocd_refresh.stdout
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Wait for Woodpecker Argo CD sync after repair
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        TIMEOUT={{ platform_woodpecker_repair_timeout_effective }}
        if ! "$K" --kubeconfig "$C" -n argocd get application/woodpecker >/dev/null 2>&1; then
          echo "argocd_application_woodpecker=absent"
          exit 0
        fi
        deadline=$(( $(date +%s) + TIMEOUT ))
        while [ "$(date +%s)" -lt "${deadline}" ]; do
          sync_status="$("$K" --kubeconfig "$C" -n argocd get application/woodpecker -o jsonpath='{.status.sync.status}' 2>/dev/null || true)"
          health_status="$("$K" --kubeconfig "$C" -n argocd get application/woodpecker -o jsonpath='{.status.health.status}' 2>/dev/null || true)"
          operation_phase="$("$K" --kubeconfig "$C" -n argocd get application/woodpecker -o jsonpath='{.status.operationState.phase}' 2>/dev/null || true)"
          conditions="$("$K" --kubeconfig "$C" -n argocd get application/woodpecker -o jsonpath='{range .status.conditions[*]}{.type}{":"}{.message}{";"}{end}' 2>/dev/null || true)"
          echo "woodpecker sync=${sync_status:-unknown} health=${health_status:-unknown} operation=${operation_phase:-none} conditions=${conditions:-none}"
          case "${operation_phase}" in
            Error|Failed)
              exit 1
              ;;
          esac
          if [ "${sync_status}" = "Synced" ] && [ "${operation_phase}" != "Running" ]; then
            exit 0
          fi
          sleep 5
        done
        exit 1
      args:
        executable: /bin/bash
      register: platform_woodpecker_argocd_sync_wait
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Synchronize chart-compatible Woodpecker agent secret after migration
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        MANAGED_SECRET="{{ platform_woodpecker_agent_secret_name_effective }}"
        DEFAULT_SECRET=woodpecker-default-agent-secret

        managed_agent_secret="$("$K" --kubeconfig "$C" -n woodpecker get "secret/${MANAGED_SECRET}" \
          -o 'go-template={{ "{{" }} index .data "WOODPECKER_AGENT_SECRET" {{ "}}" }}' 2>/dev/null || true)"
        if [ -z "${managed_agent_secret}" ]; then
          echo "woodpecker_default_agent_secret_sync=skipped reason=managed-secret-missing"
          exit 0
        fi

        current_agent_secret="$("$K" --kubeconfig "$C" -n woodpecker get "secret/${DEFAULT_SECRET}" \
          -o 'go-template={{ "{{" }} index .data "WOODPECKER_AGENT_SECRET" {{ "}}" }}' 2>/dev/null || true)"
        if [ "${current_agent_secret}" = "${managed_agent_secret}" ]; then
          echo "woodpecker_default_agent_secret_sync=unchanged"
          exit 0
        fi

        "$K" --kubeconfig "$C" -n woodpecker create secret generic "${DEFAULT_SECRET}" \
          --from-literal=WOODPECKER_AGENT_SECRET="$(printf '%s' "${managed_agent_secret}" | base64 -d)" \
          --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -
        echo "woodpecker_default_agent_secret_sync=updated"
      args:
        executable: /bin/bash
      register: platform_woodpecker_default_agent_secret_sync
      changed_when: "'sync=updated' in platform_woodpecker_default_agent_secret_sync.stdout"
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Restart Woodpecker workloads after secret and source repair
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        restarted=0
        for workload in statefulset/woodpecker-server deployment/woodpecker-server statefulset/woodpecker-agent deployment/woodpecker-agent; do
          if "$K" --kubeconfig "$C" -n woodpecker get "${workload}" >/dev/null 2>&1; then
            "$K" --kubeconfig "$C" -n woodpecker rollout restart "${workload}"
            restarted=$((restarted + 1))
          fi
        done
        echo "woodpecker_workloads_restarted=${restarted}"
      args:
        executable: /bin/bash
      register: platform_woodpecker_workload_restart
      changed_when: "'woodpecker_workloads_restarted=0' not in platform_woodpecker_workload_restart.stdout"
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Wait for Woodpecker server and agents after repair
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        TIMEOUT={{ platform_woodpecker_repair_timeout_effective }}
        if ! "$K" --kubeconfig "$C" get namespace woodpecker >/dev/null 2>&1; then
          echo "woodpecker_namespace=absent"
          exit 1
        fi
        wait_controller() {
          role="$1"
          shift
          found=false
          for controller in "$@"; do
            if "$K" --kubeconfig "$C" -n woodpecker get "${controller}" >/dev/null 2>&1; then
              found=true
              echo "waiting role=${role} controller=${controller}"
              "$K" --kubeconfig "$C" -n woodpecker rollout status "${controller}" --timeout="${TIMEOUT}s"
              return $?
            fi
          done
          echo "result=fail reason=missing-woodpecker-${role}-controller"
          return 1
        }
        wait_controller server statefulset/woodpecker-server deployment/woodpecker-server
        wait_controller agent statefulset/woodpecker-agent deployment/woodpecker-agent
      args:
        executable: /bin/bash
      register: platform_woodpecker_rollout_wait
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Verify Woodpecker runtime images and service endpoints after repair
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        EXPECTED_TAG="{{ platform_woodpecker_repair_expected_image_tag_effective }}"
        case "${EXPECTED_TAG}" in
          [0-9]*)
            EXPECTED_TAG="v${EXPECTED_TAG}"
            ;;
        esac
        failed=0
        server_seen=0
        agent_seen=0
        if ! "$K" --kubeconfig "$C" get namespace woodpecker >/dev/null 2>&1; then
          echo "result=fail reason=woodpecker-namespace-absent"
          exit 1
        fi
        echo "expected_woodpecker_image_tag=${EXPECTED_TAG}"
        pods="$("$K" --kubeconfig "$C" -n woodpecker get pods -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.status.phase}{"|"}{range .status.containerStatuses[*]}{.ready}{","}{.restartCount}{","}{.state.waiting.reason}{";"}{end}{"|"}{range .spec.containers[*]}{.image}{" "}{end}{"\n"}{end}' 2>/dev/null || true)"
        pods_file="$(mktemp)"
        printf '%s\n' "${pods}" > "${pods_file}"
        while IFS='|' read -r pod phase statuses images; do
          [ -n "${pod}" ] || continue
          role=unknown
          expected_repo=
          case "${pod}" in
            woodpecker-server*)
              role=server
              expected_repo=woodpeckerci/woodpecker-server
              server_seen=$((server_seen + 1))
              ;;
            woodpecker-agent*)
              role=agent
              expected_repo=woodpeckerci/woodpecker-agent
              agent_seen=$((agent_seen + 1))
              ;;
            *)
              continue
              ;;
          esac
          echo "role=${role} pod=${pod} phase=${phase:-unknown} statuses=${statuses:-unknown} images=${images:-unknown}"
          if [ "${phase}" != "Running" ]; then
            echo "result=fail reason=woodpecker-pod-not-running role=${role} pod=${pod} phase=${phase:-unknown}"
            failed=1
          fi
          if ! printf '%s\n' "${statuses}" | grep -q '^true,'; then
            echo "result=fail reason=woodpecker-pod-not-ready role=${role} pod=${pod} statuses=${statuses:-unknown}"
            failed=1
          fi
          for image in ${images}; do
            image_tag="${image##*:}"
            image_repo="${image%:*}"
            case "${image_repo}:${image_tag}" in
              *"${expected_repo}:${EXPECTED_TAG}") ;;
              *)
                echo "result=fail reason=woodpecker-image-tag-mismatch role=${role} pod=${pod} image=${image} expected_repo=${expected_repo} expected_tag=${EXPECTED_TAG}"
                failed=1
                ;;
            esac
          done
        done < "${pods_file}"
        rm -f "${pods_file}"
        if [ "${server_seen}" -lt 1 ]; then
          echo "result=fail reason=woodpecker-server-pods-missing"
          failed=1
        fi
        if [ "${agent_seen}" -lt 1 ]; then
          echo "result=fail reason=woodpecker-agent-pods-missing"
          failed=1
        fi
        ready_endpoints="$("$K" --kubeconfig "$C" -n woodpecker get endpointslice \
          -l kubernetes.io/service-name=woodpecker-server \
          -o jsonpath='{range .items[*].endpoints[*]}{.conditions.ready}{"\n"}{end}' 2>/dev/null |
          awk '$1 == "true" || $1 == "<none>" || $1 == "" { count++ } END { print count + 0 }')"
        echo "woodpecker_server_ready_endpoints=${ready_endpoints}"
        if [ "${ready_endpoints}" -lt 1 ]; then
          echo "result=fail reason=woodpecker-server-has-no-ready-endpoints"
          failed=1
        fi
        exit "${failed}"
      args:
        executable: /bin/bash
      register: platform_woodpecker_runtime_verify
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Collect Woodpecker crash diagnostics after repair failure
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml

        redact() {
          sed -E \
            -e 's#(postgres(ql)?://[^:/ @]+:)[^@]+@#\1<redacted>@#g' \
            -e 's#(mysql://[^:/ @]+:)[^@]+@#\1<redacted>@#g' \
            -e 's#([?&](password|secret|token)=)[^[:space:]&]+#\1<redacted>#Ig' \
            -e 's#((password|secret|token)[[:space:]]*[:=][[:space:]]*)[^[:space:]]+#\1<redacted>#Ig'
        }

        echo "===== woodpecker pods/services/endpoints ====="
        "$K" --kubeconfig "$C" -n woodpecker get pods,svc,endpoints,endpointslice,pvc -o wide 2>&1 | redact || true

        echo "===== woodpecker app status ====="
        "$K" --kubeconfig "$C" -n argocd get application/woodpecker -o wide 2>&1 | redact || true
        "$K" --kubeconfig "$C" -n argocd get application/woodpecker \
          -o jsonpath='{range .status.conditions[*]}{.type}{": "}{.message}{"\n"}{end}' 2>&1 | redact || true

        echo "===== woodpecker workload env refs ====="
        for workload in statefulset/woodpecker-server deployment/woodpecker-server statefulset/woodpecker-agent deployment/woodpecker-agent; do
          if "$K" --kubeconfig "$C" -n woodpecker get "${workload}" >/dev/null 2>&1; then
            echo "--- ${workload} ---"
            "$K" --kubeconfig "$C" -n woodpecker get "${workload}" \
              -o jsonpath='images={range .spec.template.spec.containers[*]}{.image}{" "}{end}{"\n"}env_names={range .spec.template.spec.containers[*].env[*]}{.name}{" "}{end}{"\n"}env_from_secrets={range .spec.template.spec.containers[*].envFrom[*].secretRef}{.name}{" "}{end}{"\n"}env_value_from_secrets={range .spec.template.spec.containers[*].env[*].valueFrom.secretKeyRef}{.name}{" "}{end}{"\n"}' 2>&1 | redact || true
          fi
        done

        echo "===== required secrets state ====="
        for item in \
          woodpecker/{{ platform_woodpecker_agent_secret_name_effective }} \
          woodpecker/woodpecker-forgejo-oauth \
          woodpecker/woodpecker-database \
          platform-databases/woodpecker-database
        do
          ns="${item%/*}"
          secret="${item#*/}"
          if "$K" --kubeconfig "$C" -n "${ns}" get "secret/${secret}" >/dev/null 2>&1; then
            keys="$("$K" --kubeconfig "$C" -n "${ns}" get "secret/${secret}" \
              -o go-template='{{ "{{" }} range $key, $_ := .data {{ "}}" }}{{ "{{" }} $key {{ "}}" }} {{ "{{" }} end {{ "}}" }}' 2>/dev/null || true)"
            echo "secret=${item} state=present keys=${keys:-none}"
          else
            echo "secret=${item} state=absent"
          fi
        done

        echo "===== platform postgres state ====="
        "$K" --kubeconfig "$C" -n platform-databases get pods,svc,clusters.postgresql.cnpg.io,databases.postgresql.cnpg.io -o wide 2>&1 | redact || true

        echo "===== woodpecker logs and events ====="
        pods="$("$K" --kubeconfig "$C" -n woodpecker get pods \
          -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null |
          grep '^woodpecker-' || true)"
        for pod in ${pods}; do
          echo "--- pod/${pod} current logs ---"
          "$K" --kubeconfig "$C" -n woodpecker logs "pod/${pod}" --all-containers --tail=120 2>&1 | redact || true
          echo "--- pod/${pod} previous logs ---"
          "$K" --kubeconfig "$C" -n woodpecker logs "pod/${pod}" --all-containers --previous --tail=120 2>&1 | redact || true
          echo "--- pod/${pod} events ---"
          "$K" --kubeconfig "$C" -n woodpecker describe "pod/${pod}" 2>&1 |
            sed -n '/Events:/,$p' |
            tail -120 |
            redact || true
        done
      args:
        executable: /bin/bash
      register: platform_woodpecker_failure_diagnostics
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      when: >
        ((platform_woodpecker_server_replica_volume_repair | default({})).rc | default(0) | int != 0) or
        ((platform_woodpecker_argocd_sync_wait | default({})).rc | default(0) | int != 0) or
        ((platform_woodpecker_rollout_wait | default({})).rc | default(0) | int != 0) or
        ((platform_woodpecker_runtime_verify | default({})).rc | default(0) | int != 0)

    - name: Stop after Woodpecker repair failure
      ansible.builtin.fail:
        msg: |
          Woodpecker did not become reconciled, rolled out, and image-aligned
          within {{ platform_woodpecker_repair_timeout_effective }}s.

          Failed server replica volume repair:
          rc={{ (platform_woodpecker_server_replica_volume_repair | default({})).rc | default('not run') }}
          stdout:
          {{ (platform_woodpecker_server_replica_volume_repair | default({})).stdout | default('not run') }}
          stderr:
          {{ (platform_woodpecker_server_replica_volume_repair | default({})).stderr | default('not run') }}

          Argo CD sync wait:
          rc={{ (platform_woodpecker_argocd_sync_wait | default({})).rc | default('not run') }}
          stdout:
          {{ (platform_woodpecker_argocd_sync_wait | default({})).stdout | default('not run') }}
          stderr:
          {{ (platform_woodpecker_argocd_sync_wait | default({})).stderr | default('not run') }}

          Rollout wait:
          rc={{ (platform_woodpecker_rollout_wait | default({})).rc | default('not run') }}
          stdout:
          {{ (platform_woodpecker_rollout_wait | default({})).stdout | default('not run') }}
          stderr:
          {{ (platform_woodpecker_rollout_wait | default({})).stderr | default('not run') }}

          Runtime verification:
          rc={{ (platform_woodpecker_runtime_verify | default({})).rc | default('not run') }}
          stdout:
          {{ (platform_woodpecker_runtime_verify | default({})).stdout | default('not run') }}
          stderr:
          {{ (platform_woodpecker_runtime_verify | default({})).stderr | default('not run') }}

          Failure diagnostics:
          {{ (platform_woodpecker_failure_diagnostics | default({})).stdout | default('not run') }}

          If runtime verification shows `woodpecker-image-tag-mismatch`, the
          Argo CD source still contains stale rendered Woodpecker values. For
          example, `woodpecker-server:3.16.0` must be rendered and synced as
          `woodpecker-server:v3.16.0`.

          Update your private/seed deployment values, sync them into the GitOps
          source that Argo CD reads, and rerun:
          WOODPECKER_IMAGE_TAG=v3.16.0 make platform-render-private-values
          PLATFORM_AUTO_COMMIT=true make platform-seed-git-sync
          make platform-woodpecker-repair
      run_once: true
      when: >
        ((platform_woodpecker_server_replica_volume_repair | default({})).rc | default(0) | int != 0) or
        ((platform_woodpecker_argocd_sync_wait | default({})).rc | default(0) | int != 0) or
        ((platform_woodpecker_rollout_wait | default({})).rc | default(0) | int != 0) or
        ((platform_woodpecker_runtime_verify | default({})).rc | default(0) | int != 0)

    - name: Show successful Woodpecker repair result
      ansible.builtin.debug:
        msg: |
          Woodpecker Argo CD sync, server/agent rollout, runtime image tag, and
          server service endpoint checks passed. Run `make platform-ci-health`
          for the focused Argo CD/Woodpecker ingress and service-path gate.
      run_once: true
