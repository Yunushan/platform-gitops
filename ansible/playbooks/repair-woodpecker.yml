---
- name: Repair Woodpecker CI rollout and runtime drift
  hosts: rke2_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    rke2_first_server: "{{ groups['rke2_servers'][0] }}"
    platform_woodpecker_repair_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_WOODPECKER_REPAIR_TIMEOUT') }}"
    platform_woodpecker_repair_expected_image_tag_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_WOODPECKER_REPAIR_EXPECTED_IMAGE_TAG') }}"
    platform_woodpecker_repair_auto_prerequisites_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_WOODPECKER_REPAIR_AUTO_PREREQUISITES') }}"
    platform_woodpecker_repair_reset_failed_replica_pvcs_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_WOODPECKER_REPAIR_RESET_FAILED_REPLICA_PVCS') }}"
    platform_woodpecker_repair_reset_unrecoverable_postgres_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_WOODPECKER_REPAIR_RESET_UNRECOVERABLE_POSTGRES') }}"
    platform_woodpecker_repair_check_image_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_WOODPECKER_REPAIR_CHECK_IMAGE') }}"
    platform_woodpecker_image_tag_from_env: "{{ lookup('ansible.builtin.env', 'WOODPECKER_IMAGE_TAG') }}"
    platform_woodpecker_repair_timeout_effective: "{{ platform_woodpecker_repair_timeout | default(platform_woodpecker_repair_timeout_from_env, true) | default(300, true) | int }}"
    platform_woodpecker_repair_expected_image_tag_effective: "{{ platform_woodpecker_repair_expected_image_tag | default(platform_woodpecker_repair_expected_image_tag_from_env, true) | default(platform_woodpecker_image_tag_from_env, true) | default('v3.16.0', true) }}"
    platform_woodpecker_repair_auto_prerequisites_effective: "{{ platform_woodpecker_repair_auto_prerequisites | default(platform_woodpecker_repair_auto_prerequisites_from_env, true) | default(true, true) | bool }}"
    platform_woodpecker_repair_reset_failed_replica_pvcs_effective: "{{ platform_woodpecker_repair_reset_failed_replica_pvcs | default(platform_woodpecker_repair_reset_failed_replica_pvcs_from_env, true) | default(true, true) | bool }}"
    platform_woodpecker_repair_reset_unrecoverable_postgres_effective: "{{ platform_woodpecker_repair_reset_unrecoverable_postgres | default(platform_woodpecker_repair_reset_unrecoverable_postgres_from_env, true) | default(false, true) | bool }}"
    platform_woodpecker_repair_check_image_effective: "{{ platform_woodpecker_repair_check_image | default(platform_woodpecker_repair_check_image_from_env, true) | default('rancher/klipper-helm:v0.10.0-build20260513', true) }}"
  tasks:
    - name: Show Woodpecker state before repair
      ansible.builtin.shell: |
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        echo "===== Argo CD Woodpecker application ====="
        "$K" --kubeconfig "$C" -n argocd get application/woodpecker -o wide || true
        echo "===== Woodpecker pods ====="
        "$K" --kubeconfig "$C" -n woodpecker get pods -o wide || true
        echo "===== Woodpecker services/endpoints ====="
        "$K" --kubeconfig "$C" -n woodpecker get svc,endpoints,endpointslice,ingress,pvc -o wide || true
        echo "===== Woodpecker pod images ====="
        "$K" --kubeconfig "$C" -n woodpecker get pods \
          -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{range .spec.containers[*]}{.image}{" "}{end}{"\n"}{end}' || true
      args:
        executable: /bin/bash
      register: platform_woodpecker_repair_state_before
      changed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Print Woodpecker state before repair
      ansible.builtin.debug:
        var: platform_woodpecker_repair_state_before.stdout_lines
      run_once: true

    - name: Ensure platform PostgreSQL backend is available when Woodpecker uses Postgres
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        TIMEOUT={{ platform_woodpecker_repair_timeout_effective }}

        redact() {
          sed -E \
            -e 's#(postgres(ql)?://[^:/ @]+:)[^@]+@#\1<redacted>@#g' \
            -e 's#([?&](password|secret|token)=)[^[:space:]&]+#\1<redacted>#Ig' \
            -e 's#((password|secret|token)[[:space:]]*[:=][[:space:]]*)[^[:space:]]+#\1<redacted>#Ig'
        }

        workload=""
        for candidate in statefulset/woodpecker-server deployment/woodpecker-server; do
          if "$K" --kubeconfig "$C" -n woodpecker get "${candidate}" >/dev/null 2>&1; then
            workload="${candidate}"
            break
          fi
        done
        if [ -z "${workload}" ]; then
          echo "woodpecker_server_workload=absent postgres_backend_check=skipped"
          exit 0
        fi

        driver="$("$K" --kubeconfig "$C" -n woodpecker get "${workload}" \
          -o jsonpath='{range .spec.template.spec.containers[*].env[?(@.name=="WOODPECKER_DATABASE_DRIVER")]}{.value}{"\n"}{end}' 2>/dev/null |
          tail -n 1 || true)"
        case "${driver}" in
          postgres|postgresql)
            ;;
          *)
            echo "woodpecker_database_driver=${driver:-unset} postgres_backend_check=skipped"
            exit 0
            ;;
        esac

        echo "woodpecker_database_driver=${driver}"
        echo "required_postgres_service=platform-databases/platform-postgres-rw"

        if "$K" --kubeconfig "$C" get crd applications.argoproj.io >/dev/null 2>&1; then
          repo_url="$("$K" --kubeconfig "$C" -n argocd get application/woodpecker -o jsonpath='{.spec.source.repoURL}' 2>/dev/null || true)"
          target_revision="$("$K" --kubeconfig "$C" -n argocd get application/woodpecker -o jsonpath='{.spec.source.targetRevision}' 2>/dev/null || true)"
          project="$("$K" --kubeconfig "$C" -n argocd get application/woodpecker -o jsonpath='{.spec.project}' 2>/dev/null || true)"
          target_revision="${target_revision:-main}"
          project="${project:-platform}"

          yaml_escape() {
            sed -e 's/\\/\\\\/g' -e 's/"/\\"/g'
          }

          repo_url_yaml="$(printf '%s' "${repo_url}" | yaml_escape)"
          target_revision_yaml="$(printf '%s' "${target_revision}" | yaml_escape)"
          project_yaml="$(printf '%s' "${project}" | yaml_escape)"

          register_app_if_missing() {
            name="$1"
            wave="$2"
            path="$3"
            namespace="$4"
            safe_name="$(printf '%s' "${name}" | tr '-' '_')"
            if "$K" --kubeconfig "$C" -n argocd get "application/${name}" >/dev/null 2>&1; then
              echo "argocd_application_${safe_name}=present"
              return 0
            fi
            if [ -z "${repo_url}" ]; then
              echo "argocd_application_${safe_name}=absent reason=woodpecker-source-repo-url-empty"
              return 1
            fi
            {
              printf '%s\n' 'apiVersion: argoproj.io/v1alpha1'
              printf '%s\n' 'kind: Application'
              printf '%s\n' 'metadata:'
              printf '  name: %s\n' "${name}"
              printf '%s\n' '  namespace: argocd'
              printf '%s\n' '  annotations:'
              printf '    argocd.argoproj.io/sync-wave: "%s"\n' "${wave}"
              printf '%s\n' 'spec:'
              printf '  project: "%s"\n' "${project_yaml}"
              printf '%s\n' '  source:'
              printf '    repoURL: "%s"\n' "${repo_url_yaml}"
              printf '    targetRevision: "%s"\n' "${target_revision_yaml}"
              printf '    path: %s\n' "${path}"
              printf '%s\n' '  destination:'
              printf '%s\n' '    server: https://kubernetes.default.svc'
              printf '    namespace: %s\n' "${namespace}"
              printf '%s\n' '  syncPolicy:'
              printf '%s\n' '    automated:'
              printf '%s\n' '      prune: false'
              printf '%s\n' '      selfHeal: true'
              printf '%s\n' '    syncOptions:'
              printf '%s\n' '      - CreateNamespace=true'
              printf '%s\n' '      - ServerSideApply=true'
            } | "$K" --kubeconfig "$C" apply -f -
            echo "argocd_application_${safe_name}=auto-registered repo=${repo_url_yaml} revision=${target_revision_yaml} path=${path}"
          }

          register_app_if_missing cloudnativepg 2 gitops/clusters/rke2-main/premium-3node/apps/cloudnativepg cnpg-system
          register_app_if_missing platform-postgres 4 gitops/clusters/rke2-main/premium-3node/apps/platform-postgres platform-databases

          for app in cloudnativepg platform-postgres; do
            if ! "$K" --kubeconfig "$C" -n argocd get "application/${app}" >/dev/null 2>&1; then
              echo "argocd_application_${app}=absent"
              continue
            fi
            "$K" --kubeconfig "$C" -n argocd annotate "application/${app}" \
              argocd.argoproj.io/refresh=hard --overwrite >/dev/null
            revision="$("$K" --kubeconfig "$C" -n argocd get "application/${app}" \
              -o jsonpath='{.spec.source.targetRevision}' 2>/dev/null || true)"
            revision="${revision:-main}"
            "$K" --kubeconfig "$C" -n argocd patch "application/${app}" --type merge \
              -p "$(printf '{\"operation\":{\"sync\":{\"revision\":\"%s\",\"prune\":false}}}' "${revision}")" >/dev/null 2>&1 || true
          done

          sync_deadline=$(( $(date +%s) + TIMEOUT ))
          while [ "$(date +%s)" -lt "${sync_deadline}" ]; do
            cnpg_sync="$("$K" --kubeconfig "$C" -n argocd get application/cloudnativepg -o jsonpath='{.status.sync.status}' 2>/dev/null || true)"
            cnpg_health="$("$K" --kubeconfig "$C" -n argocd get application/cloudnativepg -o jsonpath='{.status.health.status}' 2>/dev/null || true)"
            cnpg_operation="$("$K" --kubeconfig "$C" -n argocd get application/cloudnativepg -o jsonpath='{.status.operationState.phase}' 2>/dev/null || true)"
            sync_status="$("$K" --kubeconfig "$C" -n argocd get application/platform-postgres -o jsonpath='{.status.sync.status}' 2>/dev/null || true)"
            health_status="$("$K" --kubeconfig "$C" -n argocd get application/platform-postgres -o jsonpath='{.status.health.status}' 2>/dev/null || true)"
            operation_phase="$("$K" --kubeconfig "$C" -n argocd get application/platform-postgres -o jsonpath='{.status.operationState.phase}' 2>/dev/null || true)"
            conditions="$("$K" --kubeconfig "$C" -n argocd get application/platform-postgres -o jsonpath='{range .status.conditions[*]}{.type}{":"}{.message}{";"}{end}' 2>/dev/null || true)"
            echo "cloudnativepg sync=${cnpg_sync:-unknown} health=${cnpg_health:-unknown} operation=${cnpg_operation:-none}" | redact
            echo "platform-postgres sync=${sync_status:-unknown} health=${health_status:-unknown} operation=${operation_phase:-none} conditions=${conditions:-none}" | redact
            case "${cnpg_operation}:${operation_phase}" in
              Error:*|Failed:*|*:Error|*:Failed)
                break
                ;;
            esac
            if [ "${cnpg_operation}" = "Running" ] || [ "${operation_phase}" = "Running" ]; then
              sleep 5
              continue
            fi
            case "${sync_status}" in
              Synced)
                break
                ;;
            esac
            case "${operation_phase}" in
              Error|Failed)
                break
                ;;
            esac
            sleep 5
          done
        else
          echo "argocd_application_crd=absent"
        fi

        deadline=$(( $(date +%s) + TIMEOUT ))
        while [ "$(date +%s)" -lt "${deadline}" ]; do
          if "$K" --kubeconfig "$C" -n platform-databases get service/platform-postgres-rw >/dev/null 2>&1; then
            ready_endpoints="$("$K" --kubeconfig "$C" -n platform-databases get endpointslice \
              -l kubernetes.io/service-name=platform-postgres-rw \
              -o jsonpath='{range .items[*].endpoints[*]}{.conditions.ready}{"\n"}{end}' 2>/dev/null |
              awk '$1 == "true" || $1 == "<none>" || $1 == "" { count++ } END { print count + 0 }')"
            cluster_instances="$("$K" --kubeconfig "$C" -n platform-databases get cluster.postgresql.cnpg.io/platform-postgres \
              -o jsonpath='{.spec.instances}' 2>/dev/null || true)"
            cluster_ready="$("$K" --kubeconfig "$C" -n platform-databases get cluster.postgresql.cnpg.io/platform-postgres \
              -o jsonpath='{.status.readyInstances}' 2>/dev/null || true)"
            cluster_phase="$("$K" --kubeconfig "$C" -n platform-databases get cluster.postgresql.cnpg.io/platform-postgres \
              -o jsonpath='{.status.phase}' 2>/dev/null || true)"
            case "${cluster_instances}" in ""|*[!0-9]*) cluster_instances=0 ;; esac
            case "${cluster_ready}" in ""|*[!0-9]*) cluster_ready=0 ;; esac
            echo "platform_postgres_rw_service=present ready_endpoints=${ready_endpoints} cluster_ready=${cluster_ready}/${cluster_instances} cluster_phase=${cluster_phase:-unknown}"
            if [ "${ready_endpoints}" -ge 1 ]; then
              if [ "${cluster_instances}" -gt 0 ] && [ "${cluster_ready}" -lt "${cluster_instances}" ]; then
                echo "platform_postgres_ha_state=progressing ready=${cluster_ready}/${cluster_instances} action=continue-woodpecker-repair"
              fi
              exit 0
            fi
          else
            echo "platform_postgres_rw_service=absent"
          fi
          "$K" --kubeconfig "$C" -n platform-databases get pods,svc,clusters.postgresql.cnpg.io,databases.postgresql.cnpg.io -o wide 2>&1 | redact || true
          sleep 10
        done

        echo "result=fail reason=woodpecker-postgres-backend-not-ready"
        echo "===== platform-postgres application ====="
        "$K" --kubeconfig "$C" -n argocd get application/platform-postgres -o wide 2>&1 | redact || true
        "$K" --kubeconfig "$C" -n argocd describe application/platform-postgres 2>&1 |
          sed -n '/Status:/,/Events:/p' |
          redact || true
        echo "===== platform-databases runtime ====="
        "$K" --kubeconfig "$C" -n platform-databases get pods,svc,endpoints,endpointslice,clusters.postgresql.cnpg.io,databases.postgresql.cnpg.io -o wide 2>&1 | redact || true
        echo "===== Longhorn node and disk scheduling state ====="
        "$K" --kubeconfig "$C" -n longhorn-system get nodes.longhorn.io -o wide 2>&1 | redact || true
        nodes="$("$K" --kubeconfig "$C" -n longhorn-system get nodes.longhorn.io \
          -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)"
        for node in ${nodes}; do
          echo "----- longhorn-node/${node} -----"
          "$K" --kubeconfig "$C" -n longhorn-system describe "nodes.longhorn.io/${node}" 2>&1 |
            sed -n '/Spec:/,/Events:/p' |
            redact || true
        done
        echo "===== platform-databases pod events ====="
        pods="$("$K" --kubeconfig "$C" -n platform-databases get pods \
          -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)"
        for pod in ${pods}; do
          echo "----- pod/${pod} -----"
          "$K" --kubeconfig "$C" -n platform-databases describe "pod/${pod}" 2>&1 |
            sed -n '/Events:/,$p' |
            redact || true
        done
        echo "===== platform-databases PVC and Longhorn backing volumes ====="
        pvcs="$("$K" --kubeconfig "$C" -n platform-databases get pvc \
          -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)"
        for pvc in ${pvcs}; do
          echo "----- pvc/${pvc} -----"
          "$K" --kubeconfig "$C" -n platform-databases describe "pvc/${pvc}" 2>&1 | redact || true
          pv="$("$K" --kubeconfig "$C" -n platform-databases get "pvc/${pvc}" -o jsonpath='{.spec.volumeName}' 2>/dev/null || true)"
          if [ -n "${pv}" ]; then
            handle="$("$K" --kubeconfig "$C" get "pv/${pv}" -o jsonpath='{.spec.csi.volumeHandle}' 2>/dev/null || true)"
            printf 'pv=%s longhornVolume=%s\n' "${pv}" "${handle:-none}"
            if [ -n "${handle}" ] && "$K" --kubeconfig "$C" get crd/volumes.longhorn.io >/dev/null 2>&1; then
              "$K" --kubeconfig "$C" -n longhorn-system get "volumes.longhorn.io/${handle}" -o wide 2>&1 | redact || true
              "$K" --kubeconfig "$C" -n longhorn-system describe "volumes.longhorn.io/${handle}" 2>&1 | redact || true
            fi
          fi
        done
        exit 1
      args:
        executable: /bin/bash
      register: platform_woodpecker_postgres_backend_check
      changed_when: >-
        'platform-postgres sync=' in platform_woodpecker_postgres_backend_check.stdout or
        'argocd_application_platform_postgres=auto-registered' in platform_woodpecker_postgres_backend_check.stdout or
        'argocd_application_cloudnativepg=auto-registered' in platform_woodpecker_postgres_backend_check.stdout
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Automatically repair PostgreSQL prerequisites for Woodpecker when safe
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        TIMEOUT={{ platform_woodpecker_repair_timeout_effective }}
        ALLOW_DESTRUCTIVE_RESET={{ platform_woodpecker_repair_reset_unrecoverable_postgres_effective | bool | lower }}
        RESET_FAILED_REPLICA_PVCS={{ platform_woodpecker_repair_reset_failed_replica_pvcs_effective | bool | lower }}

        redact() {
          sed -E \
            -e 's#(postgres(ql)?://[^:/ @]+:)[^@]+@#\1<redacted>@#g' \
            -e 's#([?&](password|secret|token)=)[^[:space:]&]+#\1<redacted>#Ig' \
            -e 's#((password|secret|token)[[:space:]]*[:=][[:space:]]*)[^[:space:]]+#\1<redacted>#Ig'
        }

        echo "===== automatic Woodpecker PostgreSQL prerequisite repair ====="

        if "$K" --kubeconfig "$C" -n cnpg-system get deployment/cloudnative-pg >/dev/null 2>&1; then
          echo "action=restart-cloudnativepg-operator"
          "$K" --kubeconfig "$C" -n cnpg-system rollout restart deployment/cloudnative-pg
          "$K" --kubeconfig "$C" -n cnpg-system rollout status deployment/cloudnative-pg --timeout=300s || true
          "$K" --kubeconfig "$C" -n cnpg-system get pods,svc,endpointslice -o wide 2>&1 | redact || true
        else
          echo "cloudnativepg_operator=absent"
        fi

        reset_postgres=false
        cluster_status="$("$K" --kubeconfig "$C" -n platform-databases get cluster.postgresql.cnpg.io/platform-postgres \
          -o jsonpath='{.status.phase} {.status.conditions[*].message}' 2>/dev/null || true)"
        if printf '%s\n' "${cluster_status}" | grep -qi 'unrecoverable'; then
          pvc_names="$(
            {
              "$K" --kubeconfig "$C" -n platform-databases get pvc \
                -l cnpg.io/cluster=platform-postgres \
                -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true
              "$K" --kubeconfig "$C" -n platform-databases get pvc \
                -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null |
                grep -E '^platform-postgres-[0-9]+$' || true
            } | sort -u
          )"
          if [ -z "${pvc_names}" ]; then
            echo "platform_postgres_unrecoverable=true pvc_count=0 action=reset-empty-cnpg-cluster"
            reset_postgres=true
          elif [ "${ALLOW_DESTRUCTIVE_RESET}" = "true" ]; then
            echo "platform_postgres_unrecoverable=true pvc_count=$(printf '%s\n' "${pvc_names}" | wc -l) action=destructive-reset-enabled"
            reset_postgres=true
          else
            echo "platform_postgres_unrecoverable=true pvc_count=$(printf '%s\n' "${pvc_names}" | wc -l) action=blocked-needs-PLATFORM_WOODPECKER_REPAIR_RESET_UNRECOVERABLE_POSTGRES"
          fi
        fi

        if [ "${reset_postgres}" = "true" ]; then
          pv_names=""
          longhorn_handles=""
          pvc_names="$(
            {
              "$K" --kubeconfig "$C" -n platform-databases get pvc \
                -l cnpg.io/cluster=platform-postgres \
                -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true
              "$K" --kubeconfig "$C" -n platform-databases get pvc \
                -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null |
                grep -E '^platform-postgres-[0-9]+$' || true
            } | sort -u
          )"
          for pvc in ${pvc_names}; do
            pv="$("$K" --kubeconfig "$C" -n platform-databases get "pvc/${pvc}" -o jsonpath='{.spec.volumeName}' 2>/dev/null || true)"
            [ -n "${pv}" ] || continue
            handle="$("$K" --kubeconfig "$C" get "pv/${pv}" -o jsonpath='{.spec.csi.volumeHandle}' 2>/dev/null || true)"
            pv_names="${pv_names} ${pv}"
            if [ -n "${handle}" ]; then
              longhorn_handles="${longhorn_handles} ${handle}"
            fi
          done

          for database in platform-postgres-keycloak platform-postgres-woodpecker; do
            "$K" --kubeconfig "$C" -n platform-databases delete "database.postgresql.cnpg.io/${database}" --ignore-not-found=true --wait=false || true
          done
          "$K" --kubeconfig "$C" -n platform-databases delete cluster.postgresql.cnpg.io/platform-postgres --ignore-not-found=true --wait=false || true
          "$K" --kubeconfig "$C" -n platform-databases delete job,pod -l cnpg.io/cluster=platform-postgres --ignore-not-found=true --wait=false || true

          if [ -n "${pvc_names}" ] && [ "${ALLOW_DESTRUCTIVE_RESET}" = "true" ]; then
            for pvc in ${pvc_names}; do
              "$K" --kubeconfig "$C" -n platform-databases delete "pvc/${pvc}" --ignore-not-found=true --wait=false
            done
            for pv in ${pv_names}; do
              "$K" --kubeconfig "$C" delete "pv/${pv}" --ignore-not-found=true --wait=false
            done
            for handle in ${longhorn_handles}; do
              "$K" --kubeconfig "$C" -n longhorn-system delete "volumes.longhorn.io/${handle}" --ignore-not-found=true --wait=false || true
            done
          fi

          delete_deadline=$(( $(date +%s) + 90 ))
          while [ "$(date +%s)" -lt "${delete_deadline}" ]; do
            if ! "$K" --kubeconfig "$C" -n platform-databases get cluster.postgresql.cnpg.io/platform-postgres >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done

          if "$K" --kubeconfig "$C" -n platform-databases get cluster.postgresql.cnpg.io/platform-postgres >/dev/null 2>&1; then
            echo "platform_postgres_cluster_delete=stuck action=clear-empty-cluster-finalizers"
            "$K" --kubeconfig "$C" -n platform-databases patch cluster.postgresql.cnpg.io/platform-postgres \
              --type=merge -p '{"metadata":{"finalizers":[]}}' || true
            "$K" --kubeconfig "$C" -n platform-databases delete cluster.postgresql.cnpg.io/platform-postgres --ignore-not-found=true --wait=false || true
          fi

          for database in platform-postgres-keycloak platform-postgres-woodpecker; do
            if "$K" --kubeconfig "$C" -n platform-databases get "database.postgresql.cnpg.io/${database}" >/dev/null 2>&1; then
              echo "platform_postgres_database_delete=stuck name=${database} action=clear-finalizers"
              "$K" --kubeconfig "$C" -n platform-databases patch "database.postgresql.cnpg.io/${database}" \
                --type=merge -p '{"metadata":{"finalizers":[]}}' || true
              "$K" --kubeconfig "$C" -n platform-databases delete "database.postgresql.cnpg.io/${database}" --ignore-not-found=true --wait=false || true
            fi
          done

          "$K" --kubeconfig "$C" -n platform-databases delete service/platform-postgres-r service/platform-postgres-ro service/platform-postgres-rw \
            --ignore-not-found=true --wait=false || true
          "$K" --kubeconfig "$C" -n platform-databases delete endpoints/platform-postgres-r endpoints/platform-postgres-ro endpoints/platform-postgres-rw \
            --ignore-not-found=true --wait=false || true
          "$K" --kubeconfig "$C" -n platform-databases delete endpointslice \
            -l cnpg.io/cluster=platform-postgres --ignore-not-found=true --wait=false || true
        fi

        cleanup_failed_postgres_replica_pvcs() {
          [ "${RESET_FAILED_REPLICA_PVCS}" = "true" ] || return 0
          "$K" --kubeconfig "$C" -n platform-databases get cluster.postgresql.cnpg.io/platform-postgres >/dev/null 2>&1 || return 0

          replica_pvcs="$(
            "$K" --kubeconfig "$C" -n platform-databases get pvc \
              -l cnpg.io/cluster=platform-postgres \
              -o json 2>/dev/null |
              python3 -c 'import json,sys; data=json.load(sys.stdin); [print("|".join([((item.get("metadata") or {}).get("name") or ""), (((item.get("metadata") or {}).get("labels") or {}).get("role") or ""), (((item.get("metadata") or {}).get("labels") or {}).get("cnpg.io/instanceName") or ""), (((item.get("metadata") or {}).get("annotations") or {}).get("cnpg.io/pvcStatus") or ""), ((item.get("spec") or {}).get("volumeName") or "")])) for item in data.get("items", [])]' || true
          )"
          printf '%s\n' "${replica_pvcs}" | while IFS='|' read -r pvc role instance pvc_status pv; do
            [ -n "${pvc}" ] || continue
            [ "${role}" = "replica" ] || continue
            [ "${pvc_status}" = "initializing" ] || continue

            active_pod=false
            if [ -n "${instance}" ]; then
              for pod_object in $("$K" --kubeconfig "$C" -n platform-databases get pod -o name 2>/dev/null |
                grep -E "^pod/${instance}($|-join)" || true); do
                pod_phase="$("$K" --kubeconfig "$C" -n platform-databases get "${pod_object}" \
                  -o jsonpath='{.status.phase}' 2>/dev/null || true)"
                if [ -n "${pod_phase}" ] && [ "${pod_phase}" != "Failed" ] && [ "${pod_phase}" != "Succeeded" ]; then
                  echo "platform_postgres_replica_pvc=${pvc} action=retain reason=replica-pod-active pod=${pod_object#pod/} phase=${pod_phase}"
                  active_pod=true
                  break
                fi
              done
            fi
            if [ "${active_pod}" = "true" ]; then
              continue
            fi

            handle=""
            actual_size=0
            volume_state=""
            if [ -n "${pv}" ]; then
              handle="$("$K" --kubeconfig "$C" get "pv/${pv}" -o jsonpath='{.spec.csi.volumeHandle}' 2>/dev/null || true)"
            fi
            if [ -n "${handle}" ] && "$K" --kubeconfig "$C" get crd/volumes.longhorn.io >/dev/null 2>&1 &&
              "$K" --kubeconfig "$C" -n longhorn-system get "volumes.longhorn.io/${handle}" >/dev/null 2>&1; then
              actual_size="$("$K" --kubeconfig "$C" -n longhorn-system get "volumes.longhorn.io/${handle}" \
                -o jsonpath='{.status.actualSize}' 2>/dev/null || echo 0)"
              volume_state="$("$K" --kubeconfig "$C" -n longhorn-system get "volumes.longhorn.io/${handle}" \
                -o jsonpath='{.status.state}' 2>/dev/null || true)"
            fi
            case "${actual_size}" in ""|*[!0-9]*) actual_size=1 ;; esac

            if [ "${actual_size}" -gt 0 ]; then
              echo "platform_postgres_replica_pvc=${pvc} action=retain reason=replica-volume-has-data actual_size=${actual_size} state=${volume_state:-unknown}"
              continue
            fi

            echo "platform_postgres_replica_pvc=${pvc} action=delete-failed-cnpg-replica-pvc instance=${instance:-unknown} pv=${pv:-none} longhornVolume=${handle:-none} state=${volume_state:-unknown}"
            if [ -n "${instance}" ]; then
              for object in $("$K" --kubeconfig "$C" -n platform-databases get job,pod -o name 2>/dev/null |
                grep -E "^(.+/)?${instance}-join" || true); do
                echo "platform_postgres_replica_init_object=${object} action=delete-failed-cnpg-replica-join"
                "$K" --kubeconfig "$C" -n platform-databases delete "${object}" --ignore-not-found=true --wait=false || true
              done
            fi
            "$K" --kubeconfig "$C" -n platform-databases delete "pvc/${pvc}" --ignore-not-found=true --wait=false || true
          done
        }

        cleanup_failed_postgres_replica_pvcs

        if "$K" --kubeconfig "$C" get crd applications.argoproj.io >/dev/null 2>&1; then
          for app in cloudnativepg platform-postgres; do
            if "$K" --kubeconfig "$C" -n argocd get "application/${app}" >/dev/null 2>&1; then
              "$K" --kubeconfig "$C" -n argocd annotate "application/${app}" \
                argocd.argoproj.io/refresh=hard --overwrite >/dev/null || true
              revision="$("$K" --kubeconfig "$C" -n argocd get "application/${app}" \
                -o jsonpath='{.spec.source.targetRevision}' 2>/dev/null || true)"
              revision="${revision:-main}"
              "$K" --kubeconfig "$C" -n argocd patch "application/${app}" --type merge \
                -p "$(printf '{\"operation\":{\"sync\":{\"revision\":\"%s\",\"prune\":false}}}' "${revision}")" >/dev/null 2>&1 || true
              echo "argocd_application_${app}=refresh-sync-requested"
            else
              echo "argocd_application_${app}=absent"
            fi
          done
        fi

        deadline=$(( $(date +%s) + TIMEOUT ))
        while [ "$(date +%s)" -lt "${deadline}" ]; do
          cleanup_failed_postgres_replica_pvcs
          ready_endpoints="$("$K" --kubeconfig "$C" -n platform-databases get endpointslice \
            -l kubernetes.io/service-name=platform-postgres-rw \
            -o jsonpath='{range .items[*].endpoints[*]}{.conditions.ready}{"\n"}{end}' 2>/dev/null |
            awk '$1 == "true" || $1 == "<none>" || $1 == "" { count++ } END { print count + 0 }')"
          cluster_instances="$("$K" --kubeconfig "$C" -n platform-databases get cluster.postgresql.cnpg.io/platform-postgres \
            -o jsonpath='{.spec.instances}' 2>/dev/null || true)"
          cluster_ready="$("$K" --kubeconfig "$C" -n platform-databases get cluster.postgresql.cnpg.io/platform-postgres \
            -o jsonpath='{.status.readyInstances}' 2>/dev/null || true)"
          cluster_phase="$("$K" --kubeconfig "$C" -n platform-databases get cluster.postgresql.cnpg.io/platform-postgres \
            -o jsonpath='{.status.phase}' 2>/dev/null || true)"
          case "${cluster_instances}" in ""|*[!0-9]*) cluster_instances=0 ;; esac
          case "${cluster_ready}" in ""|*[!0-9]*) cluster_ready=0 ;; esac
          echo "platform_postgres_rw_service=present ready_endpoints=${ready_endpoints} cluster_ready=${cluster_ready}/${cluster_instances} cluster_phase=${cluster_phase:-unknown}"
          if [ "${ready_endpoints}" -ge 1 ]; then
            if [ "${cluster_instances}" -gt 0 ] && [ "${cluster_ready}" -lt "${cluster_instances}" ]; then
              echo "platform_postgres_ha_state=progressing ready=${cluster_ready}/${cluster_instances} action=continue-woodpecker-repair"
            fi
            exit 0
          fi
          "$K" --kubeconfig "$C" -n platform-databases get pods,svc,endpointslice,clusters.postgresql.cnpg.io,databases.postgresql.cnpg.io -o wide 2>&1 | redact || true
          sleep 10
        done

        echo "result=fail reason=automatic-postgres-prerequisite-repair-did-not-produce-ready-endpoint"
        exit 1
      args:
        executable: /bin/bash
      register: platform_woodpecker_postgres_auto_repair
      changed_when: >-
        'action=restart-cloudnativepg-operator' in platform_woodpecker_postgres_auto_repair.stdout or
        'action=reset-empty-cnpg-cluster' in platform_woodpecker_postgres_auto_repair.stdout or
        'action=destructive-reset-enabled' in platform_woodpecker_postgres_auto_repair.stdout or
        'refresh-sync-requested' in platform_woodpecker_postgres_auto_repair.stdout
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      when: >
        platform_woodpecker_repair_auto_prerequisites_effective | bool and
        platform_woodpecker_postgres_backend_check.rc | int != 0

    - name: Re-check platform PostgreSQL backend after automatic prerequisite repair
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        TIMEOUT={{ platform_woodpecker_repair_timeout_effective }}

        redact() {
          sed -E \
            -e 's#(postgres(ql)?://[^:/ @]+:)[^@]+@#\1<redacted>@#g' \
            -e 's#([?&](password|secret|token)=)[^[:space:]&]+#\1<redacted>#Ig' \
            -e 's#((password|secret|token)[[:space:]]*[:=][[:space:]]*)[^[:space:]]+#\1<redacted>#Ig'
        }

        deadline=$(( $(date +%s) + TIMEOUT ))
        while [ "$(date +%s)" -lt "${deadline}" ]; do
          ready_endpoints="$("$K" --kubeconfig "$C" -n platform-databases get endpointslice \
            -l kubernetes.io/service-name=platform-postgres-rw \
            -o jsonpath='{range .items[*].endpoints[*]}{.conditions.ready}{"\n"}{end}' 2>/dev/null |
            awk '$1 == "true" || $1 == "<none>" || $1 == "" { count++ } END { print count + 0 }')"
          cluster_instances="$("$K" --kubeconfig "$C" -n platform-databases get cluster.postgresql.cnpg.io/platform-postgres \
            -o jsonpath='{.spec.instances}' 2>/dev/null || true)"
          cluster_ready="$("$K" --kubeconfig "$C" -n platform-databases get cluster.postgresql.cnpg.io/platform-postgres \
            -o jsonpath='{.status.readyInstances}' 2>/dev/null || true)"
          cluster_phase="$("$K" --kubeconfig "$C" -n platform-databases get cluster.postgresql.cnpg.io/platform-postgres \
            -o jsonpath='{.status.phase}' 2>/dev/null || true)"
          case "${cluster_instances}" in ""|*[!0-9]*) cluster_instances=0 ;; esac
          case "${cluster_ready}" in ""|*[!0-9]*) cluster_ready=0 ;; esac
          echo "platform_postgres_rw_service=present ready_endpoints=${ready_endpoints} cluster_ready=${cluster_ready}/${cluster_instances} cluster_phase=${cluster_phase:-unknown}"
          if [ "${ready_endpoints}" -ge 1 ]; then
            if [ "${cluster_instances}" -gt 0 ] && [ "${cluster_ready}" -lt "${cluster_instances}" ]; then
              echo "platform_postgres_ha_state=progressing ready=${cluster_ready}/${cluster_instances} action=continue-woodpecker-repair"
            fi
            exit 0
          fi
          "$K" --kubeconfig "$C" -n platform-databases get pods,svc,endpointslice,clusters.postgresql.cnpg.io,databases.postgresql.cnpg.io -o wide 2>&1 | redact || true
          sleep 10
        done

        echo "result=fail reason=woodpecker-postgres-backend-not-ready-after-auto-repair"
        echo "===== platform-postgres application ====="
        "$K" --kubeconfig "$C" -n argocd get application/platform-postgres -o wide 2>&1 | redact || true
        "$K" --kubeconfig "$C" -n argocd describe application/platform-postgres 2>&1 |
          sed -n '/Status:/,/Events:/p' |
          redact || true
        echo "===== platform-databases runtime ====="
        "$K" --kubeconfig "$C" -n platform-databases get pods,svc,endpoints,endpointslice,clusters.postgresql.cnpg.io,databases.postgresql.cnpg.io -o wide 2>&1 | redact || true
        exit 1
      args:
        executable: /bin/bash
      register: platform_woodpecker_postgres_backend_recheck
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      when: >
        platform_woodpecker_repair_auto_prerequisites_effective | bool and
        platform_woodpecker_postgres_backend_check.rc | int != 0

    - name: Stop when Woodpecker PostgreSQL backend is missing
      ansible.builtin.fail:
        msg: |
          {% set backend_output = (platform_woodpecker_postgres_backend_recheck.stdout | default('', true)) or (platform_woodpecker_postgres_backend_check.stdout | default('', true)) %}
          {% if (platform_woodpecker_postgres_auto_repair | default({})).stdout | default('', true) %}
          Automatic prerequisite repair output:
          {{ platform_woodpecker_postgres_auto_repair.stdout | default('not run') }}

          {% endif %}
          {% if backend_output | regex_search('dial tcp [0-9.]+:8081: i/o timeout|Failed to load target state|repo-server') %}
          Argo CD could not render/sync the platform PostgreSQL backend because
          its repo-server path is unhealthy. Repair Argo CD internal service
          reachability first, then rerun the Woodpecker repair:

          make platform-argocd-service-repair
          make platform-woodpecker-repair

          {% endif %}
          {% if backend_output | regex_search('cnpg-webhook-service|mcluster\\.cnpg\\.io|failed calling webhook.*cnpg|context deadline exceeded') %}
          CloudNativePG webhook calls are timing out while applying
          platform-postgres. Restart/verify the CloudNativePG operator and
          service endpoints before rerunning Woodpecker repair:

          ansible -i inventory/hosts.local.ini node-1 -b -m shell -a '
          K=/var/lib/rancher/rke2/bin/kubectl
          C=/etc/rancher/rke2/rke2.yaml
          $K --kubeconfig "$C" -n cnpg-system rollout restart deployment/cloudnative-pg
          $K --kubeconfig "$C" -n cnpg-system rollout status deployment/cloudnative-pg --timeout=300s
          $K --kubeconfig "$C" -n cnpg-system get pods,svc,endpointslice -o wide
          '

          make platform-woodpecker-repair

          {% endif %}
          {% if backend_output | regex_search('blocked-needs-PLATFORM_WOODPECKER_REPAIR_RESET_UNRECOVERABLE_POSTGRES') %}
          platform-postgres is unrecoverable and still has PVCs, so automatic
          repair did not delete it. If this is an empty redeploy and the
          platform-postgres database contains no real data, rerun:

          PLATFORM_WOODPECKER_REPAIR_RESET_UNRECOVERABLE_POSTGRES=true make platform-woodpecker-repair

          {% endif %}
          {% if backend_output | regex_search('AttachVolume\\.Attach failed|not ready for workloads|longhornVolume=') %}
          The platform PostgreSQL PVC is blocked by a Longhorn attach/volume
          readiness problem. PostgreSQL init cannot start until the Longhorn
          volume backing platform-databases/platform-postgres-1 is healthy.

          For an empty first deployment where platform-postgres has never
          initialized, the fastest recovery is to delete and recreate only the
          stuck platform PostgreSQL PVC/PV/Longhorn volume, then rerun:

          make platform-woodpecker-repair

          Do not delete this PVC if the database already contains real data.

          {% endif %}
          {% if backend_output | regex_search('ReplicaSchedulingFailure|insufficient storage|disks are unavailable') %}
          Longhorn cannot schedule enough replicas for the platform PostgreSQL
          volume. In this deployment the platform-postgres PVC is 50Gi on the
          longhorn-critical StorageClass, so three Longhorn replicas need
          schedulable disk capacity on the RKE2 nodes.

          Fix Longhorn capacity/disk scheduling first:

          make platform-longhorn-bootstrap

          Then check the Longhorn node disk state:

          ansible -i inventory/hosts.local.ini rke2_servers -b -m shell -a 'df -h /var/lib/longhorn || df -h /'

          After Longhorn has enough schedulable free space, rerun:

          make platform-woodpecker-repair

          If this is still an empty first deployment and CloudNativePG now says
          platform-postgres is unrecoverable, reset only the empty
          platform-postgres PVC/PV/Longhorn volume after fixing capacity. Do
          not reset it if it ever contained real database data.

          {% endif %}
          Woodpecker is configured for PostgreSQL, but the required
          platform PostgreSQL backend is not ready.

          Woodpecker cannot start until this Kubernetes service has ready
          endpoints:
          - platform-databases/platform-postgres-rw

          Backend check output:
          {{ platform_woodpecker_postgres_backend_check.stdout | default('not run') }}

          Usual recovery:
          1. Sync the private GitOps source that Argo CD reads.
          2. Ensure the platform-postgres Argo CD Application exists and is Synced.
          3. Rerun:
             make platform-woodpecker-repair

          If the platform-postgres Application is absent, rerun the Argo CD
          application registration with your PLATFORM_REPO_URL and
          PLATFORM_APPLY_GITOPS=true before rerunning this repair.
      run_once: true
      when: >
        platform_woodpecker_postgres_backend_check.rc | int != 0 and
        ((platform_woodpecker_postgres_backend_recheck | default({})).rc | default(1) | int != 0)

    - name: Verify PostgreSQL service path from the Woodpecker server node
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        CHECK_ID="$(date +%s)-$$"
        CHECK_NAME="platform-woodpecker-postgres-check-${CHECK_ID}"
        CHECK_IMAGE="{{ platform_woodpecker_repair_check_image_effective }}"
        TIMEOUT={{ platform_woodpecker_repair_timeout_effective }}

        workload=""
        for candidate in statefulset/woodpecker-server deployment/woodpecker-server; do
          if "$K" --kubeconfig "$C" -n woodpecker get "${candidate}" >/dev/null 2>&1; then
            workload="${candidate}"
            break
          fi
        done
        if [ -z "${workload}" ]; then
          echo "woodpecker_server_workload=absent postgres_service_path_check=skipped"
          exit 0
        fi
        driver="$("$K" --kubeconfig "$C" -n woodpecker get "${workload}" \
          -o jsonpath='{range .spec.template.spec.containers[*].env[?(@.name=="WOODPECKER_DATABASE_DRIVER")]}{.value}{"\n"}{end}' 2>/dev/null |
          tail -n 1 || true)"
        case "${driver}" in
          postgres|postgresql) ;;
          *)
            echo "woodpecker_database_driver=${driver:-unset} postgres_service_path_check=skipped"
            exit 0
            ;;
        esac

        server_node="$("$K" --kubeconfig "$C" -n woodpecker get pods \
          -l app.kubernetes.io/name=server \
          -o jsonpath='{range .items[*]}{.spec.nodeName}{"\n"}{end}' 2>/dev/null |
          awk 'NF { print; exit }')"
        if [ -z "${server_node}" ]; then
          server_node="$("$K" --kubeconfig "$C" -n woodpecker get pods \
            -o jsonpath='{range .items[?(@.metadata.name=="woodpecker-server-0")]}{.spec.nodeName}{"\n"}{end}' 2>/dev/null || true)"
        fi

        service_ip="$("$K" --kubeconfig "$C" -n platform-databases get \
          service/platform-postgres-rw -o jsonpath='{.spec.clusterIP}')"
        internal_policy="$("$K" --kubeconfig "$C" -n platform-databases get \
          service/platform-postgres-rw -o jsonpath='{.spec.internalTrafficPolicy}' 2>/dev/null || true)"
        endpoint_ips="$("$K" --kubeconfig "$C" -n platform-databases get endpointslice \
          -l kubernetes.io/service-name=platform-postgres-rw \
          -o jsonpath='{range .items[*].endpoints[*].addresses[*]}{.}{" "}{end}' 2>/dev/null | xargs || true)"
        echo "woodpecker_server_node=${server_node:-unscheduled}"
        echo "postgres_service_ip=${service_ip:-missing} internal_traffic_policy=${internal_policy:-Cluster}"
        echo "postgres_ready_endpoint_ips=${endpoint_ips:-none}"
        if [ "${internal_policy:-Cluster}" = "Local" ]; then
          "$K" --kubeconfig "$C" -n platform-databases patch \
            service/platform-postgres-rw --type merge \
            -p '{"spec":{"internalTrafficPolicy":"Cluster"}}'
          echo "result=repaired reason=postgres-service-internal-traffic-policy value=Cluster"
        fi

        "$K" --kubeconfig "$C" -n woodpecker delete pod \
          -l platform.gitops/check=woodpecker-postgres \
          --ignore-not-found=true --wait=false >/dev/null 2>&1 || true
        node_line=""
        if [ -n "${server_node}" ]; then
          node_line="  nodeName: ${server_node}"
        fi
        manifest="$(mktemp)"
        cat >"${manifest}" <<YAML
        apiVersion: v1
        kind: Pod
        metadata:
          name: ${CHECK_NAME}
          namespace: woodpecker
          labels:
            platform.gitops/check: woodpecker-postgres
        spec:
        ${node_line}
          restartPolicy: Never
          tolerations:
            - operator: Exists
          containers:
            - name: check
              image: ${CHECK_IMAGE}
              imagePullPolicy: IfNotPresent
              env:
                - name: SERVICE_IP
                  value: "${service_ip}"
                - name: ENDPOINT_IPS
                  value: "${endpoint_ips}"
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  host=platform-postgres-rw.platform-databases.svc.cluster.local
                  port=5432
                  probe_tcp() {
                    label="\$1"
                    target="\$2"
                    tool=none
                    rc=127
                    : >/tmp/platform-postgres-probe-error
                    if command -v bash >/dev/null 2>&1 && command -v timeout >/dev/null 2>&1; then
                      tool=bash-dev-tcp
                      if timeout 10 bash -c 'exec 3<>/dev/tcp/\$1/\$2' _ \
                        "\${target}" "\${port}" 2>/tmp/platform-postgres-probe-error; then
                        rc=0
                      else
                        rc=\$?
                      fi
                    elif command -v nc >/dev/null 2>&1; then
                      tool=netcat
                      if nc -z -v -w 10 "\${target}" "\${port}" \
                        2>/tmp/platform-postgres-probe-error; then
                        rc=0
                      else
                        rc=\$?
                      fi
                    elif command -v curl >/dev/null 2>&1; then
                      tool=curl-connect-only
                      if curl --connect-only --silent --show-error \
                        --connect-timeout 10 --max-time 10 \
                        "telnet://\${target}:\${port}" \
                        2>/tmp/platform-postgres-probe-error; then
                        rc=0
                      else
                        rc=\$?
                      fi
                    fi
                    detail="\$(tr '\n' ' ' </tmp/platform-postgres-probe-error 2>/dev/null || true)"
                    echo "probe=\${label} target=\${target}:\${port} tool=\${tool} rc=\${rc} detail=\${detail:-none}"
                    return "\${rc}"
                  }

                  echo "===== PostgreSQL probe resolver ====="
                  cat /etc/resolv.conf || true
                  if command -v getent >/dev/null 2>&1; then
                    getent hosts "\${host}" || true
                  elif command -v nslookup >/dev/null 2>&1; then
                    nslookup "\${host}" || true
                  fi

                  dns_service_ok=false
                  cluster_ip_ok=false
                  endpoint_ok=false
                  if probe_tcp service-dns "\${host}"; then
                    dns_service_ok=true
                  fi
                  if [ -n "\${SERVICE_IP:-}" ] && probe_tcp service-cluster-ip "\${SERVICE_IP}"; then
                    cluster_ip_ok=true
                  fi
                  for endpoint in \${ENDPOINT_IPS:-}; do
                    if probe_tcp direct-endpoint "\${endpoint}"; then
                      endpoint_ok=true
                    fi
                  done

                  if [ "\${dns_service_ok}" = "true" ]; then
                    echo "result=ok target=platform-databases/platform-postgres-rw:5432"
                    exit 0
                  fi
                  if [ "\${cluster_ip_ok}" = "true" ]; then
                    echo "result=fail reason=postgres-service-dns-unreachable"
                  elif [ "\${endpoint_ok}" = "true" ]; then
                    echo "result=fail reason=postgres-clusterip-service-path-unreachable"
                  elif ! command -v bash >/dev/null 2>&1 &&
                    ! command -v nc >/dev/null 2>&1 &&
                    ! command -v curl >/dev/null 2>&1; then
                    echo "result=fail reason=postgres-probe-tool-unavailable"
                  else
                    echo "result=fail reason=postgres-endpoint-path-unreachable"
                  fi
                  exit 1
        YAML
        if ! create_output="$("$K" --kubeconfig "$C" create -f "${manifest}" 2>&1)"; then
          printf '%s\n' "${create_output}"
          rm -f "${manifest}"
          echo "result=fail reason=woodpecker-postgres-check-pod-create-failed node=${server_node:-unscheduled}"
          exit 1
        fi
        rm -f "${manifest}"
        printf '%s\n' "${create_output}"

        deadline=$(( $(date +%s) + TIMEOUT ))
        result=1
        while [ "$(date +%s)" -lt "${deadline}" ]; do
          phase="$("$K" --kubeconfig "$C" -n woodpecker get "pod/${CHECK_NAME}" \
            -o jsonpath='{.status.phase}' 2>/dev/null || true)"
          case "${phase}" in
            Succeeded) result=0; break ;;
            Failed) break ;;
          esac
          sleep 3
        done
        "$K" --kubeconfig "$C" -n woodpecker logs "pod/${CHECK_NAME}" 2>&1 || true
        if [ "${result}" -ne 0 ]; then
          echo "result=fail reason=woodpecker-to-postgres-service-path-unreachable node=${server_node:-unscheduled}"
          "$K" --kubeconfig "$C" -n woodpecker describe "pod/${CHECK_NAME}" 2>&1 |
            sed -n '/Events:/,$p' || true
        fi
        "$K" --kubeconfig "$C" -n woodpecker delete "pod/${CHECK_NAME}" \
          --ignore-not-found=true --wait=false >/dev/null 2>&1 || true
        exit "${result}"
      args:
        executable: /bin/bash
      register: platform_woodpecker_postgres_service_path_check
      changed_when: >-
        'result=repaired reason=postgres-service-internal-traffic-policy'
        in platform_woodpecker_postgres_service_path_check.stdout
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Stop when Woodpecker PostgreSQL service-path preflight fails
      ansible.builtin.fail:
        msg: |
          Woodpecker's PostgreSQL Service has ready endpoints, but the
          in-cluster preflight did not complete successfully. The output now
          distinguishes a check-pod admission/create failure from a real
          PostgreSQL service-path failure.

          The repair target already ran the shared DNS, kube-proxy, Cilium,
          firewalld, and reverse-path-filter repair before this test. Review:

          {{ platform_woodpecker_postgres_service_path_check.stdout | default('not run') }}

          stderr:
          {{ platform_woodpecker_postgres_service_path_check.stderr | default('none') }}

          Probe classifications:
          - postgres-service-dns-unreachable: DNS name failed but ClusterIP worked.
          - postgres-clusterip-service-path-unreachable: direct endpoint worked
            but the Kubernetes Service path failed.
          - postgres-endpoint-path-unreachable: the direct pod endpoint also failed.
          - postgres-probe-tool-unavailable: the configured check image has no
            supported bounded TCP probe.

          The repair automatically normalizes the PostgreSQL Service to
          internalTrafficPolicy=Cluster. Use the classification above for any
          remaining CNI or endpoint fault before rerunning
          `make platform-woodpecker-repair`.
      when: platform_woodpecker_postgres_service_path_check.rc | int != 0
      run_once: true

    - name: Reconcile and verify Woodpecker PostgreSQL role credentials
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml

        workload=""
        for candidate in statefulset/woodpecker-server deployment/woodpecker-server; do
          if "$K" --kubeconfig "$C" -n woodpecker get "${candidate}" >/dev/null 2>&1; then
            workload="${candidate}"
            break
          fi
        done
        [ -n "${workload}" ] || exit 0
        driver="$("$K" --kubeconfig "$C" -n woodpecker get "${workload}" \
          -o jsonpath='{range .spec.template.spec.containers[*].env[?(@.name=="WOODPECKER_DATABASE_DRIVER")]}{.value}{"\n"}{end}' 2>/dev/null |
          tail -n 1 || true)"
        case "${driver}" in postgres|postgresql) ;; *) exit 0 ;; esac

        username="$("$K" --kubeconfig "$C" -n platform-databases get secret/woodpecker-database \
          -o jsonpath='{.data.username}' | base64 -d)"
        password="$("$K" --kubeconfig "$C" -n platform-databases get secret/woodpecker-database \
          -o jsonpath='{.data.password}' | base64 -d)"

        verify_login() {
          primary="$("$K" --kubeconfig "$C" -n platform-databases get pods \
            -l cnpg.io/cluster=platform-postgres,cnpg.io/instanceRole=primary \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null |
            head -n 1)"
          [ -n "${primary}" ] || return 1
          printf '%s\n' "${password}" |
            "$K" --kubeconfig "$C" -n platform-databases exec -i "pod/${primary}" -- \
              sh -ceu 'IFS= read -r PGPASSWORD; export PGPASSWORD; exec psql -h 127.0.0.1 -U "$1" -d woodpecker -qAt -c "select 1"' sh "${username}" |
            grep -qx '1'
        }

        if verify_login; then
          exit 0
        fi

        if "$K" --kubeconfig "$C" -n cnpg-system get deployment/cloudnative-pg >/dev/null 2>&1; then
          "$K" --kubeconfig "$C" -n cnpg-system rollout restart deployment/cloudnative-pg >/dev/null
          "$K" --kubeconfig "$C" -n cnpg-system rollout status deployment/cloudnative-pg --timeout=180s >/dev/null
        fi
        if "$K" --kubeconfig "$C" -n argocd get application/platform-postgres >/dev/null 2>&1; then
          "$K" --kubeconfig "$C" -n argocd annotate application/platform-postgres \
            argocd.argoproj.io/refresh=hard --overwrite >/dev/null
        fi
        for _ in $(seq 1 24); do
          if verify_login; then
            exit 0
          fi
          sleep 5
        done
        exit 1
      args:
        executable: /bin/bash
      register: platform_woodpecker_postgres_credentials_check
      changed_when: false
      failed_when: false
      no_log: true
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Stop when Woodpecker PostgreSQL credentials are not usable
      ansible.builtin.fail:
        msg: |
          The Woodpecker database Secret exists and PostgreSQL is reachable,
          but the managed `woodpecker` role cannot log in to database
          `woodpecker`. The repair restarted CloudNativePG and allowed it to
          reconcile the managed role, but the credential test still failed.

          Do not expose the Secret values. Inspect the CloudNativePG operator
          and Cluster conditions, then rerun `make platform-app-secrets` and
          `make platform-woodpecker-repair`.
      when: platform_woodpecker_postgres_credentials_check.rc | int != 0
      run_once: true

    - name: Refresh and sync Woodpecker Argo CD application
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        if ! "$K" --kubeconfig "$C" get crd applications.argoproj.io >/dev/null 2>&1; then
          echo "argocd_application_crd=absent"
          exit 0
        fi
        if ! "$K" --kubeconfig "$C" -n argocd get application/woodpecker >/dev/null 2>&1; then
          echo "argocd_application_woodpecker=absent"
          exit 0
        fi
        "$K" --kubeconfig "$C" -n argocd annotate application/woodpecker \
          argocd.argoproj.io/refresh=hard --overwrite
        revision="$("$K" --kubeconfig "$C" -n argocd get application/woodpecker \
          -o jsonpath='{.spec.source.targetRevision}' 2>/dev/null || true)"
        revision="${revision:-main}"
        "$K" --kubeconfig "$C" -n argocd patch application/woodpecker --type merge \
          -p "$(printf '{\"operation\":{\"sync\":{\"revision\":\"%s\",\"prune\":false}}}' "${revision}")" || true
      args:
        executable: /bin/bash
      register: platform_woodpecker_argocd_refresh
      changed_when: >-
        'annotated' in platform_woodpecker_argocd_refresh.stdout or
        'patched' in platform_woodpecker_argocd_refresh.stdout
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Wait for Woodpecker Argo CD sync after repair
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        TIMEOUT={{ platform_woodpecker_repair_timeout_effective }}
        if ! "$K" --kubeconfig "$C" -n argocd get application/woodpecker >/dev/null 2>&1; then
          echo "argocd_application_woodpecker=absent"
          exit 0
        fi
        deadline=$(( $(date +%s) + TIMEOUT ))
        while [ "$(date +%s)" -lt "${deadline}" ]; do
          sync_status="$("$K" --kubeconfig "$C" -n argocd get application/woodpecker -o jsonpath='{.status.sync.status}' 2>/dev/null || true)"
          health_status="$("$K" --kubeconfig "$C" -n argocd get application/woodpecker -o jsonpath='{.status.health.status}' 2>/dev/null || true)"
          operation_phase="$("$K" --kubeconfig "$C" -n argocd get application/woodpecker -o jsonpath='{.status.operationState.phase}' 2>/dev/null || true)"
          conditions="$("$K" --kubeconfig "$C" -n argocd get application/woodpecker -o jsonpath='{range .status.conditions[*]}{.type}{":"}{.message}{";"}{end}' 2>/dev/null || true)"
          echo "woodpecker sync=${sync_status:-unknown} health=${health_status:-unknown} operation=${operation_phase:-none} conditions=${conditions:-none}"
          case "${operation_phase}" in
            Error|Failed)
              exit 1
              ;;
          esac
          if [ "${sync_status}" = "Synced" ] && [ "${operation_phase}" != "Running" ]; then
            exit 0
          fi
          sleep 5
        done
        exit 1
      args:
        executable: /bin/bash
      register: platform_woodpecker_argocd_sync_wait
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Restart Woodpecker workloads after secret and source repair
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        restarted=0
        for workload in statefulset/woodpecker-server deployment/woodpecker-server statefulset/woodpecker-agent deployment/woodpecker-agent; do
          if "$K" --kubeconfig "$C" -n woodpecker get "${workload}" >/dev/null 2>&1; then
            "$K" --kubeconfig "$C" -n woodpecker rollout restart "${workload}"
            restarted=$((restarted + 1))
          fi
        done
        echo "woodpecker_workloads_restarted=${restarted}"
      args:
        executable: /bin/bash
      register: platform_woodpecker_workload_restart
      changed_when: "'woodpecker_workloads_restarted=0' not in platform_woodpecker_workload_restart.stdout"
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Wait for Woodpecker server and agents after repair
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        TIMEOUT={{ platform_woodpecker_repair_timeout_effective }}
        if ! "$K" --kubeconfig "$C" get namespace woodpecker >/dev/null 2>&1; then
          echo "woodpecker_namespace=absent"
          exit 1
        fi
        wait_controller() {
          role="$1"
          shift
          found=false
          for controller in "$@"; do
            if "$K" --kubeconfig "$C" -n woodpecker get "${controller}" >/dev/null 2>&1; then
              found=true
              echo "waiting role=${role} controller=${controller}"
              "$K" --kubeconfig "$C" -n woodpecker rollout status "${controller}" --timeout="${TIMEOUT}s"
              return $?
            fi
          done
          echo "result=fail reason=missing-woodpecker-${role}-controller"
          return 1
        }
        wait_controller server statefulset/woodpecker-server deployment/woodpecker-server
        wait_controller agent statefulset/woodpecker-agent deployment/woodpecker-agent
      args:
        executable: /bin/bash
      register: platform_woodpecker_rollout_wait
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Verify Woodpecker runtime images and service endpoints after repair
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        EXPECTED_TAG="{{ platform_woodpecker_repair_expected_image_tag_effective }}"
        case "${EXPECTED_TAG}" in
          [0-9]*)
            EXPECTED_TAG="v${EXPECTED_TAG}"
            ;;
        esac
        failed=0
        server_seen=0
        agent_seen=0
        if ! "$K" --kubeconfig "$C" get namespace woodpecker >/dev/null 2>&1; then
          echo "result=fail reason=woodpecker-namespace-absent"
          exit 1
        fi
        echo "expected_woodpecker_image_tag=${EXPECTED_TAG}"
        pods="$("$K" --kubeconfig "$C" -n woodpecker get pods -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.status.phase}{"|"}{range .status.containerStatuses[*]}{.ready}{","}{.restartCount}{","}{.state.waiting.reason}{";"}{end}{"|"}{range .spec.containers[*]}{.image}{" "}{end}{"\n"}{end}' 2>/dev/null || true)"
        pods_file="$(mktemp)"
        printf '%s\n' "${pods}" > "${pods_file}"
        while IFS='|' read -r pod phase statuses images; do
          [ -n "${pod}" ] || continue
          role=unknown
          expected_repo=
          case "${pod}" in
            woodpecker-server*)
              role=server
              expected_repo=woodpeckerci/woodpecker-server
              server_seen=$((server_seen + 1))
              ;;
            woodpecker-agent*)
              role=agent
              expected_repo=woodpeckerci/woodpecker-agent
              agent_seen=$((agent_seen + 1))
              ;;
            *)
              continue
              ;;
          esac
          echo "role=${role} pod=${pod} phase=${phase:-unknown} statuses=${statuses:-unknown} images=${images:-unknown}"
          if [ "${phase}" != "Running" ]; then
            echo "result=fail reason=woodpecker-pod-not-running role=${role} pod=${pod} phase=${phase:-unknown}"
            failed=1
          fi
          if ! printf '%s\n' "${statuses}" | grep -q '^true,'; then
            echo "result=fail reason=woodpecker-pod-not-ready role=${role} pod=${pod} statuses=${statuses:-unknown}"
            failed=1
          fi
          for image in ${images}; do
            image_tag="${image##*:}"
            image_repo="${image%:*}"
            case "${image_repo}:${image_tag}" in
              *"${expected_repo}:${EXPECTED_TAG}") ;;
              *)
                echo "result=fail reason=woodpecker-image-tag-mismatch role=${role} pod=${pod} image=${image} expected_repo=${expected_repo} expected_tag=${EXPECTED_TAG}"
                failed=1
                ;;
            esac
          done
        done < "${pods_file}"
        rm -f "${pods_file}"
        if [ "${server_seen}" -lt 1 ]; then
          echo "result=fail reason=woodpecker-server-pods-missing"
          failed=1
        fi
        if [ "${agent_seen}" -lt 1 ]; then
          echo "result=fail reason=woodpecker-agent-pods-missing"
          failed=1
        fi
        ready_endpoints="$("$K" --kubeconfig "$C" -n woodpecker get endpointslice \
          -l kubernetes.io/service-name=woodpecker-server \
          -o jsonpath='{range .items[*].endpoints[*]}{.conditions.ready}{"\n"}{end}' 2>/dev/null |
          awk '$1 == "true" || $1 == "<none>" || $1 == "" { count++ } END { print count + 0 }')"
        echo "woodpecker_server_ready_endpoints=${ready_endpoints}"
        if [ "${ready_endpoints}" -lt 1 ]; then
          echo "result=fail reason=woodpecker-server-has-no-ready-endpoints"
          failed=1
        fi
        exit "${failed}"
      args:
        executable: /bin/bash
      register: platform_woodpecker_runtime_verify
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Collect Woodpecker crash diagnostics after repair failure
      ansible.builtin.shell: |
        set -u
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml

        redact() {
          sed -E \
            -e 's#(postgres(ql)?://[^:/ @]+:)[^@]+@#\1<redacted>@#g' \
            -e 's#(mysql://[^:/ @]+:)[^@]+@#\1<redacted>@#g' \
            -e 's#([?&](password|secret|token)=)[^[:space:]&]+#\1<redacted>#Ig' \
            -e 's#((password|secret|token)[[:space:]]*[:=][[:space:]]*)[^[:space:]]+#\1<redacted>#Ig'
        }

        echo "===== woodpecker pods/services/endpoints ====="
        "$K" --kubeconfig "$C" -n woodpecker get pods,svc,endpoints,endpointslice,pvc -o wide 2>&1 | redact || true

        echo "===== woodpecker app status ====="
        "$K" --kubeconfig "$C" -n argocd get application/woodpecker -o wide 2>&1 | redact || true
        "$K" --kubeconfig "$C" -n argocd get application/woodpecker \
          -o jsonpath='{range .status.conditions[*]}{.type}{": "}{.message}{"\n"}{end}' 2>&1 | redact || true

        echo "===== woodpecker workload env refs ====="
        for workload in statefulset/woodpecker-server deployment/woodpecker-server statefulset/woodpecker-agent deployment/woodpecker-agent; do
          if "$K" --kubeconfig "$C" -n woodpecker get "${workload}" >/dev/null 2>&1; then
            echo "--- ${workload} ---"
            "$K" --kubeconfig "$C" -n woodpecker get "${workload}" \
              -o jsonpath='images={range .spec.template.spec.containers[*]}{.image}{" "}{end}{"\n"}env_names={range .spec.template.spec.containers[*].env[*]}{.name}{" "}{end}{"\n"}env_from_secrets={range .spec.template.spec.containers[*].envFrom[*].secretRef}{.name}{" "}{end}{"\n"}' 2>&1 | redact || true
          fi
        done

        echo "===== required secrets state ====="
        for item in \
          woodpecker/woodpecker-forgejo-oauth \
          woodpecker/woodpecker-database \
          platform-databases/woodpecker-database
        do
          ns="${item%/*}"
          secret="${item#*/}"
          if "$K" --kubeconfig "$C" -n "${ns}" get "secret/${secret}" >/dev/null 2>&1; then
            keys="$("$K" --kubeconfig "$C" -n "${ns}" get "secret/${secret}" \
              -o go-template='{{ "{{" }} range $key, $_ := .data {{ "}}" }}{{ "{{" }} $key {{ "}}" }} {{ "{{" }} end {{ "}}" }}' 2>/dev/null || true)"
            echo "secret=${item} state=present keys=${keys:-none}"
          else
            echo "secret=${item} state=absent"
          fi
        done

        echo "===== platform postgres state ====="
        "$K" --kubeconfig "$C" -n platform-databases get pods,svc,clusters.postgresql.cnpg.io,databases.postgresql.cnpg.io -o wide 2>&1 | redact || true

        echo "===== woodpecker logs and events ====="
        pods="$("$K" --kubeconfig "$C" -n woodpecker get pods \
          -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null |
          grep '^woodpecker-' || true)"
        for pod in ${pods}; do
          echo "--- pod/${pod} current logs ---"
          "$K" --kubeconfig "$C" -n woodpecker logs "pod/${pod}" --all-containers --tail=120 2>&1 | redact || true
          echo "--- pod/${pod} previous logs ---"
          "$K" --kubeconfig "$C" -n woodpecker logs "pod/${pod}" --all-containers --previous --tail=120 2>&1 | redact || true
          echo "--- pod/${pod} events ---"
          "$K" --kubeconfig "$C" -n woodpecker describe "pod/${pod}" 2>&1 |
            sed -n '/Events:/,$p' |
            tail -120 |
            redact || true
        done
      args:
        executable: /bin/bash
      register: platform_woodpecker_failure_diagnostics
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      when: >
        ((platform_woodpecker_argocd_sync_wait | default({})).rc | default(0) | int != 0) or
        ((platform_woodpecker_rollout_wait | default({})).rc | default(0) | int != 0) or
        ((platform_woodpecker_runtime_verify | default({})).rc | default(0) | int != 0)

    - name: Stop after Woodpecker repair failure
      ansible.builtin.fail:
        msg: |
          Woodpecker did not become reconciled, rolled out, and image-aligned
          within {{ platform_woodpecker_repair_timeout_effective }}s.

          Argo CD sync wait:
          rc={{ (platform_woodpecker_argocd_sync_wait | default({})).rc | default('not run') }}
          stdout:
          {{ (platform_woodpecker_argocd_sync_wait | default({})).stdout | default('not run') }}
          stderr:
          {{ (platform_woodpecker_argocd_sync_wait | default({})).stderr | default('not run') }}

          Rollout wait:
          rc={{ (platform_woodpecker_rollout_wait | default({})).rc | default('not run') }}
          stdout:
          {{ (platform_woodpecker_rollout_wait | default({})).stdout | default('not run') }}
          stderr:
          {{ (platform_woodpecker_rollout_wait | default({})).stderr | default('not run') }}

          Runtime verification:
          rc={{ (platform_woodpecker_runtime_verify | default({})).rc | default('not run') }}
          stdout:
          {{ (platform_woodpecker_runtime_verify | default({})).stdout | default('not run') }}
          stderr:
          {{ (platform_woodpecker_runtime_verify | default({})).stderr | default('not run') }}

          Failure diagnostics:
          {{ (platform_woodpecker_failure_diagnostics | default({})).stdout | default('not run') }}

          If runtime verification shows `woodpecker-image-tag-mismatch`, the
          Argo CD source still contains stale rendered Woodpecker values. For
          example, `woodpecker-server:3.16.0` must be rendered and synced as
          `woodpecker-server:v3.16.0`.

          Update your private/seed deployment values, sync them into the GitOps
          source that Argo CD reads, and rerun:
          WOODPECKER_IMAGE_TAG=v3.16.0 make platform-render-private-values
          PLATFORM_AUTO_COMMIT=true make platform-seed-git-sync
          make platform-woodpecker-repair
      run_once: true
      when: >
        ((platform_woodpecker_argocd_sync_wait | default({})).rc | default(0) | int != 0) or
        ((platform_woodpecker_rollout_wait | default({})).rc | default(0) | int != 0) or
        ((platform_woodpecker_runtime_verify | default({})).rc | default(0) | int != 0)

    - name: Show successful Woodpecker repair result
      ansible.builtin.debug:
        msg: |
          Woodpecker Argo CD sync, server/agent rollout, runtime image tag, and
          server service endpoint checks passed. Run `make platform-ci-health`
          for the focused Argo CD/Woodpecker ingress and service-path gate.
      run_once: true
