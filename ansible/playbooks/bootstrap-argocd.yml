---
- name: Bootstrap Argo CD and optional platform GitOps applications
  hosts: rke2_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    rke2_first_server: "{{ groups['rke2_servers'][0] }}"
    platform_repo_url_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_REPO_URL') }}"
    platform_repo_username_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_REPO_USERNAME') }}"
    platform_repo_token_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_REPO_TOKEN') }}"
    platform_repo_secret_name_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_REPO_SECRET_NAME') }}"
    platform_profile_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_PROFILE') }}"
    platform_apply_gitops_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_APPLY_GITOPS') }}"
    platform_gitops_placeholder_mode_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_GITOPS_PLACEHOLDER_MODE') }}"
    platform_argocd_bootstrap_mode_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_ARGOCD_BOOTSTRAP_MODE') }}"
    platform_argocd_auto_core_fallback_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_ARGOCD_AUTO_CORE_FALLBACK') }}"
    platform_argocd_manifest_url_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_ARGOCD_MANIFEST_URL') }}"
    platform_argocd_rollout_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_ARGOCD_ROLLOUT_TIMEOUT') }}"
    platform_argocd_poll_interval_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_ARGOCD_POLL_INTERVAL') }}"
    platform_repo_url_effective: "{{ platform_repo_url | default(platform_repo_url_from_env, true) }}"
    platform_repo_username_effective: "{{ platform_repo_username | default(platform_repo_username_from_env, true) | default('x-access-token', true) }}"
    platform_repo_token_effective: "{{ platform_repo_token | default(platform_repo_token_from_env, true) | default('', true) }}"
    platform_repo_secret_name_effective: "{{ platform_repo_secret_name | default(platform_repo_secret_name_from_env, true) | default('platform-gitops-repo', true) }}"
    platform_profile_effective: "{{ platform_profile | default(platform_profile_from_env, true) | default('default', true) }}"
    platform_apply_gitops_effective: "{{ platform_apply_gitops | default(platform_apply_gitops_from_env, true) | default(false, true) | bool }}"
    platform_gitops_placeholder_mode_effective: "{{ platform_gitops_placeholder_mode | default(platform_gitops_placeholder_mode_from_env, true) | default('strict', true) }}"
    platform_argocd_bootstrap_mode_effective: "{{ platform_argocd_bootstrap_mode | default(platform_argocd_bootstrap_mode_from_env, true) | default('ha', true) }}"
    platform_argocd_auto_core_fallback_effective: "{{ platform_argocd_auto_core_fallback | default(platform_argocd_auto_core_fallback_from_env, true) | default(true, true) | bool }}"
    platform_argocd_default_manifest_url: >-
      {{
        (platform_argocd_bootstrap_mode_effective == 'core')
        | ternary(
            'https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml',
            'https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/ha/install.yaml'
          )
      }}
    platform_argocd_manifest_url_effective: "{{ platform_argocd_manifest_url | default(platform_argocd_manifest_url_from_env, true) | default(platform_argocd_default_manifest_url, true) }}"
    platform_argocd_rollout_timeout_effective: "{{ platform_argocd_rollout_timeout | default(platform_argocd_rollout_timeout_from_env, true) | default('600', true) | string | regex_replace('s$', '') | int }}"
    platform_argocd_poll_interval_effective: "{{ platform_argocd_poll_interval | default(platform_argocd_poll_interval_from_env, true) | default(10, true) | int }}"
    platform_argocd_deployments_effective: >-
      {{
        (platform_argocd_bootstrap_mode_effective == 'core')
        | ternary(
            ['argocd-applicationset-controller', 'argocd-dex-server', 'argocd-notifications-controller', 'argocd-redis', 'argocd-repo-server', 'argocd-server'],
            ['argocd-applicationset-controller', 'argocd-dex-server', 'argocd-notifications-controller', 'argocd-redis-ha-haproxy', 'argocd-repo-server', 'argocd-server']
          )
      }}
    platform_argocd_statefulsets_effective: >-
      {{
        (platform_argocd_bootstrap_mode_effective == 'core')
        | ternary(
            ['argocd-application-controller'],
            ['argocd-application-controller', 'argocd-redis-ha-server']
          )
      }}
    platform_argocd_core_deployments:
      - argocd-applicationset-controller
      - argocd-dex-server
      - argocd-notifications-controller
      - argocd-redis
      - argocd-repo-server
      - argocd-server
    platform_argocd_core_statefulsets:
      - argocd-application-controller
    platform_argocd_core_manifest_url: https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
    platform_project_file: "{{ playbook_dir }}/../../gitops/clusters/rke2-main/projects/platform-project.yaml"
    platform_applications_file: >-
      {{
        (platform_profile_effective == 'premium-3node')
        | ternary(
            playbook_dir + '/../../gitops/clusters/rke2-main/premium-3node/platform-apps.yaml',
            playbook_dir + '/../../gitops/clusters/rke2-main/platform-apps.yaml'
          )
      }}
    platform_rendered_applications_file: "/tmp/platform-gitops-{{ platform_profile_effective }}-applications.rendered.yaml"
  tasks:
    - name: Require a supported platform profile
      ansible.builtin.assert:
        that:
          - platform_profile_effective in ['default', 'premium-3node']
        fail_msg: "PLATFORM_PROFILE must be default or premium-3node."
      run_once: true

    - name: Require a supported Argo CD bootstrap mode
      ansible.builtin.assert:
        that:
          - platform_argocd_bootstrap_mode_effective in ['ha', 'core']
        fail_msg: "PLATFORM_ARGOCD_BOOTSTRAP_MODE must be ha or core."
      run_once: true

    - name: Require a supported GitOps placeholder mode
      ansible.builtin.assert:
        that:
          - platform_gitops_placeholder_mode_effective in ['strict', 'skip-incomplete']
        fail_msg: "PLATFORM_GITOPS_PLACEHOLDER_MODE must be strict or skip-incomplete."
      run_once: true

    - name: Show Argo CD bootstrap mode
      ansible.builtin.debug:
        msg: >-
          Bootstrapping Argo CD in {{ platform_argocd_bootstrap_mode_effective }} mode from
          {{ platform_argocd_manifest_url_effective }}. Rollout timeout is
          {{ platform_argocd_rollout_timeout_effective }}s. Automatic core fallback is
          {{ 'enabled' if platform_argocd_auto_core_fallback_effective else 'disabled' }}.
      run_once: true

    - name: Ensure Argo CD namespace exists
      ansible.builtin.shell: |
        set -o pipefail
        /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml \
          create namespace argocd --dry-run=client -o yaml |
          /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml apply -f -
      args:
        executable: /bin/bash
      register: platform_argocd_namespace
      changed_when: "'created' in platform_argocd_namespace.stdout or 'configured' in platform_argocd_namespace.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Remove stale Argo CD HA Redis resources for core bootstrap mode
      ansible.builtin.command: >-
        /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
        -n argocd delete
        deployment/argocd-redis-ha-haproxy
        statefulset/argocd-redis-ha-server
        serviceaccount/argocd-redis-ha
        serviceaccount/argocd-redis-ha-haproxy
        role/argocd-redis-ha
        role/argocd-redis-ha-haproxy
        rolebinding/argocd-redis-ha
        rolebinding/argocd-redis-ha-haproxy
        service/argocd-redis-ha
        service/argocd-redis-ha-haproxy
        service/argocd-redis-ha-announce-0
        service/argocd-redis-ha-announce-1
        service/argocd-redis-ha-announce-2
        configmap/argocd-redis-ha-configmap
        configmap/argocd-redis-ha-health-configmap
        networkpolicy/argocd-redis-ha-proxy-network-policy
        networkpolicy/argocd-redis-ha-server-network-policy
        poddisruptionbudget/argocd-redis-ha-haproxy
        poddisruptionbudget/argocd-redis-ha-server
        --ignore-not-found=true
      register: platform_argocd_core_cleanup
      changed_when: "'deleted' in platform_argocd_core_cleanup.stdout"
      delegate_to: "{{ rke2_first_server }}"
      when: platform_argocd_bootstrap_mode_effective == 'core'
      run_once: true

    - name: Apply Argo CD bootstrap manifest
      block:
        - name: Apply Argo CD bootstrap manifest with server-side apply
          ansible.builtin.command: >-
            /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
            apply --server-side --force-conflicts --field-manager=platform-gitops-bootstrap
            -n argocd -f {{ platform_argocd_manifest_url_effective }}
          register: platform_argocd_apply
          changed_when: >-
            'created' in platform_argocd_apply.stdout or
            'configured' in platform_argocd_apply.stdout or
            'serverside-applied' in platform_argocd_apply.stdout
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
      rescue:
        - name: Collect Argo CD manifest apply diagnostics
          ansible.builtin.shell: |
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            echo "===== argocd namespace resources ====="
            "$K" --kubeconfig "$C" -n argocd get all || true
            echo "===== argocd CRDs ====="
            "$K" --kubeconfig "$C" get crd | grep -E 'argoproj|NAME' || true
          args:
            executable: /bin/bash
          register: platform_argocd_apply_diagnostics
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Print Argo CD manifest apply diagnostics
          ansible.builtin.debug:
            var: platform_argocd_apply_diagnostics.stdout_lines
          run_once: true

        - name: Stop after Argo CD manifest apply failure
          ansible.builtin.fail:
            msg: |
              Argo CD bootstrap manifest apply failed.

              If the failure mentions "metadata.annotations: Too long", it means the manifest was applied with client-side apply before this fix.
              This playbook now uses server-side apply to avoid the oversized last-applied annotation on Argo CD CRDs.

              Rerun:
              make platform-argocd
          run_once: true

    - name: Show Argo CD workload snapshot before rollout wait
      ansible.builtin.shell: |
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        "$K" --kubeconfig "$C" -n argocd get deployment,statefulset,pods -o wide || true
      args:
        executable: /bin/bash
      register: platform_argocd_initial_snapshot
      changed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Print Argo CD workload snapshot before rollout wait
      ansible.builtin.debug:
        var: platform_argocd_initial_snapshot.stdout_lines
      run_once: true

    - name: Force core Argo CD Redis parameters for core bootstrap mode
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml

        "$K" --kubeconfig "$C" -n argocd patch configmap argocd-cmd-params-cm \
          --type merge \
          -p '{"data":{"redis.server":"argocd-redis:6379"}}'

        for deployment in {{ platform_argocd_core_deployments | join(' ') }}; do
          if "$K" --kubeconfig "$C" -n argocd get "deployment/${deployment}" >/dev/null 2>&1; then
            "$K" --kubeconfig "$C" -n argocd rollout restart "deployment/${deployment}"
          fi
        done

        for statefulset in {{ platform_argocd_core_statefulsets | join(' ') }}; do
          if "$K" --kubeconfig "$C" -n argocd get "statefulset/${statefulset}" >/dev/null 2>&1; then
            "$K" --kubeconfig "$C" -n argocd rollout restart "statefulset/${statefulset}"
          fi
        done

        if "$K" --kubeconfig "$C" -n argocd get pod/argocd-application-controller-0 >/dev/null 2>&1; then
          "$K" --kubeconfig "$C" -n argocd delete pod/argocd-application-controller-0 --wait=true --timeout=90s
        fi
      args:
        executable: /bin/bash
      register: platform_argocd_core_redis_patch
      changed_when: >-
        'patched' in platform_argocd_core_redis_patch.stdout or
        'restarted' in platform_argocd_core_redis_patch.stdout or
        'deleted' in platform_argocd_core_redis_patch.stdout
      delegate_to: "{{ rke2_first_server }}"
      when: platform_argocd_bootstrap_mode_effective == 'core'
      run_once: true

    - name: Wait for Argo CD workloads to become available
      block:
        - name: Poll Argo CD deployment availability
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            for deployment in {{ platform_argocd_deployments_effective | join(' ') }}; do
              "$K" --kubeconfig "$C" -n argocd get "deployment/${deployment}" >/dev/null
              "$K" --kubeconfig "$C" -n argocd wait --for=condition=Available "deployment/${deployment}" --timeout={{ platform_argocd_poll_interval_effective }}s
            done
          args:
            executable: /bin/bash
          register: platform_argocd_deployment_rollout
          retries: "{{ (((platform_argocd_rollout_timeout_effective | int) / (platform_argocd_poll_interval_effective | int)) | round(0, 'ceil') | int) + 1 }}"
          delay: "{{ platform_argocd_poll_interval_effective }}"
          until: platform_argocd_deployment_rollout.rc == 0
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Poll Argo CD statefulset rollout
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            for statefulset in {{ platform_argocd_statefulsets_effective | join(' ') }}; do
              "$K" --kubeconfig "$C" -n argocd get "statefulset/${statefulset}" >/dev/null
              "$K" --kubeconfig "$C" -n argocd rollout status "statefulset/${statefulset}" --timeout={{ platform_argocd_poll_interval_effective }}s
            done
          args:
            executable: /bin/bash
          register: platform_argocd_statefulset_rollout
          retries: "{{ (((platform_argocd_rollout_timeout_effective | int) / (platform_argocd_poll_interval_effective | int)) | round(0, 'ceil') | int) + 1 }}"
          delay: "{{ platform_argocd_poll_interval_effective }}"
          until: platform_argocd_statefulset_rollout.rc == 0
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
      rescue:
        - name: Collect Argo CD bootstrap diagnostics
          ansible.builtin.shell: |
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            echo "===== failing argocd pods first ====="
            echo "===== argocd redis command parameters ====="
            "$K" --kubeconfig "$C" -n argocd get configmap argocd-cmd-params-cm \
              -o jsonpath='redis.server={.data.redis\.server}{"\n"}redis.db={.data.redis\.db}{"\n"}redis.compression={.data.redis\.compression}{"\n"}' || true
            echo
            failing_pods="$("$K" --kubeconfig "$C" -n argocd get pods --no-headers 2>/dev/null |
              awk '$3 != "Running" { print $1; next } { split($2, ready, "/"); if (ready[1] != ready[2]) print $1 }')"
            if [ -z "${failing_pods}" ]; then
              echo "No failing Argo CD pods detected by status."
            else
              "$K" --kubeconfig "$C" -n argocd get pods -o wide | awk 'NR==1 { print; next } $3 != "Running" { print; next } { split($2, ready, "/"); if (ready[1] != ready[2]) print }'
              for pod_name in ${failing_pods}; do
                echo "--- failing pod/${pod_name} status ---"
                "$K" --kubeconfig "$C" -n argocd describe "pod/${pod_name}" | sed -n '/Init Containers:/,/Conditions:/p;/Containers:/,/Conditions:/p;/Events:/,$p' || true
                for container_name in $("$K" --kubeconfig "$C" -n argocd get "pod/${pod_name}" -o jsonpath='{range .spec.initContainers[*]}{.name}{"\n"}{end}{range .spec.containers[*]}{.name}{"\n"}{end}' 2>/dev/null); do
                  echo "--- failing pod/${pod_name} logs container/${container_name} current ---"
                  "$K" --kubeconfig "$C" -n argocd logs "pod/${pod_name}" -c "${container_name}" --tail=80 || true
                  echo "--- failing pod/${pod_name} logs container/${container_name} previous ---"
                  "$K" --kubeconfig "$C" -n argocd logs "pod/${pod_name}" -c "${container_name}" --previous --tail=80 || true
                done
              done
            fi
            echo
            echo "===== argocd pods ====="
            "$K" --kubeconfig "$C" -n argocd get pods -o wide || true
            echo "===== argocd workloads ====="
            "$K" --kubeconfig "$C" -n argocd get deployment,statefulset,replicaset -o wide || true
            echo "===== argocd services ====="
            "$K" --kubeconfig "$C" -n argocd get svc -o wide || true
            echo "===== argocd images ====="
            "$K" --kubeconfig "$C" -n argocd get pods -o jsonpath='{range .items[*]}pod:{.metadata.name}{"\n"}{range .spec.initContainers[*]}  init:{.name}={.image}{"\n"}{end}{range .spec.containers[*]}  container:{.name}={.image}{"\n"}{end}{end}' || true
            echo
            echo "===== argocd pod events/details ====="
            for pod in $("$K" --kubeconfig "$C" -n argocd get pods -o name 2>/dev/null); do
              echo "--- ${pod} ---"
              "$K" --kubeconfig "$C" -n argocd describe "${pod}" | sed -n '/Containers:/,/Conditions:/p;/Events:/,$p' || true
            done
            echo "===== argocd events ====="
            "$K" --kubeconfig "$C" -n argocd get events --sort-by=.lastTimestamp | tail -120 || true
          args:
            executable: /bin/bash
          register: platform_argocd_diagnostics
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Print Argo CD bootstrap diagnostics
          ansible.builtin.debug:
            var: platform_argocd_diagnostics.stdout_lines
          run_once: true

        - name: Classify Argo CD bootstrap failure
          ansible.builtin.set_fact:
            platform_argocd_failure_cause: >-
              {% set diagnostics = platform_argocd_diagnostics.stdout | default('') %}
              {% if diagnostics is search('argocd-redis-ha|redis-ha-haproxy|redis-ha-server') %}
              Argo CD HA Redis is not healthy. Review the failing Redis HA pod logs first. To continue bootstrap with the simpler non-HA control plane while troubleshooting HA Redis separately, run: make platform-argocd-core
              {% elif diagnostics is search('10\\.43\\.0\\.1:443|failed to get server version.*10\\.43\\.0\\.1|dial tcp 10\\.43\\.[0-9]+\\.[0-9]+:6379: i/o timeout|ClusterIP|service path') %}
              Kubernetes ClusterIP service path is unhealthy from the Argo CD controller pod. Repair kube-proxy/Cilium/firewalld service routing with: make platform-dns-repair
              {% elif diagnostics is search('ImagePullBackOff|ErrImagePull|Failed to pull image|failed to pull and unpack image|TLS handshake timeout|i/o timeout|connection timed out|pull access denied') %}
              Image pull or registry access problem. Check registry egress, proxy, DNS, MTU, TLS inspection, or internal mirror configuration.
              {% elif diagnostics is search('CrashLoopBackOff|Back-off restarting failed container|Error:|panic:|fatal') %}
              Argo CD pod crash. Review the pod logs and events in the diagnostic summary.
              {% elif diagnostics is search('FailedScheduling|0/[0-9]+ nodes are available|Insufficient cpu|Insufficient memory|node affinity|taint') %}
              Scheduling or node resource problem. Check CPU, memory, taints, and node readiness.
              {% elif diagnostics is search('CreateContainerConfigError|CreateContainerError|RunContainerError') %}
              Container configuration/startup problem. Review pod descriptions and events.
              {% else %}
              Rollout timed out before Argo CD became available. Review the diagnostic summary below.
              {% endif %}
            platform_argocd_ha_redis_failure: >-
              {{
                (platform_argocd_diagnostics.stdout | default(''))
                is search('Could not resolve the announce address|argocd-redis-ha|redis-ha-haproxy|redis-ha-server')
              }}
          run_once: true

        - name: Fall back to core Argo CD when HA Redis bootstrap is unhealthy
          block:
            - name: Announce automatic Argo CD core fallback
              ansible.builtin.debug:
                msg: >-
                  Argo CD HA Redis did not become healthy, so the bootstrap is switching to
                  standard/core Argo CD automatically. Re-run with
                  PLATFORM_ARGOCD_AUTO_CORE_FALLBACK=false make platform-argocd-ha
                  if you want strict HA-only failure behavior.
              run_once: true

            - name: Remove stale Argo CD HA Redis resources before core fallback
              ansible.builtin.command: >-
                /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
                -n argocd delete
                deployment/argocd-redis-ha-haproxy
                statefulset/argocd-redis-ha-server
                serviceaccount/argocd-redis-ha
                serviceaccount/argocd-redis-ha-haproxy
                role/argocd-redis-ha
                role/argocd-redis-ha-haproxy
                rolebinding/argocd-redis-ha
                rolebinding/argocd-redis-ha-haproxy
                service/argocd-redis-ha
                service/argocd-redis-ha-haproxy
                service/argocd-redis-ha-announce-0
                service/argocd-redis-ha-announce-1
                service/argocd-redis-ha-announce-2
                configmap/argocd-redis-ha-configmap
                configmap/argocd-redis-ha-health-configmap
                networkpolicy/argocd-redis-ha-proxy-network-policy
                networkpolicy/argocd-redis-ha-server-network-policy
                poddisruptionbudget/argocd-redis-ha-haproxy
                poddisruptionbudget/argocd-redis-ha-server
                --ignore-not-found=true
              register: platform_argocd_fallback_cleanup
              changed_when: "'deleted' in platform_argocd_fallback_cleanup.stdout"
              delegate_to: "{{ rke2_first_server }}"
              run_once: true

            - name: Apply standard Argo CD manifest after HA Redis fallback
              ansible.builtin.command: >-
                /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
                apply --server-side --force-conflicts --field-manager=platform-gitops-bootstrap
                -n argocd -f {{ platform_argocd_core_manifest_url }}
              register: platform_argocd_fallback_apply
              changed_when: >-
                'created' in platform_argocd_fallback_apply.stdout or
                'configured' in platform_argocd_fallback_apply.stdout or
                'serverside-applied' in platform_argocd_fallback_apply.stdout
              delegate_to: "{{ rke2_first_server }}"
              run_once: true

            - name: Force core Argo CD Redis parameters after HA Redis fallback
              ansible.builtin.shell: |
                set -o pipefail
                K=/var/lib/rancher/rke2/bin/kubectl
                C=/etc/rancher/rke2/rke2.yaml

                "$K" --kubeconfig "$C" -n argocd patch configmap argocd-cmd-params-cm \
                  --type merge \
                  -p '{"data":{"redis.server":"argocd-redis:6379"}}'

                for deployment in {{ platform_argocd_core_deployments | join(' ') }}; do
                  if "$K" --kubeconfig "$C" -n argocd get "deployment/${deployment}" >/dev/null 2>&1; then
                    "$K" --kubeconfig "$C" -n argocd rollout restart "deployment/${deployment}"
                  fi
                done

                for statefulset in {{ platform_argocd_core_statefulsets | join(' ') }}; do
                  if "$K" --kubeconfig "$C" -n argocd get "statefulset/${statefulset}" >/dev/null 2>&1; then
                    "$K" --kubeconfig "$C" -n argocd rollout restart "statefulset/${statefulset}"
                  fi
                done

                if "$K" --kubeconfig "$C" -n argocd get pod/argocd-application-controller-0 >/dev/null 2>&1; then
                  "$K" --kubeconfig "$C" -n argocd delete pod/argocd-application-controller-0 --wait=true --timeout=90s
                fi
              args:
                executable: /bin/bash
              register: platform_argocd_fallback_redis_patch
              changed_when: >-
                'patched' in platform_argocd_fallback_redis_patch.stdout or
                'restarted' in platform_argocd_fallback_redis_patch.stdout or
                'deleted' in platform_argocd_fallback_redis_patch.stdout
              delegate_to: "{{ rke2_first_server }}"
              run_once: true

            - name: Wait for core Argo CD workloads after fallback
              block:
                - name: Wait for core Argo CD deployments after fallback
                  ansible.builtin.shell: |
                    set -o pipefail
                    K=/var/lib/rancher/rke2/bin/kubectl
                    C=/etc/rancher/rke2/rke2.yaml
                    for deployment in {{ platform_argocd_core_deployments | join(' ') }}; do
                      "$K" --kubeconfig "$C" -n argocd get "deployment/${deployment}" >/dev/null
                      "$K" --kubeconfig "$C" -n argocd wait --for=condition=Available "deployment/${deployment}" --timeout={{ platform_argocd_poll_interval_effective }}s
                    done
                  args:
                    executable: /bin/bash
                  register: platform_argocd_fallback_deployments
                  retries: "{{ (((platform_argocd_rollout_timeout_effective | int) / (platform_argocd_poll_interval_effective | int)) | round(0, 'ceil') | int) + 1 }}"
                  delay: "{{ platform_argocd_poll_interval_effective }}"
                  until: platform_argocd_fallback_deployments.rc == 0
                  changed_when: false
                  delegate_to: "{{ rke2_first_server }}"
                  run_once: true

                - name: Wait for core Argo CD statefulsets after fallback
                  ansible.builtin.shell: |
                    set -o pipefail
                    K=/var/lib/rancher/rke2/bin/kubectl
                    C=/etc/rancher/rke2/rke2.yaml
                    for statefulset in {{ platform_argocd_core_statefulsets | join(' ') }}; do
                      "$K" --kubeconfig "$C" -n argocd get "statefulset/${statefulset}" >/dev/null
                      "$K" --kubeconfig "$C" -n argocd rollout status "statefulset/${statefulset}" --timeout={{ platform_argocd_poll_interval_effective }}s
                    done
                  args:
                    executable: /bin/bash
                  register: platform_argocd_fallback_statefulsets
                  retries: "{{ (((platform_argocd_rollout_timeout_effective | int) / (platform_argocd_poll_interval_effective | int)) | round(0, 'ceil') | int) + 1 }}"
                  delay: "{{ platform_argocd_poll_interval_effective }}"
                  until: platform_argocd_fallback_statefulsets.rc == 0
                  changed_when: false
                  delegate_to: "{{ rke2_first_server }}"
                  run_once: true
              rescue:
                - name: Collect core Argo CD fallback diagnostics
                  ansible.builtin.shell: |
                    K=/var/lib/rancher/rke2/bin/kubectl
                    C=/etc/rancher/rke2/rke2.yaml
                    echo "===== argocd redis command parameters ====="
                    "$K" --kubeconfig "$C" -n argocd get configmap argocd-cmd-params-cm \
                      -o jsonpath='redis.server={.data.redis\.server}{"\n"}redis.db={.data.redis\.db}{"\n"}redis.compression={.data.redis\.compression}{"\n"}' || true
                    echo
                    echo "===== argocd pods ====="
                    "$K" --kubeconfig "$C" -n argocd get pods -o wide || true
                    echo
                    echo "===== argocd workloads ====="
                    "$K" --kubeconfig "$C" -n argocd get deployment,statefulset,replicaset -o wide || true
                    echo
                    echo "===== argocd application-controller statefulset ====="
                    "$K" --kubeconfig "$C" -n argocd describe statefulset/argocd-application-controller || true
                    echo
                    echo "===== failing argocd pod details ====="
                    failing_pods="$("$K" --kubeconfig "$C" -n argocd get pods --no-headers 2>/dev/null |
                      awk '$3 != "Running" { print $1; next } { split($2, ready, "/"); if (ready[1] != ready[2]) print $1 }')"
                    if [ -z "${failing_pods}" ]; then
                      echo "No failing pods detected by phase/ready columns."
                    else
                      for pod_name in ${failing_pods}; do
                        echo "--- pod/${pod_name} describe ---"
                        "$K" --kubeconfig "$C" -n argocd describe "pod/${pod_name}" | sed -n '/Init Containers:/,/Conditions:/p;/Containers:/,/Conditions:/p;/Events:/,$p' || true
                        for container_name in $("$K" --kubeconfig "$C" -n argocd get "pod/${pod_name}" -o jsonpath='{range .spec.initContainers[*]}{.name}{"\n"}{end}{range .spec.containers[*]}{.name}{"\n"}{end}' 2>/dev/null); do
                          echo "--- pod/${pod_name} logs container/${container_name} current ---"
                          "$K" --kubeconfig "$C" -n argocd logs "pod/${pod_name}" -c "${container_name}" --tail=120 || true
                          echo "--- pod/${pod_name} logs container/${container_name} previous ---"
                          "$K" --kubeconfig "$C" -n argocd logs "pod/${pod_name}" -c "${container_name}" --previous --tail=120 || true
                        done
                      done
                    fi
                    echo
                    echo "===== argocd events ====="
                    "$K" --kubeconfig "$C" -n argocd get events --sort-by=.lastTimestamp | tail -160 || true
                  args:
                    executable: /bin/bash
                  register: platform_argocd_core_fallback_diagnostics
                  changed_when: false
                  failed_when: false
                  delegate_to: "{{ rke2_first_server }}"
                  run_once: true

                - name: Print core Argo CD fallback diagnostics
                  ansible.builtin.debug:
                    var: platform_argocd_core_fallback_diagnostics.stdout_lines
                  run_once: true

                - name: Stop after core Argo CD fallback failure
                  ansible.builtin.fail:
                    msg: |
                      Core Argo CD fallback did not become available within
                      {{ platform_argocd_rollout_timeout_effective }}s.

                      The blocking workload is usually argocd-application-controller.
                      Review the diagnostics above for pod status, scheduling,
                      image pull, crash, permission, or API connectivity errors.
                  run_once: true

            - name: Mark Argo CD core fallback successful
              ansible.builtin.set_fact:
                platform_argocd_core_fallback_succeeded: true
              run_once: true
          when:
            - platform_argocd_bootstrap_mode_effective == 'ha'
            - platform_argocd_auto_core_fallback_effective | bool
            - platform_argocd_ha_redis_failure | bool

        - name: Stop after Argo CD bootstrap failure
          ansible.builtin.fail:
            msg: |
              Argo CD did not become available within {{ platform_argocd_rollout_timeout_effective }}s.

              Likely cause:
              {{ platform_argocd_failure_cause | trim }}

              Diagnostic summary:
              {% for line in (platform_argocd_diagnostics.stdout_lines | default([]))[0:180] %}
              {{ line }}
              {% endfor %}

              To collect the live state again without changing the cluster, run:
              make platform-argocd-diagnose

              If the summary points to slow image pulls only, retry with:
              PLATFORM_ARGOCD_ROLLOUT_TIMEOUT=1200 make platform-argocd

              If only Argo CD HA Redis is failing and you need the UI now, bootstrap core Argo CD:
              make platform-argocd-core
          when: not (platform_argocd_core_fallback_succeeded | default(false) | bool)
          run_once: true

    - name: Show skipped GitOps application registration
      ansible.builtin.debug:
        msg: >-
          Argo CD is installed. GitOps applications were not registered because PLATFORM_APPLY_GITOPS is not true.
          To register platform applications, set PLATFORM_REPO_URL and run:
          PLATFORM_APPLY_GITOPS=true make platform-argocd
      when: not platform_apply_gitops_effective
      run_once: true

    - name: Require repository URL when applying GitOps applications
      ansible.builtin.assert:
        that:
          - platform_repo_url_effective | length > 0
          - not (platform_repo_url_effective is match("^<.*>$"))
        fail_msg: "Set PLATFORM_REPO_URL to the Git repository URL before running with PLATFORM_APPLY_GITOPS=true."
      when: platform_apply_gitops_effective
      run_once: true

    - name: Check selected GitOps profile for unresolved placeholders
      ansible.builtin.shell: |
        set -o pipefail
        paths=(
        {% if platform_profile_effective == 'premium-3node' %}
          "{{ playbook_dir }}/../../gitops/clusters/rke2-main/premium-3node/platform-apps.yaml"
          "{{ playbook_dir }}/../../gitops/clusters/rke2-main/projects"
          "{{ playbook_dir }}/../../gitops/clusters/rke2-main/premium-3node/apps"
          "{{ playbook_dir }}/../../gitops/clusters/rke2-main/apps/metallb"
        {% else %}
          "{{ playbook_dir }}/../../gitops/clusters/rke2-main/platform-apps.yaml"
          "{{ playbook_dir }}/../../gitops/clusters/rke2-main/projects"
          "{{ playbook_dir }}/../../gitops/clusters/rke2-main/apps"
        {% endif %}
        )
        for path in "${paths[@]}"; do
          if [ -f "$path" ]; then
            grep -nE '<[A-Z0-9_]+>' "$path" | grep -v '<THIS_REPO_URL>' || true
          elif [ -d "$path" ]; then
            find "$path" -type f \( -name '*.yaml' -o -name '*.yml' \) \
              ! -name '*.example.yaml' ! -name '*.example.yml' -print0 |
              xargs -0r grep -nE '<[A-Z0-9_]+>' 2>/dev/null | grep -v '<THIS_REPO_URL>' || true
          fi
        done
      args:
        executable: /bin/bash
      register: platform_placeholder_scan
      changed_when: false
      failed_when: false
      become: false
      delegate_to: localhost
      when: platform_apply_gitops_effective
      run_once: true

    - name: Stop before applying incomplete GitOps profile
      ansible.builtin.fail:
        msg: |
          The selected GitOps profile still has unresolved placeholders, so it was not registered in Argo CD.

          Configure these values through committed safe defaults, ignored local rendering, SOPS, External Secrets, or another private secret/config flow, then rerun:
          PLATFORM_REPO_URL=<THIS_REPO_URL> PLATFORM_APPLY_GITOPS=true make platform-argocd

          Unresolved placeholders:
          {{ platform_placeholder_scan.stdout }}
      when:
        - platform_apply_gitops_effective
        - platform_gitops_placeholder_mode_effective == 'strict'
        - platform_placeholder_scan.stdout | length > 0
      run_once: true

    - name: Render deployable GitOps applications and skip incomplete apps
      ansible.builtin.shell: |
        set -euo pipefail
        python3 scripts/render_deployable_gitops_apps.py \
          --repo-root "$PWD" \
          --applications-file "{{ platform_applications_file }}" \
          --repo-url "{{ platform_repo_url_effective }}" \
          --output "{{ platform_rendered_applications_file }}"
      args:
        executable: /bin/bash
        chdir: "{{ playbook_dir }}/../.."
      register: platform_rendered_applications
      changed_when: true
      become: false
      delegate_to: localhost
      when:
        - platform_apply_gitops_effective
        - platform_gitops_placeholder_mode_effective == 'skip-incomplete'
        - platform_placeholder_scan.stdout | length > 0
      run_once: true

    - name: Show deployable and skipped GitOps applications
      ansible.builtin.debug:
        var: platform_rendered_applications.stdout_lines
      when:
        - platform_apply_gitops_effective
        - platform_gitops_placeholder_mode_effective == 'skip-incomplete'
        - platform_placeholder_scan.stdout | length > 0
      run_once: true

    - name: Use rendered deployable GitOps application list
      ansible.builtin.set_fact:
        platform_applications_manifest_effective: "{{ lookup('ansible.builtin.file', platform_rendered_applications_file) }}"
      when:
        - platform_apply_gitops_effective
        - platform_gitops_placeholder_mode_effective == 'skip-incomplete'
        - platform_placeholder_scan.stdout | length > 0
      run_once: true

    - name: Use complete GitOps application list
      ansible.builtin.set_fact:
        platform_applications_manifest_effective: "{{ lookup('ansible.builtin.file', platform_applications_file) | replace('<THIS_REPO_URL>', platform_repo_url_effective) }}"
      when:
        - platform_apply_gitops_effective
        - platform_applications_manifest_effective is not defined
      run_once: true

    - name: Register private Git repository credentials when provided
      ansible.builtin.shell: |
        set -o pipefail
        /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml apply -f -
      args:
        executable: /bin/bash
        stdin: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: {{ platform_repo_secret_name_effective | to_json }}
            namespace: argocd
            labels:
              argocd.argoproj.io/secret-type: repository
          stringData:
            type: git
            url: {{ platform_repo_url_effective | to_json }}
            username: {{ platform_repo_username_effective | to_json }}
            password: {{ platform_repo_token_effective | to_json }}
      register: platform_repo_credentials_apply
      changed_when: "'created' in platform_repo_credentials_apply.stdout or 'configured' in platform_repo_credentials_apply.stdout"
      no_log: true
      delegate_to: "{{ rke2_first_server }}"
      when:
        - platform_apply_gitops_effective
        - platform_repo_token_effective | length > 0
      run_once: true

    - name: Show repository credential mode
      ansible.builtin.debug:
        msg: >-
          PLATFORM_REPO_TOKEN was not set, so Argo CD will try anonymous Git access to
          {{ platform_repo_url_effective }}. Set PLATFORM_REPO_USERNAME and
          PLATFORM_REPO_TOKEN for private repositories.
      when:
        - platform_apply_gitops_effective
        - platform_repo_token_effective | length == 0
      run_once: true

    - name: Apply platform Argo CD project
      ansible.builtin.shell: |
        set -o pipefail
        /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml apply -f -
      args:
        executable: /bin/bash
        stdin: "{{ lookup('ansible.builtin.file', platform_project_file) }}"
      register: platform_project_apply
      changed_when: "'created' in platform_project_apply.stdout or 'configured' in platform_project_apply.stdout"
      delegate_to: "{{ rke2_first_server }}"
      when: platform_apply_gitops_effective
      run_once: true

    - name: Register platform applications in Argo CD
      ansible.builtin.shell: |
        set -o pipefail
        /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml apply -f -
      args:
        executable: /bin/bash
        stdin: "{{ platform_applications_manifest_effective }}"
      register: platform_applications_apply
      changed_when: "'created' in platform_applications_apply.stdout or 'configured' in platform_applications_apply.stdout"
      no_log: true
      delegate_to: "{{ rke2_first_server }}"
      when: platform_apply_gitops_effective
      run_once: true

    - name: Show Argo CD access commands
      ansible.builtin.debug:
        msg:
          - "Argo CD is installed in namespace argocd."
          - "Port-forward access: kubectl -n argocd port-forward svc/argocd-server 8080:443 --address 0.0.0.0"
          - "Browser URL through port-forward: https://127.0.0.1:8080"
          - "Initial admin password command: kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d; echo"
          - "Run make platform-status for the current API, ingress, and GUI URL report."
      run_once: true
