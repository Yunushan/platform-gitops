---
- name: Deploy platform ingress foundation and publish Argo CD
  hosts: rke2_servers
  become: true
  gather_facts: false
  vars:
    rke2_first_server: "{{ groups['rke2_servers'][0] }}"
    rke2_ingress_vip_effective: "{{ rke2_ingress_vip | default(ingress_vip | default('', true), true) }}"
    platform_domain_effective: "{{ platform_domain | default(rke2_platform_domain | default((rke2_api_dns | default('', true)) | regex_replace('^api[.]', ''), true), true) }}"
    platform_ip_redirect_enabled_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_IP_REDIRECT_ENABLED') }}"
    platform_ip_redirect_target_host_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_IP_REDIRECT_TARGET_HOST') }}"
    platform_metallb_chart_repo_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_METALLB_CHART_REPO') }}"
    platform_metallb_chart_version_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_METALLB_CHART_VERSION') }}"
    platform_traefik_chart_repo_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_TRAEFIK_CHART_REPO') }}"
    platform_traefik_chart_version_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_TRAEFIK_CHART_VERSION') }}"
    platform_traefik_rollout_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_TRAEFIK_ROLLOUT_TIMEOUT') }}"
    platform_traefik_dns_check_image_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_TRAEFIK_DNS_CHECK_IMAGE') }}"
    platform_traefik_dns_check_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_TRAEFIK_DNS_CHECK_TIMEOUT') }}"
    platform_traefik_dns_retry_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_TRAEFIK_DNS_RETRY_TIMEOUT') }}"
    platform_traefik_dns_helm_attempts_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_TRAEFIK_DNS_HELM_ATTEMPTS') }}"
    platform_traefik_dns_helm_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_TRAEFIK_DNS_HELM_TIMEOUT') }}"
    platform_traefik_dns_service_path_repair_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_TRAEFIK_DNS_SERVICE_PATH_REPAIR') }}"
    platform_traefik_dns_failed_node_restart_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_TRAEFIK_DNS_FAILED_NODE_RESTART') }}"
    platform_traefik_dns_failed_node_restart_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_TRAEFIK_DNS_FAILED_NODE_RESTART_TIMEOUT') }}"
    platform_traefik_dns_coredns_replicas_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_TRAEFIK_DNS_COREDNS_REPLICAS') }}"
    platform_traefik_dns_pod_cidrs_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_DNS_POD_CIDRS') }}"
    platform_argocd_ingress_verify_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_ARGOCD_INGRESS_VERIFY_TIMEOUT') }}"
    platform_argocd_ingress_connect_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_ARGOCD_INGRESS_CONNECT_TIMEOUT') }}"
    platform_argocd_ingress_max_time_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_ARGOCD_INGRESS_MAX_TIME') }}"
    platform_argocd_ingress_controller_verify_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_ARGOCD_INGRESS_CONTROLLER_VERIFY') }}"
    platform_argocd_ingress_node_strict_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_ARGOCD_INGRESS_NODE_STRICT') }}"
    platform_argocd_ingress_vip_repair_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_ARGOCD_INGRESS_VIP_REPAIR') }}"
    platform_argocd_server_replicas_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_ARGOCD_SERVER_REPLICAS') }}"
    platform_ingress_rollout_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_INGRESS_ROLLOUT_TIMEOUT') }}"
    platform_ingress_poll_interval_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_INGRESS_POLL_INTERVAL') }}"
    platform_ingress_cleanup_helm_jobs_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_INGRESS_CLEANUP_HELM_JOBS') }}"
    platform_metallb_webhook_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_METALLB_WEBHOOK_TIMEOUT') }}"
    platform_metallb_webhook_probe_timeout_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_METALLB_WEBHOOK_PROBE_TIMEOUT') }}"
    platform_metallb_webhook_repair_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_METALLB_WEBHOOK_REPAIR') }}"
    platform_metallb_chart_repo_effective: "{{ platform_metallb_chart_repo | default(platform_metallb_chart_repo_from_env, true) | default('https://metallb.github.io/metallb', true) }}"
    platform_metallb_chart_version_effective: "{{ platform_metallb_chart_version | default(platform_metallb_chart_version_from_env, true) }}"
    platform_traefik_chart_repo_effective: "{{ platform_traefik_chart_repo | default(platform_traefik_chart_repo_from_env, true) | default('https://traefik.github.io/charts', true) }}"
    platform_traefik_chart_version_effective: "{{ platform_traefik_chart_version | default(platform_traefik_chart_version_from_env, true) }}"
    platform_ingress_rollout_timeout_effective: "{{ platform_ingress_rollout_timeout | default(platform_ingress_rollout_timeout_from_env, true) | default('600', true) | string | regex_replace('s$', '') | int }}"
    platform_ingress_poll_interval_effective: "{{ platform_ingress_poll_interval | default(platform_ingress_poll_interval_from_env, true) | default(10, true) | int }}"
    platform_ingress_cleanup_helm_jobs_effective: "{{ platform_ingress_cleanup_helm_jobs | default(platform_ingress_cleanup_helm_jobs_from_env, true) | default(true, true) | bool }}"
    platform_metallb_webhook_timeout_effective: "{{ platform_metallb_webhook_timeout | default(platform_metallb_webhook_timeout_from_env, true) | default(platform_ingress_rollout_timeout_effective, true) | string | regex_replace('s$', '') | int }}"
    platform_metallb_webhook_probe_timeout_effective: "{{ platform_metallb_webhook_probe_timeout | default(platform_metallb_webhook_probe_timeout_from_env, true) | default(5, true) | string | regex_replace('s$', '') | int }}"
    platform_metallb_webhook_repair_effective: "{{ platform_metallb_webhook_repair | default(platform_metallb_webhook_repair_from_env, true) | default(true, true) | bool }}"
    platform_traefik_rollout_timeout_effective: "{{ platform_traefik_rollout_timeout | default(platform_traefik_rollout_timeout_from_env, true) | default(platform_ingress_rollout_timeout_effective, true) | string | regex_replace('s$', '') | int }}"
    platform_traefik_dns_check_image_effective: "{{ platform_traefik_dns_check_image | default(platform_traefik_dns_check_image_from_env, true) | default('rancher/klipper-helm:v0.10.0-build20260513', true) }}"
    platform_traefik_dns_check_timeout_effective: "{{ platform_traefik_dns_check_timeout | default(platform_traefik_dns_check_timeout_from_env, true) | default(300, true) | string | regex_replace('s$', '') | int }}"
    platform_traefik_dns_retry_timeout_effective: "{{ platform_traefik_dns_retry_timeout | default(platform_traefik_dns_retry_timeout_from_env, true) | default(platform_traefik_dns_check_timeout_effective, true) | string | regex_replace('s$', '') | int }}"
    platform_traefik_dns_helm_attempts_effective: "{{ platform_traefik_dns_helm_attempts | default(platform_traefik_dns_helm_attempts_from_env, true) | default(3, true) | int }}"
    platform_traefik_dns_helm_timeout_effective: "{{ platform_traefik_dns_helm_timeout | default(platform_traefik_dns_helm_timeout_from_env, true) | default(60, true) | string | regex_replace('s$', '') | int }}"
    platform_traefik_dns_service_path_repair_effective: "{{ platform_traefik_dns_service_path_repair | default(platform_traefik_dns_service_path_repair_from_env, true) | default(true, true) | bool }}"
    platform_traefik_dns_failed_node_restart_effective: "{{ platform_traefik_dns_failed_node_restart | default(platform_traefik_dns_failed_node_restart_from_env, true) | default(true, true) | bool }}"
    platform_traefik_dns_failed_node_restart_timeout_effective: "{{ platform_traefik_dns_failed_node_restart_timeout | default(platform_traefik_dns_failed_node_restart_timeout_from_env, true) | default(300, true) | string | regex_replace('s$', '') | int }}"
    platform_traefik_dns_coredns_replicas_effective: "{{ platform_traefik_dns_coredns_replicas | default(platform_traefik_dns_coredns_replicas_from_env, true) | default(groups['rke2_servers'] | length, true) | int }}"
    platform_traefik_dns_pod_cidrs_raw: "{{ platform_traefik_dns_pod_cidrs | default(platform_traefik_dns_pod_cidrs_from_env, true) | default('', true) }}"
    platform_argocd_ingress_verify_timeout_effective: "{{ platform_argocd_ingress_verify_timeout | default(platform_argocd_ingress_verify_timeout_from_env, true) | default(platform_traefik_rollout_timeout_effective, true) | string | regex_replace('s$', '') | int }}"
    platform_argocd_ingress_connect_timeout_effective: "{{ platform_argocd_ingress_connect_timeout | default(platform_argocd_ingress_connect_timeout_from_env, true) | default(5, true) | string | regex_replace('s$', '') | int }}"
    platform_argocd_ingress_max_time_effective: "{{ platform_argocd_ingress_max_time | default(platform_argocd_ingress_max_time_from_env, true) | default(20, true) | string | regex_replace('s$', '') | int }}"
    platform_argocd_ingress_controller_verify_effective: "{{ platform_argocd_ingress_controller_verify | default(platform_argocd_ingress_controller_verify_from_env, true) | default(true, true) | bool }}"
    platform_argocd_ingress_node_strict_effective: "{{ platform_argocd_ingress_node_strict | default(platform_argocd_ingress_node_strict_from_env, true) | default(false, true) | bool }}"
    platform_argocd_ingress_vip_repair_effective: "{{ platform_argocd_ingress_vip_repair | default(platform_argocd_ingress_vip_repair_from_env, true) | default(true, true) | bool }}"
    platform_argocd_server_replicas_effective: "{{ platform_argocd_server_replicas | default(platform_argocd_server_replicas_from_env, true) | default(groups['rke2_servers'] | length, true) | int }}"
    platform_ip_redirect_enabled_effective: "{{ platform_ip_redirect_enabled | default(platform_ip_redirect_enabled_from_env, true) | default(true, true) | bool }}"
    platform_ip_redirect_target_host_effective: "{{ platform_ip_redirect_target_host | default(platform_ip_redirect_target_host_from_env, true) | default(platform_argocd_host_effective, true) }}"
    platform_traefik_dns_check_script_path: /tmp/platform-check-chart-repo-dns-all-nodes.sh
    platform_traefik_dns_service_path_sysctl_file: /etc/sysctl.d/99-platform-traefik-dns-service-path.conf
    platform_traefik_dns_service_path_firewalld_ports:
      - 4240/tcp
      - 4244/tcp
      - 8472/udp
      - 6081/udp
      - 10250/tcp
    platform_traefik_dns_service_path_firewalld_trusted_interfaces:
      - cilium_host
      - cilium_net
      - cilium_vxlan
    platform_ingress_wait_retries: "{{ (((platform_ingress_rollout_timeout_effective | int) / (platform_ingress_poll_interval_effective | int)) | round(0, 'ceil') | int) + 1 }}"
    platform_metallb_webhook_wait_retries: "{{ (((platform_metallb_webhook_timeout_effective | int) / (platform_ingress_poll_interval_effective | int)) | round(0, 'ceil') | int) + 1 }}"
    platform_traefik_wait_retries: "{{ (((platform_traefik_rollout_timeout_effective | int) / (platform_ingress_poll_interval_effective | int)) | round(0, 'ceil') | int) + 1 }}"
    platform_traefik_dns_failed_node_restart_retries: "{{ (((platform_traefik_dns_failed_node_restart_timeout_effective | int) / (platform_ingress_poll_interval_effective | int)) | round(0, 'ceil') | int) + 1 }}"
    platform_argocd_ingress_verify_retries: "{{ (((platform_argocd_ingress_verify_timeout_effective | int) / (platform_ingress_poll_interval_effective | int)) | round(0, 'ceil') | int) + 1 }}"
    platform_argocd_bootstrap_service_name: argocd-server-bootstrap-nodeport
    platform_ingress_firewalld_ports:
      - 80/tcp
      - 443/tcp
  vars_files:
    - ../vars/platform-hostnames.yml
  tasks:
    - name: Require platform ingress settings
      ansible.builtin.assert:
        that:
          - rke2_ingress_vip_effective | length > 0
          - not (rke2_ingress_vip_effective is match("^<.*>$"))
          - platform_domain_effective | length > 0
          - not (platform_domain_effective is match("^<.*>$"))
          - platform_metallb_chart_repo_effective | length > 0
          - platform_traefik_chart_repo_effective | length > 0
          - platform_ingress_rollout_timeout_effective | int > 0
          - platform_ingress_poll_interval_effective | int > 0
          - platform_metallb_webhook_timeout_effective | int > 0
          - platform_metallb_webhook_probe_timeout_effective | int > 0
          - platform_traefik_rollout_timeout_effective | int > 0
          - platform_traefik_dns_check_image_effective | length > 0
          - platform_traefik_dns_check_timeout_effective | int > 0
          - platform_traefik_dns_retry_timeout_effective | int > 0
          - platform_traefik_dns_helm_attempts_effective | int > 0
          - platform_traefik_dns_helm_timeout_effective | int > 0
          - platform_traefik_dns_failed_node_restart_timeout_effective | int > 0
          - platform_traefik_dns_coredns_replicas_effective | int > 0
          - platform_argocd_ingress_verify_timeout_effective | int > 0
          - platform_argocd_ingress_connect_timeout_effective | int > 0
          - platform_argocd_ingress_max_time_effective | int > 0
          - platform_argocd_server_replicas_effective | int > 0
          - (not (platform_ip_redirect_enabled_effective | bool)) or (platform_ip_redirect_target_host_effective | length > 0)
        fail_msg: "Set rke2_ingress_vip and platform_domain/rke2_platform_domain in inventory/hosts.local.ini."
      run_once: true

    - name: Show platform ingress wait settings
      ansible.builtin.debug:
        msg: >-
          Platform ingress rollout timeout is {{ platform_ingress_rollout_timeout_effective }}s
          with {{ platform_ingress_poll_interval_effective }}s polling. Stale Helm job cleanup is
          {{ 'enabled' if platform_ingress_cleanup_helm_jobs_effective else 'disabled' }}.
          MetalLB chart repo: {{ platform_metallb_chart_repo_effective }}.
          Traefik chart repo: {{ platform_traefik_chart_repo_effective }}.
          MetalLB webhook timeout is {{ platform_metallb_webhook_timeout_effective }}s
          with {{ platform_metallb_webhook_probe_timeout_effective }}s per webhook probe.
          MetalLB webhook auto-repair is
          {{ 'enabled' if platform_metallb_webhook_repair_effective else 'disabled' }}.
          Traefik rollout timeout is {{ platform_traefik_rollout_timeout_effective }}s.
          Traefik per-node DNS check timeout is
          {{ platform_traefik_dns_check_timeout_effective }}s. Retry timeout after repair is
          {{ platform_traefik_dns_retry_timeout_effective }}s, with
          {{ platform_traefik_dns_helm_attempts_effective }} Helm attempts and
          {{ platform_traefik_dns_helm_timeout_effective }}s per Helm command.
          Traefik per-node DNS service-path auto-repair is
          {{ 'enabled' if platform_traefik_dns_service_path_repair_effective else 'disabled' }}.
          Failed-node RKE2 restart after persistent Traefik DNS failure is
          {{ 'enabled' if platform_traefik_dns_failed_node_restart_effective else 'disabled' }}
          with {{ platform_traefik_dns_failed_node_restart_timeout_effective }}s timeout.
          CoreDNS HA placement target for Traefik per-node DNS repair is
          {{ platform_traefik_dns_coredns_replicas_effective }} replicas.
          Argo CD ingress verification timeout is
          {{ platform_argocd_ingress_verify_timeout_effective }}s with
          {{ platform_argocd_ingress_connect_timeout_effective }}s connect timeout
          and {{ platform_argocd_ingress_max_time_effective }}s max curl time.
          Controller/client VIP verification is
          {{ 'enabled' if platform_argocd_ingress_controller_verify_effective else 'disabled' }}.
          Node-originated VIP verification strict gate is
          {{ 'enabled' if platform_argocd_ingress_node_strict_effective else 'disabled' }}.
          Argo CD ingress VIP announcement auto-repair is
          {{ 'enabled' if platform_argocd_ingress_vip_repair_effective else 'disabled' }}.
          Argo CD server ingress backend replicas target is
          {{ platform_argocd_server_replicas_effective }}.
          App VIP to hostname redirect is
          {{ 'enabled' if platform_ip_redirect_enabled_effective else 'disabled' }};
          target host is {{ platform_ip_redirect_target_host_effective }}.
      run_once: true

    - name: Ensure OS hostname matches inventory node identity
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Check firewalld state
      ansible.builtin.command: firewall-cmd --state
      register: platform_ingress_firewalld_state
      changed_when: false
      failed_when: false

    - name: Query platform ingress firewalld ports
      ansible.builtin.command: "firewall-cmd --permanent --query-port={{ item }}"
      register: platform_ingress_firewalld_port_queries
      changed_when: false
      failed_when: false
      loop: "{{ platform_ingress_firewalld_ports }}"
      when: platform_ingress_firewalld_state.rc == 0

    - name: Open platform ingress firewalld ports
      ansible.builtin.command: "firewall-cmd --permanent --add-port={{ item.item }}"
      changed_when: true
      loop: "{{ platform_ingress_firewalld_port_queries.results | default([]) }}"
      when:
        - platform_ingress_firewalld_state.rc == 0
        - item.rc != 0
      notify: Reload firewalld

    - name: Show skipped ingress firewalld configuration
      ansible.builtin.debug:
        msg: "firewalld is not active on this node; skipping 80/443 firewalld configuration."
      when: platform_ingress_firewalld_state.rc != 0

    - name: Reload ingress firewall changes before verification
      ansible.builtin.meta: flush_handlers

    - name: Verify RKE2 HelmChart CRD exists
      ansible.builtin.command: >-
        /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
        get crd helmcharts.helm.cattle.io
      register: platform_ingress_helmchart_crd
      changed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Clean stale MetalLB Helm install job before retry
      ansible.builtin.command: >-
        /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
        -n kube-system delete job/helm-install-platform-metallb --ignore-not-found=true
      register: platform_metallb_helm_job_cleanup
      changed_when: "'deleted' in platform_metallb_helm_job_cleanup.stdout"
      delegate_to: "{{ rke2_first_server }}"
      when: platform_ingress_cleanup_helm_jobs_effective | bool
      run_once: true

    - name: Install or update MetalLB through the RKE2 Helm controller
      ansible.builtin.shell: |
        set -o pipefail
        /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml apply -f -
      args:
        executable: /bin/bash
        stdin: |
          ---
          apiVersion: helm.cattle.io/v1
          kind: HelmChart
          metadata:
            name: platform-metallb
            namespace: kube-system
          spec:
            repo: {{ platform_metallb_chart_repo_effective }}
            chart: metallb
          {% if platform_metallb_chart_version_effective | length > 0 %}
            version: {{ platform_metallb_chart_version_effective }}
          {% endif %}
            targetNamespace: metallb-system
            createNamespace: true
            valuesContent: |-
              controller:
                enabled: true
              speaker:
                enabled: true
      register: platform_metallb_helmchart_apply
      changed_when: "'created' in platform_metallb_helmchart_apply.stdout or 'configured' in platform_metallb_helmchart_apply.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Wait for MetalLB CRDs
      block:
        - name: Poll MetalLB CRDs
          ansible.builtin.command: >-
            /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
            get crd ipaddresspools.metallb.io l2advertisements.metallb.io
          register: platform_metallb_crds
          retries: "{{ platform_ingress_wait_retries }}"
          delay: "{{ platform_ingress_poll_interval_effective }}"
          until: platform_metallb_crds.rc == 0
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
      rescue:
        - name: Collect MetalLB install diagnostics
          ansible.builtin.shell: |
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            echo "===== HelmChart resources ====="
            "$K" --kubeconfig "$C" -n kube-system get helmchart,helmchartconfig 2>/dev/null | grep -E 'platform-metallb|NAME' || true
            echo "===== platform-metallb HelmChart detail ====="
            "$K" --kubeconfig "$C" -n kube-system describe helmchart platform-metallb || true
            echo "===== kube-system Helm jobs/pods ====="
            "$K" --kubeconfig "$C" -n kube-system get jobs,pods -o wide | grep -E 'helm-install|platform-metallb|metallb|NAME' || true
            echo "===== platform-metallb Helm job detail ====="
            "$K" --kubeconfig "$C" -n kube-system describe job helm-install-platform-metallb || true
            echo "===== platform-metallb Helm pod logs ====="
            for pod in $("$K" --kubeconfig "$C" -n kube-system get pods -l job-name=helm-install-platform-metallb -o name 2>/dev/null); do
              echo "--- ${pod} describe ---"
              "$K" --kubeconfig "$C" -n kube-system describe "${pod}" || true
              echo "--- ${pod} current logs ---"
              "$K" --kubeconfig "$C" -n kube-system logs "${pod}" --all-containers --tail=240 || true
              echo "--- ${pod} previous logs ---"
              "$K" --kubeconfig "$C" -n kube-system logs "${pod}" --all-containers --previous --tail=240 || true
            done
            echo "===== MetalLB namespace ====="
            "$K" --kubeconfig "$C" get ns metallb-system -o wide || true
            echo "===== MetalLB pods ====="
            "$K" --kubeconfig "$C" -n metallb-system get pods -o wide || true
            echo "===== Recent events ====="
            "$K" --kubeconfig "$C" get events -A --sort-by=.lastTimestamp |
              grep -E 'platform-metallb|metallb|helm|Failed|BackOff|ErrImagePull|ImagePullBackOff' | tail -120 || true
          args:
            executable: /bin/bash
          register: platform_metallb_crd_diagnostics
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Print MetalLB install diagnostics
          ansible.builtin.debug:
            var: platform_metallb_crd_diagnostics.stdout_lines
          run_once: true

        - name: Stop after MetalLB CRD timeout
          ansible.builtin.fail:
            msg: |
              MetalLB CRDs did not appear within {{ platform_ingress_rollout_timeout_effective }}s.

              To shorten or extend this wait:
              PLATFORM_INGRESS_ROLLOUT_TIMEOUT=180 make platform-ingress
              PLATFORM_INGRESS_ROLLOUT_TIMEOUT=1200 make platform-ingress

              Review the diagnostics above. Common causes are Helm chart download failure,
              registry/network/proxy issues, or an RKE2 Helm controller failure.

              This playbook now cleans stale helm-install-platform-metallb jobs before retrying by default.
              To disable that cleanup:
              PLATFORM_INGRESS_CLEANUP_HELM_JOBS=false make platform-ingress
          run_once: true

    - name: Wait for MetalLB controller
      ansible.builtin.shell: |
        set -eu
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        for deployment in platform-metallb-controller metallb-controller; do
          if "$K" --kubeconfig "$C" -n metallb-system get "deployment/${deployment}" >/dev/null 2>&1; then
            "$K" --kubeconfig "$C" -n metallb-system rollout status "deployment/${deployment}" --timeout={{ platform_ingress_poll_interval_effective }}s
            exit 0
          fi
        done
        "$K" --kubeconfig "$C" -n metallb-system get deployment -o wide || true
        exit 1
      args:
        executable: /bin/bash
      register: platform_metallb_controller_rollout
      retries: "{{ platform_ingress_wait_retries }}"
      delay: "{{ platform_ingress_poll_interval_effective }}"
      until: platform_metallb_controller_rollout.rc == 0
      changed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Wait for MetalLB speaker
      ansible.builtin.shell: |
        set -eu
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        for daemonset in platform-metallb-speaker metallb-speaker; do
          if "$K" --kubeconfig "$C" -n metallb-system get "daemonset/${daemonset}" >/dev/null 2>&1; then
            "$K" --kubeconfig "$C" -n metallb-system rollout status "daemonset/${daemonset}" --timeout={{ platform_ingress_poll_interval_effective }}s
            exit 0
          fi
        done
        "$K" --kubeconfig "$C" -n metallb-system get daemonset -o wide || true
        exit 1
      args:
        executable: /bin/bash
      register: platform_metallb_speaker_rollout
      retries: "{{ platform_ingress_wait_retries }}"
      delay: "{{ platform_ingress_poll_interval_effective }}"
      until: platform_metallb_speaker_rollout.rc == 0
      changed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Check existing platform ingress VIP pool
      ansible.builtin.shell: |
        set -eu
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        expected_address="{{ rke2_ingress_vip_effective }}/32"
        pool_addresses="$("$K" --kubeconfig "$C" -n metallb-system get ipaddresspool/platform-ingress \
          -o jsonpath='{range .spec.addresses[*]}{.}{"\n"}{end}' 2>/dev/null || true)"
        advertisement_pools="$("$K" --kubeconfig "$C" -n metallb-system get l2advertisement/platform-ingress \
          -o jsonpath='{range .spec.ipAddressPools[*]}{.}{"\n"}{end}' 2>/dev/null || true)"
        printf 'pool_addresses=%s\nadvertisement_pools=%s\n' "${pool_addresses}" "${advertisement_pools}"
        printf '%s\n' "${pool_addresses}" | grep -Fx "${expected_address}" >/dev/null
        printf '%s\n' "${advertisement_pools}" | grep -Fx platform-ingress >/dev/null
      args:
        executable: /bin/bash
      register: platform_metallb_ingress_pool_present
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Reuse existing platform ingress VIP pool
      ansible.builtin.debug:
        msg: "MetalLB platform-ingress pool already contains {{ rke2_ingress_vip_effective }}/32; skipping webhook-gated pool apply."
      when: platform_metallb_ingress_pool_present.rc == 0
      run_once: true

    - name: Prefer platform MetalLB controller for the validating webhook
      ansible.builtin.shell: |
        set -eu
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        if "$K" --kubeconfig "$C" -n metallb-system get service/metallb-webhook-service >/dev/null 2>&1 &&
          "$K" --kubeconfig "$C" -n metallb-system get pods \
            -l app.kubernetes.io/instance=platform-metallb,app.kubernetes.io/component=controller \
            -o name | grep -q .; then
          "$K" --kubeconfig "$C" -n metallb-system patch service/metallb-webhook-service \
            --type merge \
            -p '{"spec":{"selector":{"app.kubernetes.io/component":"controller","app.kubernetes.io/instance":"platform-metallb","app.kubernetes.io/name":"metallb"}}}'
        else
          echo "platform MetalLB controller or webhook service not present; leaving webhook service selector unchanged"
        fi
      args:
        executable: /bin/bash
      register: platform_metallb_webhook_selector_repair
      changed_when: "'patched' in platform_metallb_webhook_selector_repair.stdout"
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      when: platform_metallb_ingress_pool_present.rc != 0

    - name: Wait for MetalLB validating webhook
      when: platform_metallb_ingress_pool_present.rc != 0
      block:
        - name: Poll MetalLB webhook service endpoints
          ansible.builtin.shell: |
            set -eu
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            svc=""
            for candidate in metallb-webhook-service platform-metallb-webhook-service; do
              if "$K" --kubeconfig "$C" -n metallb-system get "service/${candidate}" >/dev/null 2>&1; then
                svc="${candidate}"
                break
              fi
            done
            test -n "${svc}"
            endpoints="$("$K" --kubeconfig "$C" -n metallb-system get "endpoints/${svc}" -o jsonpath='{range .subsets[*].addresses[*]}{.ip}{" "}{end}' 2>/dev/null || true)"
            ports="$("$K" --kubeconfig "$C" -n metallb-system get "endpoints/${svc}" -o jsonpath='{range .subsets[*].ports[*]}{.port}{" "}{end}' 2>/dev/null || true)"
            if [ -z "${endpoints}" ]; then
              endpoints="$("$K" --kubeconfig "$C" -n metallb-system get endpointslices \
                -l "kubernetes.io/service-name=${svc}" \
                -o jsonpath='{range .items[*].endpoints[*].addresses[*]}{.}{" "}{end}' 2>/dev/null || true)"
              ports="$("$K" --kubeconfig "$C" -n metallb-system get endpointslices \
                -l "kubernetes.io/service-name=${svc}" \
                -o jsonpath='{range .items[*].ports[*]}{.port}{" "}{end}' 2>/dev/null || true)"
            fi
            echo "service=${svc} endpoints=${endpoints} ports=${ports}"
            test -n "${endpoints}"
            test -n "${ports}"
          args:
            executable: /bin/bash
          register: platform_metallb_webhook_endpoints
          retries: "{{ platform_metallb_webhook_wait_retries }}"
          delay: "{{ platform_ingress_poll_interval_effective }}"
          until: platform_metallb_webhook_endpoints.rc == 0
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Poll MetalLB webhook service path from first server
          ansible.builtin.shell: |
            set -eu
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            svc=""
            for candidate in metallb-webhook-service platform-metallb-webhook-service; do
              if "$K" --kubeconfig "$C" -n metallb-system get "service/${candidate}" >/dev/null 2>&1; then
                svc="${candidate}"
                break
              fi
            done
            test -n "${svc}"
            svc_ip="$("$K" --kubeconfig "$C" -n metallb-system get "service/${svc}" -o jsonpath='{.spec.clusterIP}')"
            test -n "${svc_ip}"
            test "${svc_ip}" != "None"
            if ! command -v curl >/dev/null 2>&1; then
              echo "curl is not installed on {{ rke2_first_server }}; skipping direct webhook ClusterIP probe"
              exit 0
            fi
            code="$(curl --silent --show-error --insecure --output /dev/null \
              --write-out '%{http_code}' \
              --connect-timeout {{ platform_metallb_webhook_probe_timeout_effective }} \
              --max-time {{ platform_metallb_webhook_probe_timeout_effective }} \
              "https://${svc_ip}:443/" || true)"
            echo "service=${svc} cluster_ip=${svc_ip} http_code=${code}"
            case "${code}" in
              000|"") echo "direct node-to-webhook ClusterIP probe failed; continuing to server-side admission check" ;;
              *) exit 0 ;;
            esac
          args:
            executable: /bin/bash
          register: platform_metallb_webhook_service_path
          retries: "{{ platform_metallb_webhook_wait_retries }}"
          delay: "{{ platform_ingress_poll_interval_effective }}"
          until: platform_metallb_webhook_service_path.rc == 0
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Poll MetalLB webhook admission path
          ansible.builtin.shell: |
            set -o pipefail
            /var/lib/rancher/rke2/bin/kubectl \
              --kubeconfig /etc/rancher/rke2/rke2.yaml \
              --request-timeout={{ platform_metallb_webhook_probe_timeout_effective }}s \
              apply --dry-run=server -f -
          args:
            executable: /bin/bash
            stdin: |
              ---
              apiVersion: metallb.io/v1beta1
              kind: IPAddressPool
              metadata:
                name: platform-ingress
                namespace: metallb-system
              spec:
                addresses:
                  - {{ rke2_ingress_vip_effective }}/32
              ---
              apiVersion: metallb.io/v1beta1
              kind: L2Advertisement
              metadata:
                name: platform-ingress
                namespace: metallb-system
              spec:
                ipAddressPools:
                  - platform-ingress
          register: platform_metallb_webhook_dry_run
          retries: "{{ platform_metallb_webhook_wait_retries }}"
          delay: "{{ platform_ingress_poll_interval_effective }}"
          until: platform_metallb_webhook_dry_run.rc == 0
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
      rescue:
        - name: Restart MetalLB controller after webhook readiness failure
          ansible.builtin.shell: |
            set -eu
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            restarted=0
            for deployment in platform-metallb-controller metallb-controller; do
              if "$K" --kubeconfig "$C" -n metallb-system get "deployment/${deployment}" >/dev/null 2>&1; then
                "$K" --kubeconfig "$C" -n metallb-system rollout restart "deployment/${deployment}"
                restarted=1
              fi
            done
            test "${restarted}" -eq 1
          args:
            executable: /bin/bash
          register: platform_metallb_webhook_controller_restart
          changed_when: "'restarted' in platform_metallb_webhook_controller_restart.stdout"
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when: platform_metallb_webhook_repair_effective | bool

        - name: Poll MetalLB controller after webhook repair
          ansible.builtin.shell: |
            set -eu
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            for deployment in platform-metallb-controller metallb-controller; do
              if "$K" --kubeconfig "$C" -n metallb-system get "deployment/${deployment}" >/dev/null 2>&1; then
                "$K" --kubeconfig "$C" -n metallb-system rollout status "deployment/${deployment}" --timeout={{ platform_ingress_poll_interval_effective }}s
                exit 0
              fi
            done
            "$K" --kubeconfig "$C" -n metallb-system get deployment -o wide || true
            exit 1
          args:
            executable: /bin/bash
          register: platform_metallb_webhook_controller_rollout
          retries: "{{ platform_metallb_webhook_wait_retries }}"
          delay: "{{ platform_ingress_poll_interval_effective }}"
          until: platform_metallb_webhook_controller_rollout.rc == 0
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when:
            - platform_metallb_webhook_repair_effective | bool
            - platform_metallb_webhook_controller_restart.rc | default(1) == 0

        - name: Refresh kube-proxy webhook service path component
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            for daemonset in kube-proxy rke2-kube-proxy; do
              if "$K" --kubeconfig "$C" -n kube-system get "daemonset/${daemonset}" >/dev/null 2>&1; then
                "$K" --kubeconfig "$C" -n kube-system rollout restart "daemonset/${daemonset}"
                echo "restarted daemonset/${daemonset}"
                exit 0
              fi
            done
            request_timeout={{ platform_metallb_webhook_probe_timeout_effective }}s
            "$K" --kubeconfig "$C" --request-timeout="${request_timeout}" -n kube-system \
              delete pod -l k8s-app=kube-proxy --ignore-not-found=true --wait=false || true
            "$K" --kubeconfig "$C" --request-timeout="${request_timeout}" -n kube-system get pods -o name |
              awk -F/ '/\/kube-proxy-/ {print $2}' |
              xargs -r "$K" --kubeconfig "$C" --request-timeout="${request_timeout}" -n kube-system \
                delete pod --ignore-not-found=true --wait=false || true
            echo "refreshed static kube-proxy pods"
          args:
            executable: /bin/bash
          register: platform_metallb_webhook_kube_proxy_refresh
          changed_when: >-
            'restarted' in platform_metallb_webhook_kube_proxy_refresh.stdout
            or 'deleted' in platform_metallb_webhook_kube_proxy_refresh.stdout
            or 'refreshed static kube-proxy pods' in platform_metallb_webhook_kube_proxy_refresh.stdout
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when: platform_metallb_webhook_repair_effective | bool

        - name: Poll kube-proxy webhook service path component
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            for daemonset in kube-proxy rke2-kube-proxy; do
              if "$K" --kubeconfig "$C" -n kube-system get "daemonset/${daemonset}" >/dev/null 2>&1; then
                "$K" --kubeconfig "$C" -n kube-system rollout status "daemonset/${daemonset}" --timeout={{ platform_ingress_poll_interval_effective }}s
                exit 0
              fi
            done
            expected={{ groups['rke2_servers'] | length }}
            "$K" --kubeconfig "$C" -n kube-system get pods -o wide | awk -v expected="${expected}" '
              NR == 1 { print; next }
              $1 ~ /^kube-proxy-/ {
                print
                total++
                split($2, ready, "/")
                if ($3 == "Running" && ready[1] == ready[2]) running++
              }
              END { exit(total == expected && running == expected ? 0 : 1) }
            '
          args:
            executable: /bin/bash
          register: platform_metallb_webhook_kube_proxy_rollout
          retries: "{{ platform_metallb_webhook_wait_retries }}"
          delay: "{{ platform_ingress_poll_interval_effective }}"
          until: platform_metallb_webhook_kube_proxy_rollout.rc == 0
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when: platform_metallb_webhook_repair_effective | bool

        - name: Restart Cilium after webhook service path failure
          ansible.builtin.command: >-
            /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
            -n kube-system rollout restart daemonset/cilium
          register: platform_metallb_webhook_cilium_restart
          changed_when: "'restarted' in platform_metallb_webhook_cilium_restart.stdout"
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when: platform_metallb_webhook_repair_effective | bool

        - name: Poll Cilium after webhook service path repair
          ansible.builtin.command: >-
            /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
            -n kube-system rollout status daemonset/cilium
            --timeout={{ platform_ingress_poll_interval_effective }}s
          register: platform_metallb_webhook_cilium_rollout
          retries: "{{ platform_metallb_webhook_wait_retries }}"
          delay: "{{ platform_ingress_poll_interval_effective }}"
          until: platform_metallb_webhook_cilium_rollout.rc == 0
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when:
            - platform_metallb_webhook_repair_effective | bool
            - platform_metallb_webhook_cilium_restart.rc | default(1) == 0

        - name: Retry MetalLB webhook readiness after automatic repair
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            svc=""
            for candidate in metallb-webhook-service platform-metallb-webhook-service; do
              if "$K" --kubeconfig "$C" -n metallb-system get "service/${candidate}" >/dev/null 2>&1; then
                svc="${candidate}"
                break
              fi
            done
            test -n "${svc}"
            svc_ip="$("$K" --kubeconfig "$C" -n metallb-system get "service/${svc}" -o jsonpath='{.spec.clusterIP}')"
            endpoints="$("$K" --kubeconfig "$C" -n metallb-system get "endpoints/${svc}" -o jsonpath='{range .subsets[*].addresses[*]}{.ip}{" "}{end}' 2>/dev/null || true)"
            echo "service=${svc} cluster_ip=${svc_ip} endpoints=${endpoints}"
            test -n "${endpoints}"
            if command -v curl >/dev/null 2>&1; then
              code="$(curl --silent --show-error --insecure --output /dev/null \
                --write-out '%{http_code}' \
                --connect-timeout {{ platform_metallb_webhook_probe_timeout_effective }} \
                --max-time {{ platform_metallb_webhook_probe_timeout_effective }} \
                "https://${svc_ip}:443/" || true)"
              echo "webhook_cluster_ip_http_code=${code}"
              case "${code}" in
                000|"") echo "direct node-to-webhook ClusterIP probe failed; continuing to server-side admission check" ;;
              esac
            fi
            "$K" --kubeconfig "$C" \
              --request-timeout={{ platform_metallb_webhook_probe_timeout_effective }}s \
              apply --dry-run=server -f -
          args:
            executable: /bin/bash
            stdin: |
              ---
              apiVersion: metallb.io/v1beta1
              kind: IPAddressPool
              metadata:
                name: platform-ingress
                namespace: metallb-system
              spec:
                addresses:
                  - {{ rke2_ingress_vip_effective }}/32
              ---
              apiVersion: metallb.io/v1beta1
              kind: L2Advertisement
              metadata:
                name: platform-ingress
                namespace: metallb-system
              spec:
                ipAddressPools:
                  - platform-ingress
          register: platform_metallb_webhook_repair_retry
          retries: "{{ platform_metallb_webhook_wait_retries }}"
          delay: "{{ platform_ingress_poll_interval_effective }}"
          until: platform_metallb_webhook_repair_retry.rc == 0
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when: platform_metallb_webhook_repair_effective | bool

        - name: Show MetalLB webhook automatic repair result
          ansible.builtin.debug:
            msg:
              - "MetalLB controller restart:"
              - "{{ platform_metallb_webhook_controller_restart.stdout_lines | default(['not run']) }}"
              - "kube-proxy refresh:"
              - "{{ platform_metallb_webhook_kube_proxy_refresh.stdout_lines | default(['not run']) }}"
              - "kube-proxy rollout:"
              - "{{ platform_metallb_webhook_kube_proxy_rollout.stdout_lines | default(['not run']) }}"
              - "Cilium rollout:"
              - "{{ platform_metallb_webhook_cilium_rollout.stdout_lines | default(['not run']) }}"
              - "Webhook retry:"
              - "{{ platform_metallb_webhook_repair_retry.stdout_lines | default(['not run']) }}"
          run_once: true
          when: platform_metallb_webhook_repair_effective | bool

        - name: Continue after successful MetalLB webhook automatic repair
          ansible.builtin.debug:
            msg: "MetalLB validating webhook became reachable after automatic service-path repair."
          run_once: true
          when:
            - platform_metallb_webhook_repair_retry is defined
            - platform_metallb_webhook_repair_retry.rc == 0

        - name: Collect MetalLB webhook diagnostics
          ansible.builtin.shell: |
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            echo "===== MetalLB services ====="
            "$K" --kubeconfig "$C" -n metallb-system get svc -o wide || true
            echo "===== MetalLB webhook endpoints ====="
            "$K" --kubeconfig "$C" -n metallb-system get endpoints,endpointslices -o wide | grep -E 'webhook|NAME' || true
            echo "===== MetalLB webhook service ClusterIP probe from first server ====="
            svc="$("$K" --kubeconfig "$C" -n metallb-system get svc -o name | grep -E 'metallb-webhook-service|platform-metallb-webhook-service' | head -1 | sed 's#service/##' || true)"
            if [ -n "${svc}" ]; then
              svc_ip="$("$K" --kubeconfig "$C" -n metallb-system get "service/${svc}" -o jsonpath='{.spec.clusterIP}' 2>/dev/null || true)"
              echo "service=${svc} cluster_ip=${svc_ip}"
              if command -v curl >/dev/null 2>&1 && [ -n "${svc_ip}" ] && [ "${svc_ip}" != "None" ]; then
                curl --verbose --insecure \
                  --connect-timeout {{ platform_metallb_webhook_probe_timeout_effective }} \
                  --max-time {{ platform_metallb_webhook_probe_timeout_effective }} \
                  "https://${svc_ip}:443/" || true
              fi
            fi
            echo "===== MetalLB workloads ====="
            "$K" --kubeconfig "$C" -n metallb-system get deploy,ds,rs,pods -o wide || true
            echo "===== MetalLB validating webhooks ====="
            "$K" --kubeconfig "$C" get validatingwebhookconfiguration -o name | grep metallb || true
            for webhook in $("$K" --kubeconfig "$C" get validatingwebhookconfiguration -o name | grep metallb || true); do
              echo "--- ${webhook} ---"
              "$K" --kubeconfig "$C" describe "${webhook}" || true
            done
            echo "===== MetalLB controller logs ====="
            "$K" --kubeconfig "$C" -n metallb-system logs -l app.kubernetes.io/component=controller --all-containers --tail=240 || true
            "$K" --kubeconfig "$C" -n metallb-system logs -l component=controller --all-containers --tail=240 || true
            echo "===== MetalLB pod details ====="
            "$K" --kubeconfig "$C" -n metallb-system describe pods || true
            echo "===== Recent MetalLB events ====="
            "$K" --kubeconfig "$C" get events -A --sort-by=.lastTimestamp |
              grep -E 'metallb|webhook|Failed|BackOff|Unhealthy|timeout|context deadline' | tail -120 || true
          args:
            executable: /bin/bash
          register: platform_metallb_webhook_diagnostics
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when: platform_metallb_webhook_repair_retry is not defined or platform_metallb_webhook_repair_retry.rc != 0

        - name: Print MetalLB webhook diagnostics
          ansible.builtin.debug:
            var: platform_metallb_webhook_diagnostics.stdout_lines
          run_once: true
          when: platform_metallb_webhook_repair_retry is not defined or platform_metallb_webhook_repair_retry.rc != 0

        - name: Stop after MetalLB webhook readiness failure
          ansible.builtin.fail:
            msg: |
              MetalLB validating webhook did not become reachable within {{ platform_metallb_webhook_timeout_effective }}s.

              The API server must be able to call metallb-webhook-service before
              IPAddressPool and L2Advertisement resources can be created.

              Review the diagnostics above. Common causes are MetalLB controller
              not Ready, missing webhook service endpoints, CNI/service-path issues,
              or network policy/firewall rules blocking API-server-to-service traffic.

              Automatic repair result:
              - MetalLB controller: {{ platform_metallb_webhook_controller_rollout.stdout | default(platform_metallb_webhook_controller_restart.stderr | default('not run')) }}
              - kube-proxy: {{ platform_metallb_webhook_kube_proxy_rollout.stdout | default(platform_metallb_webhook_kube_proxy_refresh.stdout | default('not run')) }}
              - Cilium: {{ platform_metallb_webhook_cilium_rollout.stdout | default(platform_metallb_webhook_cilium_restart.stdout | default('not run')) }}
              - Webhook retry: {{ platform_metallb_webhook_repair_retry.stdout | default('not run') }}

              To wait longer on a slow cluster:
              PLATFORM_METALLB_WEBHOOK_TIMEOUT=1200 make platform-ingress

              To disable this automatic repair path:
              PLATFORM_METALLB_WEBHOOK_REPAIR=false make platform-ingress
          run_once: true
          when: platform_metallb_webhook_repair_retry is not defined or platform_metallb_webhook_repair_retry.rc != 0

    - name: Apply platform ingress VIP pool
      when: platform_metallb_ingress_pool_present.rc != 0
      block:
        - name: Apply platform ingress VIP pool manifest
          ansible.builtin.shell: |
            set -o pipefail
            /var/lib/rancher/rke2/bin/kubectl \
              --kubeconfig /etc/rancher/rke2/rke2.yaml \
              --request-timeout={{ platform_metallb_webhook_probe_timeout_effective }}s \
              apply -f -
          args:
            executable: /bin/bash
            stdin: |
              ---
              apiVersion: metallb.io/v1beta1
              kind: IPAddressPool
              metadata:
                name: platform-ingress
                namespace: metallb-system
              spec:
                addresses:
                  - {{ rke2_ingress_vip_effective }}/32
              ---
              apiVersion: metallb.io/v1beta1
              kind: L2Advertisement
              metadata:
                name: platform-ingress
                namespace: metallb-system
              spec:
                ipAddressPools:
                  - platform-ingress
          register: platform_metallb_pool_apply
          retries: "{{ platform_metallb_webhook_wait_retries }}"
          delay: "{{ platform_ingress_poll_interval_effective }}"
          until: platform_metallb_pool_apply.rc == 0
          changed_when: "'created' in platform_metallb_pool_apply.stdout or 'configured' in platform_metallb_pool_apply.stdout"
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
      rescue:
        - name: Collect MetalLB VIP pool apply diagnostics
          ansible.builtin.shell: |
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            echo "===== MetalLB services ====="
            "$K" --kubeconfig "$C" -n metallb-system get svc -o wide || true
            echo "===== MetalLB webhook endpoints ====="
            "$K" --kubeconfig "$C" -n metallb-system get endpoints,endpointslices -o wide | grep -E 'webhook|NAME' || true
            echo "===== MetalLB webhook service ClusterIP probe from first server ====="
            svc="$("$K" --kubeconfig "$C" -n metallb-system get svc -o name | grep -E 'metallb-webhook-service|platform-metallb-webhook-service' | head -1 | sed 's#service/##' || true)"
            if [ -n "${svc}" ]; then
              svc_ip="$("$K" --kubeconfig "$C" -n metallb-system get "service/${svc}" -o jsonpath='{.spec.clusterIP}' 2>/dev/null || true)"
              echo "service=${svc} cluster_ip=${svc_ip}"
              if command -v curl >/dev/null 2>&1 && [ -n "${svc_ip}" ] && [ "${svc_ip}" != "None" ]; then
                curl --verbose --insecure \
                  --connect-timeout {{ platform_metallb_webhook_probe_timeout_effective }} \
                  --max-time {{ platform_metallb_webhook_probe_timeout_effective }} \
                  "https://${svc_ip}:443/" || true
              fi
            fi
            echo "===== MetalLB pools and advertisements ====="
            "$K" --kubeconfig "$C" -n metallb-system get ipaddresspool,l2advertisement -o wide || true
            echo "===== MetalLB workloads ====="
            "$K" --kubeconfig "$C" -n metallb-system get deploy,ds,pods -o wide || true
            echo "===== MetalLB controller logs ====="
            "$K" --kubeconfig "$C" -n metallb-system logs -l app.kubernetes.io/component=controller --all-containers --tail=240 || true
            "$K" --kubeconfig "$C" -n metallb-system logs -l component=controller --all-containers --tail=240 || true
            echo "===== Recent MetalLB events ====="
            "$K" --kubeconfig "$C" get events -A --sort-by=.lastTimestamp |
              grep -E 'metallb|webhook|Failed|BackOff|Unhealthy|timeout|context deadline' | tail -120 || true
          args:
            executable: /bin/bash
          register: platform_metallb_pool_apply_diagnostics
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Print MetalLB VIP pool apply error
          ansible.builtin.debug:
            var: platform_metallb_pool_apply.stderr_lines
          run_once: true

        - name: Print MetalLB VIP pool apply diagnostics
          ansible.builtin.debug:
            var: platform_metallb_pool_apply_diagnostics.stdout_lines
          run_once: true

        - name: Stop after MetalLB VIP pool apply failure
          ansible.builtin.fail:
            msg: |
              Platform ingress VIP pool could not be applied within {{ platform_metallb_webhook_timeout_effective }}s.

              The most common cause is the MetalLB validating webhook timing out
              while the API server creates IPAddressPool or L2Advertisement.

              Review the diagnostics above. To wait longer on a slow cluster:
              PLATFORM_METALLB_WEBHOOK_TIMEOUT=1200 make platform-ingress
          run_once: true

    - name: Verify Traefik chart repository DNS from every node
      block:
        - name: Install per-node chart repository DNS checker on first server
          ansible.builtin.copy:
            dest: "{{ platform_traefik_dns_check_script_path }}"
            owner: root
            group: root
            mode: "0755"
            content: |
              #!/usr/bin/env bash
              set -euo pipefail

              repo_url="${1:?usage: check-chart-repo-dns-all-nodes.sh <repo-url> [check-image] [timeout-seconds] [poll-interval-seconds] [helm-attempts] [helm-timeout-seconds]}"
              check_image="${2:-rancher/klipper-helm:v0.10.0-build20260513}"
              timeout_seconds="${3:-300}"
              poll_interval="${4:-5}"
              helm_attempts="${5:-3}"
              helm_timeout_seconds="${6:-60}"
              kubectl_bin="${KUBECTL:-/var/lib/rancher/rke2/bin/kubectl}"
              kubeconfig="${KUBECONFIG:-/etc/rancher/rke2/rke2.yaml}"
              namespace="${CHECK_NAMESPACE:-kube-system}"
              check_name="platform-chart-repo-dns-check"
              check_id="$(printf '%s' "${repo_url}" | sha256sum | awk '{print substr($1, 1, 10)}')"
              selector="app.kubernetes.io/name=${check_name},platform.gitops/check-id=${check_id}"

              safe_name() {
                printf '%s' "$1" |
                  tr '[:upper:]' '[:lower:]' |
                  sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//' |
                  cut -c 1-34
              }

              cleanup_previous() {
                "${kubectl_bin}" --kubeconfig "${kubeconfig}" -n "${namespace}" \
                  delete job -l "${selector}" --ignore-not-found=true --wait=false >/dev/null 2>&1 || true
              }

              print_diagnostics() {
                echo "===== per-node chart repository DNS check diagnostics ====="
                "${kubectl_bin}" --kubeconfig "${kubeconfig}" -n "${namespace}" get jobs,pods -l "${selector}" -o wide || true
                for job_ref in $("${kubectl_bin}" --kubeconfig "${kubeconfig}" -n "${namespace}" get jobs -l "${selector}" -o name 2>/dev/null || true); do
                  job_name="${job_ref#job.batch/}"
                  echo "----- ${job_ref} -----"
                  "${kubectl_bin}" --kubeconfig "${kubeconfig}" -n "${namespace}" get "${job_ref}" -o wide || true
                  "${kubectl_bin}" --kubeconfig "${kubeconfig}" -n "${namespace}" describe "${job_ref}" || true
                  for pod_ref in $("${kubectl_bin}" --kubeconfig "${kubeconfig}" -n "${namespace}" get pods -l "job-name=${job_name}" -o name 2>/dev/null || true); do
                    echo "----- ${pod_ref} -----"
                    "${kubectl_bin}" --kubeconfig "${kubeconfig}" -n "${namespace}" get "${pod_ref}" -o wide || true
                    "${kubectl_bin}" --kubeconfig "${kubeconfig}" -n "${namespace}" logs "${pod_ref}" --all-containers --tail=160 || true
                    "${kubectl_bin}" --kubeconfig "${kubeconfig}" -n "${namespace}" describe "${pod_ref}" || true
                  done
                done
              }

              cleanup_previous
              nodes="$("${kubectl_bin}" --kubeconfig "${kubeconfig}" get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')"
              expected=0
              for node in ${nodes}; do
                expected=$((expected + 1))
                node_safe="$(safe_name "${node}")"
                job_name="platform-dns-${check_id}-${node_safe}"
                cat <<YAML | "${kubectl_bin}" --kubeconfig "${kubeconfig}" apply -f -
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: ${job_name}
                namespace: ${namespace}
                labels:
                  app.kubernetes.io/name: ${check_name}
                  platform.gitops/check-id: ${check_id}
                  platform.gitops/node: ${node_safe}
              spec:
                backoffLimit: 0
                activeDeadlineSeconds: ${timeout_seconds}
                ttlSecondsAfterFinished: 300
                template:
                  metadata:
                    labels:
                      app.kubernetes.io/name: ${check_name}
                      platform.gitops/check-id: ${check_id}
                      platform.gitops/node: ${node_safe}
                  spec:
                    restartPolicy: Never
                    nodeName: "${node}"
                    tolerations:
                      - operator: Exists
                    containers:
                      - name: check
                        image: "${check_image}"
                        imagePullPolicy: IfNotPresent
                        env:
                          - name: REPO_URL
                            value: "${repo_url}"
                          - name: HELM_ATTEMPTS
                            value: "${helm_attempts}"
                          - name: HELM_TIMEOUT_SECONDS
                            value: "${helm_timeout_seconds}"
                        command:
                          - sh
                          - -c
                        args:
                          - |
                            set -e
                            run_bounded() {
                              seconds="\$1"
                              shift
                              if command -v timeout >/dev/null 2>&1; then
                                timeout "\${seconds}" "\$@"
                              else
                                "\$@"
                              fi
                            }
                            helm_output_has_failure() {
                              grep -E 'Unable to get an update|Error:|i/o timeout|no such host|bad address|TLS handshake timeout|connection timed out|context deadline exceeded|network is unreachable'
                            }
                            REPO_HOST="\${REPO_URL#http://}"
                            REPO_HOST="\${REPO_HOST#https://}"
                            REPO_HOST="\${REPO_HOST%%/*}"
                            echo "===== pod resolver ====="
                            cat /etc/resolv.conf
                            echo "===== repository host ====="
                            printf '%s\n' "\${REPO_HOST}"
                            echo "===== IPv4 resolution ====="
                            getent ahostsv4 "\${REPO_HOST}" || nslookup "\${REPO_HOST}" || true
                            attempt=1
                            while [ "\${attempt}" -le "\${HELM_ATTEMPTS}" ]; do
                              echo "===== helm repository attempt \${attempt}/\${HELM_ATTEMPTS} ====="
                              helm repo remove platform-chart-repo-dns-check >/dev/null 2>&1 || true
                              set +e
                              add_output="\$(run_bounded "\${HELM_TIMEOUT_SECONDS}" helm repo add platform-chart-repo-dns-check "\${REPO_URL}" 2>&1)"
                              add_rc="\$?"
                              printf '%s\n' "\${add_output}"
                              update_rc="not-run"
                              update_unhealthy=false
                              if [ "\${add_rc}" -eq 0 ]; then
                                update_output="\$(run_bounded "\${HELM_TIMEOUT_SECONDS}" helm repo update platform-chart-repo-dns-check 2>&1)"
                                update_rc="\$?"
                                printf '%s\n' "\${update_output}"
                                if printf '%s\n' "\${update_output}" | helm_output_has_failure >/dev/null 2>&1; then
                                  update_unhealthy=true
                                  update_rc=1
                                  echo "helm repo update returned an unhealthy repository access result." >&2
                                fi
                              fi
                              set -e
                              if [ "\${add_rc}" -eq 0 ] && [ "\${update_rc}" = "0" ] && [ "\${update_unhealthy}" = "false" ]; then
                                echo "Helm repository check succeeded on attempt \${attempt}."
                                exit 0
                              fi
                              echo "Helm repository check attempt \${attempt}/\${HELM_ATTEMPTS} failed: repo_add_rc=\${add_rc} repo_update_rc=\${update_rc} repo_update_unhealthy=\${update_unhealthy}" >&2
                              if [ "\${attempt}" -lt "\${HELM_ATTEMPTS}" ]; then
                                sleep 5
                              fi
                              attempt=\$((attempt + 1))
                            done
                            exit 1
              YAML
              done

              if [ "${expected}" -eq 0 ]; then
                echo "No Kubernetes nodes found." >&2
                exit 1
              fi

              deadline=$((SECONDS + timeout_seconds))
              while [ "${SECONDS}" -lt "${deadline}" ]; do
                total=0
                succeeded=0
                succeeded_nodes=""
                failed=0
                failed_nodes=""
                active=0
                terminal=0
                for job_ref in $("${kubectl_bin}" --kubeconfig "${kubeconfig}" -n "${namespace}" get jobs -l "${selector}" -o name 2>/dev/null || true); do
                  total=$((total + 1))
                  job_name="${job_ref#job.batch/}"
                  node_name="${job_name#platform-dns-${check_id}-}"
                  job_succeeded="$("${kubectl_bin}" --kubeconfig "${kubeconfig}" -n "${namespace}" get "${job_ref}" -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"
                  job_failed="$("${kubectl_bin}" --kubeconfig "${kubeconfig}" -n "${namespace}" get "${job_ref}" -o jsonpath='{.status.failed}' 2>/dev/null || true)"
                  job_active="$("${kubectl_bin}" --kubeconfig "${kubeconfig}" -n "${namespace}" get "${job_ref}" -o jsonpath='{.status.active}' 2>/dev/null || true)"
                  if [ "${job_succeeded}" = "1" ]; then
                    succeeded=$((succeeded + 1))
                    succeeded_nodes="${succeeded_nodes}${succeeded_nodes:+ }${node_name}"
                  fi
                  if [ -n "${job_failed}" ] && [ "${job_failed}" != "0" ]; then
                    failed=$((failed + 1))
                    failed_nodes="${failed_nodes}${failed_nodes:+ }${node_name}"
                    echo "Job ${job_name} failed."
                  fi
                  if [ -n "${job_active}" ] && [ "${job_active}" != "0" ]; then
                    active=$((active + 1))
                  fi
                done

                terminal=$((succeeded + failed))
                pending=$((expected - total))
                if [ "${pending}" -lt 0 ]; then
                  pending=0
                fi
                echo "chart repo DNS per-node status: total=${total}/${expected} pending=${pending} succeeded=${succeeded} failed=${failed} active=${active} terminal=${terminal}/${expected} succeeded_nodes=${succeeded_nodes:-none} failed_nodes=${failed_nodes:-none}"
                if [ "${total}" -eq "${expected}" ] && [ "${succeeded}" -eq "${expected}" ]; then
                  cleanup_previous
                  exit 0
                fi
                if [ "${total}" -eq "${expected}" ] && [ "${active}" -eq 0 ] && [ "${terminal}" -eq "${expected}" ]; then
                  break
                fi
                sleep "${poll_interval}"
              done

              echo "PLATFORM_CHART_REPO_DNS_SUCCEEDED_NODES=${succeeded_nodes:-none}"
              echo "PLATFORM_CHART_REPO_DNS_FAILED_NODES=${failed_nodes:-none}"
              print_diagnostics
              exit 1
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Sync current per-node chart repository DNS checker from repository
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../scripts/bootstrap/check-chart-repo-dns-all-nodes.sh"
            dest: "{{ platform_traefik_dns_check_script_path }}"
            owner: root
            group: root
            mode: "0755"
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Check Traefik chart repository DNS from pods pinned to every node
          ansible.builtin.command:
            argv:
              - "{{ platform_traefik_dns_check_script_path }}"
              - "{{ platform_traefik_chart_repo_effective }}"
              - "{{ platform_traefik_dns_check_image_effective }}"
              - "{{ platform_traefik_dns_check_timeout_effective }}"
              - "{{ platform_ingress_poll_interval_effective }}"
              - "{{ platform_traefik_dns_helm_attempts_effective }}"
              - "{{ platform_traefik_dns_helm_timeout_effective }}"
          register: platform_traefik_dns_all_nodes_check
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
      rescue:
        - name: Detect failed nodes from Traefik per-node DNS check
          ansible.builtin.set_fact:
            platform_traefik_dns_failed_nodes_effective: >-
              {{
                (
                  platform_traefik_dns_all_nodes_check.stdout
                  | default('')
                  | regex_findall('(?m)^PLATFORM_CHART_REPO_DNS_FAILED_NODES=(.*)$')
                  | first
                  | default('unknown', true)
                )
              }}
          run_once: true

        - name: Normalize failed nodes from Traefik per-node DNS check
          ansible.builtin.set_fact:
            platform_traefik_dns_failed_nodes_list_effective: >-
              {{
                (
                  (platform_traefik_dns_failed_nodes_effective | default('') | trim)
                  in ['', 'none', 'unknown']
                )
                | ternary([], platform_traefik_dns_failed_nodes_effective.split())
              }}
          run_once: true

        - name: Detect Kubernetes pod CIDRs for Traefik per-node DNS service-path repair
          ansible.builtin.shell: |
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            "$K" --kubeconfig "$C" get nodes \
              -o jsonpath='{range .items[*]}{.spec.podCIDR}{" "}{range .spec.podCIDRs[*]}{.}{" "}{end}{end}' 2>/dev/null |
              xargs -n1 2>/dev/null |
              awk 'NF' |
              sort -u |
              xargs || true
          args:
            executable: /bin/bash
          register: platform_traefik_dns_pod_cidrs_detected
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when: platform_traefik_dns_service_path_repair_effective | bool

        - name: Select pod CIDRs for Traefik per-node DNS service-path repair
          ansible.builtin.set_fact:
            platform_traefik_dns_pod_cidrs_effective: >-
              {{
                ((platform_traefik_dns_pod_cidrs_raw | trim | length) > 0)
                | ternary(platform_traefik_dns_pod_cidrs_raw, platform_traefik_dns_pod_cidrs_detected.stdout | default(''))
                | trim
                | regex_replace('\s+', ' ')
              }}
          run_once: true
          when: platform_traefik_dns_service_path_repair_effective | bool

        - name: Repair Traefik per-node DNS service path on every RKE2 node
          ansible.builtin.shell: |
            set -u
            changed=false
            firewalld_ports="{{ platform_traefik_dns_service_path_firewalld_ports | join(' ') }}"
            trusted_interfaces="{{ platform_traefik_dns_service_path_firewalld_trusted_interfaces | join(' ') }}"
            pod_cidrs="{{ hostvars[rke2_first_server].platform_traefik_dns_pod_cidrs_effective | default('') }}"
            node_sources="{% for node in groups['rke2_servers'] | default([]) %}{{ hostvars[node].ansible_host | default(node) }}/32 {% endfor %}"

            echo "===== host ====="
            hostname -f 2>/dev/null || hostname
            echo "===== failed nodes from per-node DNS check ====="
            printf '%s\n' "{{ hostvars[rke2_first_server].platform_traefik_dns_failed_nodes_effective | default('unknown') }}"
            echo "===== selected pod CIDRs ====="
            printf '%s\n' "${pod_cidrs}"
            echo "===== selected RKE2 node sources ====="
            printf '%s\n' "${node_sources}"

            echo "===== kernel modules ====="
            for module in br_netfilter overlay nf_conntrack; do
              if modprobe "${module}" >/dev/null 2>&1; then
                echo "loaded ${module}"
              else
                echo "could not load ${module}"
              fi
            done

            cat > "{{ platform_traefik_dns_service_path_sysctl_file }}" <<'EOF'
            net.ipv4.ip_forward=1
            net.ipv4.conf.all.rp_filter=0
            net.ipv4.conf.default.rp_filter=0
            EOF
            sysctl --system >/tmp/platform-traefik-dns-sysctl.log 2>&1 || cat /tmp/platform-traefik-dns-sysctl.log
            for path in /proc/sys/net/ipv4/conf/*/rp_filter; do
              if [ -w "${path}" ]; then
                printf '0\n' > "${path}" || true
              fi
            done

            echo "===== sysctl ====="
            sysctl net.ipv4.ip_forward net.ipv4.conf.all.rp_filter net.ipv4.conf.default.rp_filter || true
            grep -H . /proc/sys/net/ipv4/conf/*/rp_filter 2>/dev/null || true
            echo "===== firewalld ====="
            if command -v firewall-cmd >/dev/null 2>&1 && firewall-cmd --state >/dev/null 2>&1; then
              for port in ${firewalld_ports}; do
                if ! firewall-cmd --permanent --query-port="${port}" >/dev/null 2>&1; then
                  if firewall-cmd --permanent --add-port="${port}"; then
                    changed=true
                    echo "added firewalld port ${port}"
                  fi
                fi
              done
              for source in ${pod_cidrs}; do
                if ! firewall-cmd --permanent --zone=trusted --query-source="${source}" >/dev/null 2>&1; then
                  if firewall-cmd --permanent --zone=trusted --add-source="${source}"; then
                    changed=true
                    echo "trusted pod CIDR ${source}"
                  fi
                fi
              done
              for source in ${node_sources}; do
                case "${source}" in
                  ''|*[!0-9./]*) continue ;;
                esac
                if ! firewall-cmd --permanent --zone=trusted --query-source="${source}" >/dev/null 2>&1; then
                  if firewall-cmd --permanent --zone=trusted --add-source="${source}"; then
                    changed=true
                    echo "trusted RKE2 node source ${source}"
                  fi
                fi
              done
              for interface in ${trusted_interfaces}; do
                if ! firewall-cmd --permanent --zone=trusted --query-interface="${interface}" >/dev/null 2>&1; then
                  if firewall-cmd --permanent --zone=trusted --change-interface="${interface}"; then
                    changed=true
                    echo "trusted Cilium interface ${interface}"
                  fi
                fi
              done
              for interface in $(ip -o link show 2>/dev/null | awk -F': ' '{print $2}' | cut -d@ -f1 | grep -E '^(cilium|lxc|cni|veth)' | sort -u || true); do
                if ! firewall-cmd --permanent --zone=trusted --query-interface="${interface}" >/dev/null 2>&1; then
                  if firewall-cmd --permanent --zone=trusted --change-interface="${interface}"; then
                    changed=true
                    echo "trusted active CNI interface ${interface}"
                  fi
                fi
              done
              add_direct_rule() {
                family="$1"
                table="$2"
                chain="$3"
                priority="$4"
                shift 4
                if ! firewall-cmd --permanent --direct --query-rule "${family}" "${table}" "${chain}" "${priority}" "$@" >/dev/null 2>&1; then
                  if firewall-cmd --permanent --direct --add-rule "${family}" "${table}" "${chain}" "${priority}" "$@"; then
                    changed=true
                    echo "added direct rule: ${family} ${table} ${chain} ${priority} $*"
                  fi
                fi
              }
              for source in ${pod_cidrs}; do
                case "${source}" in
                  ''|*[!0-9./]*) continue ;;
                esac
                add_direct_rule ipv4 filter FORWARD 0 -s "${source}" -d "${source}" -j ACCEPT
                add_direct_rule ipv4 filter INPUT 0 -s "${source}" -j ACCEPT
                add_direct_rule ipv4 filter OUTPUT 0 -d "${source}" -j ACCEPT
              done
              for prefix in cilium+ lxc+ cni+ veth+; do
                add_direct_rule ipv4 filter FORWARD 0 -i "${prefix}" -j ACCEPT
                add_direct_rule ipv4 filter FORWARD 0 -o "${prefix}" -j ACCEPT
              done
              if [ "${changed}" = true ]; then
                firewall-cmd --reload || true
              fi
              firewall-cmd --get-active-zones || true
              firewall-cmd --zone=trusted --list-all || true
              firewall-cmd --direct --get-all-rules || true
            else
              echo "firewalld inactive or unavailable"
            fi
            echo "changed=${changed}"
          args:
            executable: /bin/bash
          register: platform_traefik_dns_host_repair
          changed_when: "'changed=true' in (platform_traefik_dns_host_repair.stdout | default(''))"
          failed_when: false
          loop: "{{ groups['rke2_servers'] }}"
          loop_control:
            label: "{{ item }}"
          delegate_to: "{{ item }}"
          run_once: true
          when: platform_traefik_dns_service_path_repair_effective | bool

        - name: Refresh kube-proxy after Traefik per-node DNS failure
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            for daemonset in kube-proxy rke2-kube-proxy; do
              if "$K" --kubeconfig "$C" -n kube-system get "daemonset/${daemonset}" >/dev/null 2>&1; then
                "$K" --kubeconfig "$C" -n kube-system rollout restart "daemonset/${daemonset}"
                echo "restarted daemonset/${daemonset}"
                exit 0
              fi
            done
            request_timeout={{ platform_metallb_webhook_probe_timeout_effective }}s
            "$K" --kubeconfig "$C" --request-timeout="${request_timeout}" -n kube-system \
              delete pod -l k8s-app=kube-proxy --ignore-not-found=true --wait=false || true
            "$K" --kubeconfig "$C" --request-timeout="${request_timeout}" -n kube-system get pods -o name |
              awk -F/ '/\/kube-proxy-/ {print $2}' |
              xargs -r "$K" --kubeconfig "$C" --request-timeout="${request_timeout}" -n kube-system \
                delete pod --ignore-not-found=true --wait=false || true
            echo "refreshed static kube-proxy pods"
          args:
            executable: /bin/bash
          register: platform_traefik_dns_kube_proxy_refresh
          changed_when: >-
            'restarted' in platform_traefik_dns_kube_proxy_refresh.stdout
            or 'deleted' in platform_traefik_dns_kube_proxy_refresh.stdout
            or 'refreshed static kube-proxy pods' in platform_traefik_dns_kube_proxy_refresh.stdout
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Poll kube-proxy after Traefik per-node DNS repair
          ansible.builtin.shell: |
            set -o pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            for daemonset in kube-proxy rke2-kube-proxy; do
              if "$K" --kubeconfig "$C" -n kube-system get "daemonset/${daemonset}" >/dev/null 2>&1; then
                "$K" --kubeconfig "$C" -n kube-system rollout status "daemonset/${daemonset}" --timeout={{ platform_ingress_poll_interval_effective }}s
                exit 0
              fi
            done
            expected={{ groups['rke2_servers'] | length }}
            "$K" --kubeconfig "$C" -n kube-system get pods -o wide | awk -v expected="${expected}" '
              NR == 1 { print; next }
              $1 ~ /^kube-proxy-/ {
                print
                total++
                split($2, ready, "/")
                if ($3 == "Running" && ready[1] == ready[2]) running++
              }
              END { exit(total == expected && running == expected ? 0 : 1) }
            '
          args:
            executable: /bin/bash
          register: platform_traefik_dns_kube_proxy_rollout
          retries: "{{ platform_metallb_webhook_wait_retries }}"
          delay: "{{ platform_ingress_poll_interval_effective }}"
          until: platform_traefik_dns_kube_proxy_rollout.rc == 0
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Restart Cilium after Traefik per-node DNS failure
          ansible.builtin.command: >-
            /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
            -n kube-system rollout restart daemonset/cilium
          register: platform_traefik_dns_cilium_restart
          changed_when: "'restarted' in platform_traefik_dns_cilium_restart.stdout"
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Poll Cilium after Traefik per-node DNS repair
          ansible.builtin.command: >-
            /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
            -n kube-system rollout status daemonset/cilium
            --timeout={{ platform_ingress_poll_interval_effective }}s
          register: platform_traefik_dns_cilium_rollout
          retries: "{{ platform_metallb_webhook_wait_retries }}"
          delay: "{{ platform_ingress_poll_interval_effective }}"
          until: platform_traefik_dns_cilium_rollout.rc == 0
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when: platform_traefik_dns_cilium_restart.rc | default(1) == 0

        - name: Ensure CoreDNS HA placement before Traefik per-node DNS retry
          ansible.builtin.shell: |
            set -euo pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            replicas={{ platform_traefik_dns_coredns_replicas_effective | int }}
            expected_nodes={{ [platform_traefik_dns_coredns_replicas_effective | int, groups['rke2_servers'] | length] | min }}
            deployment="$("$K" --kubeconfig "$C" -n kube-system get deployment -l k8s-app=kube-dns -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
            if [ -z "${deployment}" ] && "$K" --kubeconfig "$C" -n kube-system get deployment/rke2-coredns-rke2-coredns >/dev/null 2>&1; then
              deployment=rke2-coredns-rke2-coredns
            fi
            if [ -z "${deployment}" ]; then
              echo "No CoreDNS deployment with label k8s-app=kube-dns was found." >&2
              "$K" --kubeconfig "$C" -n kube-system get deployment,pods -o wide | grep -E 'NAME|coredns|kube-dns' || true
              exit 1
            fi

            autoscaler="$("$K" --kubeconfig "$C" -n kube-system get deployment -o name 2>/dev/null |
              grep -E '/.*coredns.*autoscaler' |
              head -n 1 || true)"
            if [ -n "${autoscaler}" ]; then
              "$K" --kubeconfig "$C" -n kube-system scale "${autoscaler}" --replicas=0
              echo "Scaled ${autoscaler} to 0 so fixed HA CoreDNS placement is not reconciled back to 2 replicas."
            else
              echo "No CoreDNS autoscaler deployment found."
            fi

            cat >/tmp/platform-coredns-ha-placement-patch.json <<EOF
            {
              "spec": {
                "replicas": ${replicas},
                "template": {
                  "spec": {
                    "topologySpreadConstraints": [
                      {
                        "maxSkew": 1,
                        "topologyKey": "kubernetes.io/hostname",
                        "whenUnsatisfiable": "DoNotSchedule",
                        "labelSelector": {
                          "matchLabels": {
                            "k8s-app": "kube-dns"
                          }
                        }
                      }
                    ],
                    "affinity": {
                      "podAntiAffinity": {
                        "requiredDuringSchedulingIgnoredDuringExecution": [
                          {
                            "labelSelector": {
                              "matchLabels": {
                                "k8s-app": "kube-dns"
                              }
                            },
                            "topologyKey": "kubernetes.io/hostname"
                          }
                        ],
                        "preferredDuringSchedulingIgnoredDuringExecution": []
                      }
                    }
                  }
                }
              }
            }
            EOF

            "$K" --kubeconfig "$C" -n kube-system patch "deployment/${deployment}" \
              --type merge --patch-file /tmp/platform-coredns-ha-placement-patch.json
            "$K" --kubeconfig "$C" -n kube-system scale "deployment/${deployment}" --replicas="${replicas}"
            service_names="$("$K" --kubeconfig "$C" -n kube-system get svc -l k8s-app=kube-dns -o name 2>/dev/null || true)"
            if [ -z "${service_names}" ]; then
              echo "No CoreDNS service with label k8s-app=kube-dns was found." >&2
              "$K" --kubeconfig "$C" -n kube-system get svc,endpoints,endpointslice -o wide |
                grep -E 'NAME|coredns|kube-dns' || true
              exit 1
            fi
            for service in ${service_names}; do
              "$K" --kubeconfig "$C" -n kube-system patch "${service}" --type merge \
                -p '{"spec":{"internalTrafficPolicy":"Local"}}'
              echo "Patched ${service} with internalTrafficPolicy=Local."
            done
            "$K" --kubeconfig "$C" -n kube-system rollout status "deployment/${deployment}" \
              --timeout={{ platform_ingress_poll_interval_effective }}s

            echo "===== CoreDNS deployment ====="
            "$K" --kubeconfig "$C" -n kube-system get "deployment/${deployment}" -o wide
            echo "===== CoreDNS autoscaler ====="
            "$K" --kubeconfig "$C" -n kube-system get deployment -o wide |
              grep -E 'NAME|coredns.*autoscaler' || true
            echo "===== CoreDNS pods ====="
            "$K" --kubeconfig "$C" -n kube-system get pods -l k8s-app=kube-dns -o wide
            echo "===== CoreDNS service ====="
            "$K" --kubeconfig "$C" -n kube-system get svc -l k8s-app=kube-dns \
              -o jsonpath='{range .items[*]}{.metadata.name}{" internalTrafficPolicy="}{.spec.internalTrafficPolicy}{" clusterIP="}{.spec.clusterIP}{"\n"}{end}'
            endpoint_count="$("$K" --kubeconfig "$C" -n kube-system get endpoints -l k8s-app=kube-dns \
              -o jsonpath='{range .items[*].subsets[*].addresses[*]}{.ip}{" "}{end}' 2>/dev/null |
              wc -w | xargs)"
            endpoint_nodes="$("$K" --kubeconfig "$C" -n kube-system get pods -l k8s-app=kube-dns \
              -o jsonpath='{range .items[?(@.status.phase=="Running")]}{.spec.nodeName}{" "}{end}' 2>/dev/null |
              xargs -n1 2>/dev/null |
              sort -u |
              xargs || true)"
            endpoint_node_count="$(printf '%s\n' ${endpoint_nodes:-} 2>/dev/null | awk 'NF { count++ } END { print count + 0 }')"
            echo "CoreDNS endpoint count=${endpoint_count}, target replicas=${replicas}"
            echo "CoreDNS endpoint nodes=${endpoint_nodes:-none}, target node coverage=${expected_nodes}"
            test "${endpoint_count}" -ge "${replicas}"
            test "${endpoint_node_count}" -ge "${expected_nodes}"
          args:
            executable: /bin/bash
          register: platform_traefik_dns_coredns_ha_patch
          changed_when: >-
            'patched' in (platform_traefik_dns_coredns_ha_patch.stdout | lower)
            or 'scaled' in (platform_traefik_dns_coredns_ha_patch.stdout | lower)
          failed_when: platform_traefik_dns_coredns_ha_patch.rc != 0
          retries: "{{ platform_ingress_wait_retries }}"
          delay: "{{ platform_ingress_poll_interval_effective }}"
          until: platform_traefik_dns_coredns_ha_patch.rc == 0
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Show Traefik per-node DNS retry timeout
          ansible.builtin.debug:
            msg: >-
              Retrying Traefik chart repository DNS from every node after repair.
              This retry can run up to {{ platform_traefik_dns_retry_timeout_effective }}s.
              To fail faster, set PLATFORM_TRAEFIK_DNS_RETRY_TIMEOUT.
          run_once: true

        - name: Retry Traefik chart repository DNS from every node
          ansible.builtin.command:
            argv:
              - "{{ platform_traefik_dns_check_script_path }}"
              - "{{ platform_traefik_chart_repo_effective }}"
              - "{{ platform_traefik_dns_check_image_effective }}"
              - "{{ platform_traefik_dns_retry_timeout_effective }}"
              - "{{ platform_ingress_poll_interval_effective }}"
              - "{{ platform_traefik_dns_helm_attempts_effective }}"
              - "{{ platform_traefik_dns_helm_timeout_effective }}"
          register: platform_traefik_dns_all_nodes_retry
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Detect failed nodes from Traefik per-node DNS retry
          ansible.builtin.set_fact:
            platform_traefik_dns_retry_failed_nodes_effective: >-
              {{
                (
                  platform_traefik_dns_all_nodes_retry.stdout
                  | default('')
                  | regex_findall('(?m)^PLATFORM_CHART_REPO_DNS_FAILED_NODES=(.*)$')
                  | first
                  | default(platform_traefik_dns_failed_nodes_effective | default('unknown'), true)
                )
              }}
          run_once: true
          when: platform_traefik_dns_all_nodes_retry.rc | default(1) != 0

        - name: Normalize failed nodes from Traefik per-node DNS retry
          ansible.builtin.set_fact:
            platform_traefik_dns_retry_failed_nodes_list_effective: >-
              {{
                (
                  (platform_traefik_dns_retry_failed_nodes_effective | default('') | trim)
                  in ['', 'none', 'unknown']
                )
                | ternary([], platform_traefik_dns_retry_failed_nodes_effective.split())
              }}
          run_once: true
          when: platform_traefik_dns_all_nodes_retry.rc | default(1) != 0

        - name: Restart RKE2 on nodes with persistent Traefik DNS service-path failure
          ansible.builtin.command: systemctl restart rke2-server
          register: platform_traefik_dns_failed_node_rke2_restart
          changed_when: true
          loop: "{{ hostvars[rke2_first_server].platform_traefik_dns_retry_failed_nodes_list_effective | default([]) }}"
          loop_control:
            label: "{{ item }}"
          delegate_to: "{{ item }}"
          run_once: true
          when:
            - platform_traefik_dns_failed_node_restart_effective | bool
            - platform_traefik_dns_all_nodes_retry.rc | default(1) != 0
            - item in groups['rke2_servers']

        - name: Wait for restarted failed-node RKE2 services
          ansible.builtin.command: systemctl is-active rke2-server
          register: platform_traefik_dns_failed_node_rke2_active
          changed_when: false
          retries: "{{ platform_traefik_dns_failed_node_restart_retries }}"
          delay: "{{ platform_ingress_poll_interval_effective }}"
          until: platform_traefik_dns_failed_node_rke2_active.rc == 0
          loop: "{{ hostvars[rke2_first_server].platform_traefik_dns_retry_failed_nodes_list_effective | default([]) }}"
          loop_control:
            label: "{{ item }}"
          delegate_to: "{{ item }}"
          run_once: true
          when:
            - platform_traefik_dns_failed_node_restart_effective | bool
            - platform_traefik_dns_all_nodes_retry.rc | default(1) != 0
            - item in groups['rke2_servers']

        - name: Wait for restarted failed nodes to report Ready
          ansible.builtin.shell: |
            set -euo pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            failed_nodes="{{ hostvars[rke2_first_server].platform_traefik_dns_retry_failed_nodes_list_effective | default([]) | join(' ') }}"
            for node in ${failed_nodes}; do
              "$K" --kubeconfig "$C" get node "${node}" --no-headers |
                awk '$2 == "Ready" { found=1 } END { exit(found ? 0 : 1) }'
            done
          args:
            executable: /bin/bash
          register: platform_traefik_dns_failed_nodes_ready
          changed_when: false
          retries: "{{ platform_traefik_dns_failed_node_restart_retries }}"
          delay: "{{ platform_ingress_poll_interval_effective }}"
          until: platform_traefik_dns_failed_nodes_ready.rc == 0
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when:
            - platform_traefik_dns_failed_node_restart_effective | bool
            - platform_traefik_dns_all_nodes_retry.rc | default(1) != 0
            - (hostvars[rke2_first_server].platform_traefik_dns_retry_failed_nodes_list_effective | default([]) | length) > 0

        - name: Wait for Cilium on restarted failed nodes
          ansible.builtin.shell: |
            set -euo pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            failed_nodes="{{ hostvars[rke2_first_server].platform_traefik_dns_retry_failed_nodes_list_effective | default([]) | join(' ') }}"
            for node in ${failed_nodes}; do
              "$K" --kubeconfig "$C" -n kube-system get pods -l k8s-app=cilium --field-selector spec.nodeName="${node}" --no-headers |
                awk 'BEGIN { ok=0 } $3 == "Running" && $2 ~ /^1\/1$/ { ok=1 } END { exit(ok ? 0 : 1) }'
            done
          args:
            executable: /bin/bash
          register: platform_traefik_dns_failed_nodes_cilium_ready
          changed_when: false
          retries: "{{ platform_traefik_dns_failed_node_restart_retries }}"
          delay: "{{ platform_ingress_poll_interval_effective }}"
          until: platform_traefik_dns_failed_nodes_cilium_ready.rc == 0
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when:
            - platform_traefik_dns_failed_node_restart_effective | bool
            - platform_traefik_dns_all_nodes_retry.rc | default(1) != 0
            - (hostvars[rke2_first_server].platform_traefik_dns_retry_failed_nodes_list_effective | default([]) | length) > 0

        - name: Wait for kube-proxy on restarted failed nodes
          ansible.builtin.shell: |
            set -euo pipefail
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            failed_nodes="{{ hostvars[rke2_first_server].platform_traefik_dns_retry_failed_nodes_list_effective | default([]) | join(' ') }}"
            for node in ${failed_nodes}; do
              echo "===== kube-proxy on ${node} ====="
              "$K" --kubeconfig "$C" -n kube-system get pods --field-selector spec.nodeName="${node}" -o wide |
                awk '
                  NR == 1 { print; next }
                  $1 ~ /^kube-proxy-/ {
                    print
                    total++
                    split($2, ready, "/")
                    if ($3 == "Running" && ready[1] == ready[2]) running++
                  }
                  END { exit(total > 0 && running == total ? 0 : 1) }
                '
            done
          args:
            executable: /bin/bash
          register: platform_traefik_dns_failed_nodes_kube_proxy_ready
          changed_when: false
          failed_when: false
          retries: "{{ platform_traefik_dns_failed_node_restart_retries }}"
          delay: "{{ platform_ingress_poll_interval_effective }}"
          until: platform_traefik_dns_failed_nodes_kube_proxy_ready.rc == 0
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when:
            - platform_traefik_dns_failed_node_restart_effective | bool
            - platform_traefik_dns_all_nodes_retry.rc | default(1) != 0
            - (hostvars[rke2_first_server].platform_traefik_dns_retry_failed_nodes_list_effective | default([]) | length) > 0

        - name: Wait briefly for failed-node service rules to settle
          ansible.builtin.pause:
            seconds: "{{ platform_ingress_poll_interval_effective }}"
          run_once: true
          when:
            - platform_traefik_dns_failed_node_restart_effective | bool
            - platform_traefik_dns_all_nodes_retry.rc | default(1) != 0
            - (hostvars[rke2_first_server].platform_traefik_dns_retry_failed_nodes_list_effective | default([]) | length) > 0

        - name: Retry Traefik chart repository DNS after failed-node RKE2 restart
          ansible.builtin.command:
            argv:
              - "{{ platform_traefik_dns_check_script_path }}"
              - "{{ platform_traefik_chart_repo_effective }}"
              - "{{ platform_traefik_dns_check_image_effective }}"
              - "{{ platform_traefik_dns_retry_timeout_effective }}"
              - "{{ platform_ingress_poll_interval_effective }}"
              - "{{ platform_traefik_dns_helm_attempts_effective }}"
              - "{{ platform_traefik_dns_helm_timeout_effective }}"
          register: platform_traefik_dns_all_nodes_after_failed_node_restart
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when:
            - platform_traefik_dns_failed_node_restart_effective | bool
            - platform_traefik_dns_all_nodes_retry.rc | default(1) != 0
            - (hostvars[rke2_first_server].platform_traefik_dns_retry_failed_nodes_list_effective | default([]) | length) > 0

        - name: Detect failed nodes after failed-node RKE2 restart
          ansible.builtin.set_fact:
            platform_traefik_dns_final_failed_nodes_effective: >-
              {{
                (
                  platform_traefik_dns_all_nodes_after_failed_node_restart.stdout
                  | default('')
                  | regex_findall('(?m)^PLATFORM_CHART_REPO_DNS_FAILED_NODES=(.*)$')
                  | first
                  | default(platform_traefik_dns_retry_failed_nodes_effective | default(platform_traefik_dns_failed_nodes_effective | default('unknown'), true), true)
                )
              }}
          run_once: true
          when:
            - platform_traefik_dns_all_nodes_after_failed_node_restart is defined
            - platform_traefik_dns_all_nodes_after_failed_node_restart.rc | default(1) != 0

        - name: Normalize final failed nodes after failed-node RKE2 restart
          ansible.builtin.set_fact:
            platform_traefik_dns_final_failed_nodes_list_effective: >-
              {{
                (
                  (platform_traefik_dns_final_failed_nodes_effective | default('') | trim)
                  in ['', 'none', 'unknown']
                )
                | ternary([], platform_traefik_dns_final_failed_nodes_effective.split())
              }}
          run_once: true
          when:
            - platform_traefik_dns_all_nodes_after_failed_node_restart is defined
            - platform_traefik_dns_all_nodes_after_failed_node_restart.rc | default(1) != 0

        - name: Collect failed-node Kubernetes DNS diagnostics
          ansible.builtin.shell: |
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            failed_nodes="{{ hostvars[rke2_first_server].platform_traefik_dns_final_failed_nodes_effective | default(hostvars[rke2_first_server].platform_traefik_dns_retry_failed_nodes_effective | default(hostvars[rke2_first_server].platform_traefik_dns_failed_nodes_effective | default('unknown'), true), true) }}"
            echo "===== failed Kubernetes nodes ====="
            printf '%s\n' "${failed_nodes}"
            echo "===== Kubernetes nodes ====="
            "$K" --kubeconfig "$C" get nodes -o wide || true
            echo "===== CoreDNS service/endpoints ====="
            "$K" --kubeconfig "$C" -n kube-system get svc,endpoints,endpointslice -l k8s-app=kube-dns -o wide || true
            "$K" --kubeconfig "$C" -n kube-system get svc,endpoints,endpointslice | grep -E 'coredns|kube-dns|NAME' || true
            echo "===== CoreDNS pods ====="
            "$K" --kubeconfig "$C" -n kube-system get pods -l k8s-app=kube-dns -o wide || true
            echo "===== kube-proxy and Cilium workloads on failed nodes ====="
            for node in ${failed_nodes}; do
              if [ "${node}" = "none" ] || [ "${node}" = "unknown" ]; then
                continue
              fi
              echo "--- node ${node} ---"
              "$K" --kubeconfig "$C" -n kube-system get pods --field-selector spec.nodeName="${node}" -o wide |
                grep -E 'NAME|cilium|kube-proxy|coredns|rke2-coredns' || true
              echo "--- Cilium logs on ${node} ---"
              for pod in $("$K" --kubeconfig "$C" -n kube-system get pods -l k8s-app=cilium --field-selector spec.nodeName="${node}" -o name 2>/dev/null || true); do
                echo "### ${pod}"
                echo "### ${pod} status"
                "$K" --kubeconfig "$C" -n kube-system exec "${pod}" -c cilium-agent -- sh -c '
                  if command -v cilium-dbg >/dev/null 2>&1; then
                    echo "===== cilium-dbg status ====="
                    cilium-dbg status --verbose || true
                    echo "===== cilium-dbg tunnel list ====="
                    cilium-dbg bpf tunnel list || true
                    echo "===== cilium-dbg endpoint list ====="
                    cilium-dbg endpoint list || true
                  fi
                  if command -v cilium >/dev/null 2>&1; then
                    echo "===== cilium status ====="
                    cilium status --verbose || true
                  fi
                  if command -v cilium-health >/dev/null 2>&1; then
                    echo "===== cilium-health status ====="
                    cilium-health status || true
                  fi
                ' || true
                echo "### ${pod} logs"
                "$K" --kubeconfig "$C" -n kube-system logs "${pod}" --all-containers --tail=120 || true
              done
              echo "--- kube-proxy logs on ${node} ---"
              for pod in $("$K" --kubeconfig "$C" -n kube-system get pods --field-selector spec.nodeName="${node}" -o name 2>/dev/null | grep '/kube-proxy-' || true); do
                echo "### ${pod}"
                "$K" --kubeconfig "$C" -n kube-system logs "${pod}" --all-containers --tail=120 || true
              done
            done
            echo "===== Cilium config ====="
            "$K" --kubeconfig "$C" -n kube-system get configmap cilium-config -o yaml 2>/dev/null || true
          args:
            executable: /bin/bash
          register: platform_traefik_dns_failed_node_k8s_diagnostics
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when: >-
            (platform_traefik_dns_all_nodes_after_failed_node_restart.rc
            | default(platform_traefik_dns_all_nodes_retry.rc | default(1))) != 0

        - name: Collect failed-node host network diagnostics
          ansible.builtin.shell: |
            echo "===== inventory identity ====="
            echo "inventory_host={{ item }}"
            echo "ansible_host={{ hostvars[item].ansible_host | default(item) }}"
            echo "hostname=$(hostname 2>/dev/null || true)"
            echo "hostname_fqdn=$(hostname -f 2>/dev/null || true)"
            echo "===== addresses ====="
            ip -br addr || true
            echo "===== routes ====="
            ip route || true
            echo "===== kube-proxy process and sockets ====="
            ps -ef | grep -E '[k]ube-proxy|[r]ke2' | head -120 || true
            ss -lntup 2>/dev/null | grep -E ':(53|6443|9345|10249|10256|10250|4240|4244)[[:space:]]' || true
            echo "===== sysctl ====="
            sysctl net.ipv4.ip_forward net.ipv4.conf.all.rp_filter net.ipv4.conf.default.rp_filter || true
            grep -H . /proc/sys/net/ipv4/conf/*/rp_filter 2>/dev/null || true
            echo "===== kernel modules ====="
            lsmod | grep -E 'br_netfilter|overlay|nf_conntrack|vxlan' || true
            echo "===== Kubernetes DNS service NAT rules ====="
            if command -v iptables-save >/dev/null 2>&1; then
              iptables-save -t nat |
                grep -E '10[.]43[.]0[.]10|kube-dns|KUBE-SVC|KUBE-SEP|dpt:53|--dport 53' |
                head -240 || true
            else
              echo "iptables-save=missing"
            fi
            echo "===== nft Kubernetes DNS/service rules ====="
            if command -v nft >/dev/null 2>&1; then
              nft list ruleset 2>/dev/null |
                grep -E '10[.]43[.]0[.]10|kube-dns|KUBE-SVC|KUBE-SEP|10[.]42[.]|10[.]43[.]' |
                head -240 || true
            else
              echo "nft=missing"
            fi
            echo "===== conntrack DNS service entries ====="
            if command -v conntrack >/dev/null 2>&1; then
              conntrack -L -p udp 2>/dev/null |
                grep -E '10[.]43[.]0[.]10|dport=53|sport=53' |
                head -120 || true
            else
              echo "conntrack=missing"
            fi
            echo "===== firewalld zones ====="
            if command -v firewall-cmd >/dev/null 2>&1; then
              firewall-cmd --state || true
              firewall-cmd --get-active-zones || true
              firewall-cmd --zone=trusted --list-all || true
              firewall-cmd --zone=public --list-all || true
              firewall-cmd --direct --get-all-rules || true
            else
              echo "firewalld=missing"
            fi
            echo "===== Cilium interfaces ====="
            ip -d link show cilium_host cilium_net cilium_vxlan 2>/dev/null || true
            echo "===== Cilium VXLAN forwarding and neighbors ====="
            if command -v bridge >/dev/null 2>&1; then
              bridge fdb show dev cilium_vxlan 2>/dev/null || true
            else
              echo "bridge=missing"
            fi
            ip neigh show || true
            echo "===== RKE2 network logs ====="
            journalctl -u rke2-server -n 160 --no-pager |
              grep -E 'cilium|kube-proxy|CoreDNS|coredns|dns|iptables|nft|firewall|network|service' || true
          args:
            executable: /bin/bash
          register: platform_traefik_dns_failed_node_host_diagnostics
          changed_when: false
          failed_when: false
          loop: >-
            {{
              hostvars[rke2_first_server].platform_traefik_dns_final_failed_nodes_list_effective
              | default(hostvars[rke2_first_server].platform_traefik_dns_retry_failed_nodes_list_effective
              | default(hostvars[rke2_first_server].platform_traefik_dns_failed_nodes_list_effective
              | default([]), true), true)
            }}
          loop_control:
            label: "{{ item }}"
          delegate_to: "{{ item }}"
          run_once: true
          when:
            - (platform_traefik_dns_all_nodes_after_failed_node_restart.rc | default(platform_traefik_dns_all_nodes_retry.rc | default(1))) != 0
            - item in groups['rke2_servers']

        - name: Show Traefik per-node DNS automatic repair result
          ansible.builtin.debug:
            msg:
              - "Initial per-node DNS check:"
              - "{{ platform_traefik_dns_all_nodes_check.stdout_lines | default(['not collected']) }}"
              - "Host service-path repair:"
              - "{{ platform_traefik_dns_host_repair.results | default([]) | selectattr('stdout_lines', 'defined') | map(attribute='stdout_lines') | list | default(['not run'], true) }}"
              - "kube-proxy repair:"
              - "{{ platform_traefik_dns_kube_proxy_rollout.stdout_lines | default(platform_traefik_dns_kube_proxy_refresh.stdout_lines | default(['not run'])) }}"
              - "Cilium repair:"
              - "{{ platform_traefik_dns_cilium_rollout.stdout_lines | default(platform_traefik_dns_cilium_restart.stdout_lines | default(['not run'])) }}"
              - "CoreDNS HA placement:"
              - "{{ platform_traefik_dns_coredns_ha_patch.stdout_lines | default(['not run']) }}"
              - "Retry per-node DNS check:"
              - "{{ platform_traefik_dns_all_nodes_retry.stdout_lines | default(['not run']) }}"
              - "Failed-node RKE2 restart:"
              - "{{ platform_traefik_dns_failed_node_rke2_restart.results | default([]) | selectattr('stdout_lines', 'defined') | map(attribute='stdout_lines') | list | default(['not run'], true) }}"
              - "Failed-node kube-proxy readiness:"
              - "{{ platform_traefik_dns_failed_nodes_kube_proxy_ready.stdout_lines | default(['not run']) }}"
              - "Post failed-node restart DNS check:"
              - "{{ platform_traefik_dns_all_nodes_after_failed_node_restart.stdout_lines | default(['not run']) }}"
              - "Failed-node Kubernetes diagnostics:"
              - "{{ platform_traefik_dns_failed_node_k8s_diagnostics.stdout_lines | default(['not collected']) }}"
              - "Failed-node host diagnostics:"
              - "{{ platform_traefik_dns_failed_node_host_diagnostics.results | default([]) | selectattr('stdout_lines', 'defined') | map(attribute='stdout_lines') | list | default(['not collected'], true) }}"
          run_once: true

        - name: Stop when Traefik chart repository DNS fails from one or more nodes
          ansible.builtin.fail:
            msg: |
              One or more RKE2 nodes still cannot resolve or reach the Traefik chart repository
              from an in-cluster pod after automatic host service-path,
              CoreDNS HA placement, kube-proxy, Cilium, and failed-node
              RKE2 restart repair.

              Repository:
              {{ platform_traefik_chart_repo_effective }}

              Initial check result:
              rc={{ platform_traefik_dns_all_nodes_check.rc | default('not set') }}
              msg={{ platform_traefik_dns_all_nodes_check.msg | default('') }}
              stdout:
              {{ platform_traefik_dns_all_nodes_check.stdout | default('not collected') }}
              stderr:
              {{ platform_traefik_dns_all_nodes_check.stderr | default('') }}

              Retry check result:
              rc={{ platform_traefik_dns_all_nodes_retry.rc | default('not set') }}
              msg={{ platform_traefik_dns_all_nodes_retry.msg | default('') }}
              stdout:
              {{ platform_traefik_dns_all_nodes_retry.stdout | default('not run') }}
              stderr:
              {{ platform_traefik_dns_all_nodes_retry.stderr | default('') }}

              Post failed-node restart check result:
              rc={{ platform_traefik_dns_all_nodes_after_failed_node_restart.rc | default('not run') }}
              msg={{ platform_traefik_dns_all_nodes_after_failed_node_restart.msg | default('') }}
              stdout:
              {{ platform_traefik_dns_all_nodes_after_failed_node_restart.stdout | default('not run') }}
              stderr:
              {{ platform_traefik_dns_all_nodes_after_failed_node_restart.stderr | default('') }}

              Failed-node RKE2 restart:
              {{ platform_traefik_dns_failed_node_rke2_restart.results | default([]) | selectattr('stdout', 'defined') | map(attribute='stdout') | list | join('\n---\n') | default('not run', true) }}

              Host service-path repair:
              {{ platform_traefik_dns_host_repair.results | default([]) | selectattr('stdout', 'defined') | map(attribute='stdout') | list | join('\n---\n') | default('not run', true) }}

              CoreDNS HA placement:
              {{ platform_traefik_dns_coredns_ha_patch.stdout | default('not run') }}

              Failed-node kube-proxy readiness:
              {{ platform_traefik_dns_failed_nodes_kube_proxy_ready.stdout | default('not run') }}

              Failed-node Kubernetes diagnostics:
              {{ platform_traefik_dns_failed_node_k8s_diagnostics.stdout | default('not collected') }}

              Failed-node host diagnostics:
              {{ platform_traefik_dns_failed_node_host_diagnostics.results | default([]) | selectattr('stdout', 'defined') | map(attribute='stdout') | list | join('\n---\n') | default('not collected', true) }}

              This is a node-specific Kubernetes DNS/network path problem. If
              PLATFORM_NODE_DNS_SERVICE_OK=false but
              PLATFORM_NODE_COREDNS_ENDPOINT_OK=true, focus on kube-proxy or
              service NAT. If both are false, focus on Cilium pod-to-pod overlay
              between that node and the CoreDNS endpoint nodes. If Cilium health
              shows host connectivity OK but endpoint HTTP timeouts, focus on
              pod-to-pod L4 forwarding and host firewall filtering on CNI/lxc
              interfaces.

              The playbook already repaired CNI sysctls, per-interface
              reverse-path filtering, firewalld service-path and node-peer
              trust, direct CNI firewalld ACCEPT rules, kube-proxy, Cilium,
              CoreDNS HA placement, and failed-node RKE2 restart readiness
              before retrying. If it still fails, inspect the failed node
              diagnostics above or use an internal chart mirror reachable from
              every node.

              To tolerate short DNS/egress flaps while debugging:
              PLATFORM_TRAEFIK_DNS_HELM_ATTEMPTS=5 PLATFORM_TRAEFIK_DNS_HELM_TIMEOUT=60 make platform-ingress
              To disable failed-node RKE2 restart recovery:
              PLATFORM_TRAEFIK_DNS_FAILED_NODE_RESTART=false make platform-ingress
              To disable the host service-path repair pass:
              PLATFORM_TRAEFIK_DNS_SERVICE_PATH_REPAIR=false make platform-ingress
          run_once: true
          when: >-
            (platform_traefik_dns_all_nodes_after_failed_node_restart.rc
            | default(platform_traefik_dns_all_nodes_retry.rc | default(1))) != 0

    - name: Clean stale Traefik Helm install job before retry
      ansible.builtin.command: >-
        /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
        -n kube-system delete job/helm-install-platform-traefik --ignore-not-found=true
      register: platform_traefik_helm_job_cleanup
      changed_when: "'deleted' in platform_traefik_helm_job_cleanup.stdout"
      delegate_to: "{{ rke2_first_server }}"
      when: platform_ingress_cleanup_helm_jobs_effective | bool
      run_once: true

    - name: Install or update Traefik through the RKE2 Helm controller
      ansible.builtin.shell: |
        set -o pipefail
        /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml apply -f -
      args:
        executable: /bin/bash
        stdin: |
          ---
          apiVersion: helm.cattle.io/v1
          kind: HelmChart
          metadata:
            name: platform-traefik
            namespace: kube-system
          spec:
            repo: {{ platform_traefik_chart_repo_effective }}
            chart: traefik
          {% if platform_traefik_chart_version_effective | length > 0 %}
            version: {{ platform_traefik_chart_version_effective }}
          {% endif %}
            targetNamespace: traefik
            createNamespace: true
            valuesContent: |-
              deployment:
                replicas: 3
              podDisruptionBudget:
                enabled: true
                minAvailable: 2
              updateStrategy:
                type: RollingUpdate
                rollingUpdate:
                  maxUnavailable: 1
                  maxSurge: 0
              affinity:
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    - labelSelector:
                        matchLabels:
                          app.kubernetes.io/name: traefik
                      topologyKey: kubernetes.io/hostname
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: DoNotSchedule
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: traefik
              ingressClass:
                enabled: true
                isDefaultClass: true
              providers:
                kubernetesCRD:
                  enabled: true
                kubernetesIngress:
                  enabled: true
                  publishedService:
                    enabled: true
              additionalArguments:
                - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
                - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
                - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
                - "--entrypoints.websecure.http.tls=true"
              service:
                enabled: true
                spec:
                  type: LoadBalancer
                  loadBalancerIP: {{ rke2_ingress_vip_effective }}
                  externalTrafficPolicy: Local
                  internalTrafficPolicy: Local
              log:
                level: INFO
              accessLog:
                enabled: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
      register: platform_traefik_helmchart_apply
      changed_when: "'created' in platform_traefik_helmchart_apply.stdout or 'configured' in platform_traefik_helmchart_apply.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Wait for Traefik deployment
      block:
        - name: Poll Traefik deployment rollout
          ansible.builtin.shell: |
            set -eu
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            for deployment in platform-traefik traefik; do
              if "$K" --kubeconfig "$C" -n traefik get "deployment/${deployment}" >/dev/null 2>&1; then
                "$K" --kubeconfig "$C" -n traefik get "deployment/${deployment}" -o jsonpath='{.metadata.name}{" generation="}{.metadata.generation}{" observed="}{.status.observedGeneration}{" desired="}{.spec.replicas}{" updated="}{.status.updatedReplicas}{" ready="}{.status.readyReplicas}{" available="}{.status.availableReplicas}{" unavailable="}{.status.unavailableReplicas}{"\n"}'
                "$K" --kubeconfig "$C" -n traefik get "deployment/${deployment}" -o jsonpath='{.metadata.generation}{" "}{.status.observedGeneration}{" "}{.spec.replicas}{" "}{.status.updatedReplicas}{" "}{.status.readyReplicas}{" "}{.status.availableReplicas}{"\n"}' |
                  awk '{
                    generation=$1 + 0
                    observed=$2 + 0
                    desired=$3 + 0
                    updated=$4 + 0
                    ready=$5 + 0
                    available=$6 + 0
                    exit(observed >= generation && desired > 0 && updated >= desired && ready >= desired && available >= desired ? 0 : 1)
                  }'
                exit $?
              fi
            done
            "$K" --kubeconfig "$C" -n traefik get deployment -o wide || true
            exit 1
          args:
            executable: /bin/bash
          register: platform_traefik_rollout
          retries: "{{ platform_traefik_wait_retries }}"
          delay: "{{ platform_ingress_poll_interval_effective }}"
          until: platform_traefik_rollout.rc == 0
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
      rescue:
        - name: Collect Traefik rollout diagnostics
          ansible.builtin.shell: |
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            echo "===== HelmChart resources ====="
            "$K" --kubeconfig "$C" -n kube-system get helmchart,helmchartconfig 2>/dev/null | grep -E 'platform-traefik|NAME' || true
            echo "===== platform-traefik HelmChart detail ====="
            "$K" --kubeconfig "$C" -n kube-system describe helmchart platform-traefik || true
            echo "===== platform-traefik Helm job ====="
            "$K" --kubeconfig "$C" -n kube-system get job,pods -o wide | grep -E 'helm-install-platform-traefik|platform-traefik|traefik|NAME' || true
            "$K" --kubeconfig "$C" -n kube-system describe job helm-install-platform-traefik || true
            echo "===== platform-traefik Helm pod logs ====="
            for pod in $("$K" --kubeconfig "$C" -n kube-system get pods -l job-name=helm-install-platform-traefik -o name 2>/dev/null); do
              echo "--- ${pod} describe ---"
              "$K" --kubeconfig "$C" -n kube-system describe "${pod}" || true
              echo "--- ${pod} current logs ---"
              "$K" --kubeconfig "$C" -n kube-system logs "${pod}" --all-containers --tail=240 || true
              echo "--- ${pod} previous logs ---"
              "$K" --kubeconfig "$C" -n kube-system logs "${pod}" --all-containers --previous --tail=240 || true
            done
            echo "===== Traefik namespace workloads ====="
            "$K" --kubeconfig "$C" get ns traefik -o wide || true
            "$K" --kubeconfig "$C" -n traefik get deploy,rs,pods,svc,endpoints,endpointslices -o wide || true
            echo "===== Traefik images ====="
            "$K" --kubeconfig "$C" -n traefik get pods \
              -o jsonpath='{range .items[*]}{.metadata.name}{": "}{range .spec.initContainers[*]}init:{.name}={.image}{" "}{end}{range .spec.containers[*]}container:{.name}={.image}{" "}{end}{"\n"}{end}' 2>/dev/null || true
            echo "===== Traefik pod details ====="
            "$K" --kubeconfig "$C" -n traefik describe pods || true
            echo "===== Traefik pod logs ====="
            for pod in $("$K" --kubeconfig "$C" -n traefik get pods -o name 2>/dev/null); do
              echo "--- ${pod} current logs ---"
              "$K" --kubeconfig "$C" -n traefik logs "${pod}" --all-containers --tail=180 || true
              echo "--- ${pod} previous logs ---"
              "$K" --kubeconfig "$C" -n traefik logs "${pod}" --all-containers --previous --tail=180 || true
            done
            echo "===== Recent Traefik events ====="
            "$K" --kubeconfig "$C" get events -A --sort-by=.lastTimestamp |
              grep -E 'traefik|platform-traefik|helm-install|Failed|BackOff|ErrImagePull|ImagePullBackOff|Unhealthy|FailedScheduling' | tail -160 || true
          args:
            executable: /bin/bash
          register: platform_traefik_rollout_diagnostics
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Print Traefik rollout error
          ansible.builtin.debug:
            msg:
              - "{{ platform_traefik_rollout.stdout_lines | default([]) }}"
              - "{{ platform_traefik_rollout.stderr_lines | default([]) }}"
          run_once: true

        - name: Print Traefik rollout diagnostics
          ansible.builtin.debug:
            var: platform_traefik_rollout_diagnostics.stdout_lines
          run_once: true

        - name: Summarize Traefik rollout failure
          ansible.builtin.shell: |
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            echo "===== HelmChart status ====="
            "$K" --kubeconfig "$C" -n kube-system get helmchart platform-traefik -o wide 2>/dev/null || true
            echo "===== Helm install job ====="
            "$K" --kubeconfig "$C" -n kube-system get job helm-install-platform-traefik -o wide 2>/dev/null || true
            echo "===== Helm install pod log tail ====="
            for pod in $("$K" --kubeconfig "$C" -n kube-system get pods -l job-name=helm-install-platform-traefik -o name 2>/dev/null); do
              echo "--- ${pod} current logs ---"
              "$K" --kubeconfig "$C" -n kube-system logs "${pod}" --all-containers --tail=80 || true
              echo "--- ${pod} previous logs ---"
              "$K" --kubeconfig "$C" -n kube-system logs "${pod}" --all-containers --previous --tail=80 || true
            done
            echo "===== Traefik deployment ====="
            "$K" --kubeconfig "$C" -n traefik get deploy platform-traefik traefik -o wide 2>/dev/null || \
              "$K" --kubeconfig "$C" -n traefik get deploy -o wide 2>/dev/null || true
            echo "===== Traefik pods ====="
            "$K" --kubeconfig "$C" -n traefik get pods -o wide 2>/dev/null || true
            echo "===== Traefik pod waiting/termination reasons ====="
            "$K" --kubeconfig "$C" -n traefik get pods \
              -o jsonpath='{range .items[*]}{.metadata.name}{" ready="}{range .status.containerStatuses[*]}{.ready}{" "}{end}{" waiting="}{range .status.containerStatuses[*]}{.state.waiting.reason}{":"}{.state.waiting.message}{" "}{end}{" terminated="}{range .status.containerStatuses[*]}{.state.terminated.reason}{":"}{.state.terminated.message}{" "}{end}{"\n"}{end}' 2>/dev/null || true
            echo "===== Traefik images ====="
            "$K" --kubeconfig "$C" -n traefik get pods \
              -o jsonpath='{range .items[*]}{.metadata.name}{": "}{range .spec.initContainers[*]}init:{.name}={.image}{" "}{end}{range .spec.containers[*]}container:{.name}={.image}{" "}{end}{"\n"}{end}' 2>/dev/null || true
            echo "===== Most relevant recent events ====="
            "$K" --kubeconfig "$C" get events -A --sort-by=.lastTimestamp 2>/dev/null |
              grep -E 'traefik|platform-traefik|helm-install-platform-traefik|Failed|BackOff|ErrImagePull|ImagePullBackOff|FailedScheduling|Unhealthy' |
              tail -40 || true
          args:
            executable: /bin/bash
          register: platform_traefik_rollout_summary
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Stop after Traefik rollout failure
          ansible.builtin.fail:
            msg: |
              Traefik did not become available within {{ platform_traefik_rollout_timeout_effective }}s.

              Traefik failure summary:
              {{ platform_traefik_rollout_summary.stdout | default('summary was not collected') }}

              Review the diagnostics above. Common causes are slow or blocked
              image pulls, Helm chart install failure, insufficient resources,
              pod scheduling problems, CNI/service networking issues, or pod DNS
              failing to resolve the Traefik chart repository. If the Helm log
              shows lookup errors for {{ platform_traefik_chart_repo_effective }},
              run:
              make platform-dns-repair-traefik

              To wait longer:
              PLATFORM_TRAEFIK_ROLLOUT_TIMEOUT=1200 make platform-ingress

              To fail faster while debugging:
              PLATFORM_TRAEFIK_ROLLOUT_TIMEOUT=180 make platform-ingress
          run_once: true

    - name: Enforce Traefik node-local ingress routing
      ansible.builtin.shell: |
        set -eu
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        expected_replicas={{ groups['rke2_servers'] | length }}

        deployment=""
        for candidate in platform-traefik traefik; do
          if "$K" --kubeconfig "$C" -n traefik get "deployment/${candidate}" >/dev/null 2>&1; then
            deployment="${candidate}"
            break
          fi
        done
        if [ -z "${deployment}" ]; then
          "$K" --kubeconfig "$C" -n traefik get deployment -o wide || true
          echo "No Traefik deployment found." >&2
          exit 1
        fi

        cat >/tmp/platform-traefik-node-local-routing-patch.json <<PATCH
        {
          "spec": {
            "replicas": ${expected_replicas},
            "strategy": {
              "type": "RollingUpdate",
              "rollingUpdate": {
                "maxUnavailable": 1,
                "maxSurge": 0
              }
            },
            "template": {
              "spec": {
                "topologySpreadConstraints": [
                  {
                    "maxSkew": 1,
                    "topologyKey": "kubernetes.io/hostname",
                    "whenUnsatisfiable": "DoNotSchedule",
                    "labelSelector": {
                      "matchLabels": {
                        "app.kubernetes.io/name": "traefik"
                      }
                    }
                  }
                ],
                "affinity": {
                  "podAntiAffinity": {
                    "requiredDuringSchedulingIgnoredDuringExecution": [
                      {
                        "labelSelector": {
                          "matchLabels": {
                            "app.kubernetes.io/name": "traefik"
                          }
                        },
                        "topologyKey": "kubernetes.io/hostname"
                      }
                    ],
                    "preferredDuringSchedulingIgnoredDuringExecution": []
                  }
                }
              }
            }
          }
        }
        PATCH
        "$K" --kubeconfig "$C" -n traefik patch "deployment/${deployment}" \
          --type merge --patch-file /tmp/platform-traefik-node-local-routing-patch.json

        service=""
        for candidate in platform-traefik traefik; do
          if "$K" --kubeconfig "$C" -n traefik get "service/${candidate}" >/dev/null 2>&1; then
            service="${candidate}"
            break
          fi
        done
        if [ -z "${service}" ]; then
          "$K" --kubeconfig "$C" -n traefik get service -o wide || true
          echo "No Traefik service found." >&2
          exit 1
        fi

        "$K" --kubeconfig "$C" -n traefik patch "service/${service}" \
          --type merge \
          -p '{"spec":{"externalTrafficPolicy":"Local","internalTrafficPolicy":"Local"}}'

        "$K" --kubeconfig "$C" -n traefik get "deployment/${deployment}" \
          -o jsonpath='{.metadata.name}{" replicas="}{.spec.replicas}{" topologySpread="}{.spec.template.spec.topologySpreadConstraints[*].topologyKey}{"\n"}'
        "$K" --kubeconfig "$C" -n traefik get "service/${service}" \
          -o jsonpath='{.metadata.name}{" externalTrafficPolicy="}{.spec.externalTrafficPolicy}{" internalTrafficPolicy="}{.spec.internalTrafficPolicy}{" lb="}{.status.loadBalancer.ingress[*].ip}{"\n"}'
      args:
        executable: /bin/bash
      register: platform_traefik_local_routing
      changed_when: >-
        'patched' in platform_traefik_local_routing.stdout
        and 'no change' not in platform_traefik_local_routing.stdout
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Wait for Traefik node-local routing rollout
      ansible.builtin.shell: |
        set -eu
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        for deployment in platform-traefik traefik; do
          if "$K" --kubeconfig "$C" -n traefik get "deployment/${deployment}" >/dev/null 2>&1; then
            "$K" --kubeconfig "$C" -n traefik rollout status "deployment/${deployment}" \
              --timeout={{ platform_ingress_poll_interval_effective }}s
            exit $?
          fi
        done
        "$K" --kubeconfig "$C" -n traefik get deployment -o wide || true
        exit 1
      args:
        executable: /bin/bash
      register: platform_traefik_local_routing_rollout
      retries: "{{ platform_traefik_wait_retries }}"
      delay: "{{ platform_ingress_poll_interval_effective }}"
      until: platform_traefik_local_routing_rollout.rc == 0
      changed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Verify Traefik has a ready local endpoint on every RKE2 node
      ansible.builtin.shell: |
        set -eu
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        expected_nodes="{{ groups['rke2_servers'] | join(' ') }}"

        echo "Expected RKE2 nodes: ${expected_nodes}"
        echo "===== Traefik pods ====="
        "$K" --kubeconfig "$C" -n traefik get pods -l app.kubernetes.io/name=traefik -o wide
        echo "===== Traefik service ====="
        for service in platform-traefik traefik; do
          "$K" --kubeconfig "$C" -n traefik get "service/${service}" \
            -o jsonpath='{.metadata.name}{" externalTrafficPolicy="}{.spec.externalTrafficPolicy}{" internalTrafficPolicy="}{.spec.internalTrafficPolicy}{" lb="}{.status.loadBalancer.ingress[*].ip}{"\n"}' 2>/dev/null || true
        done

        ready_nodes="$("$K" --kubeconfig "$C" -n traefik get pods \
          -l app.kubernetes.io/name=traefik \
          -o jsonpath='{range .items[?(@.status.phase=="Running")]}{.spec.nodeName}{" "}{range .status.containerStatuses[*]}{.ready}{" "}{end}{"\n"}{end}' |
          awk '$0 ~ / true/ {print $1}' |
          sort -u)"

        printf 'Ready Traefik endpoint nodes:\n%s\n' "${ready_nodes}"
        missing=0
        for node in ${expected_nodes}; do
          if ! printf '%s\n' "${ready_nodes}" | grep -Fx "${node}" >/dev/null; then
            echo "Missing ready Traefik endpoint on ${node}" >&2
            missing=1
          fi
        done
        exit "${missing}"
      args:
        executable: /bin/bash
      register: platform_traefik_local_endpoints
      retries: "{{ platform_traefik_wait_retries }}"
      delay: "{{ platform_ingress_poll_interval_effective }}"
      until: platform_traefik_local_endpoints.rc == 0
      changed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Wait for Traefik service to receive ingress VIP
      block:
        - name: Poll Traefik service ingress VIP
          ansible.builtin.shell: |
            set -eu
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            for service in platform-traefik traefik; do
              if "$K" --kubeconfig "$C" -n traefik get "service/${service}" >/dev/null 2>&1; then
                "$K" --kubeconfig "$C" -n traefik get "service/${service}" \
                  -o jsonpath='{.status.loadBalancer.ingress[*].ip}' |
                  grep -Fw "{{ rke2_ingress_vip_effective }}"
                exit $?
              fi
            done
            "$K" --kubeconfig "$C" -n traefik get svc -o wide || true
            exit 1
          args:
            executable: /bin/bash
          register: platform_traefik_vip
          retries: "{{ platform_traefik_wait_retries }}"
          delay: "{{ platform_ingress_poll_interval_effective }}"
          until: platform_traefik_vip.rc == 0
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
      rescue:
        - name: Collect Traefik service VIP diagnostics
          ansible.builtin.shell: |
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            echo "===== Traefik services ====="
            "$K" --kubeconfig "$C" -n traefik get svc,endpoints,endpointslices,pods -o wide || true
            echo "===== Traefik service details ====="
            for service in platform-traefik traefik; do
              "$K" --kubeconfig "$C" -n traefik describe "service/${service}" || true
            done
            echo "===== MetalLB pools and advertisements ====="
            "$K" --kubeconfig "$C" -n metallb-system get ipaddresspool,l2advertisement -o wide || true
            "$K" --kubeconfig "$C" -n metallb-system describe ipaddresspool platform-ingress || true
            "$K" --kubeconfig "$C" -n metallb-system describe l2advertisement platform-ingress || true
            echo "===== MetalLB controller and speaker state ====="
            "$K" --kubeconfig "$C" -n metallb-system get deploy,ds,pods -o wide || true
            echo "===== MetalLB logs ====="
            "$K" --kubeconfig "$C" -n metallb-system logs -l app.kubernetes.io/component=controller --all-containers --tail=180 || true
            "$K" --kubeconfig "$C" -n metallb-system logs -l app.kubernetes.io/component=speaker --all-containers --tail=180 || true
            "$K" --kubeconfig "$C" -n metallb-system logs -l component=controller --all-containers --tail=180 || true
            "$K" --kubeconfig "$C" -n metallb-system logs -l component=speaker --all-containers --tail=180 || true
            echo "===== Recent ingress VIP events ====="
            "$K" --kubeconfig "$C" get events -A --sort-by=.lastTimestamp |
              grep -E 'traefik|platform-traefik|metallb|LoadBalancer|{{ rke2_ingress_vip_effective }}|Failed|error|warning' | tail -160 || true
          args:
            executable: /bin/bash
          register: platform_traefik_vip_diagnostics
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Print Traefik service VIP diagnostics
          ansible.builtin.debug:
            var: platform_traefik_vip_diagnostics.stdout_lines
          run_once: true

        - name: Summarize Traefik service VIP failure
          ansible.builtin.shell: |
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            echo "===== Traefik services ====="
            "$K" --kubeconfig "$C" -n traefik get svc -o wide 2>/dev/null || true
            echo "===== MetalLB address pool ====="
            "$K" --kubeconfig "$C" -n metallb-system get ipaddresspool,l2advertisement -o wide 2>/dev/null || true
            echo "===== MetalLB pods ====="
            "$K" --kubeconfig "$C" -n metallb-system get pods -o wide 2>/dev/null || true
            echo "===== Most relevant recent events ====="
            "$K" --kubeconfig "$C" get events -A --sort-by=.lastTimestamp 2>/dev/null |
              grep -E 'traefik|platform-traefik|metallb|LoadBalancer|{{ rke2_ingress_vip_effective }}|Failed|error|warning' |
              tail -40 || true
          args:
            executable: /bin/bash
          register: platform_traefik_vip_summary
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Stop after Traefik service VIP failure
          ansible.builtin.fail:
            msg: |
              Traefik service did not receive the expected ingress VIP
              {{ rke2_ingress_vip_effective }} within {{ platform_traefik_rollout_timeout_effective }}s.

              Traefik VIP failure summary:
              {{ platform_traefik_vip_summary.stdout | default('summary was not collected') }}

              Review the diagnostics above. Common causes are MetalLB address
              pool mismatch, L2Advertisement problems, speaker/controller issues,
              or the requested VIP already being used on the network.

              To wait longer:
              PLATFORM_TRAEFIK_ROLLOUT_TIMEOUT=1200 make platform-ingress
          run_once: true

    - name: Configure Argo CD server for TLS termination at Traefik
      ansible.builtin.command:
        argv:
          - /var/lib/rancher/rke2/bin/kubectl
          - --kubeconfig
          - /etc/rancher/rke2/rke2.yaml
          - -n
          - argocd
          - patch
          - configmap
          - argocd-cmd-params-cm
          - --type
          - merge
          - -p
          - '{"data":{"server.insecure":"true"}}'
      register: platform_argocd_insecure_patch
      changed_when: "'patched' in platform_argocd_insecure_patch.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Configure Argo CD server as node-local ingress backend
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        replicas={{ platform_argocd_server_replicas_effective | int }}

        "$K" --kubeconfig "$C" -n argocd patch deployment/argocd-server --type merge -p "$(cat <<EOF
        {
          "spec": {
            "replicas": ${replicas},
            "strategy": {
              "type": "RollingUpdate",
              "rollingUpdate": {
                "maxSurge": 0,
                "maxUnavailable": 1
              }
            },
            "template": {
              "metadata": {
                "labels": {
                  "platform.gitops/ingress-backend": "argocd-server"
                }
              },
              "spec": {
                "topologySpreadConstraints": [
                  {
                    "maxSkew": 1,
                    "topologyKey": "kubernetes.io/hostname",
                    "whenUnsatisfiable": "DoNotSchedule",
                    "labelSelector": {
                      "matchLabels": {
                        "app.kubernetes.io/name": "argocd-server"
                      }
                    }
                  }
                ],
                "affinity": {
                  "podAntiAffinity": {
                    "requiredDuringSchedulingIgnoredDuringExecution": [
                      {
                        "labelSelector": {
                          "matchLabels": {
                            "app.kubernetes.io/name": "argocd-server"
                          }
                        },
                        "topologyKey": "kubernetes.io/hostname"
                      }
                    ],
                    "preferredDuringSchedulingIgnoredDuringExecution": [
                      {
                        "weight": 100,
                        "podAffinityTerm": {
                          "labelSelector": {
                            "matchLabels": {
                              "app.kubernetes.io/name": "argocd-server"
                            }
                          },
                          "topologyKey": "kubernetes.io/hostname"
                        }
                      }
                    ]
                  }
                }
              }
            }
          }
        }
        EOF
        )"

        "$K" --kubeconfig "$C" -n argocd patch service/argocd-server --type merge \
          -p '{"metadata":{"annotations":{"traefik.ingress.kubernetes.io/service.nativelb":"true"}},"spec":{"internalTrafficPolicy":"Local"}}'
      args:
        executable: /bin/bash
      register: platform_argocd_server_node_local_backend
      changed_when: "'patched' in platform_argocd_server_node_local_backend.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Remove stale pending Argo CD server pods before fixed rollout
      ansible.builtin.shell: |
        set -o pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        "$K" --kubeconfig "$C" -n argocd delete pod \
          -l app.kubernetes.io/name=argocd-server \
          --field-selector=status.phase=Pending \
          --ignore-not-found=true
      args:
        executable: /bin/bash
      register: platform_argocd_server_pending_cleanup
      changed_when: "'deleted' in platform_argocd_server_pending_cleanup.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Restart Argo CD server after TLS termination change
      ansible.builtin.command: >-
        /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
        -n argocd rollout restart deployment/argocd-server
      register: platform_argocd_server_restart
      changed_when: "'restarted' in platform_argocd_server_restart.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Wait for Argo CD server after restart
      block:
        - name: Poll Argo CD server rollout after restart
          ansible.builtin.command: >-
            /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
            -n argocd rollout status deployment/argocd-server --timeout={{ platform_ingress_poll_interval_effective }}s
          register: platform_argocd_server_rollout
          retries: "{{ platform_ingress_wait_retries }}"
          delay: "{{ platform_ingress_poll_interval_effective }}"
          until: platform_argocd_server_rollout.rc == 0
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
      rescue:
        - name: Collect Argo CD server rollout diagnostics
          ansible.builtin.shell: |
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            echo "===== argocd-server deployment ====="
            "$K" --kubeconfig "$C" -n argocd get deployment/argocd-server -o wide || true
            "$K" --kubeconfig "$C" -n argocd get deployment/argocd-server \
              -o jsonpath='{.metadata.name}{" generation="}{.metadata.generation}{" observed="}{.status.observedGeneration}{" desired="}{.spec.replicas}{" updated="}{.status.updatedReplicas}{" ready="}{.status.readyReplicas}{" available="}{.status.availableReplicas}{" unavailable="}{.status.unavailableReplicas}{"\n"}' || true
            echo "===== argocd-server replicaset state ====="
            "$K" --kubeconfig "$C" -n argocd get rs -l app.kubernetes.io/name=argocd-server -o wide || true
            echo "===== argocd-server pods ====="
            "$K" --kubeconfig "$C" -n argocd get pods -l app.kubernetes.io/name=argocd-server -o wide || true
            echo "===== argocd-server pod waiting/termination reasons ====="
            "$K" --kubeconfig "$C" -n argocd get pods -l app.kubernetes.io/name=argocd-server \
              -o jsonpath='{range .items[*]}{.metadata.name}{" node="}{.spec.nodeName}{" phase="}{.status.phase}{" ready="}{range .status.containerStatuses[*]}{.ready}{" "}{end}{" waiting="}{range .status.containerStatuses[*]}{.state.waiting.reason}{":"}{.state.waiting.message}{" "}{end}{" terminated="}{range .status.containerStatuses[*]}{.state.terminated.reason}{":"}{.state.terminated.message}{" "}{end}{"\n"}{end}' || true
            echo "===== pending argocd-server pod scheduling details ====="
            for pod in $("$K" --kubeconfig "$C" -n argocd get pods -l app.kubernetes.io/name=argocd-server --field-selector=status.phase=Pending -o name 2>/dev/null); do
              echo "--- ${pod} ---"
              "$K" --kubeconfig "$C" -n argocd describe "${pod}" | sed -n '/Events:/,$p' || true
            done
            echo "===== node allocatable and taints ====="
            "$K" --kubeconfig "$C" get nodes \
              -o jsonpath='{range .items[*]}{.metadata.name}{" ready="}{range .status.conditions[?(@.type=="Ready")]}{.status}{end}{" cpu="}{.status.allocatable.cpu}{" memory="}{.status.allocatable.memory}{" taints="}{range .spec.taints[*]}{.key}{":"}{.effect}{" "}{end}{"\n"}{end}' || true
            echo "===== recent Argo CD scheduling/events ====="
            "$K" --kubeconfig "$C" -n argocd get events --sort-by=.lastTimestamp |
              grep -E 'argocd-server|FailedScheduling|FailedCreate|BackOff|ErrImagePull|ImagePullBackOff|Unhealthy|not available|insufficient|taint' |
              tail -120 || true
          args:
            executable: /bin/bash
          register: platform_argocd_server_rollout_diagnostics
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Stop after Argo CD server rollout failure
          ansible.builtin.fail:
            msg: |
              Argo CD server did not finish rolling out within
              {{ platform_ingress_rollout_timeout_effective }}s.

              Last rollout output:
              {{ platform_argocd_server_rollout.stdout | default('not collected') }}
              {{ platform_argocd_server_rollout.stderr | default('') }}

              Rollout diagnostics:
              {{ platform_argocd_server_rollout_diagnostics.stdout | default('diagnostics were not collected') }}

              Common causes are strict node spread with an unschedulable node,
              a node taint, insufficient CPU/memory, image pull delay, or old
              ReplicaSet pods not terminating yet.

              To fail faster while debugging:
              PLATFORM_INGRESS_ROLLOUT_TIMEOUT=60 make platform-ingress

              To wait longer:
              PLATFORM_INGRESS_ROLLOUT_TIMEOUT=600 make platform-ingress
          run_once: true

    - name: Verify Argo CD server has node-local ingress backend coverage
      block:
        - name: Poll Argo CD server node-local ingress backend coverage
          ansible.builtin.shell: |
            set -eu
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml

            echo "===== Argo CD server pods ====="
            "$K" --kubeconfig "$C" -n argocd get pods -l app.kubernetes.io/name=argocd-server -o wide
            echo "===== Argo CD server endpoints ====="
            "$K" --kubeconfig "$C" -n argocd get endpointslice -l kubernetes.io/service-name=argocd-server -o wide || true
            ready_nodes="$("$K" --kubeconfig "$C" -n argocd get endpointslice -l kubernetes.io/service-name=argocd-server \
              -o jsonpath='{range .items[*].endpoints[?(@.conditions.ready==true)]}{.nodeName}{"\n"}{end}' |
              sort -u)"
            printf 'ready_argocd_server_nodes:\n%s\n' "${ready_nodes}"

            missing=0
            for node in {{ groups['rke2_servers'] | join(' ') }}; do
              if ! printf '%s\n' "${ready_nodes}" | grep -Fx "${node}" >/dev/null; then
                echo "Missing ready argocd-server endpoint on ${node}" >&2
                missing=1
              fi
            done
            exit "${missing}"
          args:
            executable: /bin/bash
          register: platform_argocd_server_local_endpoints
          retries: "{{ platform_ingress_wait_retries }}"
          delay: "{{ platform_ingress_poll_interval_effective }}"
          until: platform_argocd_server_local_endpoints.rc == 0
          changed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
      rescue:
        - name: Collect Argo CD server node-local backend diagnostics
          ansible.builtin.shell: |
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            echo "===== argocd-server pods ====="
            "$K" --kubeconfig "$C" -n argocd get pods -l app.kubernetes.io/name=argocd-server -o wide || true
            echo "===== argocd-server endpointslices ====="
            "$K" --kubeconfig "$C" -n argocd get endpointslice -l kubernetes.io/service-name=argocd-server -o wide || true
            echo "===== argocd-server deployment scheduling rules ====="
            "$K" --kubeconfig "$C" -n argocd get deployment/argocd-server \
              -o jsonpath='{.spec.template.spec.affinity}{"\n"}{.spec.template.spec.topologySpreadConstraints}{"\n"}' || true
            echo "===== node-local backend missing summary ====="
            ready_nodes="$("$K" --kubeconfig "$C" -n argocd get endpointslice -l kubernetes.io/service-name=argocd-server \
              -o jsonpath='{range .items[*].endpoints[?(@.conditions.ready==true)]}{.nodeName}{"\n"}{end}' 2>/dev/null | sort -u || true)"
            for node in {{ groups['rke2_servers'] | join(' ') }}; do
              if printf '%s\n' "${ready_nodes}" | grep -Fx "${node}" >/dev/null; then
                echo "${node}=has-ready-argocd-server-endpoint"
              else
                echo "${node}=missing-ready-argocd-server-endpoint"
              fi
            done
            echo "===== recent Argo CD events ====="
            "$K" --kubeconfig "$C" -n argocd get events --sort-by=.lastTimestamp |
              grep -E 'argocd-server|FailedScheduling|FailedCreate|BackOff|ErrImagePull|ImagePullBackOff|Unhealthy|insufficient|taint' |
              tail -120 || true
          args:
            executable: /bin/bash
          register: platform_argocd_server_local_endpoint_diagnostics
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Stop after Argo CD node-local backend coverage failure
          ansible.builtin.fail:
            msg: |
              Argo CD server did not provide a ready local ingress backend on
              every RKE2 node within {{ platform_ingress_rollout_timeout_effective }}s.

              Last check:
              {{ platform_argocd_server_local_endpoints.stdout | default('not collected') }}
              {{ platform_argocd_server_local_endpoints.stderr | default('') }}

              Diagnostics:
              {{ platform_argocd_server_local_endpoint_diagnostics.stdout | default('diagnostics were not collected') }}
          run_once: true

    - name: Publish Argo CD through Traefik ingress
      ansible.builtin.shell: |
        set -o pipefail
        /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml apply -f -
      args:
        executable: /bin/bash
        stdin: |
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: argocd-server
            namespace: argocd
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
              traefik.ingress.kubernetes.io/router.tls: "true"
          spec:
            ingressClassName: traefik
            rules:
              - host: {{ platform_argocd_host_effective }}
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: argocd-server
                          port:
                            number: 80
            tls:
              - hosts:
                  - {{ platform_argocd_host_effective }}
      register: platform_argocd_ingress_apply
      changed_when: "'created' in platform_argocd_ingress_apply.stdout or 'configured' in platform_argocd_ingress_apply.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Publish Argo CD through Traefik IngressRoute when CRDs are available
      ansible.builtin.shell: |
        set -eu
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml

        api_version=""
        if "$K" --kubeconfig "$C" get crd ingressroutes.traefik.io >/dev/null 2>&1; then
          api_version="traefik.io/v1alpha1"
        elif "$K" --kubeconfig "$C" get crd ingressroutes.traefik.containo.us >/dev/null 2>&1; then
          api_version="traefik.containo.us/v1alpha1"
        else
          echo "No Traefik IngressRoute CRD found; standard Kubernetes Ingress remains active."
          exit 0
        fi

        cat >/tmp/platform-argocd-ingressroute.yaml <<'INGRESSROUTE'
        apiVersion: PLATFORM_TRAEFIK_INGRESSROUTE_API_VERSION
        kind: IngressRoute
        metadata:
          name: argocd-server
          namespace: argocd
        spec:
          entryPoints:
            - websecure
          routes:
            - match: Host(`{{ platform_argocd_host_effective }}`)
              kind: Rule
              services:
                - name: argocd-server
                  namespace: argocd
                  port: 80
                  scheme: http
                  nativeLB: true
          tls: {}
        INGRESSROUTE
        sed -i "s#PLATFORM_TRAEFIK_INGRESSROUTE_API_VERSION#${api_version}#" /tmp/platform-argocd-ingressroute.yaml
        "$K" --kubeconfig "$C" apply -f /tmp/platform-argocd-ingressroute.yaml
      args:
        executable: /bin/bash
      register: platform_argocd_ingressroute_apply
      changed_when: "'created' in platform_argocd_ingressroute_apply.stdout or 'configured' in platform_argocd_ingressroute_apply.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Publish app VIP to hostname redirect through Traefik when CRDs are available
      ansible.builtin.shell: |
        set -eu
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml

        api_version=""
        if "$K" --kubeconfig "$C" get crd ingressroutes.traefik.io middlewares.traefik.io >/dev/null 2>&1; then
          api_version="traefik.io/v1alpha1"
        elif "$K" --kubeconfig "$C" get crd ingressroutes.traefik.containo.us middlewares.traefik.containo.us >/dev/null 2>&1; then
          api_version="traefik.containo.us/v1alpha1"
        else
          echo "No Traefik IngressRoute/Middleware CRDs found; direct app VIP requests will keep Traefik's default 404."
          exit 0
        fi

        cat >/tmp/platform-app-vip-redirect.yaml <<'IPREDIRECT'
        ---
        apiVersion: PLATFORM_TRAEFIK_API_VERSION
        kind: Middleware
        metadata:
          name: platform-app-vip-to-host
          namespace: argocd
        spec:
          redirectRegex:
            regex: '^https?://{{ rke2_ingress_vip_effective | regex_escape() }}(?::[0-9]+)?/?(.*)'
            replacement: 'https://{{ platform_ip_redirect_target_host_effective }}/${1}'
            permanent: true
        ---
        apiVersion: PLATFORM_TRAEFIK_API_VERSION
        kind: IngressRoute
        metadata:
          name: platform-app-vip-to-host
          namespace: argocd
        spec:
          entryPoints:
            - websecure
          routes:
            - match: Host(`{{ rke2_ingress_vip_effective }}`)
              kind: Rule
              priority: 1000
              middlewares:
                - name: platform-app-vip-to-host
              services:
                - name: argocd-server
                  namespace: argocd
                  port: 80
                  scheme: http
                  nativeLB: true
          tls: {}
        IPREDIRECT
        sed -i "s#PLATFORM_TRAEFIK_API_VERSION#${api_version}#" /tmp/platform-app-vip-redirect.yaml
        "$K" --kubeconfig "$C" apply -f /tmp/platform-app-vip-redirect.yaml
      args:
        executable: /bin/bash
      register: platform_ip_redirect_apply
      changed_when: "'created' in platform_ip_redirect_apply.stdout or 'configured' in platform_ip_redirect_apply.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      when: platform_ip_redirect_enabled_effective | bool

    - name: Verify app VIP redirects to canonical hostname from Ansible controller
      ansible.builtin.shell: |
        set -o pipefail
        if ! command -v curl >/dev/null 2>&1; then
          echo "curl is not installed on the Ansible controller." >&2
          exit 127
        fi

        echo "Checking https://{{ rke2_ingress_vip_effective }}/ redirects to https://{{ platform_ip_redirect_target_host_effective }}/"
        result="$(curl --silent --show-error --insecure --output /dev/null \
          --write-out 'http_code=%{http_code} redirect_url=%{redirect_url}' \
          --connect-timeout {{ platform_argocd_ingress_connect_timeout_effective }} \
          --max-time {{ platform_argocd_ingress_max_time_effective }} \
          https://{{ rke2_ingress_vip_effective }}/)"
        printf '%s\n' "${result}"
        code="$(printf '%s\n' "${result}" | sed -n 's/^http_code=\([0-9][0-9][0-9]\).*/\1/p')"
        redirect_url="$(printf '%s\n' "${result}" | sed -n 's/^.*redirect_url=//p')"
        case "${code}" in
          301|302|303|307|308) ;;
          *) exit 1 ;;
        esac
        case "${redirect_url}" in
          https://{{ platform_ip_redirect_target_host_effective }}|https://{{ platform_ip_redirect_target_host_effective }}/*) exit 0 ;;
          *) exit 1 ;;
        esac
      args:
        executable: /bin/bash
      register: platform_ip_redirect_controller_check
      retries: "{{ platform_argocd_ingress_verify_retries }}"
      delay: "{{ platform_ingress_poll_interval_effective }}"
      until: platform_ip_redirect_controller_check.rc == 0
      changed_when: false
      failed_when: false
      become: false
      delegate_to: localhost
      run_once: true
      when:
        - platform_ip_redirect_enabled_effective | bool
        - platform_argocd_ingress_controller_verify_effective | bool

    - name: Show app VIP redirect verification result
      ansible.builtin.debug:
        msg:
          - "App VIP redirect target: https://{{ platform_ip_redirect_target_host_effective }}/"
          - "Controller check rc: {{ platform_ip_redirect_controller_check.rc | default('not-run') }}"
          - "{{ platform_ip_redirect_controller_check.stdout | default('not-run') }}"
      run_once: true
      when: platform_ip_redirect_enabled_effective | bool

    - name: Verify Argo CD ingress over app VIP from every node
      block:
        - name: Poll Argo CD ingress over app VIP from every node
          ansible.builtin.shell: |
            set -o pipefail
            echo "Checking https://{{ platform_argocd_host_effective }}/ through {{ rke2_ingress_vip_effective }}:443 from $(hostname -f 2>/dev/null || hostname)"
            code="$(curl --silent --show-error --insecure --output /dev/null \
              --write-out '%{http_code}' \
              --connect-timeout {{ platform_argocd_ingress_connect_timeout_effective }} \
              --max-time {{ platform_argocd_ingress_max_time_effective }} \
              --resolve {{ platform_argocd_host_effective }}:443:{{ rke2_ingress_vip_effective }} \
              https://{{ platform_argocd_host_effective }}/)"
            printf '%s\n' "${code}"
            case "${code}" in
              200|301|302|303|307|308|401|403) exit 0 ;;
              *) exit 1 ;;
            esac
          args:
            executable: /bin/bash
          register: platform_argocd_ingress_check
          retries: "{{ platform_argocd_ingress_verify_retries }}"
          delay: "{{ platform_ingress_poll_interval_effective }}"
          until: platform_argocd_ingress_check.rc == 0
          changed_when: false
      rescue:
        - name: Collect Argo CD ingress cluster diagnostics
          ansible.builtin.shell: |
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            echo "===== Traefik services/endpoints/pods ====="
            "$K" --kubeconfig "$C" -n traefik get svc,endpoints,endpointslice,deploy,pods -o wide || true
            echo "===== Traefik service details ====="
            for service in platform-traefik traefik; do
              "$K" --kubeconfig "$C" -n traefik describe "service/${service}" || true
            done
            echo "===== Argo CD ingress routes/service/endpoints/pods ====="
            "$K" --kubeconfig "$C" -n argocd get ingress,ingressroute,svc,endpoints,endpointslice,pods -o wide || true
            "$K" --kubeconfig "$C" -n argocd describe ingress argocd-server || true
            "$K" --kubeconfig "$C" -n argocd describe ingressroute argocd-server || true
            "$K" --kubeconfig "$C" -n argocd describe service argocd-server || true
            echo "===== MetalLB state ====="
            "$K" --kubeconfig "$C" -n metallb-system get ipaddresspool,l2advertisement,deploy,ds,pods -o wide || true
            "$K" --kubeconfig "$C" -n metallb-system describe ipaddresspool platform-ingress || true
            "$K" --kubeconfig "$C" -n metallb-system describe l2advertisement platform-ingress || true
            echo "===== MetalLB speaker logs for app VIP ====="
            "$K" --kubeconfig "$C" -n metallb-system logs -l app.kubernetes.io/component=speaker --all-containers --tail=300 2>/dev/null |
              grep -F "{{ rke2_ingress_vip_effective }}" || true
            "$K" --kubeconfig "$C" -n metallb-system logs -l component=speaker --all-containers --tail=300 2>/dev/null |
              grep -F "{{ rke2_ingress_vip_effective }}" || true
            echo "===== Traefik pod logs ====="
            "$K" --kubeconfig "$C" -n traefik logs -l app.kubernetes.io/name=traefik --all-containers --tail=80 || true
            "$K" --kubeconfig "$C" -n traefik logs -l app.kubernetes.io/instance=platform-traefik --all-containers --tail=80 || true
            echo "===== Most relevant recent events ====="
            "$K" --kubeconfig "$C" get events -A --sort-by=.lastTimestamp 2>/dev/null |
              grep -E 'argocd|traefik|platform-traefik|metallb|LoadBalancer|{{ rke2_ingress_vip_effective }}|Failed|BackOff|Unhealthy|warning|error' |
              tail -80 || true
          args:
            executable: /bin/bash
          register: platform_argocd_ingress_cluster_diagnostics
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true

        - name: Collect Argo CD ingress VIP diagnostics from failed nodes
          ansible.builtin.shell: |
            set -o pipefail
            VIP={{ rke2_ingress_vip_effective }}
            HOST={{ platform_argocd_host_effective }}
            echo "===== host ====="
            hostname -f 2>/dev/null || hostname
            echo "===== failed curl output ====="
            printf '%s\n' "{{ platform_argocd_ingress_check.stdout | default('') }}"
            printf '%s\n' "{{ platform_argocd_ingress_check.stderr | default('') }}"
            echo "===== route and neighbor to app VIP ====="
            ip route get "${VIP}" || true
            ip neigh show "${VIP}" || true
            echo "===== TCP probes ====="
            timeout {{ platform_argocd_ingress_connect_timeout_effective }} bash -c "cat < /dev/null > /dev/tcp/${VIP}/80" && echo "tcp/80 open" || echo "tcp/80 failed"
            timeout {{ platform_argocd_ingress_connect_timeout_effective }} bash -c "cat < /dev/null > /dev/tcp/${VIP}/443" && echo "tcp/443 open" || echo "tcp/443 failed"
            echo "===== direct curl probes ====="
            curl --verbose --insecure --connect-timeout {{ platform_argocd_ingress_connect_timeout_effective }} \
              --max-time {{ platform_argocd_ingress_max_time_effective }} \
              "https://${VIP}/" || true
            curl --verbose --insecure --connect-timeout {{ platform_argocd_ingress_connect_timeout_effective }} \
              --max-time {{ platform_argocd_ingress_max_time_effective }} \
              --resolve "${HOST}:443:${VIP}" "https://${HOST}/" || true
            echo "===== firewalld active zones ====="
            if command -v firewall-cmd >/dev/null 2>&1 && firewall-cmd --state >/dev/null 2>&1; then
              firewall-cmd --get-active-zones || true
              firewall-cmd --list-all || true
            else
              echo "firewalld not running"
            fi
            echo "===== service NAT excerpts ====="
            if command -v iptables-save >/dev/null 2>&1; then
              iptables-save | grep -E 'KUBE-SVC|KUBE-SEP|{{ rke2_ingress_vip_effective }}|:80|:443' | head -120 || true
            fi
            if command -v nft >/dev/null 2>&1; then
              nft list ruleset 2>/dev/null | grep -E 'KUBE-SVC|KUBE-SEP|{{ rke2_ingress_vip_effective }}|dport (80|443)' | head -120 || true
            fi
          args:
            executable: /bin/bash
          register: platform_argocd_ingress_node_diagnostics
          changed_when: false
          failed_when: false

        - name: Print Argo CD ingress cluster diagnostics
          ansible.builtin.debug:
            var: platform_argocd_ingress_cluster_diagnostics.stdout_lines
          run_once: true

        - name: Print Argo CD ingress failed node diagnostics
          ansible.builtin.debug:
            var: platform_argocd_ingress_node_diagnostics.stdout_lines

        - name: Verify Argo CD ingress over app VIP from Ansible controller
          ansible.builtin.shell: |
            set -o pipefail
            if ! command -v curl >/dev/null 2>&1; then
              echo "curl is not installed on the Ansible controller." >&2
              exit 127
            fi

            echo "Checking https://{{ platform_argocd_host_effective }}/ through {{ rke2_ingress_vip_effective }}:443 from Ansible controller"
            code="$(curl --silent --show-error --insecure --output /dev/null \
              --write-out '%{http_code}' \
              --connect-timeout {{ platform_argocd_ingress_connect_timeout_effective }} \
              --max-time {{ platform_argocd_ingress_max_time_effective }} \
              --resolve {{ platform_argocd_host_effective }}:443:{{ rke2_ingress_vip_effective }} \
              https://{{ platform_argocd_host_effective }}/)"
            printf 'http_code=%s\n' "${code}"
            case "${code}" in
              200|301|302|303|307|308|401|403) exit 0 ;;
              *) exit 1 ;;
            esac
          args:
            executable: /bin/bash
          register: platform_argocd_ingress_controller_check
          retries: "{{ platform_argocd_ingress_verify_retries }}"
          delay: "{{ platform_ingress_poll_interval_effective }}"
          until: platform_argocd_ingress_controller_check.rc == 0
          changed_when: false
          failed_when: false
          become: false
          delegate_to: localhost
          run_once: true
          when: platform_argocd_ingress_controller_verify_effective | bool

        - name: Print Argo CD controller/client ingress check result
          ansible.builtin.debug:
            msg:
              - "{{ hostvars[rke2_first_server].platform_argocd_ingress_controller_check.stdout_lines | default(['controller check was not run']) }}"
              - "{{ hostvars[rke2_first_server].platform_argocd_ingress_controller_check.stderr_lines | default([]) }}"
          run_once: true
          when: platform_argocd_ingress_controller_verify_effective | bool

        - name: Refresh MetalLB app VIP announcement after controller timeout
          ansible.builtin.shell: |
            set -eu
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml

            echo "===== Traefik service before VIP refresh ====="
            "$K" --kubeconfig "$C" -n traefik get svc platform-traefik traefik -o wide 2>/dev/null || \
              "$K" --kubeconfig "$C" -n traefik get svc -o wide || true

            restarted=0
            for ds in metallb-speaker speaker platform-metallb-speaker; do
              if "$K" --kubeconfig "$C" -n metallb-system get "daemonset/${ds}" >/dev/null 2>&1; then
                "$K" --kubeconfig "$C" -n metallb-system rollout restart "daemonset/${ds}"
                restarted=1
              fi
            done
            for ds in frr-k8s platform-frr-k8s; do
              if "$K" --kubeconfig "$C" -n metallb-system get "daemonset/${ds}" >/dev/null 2>&1; then
                "$K" --kubeconfig "$C" -n metallb-system rollout restart "daemonset/${ds}"
              fi
            done
            test "${restarted}" -eq 1
          args:
            executable: /bin/bash
          register: platform_argocd_ingress_vip_speaker_restart
          changed_when: "'restarted' in platform_argocd_ingress_vip_speaker_restart.stdout"
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when:
            - platform_argocd_ingress_vip_repair_effective | bool
            - platform_argocd_ingress_controller_verify_effective | bool
            - (hostvars[rke2_first_server].platform_argocd_ingress_controller_check.rc | default(1)) != 0
            - "'http_code=404' not in (hostvars[rke2_first_server].platform_argocd_ingress_controller_check.stdout | default(''))"

        - name: Wait for MetalLB app VIP speakers after refresh
          ansible.builtin.shell: |
            set -eu
            K=/var/lib/rancher/rke2/bin/kubectl
            C=/etc/rancher/rke2/rke2.yaml
            waited=0
            for ds in metallb-speaker speaker platform-metallb-speaker frr-k8s platform-frr-k8s; do
              if "$K" --kubeconfig "$C" -n metallb-system get "daemonset/${ds}" >/dev/null 2>&1; then
                "$K" --kubeconfig "$C" -n metallb-system rollout status "daemonset/${ds}" \
                  --timeout={{ platform_ingress_poll_interval_effective }}s
                waited=1
              fi
            done
            test "${waited}" -eq 1
          args:
            executable: /bin/bash
          register: platform_argocd_ingress_vip_speaker_rollout
          retries: "{{ platform_argocd_ingress_verify_retries }}"
          delay: "{{ platform_ingress_poll_interval_effective }}"
          until: platform_argocd_ingress_vip_speaker_rollout.rc == 0
          changed_when: false
          failed_when: false
          delegate_to: "{{ rke2_first_server }}"
          run_once: true
          when:
            - platform_argocd_ingress_vip_speaker_restart is defined
            - platform_argocd_ingress_vip_speaker_restart.rc | default(1) == 0

        - name: Flush app VIP neighbor cache on RKE2 nodes
          ansible.builtin.shell: |
            set -eu
            ip neigh flush to {{ rke2_ingress_vip_effective }} 2>/dev/null || true
            ip route flush cache 2>/dev/null || true
            ip route get {{ rke2_ingress_vip_effective }} || true
            ip neigh show {{ rke2_ingress_vip_effective }} || true
          args:
            executable: /bin/bash
          register: platform_argocd_ingress_node_neigh_flush
          changed_when: false
          failed_when: false
          when:
            - platform_argocd_ingress_vip_speaker_restart is defined
            - platform_argocd_ingress_vip_speaker_restart.rc | default(1) == 0

        - name: Flush app VIP neighbor cache on Ansible controller
          ansible.builtin.shell: |
            set -eu
            if command -v ip >/dev/null 2>&1; then
              ip neigh flush to {{ rke2_ingress_vip_effective }} 2>/dev/null || true
              ip route flush cache 2>/dev/null || true
              ip route get {{ rke2_ingress_vip_effective }} || true
              ip neigh show {{ rke2_ingress_vip_effective }} || true
            elif command -v arp >/dev/null 2>&1; then
              arp -d {{ rke2_ingress_vip_effective }} 2>/dev/null || true
              arp -a | grep -F "{{ rke2_ingress_vip_effective }}" || true
            else
              echo "No ip or arp command available on controller; skipping neighbor flush."
            fi

            if command -v powershell.exe >/dev/null 2>&1; then
              echo "===== Windows host ARP flush through powershell.exe ====="
              powershell.exe -NoProfile -NonInteractive -Command 'arp -d {{ rke2_ingress_vip_effective }} 2>$null; arp -a | Select-String "{{ rke2_ingress_vip_effective }}" | ForEach-Object { $_.ToString() }' || true
            fi
            if command -v cmd.exe >/dev/null 2>&1; then
              echo "===== Windows host ARP flush through cmd.exe ====="
              cmd.exe /C "arp -d {{ rke2_ingress_vip_effective }} 2>NUL & arp -a | findstr {{ rke2_ingress_vip_effective }}" || true
            fi
          args:
            executable: /bin/bash
          register: platform_argocd_ingress_controller_neigh_flush
          changed_when: false
          failed_when: false
          become: false
          delegate_to: localhost
          run_once: true
          when:
            - platform_argocd_ingress_vip_speaker_restart is defined
            - platform_argocd_ingress_vip_speaker_restart.rc | default(1) == 0

        - name: Retry Argo CD ingress over app VIP from Ansible controller after VIP refresh
          ansible.builtin.shell: |
            set -o pipefail
            echo "Retrying https://{{ platform_argocd_host_effective }}/ through {{ rke2_ingress_vip_effective }}:443 from Ansible controller after VIP refresh"
            code="$(curl --silent --show-error --insecure --output /dev/null \
              --write-out '%{http_code}' \
              --connect-timeout {{ platform_argocd_ingress_connect_timeout_effective }} \
              --max-time {{ platform_argocd_ingress_max_time_effective }} \
              --resolve {{ platform_argocd_host_effective }}:443:{{ rke2_ingress_vip_effective }} \
              https://{{ platform_argocd_host_effective }}/)"
            printf 'http_code=%s\n' "${code}"
            case "${code}" in
              200|301|302|303|307|308|401|403) exit 0 ;;
              *) exit 1 ;;
            esac
          args:
            executable: /bin/bash
          register: platform_argocd_ingress_controller_check_after_repair
          retries: "{{ platform_argocd_ingress_verify_retries }}"
          delay: "{{ platform_ingress_poll_interval_effective }}"
          until: platform_argocd_ingress_controller_check_after_repair.rc == 0
          changed_when: false
          failed_when: false
          become: false
          delegate_to: localhost
          run_once: true
          when:
            - platform_argocd_ingress_vip_speaker_restart is defined
            - platform_argocd_ingress_vip_speaker_restart.rc | default(1) == 0

        - name: Print Argo CD ingress VIP repair result
          ansible.builtin.debug:
            msg:
              - "MetalLB speaker restart:"
              - "{{ hostvars[rke2_first_server].platform_argocd_ingress_vip_speaker_restart.stdout_lines | default(['not run']) }}"
              - "{{ hostvars[rke2_first_server].platform_argocd_ingress_vip_speaker_restart.stderr_lines | default([]) }}"
              - "Speaker rollout:"
              - "{{ hostvars[rke2_first_server].platform_argocd_ingress_vip_speaker_rollout.stdout_lines | default(['not run']) }}"
              - "{{ hostvars[rke2_first_server].platform_argocd_ingress_vip_speaker_rollout.stderr_lines | default([]) }}"
              - "Controller neighbor flush:"
              - "{{ hostvars[rke2_first_server].platform_argocd_ingress_controller_neigh_flush.stdout_lines | default(['not run']) }}"
              - "Retry check:"
              - "{{ hostvars[rke2_first_server].platform_argocd_ingress_controller_check_after_repair.stdout_lines | default(['not run']) }}"
              - "{{ hostvars[rke2_first_server].platform_argocd_ingress_controller_check_after_repair.stderr_lines | default([]) }}"
          run_once: true
          when:
            - platform_argocd_ingress_vip_speaker_restart is defined
            - platform_argocd_ingress_vip_speaker_restart.rc | default(1) == 0

        - name: Run automatic ingress VIP path classifier
          ansible.builtin.include_tasks: ../tasks/platform-ingress-vip-classifier.yml
          when: >-
            (platform_argocd_ingress_node_strict_effective | bool) or
            (
              (platform_argocd_ingress_controller_verify_effective | bool) and
              ((hostvars[rke2_first_server].platform_argocd_ingress_controller_check.rc | default(1)) != 0) and
              ((hostvars[rke2_first_server].platform_argocd_ingress_controller_check_after_repair.rc | default(1)) != 0)
            )

        - name: Continue when client VIP path works but node self-probes fail
          ansible.builtin.debug:
            msg: |
              Argo CD answered from the Ansible controller/client path through
              {{ rke2_ingress_vip_effective }}:443. Continuing because node-originated
              MetalLB L2 VIP self-probes are advisory by default.

              To require node-originated VIP probes too:
              PLATFORM_ARGOCD_INGRESS_NODE_STRICT=true make platform-ingress
          run_once: true
          when:
            - not (platform_argocd_ingress_node_strict_effective | bool)
            - platform_argocd_ingress_controller_verify_effective | bool
            - >-
              (hostvars[rke2_first_server].platform_argocd_ingress_controller_check.rc | default(1)) == 0 or
              (hostvars[rke2_first_server].platform_argocd_ingress_controller_check_after_repair.rc | default(1)) == 0

        - name: Stop after Argo CD ingress verification failure
          ansible.builtin.fail:
            msg: |
              Argo CD ingress was created, but {{ rke2_ingress_vip_effective }}:443
              did not pass the required ingress verification within
              {{ platform_argocd_ingress_verify_timeout_effective }}s.

              Controller/client VIP check:
              rc={{ hostvars[rke2_first_server].platform_argocd_ingress_controller_check.rc | default('not run') }}
              stdout:
              {{ hostvars[rke2_first_server].platform_argocd_ingress_controller_check.stdout | default('not run') }}
              stderr:
              {{ hostvars[rke2_first_server].platform_argocd_ingress_controller_check.stderr | default('') }}

              Controller/client VIP check after automatic VIP repair:
              rc={{ hostvars[rke2_first_server].platform_argocd_ingress_controller_check_after_repair.rc | default('not run') }}
              stdout:
              {{ hostvars[rke2_first_server].platform_argocd_ingress_controller_check_after_repair.stdout | default('not run') }}
              stderr:
              {{ hostvars[rke2_first_server].platform_argocd_ingress_controller_check_after_repair.stderr | default('') }}

              Node strict mode:
              {{ platform_argocd_ingress_node_strict_effective }}

              Automatic VIP path classifier:
              Cluster:
              {{ platform_argocd_ingress_path_classifier_cluster.stdout | default(hostvars[rke2_first_server].platform_argocd_ingress_path_classifier_cluster.stdout | default('not collected'), true) }}

              Controller/client:
              {{ platform_argocd_ingress_path_classifier_controller.stdout | default(hostvars[rke2_first_server].platform_argocd_ingress_path_classifier_controller.stdout | default('not collected'), true) }}
              {{ platform_argocd_ingress_path_classifier_controller.stderr | default(hostvars[rke2_first_server].platform_argocd_ingress_path_classifier_controller.stderr | default(''), true) }}

              If the controller/client check returns http_code=404, Traefik is
              reachable but did not match an Argo CD router. Review the printed
              Ingress and IngressRoute diagnostics. If it returns http_code=000
              or times out, focus on MetalLB L2/ARP, host firewall forwarding, or
              client-to-VIP routing. If only the node-originated checks failed,
              that can be a MetalLB L2 self-probe limitation; keep strict mode
              disabled unless you explicitly require Kubernetes nodes to access
              the service through the same L2 VIP.

              If the controller is WSL and the retry still times out, run this
              once in an elevated Windows PowerShell and retry:
              arp -d {{ rke2_ingress_vip_effective }}

              To fail faster while debugging:
              PLATFORM_ARGOCD_INGRESS_VERIFY_TIMEOUT=120 make platform-ingress

              To wait longer on slow VIP convergence:
              PLATFORM_ARGOCD_INGRESS_VERIFY_TIMEOUT=1200 make platform-ingress
          run_once: true
          when: >-
            (platform_argocd_ingress_node_strict_effective | bool) or
            (
              (platform_argocd_ingress_controller_verify_effective | bool) and
              ((hostvars[rke2_first_server].platform_argocd_ingress_controller_check.rc | default(1)) != 0) and
              ((hostvars[rke2_first_server].platform_argocd_ingress_controller_check_after_repair.rc | default(1)) != 0)
            )

    - name: Remove temporary Argo CD bootstrap NodePort after ingress is ready
      ansible.builtin.command: >-
        /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
        -n argocd delete service/{{ platform_argocd_bootstrap_service_name }} --ignore-not-found=true
      register: platform_argocd_bootstrap_unexpose
      changed_when: "'deleted' in platform_argocd_bootstrap_unexpose.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Show platform ingress access summary
      ansible.builtin.debug:
        msg: |
          Platform ingress is ready.

          App VIP:
          - {{ rke2_ingress_vip_effective }}

          Argo CD URL:
          - https://{{ platform_argocd_host_effective }}

          Redirects:
          - HTTP host requests are redirected to HTTPS by Traefik.
          - Direct app VIP requests redirect to https://{{ platform_ip_redirect_target_host_effective }} when the browser accepts the certificate warning.

          Windows/internal DNS entry:
          {{ rke2_ingress_vip_effective }} {{ platform_argocd_host_effective }}

          For the full platform, also map the same VIP to:
          {% for entry in platform_gui_host_entries if entry.app != 'argocd' -%}
          {{ entry.host }}{% if not loop.last %} {% endif %}
          {%- endfor %}
      run_once: true

  handlers:
    - name: Reload firewalld
      ansible.builtin.command: firewall-cmd --reload
      changed_when: true
