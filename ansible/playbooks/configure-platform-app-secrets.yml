    - name: Generate or preserve Woodpecker shared agent secret
      tags:
        - woodpecker
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        SECRET="{{ platform_woodpecker_agent_secret_name }}"
        ROTATE="{{ 'true' if platform_app_secret_rotate else 'false' }}"

        "$K" --kubeconfig "$C" create namespace woodpecker --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        if [ "${ROTATE}" != "true" ] && "$K" --kubeconfig "$C" -n woodpecker get "secret/${SECRET}" \
          -o 'go-template={{ "{{" }} index .data "WOODPECKER_AGENT_SECRET" {{ "}}" }}' 2>/dev/null | grep -q .; then
          echo "woodpecker_agent_secret=${SECRET} state=present"
          exit 0
        fi

        agent_secret="${WOODPECKER_AGENT_SECRET:-}"
        if [ -z "${agent_secret}" ]; then
          if command -v openssl >/dev/null 2>&1; then
            agent_secret="$(openssl rand -hex 32)"
          else
            agent_secret="$(python3 - <<'PY'
        import secrets
        print(secrets.token_hex(32))
        PY
        )"
          fi
        fi

        "$K" --kubeconfig "$C" -n woodpecker create secret generic "${SECRET}" \
          --from-literal=WOODPECKER_AGENT_SECRET="${agent_secret}" \
          --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        echo "woodpecker_agent_secret=${SECRET} state=generated"
      args:
        executable: /bin/bash
