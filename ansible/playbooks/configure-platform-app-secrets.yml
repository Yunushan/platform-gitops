          --dry-run=client -o yaml | \
          "$K" --kubeconfig "$C" label --local -f - cnpg.io/reload=true -o yaml | \
          "$K" --kubeconfig "$C" apply -f -

        state=generated
        if [ "${ROTATE}" != "true" ] && [ -n "${app_password}" ] && [ -n "${database_password}" ]; then
          state=present
        fi
        echo "grafana_database_secret=${SECRET} state=${state}"
      args:
        executable: /bin/bash
      environment:
        GRAFANA_DATABASE_USER: "{{ lookup('ansible.builtin.env', 'GRAFANA_DATABASE_USER') }}"
        GRAFANA_DATABASE_PASSWORD: "{{ lookup('ansible.builtin.env', 'GRAFANA_DATABASE_PASSWORD') }}"
        GRAFANA_DATABASE_AUTO_GENERATE: "{{ lookup('ansible.builtin.env', 'GRAFANA_DATABASE_AUTO_GENERATE') }}"
      register: platform_grafana_database_secret_result
      changed_when: "'state=generated' in platform_grafana_database_secret_result.stdout"
      no_log: true
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Check Grafana database password secret state
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        SECRET="{{ platform_grafana_database_secret_name }}"
        if "$K" --kubeconfig "$C" -n monitoring get "secret/${SECRET}" \
          -o 'go-template={{ "{{" }} index .data "username" {{ "}}" }}{{ "{{" }} index .data "password" {{ "}}" }}' 2>/dev/null | grep -q . && \
          "$K" --kubeconfig "$C" -n platform-databases get "secret/${SECRET}" \
          -o 'go-template={{ "{{" }} index .data "username" {{ "}}" }}{{ "{{" }} index .data "password" {{ "}}" }}' 2>/dev/null | grep -q .; then
          echo present
        else
          echo missing
        fi
      args:
        executable: /bin/bash
      register: platform_grafana_database_secret_state
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Require Grafana database password secret when enabled
      ansible.builtin.fail:
        msg: |
          Grafana external database password secret is required but not present.

          Secret state:
          - monitoring/{{ platform_grafana_database_secret_name }} and platform-databases/{{ platform_grafana_database_secret_name }}: {{ platform_grafana_database_secret_state.stdout | trim | default('unknown', true) }}

          Credentials are generated automatically unless
          GRAFANA_DATABASE_AUTO_GENERATE=false. Optional explicit values:
          GRAFANA_DATABASE_USER / GRAFANA_DATABASE_PASSWORD
      when: platform_app_secret_require_grafana_database | bool and (platform_grafana_database_secret_state.stdout | trim) != 'present'
      run_once: true

    - name: Generate or preserve platform SSO client secrets
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        KEYCLOAK_SECRET="{{ platform_sso_keycloak_secret_name }}"
        ARGOCD_SECRET="{{ platform_sso_argocd_secret_name }}"
        GRAFANA_SECRET="{{ platform_sso_grafana_secret_name }}"
        PROMETHEUS_SECRET="{{ platform_sso_prometheus_secret_name }}"
        ROTATE="{{ 'true' if platform_app_secret_rotate else 'false' }}"

        random_b64() {
          if command -v openssl >/dev/null 2>&1; then
            openssl rand -base64 30 | tr -d '\n'
          else
            python3 - <<'PY'
        import secrets
        print(secrets.token_urlsafe(36))
        PY
          fi
        }

        cookie_secret() {
          if command -v openssl >/dev/null 2>&1; then
            openssl rand -base64 32 | tr -d '\n'
          else
            python3 - <<'PY'
        import base64
        import secrets
        print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())
        PY
          fi
        }

        read_existing() {
          key="$1"
          "$K" --kubeconfig "$C" -n keycloak get "secret/${KEYCLOAK_SECRET}" \
            -o "go-template={{ '{{' }} index .data \"${key}\" {{ '}}' }}" 2>/dev/null | base64 -d || true
        }

        resolve_value() {
          explicit="$1"
          existing="$2"
          generator="$3"
          if [ -n "${explicit}" ]; then
            printf '%s' "${explicit}"
          elif [ "${ROTATE}" != "true" ] && [ -n "${existing}" ]; then
            printf '%s' "${existing}"
          else
            "${generator}"
          fi
        }

        "$K" --kubeconfig "$C" create namespace keycloak --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -
        "$K" --kubeconfig "$C" create namespace argocd --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -
        "$K" --kubeconfig "$C" create namespace monitoring --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        bootstrap_password="$(resolve_value "${PLATFORM_SSO_BOOTSTRAP_ADMIN_PASSWORD:-}" "$(read_existing PLATFORM_SSO_BOOTSTRAP_ADMIN_PASSWORD)" random_b64)"
        argocd_client_secret="$(resolve_value "${PLATFORM_SSO_ARGOCD_CLIENT_SECRET:-}" "$(read_existing PLATFORM_SSO_ARGOCD_CLIENT_SECRET)" random_b64)"
        grafana_client_secret="$(resolve_value "${PLATFORM_SSO_GRAFANA_CLIENT_SECRET:-}" "$(read_existing PLATFORM_SSO_GRAFANA_CLIENT_SECRET)" random_b64)"
        prometheus_client_secret="$(resolve_value "${PLATFORM_SSO_PROMETHEUS_CLIENT_SECRET:-}" "$(read_existing PLATFORM_SSO_PROMETHEUS_CLIENT_SECRET)" random_b64)"
        prometheus_cookie_secret="$(resolve_value "${PLATFORM_SSO_PROMETHEUS_COOKIE_SECRET:-}" "$(read_existing PLATFORM_SSO_PROMETHEUS_COOKIE_SECRET)" cookie_secret)"

        state=generated
        if [ "${ROTATE}" != "true" ] && \
          "$K" --kubeconfig "$C" -n keycloak get "secret/${KEYCLOAK_SECRET}" >/dev/null 2>&1 && \
          "$K" --kubeconfig "$C" -n argocd get "secret/${ARGOCD_SECRET}" >/dev/null 2>&1 && \
          "$K" --kubeconfig "$C" -n monitoring get "secret/${GRAFANA_SECRET}" >/dev/null 2>&1 && \
          "$K" --kubeconfig "$C" -n monitoring get "secret/${PROMETHEUS_SECRET}" >/dev/null 2>&1; then
          state=present
        fi

        "$K" --kubeconfig "$C" -n keycloak create secret generic "${KEYCLOAK_SECRET}" \
          --from-literal=PLATFORM_SSO_BOOTSTRAP_ADMIN_PASSWORD="${bootstrap_password}" \
          --from-literal=PLATFORM_SSO_ARGOCD_CLIENT_SECRET="${argocd_client_secret}" \
          --from-literal=PLATFORM_SSO_GRAFANA_CLIENT_SECRET="${grafana_client_secret}" \
          --from-literal=PLATFORM_SSO_PROMETHEUS_CLIENT_SECRET="${prometheus_client_secret}" \
          --from-literal=PLATFORM_SSO_PROMETHEUS_COOKIE_SECRET="${prometheus_cookie_secret}" \
          --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        "$K" --kubeconfig "$C" -n argocd create secret generic "${ARGOCD_SECRET}" \
          --from-literal=client-secret="${argocd_client_secret}" \
          --dry-run=client -o yaml | \
          "$K" --kubeconfig "$C" label --local -f - app.kubernetes.io/part-of=argocd -o yaml | \
          "$K" --kubeconfig "$C" apply -f -

        "$K" --kubeconfig "$C" -n monitoring create secret generic "${GRAFANA_SECRET}" \
          --from-literal=GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET="${grafana_client_secret}" \
          --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        "$K" --kubeconfig "$C" -n monitoring create secret generic "${PROMETHEUS_SECRET}" \
          --from-literal=client-secret="${prometheus_client_secret}" \
          --from-literal=cookie-secret="${prometheus_cookie_secret}" \
          --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        echo "platform_sso_clients state=${state} keycloak_secret=${KEYCLOAK_SECRET}"
      args:
        executable: /bin/bash
      environment:
        PLATFORM_SSO_BOOTSTRAP_ADMIN_PASSWORD: "{{ lookup('ansible.builtin.env', 'PLATFORM_SSO_BOOTSTRAP_ADMIN_PASSWORD') }}"
        PLATFORM_SSO_ARGOCD_CLIENT_SECRET: "{{ lookup('ansible.builtin.env', 'PLATFORM_SSO_ARGOCD_CLIENT_SECRET') }}"
        PLATFORM_SSO_GRAFANA_CLIENT_SECRET: "{{ lookup('ansible.builtin.env', 'PLATFORM_SSO_GRAFANA_CLIENT_SECRET') }}"
        PLATFORM_SSO_PROMETHEUS_CLIENT_SECRET: "{{ lookup('ansible.builtin.env', 'PLATFORM_SSO_PROMETHEUS_CLIENT_SECRET') }}"
        PLATFORM_SSO_PROMETHEUS_COOKIE_SECRET: "{{ lookup('ansible.builtin.env', 'PLATFORM_SSO_PROMETHEUS_COOKIE_SECRET') }}"
      register: platform_sso_client_secrets_result
      changed_when: "'state=generated' in platform_sso_client_secrets_result.stdout"
      no_log: true
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      when: platform_sso_enabled | bool

    - name: Generate or preserve Keycloak admin credentials secret
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        SECRET="{{ platform_keycloak_admin_secret_name }}"
        ROTATE="{{ 'true' if platform_app_secret_rotate else 'false' }}"

        random_b64() {
          if command -v openssl >/dev/null 2>&1; then
            openssl rand -base64 30
          else
            python3 - <<'PY'
        import secrets
        print(secrets.token_urlsafe(32))
        PY
          fi
        }

        "$K" --kubeconfig "$C" create namespace keycloak --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        if [ "${ROTATE}" != "true" ] && "$K" --kubeconfig "$C" -n keycloak get "secret/${SECRET}" \
          -o 'go-template={{ "{{" }} index .data "admin-user" {{ "}}" }}{{ "{{" }} index .data "admin-password" {{ "}}" }}' 2>/dev/null | grep -q .; then
          echo "keycloak_admin_secret=${SECRET} state=present"
          exit 0
        fi

        admin_user="${KEYCLOAK_ADMIN_USER:-admin}"
        admin_password="${KEYCLOAK_ADMIN_PASSWORD:-}"
        auto_generate="${KEYCLOAK_ADMIN_AUTO_GENERATE:-true}"
        if [ -z "${admin_password}" ]; then
          if [ "${auto_generate}" = "true" ]; then
            admin_password="$(random_b64)"
          else
            echo "keycloak_admin_secret=${SECRET} state=missing reason=set-KEYCLOAK_ADMIN_PASSWORD"
            exit 0
          fi
        fi

        "$K" --kubeconfig "$C" -n keycloak create secret generic "${SECRET}" \
          --from-literal=admin-user="${admin_user}" \
          --from-literal=admin-password="${admin_password}" \
          --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        echo "keycloak_admin_secret=${SECRET} state=generated"
      args:
        executable: /bin/bash
      environment:
        KEYCLOAK_ADMIN_USER: "{{ lookup('ansible.builtin.env', 'KEYCLOAK_ADMIN_USER') }}"
        KEYCLOAK_ADMIN_PASSWORD: "{{ lookup('ansible.builtin.env', 'KEYCLOAK_ADMIN_PASSWORD') }}"
        KEYCLOAK_ADMIN_AUTO_GENERATE: "{{ lookup('ansible.builtin.env', 'KEYCLOAK_ADMIN_AUTO_GENERATE') }}"
      register: platform_keycloak_admin_secret_result
      changed_when: "'state=generated' in platform_keycloak_admin_secret_result.stdout"
      no_log: true
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Generate or preserve Keycloak database password secret
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        SECRET="{{ platform_keycloak_database_secret_name }}"
        ROTATE="{{ 'true' if platform_app_secret_rotate else 'false' }}"

        random_b64() {
          if command -v openssl >/dev/null 2>&1; then
            openssl rand -base64 30
          else
            python3 - <<'PY'
        import secrets
        print(secrets.token_urlsafe(32))
        PY
          fi
        }

        "$K" --kubeconfig "$C" create namespace keycloak --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -
        "$K" --kubeconfig "$C" create namespace platform-databases --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        existing_user=""
        existing_password=""
        if [ "${ROTATE}" != "true" ]; then
          existing_user="$("$K" --kubeconfig "$C" -n keycloak get "secret/${SECRET}" -o "go-template={{ '{{' }} index .data \"username\" {{ '}}' }}" 2>/dev/null | base64 -d || true)"
          existing_password="$("$K" --kubeconfig "$C" -n keycloak get "secret/${SECRET}" -o "go-template={{ '{{' }} index .data \"password\" {{ '}}' }}" 2>/dev/null | base64 -d || true)"
          if [ -z "${existing_password}" ]; then
            existing_user="$("$K" --kubeconfig "$C" -n platform-databases get "secret/${SECRET}" -o "go-template={{ '{{' }} index .data \"username\" {{ '}}' }}" 2>/dev/null | base64 -d || true)"
            existing_password="$("$K" --kubeconfig "$C" -n platform-databases get "secret/${SECRET}" -o "go-template={{ '{{' }} index .data \"password\" {{ '}}' }}" 2>/dev/null | base64 -d || true)"
          fi
        fi

        db_user="${KEYCLOAK_DATABASE_USER:-${existing_user:-keycloak}}"
        password="${KEYCLOAK_DATABASE_PASSWORD:-${existing_password:-}}"
        auto_generate="${KEYCLOAK_DATABASE_AUTO_GENERATE:-true}"
        state=generated
        if [ -z "${password}" ]; then
          if [ "${auto_generate}" = "true" ]; then
            password="$(random_b64)"
          else
            echo "keycloak_database_secret=${SECRET} state=missing reason=set-KEYCLOAK_DATABASE_PASSWORD"
            exit 0
          fi
        elif [ -n "${existing_password}" ] && [ "${ROTATE}" != "true" ]; then
          state=present
        fi

        "$K" --kubeconfig "$C" -n keycloak create secret generic "${SECRET}" \
          --from-literal=username="${db_user}" \
          --from-literal=password="${password}" \
          --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        "$K" --kubeconfig "$C" -n platform-databases create secret generic "${SECRET}" \
          --type=kubernetes.io/basic-auth \
          --from-literal=username="${db_user}" \
          --from-literal=password="${password}" \
          --dry-run=client -o yaml | \
          "$K" --kubeconfig "$C" label --local -f - cnpg.io/reload=true -o yaml | \
          "$K" --kubeconfig "$C" apply -f -

        echo "keycloak_database_secret=${SECRET} state=${state}"
      args:
        executable: /bin/bash
      environment:
        KEYCLOAK_DATABASE_USER: "{{ lookup('ansible.builtin.env', 'KEYCLOAK_DATABASE_USER') }}"
        KEYCLOAK_DATABASE_PASSWORD: "{{ lookup('ansible.builtin.env', 'KEYCLOAK_DATABASE_PASSWORD') }}"
        KEYCLOAK_DATABASE_AUTO_GENERATE: "{{ lookup('ansible.builtin.env', 'KEYCLOAK_DATABASE_AUTO_GENERATE') }}"
      register: platform_keycloak_database_secret_result
      changed_when: "'state=generated' in platform_keycloak_database_secret_result.stdout"
      no_log: true
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Check Keycloak database password secret state
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        SECRET="{{ platform_keycloak_database_secret_name }}"
        if "$K" --kubeconfig "$C" -n keycloak get "secret/${SECRET}" \
          -o 'go-template={{ "{{" }} index .data "username" {{ "}}" }}{{ "{{" }} index .data "password" {{ "}}" }}' 2>/dev/null | grep -q . && \
          "$K" --kubeconfig "$C" -n platform-databases get "secret/${SECRET}" \
          -o 'go-template={{ "{{" }} index .data "username" {{ "}}" }}{{ "{{" }} index .data "password" {{ "}}" }}' 2>/dev/null | grep -q .; then
          echo present
        else
          echo missing
        fi
      args:
        executable: /bin/bash
      register: platform_keycloak_database_secret_state
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Require Keycloak database password secret when enabled
      ansible.builtin.fail:
        msg: |
          Keycloak external database password secret is required but not present.

          Secret state:
          - keycloak/{{ platform_keycloak_database_secret_name }} and platform-databases/{{ platform_keycloak_database_secret_name }}: {{ platform_keycloak_database_secret_state.stdout | trim | default('unknown', true) }}

          Provide the password through an ignored environment value and rerun:
          KEYCLOAK_DATABASE_PASSWORD
      when: platform_app_secret_require_keycloak_database | bool and (platform_keycloak_database_secret_state.stdout | trim) != 'present'
      run_once: true

    - name: Generate or preserve Forgejo external database password secret
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        SECRET="{{ platform_forgejo_database_secret_name }}"
        ROTATE="{{ 'true' if platform_app_secret_rotate else 'false' }}"

        "$K" --kubeconfig "$C" create namespace forgejo --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -
        "$K" --kubeconfig "$C" create namespace platform-databases --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        if [ "${ROTATE}" != "true" ] && "$K" --kubeconfig "$C" -n forgejo get "secret/${SECRET}" >/dev/null 2>&1; then
          if "$K" --kubeconfig "$C" -n platform-databases get "secret/${SECRET}" >/dev/null 2>&1; then
            echo "forgejo_database_secret=${SECRET} state=present"
            exit 0
          fi
          existing_user="$("$K" --kubeconfig "$C" -n forgejo get "secret/${SECRET}" -o "go-template={{ '{{' }} index .data \"username\" {{ '}}' }}" 2>/dev/null | base64 -d || true)"
          existing_password="$("$K" --kubeconfig "$C" -n forgejo get "secret/${SECRET}" -o "go-template={{ '{{' }} index .data \"password\" {{ '}}' }}" 2>/dev/null | base64 -d || true)"
          if [ -n "${existing_password}" ]; then
            "$K" --kubeconfig "$C" -n platform-databases create secret generic "${SECRET}" \
              --from-literal=username="${existing_user:-${FORGEJO_DATABASE_USER:-forgejo}}" \
              --from-literal=password="${existing_password}" \
              --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -
            echo "forgejo_database_secret=${SECRET} state=synced"
            exit 0
          fi
        fi

        random_b64() {
          if command -v openssl >/dev/null 2>&1; then
            openssl rand -base64 30
          else
            python3 - <<'PY'
        import secrets
        print(secrets.token_urlsafe(32))
        PY
          fi
        }

        database_user="${FORGEJO_DATABASE_USER:-forgejo}"
        auto_generate="${FORGEJO_DATABASE_AUTO_GENERATE:-true}"
        password="${FORGEJO_DATABASE_PASSWORD:-}"
        if [ -z "${password}" ]; then
          if [ "${auto_generate}" = "true" ]; then
            password="$(random_b64)"
          else
            echo "forgejo_database_secret=${SECRET} state=missing reason=set-FORGEJO_DATABASE_PASSWORD"
            exit 0
          fi
        fi

        "$K" --kubeconfig "$C" -n forgejo create secret generic "${SECRET}" \
          --from-literal=username="${database_user}" \
          --from-literal=password="${password}" \
          --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -
        "$K" --kubeconfig "$C" -n platform-databases create secret generic "${SECRET}" \
          --from-literal=username="${database_user}" \
          --from-literal=password="${password}" \
          --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        echo "forgejo_database_secret=${SECRET} state=generated"
      args:
        executable: /bin/bash
      environment:
        FORGEJO_DATABASE_PASSWORD: "{{ lookup('ansible.builtin.env', 'FORGEJO_DATABASE_PASSWORD') }}"
        FORGEJO_DATABASE_USER: "{{ lookup('ansible.builtin.env', 'FORGEJO_DATABASE_USER') }}"
        FORGEJO_DATABASE_AUTO_GENERATE: "{{ lookup('ansible.builtin.env', 'FORGEJO_DATABASE_AUTO_GENERATE') }}"
      register: platform_forgejo_database_secret_result
      changed_when: "'state=generated' in platform_forgejo_database_secret_result.stdout"
      no_log: true
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Check Forgejo external database password secret state
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        SECRET="{{ platform_forgejo_database_secret_name }}"
        if "$K" --kubeconfig "$C" -n forgejo get "secret/${SECRET}" \
          -o "go-template={{ '{{' }} index .data \"password\" {{ '}}' }}" 2>/dev/null | grep -q .; then
          echo present
        else
          echo missing
        fi
      args:
        executable: /bin/bash
      register: platform_forgejo_database_secret_state
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Generate or preserve Forgejo Redis URI secret
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        SECRET="{{ platform_forgejo_redis_secret_name }}"
        ROTATE="{{ 'true' if platform_app_secret_rotate else 'false' }}"

        "$K" --kubeconfig "$C" create namespace forgejo --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        current_uri="$($K --kubeconfig "$C" -n forgejo get "secret/${SECRET}" \
          -o "go-template={{ '{{' }} index .data \"uri\" {{ '}}' }}" 2>/dev/null | base64 -d || true)"

        uri="${FORGEJO_REDIS_URL:-}"
        if [ -z "${uri}" ]; then
          redis_host="${FORGEJO_REDIS_HOST:-{{ platform_valkey_primary_host }}}"
          redis_port="${FORGEJO_REDIS_PORT:-{{ platform_valkey_port }}}"
          redis_db="${FORGEJO_REDIS_DB:-0}"
          redis_password="${FORGEJO_REDIS_PASSWORD:-}"
          redis_tls="${FORGEJO_REDIS_TLS:-true}"
          if [ -z "${redis_password}" ]; then
            redis_password="$("$K" --kubeconfig "$C" -n platform-cache get "secret/{{ platform_valkey_auth_secret_name }}" \
              -o "go-template={{ '{{' }} index .data \"{{ platform_valkey_password_key }}\" {{ '}}' }}" 2>/dev/null | base64 -d || true)"
          fi
          if [ -n "${redis_host}" ] && [ -n "${redis_password}" ]; then
            uri="$(python3 - "${redis_host}" "${redis_port}" "${redis_db}" "${redis_password}" "${redis_tls}" <<'PY'
        import sys
        from urllib.parse import quote

        host, port, db, password, tls = sys.argv[1:6]
        scheme = "rediss" if tls.strip().lower() in {"1", "true", "yes", "on"} else "redis"
        netloc = host if ":" in host or host.startswith("[") else f"{host}:{port}"
        print(f"{scheme}://:{quote(password, safe='')}@{netloc}/{db}")
        PY
        )"
          fi
        fi

        if [ -z "${uri}" ]; then
          if [ "${ROTATE}" != "true" ] && [ -n "${current_uri}" ]; then
            echo "forgejo_redis_secret=${SECRET} state=present-unverified"
            exit 0
          fi
          echo "forgejo_redis_secret=${SECRET} state=missing reason=set-FORGEJO_REDIS_URL-or-FORGEJO_REDIS_HOST-and-FORGEJO_REDIS_PASSWORD-or-platform-valkey-auth"
          exit 0
        fi

        if [ "${ROTATE}" != "true" ] && [ "${current_uri}" = "${uri}" ]; then
          echo "forgejo_redis_secret=${SECRET} state=present"
          exit 0
        fi

        state=generated
        if [ -n "${current_uri}" ]; then
          state=reconciled
        fi

        "$K" --kubeconfig "$C" -n forgejo create secret generic "${SECRET}" \
          --from-literal=uri="${uri}" \
          --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        echo "forgejo_redis_secret=${SECRET} state=${state}"
      args:
        executable: /bin/bash
      environment:
        FORGEJO_REDIS_URL: "{{ lookup('ansible.builtin.env', 'FORGEJO_REDIS_URL') }}"
        FORGEJO_REDIS_HOST: "{{ lookup('ansible.builtin.env', 'FORGEJO_REDIS_HOST') }}"
        FORGEJO_REDIS_PORT: "{{ lookup('ansible.builtin.env', 'FORGEJO_REDIS_PORT') }}"
        FORGEJO_REDIS_DB: "{{ lookup('ansible.builtin.env', 'FORGEJO_REDIS_DB') }}"
        FORGEJO_REDIS_PASSWORD: "{{ lookup('ansible.builtin.env', 'FORGEJO_REDIS_PASSWORD') }}"
        FORGEJO_REDIS_TLS: "{{ lookup('ansible.builtin.env', 'FORGEJO_REDIS_TLS') }}"
      register: platform_forgejo_redis_secret_result
      changed_when: >-
        'state=generated' in platform_forgejo_redis_secret_result.stdout or
        'state=reconciled' in platform_forgejo_redis_secret_result.stdout
      no_log: true
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Check Forgejo Redis URI secret state
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        SECRET="{{ platform_forgejo_redis_secret_name }}"
        if "$K" --kubeconfig "$C" -n forgejo get "secret/${SECRET}" \
          -o "go-template={{ '{{' }} index .data \"uri\" {{ '}}' }}" 2>/dev/null | grep -q .; then
          echo present
        else
          echo missing
        fi
      args:
        executable: /bin/bash
      register: platform_forgejo_redis_secret_state
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Generate or preserve Forgejo object storage credentials secret
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        SECRET="{{ platform_forgejo_object_storage_secret_name }}"
        ROTATE="{{ 'true' if platform_app_secret_rotate else 'false' }}"

        "$K" --kubeconfig "$C" create namespace forgejo --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        if [ "${ROTATE}" != "true" ] && \
          "$K" --kubeconfig "$C" -n forgejo get "secret/${SECRET}" \
            -o 'go-template={{ "{{" }} index .data "access-key-id" {{ "}}" }}' 2>/dev/null | grep -q . && \
          "$K" --kubeconfig "$C" -n forgejo get "secret/${SECRET}" \
            -o 'go-template={{ "{{" }} index .data "secret-access-key" {{ "}}" }}' 2>/dev/null | grep -q .; then
          echo "forgejo_object_storage_secret=${SECRET} state=present"
          exit 0
        fi

        access_key="${FORGEJO_S3_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID:-}}"
        secret_key="${FORGEJO_S3_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY:-}}"
        if [ -z "${access_key}" ] || [ -z "${secret_key}" ]; then
          if [ "${PLATFORM_PRODUCTION_STRICT}" != "true" ]; then
            access_key="$($K --kubeconfig "$C" -n object-storage get "secret/{{ platform_minio_root_secret_name }}" \
              -o 'go-template={{ "{{" }} index .data "{{ platform_minio_root_user_secret_key }}" {{ "}}" }}' 2>/dev/null | base64 -d || true)"
            secret_key="$($K --kubeconfig "$C" -n object-storage get "secret/{{ platform_minio_root_secret_name }}" \
              -o 'go-template={{ "{{" }} index .data "{{ platform_minio_root_password_secret_key }}" {{ "}}" }}' 2>/dev/null | base64 -d || true)"
          fi
        fi

        if [ -z "${access_key}" ] || [ -z "${secret_key}" ]; then
          echo "forgejo_object_storage_secret=${SECRET} state=missing reason=set-FORGEJO_S3_ACCESS_KEY_ID-and-FORGEJO_S3_SECRET_ACCESS_KEY"
          exit 0
        fi

        "$K" --kubeconfig "$C" -n forgejo create secret generic "${SECRET}" \
          --from-literal=access-key-id="${access_key}" \
          --from-literal=secret-access-key="${secret_key}" \
          --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        echo "forgejo_object_storage_secret=${SECRET} state=generated"
      args:
        executable: /bin/bash
      environment:
        FORGEJO_S3_ACCESS_KEY_ID: "{{ lookup('ansible.builtin.env', 'FORGEJO_S3_ACCESS_KEY_ID') }}"
        FORGEJO_S3_SECRET_ACCESS_KEY: "{{ lookup('ansible.builtin.env', 'FORGEJO_S3_SECRET_ACCESS_KEY') }}"
        AWS_ACCESS_KEY_ID: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
        AWS_SECRET_ACCESS_KEY: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"
        PLATFORM_PRODUCTION_STRICT: "{{ 'true' if platform_production_strict else 'false' }}"
      register: platform_forgejo_object_storage_secret_result
      changed_when: "'state=generated' in platform_forgejo_object_storage_secret_result.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      no_log: true

    - name: Check Forgejo object storage credentials secret state
      ansible.builtin.shell: |
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        SECRET="{{ platform_forgejo_object_storage_secret_name }}"
        if "$K" --kubeconfig "$C" -n forgejo get "secret/${SECRET}" \
          -o 'go-template={{ "{{" }} index .data "access-key-id" {{ "}}" }}' 2>/dev/null | grep -q . && \
          "$K" --kubeconfig "$C" -n forgejo get "secret/${SECRET}" \
          -o 'go-template={{ "{{" }} index .data "secret-access-key" {{ "}}" }}' 2>/dev/null | grep -q .; then
          echo present
        else
          echo missing
        fi
      args:
        executable: /bin/bash
      register: platform_forgejo_object_storage_secret_state
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Require Forgejo production dependency secrets when enabled
      ansible.builtin.fail:
        msg: |
          Forgejo production dependency secrets are required but not present.

          Secret state:
          - forgejo/{{ platform_forgejo_database_secret_name }}: {{ platform_forgejo_database_secret_state.stdout | trim | default('unknown', true) }}
          - forgejo/{{ platform_forgejo_redis_secret_name }}: {{ platform_forgejo_redis_secret_state.stdout | trim | default('unknown', true) }}
          - forgejo/{{ platform_forgejo_object_storage_secret_name }}: {{ platform_forgejo_object_storage_secret_state.stdout | trim | default('unknown', true) }}

          Provide credentials through ignored environment values and rerun:
          FORGEJO_DATABASE_PASSWORD
          FORGEJO_REDIS_URL

          Or provide Redis parts:
          FORGEJO_REDIS_HOST
          FORGEJO_REDIS_PASSWORD
          FORGEJO_REDIS_PORT
          FORGEJO_REDIS_DB
          FORGEJO_REDIS_TLS
          FORGEJO_S3_ACCESS_KEY_ID / FORGEJO_S3_SECRET_ACCESS_KEY
      when: >-
        (platform_app_secret_require_forgejo_database | bool and (platform_forgejo_database_secret_state.stdout | trim) != 'present') or
        (platform_app_secret_require_forgejo_redis | bool and (platform_forgejo_redis_secret_state.stdout | trim) != 'present') or
        (platform_app_secret_require_forgejo_object_storage | bool and (platform_forgejo_object_storage_secret_state.stdout | trim) != 'present')
      run_once: true

    - name: Generate or preserve Loki object storage credentials secret
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        SECRET="{{ platform_loki_object_storage_secret_name }}"
        ROTATE="{{ 'true' if platform_app_secret_rotate else 'false' }}"

        "$K" --kubeconfig "$C" create namespace logging --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        if [ "${ROTATE}" != "true" ] && "$K" --kubeconfig "$C" -n logging get "secret/${SECRET}" >/dev/null 2>&1; then
          echo "loki_object_storage_secret=${SECRET} state=present"
          exit 0
        fi

        access_key="${LOKI_S3_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID:-}}"
        secret_key="${LOKI_S3_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY:-}}"
        if [ -z "${access_key}" ] || [ -z "${secret_key}" ]; then
          access_key="$("$K" --kubeconfig "$C" -n object-storage get "secret/{{ platform_minio_root_secret_name }}" -o 'go-template={{ "{{" }} index .data "root-user" {{ "}}" }}' 2>/dev/null | base64 -d || true)"
          secret_key="$("$K" --kubeconfig "$C" -n object-storage get "secret/{{ platform_minio_root_secret_name }}" -o 'go-template={{ "{{" }} index .data "root-password" {{ "}}" }}' 2>/dev/null | base64 -d || true)"
        fi

        if [ -z "${access_key}" ] || [ -z "${secret_key}" ]; then
          echo "loki_object_storage_secret=${SECRET} state=missing reason=set-LOKI_S3_ACCESS_KEY_ID-and-LOKI_S3_SECRET_ACCESS_KEY-or-create-{{ platform_minio_root_secret_name }}"
          exit 0
        fi

        "$K" --kubeconfig "$C" -n logging create secret generic "${SECRET}" \
          --from-literal=LOKI_S3_ACCESS_KEY_ID="${access_key}" \
          --from-literal=LOKI_S3_SECRET_ACCESS_KEY="${secret_key}" \
          --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        echo "loki_object_storage_secret=${SECRET} state=generated"
      args:
        executable: /bin/bash
      environment:
        LOKI_S3_ACCESS_KEY_ID: "{{ lookup('ansible.builtin.env', 'LOKI_S3_ACCESS_KEY_ID') }}"
        LOKI_S3_SECRET_ACCESS_KEY: "{{ lookup('ansible.builtin.env', 'LOKI_S3_SECRET_ACCESS_KEY') }}"
        AWS_ACCESS_KEY_ID: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
        AWS_SECRET_ACCESS_KEY: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"
      register: platform_loki_secret_result
      changed_when: "'state=generated' in platform_loki_secret_result.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      no_log: true

    - name: Check Loki object storage credentials secret state
      ansible.builtin.shell: |
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        if "$K" --kubeconfig "$C" -n logging get "secret/{{ platform_loki_object_storage_secret_name }}" >/dev/null 2>&1; then
          echo present
        else
          echo missing
        fi
      args:
        executable: /bin/bash
      register: platform_loki_secret_state
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Generate or preserve Loki gateway and client credentials
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        GATEWAY_SECRET="{{ platform_loki_gateway_secret_name }}"
        CLIENT_SECRET="{{ platform_loki_client_secret_name }}"
        ROTATE="{{ 'true' if platform_app_secret_rotate else 'false' }}"

        "$K" --kubeconfig "$C" create namespace logging --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -
        "$K" --kubeconfig "$C" create namespace monitoring --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        username="${LOKI_GATEWAY_USERNAME:-platform}"
        password="${LOKI_GATEWAY_PASSWORD:-}"
        state=generated
        if [ "${ROTATE}" != "true" ] &&
          "$K" --kubeconfig "$C" -n logging get "secret/${GATEWAY_SECRET}" \
            -o 'go-template={{ "{{" }} index .data "username" {{ "}}" }}' 2>/dev/null | grep -q . &&
          "$K" --kubeconfig "$C" -n logging get "secret/${GATEWAY_SECRET}" \
            -o 'go-template={{ "{{" }} index .data "password" {{ "}}" }}' 2>/dev/null | grep -q .; then
          username="$($K --kubeconfig "$C" -n logging get "secret/${GATEWAY_SECRET}" \
            -o 'go-template={{ "{{" }} index .data "username" {{ "}}" }}' | base64 -d)"
          password="$($K --kubeconfig "$C" -n logging get "secret/${GATEWAY_SECRET}" \
            -o 'go-template={{ "{{" }} index .data "password" {{ "}}" }}' | base64 -d)"
          state=present
        fi

        if ! [[ "${username}" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "LOKI_GATEWAY_USERNAME may contain only letters, numbers, dot, underscore, and hyphen" >&2
          exit 1
        fi
        if [ -z "${password}" ]; then
          password="$(python3 - <<'PY'
        import secrets
        print(secrets.token_urlsafe(36))
        PY
          )"
        fi

        password_hash="$(LOKI_GATEWAY_PASSWORD="${password}" python3 - <<'PY'
        import base64
        import hashlib
        import os
        digest = hashlib.sha1(os.environ["LOKI_GATEWAY_PASSWORD"].encode("utf-8")).digest()
        print(base64.b64encode(digest).decode("ascii"))
        PY
        )"
        htpasswd="${username}:{SHA}${password_hash}"

        "$K" --kubeconfig "$C" -n logging create secret generic "${GATEWAY_SECRET}" \
          --from-literal=.htpasswd="${htpasswd}" \
          --from-literal=username="${username}" \
          --from-literal=password="${password}" \
          --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -
        "$K" --kubeconfig "$C" -n monitoring create secret generic "${CLIENT_SECRET}" \
          --from-literal=username="${username}" \
          --from-literal=password="${password}" \
          --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        echo "loki_gateway_secret=${GATEWAY_SECRET} client_secret=${CLIENT_SECRET} state=${state}"
      args:
        executable: /bin/bash
      environment:
        LOKI_GATEWAY_USERNAME: "{{ lookup('ansible.builtin.env', 'LOKI_GATEWAY_USERNAME') }}"
        LOKI_GATEWAY_PASSWORD: "{{ lookup('ansible.builtin.env', 'LOKI_GATEWAY_PASSWORD') }}"
      register: platform_loki_gateway_secret_result
      changed_when: "'state=generated' in platform_loki_gateway_secret_result.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      no_log: true

    - name: Check Loki gateway and client credentials state
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        for item in \
          "logging/{{ platform_loki_gateway_secret_name }}/.htpasswd" \
          "logging/{{ platform_loki_gateway_secret_name }}/username" \
          "logging/{{ platform_loki_gateway_secret_name }}/password" \
          "monitoring/{{ platform_loki_client_secret_name }}/username" \
          "monitoring/{{ platform_loki_client_secret_name }}/password"; do
          namespace="${item%%/*}"
          rest="${item#*/}"
          secret="${rest%%/*}"
          key="${rest#*/}"
          value="$($K --kubeconfig "$C" -n "$namespace" get "secret/${secret}" \
            -o "go-template={{ '{{' }} index .data \"${key}\" {{ '}}' }}" 2>/dev/null || true)"
          test -n "$value"
        done
        echo present
      args:
        executable: /bin/bash
      register: platform_loki_gateway_secret_state
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Generate or preserve Alertmanager routing configuration
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        SECRET="{{ platform_alertmanager_config_secret_name }}"
        ROTATE="{{ 'true' if platform_app_secret_rotate else 'false' }}"
        REQUIRE_ROUTE="{{ 'true' if platform_alertmanager_require_route else 'false' }}"
        WORKDIR="$(mktemp -d /tmp/platform-alertmanager.XXXXXX)"
        chmod 0700 "$WORKDIR"
        trap 'rm -rf "$WORKDIR"' EXIT

        "$K" --kubeconfig "$C" create namespace monitoring --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -
        if [ "${ROTATE}" != "true" ] && "$K" --kubeconfig "$C" -n monitoring \
          get "secret/${SECRET}" -o 'go-template={{ "{{" }} index .data "alertmanager.yaml" {{ "}}" }}' \
          2>/dev/null | grep -q .; then
          echo "alertmanager_config_secret=${SECRET} state=present"
          exit 0
        fi

        if [ -n "${ALERTMANAGER_CONFIG:-}" ]; then
          printf '%s\n' "${ALERTMANAGER_CONFIG}" >"$WORKDIR/alertmanager.yaml"
        elif [ -n "${ALERTMANAGER_WEBHOOK_URL:-}" ]; then
          case "${ALERTMANAGER_WEBHOOK_URL}" in
            https://*) ;;
            http://*)
              if [ "${REQUIRE_ROUTE}" = "true" ]; then
                echo "ALERTMANAGER_WEBHOOK_URL must use HTTPS in production" >&2
                exit 1
              fi
              ;;
            *)
              echo "ALERTMANAGER_WEBHOOK_URL must be an HTTP or HTTPS URL" >&2
              exit 1
              ;;
          esac
          ALERTMANAGER_WEBHOOK_URL="${ALERTMANAGER_WEBHOOK_URL}" python3 - >"$WORKDIR/alertmanager.yaml" <<'PY'
        import json
        import os
        print(json.dumps({
            "global": {"resolve_timeout": "5m"},
            "route": {
                "receiver": "platform-webhook",
                "group_by": ["alertname", "namespace", "severity"],
                "group_wait": "15s",
                "group_interval": "5m",
                "repeat_interval": "4h",
            },
            "receivers": [{
                "name": "platform-webhook",
                "webhook_configs": [{
                    "url": os.environ["ALERTMANAGER_WEBHOOK_URL"],
                    "send_resolved": True,
                }],
            }],
        }, separators=(",", ":")))
        PY
        elif [ "${REQUIRE_ROUTE}" = "true" ]; then
          echo "alertmanager_config_secret=${SECRET} state=missing reason=set-ALERTMANAGER_WEBHOOK_URL-or-ALERTMANAGER_CONFIG"
          exit 0
        else
          cat >"$WORKDIR/alertmanager.yaml" <<'EOF'
        {"global":{"resolve_timeout":"5m"},"route":{"receiver":"null"},"receivers":[{"name":"null"}]}
        EOF
        fi

        test -s "$WORKDIR/alertmanager.yaml"
        "$K" --kubeconfig "$C" -n monitoring create secret generic "${SECRET}" \
          --from-file=alertmanager.yaml="$WORKDIR/alertmanager.yaml" \
          --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -
        echo "alertmanager_config_secret=${SECRET} state=generated"
      args:
        executable: /bin/bash
      environment:
        ALERTMANAGER_CONFIG: "{{ lookup('ansible.builtin.env', 'ALERTMANAGER_CONFIG') }}"
        ALERTMANAGER_WEBHOOK_URL: "{{ lookup('ansible.builtin.env', 'ALERTMANAGER_WEBHOOK_URL') }}"
      register: platform_alertmanager_secret_result
      changed_when: "'state=generated' in platform_alertmanager_secret_result.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      no_log: true

    - name: Check Alertmanager routing configuration state
      ansible.builtin.shell: |
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        if "$K" --kubeconfig "$C" -n monitoring get "secret/{{ platform_alertmanager_config_secret_name }}" \
          -o 'go-template={{ "{{" }} index .data "alertmanager.yaml" {{ "}}" }}' 2>/dev/null | grep -q .; then
          echo present
        else
          echo missing
        fi
      args:
        executable: /bin/bash
      register: platform_alertmanager_secret_state
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Require production Loki authentication and Alertmanager routing secrets
      ansible.builtin.fail:
        msg: |
          Production observability secrets are incomplete.

          Loki gateway credentials:
          - logging/{{ platform_loki_gateway_secret_name }} and monitoring/{{ platform_loki_client_secret_name }}: {{ platform_loki_gateway_secret_state.stdout | trim | default('unknown', true) }}

          Alertmanager routing:
          - monitoring/{{ platform_alertmanager_config_secret_name }}: {{ platform_alertmanager_secret_state.stdout | trim | default('unknown', true) }}

          Set ALERTMANAGER_WEBHOOK_URL to an HTTPS receiver, or provide a full
          ALERTMANAGER_CONFIG, then rerun `make platform-app-secrets`.
      when: >-
        (platform_loki_gateway_secret_state.stdout | trim) != 'present' or
        (
          platform_alertmanager_require_route | bool and
          (platform_alertmanager_secret_state.stdout | trim) != 'present'
        )
      run_once: true

    - name: Generate or preserve Velero cloud credentials secret
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        SECRET="{{ platform_velero_credentials_secret_name }}"
        ROTATE="{{ 'true' if platform_app_secret_rotate else 'false' }}"

        "$K" --kubeconfig "$C" create namespace velero --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        secret_exists=false
        if "$K" --kubeconfig "$C" -n velero get "secret/${SECRET}" >/dev/null 2>&1; then
          secret_exists=true
        fi

        credentials=""
        credentials_source=""
        if [ -n "${VELERO_CLOUD_CREDENTIALS:-}" ]; then
          credentials="${VELERO_CLOUD_CREDENTIALS}"
          credentials_source="explicit-cloud"
        elif [ -n "${AWS_ACCESS_KEY_ID:-}" ] && [ -n "${AWS_SECRET_ACCESS_KEY:-}" ]; then
          credentials="$(printf '[default]\naws_access_key_id=%s\naws_secret_access_key=%s\n' "${AWS_ACCESS_KEY_ID}" "${AWS_SECRET_ACCESS_KEY}")"
          credentials_source="explicit-aws"
        elif [ "${PLATFORM_PRODUCTION_STRICT}" != "true" ]; then
          minio_access_key="$("$K" --kubeconfig "$C" -n object-storage get "secret/{{ platform_minio_root_secret_name }}" \
            -o "go-template={{ '{{' }} index .data \"{{ platform_minio_root_user_secret_key }}\" {{ '}}' }}" 2>/dev/null | base64 -d || true)"
          minio_secret_key="$("$K" --kubeconfig "$C" -n object-storage get "secret/{{ platform_minio_root_secret_name }}" \
            -o "go-template={{ '{{' }} index .data \"{{ platform_minio_root_password_secret_key }}\" {{ '}}' }}" 2>/dev/null | base64 -d || true)"
          if [ -n "${minio_access_key}" ] && [ -n "${minio_secret_key}" ]; then
            credentials="$(printf '[default]\naws_access_key_id=%s\naws_secret_access_key=%s\n' "${minio_access_key}" "${minio_secret_key}")"
            credentials_source="minio-root"
          fi
        fi

        if [ "${secret_exists}" = "true" ] && [ "${ROTATE}" != "true" ]; then
          if [ "${credentials_source}" != "minio-root" ]; then
            echo "velero_credentials_secret=${SECRET} state=present source=${credentials_source:-existing}"
            exit 0
          fi

          current_credentials="$("$K" --kubeconfig "$C" -n velero get "secret/${SECRET}" \
            -o jsonpath='{.data.cloud}' 2>/dev/null | base64 -d || true)"
          if [ "${current_credentials}" = "${credentials}" ]; then
            echo "velero_credentials_secret=${SECRET} state=present source=minio-root"
            exit 0
          fi
          result_state="reconciled"
        elif [ "${secret_exists}" = "true" ]; then
          result_state="rotated"
        else
          result_state="generated"
        fi

        if [ -z "${credentials}" ]; then
          echo "velero_credentials_secret=${SECRET} state=missing reason=set-explicit-cloud-credentials-or-create-minio-root-secret"
          exit 0
        fi

        "$K" --kubeconfig "$C" -n velero create secret generic "${SECRET}" \
          --from-literal=cloud="${credentials}" \
          --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        echo "velero_credentials_secret=${SECRET} state=${result_state} source=${credentials_source}"
      args:
        executable: /bin/bash
      environment:
        VELERO_CLOUD_CREDENTIALS: "{{ lookup('ansible.builtin.env', 'VELERO_CLOUD_CREDENTIALS') }}"
        AWS_ACCESS_KEY_ID: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
        AWS_SECRET_ACCESS_KEY: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"
        PLATFORM_PRODUCTION_STRICT: "{{ 'true' if platform_production_strict else 'false' }}"
      register: platform_velero_secret_result
      changed_when: >-
        'state=generated' in platform_velero_secret_result.stdout or
        'state=reconciled' in platform_velero_secret_result.stdout or
        'state=rotated' in platform_velero_secret_result.stdout
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      no_log: true

