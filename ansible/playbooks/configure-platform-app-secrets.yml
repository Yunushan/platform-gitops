        SECRET="{{ platform_harbor_database_secret_name }}"
        if "$K" --kubeconfig "$C" -n harbor get "secret/${SECRET}" \
          -o 'go-template={{ "{{" }} index .data "username" {{ "}}" }}{{ "{{" }} index .data "password" {{ "}}" }}' 2>/dev/null | grep -q . && \
          "$K" --kubeconfig "$C" -n platform-databases get "secret/${SECRET}" \
          -o 'go-template={{ "{{" }} index .data "username" {{ "}}" }}{{ "{{" }} index .data "password" {{ "}}" }}' 2>/dev/null | grep -q .; then
          echo present
        else
