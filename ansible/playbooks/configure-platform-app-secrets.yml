        HARBOR_REDIS_ADDR: "{{ lookup('ansible.builtin.env', 'HARBOR_REDIS_ADDR') }}"
        HARBOR_REDIS_HOST: "{{ lookup('ansible.builtin.env', 'HARBOR_REDIS_HOST') }}"
      register: platform_harbor_redis_secret_result
      changed_when: "'state=generated' in platform_harbor_redis_secret_result.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      no_log: true

