          platform_app_secret_require_object_storage | bool and
          (
            (platform_loki_secret_state.stdout | trim) != 'present' or
            (platform_velero_secret_state.stdout | trim) != 'present' or
            (platform_cnpg_secret_state.stdout | trim) != 'present' or
            (platform_longhorn_backup_secret_state.stdout | trim) != 'present'
          )
        ) or
        (
          platform_app_secret_require_cnpg_object_storage | bool and
          (platform_cnpg_secret_state.stdout | trim) != 'present'
        ) or
        (
          platform_app_secret_require_longhorn_backup | bool and
          (platform_longhorn_backup_secret_state.stdout | trim) != 'present'
