---
- name: Configure generated private secrets for platform applications
  hosts: rke2_servers
  become: true
  gather_facts: false
  vars:
    rke2_first_server: "{{ groups['rke2_servers'][0] }}"
    platform_harbor_admin_secret_name: "{{ lookup('ansible.builtin.env', 'HARBOR_ADMIN_SECRET_NAME') | default('harbor-admin', true) }}"
    platform_harbor_secret_key_secret_name: "{{ lookup('ansible.builtin.env', 'HARBOR_SECRET_KEY_SECRET_NAME') | default('harbor-secret-key', true) }}"
    platform_woodpecker_oauth_secret_name: "{{ lookup('ansible.builtin.env', 'WOODPECKER_FORGEJO_OAUTH_SECRET_NAME') | default('woodpecker-forgejo-oauth', true) }}"
    platform_woodpecker_oauth_app_name: "{{ lookup('ansible.builtin.env', 'WOODPECKER_FORGEJO_OAUTH_APP_NAME') | default('Woodpecker', true) }}"
    platform_app_secret_rotate: "{{ lookup('ansible.builtin.env', 'PLATFORM_APP_SECRET_ROTATE') | default(false, true) | bool }}"
  vars_files:
    - ../vars/platform-hostnames.yml
  tasks:
    - name: Generate or preserve Harbor bootstrap secrets
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        ADMIN_SECRET="{{ platform_harbor_admin_secret_name }}"
        SECRET_KEY_SECRET="{{ platform_harbor_secret_key_secret_name }}"
        ROTATE="{{ 'true' if platform_app_secret_rotate else 'false' }}"

        random_b64() {
          if command -v openssl >/dev/null 2>&1; then
            openssl rand -base64 30
          else
            python3 - <<'PY'
        import secrets
        print(secrets.token_urlsafe(32))
        PY
          fi
        }

        random_hex() {
          if command -v openssl >/dev/null 2>&1; then
            openssl rand -hex 16
          else
            python3 - <<'PY'
        import secrets
        print(secrets.token_hex(16))
        PY
          fi
        }

        "$K" --kubeconfig "$C" create namespace harbor --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        if [ "${ROTATE}" = "true" ] || ! "$K" --kubeconfig "$C" -n harbor get "secret/${ADMIN_SECRET}" >/dev/null 2>&1; then
          password="$(random_b64)"
          "$K" --kubeconfig "$C" -n harbor create secret generic "${ADMIN_SECRET}" \
            --from-literal=HARBOR_ADMIN_PASSWORD="${password}" \
            --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -
          admin_state=generated
        else
          admin_state=present
        fi

        if [ "${ROTATE}" = "true" ] || ! "$K" --kubeconfig "$C" -n harbor get "secret/${SECRET_KEY_SECRET}" >/dev/null 2>&1; then
          secret_key="$(random_hex)"
          "$K" --kubeconfig "$C" -n harbor create secret generic "${SECRET_KEY_SECRET}" \
            --from-literal=secretKey="${secret_key}" \
            --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -
          key_state=generated
        else
          key_state=present
        fi

        echo "harbor_admin_secret=${ADMIN_SECRET} state=${admin_state}"
        echo "harbor_secret_key_secret=${SECRET_KEY_SECRET} state=${key_state}"
      args:
        executable: /bin/bash
      register: platform_harbor_secret_result
      changed_when: "'generated' in platform_harbor_secret_result.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Configure Forgejo OAuth application for Woodpecker
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        SECRET="{{ platform_woodpecker_oauth_secret_name }}"
        APP_NAME="{{ platform_woodpecker_oauth_app_name }}"
        REDIRECT_URI="https://{{ platform_woodpecker_host_effective }}/authorize"
        ROTATE="{{ 'true' if platform_app_secret_rotate else 'false' }}"

        "$K" --kubeconfig "$C" create namespace woodpecker --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -
        if [ "${ROTATE}" != "true" ] && "$K" --kubeconfig "$C" -n woodpecker get "secret/${SECRET}" >/dev/null 2>&1; then
          echo "woodpecker_oauth_secret=${SECRET} state=present"
          exit 0
        fi

        "$K" --kubeconfig "$C" -n forgejo get secret forgejo-admin >/dev/null
        forgejo_user="$("$K" --kubeconfig "$C" -n forgejo get secret forgejo-admin -o jsonpath='{.data.username}' | base64 -d)"
        forgejo_password="$("$K" --kubeconfig "$C" -n forgejo get secret forgejo-admin -o jsonpath='{.data.password}' | base64 -d)"
        forgejo_svc_ip="$("$K" --kubeconfig "$C" -n forgejo get service forgejo-http -o jsonpath='{.spec.clusterIP}')"
        test -n "${forgejo_svc_ip}"
        test "${forgejo_svc_ip}" != "None"
        forgejo_base="http://${forgejo_svc_ip}:3000"

        body_file="$(mktemp)"
        response_file="$(mktemp)"
        error_file="$(mktemp)"
        trap 'rm -f "${body_file}" "${response_file}" "${error_file}"' EXIT

        python3 - "${APP_NAME}" "${REDIRECT_URI}" >"${body_file}" <<'PY'
        import json
        import sys
        print(json.dumps({
            "name": sys.argv[1],
            "redirect_uris": [sys.argv[2]],
            "confidential_client": True,
        }))
        PY

        http_code="$(curl --silent --show-error --output "${response_file}" \
          --write-out '%{http_code}' \
          --user "${forgejo_user}:${forgejo_password}" \
          --header 'Content-Type: application/json' \
          --connect-timeout 10 \
          --max-time 30 \
          --data @"${body_file}" \
          "${forgejo_base}/api/v1/user/applications/oauth2" 2>"${error_file}" || true)"

        if [ "${http_code}" != "200" ] && [ "${http_code}" != "201" ]; then
          echo "Failed to create Forgejo OAuth app for Woodpecker. http_code=${http_code}" >&2
          cat "${error_file}" >&2 || true
          cat "${response_file}" >&2 || true
          echo "If Forgejo reports a duplicate app, either keep the existing woodpecker secret or rerun with WOODPECKER_FORGEJO_OAUTH_APP_NAME set to a new app name." >&2
          exit 1
        fi

        read -r client_id client_secret < <(python3 - "${response_file}" <<'PY'
        import json
        import sys
        data = json.load(open(sys.argv[1], encoding="utf-8"))
        client_id = data.get("client_id") or data.get("clientID") or data.get("clientId") or ""
        oauth_private = data.get("client_secret") or data.get("clientSecret") or ""
        if not client_id or not oauth_private:
            raise SystemExit(f"OAuth response did not include client_id/client_secret keys: {sorted(data)}")
        print(client_id, oauth_private)
        PY
        )

        "$K" --kubeconfig "$C" -n woodpecker create secret generic "${SECRET}" \
          --from-literal=WOODPECKER_FORGEJO_CLIENT="${client_id}" \
          --from-literal=WOODPECKER_FORGEJO_SECRET="${client_secret}" \
          --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        echo "woodpecker_oauth_secret=${SECRET} state=generated redirect_uri=${REDIRECT_URI}"
      args:
        executable: /bin/bash
      register: platform_woodpecker_oauth_result
      changed_when: "'state=generated' in platform_woodpecker_oauth_result.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Show platform app secret automation summary
      ansible.builtin.debug:
        msg: |
          Platform app bootstrap secrets are present.

          Harbor:
          - namespace: harbor
          - admin password secret: {{ platform_harbor_admin_secret_name }}
          - secret key secret: {{ platform_harbor_secret_key_secret_name }}
          - get admin password:
            kubectl -n harbor get secret {{ platform_harbor_admin_secret_name }} -o jsonpath='{.data.HARBOR_ADMIN_PASSWORD}' | base64 -d; echo

          Woodpecker:
          - namespace: woodpecker
          - Forgejo OAuth app: {{ platform_woodpecker_oauth_app_name }}
          - OAuth redirect URI: https://{{ platform_woodpecker_host_effective }}/authorize
          - Kubernetes OAuth secret: {{ platform_woodpecker_oauth_secret_name }}

          Set PLATFORM_APP_SECRET_ROTATE=true only when you intentionally want
          to rotate generated secrets and update dependent apps.
      run_once: true
