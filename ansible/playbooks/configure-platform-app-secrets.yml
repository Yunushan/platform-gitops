    - name: Generate Harbor core Redis URL override secret
      tags:
        - harbor
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        SECRET="{{ platform_harbor_redis_url_secret_name }}"

        password="${HARBOR_REDIS_PASSWORD:-}"
        username="${HARBOR_REDIS_USERNAME:-}"
        redis_addr="${HARBOR_REDIS_ADDR:-}"
        redis_host="${HARBOR_REDIS_HOST:-{{ platform_valkey_primary_host }}}"
        redis_port="${HARBOR_REDIS_PORT:-{{ platform_valkey_port }}}"
        redis_tls="${HARBOR_REDIS_TLS:-true}"
        if [ -z "${username}" ] && [ -z "${HARBOR_REDIS_ADDR:-}" ] && [ -z "${HARBOR_REDIS_HOST:-}" ]; then
          username="default"
        fi
        if [ -z "${password}" ]; then
          password="$("$K" --kubeconfig "$C" -n platform-cache get "secret/{{ platform_valkey_auth_secret_name }}" \
            -o "go-template={{ '{{' }} index .data \"{{ platform_valkey_password_key }}\" {{ '}}' }}" 2>/dev/null | base64 -d || true)"
        fi
        test -n "${password}"

        if [ -n "${redis_addr}" ]; then
          redis_endpoint="${redis_addr}"
        else
          redis_endpoint="${redis_host}:${redis_port}"
        fi

        redis_url_core="$(python3 - "${username}" "${password}" "${redis_endpoint}" "${redis_tls}" <<'PY'
        import sys
        from urllib.parse import quote

        username, password, endpoint, tls = sys.argv[1:]
        scheme = "rediss" if tls.strip().lower() in {"1", "true", "yes", "on"} else "redis"
        auth = f"{quote(username, safe='')}:{quote(password, safe='')}@" if username else f":{quote(password, safe='')}@"
        print(f"{scheme}://{auth}{endpoint}/0?idle_timeout_seconds=30")
        PY
        )"

        redis_url_jobservice="$(python3 - "${username}" "${password}" "${redis_endpoint}" "${redis_tls}" <<'PY'
        import sys
        from urllib.parse import quote

        username, password, endpoint, tls = sys.argv[1:]
        scheme = "rediss" if tls.strip().lower() in {"1", "true", "yes", "on"} else "redis"
        auth = f"{quote(username, safe='')}:{quote(password, safe='')}@" if username else f":{quote(password, safe='')}@"
        print(f"{scheme}://{auth}{endpoint}/1")
        PY
        )"

        current_core="$($K --kubeconfig "$C" -n harbor get "secret/${SECRET}" \
          -o "go-template={{ '{{' }} index .data \"REDIS_URL_CORE\" {{ '}}' }}" 2>/dev/null | base64 -d || true)"
        current_jobservice="$($K --kubeconfig "$C" -n harbor get "secret/${SECRET}" \
          -o "go-template={{ '{{' }} index .data \"REDIS_URL_JOBSERVICE\" {{ '}}' }}" 2>/dev/null | base64 -d || true)"
        if [ "${current_core}" = "${redis_url_core}" ] && [ "${current_jobservice}" = "${redis_url_jobservice}" ]; then
          echo "harbor_redis_url_secret=${SECRET} state=present"
          exit 0
        fi

        state=generated
        if [ -n "${current_core}" ] || [ -n "${current_jobservice}" ]; then
          state=reconciled
        fi

        "$K" --kubeconfig "$C" -n harbor create secret generic "${SECRET}" \
          --from-literal=REDIS_URL_CORE="${redis_url_core}" \
          --from-literal=REDIS_URL_JOBSERVICE="${redis_url_jobservice}" \
          --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -
        echo "harbor_redis_url_secret=${SECRET} state=${state}"
      args:
        executable: /bin/bash
      environment:
        HARBOR_REDIS_PASSWORD: "{{ lookup('ansible.builtin.env', 'HARBOR_REDIS_PASSWORD') }}"
        HARBOR_REDIS_USERNAME: "{{ lookup('ansible.builtin.env', 'HARBOR_REDIS_USERNAME') }}"
        HARBOR_REDIS_ADDR: "{{ lookup('ansible.builtin.env', 'HARBOR_REDIS_ADDR') }}"
        HARBOR_REDIS_HOST: "{{ lookup('ansible.builtin.env', 'HARBOR_REDIS_HOST') }}"
        HARBOR_REDIS_PORT: "{{ lookup('ansible.builtin.env', 'HARBOR_REDIS_PORT') }}"
        HARBOR_REDIS_TLS: "{{ lookup('ansible.builtin.env', 'HARBOR_REDIS_TLS') }}"
      register: platform_harbor_redis_url_secret_result
      changed_when: >-
        'state=generated' in platform_harbor_redis_url_secret_result.stdout or
        'state=reconciled' in platform_harbor_redis_url_secret_result.stdout
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      no_log: true

    - name: Check Harbor registry S3 credentials secret state
