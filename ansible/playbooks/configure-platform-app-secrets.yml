---
- name: Configure generated private secrets for platform applications
  hosts: rke2_servers
  become: true
  gather_facts: false
  vars:
    rke2_first_server: "{{ groups['rke2_servers'][0] }}"
    platform_domain_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_DOMAIN') }}"
    rke2_api_dns_from_env: "{{ lookup('ansible.builtin.env', 'RKE2_API_DNS') }}"
    rke2_api_dns_effective: "{{ rke2_api_dns | default(rke2_api_dns_from_env, true) | default('', true) }}"
    platform_domain_effective: "{{ platform_domain | default(platform_domain_from_env, true) | default(rke2_platform_domain | default((rke2_api_dns_effective | regex_replace('^api[.]', '')), true), true) }}"
    platform_harbor_admin_secret_name: "{{ lookup('ansible.builtin.env', 'HARBOR_ADMIN_SECRET_NAME') | default('harbor-admin', true) }}"
    platform_harbor_secret_key_secret_name: "{{ lookup('ansible.builtin.env', 'HARBOR_SECRET_KEY_SECRET_NAME') | default('harbor-secret-key', true) }}"
    platform_harbor_database_secret_name: "{{ lookup('ansible.builtin.env', 'HARBOR_DATABASE_SECRET_NAME') | default('harbor-database', true) }}"
    platform_harbor_redis_secret_name: "{{ lookup('ansible.builtin.env', 'HARBOR_REDIS_SECRET_NAME') | default('harbor-redis', true) }}"
    platform_harbor_redis_url_secret_name: "{{ lookup('ansible.builtin.env', 'HARBOR_REDIS_URL_SECRET_NAME') | default('harbor-redis-url', true) }}"
    platform_harbor_s3_secret_name: "{{ lookup('ansible.builtin.env', 'HARBOR_S3_SECRET_NAME') | default('harbor-registry-s3', true) }}"
    platform_valkey_auth_secret_name: "{{ lookup('ansible.builtin.env', 'PLATFORM_VALKEY_AUTH_SECRET_NAME') | default('platform-valkey-auth', true) }}"
    platform_valkey_password_key: "{{ lookup('ansible.builtin.env', 'PLATFORM_VALKEY_PASSWORD_KEY') | default('valkey-password', true) }}"
    platform_valkey_primary_host: "{{ lookup('ansible.builtin.env', 'PLATFORM_VALKEY_PRIMARY_HOST') | default('platform-valkey-primary.platform-cache.svc.cluster.local', true) }}"
    platform_valkey_port: "{{ lookup('ansible.builtin.env', 'PLATFORM_VALKEY_PORT') | default('6379', true) }}"
    platform_woodpecker_oauth_secret_name: "{{ lookup('ansible.builtin.env', 'WOODPECKER_FORGEJO_OAUTH_SECRET_NAME') | default('woodpecker-forgejo-oauth', true) }}"
    platform_woodpecker_oauth_app_name: "{{ lookup('ansible.builtin.env', 'WOODPECKER_FORGEJO_OAUTH_APP_NAME') | default('Woodpecker', true) }}"
    platform_woodpecker_agent_secret_name: "{{ lookup('ansible.builtin.env', 'WOODPECKER_AGENT_SECRET_NAME') | default('woodpecker-agent-secret', true) }}"
    platform_woodpecker_database_secret_name: "{{ lookup('ansible.builtin.env', 'WOODPECKER_DATABASE_SECRET_NAME') | default('woodpecker-database', true) }}"
    platform_keycloak_admin_secret_name: "{{ lookup('ansible.builtin.env', 'KEYCLOAK_ADMIN_SECRET_NAME') | default('keycloak-admin', true) }}"
    platform_keycloak_database_secret_name: "{{ lookup('ansible.builtin.env', 'KEYCLOAK_DATABASE_SECRET_NAME') | default('keycloak-database', true) }}"
    platform_sso_keycloak_secret_name: "{{ lookup('ansible.builtin.env', 'PLATFORM_SSO_KEYCLOAK_SECRET_NAME') | default('platform-sso-clients', true) }}"
    platform_sso_argocd_secret_name: "{{ lookup('ansible.builtin.env', 'PLATFORM_SSO_ARGOCD_SECRET_NAME') | default('platform-sso-argocd', true) }}"
    platform_sso_grafana_secret_name: "{{ lookup('ansible.builtin.env', 'PLATFORM_SSO_GRAFANA_SECRET_NAME') | default('platform-sso-grafana', true) }}"
    platform_sso_prometheus_secret_name: "{{ lookup('ansible.builtin.env', 'PLATFORM_SSO_PROMETHEUS_SECRET_NAME') | default('platform-sso-prometheus', true) }}"
    platform_forgejo_database_secret_name: "{{ lookup('ansible.builtin.env', 'FORGEJO_DATABASE_SECRET_NAME') | default('forgejo-database', true) }}"
    platform_forgejo_redis_secret_name: "{{ lookup('ansible.builtin.env', 'FORGEJO_REDIS_SECRET_NAME') | default('forgejo-redis', true) }}"
    platform_forgejo_object_storage_secret_name: "{{ lookup('ansible.builtin.env', 'FORGEJO_S3_SECRET_NAME') | default('forgejo-object-storage', true) }}"
    platform_grafana_admin_secret_name: "{{ lookup('ansible.builtin.env', 'GRAFANA_ADMIN_SECRET_NAME') | default('grafana-admin', true) }}"
    platform_grafana_database_secret_name: "{{ lookup('ansible.builtin.env', 'GRAFANA_DATABASE_SECRET_NAME') | default('grafana-database', true) }}"
    platform_loki_object_storage_secret_name: "{{ lookup('ansible.builtin.env', 'LOKI_OBJECT_STORAGE_SECRET_NAME') | default('loki-object-storage', true) }}"
    platform_loki_gateway_secret_name: "{{ lookup('ansible.builtin.env', 'LOKI_GATEWAY_SECRET_NAME') | default('loki-gateway-basic-auth', true) }}"
    platform_loki_client_secret_name: "{{ lookup('ansible.builtin.env', 'LOKI_CLIENT_SECRET_NAME') | default('platform-loki-client', true) }}"
    platform_alertmanager_config_secret_name: "{{ lookup('ansible.builtin.env', 'ALERTMANAGER_CONFIG_SECRET_NAME') | default('alertmanager-platform-config', true) }}"
    platform_velero_credentials_secret_name: "{{ lookup('ansible.builtin.env', 'VELERO_CREDENTIALS_SECRET_NAME') | default('velero-credentials', true) }}"
    platform_cnpg_object_store_secret_name: "{{ lookup('ansible.builtin.env', 'CNPG_OBJECT_STORE_SECRET_NAME') | default('cnpg-object-store', true) }}"
    platform_longhorn_backup_secret_name: "{{ lookup('ansible.builtin.env', 'LONGHORN_BACKUP_CREDENTIAL_SECRET_NAME') | default('longhorn-backup-target', true) }}"
    platform_longhorn_encryption_secret_name: "{{ lookup('ansible.builtin.env', 'LONGHORN_ENCRYPTION_SECRET_NAME') | default('longhorn-crypto', true) }}"
    platform_longhorn_encryption_recovery_file: "{{ lookup('ansible.builtin.env', 'LONGHORN_ENCRYPTION_RECOVERY_FILE') | default(playbook_dir ~ '/../../private/longhorn-encryption.key', true) }}"
    platform_longhorn_encryption_stage_file: "/tmp/platform-longhorn-encryption-{{ platform_longhorn_encryption_secret_name }}.key"
    platform_minio_root_secret_name: "{{ lookup('ansible.builtin.env', 'MINIO_ROOT_SECRET_NAME') | default('minio-root', true) }}"
    platform_minio_root_user_secret_key: "{{ lookup('ansible.builtin.env', 'MINIO_ROOT_USER_SECRET_KEY') | default('root-user', true) }}"
    platform_minio_root_password_secret_key: "{{ lookup('ansible.builtin.env', 'MINIO_ROOT_PASSWORD_SECRET_KEY') | default('root-password', true) }}"
    platform_forgejo_admin_password_repair: "{{ lookup('ansible.builtin.env', 'PLATFORM_FORGEJO_ADMIN_PASSWORD_REPAIR') | default(true, true) | bool }}"
    platform_app_secret_rotate: "{{ lookup('ansible.builtin.env', 'PLATFORM_APP_SECRET_ROTATE') | default(false, true) | bool }}"
    platform_production_strict: "{{ lookup('ansible.builtin.env', 'PLATFORM_PRODUCTION_STRICT') | default(true, true) | bool }}"
    platform_sso_enabled: "{{ lookup('ansible.builtin.env', 'PLATFORM_SSO_ENABLED') | default(platform_production_strict, true) | bool }}"
    platform_app_secret_require_object_storage: "{{ lookup('ansible.builtin.env', 'PLATFORM_APP_SECRET_REQUIRE_OBJECT_STORAGE') | default(platform_production_strict, true) | bool }}"
    platform_app_secret_require_cnpg_object_storage: "{{ lookup('ansible.builtin.env', 'PLATFORM_APP_SECRET_REQUIRE_CNPG_OBJECT_STORAGE') | default(platform_production_strict, true) | bool }}"
    platform_app_secret_require_longhorn_backup: "{{ lookup('ansible.builtin.env', 'PLATFORM_APP_SECRET_REQUIRE_LONGHORN_BACKUP') | default(platform_production_strict, true) | bool }}"
    platform_app_secret_require_longhorn_encryption: "{{ lookup('ansible.builtin.env', 'PLATFORM_APP_SECRET_REQUIRE_LONGHORN_ENCRYPTION') | default(platform_production_strict, true) | bool }}"
    platform_app_secret_require_woodpecker_database: "{{ lookup('ansible.builtin.env', 'PLATFORM_APP_SECRET_REQUIRE_WOODPECKER_DATABASE') | default(platform_production_strict, true) | bool }}"
    platform_app_secret_require_keycloak_database: "{{ lookup('ansible.builtin.env', 'PLATFORM_APP_SECRET_REQUIRE_KEYCLOAK_DATABASE') | default(platform_production_strict, true) | bool }}"
    platform_app_secret_require_harbor_database: "{{ lookup('ansible.builtin.env', 'PLATFORM_APP_SECRET_REQUIRE_HARBOR_DATABASE') | default(platform_production_strict, true) | bool }}"
    platform_app_secret_require_harbor_redis: "{{ lookup('ansible.builtin.env', 'PLATFORM_APP_SECRET_REQUIRE_HARBOR_REDIS') | default(platform_production_strict, true) | bool }}"
    platform_app_secret_require_harbor_registry_storage: "{{ lookup('ansible.builtin.env', 'PLATFORM_APP_SECRET_REQUIRE_HARBOR_REGISTRY_STORAGE') | default(platform_production_strict, true) | bool }}"
    platform_harbor_redis_tls_from_env: "{{ lookup('ansible.builtin.env', 'HARBOR_REDIS_TLS') }}"
    platform_harbor_redis_tls_effective: "{{ platform_harbor_redis_tls_from_env | default('true', true) | bool }}"
    platform_app_secret_require_forgejo_database: "{{ lookup('ansible.builtin.env', 'PLATFORM_APP_SECRET_REQUIRE_FORGEJO_DATABASE') | default(platform_production_strict, true) | bool }}"
    platform_app_secret_require_forgejo_redis: "{{ lookup('ansible.builtin.env', 'PLATFORM_APP_SECRET_REQUIRE_FORGEJO_REDIS') | default(platform_production_strict, true) | bool }}"
    platform_app_secret_require_forgejo_object_storage: "{{ lookup('ansible.builtin.env', 'PLATFORM_APP_SECRET_REQUIRE_FORGEJO_OBJECT_STORAGE') | default(platform_production_strict, true) | bool }}"
    platform_forgejo_redis_tls_from_env: "{{ lookup('ansible.builtin.env', 'FORGEJO_REDIS_TLS') }}"
    platform_forgejo_redis_tls_effective: "{{ platform_forgejo_redis_tls_from_env | default('true', true) | bool }}"
    platform_forgejo_redis_url_from_env: "{{ lookup('ansible.builtin.env', 'FORGEJO_REDIS_URL') }}"
    platform_app_secret_require_grafana_database: "{{ lookup('ansible.builtin.env', 'PLATFORM_APP_SECRET_REQUIRE_GRAFANA_DATABASE') | default(platform_production_strict, true) | bool }}"
    platform_alertmanager_require_route: "{{ lookup('ansible.builtin.env', 'PLATFORM_ALERTMANAGER_REQUIRE_ROUTE') | default(platform_production_strict, true) | bool }}"
  vars_files:
    - ../vars/platform-hostnames.yml
  tasks:
    - name: Generate or preserve shared platform Valkey auth secret
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        SECRET="{{ platform_valkey_auth_secret_name }}"
        PASSWORD_KEY="{{ platform_valkey_password_key }}"
        ROTATE="{{ 'true' if platform_app_secret_rotate else 'false' }}"

        "$K" --kubeconfig "$C" create namespace platform-cache --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        if [ "${ROTATE}" != "true" ] && "$K" --kubeconfig "$C" -n platform-cache get "secret/${SECRET}" \
          -o "go-template={{ '{{' }} index .data \"{{ platform_valkey_password_key }}\" {{ '}}' }}" 2>/dev/null | grep -q .; then
          echo "platform_valkey_auth_secret=${SECRET} state=present"
          exit 0
        fi

        random_b64() {
          if command -v openssl >/dev/null 2>&1; then
            openssl rand -base64 30
          else
            python3 - <<'PY'
        import secrets
        print(secrets.token_urlsafe(32))
        PY
          fi
        }

        password="${PLATFORM_VALKEY_PASSWORD:-}"
        auto_generate="${PLATFORM_VALKEY_AUTO_GENERATE:-true}"
        if [ -z "${password}" ]; then
          if [ "${auto_generate}" = "true" ]; then
            password="$(random_b64)"
          else
            echo "platform_valkey_auth_secret=${SECRET} state=missing reason=set-PLATFORM_VALKEY_PASSWORD"
            exit 0
          fi
        fi

        "$K" --kubeconfig "$C" -n platform-cache create secret generic "${SECRET}" \
          --from-literal="${PASSWORD_KEY}=${password}" \
          --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        echo "platform_valkey_auth_secret=${SECRET} state=generated"
      args:
        executable: /bin/bash
      environment:
        PLATFORM_VALKEY_PASSWORD: "{{ lookup('ansible.builtin.env', 'PLATFORM_VALKEY_PASSWORD') }}"
        PLATFORM_VALKEY_AUTO_GENERATE: "{{ lookup('ansible.builtin.env', 'PLATFORM_VALKEY_AUTO_GENERATE') }}"
      register: platform_valkey_auth_secret_result
      changed_when: "'state=generated' in platform_valkey_auth_secret_result.stdout"
      no_log: true
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Reject plaintext Harbor cache transport in production mode
      tags:
        - harbor
      ansible.builtin.fail:
        msg: |
          HARBOR_REDIS_TLS=false is not allowed when PLATFORM_PRODUCTION_STRICT=true.
          Managed platform Valkey exposes TLS only; use HARBOR_REDIS_TLS=true or
          disable production-strict mode explicitly for a non-production deployment.
      when:
        - platform_production_strict | bool
        - not (platform_harbor_redis_tls_effective | bool)

    - name: Reject plaintext Forgejo cache transport in production mode
      tags:
        - forgejo
      ansible.builtin.fail:
        msg: |
          A plaintext Forgejo Redis/Valkey transport is not allowed when
          PLATFORM_PRODUCTION_STRICT=true. Use FORGEJO_REDIS_TLS=true and a
          rediss:// FORGEJO_REDIS_URL, or disable production-strict mode
          explicitly for a non-production deployment.
      when:
        - platform_production_strict | bool
        - >-
          (not (platform_forgejo_redis_tls_effective | bool)) or
          ((platform_forgejo_redis_url_from_env | trim | lower) is match('^redis://'))

    - name: Generate or preserve Longhorn volume encryption key
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        SECRET="{{ platform_longhorn_encryption_secret_name }}"
        AUTO_GENERATE="${LONGHORN_ENCRYPTION_AUTO_GENERATE:-true}"
        STAGE={{ platform_longhorn_encryption_stage_file | quote }}
        umask 077
        rm -f "${STAGE}"

        "$K" --kubeconfig "$C" create namespace longhorn-system --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        if "$K" --kubeconfig "$C" -n longhorn-system get "secret/${SECRET}" \
          -o 'go-template={{ "{{" }} index .data "CRYPTO_KEY_VALUE" {{ "}}" }}' 2>/dev/null | grep -q .; then
          "$K" --kubeconfig "$C" -n longhorn-system get "secret/${SECRET}" \
            -o 'go-template={{ "{{" }} index .data "CRYPTO_KEY_VALUE" {{ "}}" }}' | base64 -d >"${STAGE}"
          test -s "${STAGE}"
          echo "longhorn_encryption_secret=${SECRET} state=present recovery_stage=${STAGE}"
          exit 0
        fi

        encryption_key="${LONGHORN_ENCRYPTION_KEY:-}"
        if [ -z "${encryption_key}" ] && [ "${AUTO_GENERATE}" = "true" ]; then
          if command -v openssl >/dev/null 2>&1; then
            encryption_key="$(openssl rand -base64 48)"
          else
            encryption_key="$(python3 - <<'PY'
        import secrets
        print(secrets.token_urlsafe(48))
        PY
        )"
          fi
        fi

        if [ -z "${encryption_key}" ]; then
          echo "longhorn_encryption_secret=${SECRET} state=missing reason=set-LONGHORN_ENCRYPTION_KEY"
          exit 0
        fi

        printf '%s' "${encryption_key}" >"${STAGE}"
        test -s "${STAGE}"

        "$K" --kubeconfig "$C" -n longhorn-system create secret generic "${SECRET}" \
          --from-literal=CRYPTO_KEY_VALUE="${encryption_key}" \
          --from-literal=CRYPTO_KEY_PROVIDER=secret \
          --from-literal=CRYPTO_KEY_CIPHER=aes-xts-plain64 \
          --from-literal=CRYPTO_KEY_HASH=sha256 \
          --from-literal=CRYPTO_KEY_SIZE=256 \
          --from-literal=CRYPTO_PBKDF=argon2i \
          --from-literal=CRYPTO_PBKDF_FORCE_ITERATIONS=200000 \
          --from-literal=CRYPTO_PBKDF_MEMORY=0 \
          --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        echo "longhorn_encryption_secret=${SECRET} state=generated recovery_stage=${STAGE}"
      args:
        executable: /bin/bash
      environment:
        LONGHORN_ENCRYPTION_KEY: "{{ lookup('ansible.builtin.env', 'LONGHORN_ENCRYPTION_KEY') }}"
        LONGHORN_ENCRYPTION_AUTO_GENERATE: "{{ lookup('ansible.builtin.env', 'LONGHORN_ENCRYPTION_AUTO_GENERATE') }}"
      register: platform_longhorn_encryption_secret_result
      changed_when: "'state=generated' in platform_longhorn_encryption_secret_result.stdout"
      failed_when: >-
        platform_longhorn_encryption_secret_result.rc != 0 or
        (platform_app_secret_require_longhorn_encryption and
        'state=missing' in platform_longhorn_encryption_secret_result.stdout)
      no_log: true
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Create private Longhorn encryption recovery directory on controller
      ansible.builtin.file:
        path: "{{ platform_longhorn_encryption_recovery_file | dirname }}"
        state: directory
        mode: "0700"
      become: false
      delegate_to: localhost
      run_once: true
      when: "'state=missing' not in platform_longhorn_encryption_secret_result.stdout"

    - name: Fetch Longhorn encryption key into ignored controller comparison file
      ansible.builtin.fetch:
        src: "{{ platform_longhorn_encryption_stage_file }}"
        dest: "{{ platform_longhorn_encryption_recovery_file }}.candidate"
        flat: true
        fail_on_missing: true
      no_log: true
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      when: "'state=missing' not in platform_longhorn_encryption_secret_result.stdout"

    - name: Preserve or create Longhorn encryption recovery file without overwriting mismatch
      ansible.builtin.shell: |
        set -euo pipefail
        recovery={{ platform_longhorn_encryption_recovery_file | quote }}
        candidate={{ (platform_longhorn_encryption_recovery_file ~ '.candidate') | quote }}
        trap 'rm -f "${candidate}"' EXIT
        chmod 0600 "${candidate}"
        if [ -f "${recovery}" ]; then
          if ! cmp --silent "${recovery}" "${candidate}"; then
            echo "Longhorn encryption recovery file does not match the authoritative cluster Secret." >&2
            exit 1
          fi
          chmod 0600 "${recovery}"
          echo "longhorn_encryption_recovery_file=${recovery} state=present"
        else
          install -m 0600 "${candidate}" "${recovery}"
          echo "longhorn_encryption_recovery_file=${recovery} state=generated"
        fi
      args:
        executable: /bin/bash
      changed_when: "'state=generated' in platform_longhorn_encryption_recovery_result.stdout"
      register: platform_longhorn_encryption_recovery_result
      no_log: true
      become: false
      delegate_to: localhost
      run_once: true
      when: "'state=missing' not in platform_longhorn_encryption_secret_result.stdout"

    - name: Remove staged Longhorn encryption key from first server
      ansible.builtin.file:
        path: "{{ platform_longhorn_encryption_stage_file }}"
        state: absent
      changed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      when: "'state=missing' not in platform_longhorn_encryption_secret_result.stdout"

    - name: Generate or preserve MinIO root credentials secret
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        SECRET="{{ platform_minio_root_secret_name }}"
        ROTATE="{{ 'true' if platform_app_secret_rotate else 'false' }}"

        "$K" --kubeconfig "$C" create namespace object-storage --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        if [ "${ROTATE}" != "true" ] && "$K" --kubeconfig "$C" -n object-storage get "secret/${SECRET}" \
          -o 'go-template={{ "{{" }} index .data "root-user" {{ "}}" }}{{ "{{" }} index .data "root-password" {{ "}}" }}' 2>/dev/null | grep -q .; then
          echo "minio_root_secret=${SECRET} state=present"
          exit 0
        fi

        random_b64() {
          if command -v openssl >/dev/null 2>&1; then
            openssl rand -base64 30
          else
            python3 - <<'PY'
        import secrets
        print(secrets.token_urlsafe(32))
        PY
          fi
        }

        root_user="${MINIO_ROOT_USER:-platform-admin}"
        root_password="${MINIO_ROOT_PASSWORD:-}"
        auto_generate="${MINIO_ROOT_AUTO_GENERATE:-true}"
        if [ -z "${root_password}" ]; then
          if [ "${auto_generate}" = "true" ]; then
            root_password="$(random_b64)"
          else
            echo "minio_root_secret=${SECRET} state=missing reason=set-MINIO_ROOT_PASSWORD"
            exit 0
          fi
        fi

        "$K" --kubeconfig "$C" -n object-storage create secret generic "${SECRET}" \
          --from-literal=root-user="${root_user}" \
          --from-literal=root-password="${root_password}" \
          --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        echo "minio_root_secret=${SECRET} state=generated"
      args:
        executable: /bin/bash
      environment:
        MINIO_ROOT_USER: "{{ lookup('ansible.builtin.env', 'MINIO_ROOT_USER') }}"
        MINIO_ROOT_PASSWORD: "{{ lookup('ansible.builtin.env', 'MINIO_ROOT_PASSWORD') }}"
        MINIO_ROOT_AUTO_GENERATE: "{{ lookup('ansible.builtin.env', 'MINIO_ROOT_AUTO_GENERATE') }}"
      register: platform_minio_root_secret_result
      changed_when: "'state=generated' in platform_minio_root_secret_result.stdout"
      no_log: true
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Generate or preserve Harbor bootstrap secrets
      tags:
        - harbor
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        ADMIN_SECRET="{{ platform_harbor_admin_secret_name }}"
        SECRET_KEY_SECRET="{{ platform_harbor_secret_key_secret_name }}"
        ROTATE="{{ 'true' if platform_app_secret_rotate else 'false' }}"

        random_b64() {
          if command -v openssl >/dev/null 2>&1; then
            openssl rand -base64 30
          else
            python3 - <<'PY'
        import secrets
        print(secrets.token_urlsafe(32))
        PY
          fi
        }

        random_hex() {
          if command -v openssl >/dev/null 2>&1; then
            openssl rand -hex 16
          else
            python3 - <<'PY'
        import secrets
        print(secrets.token_hex(16))
        PY
          fi
        }

        "$K" --kubeconfig "$C" create namespace harbor --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        if [ "${ROTATE}" = "true" ] || ! "$K" --kubeconfig "$C" -n harbor get "secret/${ADMIN_SECRET}" >/dev/null 2>&1; then
          password="$(random_b64)"
          "$K" --kubeconfig "$C" -n harbor create secret generic "${ADMIN_SECRET}" \
            --from-literal=HARBOR_ADMIN_PASSWORD="${password}" \
            --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -
          admin_state=generated
        else
          admin_state=present
        fi

        if [ "${ROTATE}" = "true" ] || ! "$K" --kubeconfig "$C" -n harbor get "secret/${SECRET_KEY_SECRET}" >/dev/null 2>&1; then
          secret_key="$(random_hex)"
          "$K" --kubeconfig "$C" -n harbor create secret generic "${SECRET_KEY_SECRET}" \
            --from-literal=secretKey="${secret_key}" \
            --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -
          key_state=generated
        else
          key_state=present
        fi

        echo "harbor_admin_secret=${ADMIN_SECRET} state=${admin_state}"
        echo "harbor_secret_key_secret=${SECRET_KEY_SECRET} state=${key_state}"
      args:
        executable: /bin/bash
      register: platform_harbor_secret_result
      changed_when: "'generated' in platform_harbor_secret_result.stdout"
      no_log: true
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Generate or preserve Harbor external database password secret
      tags:
        - harbor
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        SECRET="{{ platform_harbor_database_secret_name }}"
        ROTATE="{{ 'true' if platform_app_secret_rotate else 'false' }}"

        random_b64() {
          if command -v openssl >/dev/null 2>&1; then
            openssl rand -base64 30
          else
            python3 - <<'PY'
        import secrets
        print(secrets.token_urlsafe(32))
        PY
          fi
        }

        "$K" --kubeconfig "$C" create namespace harbor --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -
        "$K" --kubeconfig "$C" create namespace platform-databases --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        app_user=""
        app_password=""
        database_user=""
        database_password=""
        if [ "${ROTATE}" != "true" ]; then
          app_user="$("$K" --kubeconfig "$C" -n harbor get "secret/${SECRET}" -o "go-template={{ '{{' }} index .data \"username\" {{ '}}' }}" 2>/dev/null | base64 -d || true)"
          app_password="$("$K" --kubeconfig "$C" -n harbor get "secret/${SECRET}" -o "go-template={{ '{{' }} index .data \"password\" {{ '}}' }}" 2>/dev/null | base64 -d || true)"
          database_user="$("$K" --kubeconfig "$C" -n platform-databases get "secret/${SECRET}" -o "go-template={{ '{{' }} index .data \"username\" {{ '}}' }}" 2>/dev/null | base64 -d || true)"
          database_password="$("$K" --kubeconfig "$C" -n platform-databases get "secret/${SECRET}" -o "go-template={{ '{{' }} index .data \"password\" {{ '}}' }}" 2>/dev/null | base64 -d || true)"
        fi

        db_user="${HARBOR_DATABASE_USER:-${app_user:-${database_user:-harbor}}}"
        password="${HARBOR_DATABASE_PASSWORD:-${app_password:-${database_password:-}}}"
        auto_generate="${HARBOR_DATABASE_AUTO_GENERATE:-true}"
        if [ -z "${password}" ]; then
          if [ "${auto_generate}" = "true" ]; then
            password="$(random_b64)"
          else
            echo "harbor_database_secret=${SECRET} state=missing reason=set-HARBOR_DATABASE_PASSWORD"
            exit 0
          fi
        fi

        "$K" --kubeconfig "$C" -n harbor create secret generic "${SECRET}" \
          --from-literal=username="${db_user}" \
          --from-literal=password="${password}" \
          --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        "$K" --kubeconfig "$C" -n platform-databases create secret generic "${SECRET}" \
          --type=kubernetes.io/basic-auth \
          --from-literal=username="${db_user}" \
          --from-literal=password="${password}" \
          --dry-run=client -o yaml | \
          "$K" --kubeconfig "$C" label --local -f - cnpg.io/reload=true -o yaml | \
          "$K" --kubeconfig "$C" apply -f -

        state=generated
        if [ "${ROTATE}" != "true" ] && [ -n "${app_password}" ] && [ -n "${database_password}" ]; then
          state=present
        fi
        echo "harbor_database_secret=${SECRET} state=${state}"
      args:
        executable: /bin/bash
      environment:
        HARBOR_DATABASE_USER: "{{ lookup('ansible.builtin.env', 'HARBOR_DATABASE_USER') }}"
        HARBOR_DATABASE_PASSWORD: "{{ lookup('ansible.builtin.env', 'HARBOR_DATABASE_PASSWORD') }}"
        HARBOR_DATABASE_AUTO_GENERATE: "{{ lookup('ansible.builtin.env', 'HARBOR_DATABASE_AUTO_GENERATE') }}"
      register: platform_harbor_database_secret_result
      changed_when: "'state=generated' in platform_harbor_database_secret_result.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      no_log: true

