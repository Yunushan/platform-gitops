    - name: Generate or preserve Woodpecker database datasource secret
      tags:
        - woodpecker
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        SECRET="{{ platform_woodpecker_database_secret_name }}"
        ROTATE="{{ 'true' if platform_app_secret_rotate else 'false' }}"

        "$K" --kubeconfig "$C" create namespace woodpecker --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -
        "$K" --kubeconfig "$C" create namespace platform-databases --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        random_b64() {
          if command -v openssl >/dev/null 2>&1; then
            openssl rand -base64 30
          else
            python3 - <<'PY'
        import secrets
        print(secrets.token_urlsafe(32))
        PY
          fi
        }

        datasource="${WOODPECKER_DATABASE_DATASOURCE:-}"
        db_name="${WOODPECKER_DATABASE_NAME:-woodpecker}"
        db_user="${WOODPECKER_DATABASE_USER:-woodpecker}"
        db_password="${WOODPECKER_DATABASE_PASSWORD:-}"
        db_sslmode="${WOODPECKER_DATABASE_SSLMODE:-verify-full}"
        db_sslrootcert="${WOODPECKER_DATABASE_SSLROOTCERT:-/etc/ssl/platform-postgres/ca-certificates.crt}"
        production_strict="${PLATFORM_PRODUCTION_STRICT:-true}"

        case "${db_sslmode}" in
          disable|allow|prefer|require|verify-ca|verify-full) ;;
          *)
            echo "WOODPECKER_DATABASE_SSLMODE must be disable, allow, prefer, require, verify-ca, or verify-full" >&2
            exit 1
            ;;
        esac
        case "${production_strict,,}" in
          1|true|yes|on)
            if [ "${db_sslmode}" != "verify-full" ]; then
              echo "WOODPECKER_DATABASE_SSLMODE must be verify-full when PLATFORM_PRODUCTION_STRICT=true" >&2
              exit 1
            fi
            case "${db_sslrootcert}" in
              /*) ;;
              *)
                echo "WOODPECKER_DATABASE_SSLROOTCERT must be an absolute path when PLATFORM_PRODUCTION_STRICT=true" >&2
                exit 1
                ;;
            esac
            ;;
        esac
        secret_state="generated"
        if [ -z "${datasource}" ]; then
          db_host="${WOODPECKER_DATABASE_HOST:-platform-postgres-rw.platform-databases.svc.cluster.local:5432}"
          if [ -z "${db_password}" ]; then
            existing_password="$("$K" --kubeconfig "$C" -n platform-databases get "secret/${SECRET}" -o "go-template={{ '{{' }} index .data \"password\" {{ '}}' }}" 2>/dev/null | base64 -d || true)"
            if [ -n "${existing_password}" ] && [ "${ROTATE}" != "true" ]; then
              db_password="${existing_password}"
              secret_state="reconciled"
            else
              db_password="$(random_b64)"
            fi
          fi
          datasource="$(python3 - "${db_user}" "${db_password}" "${db_host}" "${db_name}" "${db_sslmode}" "${db_sslrootcert}" <<'PY'
        import sys
        from urllib.parse import quote, urlencode

        user, password, host, database, sslmode, sslrootcert = sys.argv[1:7]
        print(
            "postgres://"
            f"{quote(user, safe='')}:{quote(password, safe='')}"
            f"@{host}/{quote(database, safe='')}"
            f"?{urlencode({'sslmode': sslmode, 'sslrootcert': sslrootcert})}"
        )
        PY
        )"
        else
          python3 - "${datasource}" "${production_strict}" <<'PY'
        import os
        import sys
        from urllib.parse import parse_qs, urlsplit

        datasource, strict = sys.argv[1:3]
        if strict.strip().lower() not in {"1", "true", "yes", "on"}:
            raise SystemExit(0)
        parsed = urlsplit(datasource)
        if parsed.scheme not in {"postgres", "postgresql"}:
            raise SystemExit(
                "WOODPECKER_DATABASE_DATASOURCE must use a postgres:// or postgresql:// URL "
                "when PLATFORM_PRODUCTION_STRICT=true"
            )
        query = parse_qs(parsed.query, keep_blank_values=True)
        if query.get("sslmode", [""])[-1].lower() != "verify-full":
            raise SystemExit(
                "WOODPECKER_DATABASE_DATASOURCE must set sslmode=verify-full "
                "when PLATFORM_PRODUCTION_STRICT=true"
            )
        sslrootcert = query.get("sslrootcert", [""])[-1]
        if not sslrootcert or not os.path.isabs(sslrootcert):
            raise SystemExit(
                "WOODPECKER_DATABASE_DATASOURCE must set an absolute sslrootcert path "
                "when PLATFORM_PRODUCTION_STRICT=true"
            )
        PY
        fi

        if [ -z "${datasource}" ]; then
          echo "woodpecker_database_secret=${SECRET} state=missing reason=set-WOODPECKER_DATABASE_DATASOURCE-or-WOODPECKER_DATABASE_HOST-and-WOODPECKER_DATABASE_PASSWORD"
          exit 0
        fi

        "$K" --kubeconfig "$C" -n woodpecker create secret generic "${SECRET}" \
          --from-literal=WOODPECKER_DATABASE_DATASOURCE="${datasource}" \
          --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        if [ -n "${db_password}" ]; then
          "$K" --kubeconfig "$C" -n platform-databases create secret generic "${SECRET}" \
            --type=kubernetes.io/basic-auth \
            --from-literal=username="${db_user}" \
            --from-literal=password="${db_password}" \
            --dry-run=client -o yaml | \
            "$K" --kubeconfig "$C" label --local -f - cnpg.io/reload=true -o yaml | \
            "$K" --kubeconfig "$C" apply -f -
        fi

        echo "woodpecker_database_secret=${SECRET} state=${secret_state}"
      args:
        executable: /bin/bash
      environment:
        WOODPECKER_DATABASE_DATASOURCE: "{{ lookup('ansible.builtin.env', 'WOODPECKER_DATABASE_DATASOURCE') }}"
        WOODPECKER_DATABASE_HOST: "{{ lookup('ansible.builtin.env', 'WOODPECKER_DATABASE_HOST') }}"
        WOODPECKER_DATABASE_NAME: "{{ lookup('ansible.builtin.env', 'WOODPECKER_DATABASE_NAME') }}"
        WOODPECKER_DATABASE_USER: "{{ lookup('ansible.builtin.env', 'WOODPECKER_DATABASE_USER') }}"
        WOODPECKER_DATABASE_PASSWORD: "{{ lookup('ansible.builtin.env', 'WOODPECKER_DATABASE_PASSWORD') }}"
        WOODPECKER_DATABASE_SSLMODE: "{{ lookup('ansible.builtin.env', 'WOODPECKER_DATABASE_SSLMODE') }}"
        WOODPECKER_DATABASE_SSLROOTCERT: "{{ lookup('ansible.builtin.env', 'WOODPECKER_DATABASE_SSLROOTCERT') }}"
        PLATFORM_PRODUCTION_STRICT: "{{ platform_production_strict | bool | ternary('true', 'false') }}"
      register: platform_woodpecker_database_secret_result
      changed_when: >-
        'state=generated' in platform_woodpecker_database_secret_result.stdout or
        'state=reconciled' in platform_woodpecker_database_secret_result.stdout
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      no_log: true

    - name: Check Woodpecker database datasource secret state
      tags:
        - woodpecker
      ansible.builtin.shell: |
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        if "$K" --kubeconfig "$C" -n woodpecker get "secret/{{ platform_woodpecker_database_secret_name }}" >/dev/null 2>&1; then
          echo present
        else
          echo missing
        fi
      args:
        executable: /bin/bash
      register: platform_woodpecker_database_secret_state
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Require Woodpecker database datasource secret when enabled
      tags:
        - woodpecker
      ansible.builtin.fail:
        msg: |
          Woodpecker database datasource secret is required but not present.

          Secret state:
          - woodpecker/{{ platform_woodpecker_database_secret_name }}: {{ platform_woodpecker_database_secret_state.stdout | trim | default('unknown', true) }}

          Provide credentials through ignored env values and rerun:
          WOODPECKER_DATABASE_DATASOURCE

          Or provide:
          WOODPECKER_DATABASE_HOST
          WOODPECKER_DATABASE_NAME
          WOODPECKER_DATABASE_USER
          WOODPECKER_DATABASE_PASSWORD
      when: >-
        platform_app_secret_require_woodpecker_database | bool and
        (platform_woodpecker_database_secret_state.stdout | trim) != 'present'
      run_once: true

    - name: Configure Forgejo OAuth application for Woodpecker
      tags:
        - woodpecker
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        SECRET="{{ platform_woodpecker_oauth_secret_name }}"
        APP_NAME="{{ platform_woodpecker_oauth_app_name }}"
        REDIRECT_URI="https://{{ platform_woodpecker_host_effective }}/authorize"
        ROTATE="{{ 'true' if platform_app_secret_rotate else 'false' }}"
        REPAIR_ADMIN_PASSWORD="{{ 'true' if platform_forgejo_admin_password_repair else 'false' }}"

        "$K" --kubeconfig "$C" create namespace woodpecker --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -
        if [ "${ROTATE}" != "true" ] && "$K" --kubeconfig "$C" -n woodpecker get "secret/${SECRET}" >/dev/null 2>&1; then
          echo "woodpecker_oauth_secret=${SECRET} state=present"
          exit 0
        fi

        "$K" --kubeconfig "$C" -n forgejo get secret forgejo-admin >/dev/null
        forgejo_user="$("$K" --kubeconfig "$C" -n forgejo get secret forgejo-admin -o jsonpath='{.data.username}' | base64 -d)"
        forgejo_password="$("$K" --kubeconfig "$C" -n forgejo get secret forgejo-admin -o jsonpath='{.data.password}' | base64 -d)"
        forgejo_svc_ip="$("$K" --kubeconfig "$C" -n forgejo get service forgejo-http -o jsonpath='{.spec.clusterIP}')"
        test -n "${forgejo_svc_ip}"
        test "${forgejo_svc_ip}" != "None"
        forgejo_base="http://${forgejo_svc_ip}:3000"

        body_file="$(mktemp)"
        response_file="$(mktemp)"
        error_file="$(mktemp)"
        trap 'rm -f "${body_file}" "${response_file}" "${error_file}"' EXIT

        create_oauth_app() {
          local app_name="$1"
          python3 - "${app_name}" "${REDIRECT_URI}" >"${body_file}" <<'PY'
        import json
        import sys
        print(json.dumps({
            "name": sys.argv[1],
            "redirect_uris": [sys.argv[2]],
            "confidential_client": True,
        }))
        PY

          http_code="$(curl --silent --show-error --output "${response_file}" \
            --write-out '%{http_code}' \
            --user "${forgejo_user}:${forgejo_password}" \
            --header 'Content-Type: application/json' \
            --connect-timeout 10 \
            --max-time 30 \
            --data @"${body_file}" \
            "${forgejo_base}/api/v1/user/applications/oauth2" 2>"${error_file}" || true)"
        }

        repair_forgejo_admin_password() {
          forgejo_pod="$("$K" --kubeconfig "$C" -n forgejo get pods \
            -l app.kubernetes.io/name=forgejo \
            --field-selector=status.phase=Running \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
          if [ -z "${forgejo_pod}" ]; then
            echo "Could not repair Forgejo admin password because no running Forgejo pod was found." >&2
            return 1
          fi

          "$K" --kubeconfig "$C" -n forgejo exec "pod/${forgejo_pod}" -c forgejo -- \
            env FORGEJO_ADMIN_PASSWORD="${forgejo_password}" sh -c '
              set -u
              export GITEA_APP_INI="${GITEA_APP_INI:-/data/gitea/conf/app.ini}"
              export GITEA_CUSTOM="${GITEA_CUSTOM:-/data/gitea}"
              export GITEA_WORK_DIR="${GITEA_WORK_DIR:-/data}"
              export HOME="${HOME:-/data/gitea/git}"
              bin="$(command -v forgejo || command -v gitea || true)"
              test -n "${bin}"
              "${bin}" --config "${GITEA_APP_INI}" admin user change-password --username "$1" --password "${FORGEJO_ADMIN_PASSWORD}" --must-change-password=false && exit 0
              "${bin}" admin user change-password --username "$1" --password "${FORGEJO_ADMIN_PASSWORD}" --must-change-password=false --config "${GITEA_APP_INI}" && exit 0
              "${bin}" --config "${GITEA_APP_INI}" admin user change-password --username "$1" --password "${FORGEJO_ADMIN_PASSWORD}" && exit 0
              "${bin}" admin user change-password --username "$1" --password "${FORGEJO_ADMIN_PASSWORD}" --config "${GITEA_APP_INI}" && exit 0
              "${bin}" admin user change-password --username "$1" --password "${FORGEJO_ADMIN_PASSWORD}" && exit 0
              exit 1
            ' sh "${forgejo_user}"
        }

        forgejo_admin_auth_repair_needed() {
          if [ "${http_code}" = "401" ]; then
            return 0
          fi
          if [ "${http_code}" = "403" ] &&
            grep -Eiq 'must change.*password|change_password' "${response_file}"; then
            return 0
          fi
          return 1
        }

        effective_app_name="${APP_NAME}"
        create_oauth_app "${effective_app_name}"

        if forgejo_admin_auth_repair_needed && [ "${REPAIR_ADMIN_PASSWORD}" = "true" ]; then
          echo "Forgejo admin secret cannot create OAuth apps yet; reconciling password and clearing first-login password-change state." >&2
          repair_forgejo_admin_password
          create_oauth_app "${effective_app_name}"
        fi

        if [ "${http_code}" != "200" ] && [ "${http_code}" != "201" ] &&
          [ "${http_code}" != "401" ] &&
          grep -Eiq 'already|duplicate|exists' "${response_file}"; then
          effective_app_name="${APP_NAME}-$(date +%Y%m%d%H%M%S)"
          echo "Forgejo OAuth app name already exists; retrying with ${effective_app_name}." >&2
          create_oauth_app "${effective_app_name}"
        fi

        if [ "${http_code}" != "200" ] && [ "${http_code}" != "201" ]; then
          echo "Failed to create Forgejo OAuth app for Woodpecker. http_code=${http_code}" >&2
          cat "${error_file}" >&2 || true
          cat "${response_file}" >&2 || true
          echo "If Forgejo reports a duplicate app, either keep the existing woodpecker secret or rerun with WOODPECKER_FORGEJO_OAUTH_APP_NAME set to a new app name." >&2
          exit 1
        fi

        read -r client_id client_secret < <(python3 - "${response_file}" <<'PY'
        import json
        import sys
        data = json.load(open(sys.argv[1], encoding="utf-8"))
        client_id = data.get("client_id") or data.get("clientID") or data.get("clientId") or ""
        oauth_private = data.get("client_secret") or data.get("clientSecret") or ""
        if not client_id or not oauth_private:
            raise SystemExit(f"OAuth response did not include client_id/client_secret keys: {sorted(data)}")
        print(client_id, oauth_private)
        PY
        )

        "$K" --kubeconfig "$C" -n woodpecker create secret generic "${SECRET}" \
          --from-literal=WOODPECKER_FORGEJO_CLIENT="${client_id}" \
          --from-literal=WOODPECKER_FORGEJO_SECRET="${client_secret}" \
          --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        echo "woodpecker_oauth_secret=${SECRET} state=generated app_name=${effective_app_name} redirect_uri=${REDIRECT_URI}"
      args:
        executable: /bin/bash
      register: platform_woodpecker_oauth_result
      changed_when: "'state=generated' in platform_woodpecker_oauth_result.stdout"
      no_log: true
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Show platform app secret automation summary
      ansible.builtin.debug:
        msg: |
          Platform app bootstrap secret automation finished.

          Shared platform Valkey:
          - namespace: platform-cache
          - auth secret: {{ platform_valkey_auth_secret_name }}
          - password key: {{ platform_valkey_password_key }}
          - primary service host: {{ platform_valkey_primary_host }}:{{ platform_valkey_port }}

          Harbor:
          - namespace: harbor
          - admin password secret: {{ platform_harbor_admin_secret_name }}
          - secret key secret: {{ platform_harbor_secret_key_secret_name }}
          - external database secret: harbor/{{ platform_harbor_database_secret_name }} and platform-databases/{{ platform_harbor_database_secret_name }} ({{ platform_harbor_database_secret_state.stdout | trim | default('unknown', true) }})
          - external Redis secret: {{ platform_harbor_redis_secret_name }} ({{ platform_harbor_redis_secret_state.stdout | trim | default('unknown', true) }})
          - core Redis URL override secret: {{ platform_harbor_redis_url_secret_name }}
          - registry S3 secret: {{ platform_harbor_s3_secret_name }} ({{ platform_harbor_s3_secret_state.stdout | trim | default('unknown', true) }})
          - get admin password:
            kubectl -n harbor get secret {{ platform_harbor_admin_secret_name }} -o jsonpath='{.data.HARBOR_ADMIN_PASSWORD}' | base64 -d; echo
          - database credentials are generated and preserved automatically; set HARBOR_DATABASE_PASSWORD only to supply an explicit value.
          - set HARBOR_S3_ACCESS_KEY_ID/HARBOR_S3_SECRET_ACCESS_KEY before this target to create registry storage credentials.
          - HARBOR_REDIS_PASSWORD is optional when using shared platform Valkey.

          Grafana:
          - namespace: monitoring
          - admin credentials secret: {{ platform_grafana_admin_secret_name }}
          - username key: admin-user
          - password key: admin-password
          - external database reference: monitoring/{{ platform_grafana_database_secret_name }} and platform-databases/{{ platform_grafana_database_secret_name }} ({{ platform_grafana_database_secret_state.stdout | trim | default('unknown', true) }})
          - get admin password:
            kubectl -n monitoring get secret {{ platform_grafana_admin_secret_name }} -o go-template='{{ "{{" }} index .data "admin-password" {{ "}}" }}' | base64 -d; echo
          - database credentials are generated and preserved automatically; set GRAFANA_DATABASE_PASSWORD only to supply an explicit value.

          Keycloak:
          - namespace: keycloak
          - admin credentials secret: {{ platform_keycloak_admin_secret_name }}
          - external database secret: {{ platform_keycloak_database_secret_name }} ({{ platform_keycloak_database_secret_state.stdout | trim | default('unknown', true) }})
          - get admin password:
            kubectl -n keycloak get secret {{ platform_keycloak_admin_secret_name }} -o go-template='{{ "{{" }} index .data "admin-password" {{ "}}" }}' | base64 -d; echo
          - set KEYCLOAK_DATABASE_PASSWORD and PLATFORM_APP_SECRET_REQUIRE_KEYCLOAK_DATABASE=true before this target to require a specific external database password.

          Platform SSO:
          - enabled: {{ platform_sso_enabled }}
          - realm: {{ lookup('ansible.builtin.env', 'PLATFORM_SSO_REALM') | default('platform', true) }}
          - Keycloak import: keycloak/{{ platform_sso_keycloak_secret_name }}
          - Argo CD OIDC: argocd/{{ platform_sso_argocd_secret_name }}
          - Grafana OIDC: monitoring/{{ platform_sso_grafana_secret_name }}
          - Prometheus OAuth2 Proxy: monitoring/{{ platform_sso_prometheus_secret_name }}
          - retrieve the generated bootstrap user password only when needed:
            kubectl -n keycloak get secret {{ platform_sso_keycloak_secret_name }} -o go-template='{{ "{{" }} index .data "PLATFORM_SSO_BOOTSTRAP_ADMIN_PASSWORD" {{ "}}" }}' | base64 -d; echo
          - bootstrap user: {{ lookup('ansible.builtin.env', 'PLATFORM_SSO_BOOTSTRAP_ADMIN_USERNAME') | default(lookup('ansible.builtin.env', 'PLATFORM_SSO_BOOTSTRAP_USERNAME'), true) | default('platform-admin', true) }}; it is required to enroll TOTP at first sign-in.
          - Grafana local login and direct Prometheus ingress are disabled while Platform SSO is enabled.

          Forgejo:
          - namespace: forgejo
          - external database password secret: {{ platform_forgejo_database_secret_name }} ({{ platform_forgejo_database_secret_state.stdout | trim | default('unknown', true) }})
          - Redis URI secret: {{ platform_forgejo_redis_secret_name }} ({{ platform_forgejo_redis_secret_state.stdout | trim | default('unknown', true) }})
          - set FORGEJO_DATABASE_PASSWORD before this target to override the generated database password.
          - FORGEJO_REDIS_URL or FORGEJO_REDIS_HOST plus FORGEJO_REDIS_PASSWORD are optional when using shared platform Valkey.

          Woodpecker:
          - namespace: woodpecker
          - Forgejo OAuth app: {{ platform_woodpecker_oauth_app_name }}
          - OAuth redirect URI: https://{{ platform_woodpecker_host_effective }}/authorize
          - Kubernetes OAuth secret: {{ platform_woodpecker_oauth_secret_name }}
          - shared server/agent token secret: {{ platform_woodpecker_agent_secret_name }}
          - database datasource secret: {{ platform_woodpecker_database_secret_name }}
          - database datasource state: {{ platform_woodpecker_database_secret_state.stdout | trim | default('unknown', true) }}
          - set WOODPECKER_DATABASE_DATASOURCE, or WOODPECKER_DATABASE_HOST plus WOODPECKER_DATABASE_PASSWORD, before this target to create it automatically.

          Loki:
          - namespace: logging
          - object storage secret: {{ platform_loki_object_storage_secret_name }}
          - state: {{ platform_loki_secret_state.stdout | trim | default('unknown', true) }}
          - authenticated gateway secret: {{ platform_loki_gateway_secret_name }}
          - Grafana/collector credential object: monitoring/{{ platform_loki_client_secret_name }}
          - gateway credential state: {{ platform_loki_gateway_secret_state.stdout | trim | default('unknown', true) }}
          - set LOKI_S3_ACCESS_KEY_ID/LOKI_S3_SECRET_ACCESS_KEY or AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY before this target to create it automatically.

          Alertmanager:
          - namespace: monitoring
          - routing config secret: {{ platform_alertmanager_config_secret_name }}
          - state: {{ platform_alertmanager_secret_state.stdout | trim | default('unknown', true) }}
          - set ALERTMANAGER_WEBHOOK_URL to an HTTPS receiver or provide ALERTMANAGER_CONFIG.

          Velero:
          - namespace: velero
          - cloud credentials secret: {{ platform_velero_credentials_secret_name }}
          - state: {{ platform_velero_secret_state.stdout | trim | default('unknown', true) }}
          - set VELERO_CLOUD_CREDENTIALS or AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY before this target to create it automatically.

          CloudNativePG:
          - namespace: platform-databases
          - object storage secret: {{ platform_cnpg_object_store_secret_name }}
          - state: {{ platform_cnpg_secret_state.stdout | trim | default('unknown', true) }}
          - set CNPG_S3_ACCESS_KEY_ID/CNPG_S3_SECRET_ACCESS_KEY or AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY before this target to create it automatically.

          Longhorn backups:
          - namespace: longhorn-system
          - backup target credentials secret: {{ platform_longhorn_backup_secret_name }}
          - state: {{ platform_longhorn_backup_secret_state.stdout | trim | default('unknown', true) }}
          - set LONGHORN_BACKUP_ACCESS_KEY_ID/LONGHORN_BACKUP_SECRET_ACCESS_KEY and BACKUP_OBJECT_STORAGE_ENDPOINT, or shared AWS credentials, before this target.

          Longhorn volume encryption:
          - namespace: longhorn-system
          - encryption key secret: {{ platform_longhorn_encryption_secret_name }}
          - state: {{ platform_longhorn_encryption_secret_result.stdout | trim | default('unknown', true) }}
          - controller recovery file: {{ platform_longhorn_encryption_recovery_file }} (mode 0600, ignored by Git)
          - replicate the recovery file into an encrypted separate failure domain; global app-secret rotation never replaces this key.

          MinIO:
          - namespace: object-storage
          - root credentials secret: {{ platform_minio_root_secret_name }}
          - set MINIO_ROOT_USER/MINIO_ROOT_PASSWORD to override generated bootstrap credentials.

          For production, set PLATFORM_APP_SECRET_REQUIRE_OBJECT_STORAGE=true
          so this target fails when Loki, Velero, CloudNativePG, or Longhorn object-storage
          credentials are still missing. Production strict mode also requires
          the Longhorn volume-encryption key.

          Production strict mode also requires a non-placeholder Alertmanager
          routing secret. Set PLATFORM_ALERTMANAGER_REQUIRE_ROUTE=false only
          for a non-production lab that intentionally discards alerts.

          Set PLATFORM_APP_SECRET_REQUIRE_WOODPECKER_DATABASE=true so this
          target fails when Woodpecker's PostgreSQL datasource secret is still
          missing before enabling Woodpecker HA values.

          Set PLATFORM_APP_SECRET_REQUIRE_FORGEJO_DATABASE=true and
          PLATFORM_APP_SECRET_REQUIRE_FORGEJO_REDIS=true so this target fails
          when Forgejo external PostgreSQL or Redis secrets are still missing
          before rendering FORGEJO_DATABASE_MODE=external values.

          Set PLATFORM_APP_SECRET_REQUIRE_HARBOR_DATABASE=true,
          PLATFORM_APP_SECRET_REQUIRE_HARBOR_REDIS=true, and
          PLATFORM_APP_SECRET_REQUIRE_HARBOR_REGISTRY_STORAGE=true before
          enabling Harbor external PostgreSQL, Redis, and S3 registry storage.

          Set PLATFORM_APP_SECRET_ROTATE=true only when you intentionally want
          to rotate generated secrets and update dependent apps.
      run_once: true
