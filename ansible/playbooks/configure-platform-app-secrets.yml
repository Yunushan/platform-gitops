          HARBOR_REDIS_PASSWORD
          HARBOR_S3_ACCESS_KEY_ID / HARBOR_S3_SECRET_ACCESS_KEY

          HARBOR_S3 credentials can also use shared AWS_ACCESS_KEY_ID /
          AWS_SECRET_ACCESS_KEY.
      when: >-
        (platform_app_secret_require_harbor_database | bool and (platform_harbor_database_secret_state.stdout | trim) != 'present') or
        (platform_app_secret_require_harbor_redis | bool and (platform_harbor_redis_secret_state.stdout | trim) != 'present') or
        (platform_app_secret_require_harbor_registry_storage | bool and (platform_harbor_s3_secret_state.stdout | trim) != 'present')
      run_once: true

