          Secret states:
          - harbor/{{ platform_harbor_database_secret_name }} and platform-databases/{{ platform_harbor_database_secret_name }}: {{ platform_harbor_database_secret_state.stdout | trim | default('unknown', true) }}
          - harbor/{{ platform_harbor_redis_secret_name }}: {{ platform_harbor_redis_secret_state.stdout | trim | default('unknown', true) }}
          - harbor/{{ platform_harbor_redis_url_secret_name }}: generated when shared Valkey is enabled
          - harbor/{{ platform_harbor_s3_secret_name }}: {{ platform_harbor_s3_secret_state.stdout | trim | default('unknown', true) }}

          Database credentials are generated automatically unless
          HARBOR_DATABASE_AUTO_GENERATE=false. Optional explicit values:
