          Object storage credential secrets are required but not present.

          Loki secret state:
          - logging/{{ platform_loki_object_storage_secret_name }}: {{ platform_loki_secret_state.stdout | trim | default('unknown', true) }}

          Velero secret state:
          - velero/{{ platform_velero_credentials_secret_name }}: {{ platform_velero_secret_state.stdout | trim | default('unknown', true) }}

          CloudNativePG secret state:
          - platform-databases/{{ platform_cnpg_object_store_secret_name }}: {{ platform_cnpg_secret_state.stdout | trim | default('unknown', true) }}

          Longhorn backup secret state:
          - longhorn-system/{{ platform_longhorn_backup_secret_name }}: {{ platform_longhorn_backup_secret_state.stdout | trim | default('unknown', true) }}

          Provide credentials through ignored env values and rerun:
          LOKI_S3_ACCESS_KEY_ID / LOKI_S3_SECRET_ACCESS_KEY
          VELERO_CLOUD_CREDENTIALS
          CNPG_S3_ACCESS_KEY_ID / CNPG_S3_SECRET_ACCESS_KEY
          LONGHORN_BACKUP_ACCESS_KEY_ID / LONGHORN_BACKUP_SECRET_ACCESS_KEY

          Or provide shared AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY.
      when: >-
