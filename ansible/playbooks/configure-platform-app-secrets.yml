    - name: Generate or preserve Woodpecker database datasource secret
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        SECRET="{{ platform_woodpecker_database_secret_name }}"
        ROTATE="{{ 'true' if platform_app_secret_rotate else 'false' }}"

        "$K" --kubeconfig "$C" create namespace woodpecker --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -
        "$K" --kubeconfig "$C" create namespace platform-databases --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        random_b64() {
          if command -v openssl >/dev/null 2>&1; then
            openssl rand -base64 30
          else
            python3 - <<'PY'
        import secrets
        print(secrets.token_urlsafe(32))
        PY
          fi
        }

        datasource="${WOODPECKER_DATABASE_DATASOURCE:-}"
        db_name="${WOODPECKER_DATABASE_NAME:-woodpecker}"
        db_user="${WOODPECKER_DATABASE_USER:-woodpecker}"
        db_password="${WOODPECKER_DATABASE_PASSWORD:-}"
        db_sslmode="${WOODPECKER_DATABASE_SSLMODE:-disable}"
        secret_state="generated"
        if [ -z "${datasource}" ]; then
          db_host="${WOODPECKER_DATABASE_HOST:-platform-postgres-rw.platform-databases.svc.cluster.local:5432}"
          if [ -z "${db_password}" ]; then
            existing_password="$("$K" --kubeconfig "$C" -n platform-databases get "secret/${SECRET}" -o "go-template={{ '{{' }} index .data \"password\" {{ '}}' }}" 2>/dev/null | base64 -d || true)"
            if [ -n "${existing_password}" ] && [ "${ROTATE}" != "true" ]; then
              db_password="${existing_password}"
              secret_state="reconciled"
            else
              db_password="$(random_b64)"
            fi
          fi
          datasource="$(python3 - "${db_user}" "${db_password}" "${db_host}" "${db_name}" "${db_sslmode}" <<'PY'
        import sys
        from urllib.parse import quote

        user, password, host, database, sslmode = sys.argv[1:6]
        print(
            "postgres://"
            f"{quote(user, safe='')}:{quote(password, safe='')}"
            f"@{host}/{quote(database, safe='')}"
            f"?sslmode={quote(sslmode, safe='')}"
        )
        PY
        )"
        fi

        if [ -z "${datasource}" ]; then
          echo "woodpecker_database_secret=${SECRET} state=missing reason=set-WOODPECKER_DATABASE_DATASOURCE-or-WOODPECKER_DATABASE_HOST-and-WOODPECKER_DATABASE_PASSWORD"
          exit 0
        fi

        "$K" --kubeconfig "$C" -n woodpecker create secret generic "${SECRET}" \
          --from-literal=WOODPECKER_DATABASE_DATASOURCE="${datasource}" \
          --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        if [ -n "${db_password}" ]; then
          "$K" --kubeconfig "$C" -n platform-databases create secret generic "${SECRET}" \
            --type=kubernetes.io/basic-auth \
            --from-literal=username="${db_user}" \
            --from-literal=password="${db_password}" \
            --dry-run=client -o yaml | \
            "$K" --kubeconfig "$C" label --local -f - cnpg.io/reload=true -o yaml | \
            "$K" --kubeconfig "$C" apply -f -
        fi

        echo "woodpecker_database_secret=${SECRET} state=${secret_state}"
      args:
        executable: /bin/bash
      environment:
        WOODPECKER_DATABASE_DATASOURCE: "{{ lookup('ansible.builtin.env', 'WOODPECKER_DATABASE_DATASOURCE') }}"
        WOODPECKER_DATABASE_HOST: "{{ lookup('ansible.builtin.env', 'WOODPECKER_DATABASE_HOST') }}"
        WOODPECKER_DATABASE_NAME: "{{ lookup('ansible.builtin.env', 'WOODPECKER_DATABASE_NAME') }}"
        WOODPECKER_DATABASE_USER: "{{ lookup('ansible.builtin.env', 'WOODPECKER_DATABASE_USER') }}"
        WOODPECKER_DATABASE_PASSWORD: "{{ lookup('ansible.builtin.env', 'WOODPECKER_DATABASE_PASSWORD') }}"
        WOODPECKER_DATABASE_SSLMODE: "{{ lookup('ansible.builtin.env', 'WOODPECKER_DATABASE_SSLMODE') }}"
      register: platform_woodpecker_database_secret_result
      changed_when: >-
        'state=generated' in platform_woodpecker_database_secret_result.stdout or
        'state=reconciled' in platform_woodpecker_database_secret_result.stdout
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      no_log: true

    - name: Check Woodpecker database datasource secret state
      ansible.builtin.shell: |
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        if "$K" --kubeconfig "$C" -n woodpecker get "secret/{{ platform_woodpecker_database_secret_name }}" >/dev/null 2>&1; then
          echo present
        else
          echo missing
        fi
      args:
        executable: /bin/bash
      register: platform_woodpecker_database_secret_state
      changed_when: false
      failed_when: false
