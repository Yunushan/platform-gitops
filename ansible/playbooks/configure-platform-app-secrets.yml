---
- name: Configure generated private secrets for platform applications
  hosts: rke2_servers
  become: true
  gather_facts: false
  vars:
    rke2_first_server: "{{ groups['rke2_servers'][0] }}"
    platform_domain_from_env: "{{ lookup('ansible.builtin.env', 'PLATFORM_DOMAIN') }}"
    rke2_api_dns_from_env: "{{ lookup('ansible.builtin.env', 'RKE2_API_DNS') }}"
    rke2_api_dns_effective: "{{ rke2_api_dns | default(rke2_api_dns_from_env, true) | default('', true) }}"
    platform_domain_effective: "{{ platform_domain | default(platform_domain_from_env, true) | default(rke2_platform_domain | default((rke2_api_dns_effective | regex_replace('^api[.]', '')), true), true) }}"
    platform_harbor_admin_secret_name: "{{ lookup('ansible.builtin.env', 'HARBOR_ADMIN_SECRET_NAME') | default('harbor-admin', true) }}"
    platform_harbor_secret_key_secret_name: "{{ lookup('ansible.builtin.env', 'HARBOR_SECRET_KEY_SECRET_NAME') | default('harbor-secret-key', true) }}"
    platform_harbor_database_secret_name: "{{ lookup('ansible.builtin.env', 'HARBOR_DATABASE_SECRET_NAME') | default('harbor-database', true) }}"
    platform_harbor_redis_secret_name: "{{ lookup('ansible.builtin.env', 'HARBOR_REDIS_SECRET_NAME') | default('harbor-redis', true) }}"
    platform_harbor_redis_url_secret_name: "{{ lookup('ansible.builtin.env', 'HARBOR_REDIS_URL_SECRET_NAME') | default('harbor-redis-url', true) }}"
    platform_harbor_s3_secret_name: "{{ lookup('ansible.builtin.env', 'HARBOR_S3_SECRET_NAME') | default('harbor-registry-s3', true) }}"
    platform_valkey_auth_secret_name: "{{ lookup('ansible.builtin.env', 'PLATFORM_VALKEY_AUTH_SECRET_NAME') | default('platform-valkey-auth', true) }}"
    platform_valkey_password_key: "{{ lookup('ansible.builtin.env', 'PLATFORM_VALKEY_PASSWORD_KEY') | default('valkey-password', true) }}"
    platform_valkey_primary_host: "{{ lookup('ansible.builtin.env', 'PLATFORM_VALKEY_PRIMARY_HOST') | default('platform-valkey-primary.platform-cache.svc.cluster.local', true) }}"
    platform_valkey_port: "{{ lookup('ansible.builtin.env', 'PLATFORM_VALKEY_PORT') | default('6379', true) }}"
    platform_woodpecker_oauth_secret_name: "{{ lookup('ansible.builtin.env', 'WOODPECKER_FORGEJO_OAUTH_SECRET_NAME') | default('woodpecker-forgejo-oauth', true) }}"
    platform_woodpecker_oauth_app_name: "{{ lookup('ansible.builtin.env', 'WOODPECKER_FORGEJO_OAUTH_APP_NAME') | default('Woodpecker', true) }}"
    platform_woodpecker_agent_secret_name: "{{ lookup('ansible.builtin.env', 'WOODPECKER_AGENT_SECRET_NAME') | default('woodpecker-agent-secret', true) }}"
    platform_woodpecker_database_secret_name: "{{ lookup('ansible.builtin.env', 'WOODPECKER_DATABASE_SECRET_NAME') | default('woodpecker-database', true) }}"
    platform_keycloak_admin_secret_name: "{{ lookup('ansible.builtin.env', 'KEYCLOAK_ADMIN_SECRET_NAME') | default('keycloak-admin', true) }}"
    platform_keycloak_database_secret_name: "{{ lookup('ansible.builtin.env', 'KEYCLOAK_DATABASE_SECRET_NAME') | default('keycloak-database', true) }}"
    platform_forgejo_database_secret_name: "{{ lookup('ansible.builtin.env', 'FORGEJO_DATABASE_SECRET_NAME') | default('forgejo-database', true) }}"
    platform_forgejo_redis_secret_name: "{{ lookup('ansible.builtin.env', 'FORGEJO_REDIS_SECRET_NAME') | default('forgejo-redis', true) }}"
    platform_grafana_admin_secret_name: "{{ lookup('ansible.builtin.env', 'GRAFANA_ADMIN_SECRET_NAME') | default('grafana-admin', true) }}"
    platform_grafana_database_secret_name: "{{ lookup('ansible.builtin.env', 'GRAFANA_DATABASE_SECRET_NAME') | default('grafana-database', true) }}"
    platform_loki_object_storage_secret_name: "{{ lookup('ansible.builtin.env', 'LOKI_OBJECT_STORAGE_SECRET_NAME') | default('loki-object-storage', true) }}"
    platform_velero_credentials_secret_name: "{{ lookup('ansible.builtin.env', 'VELERO_CREDENTIALS_SECRET_NAME') | default('velero-credentials', true) }}"
    platform_cnpg_object_store_secret_name: "{{ lookup('ansible.builtin.env', 'CNPG_OBJECT_STORE_SECRET_NAME') | default('cnpg-object-store', true) }}"
    platform_minio_root_secret_name: "{{ lookup('ansible.builtin.env', 'MINIO_ROOT_SECRET_NAME') | default('minio-root', true) }}"
    platform_forgejo_admin_password_repair: "{{ lookup('ansible.builtin.env', 'PLATFORM_FORGEJO_ADMIN_PASSWORD_REPAIR') | default(true, true) | bool }}"
    platform_app_secret_rotate: "{{ lookup('ansible.builtin.env', 'PLATFORM_APP_SECRET_ROTATE') | default(false, true) | bool }}"
    platform_app_secret_require_object_storage: "{{ lookup('ansible.builtin.env', 'PLATFORM_APP_SECRET_REQUIRE_OBJECT_STORAGE') | default(false, true) | bool }}"
    platform_app_secret_require_cnpg_object_storage: "{{ lookup('ansible.builtin.env', 'PLATFORM_APP_SECRET_REQUIRE_CNPG_OBJECT_STORAGE') | default(false, true) | bool }}"
    platform_app_secret_require_woodpecker_database: "{{ lookup('ansible.builtin.env', 'PLATFORM_APP_SECRET_REQUIRE_WOODPECKER_DATABASE') | default(false, true) | bool }}"
    platform_app_secret_require_keycloak_database: "{{ lookup('ansible.builtin.env', 'PLATFORM_APP_SECRET_REQUIRE_KEYCLOAK_DATABASE') | default(false, true) | bool }}"
    platform_app_secret_require_harbor_database: "{{ lookup('ansible.builtin.env', 'PLATFORM_APP_SECRET_REQUIRE_HARBOR_DATABASE') | default(false, true) | bool }}"
    platform_app_secret_require_harbor_redis: "{{ lookup('ansible.builtin.env', 'PLATFORM_APP_SECRET_REQUIRE_HARBOR_REDIS') | default(false, true) | bool }}"
    platform_app_secret_require_harbor_registry_storage: "{{ lookup('ansible.builtin.env', 'PLATFORM_APP_SECRET_REQUIRE_HARBOR_REGISTRY_STORAGE') | default(false, true) | bool }}"
    platform_app_secret_require_forgejo_database: "{{ lookup('ansible.builtin.env', 'PLATFORM_APP_SECRET_REQUIRE_FORGEJO_DATABASE') | default(false, true) | bool }}"
    platform_app_secret_require_forgejo_redis: "{{ lookup('ansible.builtin.env', 'PLATFORM_APP_SECRET_REQUIRE_FORGEJO_REDIS') | default(false, true) | bool }}"
    platform_app_secret_require_grafana_database: "{{ lookup('ansible.builtin.env', 'PLATFORM_APP_SECRET_REQUIRE_GRAFANA_DATABASE') | default(false, true) | bool }}"
  vars_files:
    - ../vars/platform-hostnames.yml
  tasks:
    - name: Generate or preserve shared platform Valkey auth secret
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        SECRET="{{ platform_valkey_auth_secret_name }}"
        PASSWORD_KEY="{{ platform_valkey_password_key }}"
        ROTATE="{{ 'true' if platform_app_secret_rotate else 'false' }}"

        "$K" --kubeconfig "$C" create namespace platform-cache --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        if [ "${ROTATE}" != "true" ] && "$K" --kubeconfig "$C" -n platform-cache get "secret/${SECRET}" \
          -o "go-template={{ '{{' }} index .data \"{{ platform_valkey_password_key }}\" {{ '}}' }}" 2>/dev/null | grep -q .; then
          echo "platform_valkey_auth_secret=${SECRET} state=present"
          exit 0
        fi

        random_b64() {
          if command -v openssl >/dev/null 2>&1; then
            openssl rand -base64 30
          else
            python3 - <<'PY'
        import secrets
        print(secrets.token_urlsafe(32))
        PY
          fi
        }

        password="${PLATFORM_VALKEY_PASSWORD:-}"
        auto_generate="${PLATFORM_VALKEY_AUTO_GENERATE:-true}"
        if [ -z "${password}" ]; then
          if [ "${auto_generate}" = "true" ]; then
            password="$(random_b64)"
          else
            echo "platform_valkey_auth_secret=${SECRET} state=missing reason=set-PLATFORM_VALKEY_PASSWORD"
            exit 0
          fi
        fi

        "$K" --kubeconfig "$C" -n platform-cache create secret generic "${SECRET}" \
          --from-literal="${PASSWORD_KEY}=${password}" \
          --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        echo "platform_valkey_auth_secret=${SECRET} state=generated"
      args:
        executable: /bin/bash
      environment:
        PLATFORM_VALKEY_PASSWORD: "{{ lookup('ansible.builtin.env', 'PLATFORM_VALKEY_PASSWORD') }}"
        PLATFORM_VALKEY_AUTO_GENERATE: "{{ lookup('ansible.builtin.env', 'PLATFORM_VALKEY_AUTO_GENERATE') }}"
      register: platform_valkey_auth_secret_result
      changed_when: "'state=generated' in platform_valkey_auth_secret_result.stdout"
      no_log: true
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Generate or preserve MinIO root credentials secret
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        SECRET="{{ platform_minio_root_secret_name }}"
        ROTATE="{{ 'true' if platform_app_secret_rotate else 'false' }}"

        "$K" --kubeconfig "$C" create namespace object-storage --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        if [ "${ROTATE}" != "true" ] && "$K" --kubeconfig "$C" -n object-storage get "secret/${SECRET}" \
          -o 'go-template={{ "{{" }} index .data "root-user" {{ "}}" }}{{ "{{" }} index .data "root-password" {{ "}}" }}' 2>/dev/null | grep -q .; then
          echo "minio_root_secret=${SECRET} state=present"
          exit 0
        fi

        random_b64() {
          if command -v openssl >/dev/null 2>&1; then
            openssl rand -base64 30
          else
            python3 - <<'PY'
        import secrets
        print(secrets.token_urlsafe(32))
        PY
          fi
        }

        root_user="${MINIO_ROOT_USER:-platform-admin}"
        root_password="${MINIO_ROOT_PASSWORD:-}"
        auto_generate="${MINIO_ROOT_AUTO_GENERATE:-true}"
        if [ -z "${root_password}" ]; then
          if [ "${auto_generate}" = "true" ]; then
            root_password="$(random_b64)"
          else
            echo "minio_root_secret=${SECRET} state=missing reason=set-MINIO_ROOT_PASSWORD"
            exit 0
          fi
        fi

        "$K" --kubeconfig "$C" -n object-storage create secret generic "${SECRET}" \
          --from-literal=root-user="${root_user}" \
          --from-literal=root-password="${root_password}" \
          --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        echo "minio_root_secret=${SECRET} state=generated"
      args:
        executable: /bin/bash
      environment:
        MINIO_ROOT_USER: "{{ lookup('ansible.builtin.env', 'MINIO_ROOT_USER') }}"
        MINIO_ROOT_PASSWORD: "{{ lookup('ansible.builtin.env', 'MINIO_ROOT_PASSWORD') }}"
        MINIO_ROOT_AUTO_GENERATE: "{{ lookup('ansible.builtin.env', 'MINIO_ROOT_AUTO_GENERATE') }}"
      register: platform_minio_root_secret_result
      changed_when: "'state=generated' in platform_minio_root_secret_result.stdout"
      no_log: true
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Generate or preserve Harbor bootstrap secrets
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        ADMIN_SECRET="{{ platform_harbor_admin_secret_name }}"
        SECRET_KEY_SECRET="{{ platform_harbor_secret_key_secret_name }}"
        ROTATE="{{ 'true' if platform_app_secret_rotate else 'false' }}"

        random_b64() {
          if command -v openssl >/dev/null 2>&1; then
            openssl rand -base64 30
          else
            python3 - <<'PY'
        import secrets
        print(secrets.token_urlsafe(32))
        PY
          fi
        }

        random_hex() {
          if command -v openssl >/dev/null 2>&1; then
            openssl rand -hex 16
          else
            python3 - <<'PY'
        import secrets
        print(secrets.token_hex(16))
        PY
          fi
        }

        "$K" --kubeconfig "$C" create namespace harbor --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        if [ "${ROTATE}" = "true" ] || ! "$K" --kubeconfig "$C" -n harbor get "secret/${ADMIN_SECRET}" >/dev/null 2>&1; then
          password="$(random_b64)"
          "$K" --kubeconfig "$C" -n harbor create secret generic "${ADMIN_SECRET}" \
            --from-literal=HARBOR_ADMIN_PASSWORD="${password}" \
            --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -
          admin_state=generated
        else
          admin_state=present
        fi

        if [ "${ROTATE}" = "true" ] || ! "$K" --kubeconfig "$C" -n harbor get "secret/${SECRET_KEY_SECRET}" >/dev/null 2>&1; then
          secret_key="$(random_hex)"
          "$K" --kubeconfig "$C" -n harbor create secret generic "${SECRET_KEY_SECRET}" \
            --from-literal=secretKey="${secret_key}" \
            --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -
          key_state=generated
        else
          key_state=present
        fi

        echo "harbor_admin_secret=${ADMIN_SECRET} state=${admin_state}"
        echo "harbor_secret_key_secret=${SECRET_KEY_SECRET} state=${key_state}"
      args:
        executable: /bin/bash
      register: platform_harbor_secret_result
      changed_when: "'generated' in platform_harbor_secret_result.stdout"
      no_log: true
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Generate or preserve Harbor external database password secret
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        SECRET="{{ platform_harbor_database_secret_name }}"
        ROTATE="{{ 'true' if platform_app_secret_rotate else 'false' }}"

        "$K" --kubeconfig "$C" create namespace harbor --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        if [ "${ROTATE}" != "true" ] && "$K" --kubeconfig "$C" -n harbor get "secret/${SECRET}" >/dev/null 2>&1; then
          echo "harbor_database_secret=${SECRET} state=present"
          exit 0
        fi

        password="${HARBOR_DATABASE_PASSWORD:-}"
        if [ -z "${password}" ]; then
          echo "harbor_database_secret=${SECRET} state=missing reason=set-HARBOR_DATABASE_PASSWORD"
          exit 0
        fi

        "$K" --kubeconfig "$C" -n harbor create secret generic "${SECRET}" \
          --from-literal=password="${password}" \
          --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        echo "harbor_database_secret=${SECRET} state=generated"
      args:
        executable: /bin/bash
      environment:
        HARBOR_DATABASE_PASSWORD: "{{ lookup('ansible.builtin.env', 'HARBOR_DATABASE_PASSWORD') }}"
      register: platform_harbor_database_secret_result
      changed_when: "'state=generated' in platform_harbor_database_secret_result.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      no_log: true

    - name: Check Harbor external database password secret state
      ansible.builtin.shell: |
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        if "$K" --kubeconfig "$C" -n harbor get "secret/{{ platform_harbor_database_secret_name }}" >/dev/null 2>&1; then
          echo present
        else
          echo missing
        fi
      args:
        executable: /bin/bash
      register: platform_harbor_database_secret_state
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Generate or preserve Harbor external Redis credentials secret
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        SECRET="{{ platform_harbor_redis_secret_name }}"
        ROTATE="{{ 'true' if platform_app_secret_rotate else 'false' }}"

        "$K" --kubeconfig "$C" create namespace harbor --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        if [ "${ROTATE}" != "true" ] && "$K" --kubeconfig "$C" -n harbor get "secret/${SECRET}" >/dev/null 2>&1; then
          echo "harbor_redis_secret=${SECRET} state=present"
          exit 0
        fi

        password="${HARBOR_REDIS_PASSWORD:-}"
        username="${HARBOR_REDIS_USERNAME:-}"
        if [ -z "${username}" ] && [ -z "${HARBOR_REDIS_ADDR:-}" ] && [ -z "${HARBOR_REDIS_HOST:-}" ]; then
          username="default"
        fi
        if [ -z "${password}" ]; then
          password="$("$K" --kubeconfig "$C" -n platform-cache get "secret/{{ platform_valkey_auth_secret_name }}" \
            -o "go-template={{ '{{' }} index .data \"{{ platform_valkey_password_key }}\" {{ '}}' }}" 2>/dev/null | base64 -d || true)"
        fi
        if [ -z "${password}" ]; then
          echo "harbor_redis_secret=${SECRET} state=missing reason=set-HARBOR_REDIS_PASSWORD-or-platform-valkey-auth"
          exit 0
        fi

        args=(--from-literal=REDIS_PASSWORD="${password}")
        if [ -n "${username}" ]; then
          args+=(--from-literal=REDIS_USERNAME="${username}")
        fi

        "$K" --kubeconfig "$C" -n harbor create secret generic "${SECRET}" \
          "${args[@]}" \
          --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        echo "harbor_redis_secret=${SECRET} state=generated"
      args:
        executable: /bin/bash
      environment:
        HARBOR_REDIS_PASSWORD: "{{ lookup('ansible.builtin.env', 'HARBOR_REDIS_PASSWORD') }}"
        HARBOR_REDIS_USERNAME: "{{ lookup('ansible.builtin.env', 'HARBOR_REDIS_USERNAME') }}"
        HARBOR_REDIS_ADDR: "{{ lookup('ansible.builtin.env', 'HARBOR_REDIS_ADDR') }}"
        HARBOR_REDIS_HOST: "{{ lookup('ansible.builtin.env', 'HARBOR_REDIS_HOST') }}"
      register: platform_harbor_redis_secret_result
      changed_when: "'state=generated' in platform_harbor_redis_secret_result.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      no_log: true

    - name: Check Harbor external Redis credentials secret state
      ansible.builtin.shell: |
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        if "$K" --kubeconfig "$C" -n harbor get "secret/{{ platform_harbor_redis_secret_name }}" >/dev/null 2>&1; then
          echo present
        else
          echo missing
        fi
      args:
        executable: /bin/bash
      register: platform_harbor_redis_secret_state
      changed_when: false
      failed_when: false
      delegate_to: "{{ rke2_first_server }}"
      run_once: true

    - name: Generate or preserve Harbor registry S3 credentials secret
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        SECRET="{{ platform_harbor_s3_secret_name }}"
        ROTATE="{{ 'true' if platform_app_secret_rotate else 'false' }}"

        "$K" --kubeconfig "$C" create namespace harbor --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        if [ "${ROTATE}" != "true" ] && "$K" --kubeconfig "$C" -n harbor get "secret/${SECRET}" >/dev/null 2>&1; then
          echo "harbor_s3_secret=${SECRET} state=present"
          exit 0
        fi

        access_key="${HARBOR_S3_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID:-}}"
        secret_key="${HARBOR_S3_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY:-}}"

        if [ -z "${access_key}" ] || [ -z "${secret_key}" ]; then
          echo "harbor_s3_secret=${SECRET} state=missing reason=set-HARBOR_S3_ACCESS_KEY_ID-and-HARBOR_S3_SECRET_ACCESS_KEY"
          exit 0
        fi

        "$K" --kubeconfig "$C" -n harbor create secret generic "${SECRET}" \
          --from-literal=REGISTRY_STORAGE_S3_ACCESSKEY="${access_key}" \
          --from-literal=REGISTRY_STORAGE_S3_SECRETKEY="${secret_key}" \
          --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -

        echo "harbor_s3_secret=${SECRET} state=generated"
      args:
        executable: /bin/bash
      environment:
        HARBOR_S3_ACCESS_KEY_ID: "{{ lookup('ansible.builtin.env', 'HARBOR_S3_ACCESS_KEY_ID') }}"
        HARBOR_S3_SECRET_ACCESS_KEY: "{{ lookup('ansible.builtin.env', 'HARBOR_S3_SECRET_ACCESS_KEY') }}"
        AWS_ACCESS_KEY_ID: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
        AWS_SECRET_ACCESS_KEY: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"
      register: platform_harbor_s3_secret_result
      changed_when: "'state=generated' in platform_harbor_s3_secret_result.stdout"
      delegate_to: "{{ rke2_first_server }}"
      run_once: true
      no_log: true

    - name: Generate Harbor core Redis URL override secret
      ansible.builtin.shell: |
        set -euo pipefail
        K=/var/lib/rancher/rke2/bin/kubectl
        C=/etc/rancher/rke2/rke2.yaml
        SECRET="{{ platform_harbor_redis_url_secret_name }}"

        password="${HARBOR_REDIS_PASSWORD:-}"
        username="${HARBOR_REDIS_USERNAME:-}"
        if [ -z "${username}" ] && [ -z "${HARBOR_REDIS_ADDR:-}" ] && [ -z "${HARBOR_REDIS_HOST:-}" ]; then
          username="default"
        fi
        if [ -z "${password}" ]; then
          password="$("$K" --kubeconfig "$C" -n platform-cache get "secret/{{ platform_valkey_auth_secret_name }}" \
            -o "go-template={{ '{{' }} index .data \"{{ platform_valkey_password_key }}\" {{ '}}' }}" 2>/dev/null | base64 -d || true)"
        fi
        test -n "${password}"

        redis_url="$(python3 - "${username}" "${password}" "{{ platform_valkey_primary_host }}" "{{ platform_valkey_port }}" <<'PY'
        import sys
        from urllib.parse import quote

        username, password, host, port = sys.argv[1:]
        auth = f"{quote(username, safe='')}:{quote(password, safe='')}@" if username else f":{quote(password, safe='')}@"
        print(f"redis://{auth}{host}:{port}/0?idle_timeout_seconds=30")
        PY
        )"

        "$K" --kubeconfig "$C" -n harbor create secret generic "${SECRET}" \
          --from-literal=REDIS_URL_CORE="${redis_url}" \
          --dry-run=client -o yaml | "$K" --kubeconfig "$C" apply -f -
        echo "harbor_redis_url_secret=${SECRET} state=generated"
      args:
        executable: /bin/bash
      environment:
        HARBOR_REDIS_PASSWORD: "{{ lookup('ansible.builtin.env', 'HARBOR_REDIS_PASSWORD') }}"
        HARBOR_REDIS_USERNAME: "{{ lookup('ansible.builtin.env', 'HARBOR_REDIS_USERNAME') }}"
        HARBOR_REDIS_ADDR: "{{ lookup('ansible.builtin.env', 'HARBOR_REDIS_ADDR') }}"
        HARBOR_REDIS_HOST: "{{ lookup('ansible.builtin.env', 'HARBOR_REDIS_HOST') }}"
