# Copy to inventory/hosts.local.ini and edit the copy only.
# Do not commit real IP addresses or hostnames.

[rke2_servers]
node-1 ansible_host=<NODE_1_IP> ansible_user=<SSH_USER>
node-2 ansible_host=<NODE_2_IP> ansible_user=<SSH_USER>
node-3 ansible_host=<NODE_3_IP> ansible_user=<SSH_USER>

[rke2_servers:vars]
rke2_api_vip=<VIP_ADDRESS>
rke2_api_dns=<VIP_DNS_NAME>
rke2_ingress_vip=<INGRESS_VIP_ADDRESS>
rke2_platform_domain=<PLATFORM_DOMAIN>
# Optional. If omitted or left as a placeholder, ansible/playbooks/install-rke2.yml
# generates and reuses a private controller-side token at ~/.config/platform-gitops/rke2-token.
rke2_token=<GENERATE_WITH_PASSWORD_MANAGER>

# Optional pin. Example format: v1.35.4+rke2r1
# rke2_version=<RKE2_VERSION>
rke2_channel=stable
rke2_cni=cilium

# Optional timeouts in seconds.
# rke2_install_timeout=1200
# rke2_install_poll_interval=15
# rke2_start_timeout=300
# rke2_start_poll_interval=10
# rke2_api_ready_timeout=300
# rke2_node_ready_timeout=600
# rke2_verify_timeout=120
