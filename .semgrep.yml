rules:
  - id: shell-curl-pipe-shell
    languages:
      - generic
    severity: ERROR
    message: Avoid piping network downloads directly to a shell; download, verify, then execute explicitly.
    pattern-regex: '\b(curl|wget)\b[^\n|]*\|\s*(sh|bash)\b'
    metadata:
      category: security
      confidence: medium

  - id: kubernetes-latest-image-tag
    languages:
      - generic
    severity: WARNING
    message: Avoid mutable latest image tags in Kubernetes manifests; pin a version or digest.
    pattern-regex: '(?m)^[ \t]*image:[ \t]*[''"]?[^''"\s]+:latest[''"]?[ \t]*(?:#.*)?$'
    paths:
      include:
        - "**/*.yaml"
        - "**/*.yml"
    metadata:
      category: supply-chain
      confidence: medium

  - id: kubernetes-privileged-container
    languages:
      - generic
    severity: WARNING
    message: Privileged containers require an explicit security review and a documented exception.
    pattern-regex: '(?m)^[ \t]*privileged:[ \t]*true[ \t]*(?:#.*)?$'
    paths:
      include:
        - "**/*.yaml"
        - "**/*.yml"
      exclude:
        # Longhorn requires host storage access. Keep these reviewed exceptions
        # bound to the exact vendored chart version so upgrades force re-review.
        - "/gitops/clusters/rke2-main/premium-3node/apps/longhorn/charts/longhorn-1.12.0/longhorn/templates/daemonset-sa.yaml"
        - "/gitops/clusters/rke2-main/premium-3node/apps/longhorn/charts/longhorn-1.12.0/longhorn/templates/preupgrade-job.yaml"
        - "/gitops/clusters/rke2-main/premium-3node/apps/longhorn/charts/longhorn-1.12.0/longhorn/templates/psp.yaml"
        # Tetragon requires privileged eBPF and host-observation access. Bind
        # the exception to the exact reviewed upstream chart version.
        - "/gitops/clusters/rke2-main/premium-3node/apps/tetragon/charts/tetragon-1.6.0/tetragon/values.yaml"
    metadata:
      category: policy
      confidence: medium
