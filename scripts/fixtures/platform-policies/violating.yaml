apiVersion: v1
kind: Secret
metadata:
  name: violating-secret
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: violating-workload
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: violating-workload
  template:
    metadata:
      labels:
        app: violating-workload
    spec:
      containers:
        - name: app
          image: registry.example.test/app@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
---
apiVersion: v1
kind: Pod
metadata:
  name: violating-pod
  namespace: default
spec:
  containers:
    - name: app
      image: registry.example.test/app@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
