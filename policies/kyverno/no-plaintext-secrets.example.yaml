apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: block-plaintext-secret-placeholders
spec:
  validationFailureAction: Audit
  rules:
    - name: block-placeholder-secrets
      match:
        any:
          - resources:
              kinds:
                - Secret
      validate:
        message: "Do not commit or deploy placeholder/plaintext secrets from tracked manifests."
        pattern:
          data: "?*"
