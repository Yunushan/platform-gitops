apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-private-secret-workflow
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-secret-source-annotation
      match:
        any:
          - resources:
              kinds:
                - Secret
      validate:
        message: "Secrets should declare whether they came from SOPS, External Secrets, Sealed Secrets, or an approved manual bootstrap."
        deny:
          conditions:
            all:
              - key: "{{ request.object.metadata.annotations.\"platform.gitops/secret-source\" || '' }}"
                operator: NotIn
                value:
                  - sops
                  - external-secrets
                  - sealed-secrets
                  - vault
                  - openbao
                  - manual-bootstrap
